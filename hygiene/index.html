는 질병은?","o":["큐열","참호열","일본뇌염","발진티푸스","쯔쯔가무시증"],"a":3,"e":"일본뇌염은 작은빨간집모기가 돼지 등 증폭숙주의 바이러스를 사람에게 매개하는 질병이다. 발진티푸스와 참호열은 이, 쯔쯔가무시증은 털진드기가 매개하며, 큐열은 주로 감염 동물 분비물의 흡입으로 감염된다."},{"id":"45-1-94","r":45,"p":1,"n":94,"s":"위생곤충학","q":"중흉배판(mesothorax)에 4개의 검은 종선(縱線)이 있는 파리는?","o":["집파리","검정파리","풀쉬파리","구리금파리","베지아띠금파리"],"a":1,"e":"집파리는 회색 몸에 중흉배판(가슴 등쪽)에 4개의 검은 세로줄이 있는 것이 특징이다. 쉬파리는 3개의 흑색 종선과 복부 바둑판 무늬, 금파리와 검정파리는 금속성 광택을 띤다."},{"id":"45-1-95","r":45,"p":1,"n":95,"s":"위생곤충학","q":"파리목 장각아목에 속하는 곤충류는?","o":["쉬파리과","집파리과","검정파리과","나방파리과","체체파리과"],"a":4,"e":"장각아목은 촉각이 길고 마디가 많은 파리목 무리로 모기과, 나방파리과, 먹파리과, 깔따구과, 등에모기과 등이 속한다. 쉬파리과, 집파리과, 검정파리과, 체체파리과는 촉각이 짧은 환봉아목에 속한다."},{"id":"45-1-96","r":45,"p":1,"n":96,"s":"위생곤충학","q":"파리 성충의 구기(mouth part)에 속하는 것은?","o":["기문(spiracle)","단안(ocellus)","복안(compound eye)","상순(labrum)","촉각(antenna)"],"a":4,"e":"곤충의 구기(입틀)는 상순, 대악, 소악, 하순, 하인두로 구성되며 상순은 윗입술에 해당한다. 복안, 단안, 촉각은 머리에 있는 감각기관이고, 기문은 가슴·배 옆면에 있는 호흡기관의 개구부이다."},{"id":"45-1-97","r":45,"p":1,"n":97,"s":"위생곤충학","q":"먹파리(Simulium spp.)가 매개하는 질병은?","o":["수면병","발진티푸스","로키산홍반열","회선사상충증","3일열말라리아"],"a":4,"e":"먹파리는 흐르는 물에서 발생하며 회선사상충(Onchocerca volvulus)을 매개해 피부 결절과 실명(강변실명증)을 일으키는 회선사상충증을 전파한다. 수면병은 체체파리, 발진티푸스는 몸이, 삼일열말라리아는 얼룩날개모기가 매개한다."},{"id":"45-1-98","r":45,"p":1,"n":98,"s":"위생곤충학","q":"몸이(Pediculus humanus) 에 대한 설명으로 옳은 것은?","o":["완전변태를 한다.","약충만 흡혈한다.","알은 황백색이고 타원형이다.","약충 기간이 13~17일이 걸린다.","일생 동안 30개 이하의 알을 낳는다."],"a":3,"e":"몸이의 알은 황백색 타원형으로 주로 속옷 솔기 등 섬유에 단단히 붙여 낳는다. 이는 불완전변태를 하며 약충과 성충이 모두 흡혈하고, 일생 동안 300개 정도의 알을 낳아 30개 이하라는 설명은 틀리다. ※ 교재 확인 권장"},{"id":"45-1-99","r":45,"p":1,"n":99,"s":"위생곤충학","q":"흡혈노린재에 관한 설명으로 옳은 것은?","o":["성충만 흡혈한다.","암컷만 흡혈한다.","주간에만 흡혈한다.","흡혈 시 병원체가 배설물과 함께 배출된다.","구기를 고정한 채 수일간 간헐적으로 흡혈한다."],"a":4,"e":"흡혈노린재(트리아토마)는 흡혈하는 동안 또는 직후 배설을 하며, 배설물 속의 크루스파동편모충이 물린 상처나 점막으로 들어가 샤가스병을 일으킨다. 약충·성충 및 암수 모두 흡혈하고 주로 야간에 흡혈하며, 구기를 고정한 채 수일간 흡혈하는 것은 참진드기의 특징이다."},{"id":"45-1-100","r":45,"p":1,"n":100,"s":"위생곤충학","q":"벼룩의 습성에 대한 설명으로 옳은 것은?","o":["불완전변태로 발육한다.","벼룩의 숙주 선택성은 엄격하다.","성충 암수 모두 기생성으로 포유류를 흡혈한다.","성충 벼룩의 수명은 15℃ 이하의 저온에서 1년이다.","유충은 직장에서 수분을 완전히 재흡수하므로 건조에 강하다."],"a":3,"e":"벼룩은 성충만 기생 생활을 하며 암컷과 수컷이 모두 포유류(또는 조류)를 흡혈한다. 벼룩은 알-유충-번데기-성충의 완전변태를 하고, 숙주 선택성이 엄격하지 않아 쥐에서 사람으로 옮겨 다니며 페스트 등을 전파한다. ※ 교재 확인 권장"},{"id":"45-1-101","r":45,"p":1,"n":101,"s":"위생곤충학","q":"독나방에 대한 설명으로 옳은 것은?","o":["성충은 연중 발생한다.","성충은 맨손으로 잡아 죽인다.","구기가 퇴화되고 촉각은 곤봉상이다.","국내에서 문제 되는 종은 노랑쐐기나방과 솔나방이다.","유충 시기에 발생한 독모는 인체에 피부염을 일으킨다."],"a":5,"e":"독나방의 독모는 유충(송충이) 시기에 형성되어 고치와 성충 몸에 묻어 있다가 사람 피부에 닿으면 심한 피부염을 일으킨다. 성충은 연 1회(여름철) 발생하고, 맨손으로 잡으면 독모가 피부에 박히므로 피해야 하며, 곤봉상 촉각은 나비류의 특징이다."},{"id":"45-1-102","r":45,"p":1,"n":102,"s":"위생곤충학","q":"벌 종류에 따른 독성 작용의 강도가 옳게 나열된 것은?","o":["꿀벌 < 말벌 < 호박벌","꿀벌 < 호박벌 < 말벌","말벌 < 꿀벌 < 호박벌","호박벌 < 말벌 < 꿀벌","호박벌 < 꿀벌 < 말벌"],"a":2,"e":"벌 독의 작용 강도는 일반적으로 꿀벌 < 호박벌 < 말벌 순으로, 말벌이 독성이 가장 강하고 여러 번 쏠 수 있어 위험하다. 꿀벌은 침에 갈고리가 있어 한 번 쏘면 침이 빠지고 죽으며 독의 양도 상대적으로 적다."},{"id":"45-1-103","r":45,"p":1,"n":103,"s":"위생곤충학","q":"진드기의 생태에 대한 설명으로 옳은 것은?","o":["진드기는 불완전변태를 한다.","진드기 외피는 막질과 각질로 되어 있다.","진드기의 몸의 털은 길고 수가 많다.","좀진드기 크기는 대형(3 mm 이상)이다.","좀진드기에는 할러스기관(Haller’s organ)이 있다."],"a":1,"e":"진드기는 알 → 유충(다리 3쌍) → 약충(다리 4쌍) → 성충으로 번데기 시기 없이 발육하는 불완전변태를 한다. 좀진드기는 대부분 1 mm 이하의 소형이며, 첫째 다리 부절의 감각기관인 할러스기관은 참진드기 등 진드기류(ticks)의 특징이지 좀진드기의 것이 아니다."},{"id":"45-1-104","r":45,"p":1,"n":104,"s":"위생곤충학","q":"쯔쯔가무시를 매개하는 진드기는?","o":["옴진드기","털진드기","참진드기","물렁진드기","집먼지진드기"],"a":2,"e":"쯔쯔가무시증은 털진드기 유충이 들쥐 등에서 리케차(오리엔티아 쯔쯔가무시)를 얻어 사람을 흡혈할 때 전파된다. 참진드기는 SFTS·라임병, 옴진드기는 옴, 집먼지진드기는 알레르기 질환과 관련된다."},{"id":"45-1-105","r":45,"p":1,"n":105,"s":"위생곤충학","q":"쥐가 일으키는 질병 피해에 대한 설명으로 옳은 것은?","o":["신증후군출혈열은 곰쥐가 전파한다.","가주성 쥐 개체군 80% 이상이 전파하는 질병은 샤가스병이다.","리케차성 질병으로 생쥐가 주 병원소인 것은 렙토스피라증이다.","1976년 경기도 북부 등줄쥐에서 분리된 바이러스는 SFTS이다.","감염된 쥐의 피를 통해 옮겨지는 질병은 서교열 (rat bite fever)이다."],"a":5,"e":"서교열은 감염된 쥐에게 물려 쥐의 혈액·타액을 통해 Streptobacillus moniliformis 등 세균이 침입해 발생한다. 신증후군출혈열은 등줄쥐가 매개하며 1976년 등줄쥐에서 분리된 것은 SFTS가 아닌 한탄바이러스이고, 렙토스피라증은 리케차가 아닌 스피로헤타 세균이 원인이다. ※ 출제 당시 기준"},{"id":"45-2-1","r":45,"p":2,"n":1,"s":"공중보건학","q":"Leavell과 Clark이 주장한 2차 예방활동은?","o":["건강증진 활동","환경위생 개선","재활 및 사회복귀","건강영향요인 관리","조기발견과 조기치료"],"a":5,"e":"Leavell과 Clark의 2차 예방은 질병이 이미 발생한 초기 단계에서 조기발견·조기치료로 진행과 악화를 막는 활동이다. 건강증진 활동과 환경위생 개선은 질병 발생 전의 1차 예방에 해당한다. 재활 및 사회복귀는 장애를 최소화하는 3차 예방이다."},{"id":"45-2-2","r":45,"p":2,"n":2,"s":"공중보건학","q":"1차 보건의료(primary health care)를 채택한 것은?","o":["바젤협약","오타와 헌장","라론드 보고서","알마아타 선언","몬트리올 의정서"],"a":4,"e":"1978년 WHO와 UNICEF가 주최한 알마아타 회의에서 ‘2000년까지 모든 인류에게 건강을’을 목표로 1차 보건의료를 채택했다. 오타와 헌장(1986)은 건강증진 개념을 제시한 국제회의 헌장이다. 라론드 보고서(1974, 캐나다)는 생활습관 등 건강결정요인을 강조했고, 바젤협약은 유해폐기물 국가 간 이동을, 몬트리올 의정서는 오존층 파괴물질을 규제한다."},{"id":"45-2-3","r":45,"p":2,"n":3,"s":"공중보건학","q":"임신 초기에 감염될 경우 태아에게 선천성 기형을 유발할 수 있는 급성바이러스 감염병은?","o":["풍진","C형간염","브루셀라증","레지오넬라증","수막구균성수막염"],"a":1,"e":"풍진은 바이러스성 급성 감염병으로, 임신 초기 감염 시 태아에게 백내장·선천성 심장기형·난청 등 선천성 풍진증후군을 일으킨다. C형간염은 주로 혈액을 통해 전파되는 만성화 경향의 간염이다. 브루셀라증과 레지오넬라증은 세균성 질환이다."},{"id":"45-2-4","r":45,"p":2,"n":4,"s":"공중보건학","q":"질병의 발생 양상이 수십 년을 한 주기로 유행하는 경향은?","o":["단기변화","순환변화","주기변화","추세변화","불규칙 변화"],"a":4,"e":"추세변화(장기변화)는 수십 년을 주기로 나타나는 유행 경향으로, 장티푸스(약 30~40년)와 디프테리아(약 20년) 등이 예이다. 순환변화는 홍역·백일해처럼 2~4년 주기로 반복되는 단기적 주기 변화이다. 불규칙 변화는 외래 감염병 유입처럼 주기 없이 돌발적으로 나타난다."},{"id":"45-2-5","r":45,"p":2,"n":5,"s":"공중보건학","q":"질병의 원인과 관련이 있다고 생각되는 특성을 가진 인구집단과 그렇지 않은 인구집단을 추적조사하여 위험요인에의 노출과 질병 발생의 연관성을 규명하는 전향성 연구는?","o":["기술연구","단면연구","실험연구","코호트 연구","환자-대조군 연구"],"a":4,"e":"코호트 연구는 위험요인 노출군과 비노출군을 설정해 앞으로 추적하며 질병 발생을 비교하는 전향성 연구로, 상대위험도를 구할 수 있다. 환자-대조군 연구는 이미 질병이 있는 환자군과 대조군의 과거 노출을 비교하는 후향성 연구(교차비 산출)이다. 단면연구는 한 시점에서 노출과 질병을 동시에 조사한다."},{"id":"45-2-6","r":45,"p":2,"n":6,"s":"공중보건학","q":"심리적 작용으로 발생하는 편견을 제어하여 정확한 결과를 얻기 위한 실험전략은?","o":["위약투여법","이중맹검법","표본추출법","무작위할당법","시계열분석법"],"a":1,"e":"위약투여법은 효과 없는 위약을 대조군에 투여하여, 약을 먹었다는 심리적 작용(위약효과)으로 생기는 편견을 제어하는 방법이라는 것이 공식 정답의 근거이다. 이중맹검법도 대상자와 관찰자 모두 처치 여부를 모르게 해 심리적 편견을 줄이는 방법이라 혼동하기 쉬우나, 공식 정답은 위약투여법이다. 무작위할당법은 선택 편견을 줄이기 위해 대상자를 무작위로 배정하는 방법이다. ※ 출제 당시 기준"},{"id":"45-2-7","r":45,"p":2,"n":7,"s":"공중보건학","q":"감염병의 발생과 유행현상을 수리적으로 분석하여 유행법칙이나 현상을 수식화하는 연구방법은?","o":["기술역학","분석역학","임상역학","이론역학","작전역학"],"a":4,"e":"이론역학은 감염병의 발생과 유행을 수리적 모델로 분석하여 유행 법칙을 수식화하는 3단계 역학이다. 분석역학은 가설을 세우고 원인과 질병의 관련성을 검증하는 2단계 역학이다. 작전역학은 보건사업의 운영과 효과를 평가하는 역학이다."},{"id":"45-2-8","r":45,"p":2,"n":8,"s":"공중보건학","q":"순화독소를 사용하는 예방접종으로 얻는 면역은?","o":["선천면역","인공능동면역","인공수동면역","자연능동면역","자연수동면역"],"a":2,"e":"순화독소(toxoid)는 세균의 외독소를 무독화한 것으로, 이를 접종하면 인체가 스스로 항체를 만들어 인공능동면역을 얻는다(파상풍·디프테리아 예방접종 등). 인공수동면역은 면역글로불린이나 항독소처럼 이미 만들어진 항체를 주입해 얻는 면역이다. 자연수동면역은 태반이나 모유를 통해 모체에서 받은 면역이다."},{"id":"45-2-9","r":45,"p":2,"n":9,"s":"공중보건학","q":"감수성 지수(접촉감염 지수)가 가장 높은 감염병은?","o":["두창","백일해","성홍열","폴리오","디프테리아"],"a":1,"e":"De Rudder의 감수성 지수는 두창·홍역이 약 95%로 가장 높다. 백일해는 약 60~80%, 성홍열은 약 40%, 디프테리아는 약 10%이다. 폴리오는 약 0.1%로 가장 낮다."},{"id":"45-2-10","r":45,"p":2,"n":10,"s":"공중보건학","q":"병원체가 리케차(rickettsia)인 감염병은?","o":["결핵","한센병","장티푸스","파라티푸스","쯔쯔가무시증"],"a":5,"e":"쯔쯔가무시증은 리케차인 Orientia tsutsugamushi가 원인으로, 털진드기 유충에 물려 감염되며 물린 자리의 가피(eschar)가 특징이다. 결핵과 한센병은 Mycobacterium 속 세균이 원인이다. 장티푸스와 파라티푸스는 Salmonella 속 세균이 원인이다."},{"id":"45-2-11","r":45,"p":2,"n":11,"s":"공중보건학","q":"다음에서 설명하는 감염병은?","o":["폴리오","파상풍","장티푸스","신종감염병증후군","장출혈성대장균감염증"],"a":3,"b":"• 병원체는 Salmonella 속으로 소화기계 감염병이다.\n• 급성 전신성 열성질환으로 제2급감염병이다.\n• 호산구 감소가 특징적이다.","e":"장티푸스는 Salmonella Typhi에 의한 소화기계 제2급감염병으로, 지속적인 고열과 백혈구·호산구 감소, 장미진, 비장 비대가 특징이다. 장출혈성대장균감염증도 제2급 소화기계 감염병이지만 원인균이 대장균(E. coli O157:H7 등)이다. 폴리오는 바이러스가 원인이다."},{"id":"45-2-12","r":45,"p":2,"n":12,"s":"공중보건학","q":"수인성 감염병은?","o":["디프테리아","브루셀라증","인플루엔자","세균성이질","신증후군출혈열"],"a":4,"e":"세균성이질은 Shigella 속 세균이 오염된 물이나 음식을 통해 전파되는 대표적인 수인성(소화기계) 감염병이다. 디프테리아와 인플루엔자는 비말을 통해 전파되는 호흡기계 감염병이다. 브루셀라증은 가축에서 오는 인수공통감염병이고, 신증후군출혈열은 설치류 배설물을 통해 감염된다."},{"id":"45-2-13","r":45,"p":2,"n":13,"s":"공중보건학","q":"경련성 기침이 주 증상인 세균성 감염병은?","o":["풍진","홍역","백일해","성홍열","폴리오"],"a":3,"e":"백일해는 Bordetella pertussis에 의한 세균성 호흡기 감염병으로, 발작적인 경련성 기침과 기침 끝의 ‘훕’ 하는 흡기음이 특징이다. 풍진·홍역·폴리오는 바이러스성 질환이다. 성홍열은 세균(A군 연쇄상구균)이 원인이지만 발열, 발진, 딸기혀가 특징이다."},{"id":"45-2-14","r":45,"p":2,"n":14,"s":"공중보건학","q":"만성질환은?","o":["뇌졸중","성홍열","A형간염","유행성이하선염","장출혈성대장균감염증"],"a":1,"e":"뇌졸중은 고혈압·동맥경화 등을 배경으로 오랜 기간에 걸쳐 진행하는 비감염성 만성질환이다. 성홍열, A형간염, 유행성이하선염, 장출혈성대장균감염증은 모두 병원체에 의한 급성 감염병이다."},{"id":"45-2-15","r":45,"p":2,"n":15,"s":"공중보건학","q":"심장의 전기자극형성이나 자극전도에 이상이 생겨 심장박동이 불규칙한 것은?","o":["부정맥","협심증","뇌전증","심근경색","모야모야병"],"a":1,"e":"부정맥은 심장의 전기자극 형성이나 전도에 이상이 생겨 심장박동이 불규칙해지는 질환이다. 협심증은 관상동맥이 좁아져 일시적인 심근 허혈로 흉통이 생기는 질환이고, 심근경색은 관상동맥이 막혀 심근이 괴사하는 질환이다. 뇌전증은 뇌신경세포의 비정상적 흥분으로 발작이 반복되는 뇌질환이다."},{"id":"45-2-16","r":45,"p":2,"n":16,"s":"공중보건학","q":"정상혈압의 기준(JNC8)은?","o":["120/80 mmHg 미만","130/85 mmHg 미만","120~139 mmHg 또는 80~89 mmHg","140~159 mmHg 또는 90~99 mmHg","160/100 mmHg 이상"],"a":1,"e":"JNC 혈압 분류에서 정상혈압은 수축기 120 mmHg 미만이면서 이완기 80 mmHg 미만이다. 120~139 또는 80~89 mmHg는 고혈압 전단계, 140~159 또는 90~99 mmHg는 1기 고혈압이다. 160/100 mmHg 이상은 2기 고혈압에 해당한다."},{"id":"45-2-17","r":45,"p":2,"n":17,"s":"공중보건학","q":"다음에서 설명하는 보건행정의 특성은?","o":["과학성","기술성","봉사성","조장성","합법성"],"a":3,"b":"국민의 건강과 행복을 위해 서비스를 제공하는 행정이라 할 수 있다.","e":"봉사성은 보건행정이 국민의 건강과 행복을 위해 적극적으로 서비스를 제공하는 공공행정이라는 특성이다. 조장성은 지역사회 주민의 자발적 참여를 유도하고 교육으로 이끄는 특성이다. 과학성·기술성은 과학적 지식과 기술을 바탕으로 한다는 특성이다."},{"id":"45-2-18","r":45,"p":2,"n":18,"s":"공중보건학","q":"비공식 조직의 특징으로 옳은 것은?","o":["외면적인 조직이다.","자연 발생적인 조직이다.","전체적인 질서를 강조한다.","제도적으로 명문화된 조직이다.","능률의 논리와 과학적 합리성을 중시한다."],"a":2,"e":"비공식 조직은 구성원 간의 친분·감정을 바탕으로 자연 발생적으로 생긴 내면적 조직으로, 감정의 논리와 부분적 질서를 중시한다. 외면적이고 제도적으로 명문화되어 있으며 전체적 질서와 능률의 논리를 강조하는 것은 공식 조직의 특징이다."},{"id":"45-2-19","r":45,"p":2,"n":19,"s":"공중보건학","q":"다음에서 설명하는 조직의 원리는?","o":["조정의 원리","계층제의 원리","전문화의 원리","명령통일의 원리","통솔범위의 원리"],"a":3,"b":"업무를 성질별로 구분하여 되도록 한 사람에게 특정 업무를 전담시킴으로써 개인의 작업 능률을 향상한다.","e":"전문화(분업)의 원리는 업무를 성질별로 나누어 한 사람에게 한 가지 업무를 전담시켜 능률을 높이는 원리이다. 명령통일의 원리는 부하가 한 상관에게서만 명령을 받아야 한다는 원리이다. 통솔범위의 원리는 한 상관이 효과적으로 관리할 수 있는 부하의 수에 한계가 있다는 원리이다."},{"id":"45-2-20","r":45,"p":2,"n":20,"s":"공중보건학","q":"「지역보건법」상 다음에서 설명하는 지역보건의료기관은?","o":["보건지소","보건의료원","보건진료소","보건진료원","건강생활지원센터"],"a":1,"b":"• 읍·면(보건소가 설치된 읍·면은 제외한다)마다 1개씩 설치할 수 있다.\n• 지역주민의 보건의료를 위하여 특별히 필요하다고 인정되는 경우에는 필요한 지역에 설치·운영하거나 여러 개를 통합하여 설치·운영할 수 있다.","e":"「지역보건법」상 보건지소는 읍·면(보건소가 설치된 읍·면 제외)마다 1개씩 설치할 수 있으며, 필요시 통합 설치도 가능하다. 건강생활지원센터는 읍·면·동 단위로 설치되며 만성질환 예방 등 건강생활 지원을 담당한다. 보건진료소는 「농어촌 등 보건의료를 위한 특별조치법」에 근거해 의료취약지역 리 단위에 설치하며, 보건진료원은 기관이 아니라 그 인력이다."},{"id":"45-2-21","r":45,"p":2,"n":21,"s":"공중보건학","q":"국제적인 보건사업의 지휘 및 조정, 정부 요청 시 보건의료서비스 강화를 위한 지원 등을 수행하는 국제기구는?","o":["ILO","WHO","UNFPA","UNAIDS","UNESCO"],"a":2,"e":"WHO(세계보건기구)는 1948년 설립된 UN 전문기구로, 국제보건사업의 지휘·조정과 정부 요청 시 보건서비스 강화 지원 등을 수행한다. ILO는 노동 문제, UNFPA는 인구 문제를 다룬다. UNESCO는 교육·과학·문화 분야 기구이다."},{"id":"45-2-22","r":45,"p":2,"n":22,"s":"공중보건학","q":"공공부조에 해당하는 사회보장제도는?","o":["고용보험","실업급여","의료급여","국민연금보험","산업재해보상보험"],"a":3,"e":"의료급여는 국가가 조세로 저소득층의 의료비를 지원하는 공공부조이다. 국민연금보험, 고용보험, 산업재해보상보험은 보험료를 기반으로 하는 사회보험이다. 실업급여는 사회보험인 고용보험의 급여 중 하나이다."},{"id":"45-2-23","r":45,"p":2,"n":23,"s":"공중보건학","q":"제공되는 서비스의 내용과 양에 따라 진료비가 산정되는 진료비 지불방법은?","o":["봉급제","인두제","포괄수가제","총액예산제","행위별수가제"],"a":5,"e":"행위별수가제는 진료 행위의 내용과 양에 따라 진료비를 산정하는 방식으로, 의료인의 재량이 크지만 과잉진료 우려가 있다. 포괄수가제는 질병군(DRG)별로 미리 정한 금액을 지불하는 방식이다. 인두제는 등록된 주민 수에 따라 일정액을 받는 방식이다."},{"id":"45-2-24","r":45,"p":2,"n":24,"s":"공중보건학","q":"‘생명표’상 특정 연령의 사람이 앞으로 생존할 것으로 기대되는 평균 연수는?","o":["사력","사망률","생존율","평균여명","총생존연수"],"a":4,"e":"평균여명은 생명표에서 특정 연령의 사람이 앞으로 생존할 것으로 기대되는 평균 연수이며, 0세의 평균여명이 기대수명이다. 사력은 특정 연령에 도달한 사람이 그 순간에 사망할 확률의 강도를 나타낸다. 생존율은 특정 연령까지 살아남는 비율이다."},{"id":"45-2-25","r":45,"p":2,"n":25,"s":"공중보건학","q":"생산연령인구에 대한 유소년인구와 고령인구의 합을 백분율로 나타내는 것은?","o":["총부양비","노령화지수","순재생산율","총재생산율","인구동태지수"],"a":1,"e":"총부양비는 (유소년인구 + 고령인구) ÷ 생산연령인구(15~64세) × 100으로 구한다. 노령화지수는 고령인구(65세 이상) ÷ 유소년인구(0~14세) × 100이다. 순재생산율과 총재생산율은 여성 1명이 낳는 여아 수에 관한 인구 재생산 지표이다."},{"id":"45-2-26","r":45,"p":2,"n":26,"s":"공중보건학","q":"결핍 시 각기병을 유발하는 영양소는?","o":["비타민A","비타민B₁","비타민E","비타민D","비타민K"],"a":2,"e":"비타민B₁(티아민)은 탄수화물 대사의 조효소로, 결핍되면 각기병(말초신경염, 부종, 심장 기능 이상)이 생긴다. 비타민A 결핍은 야맹증, 비타민D 결핍은 구루병·골연화증을 일으킨다. 비타민K 결핍은 혈액응고 장애를 일으킨다."},{"id":"45-2-27","r":45,"p":2,"n":27,"s":"공중보건학","q":"「모자보건법」상 임신 28주까지의 임산부 정기 건강진단 실시기준으로 옳은 것은?","o":["1주마다 1회","2주마다 1회","3주마다 1회","4주마다 1회","5주마다 1회"],"a":4,"e":"「모자보건법」 시행규칙상 임산부 정기 건강진단은 임신 28주까지 4주마다 1회 실시한다. 임신 29~36주는 2주마다 1회, 임신 37주 이후는 1주마다 1회로 점점 짧아진다."},{"id":"45-2-28","r":45,"p":2,"n":28,"s":"공중보건학","q":"노화현상의 일반적인 특징으로 옳은 것은?","o":["면역력이 증가한다.","인지능력이 향상된다.","가역적인 병변을 수반한다.","만성질환 유병률이 감소한다.","소화기능이 저하된다."],"a":5,"e":"노화가 진행되면 소화액 분비와 위장 운동이 줄어 소화기능이 저하된다. 노화에 따라 면역력은 감소하고 만성질환 유병률은 오히려 증가한다. 노화로 인한 변화는 대부분 비가역적이다."},{"id":"45-2-29","r":45,"p":2,"n":29,"s":"공중보건학","q":"노인들에게 가장 효과적인 보건교육방법은?","o":["강연회","세미나","역할극","개인상담","심포지엄"],"a":4,"e":"노인은 시력·청력 저하와 개인차가 크므로 1:1로 눈높이를 맞춰 반복 설명할 수 있는 개인상담(개인접촉)이 가장 효과적이다. 강연회, 세미나, 심포지엄은 다수를 대상으로 하는 집단교육 방법으로, 전문 지식이 있는 대상에 적합해 노인에게는 효과가 떨어진다."},{"id":"45-2-30","r":45,"p":2,"n":30,"s":"공중보건학","q":"보건교육의 평가를 시기에 따라 구분할 때 계획평가에 해당하는 것은?","o":["과정평가","진단평가","영향평가","효율평가","형성평가"],"a":2,"e":"보건교육 평가를 시기별로 나누면 계획 단계의 진단평가(사전평가), 진행 중의 형성평가, 종료 후의 총괄평가로 구분한다. 진단평가는 교육 전 대상자의 요구와 수준을 파악하는 평가이다. 형성평가와 과정평가는 교육 진행 중에 실시하는 평가이고, 영향평가는 교육 후 단기 효과를 보는 평가이다."},{"id":"45-2-31","r":45,"p":2,"n":31,"s":"공중보건학","q":"다음 괄호에 들어갈 것으로 옳은 것은?","o":["20 m","30 m","50 m","100 m","150 m"],"a":3,"b":"「교육환경 보호에 관한 법률」상 절대보호구역은 학교 출입문으로부터 직선거리로 (    )까지인 지역을 말한다.","e":"「교육환경 보호에 관한 법률」상 절대보호구역은 학교 출입문으로부터 직선거리 50 m까지인 지역이다. 상대보호구역은 학교경계 등으로부터 직선거리 200 m까지의 지역 중 절대보호구역을 제외한 지역이다."},{"id":"45-2-32","r":45,"p":2,"n":32,"s":"공중보건학","q":"「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」상 정신의료기관은?","o":["요양병원","정신병원","정신요양시설","정신재활시설","건강생활지원센터"],"a":2,"e":"「정신건강복지법」상 정신의료기관은 정신병원, 의원 중 정신과 의원, 병원급 의료기관의 정신건강의학과를 말한다. 정신요양시설과 정신재활시설은 정신건강증진시설에 포함되지만 의료기관이 아닌 요양·재활 시설이다. 요양병원은 「의료법」상의 의료기관이다."},{"id":"45-2-33","r":45,"p":2,"n":33,"s":"공중보건학","q":"다음에서 설명하는 산포도는?","o":["범위","분산","변이계수","평균편차","표준오차"],"a":3,"b":"표준편차를 산술평균에 대한 비 또는 백분율로 나타낸다.","e":"변이계수는 표준편차를 산술평균으로 나눈 비 또는 백분율(CV = 표준편차/평균 × 100)로, 단위나 평균이 다른 집단의 산포를 비교할 때 쓴다. 분산은 편차 제곱의 평균이다. 표준오차는 표준편차를 √n으로 나눈 값으로, 표본평균의 산포를 나타낸다."},{"id":"45-2-34","r":45,"p":2,"n":34,"s":"공중보건학","q":"연간 출생아 1,000명당 당해 연도 1세 미만의 사망아 수로 나타내는 보건지표는?","o":["유아사망률","영아사망률","비례사망지수","신생아사망률","주산기사망률"],"a":2,"e":"영아사망률은 연간 출생아 1,000명당 같은 해 1세 미만 사망아 수로, 대표적인 지역사회 보건수준 지표이다. 신생아사망률은 생후 28일 미만의 사망을 대상으로 한다. 주산기사망률은 임신 28주 이후의 사산과 생후 1주 미만의 사망을 합한 지표이다."},{"id":"45-2-35","r":45,"p":2,"n":35,"s":"공중보건학","q":"고의 또는 테러 등을 목적으로 이용된 병원체에 의하여 발생되는 감염병 중 질병관리청장이 고시하는 감염병은?","o":["발진열","공수병","야토병","신증후군출혈열","크로이츠펠트-야콥병"],"a":3,"e":"생물테러감염병으로 질병관리청장이 고시한 것은 탄저, 보툴리눔독소증, 페스트, 마버그열, 에볼라바이러스병, 라싸열, 두창, 야토병이다. 발진열, 공수병, 신증후군출혈열, 크로이츠펠트-야콥병은 제3급감염병으로 생물테러감염병 고시 대상이 아니다."},{"id":"45-2-36","r":45,"p":2,"n":36,"s":"식품위생학","q":"다음에서 설명하는 기생충은?","o":["요충","선모충","유극악구충","광절열두조충","요코가와흡충"],"a":1,"b":"• 채소를 통하여 매개된다.\n• 항문 주위에 산란하여 가려움증을 일으킨다.","e":"요충은 채소 등을 통해 경구 감염되며, 암컷이 밤에 항문 주위에 산란해 가려움증을 일으키고 가족 내 집단감염이 잘 일어난다(셀로판테이프 검사로 진단). 선모충은 돼지고기, 광절열두조충은 연어·송어 같은 담수어를 통해 감염된다. 요코가와흡충은 은어 등의 담수어를 통해 감염된다."},{"id":"45-2-37","r":45,"p":2,"n":37,"s":"식품위생학","q":"「식품위생법」상 식품위생의 정의로 옳은 것은?","o":["농업, 수산업, 임업을 대상으로 하는 음식에 관한 위생","식품, 식품첨가물, 집단급식소를 대상으로 하는 음식에 관한 위생","식품, 식품첨가물, 완구품, 합성세제를 대상으로 하는 음식에 관한 위생","식품의 영양가 및 첨가되는 화학적 합성품을 대상으로 하는 음식에 관한 위생","식품, 식품첨가물, 기구 또는 용기·포장을 대상으로 하는 음식에 관한 위생"],"a":5,"e":"「식품위생법」은 식품위생을 ‘식품, 식품첨가물, 기구 또는 용기·포장을 대상으로 하는 음식에 관한 위생’으로 정의한다. 집단급식소, 완구품, 합성세제는 식품위생의 대상 정의에 포함되지 않는다. 농업·수산업·임업 같은 생산 산업이나 영양가 역시 정의의 대상이 아니다."},{"id":"45-2-38","r":45,"p":2,"n":38,"s":"식품위생학","q":"유인성 위해요소가 있는 식품은?","o":["가열 산화 된 유지","농약이 잔류하는 사과","곰팡이독에 오염된 밀가루","살모넬라균에 오염된 쇠고기","유해착색료로 착색된 단무지"],"a":1,"e":"유인성 위해요소는 원래 식품에 없었으나 가공·조리·저장 중 물리·화학적 변화로 생성되는 유해물질로, 가열 산화된 유지가 대표적이다(벤조피렌, 니트로사민 등도 해당). 잔류농약, 유해착색료, 곰팡이독, 살모넬라 오염은 외부에서 들어온 외인성 위해요소이다. 식품 자체에 원래 들어 있는 자연독은 내인성 위해요소이다."},{"id":"45-2-39","r":45,"p":2,"n":39,"s":"식품위생학","q":"사람의 1일 섭취허용량(ADI, Acceptable daily intake)을 구하기 위한 식품 안전성 평가시험은?","o":["발암성 시험","만성독성 시험","생식독성 시험","유전독성 시험","최기형성 시험"],"a":2,"e":"ADI는 실험동물에 장기간 투여하는 만성독성 시험으로 구한 최대무작용량(NOAEL)에 안전계수(보통 1/100)를 곱해 산출한다(mg/kg 체중/일). 발암성·유전독성·생식독성·최기형성 시험은 특수독성 시험으로, 특정 위해성 여부를 확인하는 데 쓴다."},{"id":"45-2-40","r":45,"p":2,"n":40,"s":"식품위생학","q":"「식품공전」상 일반세균수 집락 측정 시험 방법은?","o":["하워드법","유당배지법","표준평판법","현미경관찰법","혈구계수기법"],"a":3,"e":"「식품공전」상 일반세균수는 표준평판법으로 검체를 배지와 혼합하여 배양한 뒤 생긴 집락 수를 세어 측정한다. 하워드법은 토마토케첩 등의 곰팡이 균사를 현미경으로 세는 방법이다. 유당배지법은 대장균군 정성시험법이다."},{"id":"45-2-41","r":45,"p":2,"n":41,"s":"식품위생학","q":"다음에서 설명하는 미생물 속은?","o":["Bacillus 속","Proteus 속","Enterococcus 속","Lactobacillus 속","Pseudomonas 속"],"a":3,"b":"• 그람양성 구균이다.\n• 냉동식품의 오염지표미생물이다.","e":"Enterococcus(장구균) 속은 그람양성 구균으로, 냉동 상태에서도 대장균군보다 오래 살아남아 냉동식품의 분변오염 지표미생물로 쓰인다. Bacillus 속은 포자를 생성하는 그람양성 간균이다. Proteus와 Pseudomonas 속은 그람음성 간균으로 부패세균이다."},{"id":"45-2-42","r":45,"p":2,"n":42,"s":"식품위생학","q":"대장균군에 대한 설명으로 옳은 것은?","o":["구균이다.","그람양성이다.","포자를 생성한다.","유당을 분해한다.","편성혐기성균이다."],"a":4,"e":"대장균군은 유당을 분해하여 산과 가스를 생성하는 그람음성 무포자 간균이다. 구균이나 그람양성, 포자 생성은 대장균군의 특징이 아니다. 대장균군은 호기성 또는 통성혐기성으로 편성혐기성이 아니다."},{"id":"45-2-43","r":45,"p":2,"n":43,"s":"식품위생학","q":"「식품첨가물공전」상 두 가지 또는 그 이상의 성분을 일정한 분산 형태로 유지시키는 식품첨가물은?","o":["발색제","안정제","응고제","이형제","표백제"],"a":2,"e":"「식품첨가물공전」상 안정제는 두 가지 또는 그 이상의 성분을 일정한 분산 형태로 유지시키는 식품첨가물이다. 응고제는 식품 성분을 결착·응고시키는 첨가물이다. 이형제는 식품이 틀에서 잘 분리되도록 하는 첨가물이고, 물과 기름처럼 섞이지 않는 상을 균질하게 섞는 것은 유화제이다."},{"id":"45-2-44","r":45,"p":2,"n":44,"s":"식품위생학","q":"「식품공전」상 유가공품의 일반적인 초고온순간처리법의 온도와 시간으로 옳게 묶인 것은?","o":["63~65℃, 30분","72~75℃, 15분","110~121℃, 5분","130~150℃, 0.5~5초","180~190℃, 1~2초"],"a":4,"e":"유가공품의 초고온순간처리법(UHT)은 130~150℃에서 0.5~5초간 가열 살균하는 방법이다. 63~65℃에서 30분은 저온장시간살균법(LTLT)이다. 고온단시간살균법(HTST)은 72~75℃에서 15~20초이므로 ‘15분’은 틀리다."},{"id":"45-2-45","r":45,"p":2,"n":45,"s":"식품위생학","q":"소독제와 살균제의 조건으로 옳은 것은?","o":["부식력이 강할 것","용해성이 낮을 것","침투력이 약할 것","표백력이 강할 것","석탄산 계수가 높을 것"],"a":5,"e":"소독제와 살균제는 살균력이 강해야 하므로, 석탄산 대비 살균력을 나타내는 석탄산 계수가 높아야 한다. 또한 침투력과 용해성이 높아야 하고, 부식성과 표백성은 없어야 한다."},{"id":"45-2-46","r":45,"p":2,"n":46,"s":"식품위생학","q":"세균성 식중독균에 의해 생성되는 독소는?","o":["리시닌(ricinine)","테트라민(tetramine)","무스카린(muscarine)","시구아톡신(ciguatoxin)","엔테로톡신(enterotoxin)"],"a":5,"e":"엔테로톡신은 황색포도상구균 등 세균성 식중독균이 생성하는 장독소로, 황색포도상구균의 엔테로톡신은 내열성이 강하다. 리시닌은 피마자, 무스카린은 독버섯의 자연독이다. 테트라민은 고둥·소라류의 자연독이고, 시구아톡신은 열대 어류의 자연독이다."},{"id":"45-2-47","r":45,"p":2,"n":47,"s":"식품위생학","q":"살모넬라 식중독균에 대한 설명으로 옳은 것은?","o":["구균이다.","편모가 없다.","그람양성이다.","통성혐기성이다.","포자를 생성한다."],"a":4,"e":"살모넬라균은 그람음성 간균이며 통성혐기성이다. 주모성 편모가 있어 운동성이 있고, 포자는 생성하지 않는다. 구균이나 그람양성이라는 설명은 틀리다."},{"id":"45-2-48","r":45,"p":2,"n":48,"s":"식품위생학","q":"다음에서 설명하는 식중독균은?","o":["Bacillus cereus","Escherichia coli","Vibrio vulnificus","Campylobacter jejuni","Yersinia enterocolitica"],"a":1,"b":"• 그람양성으로 내열성 포자를 생성한다.\n• 구토형과 설사형의 식중독을 유발한다.","e":"Bacillus cereus는 내열성 포자를 생성하는 그람양성 간균으로, 구토형(볶음밥 등 전분식품, 내열성 독소)과 설사형(육류·수프 등) 식중독을 모두 일으킨다. Campylobacter jejuni는 그람음성 미호기성 나선균이다. Vibrio vulnificus와 Yersinia enterocolitica는 그람음성으로 포자를 만들지 않는다."},{"id":"45-2-49","r":45,"p":2,"n":49,"s":"식품위생학","q":"보툴리누스 식중독에 대한 설명으로 옳은 것은?","o":["원인균은 호기성이다.","원인균은 그람음성이다.","원인균은 포자를 생성하지 않는다.","신경독에 의하여 식중독이 유발된다.","세균성 식중독 중 치사율이 가장 낮다."],"a":4,"e":"보툴리누스 식중독은 Clostridium botulinum이 생성하는 신경독(neurotoxin)에 의해 복시, 연하곤란, 호흡마비 등이 나타나는 독소형 식중독이다. 원인균은 그람양성의 편성혐기성 포자형성균이다. 세균성 식중독 중 치사율이 가장 높다."},{"id":"45-2-50","r":45,"p":2,"n":50,"s":"식품위생학","q":"히스타민을 생성하여 알레르기성 식중독을 일으키는 균은?","o":["Escherichia coli","Morganella morganii","Clostridium perfringens","Listeria monocytogenes","Vibrio parahaemolyticus"],"a":2,"e":"Morganella morganii는 히스티딘 탈탄산효소를 가져 꽁치·고등어 같은 붉은살 어류의 히스티딘을 히스타민으로 바꾸어 알레르기성 식중독을 일으킨다. Clostridium perfringens는 대량 조리 식품에서 생기는 독소형 식중독균이다. Vibrio parahaemolyticus는 호염성 장염비브리오 식중독균이다."},{"id":"45-2-51","r":45,"p":2,"n":51,"s":"식품위생학","q":"식품의 유해 보존료는?","o":["둘신","아우라민","페릴라르틴","시클라메이트","포름알데히드"],"a":5,"e":"포름알데히드는 단백질 응고 작용으로 방부 효과가 있으나 독성이 강해 사용이 금지된 유해 보존료이다(붕산, 승홍 등도 해당). 둘신, 페릴라르틴, 시클라메이트는 유해 감미료이다. 아우라민은 단무지 등에 쓰였던 황색 유해 착색료이다."},{"id":"45-2-52","r":45,"p":2,"n":52,"s":"식품위생학","q":"유기염소계 농약은?","o":["퓨졸(Fussol)","디디티(DDT)","프라톨(Fratol)","카바릴(Carbaryl)","파라티온(Parathion)"],"a":2,"e":"DDT는 유기염소계 농약으로, 분해가 잘 되지 않아 환경과 지방조직에 잔류·축적된다. 파라티온은 유기인계 농약, 카바릴은 카바메이트계 농약이다. 퓨졸과 프라톨은 유기불소계 농약이다."},{"id":"45-2-53","r":45,"p":2,"n":53,"s":"식품위생학","q":"구연산회로 중에서 아코니타아제(aconitase)를 저해하는 농약은?","o":["유기인제","유기불소제","유기비소제","유기수은제","유기염소제"],"a":2,"e":"유기불소제(플루오로아세트산계)는 체내에서 플루오로구연산으로 바뀌어 구연산회로의 아코니타아제를 저해한다. 유기인제는 콜린에스테라아제를 저해하여 신경증상을 일으킨다. 유기염소제는 신경계에 작용하며 체내에 축적되는 것이 특징이다."},{"id":"45-2-54","r":45,"p":2,"n":54,"s":"식품위생학","q":"숯불로 구운 고기에서 생성 가능한 발암성 다환방향족탄화수소는?","o":["벤조피렌(benzopyrene)","니트로사민(nitrosamine)","폴리에틸렌(polyethylene)","메틸알코올(methyl alcohol)","트리할로메탄(trihalomethane)"],"a":1,"e":"벤조피렌은 유기물의 불완전 연소로 생기는 다환방향족탄화수소로, 숯불구이·훈연식품에서 생성되는 발암물질이다. 니트로사민은 아질산염과 2급 아민이 반응해 생기는 발암물질이다. 트리할로메탄은 물의 염소 소독 과정에서 생기는 부산물이다."},{"id":"45-2-55","r":45,"p":2,"n":55,"s":"식품위생학","q":"유독화된 모시조개, 바지락, 굴 등에 존재하는 간장독은?","o":["삭시톡신(saxitoxin)","베네루핀(venerupin)","오카다산(okadaic acid)","테트로도톡신(tetrodotoxin)","네오수르가톡신(neosurugatoxin)"],"a":2,"e":"베네루핀은 모시조개, 바지락, 굴 등에 존재하는 내열성 간장독으로, 간 기능 장애와 출혈 반점을 일으킨다. 삭시톡신은 섭조개·대합 등의 마비성 패독(신경독)이다. 오카다산은 설사성 패독이고, 테트로도톡신은 복어독이다."},{"id":"45-2-56","r":45,"p":2,"n":56,"s":"식품위생학","q":"자연독과 함유된 식품이 옳게 연결된 것은?","o":["듀린(dhurrin) – 완두콩","테물린(temuline) – 은행","솔라닌(solanine) – 고사리","시큐톡신(cicutoxin) – 독미나리","프타퀼로시드(ptaquiloside) – 면실유"],"a":4,"e":"시큐톡신은 독미나리에 들어 있는 경련독이다. 듀린은 수수, 테물린은 독보리에 들어 있다. 솔라닌은 감자 싹과 녹색 부위에 들어 있고, 프타퀼로시드는 고사리의 발암물질이다(면실유의 독성분은 고시폴)."},{"id":"45-2-57","r":45,"p":2,"n":57,"s":"식품위생학","q":"청매에 들어있는 시안배당체 물질은?","o":["콜린(choline)","팔린(phaline)","고시폴(gossypol)","아미그달린(amygdalin)","트립신 저해제(trypsin inhibitor)"],"a":4,"e":"아미그달린은 청매, 살구씨, 복숭아씨 등에 들어 있는 시안배당체로, 효소에 의해 분해되면 청산(HCN)을 생성한다. 고시폴은 면실유의 유독성분이다. 팔린과 콜린은 독버섯의 성분이고, 트립신 저해제는 생콩의 단백질 소화 저해 물질이다."},{"id":"45-2-58","r":45,"p":2,"n":58,"s":"식품위생학","q":"피마자에 들어있는 유독단백질은?","o":["리신(ricin)","리코린(lycorine)","아코니틴(aconitine)","루테오스카이린(luteoskyrin)","히오시아민(hyoscyamine)"],"a":1,"e":"리신은 피마자 씨에 들어 있는 유독단백질로 독성이 매우 강하다(피마자에는 알칼로이드인 리시닌도 있음). 아코니틴은 바꽃(부자)의 독성분이고, 히오시아민은 미치광이풀 등의 독성분이다. 루테오스카이린은 황변미를 일으키는 곰팡이독이다."},{"id":"45-2-59","r":45,"p":2,"n":59,"s":"식품위생학","q":"다음에서 설명하는 곰팡이독소는?","o":["파튤린(patulin)","푸모니신(fumonisin)","아플라톡신(aflatoxin)","말토리진(maltoryzine)","오크라톡신(ochratoxin)"],"a":1,"b":"• 푸른곰팡이(Penicillium)가 생산하는 독소이다.\n• 국내 사과주스 및 사과주스 농축액에 대한 기준치가 설정되어 있다.","e":"파튤린은 Penicillium 속(주로 P. expansum)이 생산하는 곰팡이독소로, 썩은 사과에서 잘 생겨 사과주스 및 농축액에 기준치가 설정되어 있다. 아플라톡신은 Aspergillus flavus가 생산하는 간장독·발암물질이다. 오크라톡신은 Aspergillus ochraceus 등이 생산하는 신장독이고, 푸모니신은 Fusarium 속이 생산한다."},{"id":"45-2-60","r":45,"p":2,"n":60,"s":"식품위생학","q":"맥각독은?","o":["시트리닌(citrinin)","에르고톡신(ergotoxin)","제랄레논(zearalenone)","루브라톡신(rubratoxin)","아이슬란디톡신(islanditoxin)"],"a":2,"e":"맥각독은 맥각균(Claviceps purpurea)이 호밀·보리에 기생해 생산하는 독으로, 에르고톡신과 에르고타민이 대표적이다. 시트리닌과 아이슬란디톡신은 황변미 독소이다. 제랄레논은 Fusarium 속이 생산하는 에스트로겐성 독소이다."},{"id":"45-2-61","r":45,"p":2,"n":61,"s":"식품위생학","q":"파라티푸스 원인균의 속명은?","o":["Vibrio","Shigella","Salmonella","Mycobacterium","Corynebacterium"],"a":3,"e":"파라티푸스의 원인균은 Salmonella Paratyphi로, 장티푸스와 같은 Salmonella 속이다. Shigella 속은 세균성이질, Vibrio 속은 콜레라의 원인균이다. Corynebacterium 속은 디프테리아, Mycobacterium 속은 결핵의 원인균이다."},{"id":"45-2-62","r":45,"p":2,"n":62,"s":"식품위생학","q":"콜레라균의 특징은?","o":["구균이다.","편모가 없다.","그람양성균이다.","포자를 생성한다.","통성혐기성균이다."],"a":5,"e":"콜레라균(Vibrio cholerae)은 통성혐기성의 그람음성 콤마형 간균이다. 한쪽 끝에 단모성 편모가 있어 운동성이 활발하다. 포자는 생성하지 않으며, 구균이나 그람양성이라는 설명은 틀리다."},{"id":"45-2-63","r":45,"p":2,"n":63,"s":"식품위생학","q":"바이러스가 병원체인 감염병은?","o":["발진열","성홍열","폴리오","장티푸스","브루셀라증"],"a":3,"e":"폴리오는 폴리오바이러스가 원인이며 분변-경구 경로로 감염되어 이완성 마비를 일으킨다. 발진열은 리케차가 원인이다. 성홍열, 장티푸스, 브루셀라증은 세균이 원인이다."},{"id":"45-2-64","r":45,"p":2,"n":64,"s":"식품위생학","q":"제1급감염병은?","o":["홍역","A형간염","일본뇌염","디프테리아","유행성이하선염"],"a":4,"e":"디프테리아는 「감염병예방법」상 제1급감염병이다. 홍역, A형간염, 유행성이하선염은 제2급감염병이다. 일본뇌염은 제3급감염병이다."},{"id":"45-2-65","r":45,"p":2,"n":65,"s":"식품위생학","q":"다음에서 설명하는 인수공통감염병은?","o":["결핵","탄저","돈단독","야토병","파상열"],"a":2,"b":"• 병원체는 Bacillus anthracis이다.\n• 발열과 패혈증 등의 증상을 일으킨다.\n• 감염된 고기를 섭취할 때와 상처 및 호흡기로도 감염된다.","e":"탄저는 포자를 형성하는 그람양성 간균인 Bacillus anthracis가 원인인 인수공통감염병이다. 감염된 고기 섭취(장탄저), 상처(피부탄저), 포자 흡입(폐탄저)으로 감염되며 패혈증을 일으킬 수 있다. 결핵은 Mycobacterium, 돈단독은 Erysipelothrix, 야토병은 Francisella, 파상열은 Brucella 속 세균이 원인이다."},{"id":"45-2-66","r":45,"p":2,"n":66,"s":"식품위생학","q":"다음에서 설명하는 인수공통감염병은?","o":["큐열","백일해","여시니아증","리스테리아증","비브리오패혈증"],"a":1,"b":"• 제3급감염병이다.\n• 고열, 오한, 두통을 일으킨다.\n• 병원체가 리케차인 Coxiella burnetii이다.","e":"큐열은 리케차인 Coxiella burnetii에 의한 제3급감염병이자 인수공통감염병으로, 고열·오한·두통을 일으키며 주로 감염된 가축의 분비물을 흡입하거나 생우유를 섭취해 감염된다. 리스테리아증은 저온에서도 증식하는 그람양성 간균 Listeria monocytogenes가 원인이다. 백일해는 사람 간에 전파되는 세균성 호흡기 감염병이다."},{"id":"45-2-67","r":45,"p":2,"n":67,"s":"식품위생학","q":"돼지고기에 의해 매개되는 기생충은?","o":["요충","편충","회충","유구조충","십이지장충"],"a":4,"e":"유구조충(갈고리촌충)은 돼지고기를 덜 익혀 먹을 때 감염되며, 사람에게 낭미충증을 일으킬 수 있다. 쇠고기로 매개되는 것은 무구조충이다. 요충, 편충, 회충, 십이지장충은 채소를 통해 감염되는 기생충이다."},{"id":"45-2-68","r":45,"p":2,"n":68,"s":"식품위생학","q":"제1 중간숙주가 왜우렁이, 제2 중간숙주가 담수어인 기생충은?","o":["간흡충","선모충","폐흡충","무구조충","아니사키스"],"a":1,"e":"간흡충(간디스토마)은 제1 중간숙주가 왜우렁이, 제2 중간숙주가 참붕어·잉어 등 담수어이다. 폐흡충은 다슬기 → 가재·게를 거친다. 아니사키스는 갑각류 → 오징어·고등어 등 해산어류를 거치고, 선모충과 무구조충은 각각 돼지고기와 쇠고기로 감염된다."},{"id":"45-2-69","r":45,"p":2,"n":69,"s":"식품위생학","q":"「식품첨가물공전」상 허용된 감미료는?","o":["붕산","D-소비톨","삼염화질소","에틸렌글리콜","p-니트로-o-톨루이딘"],"a":2,"e":"D-소비톨은 「식품첨가물공전」에 허용된 당알코올계 감미료이다. 에틸렌글리콜과 p-니트로-o-톨루이딘은 사용이 금지된 유해 감미료이다. 붕산은 유해 보존료, 삼염화질소는 밀가루에 쓰였던 유해 표백제이다."},{"id":"45-2-70","r":45,"p":2,"n":70,"s":"식품위생학","q":"「식품첨가물공전」상 주용도가 산화방지제인 것은?","o":["과산화수소","차아염소산나트륨","부틸히드록시아니솔","데히드로초산나트륨","카복시메틸셀룰로스나트륨"],"a":3,"e":"부틸히드록시아니솔(BHA)은 유지의 산화를 막는 산화방지제이다. 과산화수소와 차아염소산나트륨은 살균제이고, 데히드로초산나트륨은 보존료이다. 카복시메틸셀룰로스나트륨은 증점제·안정제로 쓰인다."},{"id":"45-2-71","r":45,"p":2,"n":71,"s":"식품위생학","q":"「식품첨가물공전」상 주용도가 추출용제인 것은?","o":["헥산","에틸바닐린","제이인산칼슘","계피알데히드","과산화벤조일(희석)"],"a":1,"e":"헥산은 식용유지 제조 시 원료에서 유지를 뽑아내는 추출용제로, 최종 제품에 남지 않도록 제거해야 한다. 에틸바닐린과 계피알데히드는 향료이다. 과산화벤조일(희석)은 밀가루개량제이다."},{"id":"45-2-72","r":45,"p":2,"n":72,"s":"식품위생학","q":"「식품첨가물공전」상 물과 기름 등 섞이지 않는 두 가지 또는 그 이상의 상(phases)을 균질하게 섞어주거나 유지시키는 식품첨가물은?","o":["사카린나트륨","몰식자산프로필","탄산수소나트륨","파라옥시안식향산에틸","글리세린지방산에스테르"],"a":5,"e":"글리세린지방산에스테르는 물과 기름처럼 섞이지 않는 상을 균질하게 섞어 주는 유화제이다. 사카린나트륨은 감미료, 몰식자산프로필은 산화방지제이다. 탄산수소나트륨은 팽창제, 파라옥시안식향산에틸은 보존료이다."},{"id":"45-2-73","r":45,"p":2,"n":73,"s":"식품위생학","q":"「식품공전」상 식품조사처리(방사선조사)기준의 ‘허용대상 식품별 흡수선량’에 사용되는 단위는?","o":["큐리(Ci)","뢴트겐(R)","베크렐(Bq)","밀리시버트(mSv)","킬로그레이(kGy)"],"a":5,"e":"「식품공전」의 식품조사처리 기준에서 흡수선량은 그레이(Gy) 단위, 실제로는 킬로그레이(kGy)로 표시한다. 큐리와 베크렐은 방사능의 세기(초당 붕괴 수)를 나타내는 단위이다. 뢴트겐은 공기 중 전리량인 조사선량 단위이고, 밀리시버트는 인체 영향을 고려한 등가·유효선량 단위이다."},{"id":"45-2-74","r":45,"p":2,"n":74,"s":"식품위생학","q":"다음 정의에 해당하는 식품안전관리인증기준(HACCP)의 용어는?","o":["개선조치","모니터링","한계기준","중요관리점","위해요소분석"],"a":4,"b":"식품안전관리인증기준(HACCP)을 적용하여 식품의 위해요소를 예방·제어하거나 허용 수준 이하로 감소시켜 당해 식품의 안전성을 확보할 수 있는 중요한 단계·과정 또는 공정을 말한다.","e":"중요관리점(CCP)은 HACCP을 적용해 위해요소를 예방·제어하거나 허용 수준 이하로 줄여 식품 안전성을 확보할 수 있는 중요한 단계·과정·공정이다. 한계기준은 중요관리점에서 위해요소 관리가 허용 범위 내인지 판단하는 기준이다. 모니터링은 중요관리점이 한계기준 내에서 관리되는지 관찰·측정하는 행위이다."},{"id":"45-2-75","r":45,"p":2,"n":75,"s":"식품위생학","q":"화학적 위해요소는?","o":["바이러스","식중독균","잔류농약","유리조각","금속성 이물"],"a":3,"e":"잔류농약은 화학적 위해요소로, 중금속·식품첨가물 등과 같은 범주이다. 바이러스와 식중독균은 생물학적 위해요소이다. 유리조각과 금속성 이물은 물리적 위해요소이다."},{"id":"45-3-1","r":45,"p":3,"n":1,"s":"실기시험","q":"(사진 1) 기온의 변화를 기록하는 사진의 온도계는?","o":["적외선 온도계","전기식 온도계","봉상(棒狀) 온도계","자기(自記) 온도계","아스만 통풍 온습도계"],"a":4,"e":"사진: 자기온도계 — 원통형 드럼에 감긴 기록지 위로 펜(바늘)이 움직이며 온도 곡선을 연속으로 그리는 기기. 자기(自記)온도계는 바이메탈 등 감부의 변형을 펜에 전달해 시간에 따른 기온 변화를 자동으로 기록한다. 봉상온도계는 막대 모양 유리관으로 그 순간의 온도만 읽고, 아스만 통풍온습도계는 건구·습구와 통풍 팬으로 습도를 구하는 기기라 기록 기능이 없다.","ph":["s54"],"m":"사진"},{"id":"45-3-2","r":45,"p":3,"n":2,"s":"실기시험","q":"다음과 같은 조건에서 불쾌지수는?","o":["68.5","70.2","75.6","80.2","83.8"],"a":5,"b":"• 건구온도 32℃\n• 습구온도 28℃","e":"【공식】 불쾌지수(DI) = (건구온도 + 습구온도)(℃) × 0.72 + 40.6\n【풀이】 (32 + 28) × 0.72 + 40.6 = 43.2 + 40.6 = 83.8\n불쾌지수 80 이상이면 거의 모든 사람이 불쾌감을 느끼는 수준이다. 섭씨식에서는 화씨식과 달리 계수 0.72와 상수 40.6을 쓴다는 점에 주의한다."},{"id":"45-3-3","r":45,"p":3,"n":3,"s":"실기시험","q":"「실내공기질공정시험기준」 중 라돈의 방사능 농도 단위는?","o":["개/cc","ppm","μg/m³","Bq/m³","CFU/m³"],"a":4,"e":"라돈은 방사성 기체이므로 1초에 1개의 원자핵이 붕괴하는 방사능 단위인 베크렐을 써서 공기 1 m³당 Bq/m³로 나타낸다(실내공기질 권고기준 148 Bq/m³). CFU/m³는 총부유세균, μg/m³는 미세먼지·폼알데하이드 같은 질량농도, ppm은 일산화탄소·이산화탄소 같은 가스상 물질의 단위이다."},{"id":"45-3-4","r":45,"p":3,"n":4,"s":"실기시험","q":"자외선/가시선 분광법(인도페놀법)으로 암모니아 가스를 측정할 때 흡수셀과 셀 홀더(cell holder)가 위치하는 곳은?","o":["검출부","광원부","시료부","측광부","파장선택부"],"a":3,"e":"자외선/가시선 분광광도계는 광원부 → 파장선택부 → 시료부 → 측광부로 구성되며, 시료 용액을 담는 흡수셀과 이를 고정하는 셀 홀더는 시료부에 위치한다. 광원부는 텅스텐·중수소 램프로 빛을 내는 곳이고, 파장선택부는 필터나 회절격자로 특정 파장(인도페놀법은 약 640 nm)을 고르는 곳이며, 측광부는 투과광의 세기를 검출하는 곳이다."},{"id":"45-3-5","r":45,"p":3,"n":5,"s":"실기시험","q":"(사진 2) 사진의 기기로 측정하는 것은?","o":["기압","소음","습도","온도","조도"],"a":5,"e":"사진: 조도계(럭스미터) — 흰색 반구형 수광부(센서)가 본체 또는 선으로 연결되어 있고 디지털 표시창에 lux 값이 나타난다. 조도계는 빛이 비추는 면의 밝기(조도, 단위 lux)를 측정한다. 소음계는 막대 끝에 스펀지로 싼 마이크로폰이 있어 구별되며, 습도는 건습구 온도계나 아스만 통풍온습도계로 측정한다.","ph":["s55"],"m":"사진"},{"id":"45-3-6","r":45,"p":3,"n":6,"s":"실기시험","q":"(사진 3) 사진의 장비(유도결합플라스마, ICP)를 이용하여 분석할 수 있는 물질은?","o":["석면","아연","다이옥신","질소산화물","유기인계농약"],"a":2,"e":"사진: ICP(유도결합플라스마) 분석장비 — 대형 본체에 아르곤 가스 공급 장치와 자동시료주입기가 연결되고, 토치 부위에서 고온 플라스마가 발생하는 장비. ICP는 약 6,000~10,000 K의 아르곤 플라스마로 시료를 원자화·들뜨게 한 뒤 원소별 발광선을 측정하므로 아연, 납, 카드뮴 같은 금속 원소 분석에 쓰인다. 다이옥신과 유기인계 농약은 기체크로마토그래프(질량분석기) 계열, 석면은 현미경법으로 분석한다.","ph":["s56"],"m":"사진"},{"id":"45-3-7","r":45,"p":3,"n":7,"s":"실기시험","q":"실내공기 중에 있는 총부유세균의 측정 방법은?","o":["세정법","여과법","주입법","충돌법","침전법"],"a":4,"e":"실내공기질공정시험기준에서 총부유세균은 충돌법으로 측정하는데, 일정 유량으로 공기를 흡입해 배지 표면에 충돌시켜 세균을 포집하고 배양 후 집락수를 세어 CFU/m³로 나타낸다. 침전법(낙하균법)은 공기 중 세균이 배지에 자연 낙하하도록 두는 간이법으로 공기량을 정량할 수 없어 공정시험 방법이 아니다."},{"id":"45-3-8","r":45,"p":3,"n":8,"s":"실기시험","q":"구성이 다음 그림과 같은 장치는?","o":["기체크로마토그래프","원자흡수분광광도계","이온크로마토그래프","자외선/가시선 분광광도계","유도결합플라스마 원자발광광도장치"],"a":2,"e":"원자흡수분광광도계는 광원부(중공음극램프) → 시료원자화부(불꽃 버너 등) → 파장선택부(단색화장치) → 측광부(검출기)로 구성되며, 바닥상태 원자가 특정 파장의 빛을 흡수하는 정도로 금속을 정량한다. 유도결합플라스마 원자발광광도장치는 원소가 내는 빛(발광)을 측정하므로 별도의 중공음극램프 광원이 없고, 자외선/가시선 분광광도계는 원자화부 대신 흡수셀이 들어가는 시료부가 있다는 점으로 구별한다.","pr":1,"ph":["g:aas","g:aas_sol"],"m":"그림"},{"id":"45-3-9","r":45,"p":3,"n":9,"s":"실기시험","q":"하수처리 방법 중 부유물질에 작은 기포를 부착하여 겉보기 비중을 감소시키는 것은?","o":["부상","여과","침전","막공법","스크린"],"a":1,"e":"부상(flotation)은 폐수에 미세한 기포를 발생시켜 부유물질에 부착시킴으로써 겉보기 비중을 물보다 작게 만들어 수면으로 띄워 제거하는 방법이다(가압부상법이 대표적). 침전은 반대로 비중이 큰 입자를 중력으로 가라앉히는 방법이고, 스크린은 큰 협잡물을 걸러내는 전처리 시설이다."},{"id":"45-3-10","r":45,"p":3,"n":10,"s":"실기시험","q":"먹는물 수질기준 중 소독제 및 소독 부산물에 해당하는 물질은?","o":["다이아지논","1.4-다이옥신","과망간산칼륨","유리잔류염소","암모니아성질소"],"a":4,"e":"먹는물 수질기준에서 '소독제 및 소독부산물질' 항목에는 유리잔류염소(4.0 mg/L 이하)를 비롯해 총트리할로메탄, 클로로포름 등이 포함된다. 다이아지논은 농약으로 건강상 유해영향 유기물질에, 암모니아성질소는 건강상 유해영향 무기물질에, 과망간산칼륨 소비량은 심미적 영향물질에 속한다."},{"id":"45-3-11","r":45,"p":3,"n":11,"s":"실기시험","q":"생물화학적산소요구량(BOD₅)을 측정하기 위해 폐수시료를 배양하는 온도는?","o":["0℃","10℃","20℃","30℃","40℃"],"a":3,"e":"BOD₅는 시료를 20℃ 암소에서 5일간 배양한 뒤 배양 전후의 용존산소 감소량으로 구하며, 20℃는 미생물 활동이 안정적으로 일어나는 표준 조건이다. 배양 온도가 30℃처럼 높아지면 분해 속도가 달라져 표준값과 비교할 수 없게 된다."},{"id":"45-3-12","r":45,"p":3,"n":12,"s":"실기시험","q":"(사진 4) 사진의 기구로 측정하는 항목은?","o":["부유물질","증발잔류물질","화학적산소요구량","과망간산칼륨소비량","생물화학적산소요구량"],"a":5,"e":"사진: BOD병·BOD 배양기 — BOD병은 약 300 mL 용량에 끝이 뾰족한 간유리 마개가 있어 기포 없이 밀폐되는 병이고, 배양기는 20℃를 유지하는 항온기이다. BOD병에 시료를 채워 20℃에서 5일 배양한 뒤 용존산소 감소량으로 생물화학적산소요구량을 구한다. 화학적산소요구량은 미생물이 아니라 과망간산칼륨 같은 산화제로 가열·산화시켜 측정한다.","ph":["s57"],"m":"사진"},{"id":"45-3-13","r":45,"p":3,"n":13,"s":"실기시험","q":"(사진 5) 사진의 기구로 측정하는 항목은?","o":["경도","산도","색도","염도","부유물질"],"a":5,"e":"사진: 부유물질 여과장치 — 깔때기(여과기)가 흡인병 위에 꽂혀 있고 진공펌프로 감압 여과하는 구조이다. 부유물질(SS)은 유리섬유여지로 시료를 여과한 뒤 105~110℃에서 건조하여 여과 전후 여지 무게 차로 구한다. 증발잔류물은 여과 없이 시료 전체를 증발·건고시켜 측정하고, 경도·산도는 적정법으로 측정하므로 여과장치가 필요하지 않다.","ph":["s58"],"m":"사진"},{"id":"45-3-14","r":45,"p":3,"n":14,"s":"실기시험","q":"철, 망간 및 마그네슘의 화학적 변화로 생길 수 있으며, 부유물이나 점토가 주 원인이 되는 수질 지표 항목은?","o":["산도","염도","탁도","불소이온","화학적산소요구량"],"a":3,"e":"탁도는 물의 흐린 정도를 나타내는 지표로 점토·부유물이 주 원인이며 철·망간 등의 산화로 생긴 침전물도 탁도를 높인다(단위 NTU, 먹는물 기준 1 NTU 이하). 색도는 녹아 있는 물질에 의한 색의 정도이고, 화학적산소요구량은 유기물 오염 지표라서 흐림 자체를 나타내지 않는다."},{"id":"45-3-15","r":45,"p":3,"n":15,"s":"실기시험","q":"그림과 같이 소독할 때 적합하고, 살균력이 강한 에탄올의 농도는?","o":["10%","30%","50%","70%","90%"],"a":4,"e":"예측 그림: 손·피부를 알코올로 문질러 소독하는 모습. 에탄올은 70% 안팎일 때 살균력이 가장 강한데, 적당한 물이 있어야 균체 단백질 변성과 세포 내 침투가 잘 일어나기 때문이다. 90%처럼 너무 진하면 균 표면 단백질이 먼저 응고되어 내부 침투가 막히고 빨리 증발하며, 50% 이하는 살균력이 약하다.","pr":1,"ph":["s75"],"m":"그림"},{"id":"45-3-16","r":45,"p":3,"n":16,"s":"실기시험","q":"지방이 공기 중에 노출되어 빛, 열 등에 의하여 불쾌한 냄새가 나는 현상은?","o":["산패","갈변","연화","발효","자기소화"],"a":1,"e":"산패는 유지가 공기 중 산소, 빛, 열, 금속 등에 의해 산화·분해되어 불쾌한 냄새와 맛이 생기는 현상이다. 발효는 미생물이 탄수화물 등을 분해해 유익한 물질을 만드는 것이고, 자기소화는 생선·육류 자체 효소에 의해 조직이 분해되는 현상이다."},{"id":"45-3-17","r":45,"p":3,"n":17,"s":"실기시험","q":"K값, 트리메틸아민(trimethylamine) 등을 측정하여 식품의 부패 여부를 판정하는 방법은?","o":["관능검사","방사능검사","물리적검사","화학적검사","미생물학적검사"],"a":4,"e":"K값(ATP 분해산물 중 이노신·하이포잔틴의 비율), 트리메틸아민, 휘발성염기질소, 히스타민, pH 등을 측정해 부패를 판정하는 것은 화학적 검사이다. 관능검사는 냄새·색·탄력 등 오감으로 판정하는 방법이고, 미생물학적 검사는 일반세균수 등을 세어 판정하는 방법이다."},{"id":"45-3-18","r":45,"p":3,"n":18,"s":"실기시험","q":"어육의 신선도 검사에서 휘발성염기질소(VBN)의 초기 부패 판정 기준(mg %)은?","o":["5~10","15~20","30~40","50~60","70~80"],"a":3,"e":"어육의 휘발성염기질소(VBN)는 신선한 것이 5~10 mg%, 보통 신선도가 15~25 mg%, 초기 부패가 30~40 mg%, 부패가 50 mg% 이상으로 판정한다. 5~10과 15~20은 아직 신선한 범위이고, 50~60은 이미 부패한 단계이다."},{"id":"45-3-19","r":45,"p":3,"n":19,"s":"실기시험","q":"(사진 6) 사진은 표준한천배지를 멸균하는 데 사용하는 기구이다. 명칭은?","o":["건열멸균기","자비멸균기","유통증기멸균기","고압증기멸균기","고온단시간살균기"],"a":4,"e":"사진: 고압증기멸균기(오토클레이브) — 두꺼운 금속 원통형 용기에 압력계와 안전밸브가 달린 밀폐 뚜껑이 있다. 고압증기멸균기는 약 121℃(약 15 lb/in²)에서 15~20분간 가열하여 아포까지 사멸시키므로 배지 멸균에 쓰인다. 건열멸균기는 160~170℃ 건열로 유리기구를 멸균하고, 유통증기멸균기는 100℃ 증기로 간헐 멸균하는 기구이다.","ph":["s03"],"m":"사진"},{"id":"45-3-20","r":45,"p":3,"n":20,"s":"실기시험","q":"「식품공전」에 의한 우유의 고온단시간살균법에서 적절한 가열온도와 시간으로 옳게 묶인 것은?","o":["72~75℃, 15~20초","83~86℃, 21~25초","95~98℃, 30~35초","102~105℃, 40~45초","112~115℃, 50~55초"],"a":1,"e":"「식품공전」에서 우유의 고온단시간살균법(HTST)은 72~75℃에서 15~20초간 가열하는 방법이다. 저온장시간살균법은 63~65℃에서 30분간, 초고온순간처리법은 130~150℃에서 0.5~5초간 가열한다."},{"id":"45-3-21","r":45,"p":3,"n":21,"s":"실기시험","q":"염소 유도체 성분의 소독제는?","o":["페놀","에탄올","표백분","포르말린","과산화수소"],"a":3,"e":"표백분(클로르석회, CaOCl₂)은 물에 녹아 차아염소산을 내는 염소계 소독제로 음료수·채소·식기 소독에 쓰인다. 페놀(석탄산)은 소독력 비교 기준이 되는 페놀계, 포르말린은 폼알데하이드 수용액인 알데하이드계 소독제이다."},{"id":"45-3-22","r":45,"p":3,"n":22,"s":"실기시험","q":"세균 배양 시 균의 접종에 사용하는 그림의 실험 도구는?","o":["뷰렛","백금이","실린더","스포이드","페트리접시"],"a":2,"e":"사진: 백금이 — 금속 손잡이 끝에 가는 백금(또는 니크롬)선이 달려 있고 그 끝이 작은 고리 모양으로 말려 있다. 백금이는 사용 전후 알코올램프 불꽃으로 화염멸균하여 균을 배지에 접종하거나 획선 배양할 때 쓴다. 페트리접시는 배지를 담는 배양 용기이고, 뷰렛은 적정에 쓰는 눈금 유리관이다.","ph":["s23"],"m":"그림"},{"id":"45-3-23","r":45,"p":3,"n":23,"s":"실기시험","q":"현미경으로 세균의 형태와 배열을 관찰하여 그린 다음 그림 중 연쇄상구균은?","o":["포도상구균","연쇄상구균","쌍구균","간균","나선균"],"a":2,"e":"연쇄상구균은 한 방향으로만 분열하고 분열 후에도 떨어지지 않아 둥근 구균이 사슬(염주) 모양으로 이어진다. 포도상구균은 여러 방향으로 분열해 포도송이처럼 불규칙하게 뭉치고, 쌍구균은 2개씩 짝을 이루며, 간균은 막대 모양, 나선균은 나선 모양이다. ※ 보기 그림은 비공개라 예측해 그림","ns":1,"pr":1,"oi":["g:o_staph","g:o_strep","g:o_diplo","g:o_rod","g:o_spiral"],"pa":1,"ph":["s59"],"m":"그림"},{"id":"45-3-24","r":45,"p":3,"n":24,"s":"실기시험","q":"그림과 같은 내열성 포자를 형성하는 세균은?","o":["결핵균","콜레라균","포도상구균","장티푸스균","보툴리누스균"],"a":5,"e":"사진: 보툴리누스균 — 막대 모양 간균의 한쪽 끝 가까이에 타원형 아포가 있어 균체가 부풀어 보인다. 보툴리누스균(Clostridium botulinum)은 그람양성 편성혐기성 간균으로 내열성 아포를 형성하며, 통조림 등 혐기 상태 식품에서 신경독소를 만든다. 포도상구균은 구균이며 아포를 만들지 않고, 결핵균·콜레라균·장티푸스균도 아포를 형성하지 않는다.","ph":["s60"],"m":"그림"},{"id":"45-3-25","r":45,"p":3,"n":25,"s":"실기시험","q":"구충이라 불리기도 하며, 경구감염 또는 경피감염이 가능하고, 생활사가 그림과 같은 기생충은?","o":["편충","유구조충","십이지장충","요코가와흡충","동양모양선충"],"a":3,"e":"사진: 십이지장충(구충) — 성충의 몸 앞부분이 등쪽으로 갈고리처럼 굽어 있고, 구강에 날카로운 이빨 모양의 구치가 있다. 십이지장충은 흙 속에서 자란 사상유충(감염형 유충)이 피부를 뚫고 들어오거나(경피감염) 채소와 함께 입으로 들어와(경구감염) 감염되며, 소장에 붙어 흡혈해 빈혈을 일으킨다. 동양모양선충도 경구·경피감염이 가능하지만 '구충'이라 부르지 않고, 편충은 충란의 경구감염만 한다.","ph":["s61"],"m":"그림"},{"id":"45-3-26","r":45,"p":3,"n":26,"s":"실기시험","q":"생활사가 그림과 같은 기생충은?","o":["회충","간흡충","선모충","폐흡충","광절열두조충"],"a":1,"e":"사진: 회충 — 성충은 유백색의 크고 긴 선충(암컷 20~35 cm)이고, 수정란은 두꺼운 껍질 바깥에 울퉁불퉁한 단백막이 있다. 회충은 자충포장란을 채소 등과 함께 먹어 감염되며, 소장에서 부화한 유충이 간·심장·폐를 거쳐 기관지 → 인두로 올라와 다시 삼켜진 뒤 소장에서 성충이 된다. 간흡충은 쇠우렁이와 민물고기, 폐흡충은 다슬기와 가재·게를 중간숙주로 거치고, 선모충은 돼지고기 섭취로 감염된다.","ph":["s06"],"m":"그림"},{"id":"45-3-27","r":45,"p":3,"n":27,"s":"실기시험","q":"다음 그림의 장염비브리오균의 성상 및 특징으로 옳은 것은?","o":["구균이다.","호염성 균이다.","주모성 균이다.","운동성이 없다.","그람양성균이다."],"a":2,"e":"사진: 장염비브리오균 — 약간 굽은 막대 모양 간균의 한쪽 끝에 편모가 1개 달린 단모성 형태. 장염비브리오균은 3~4% 식염 농도에서 잘 자라는 호염성 세균으로 여름철 어패류 생식으로 식중독을 일으킨다. 그람음성 간균이므로 구균이나 그람양성균이 아니며, 단모성 편모로 활발히 운동하므로 주모성이나 비운동성도 틀린 설명이다.","ph":["s24"],"m":"그림"},{"id":"45-3-28","r":45,"p":3,"n":28,"s":"실기시험","q":"감염된 인체에서 그림과 같이 파상적인 발열 주기를 보이며, 동물에게 유산을 일으킬 수 있는 인수공통감염병은?","o":["황열","야토병","브루셀라증","리스테리아증","렙토스피라증"],"a":3,"e":"브루셀라증은 소·돼지·양·염소의 우유나 고기, 분비물을 통해 사람에게 감염되며, 사람에게는 발열과 해열이 물결처럼 반복되는 파상열을, 동물에게는 유산을 일으키는 인수공통감염병이다. 렙토스피라증은 쥐 소변으로 오염된 물·흙을 통해 감염되어 고열·황달·출혈을 일으키고, 야토병은 산토끼 등 야생 설치류를 통해 감염된다.","pr":1,"ph":["g:fever","g:fever_sol"],"m":"그림"},{"id":"45-3-29","r":45,"p":3,"n":29,"s":"실기시험","q":"(사진 7) 사진의 알주머니를 가지고 있는 위생곤충은?","o":["이","모기","바퀴","빈대","깔따구"],"a":3,"e":"사진: 바퀴 알주머니(난협) — 팥알 또는 작은 강낭콩 모양의 갈색 캡슐로, 한쪽 가장자리에 지퍼 같은 톱니 모양 봉합선이 있다. 바퀴는 여러 개의 알을 난협 속에 2열로 넣어 낳으며, 독일바퀴처럼 부화 직전까지 암컷이 배 끝에 달고 다니는 종도 있다. 모기는 알을 물 위에 낱개나 덩어리로 낳고, 이는 서캐를 머리카락이나 옷 섬유에 붙여 낳으므로 알주머니를 만들지 않는다.","ph":["s62"],"m":"사진"},{"id":"45-3-30","r":45,"p":3,"n":30,"s":"실기시험","q":"(사진 8) 사진과 같은 흡혈 습성이 있는 모기종은?","o":["왕모기","토고숲모기","이집트숲모기","작은빨간집모기","중국얼룩날개모기"],"a":5,"e":"사진: 얼룩날개모기 — 흡혈할 때 주둥이와 몸이 일직선이 되어 몸을 피부면에 비스듬히(약 45~90°) 세우고, 날개에 흑백 얼룩무늬가 있다. 중국얼룩날개모기(Anopheles sinensis)는 이런 흡혈 자세를 보이는 얼룩날개모기속으로 삼일열 말라리아를 매개한다. 작은빨간집모기나 숲모기류는 흡혈 시 몸을 피부면과 거의 평행하게 유지하므로 구별된다.","ph":["s63"],"m":"사진"},{"id":"45-3-31","r":45,"p":3,"n":31,"s":"실기시험","q":"(사진 9) 사진의 장소에서 발생하는 위생곤충은?","o":["등에","모기","빈대","참진드기","흡혈노린재"],"a":2,"e":"사진: 논 — 물이 얕고 넓게 고여 있는 경작지로, 모기 유충(장구벌레)이 발생하기 좋은 서식지이다. 논에서는 일본뇌염을 매개하는 작은빨간집모기와 말라리아를 매개하는 중국얼룩날개모기가 대량 발생한다. 참진드기는 풀숲, 빈대는 실내 침구·가구 틈에 서식하므로 논과는 관계가 없다.","ph":["s64"],"m":"사진"},{"id":"45-3-32","r":45,"p":3,"n":32,"s":"실기시험","q":"(사진 10) 사진 속 위생곤충의 화학적 방제법은?","o":["독먹이 설치","끈끈이 트랩","기생좀벌 방사","축사에 스크린 설치","방사선으로 불임 유발"],"a":1,"e":"사진: 집파리 — 회색 몸에 가슴 등쪽에 검은 세로줄 4개가 있고, 주둥이는 끝이 넓은 스펀지 모양(흡취형)이다. 독먹이(살충제를 섞은 먹이) 설치는 살충제를 이용하므로 화학적 방제법에 해당한다. 끈끈이 트랩이나 스크린 설치는 물리적(기계적) 방제, 기생좀벌 방사는 생물학적 방제이다.","ph":["s65"],"m":"사진"},{"id":"45-3-33","r":45,"p":3,"n":33,"s":"실기시험","q":"그림의 위생곤충이 매개하는 질병은?","o":["페스트","발진열","사상충증","발진티푸스","쯔쯔가무시증"],"a":4,"e":"사진: 이(몸니) — 몸길이 2~4 mm로 날개가 없고 몸이 등배로 납작하며, 다리 끝에 털이나 옷 섬유를 붙잡는 갈고리 모양 발톱이 있다. 발진티푸스는 몸니가 매개하며, 이의 똥 속 리케치아가 긁힌 상처로 들어가 감염된다. 쯔쯔가무시증은 털진드기 유충, 발진열과 페스트는 쥐벼룩이 매개한다.","ph":["s70"],"m":"그림"},{"id":"45-3-34","r":45,"p":3,"n":34,"s":"실기시험","q":"(사진 11) 사진 속 위생곤충의 특징으로 옳은 것은?","o":["주간활동성이다.","완전변태를 한다.","암수 모두 흡혈한다.","부식성 유기물질을 좋아한다.","구기는 자흡형(cutting-sponging)이다."],"a":3,"e":"사진: 빈대 — 적갈색에 몸이 등배로 매우 납작한 타원형이며, 날개가 퇴화해 흔적만 남아 있다. 빈대는 암컷과 수컷, 약충까지 모두 흡혈하며 주로 야간에 활동하고 알-약충-성충의 불완전변태를 한다. 구기는 찔러서 빨아먹는 형태라서 자르고 핥아먹는 형태(cutting-sponging, 등에 등)는 틀린 설명이고, 부식성 유기물질을 좋아하는 것은 집파리·바퀴의 특징이다.","ph":["s33"],"m":"사진"},{"id":"45-3-35","r":45,"p":3,"n":35,"s":"실기시험","q":"그림과 같이 즐치가 있는 벼룩은?","o":["개벼룩","사람벼룩","장님벼룩","생쥐벼룩","모래벼룩"],"a":1,"e":"사진: 개벼룩 — 머리 아래쪽의 협즐치와 앞가슴 뒤쪽의 전흉즐치가 모두 빗살처럼 뚜렷하게 있다. 개벼룩(Ctenocephalides canis)은 고양이벼룩과 함께 두 가지 즐치를 모두 가진 대표적인 벼룩이다. 사람벼룩과 모래벼룩은 즐치가 없다는 점으로 구별한다.","ph":["s13"],"m":"그림"},{"id":"45-3-36","r":45,"p":3,"n":36,"s":"실기시험","q":"(사진 12) 사진의 위생곤충이 실내에 침입했을 때 적절한 조치는?","o":["살서제를 살포한다.","실내등을 더 밝게 한다.","파리채를 이용하여 잡는다.","맨손으로 잡은 후 휴지통에 버린다.","물에 적신 휴지로 덮어서 잡는다."],"a":5,"e":"사진: 청딱지개미반날개(화상벌레) — 몸길이 약 7 mm의 개미처럼 가늘고 긴 몸에 머리는 검고, 가슴과 배는 주황색이며, 짧은 딱지날개는 청록색 광택을 띤다. 몸속 독성물질(페데린)이 피부에 닿으면 화상 같은 물집과 피부염이 생기므로, 물에 적신 휴지로 덮어 짓누르지 않고 감싸 잡는 것이 적절하다. 파리채로 치거나 맨손으로 잡으면 체액이 터져 피부에 묻을 수 있고, 불빛에 유인되므로 실내등을 밝게 하면 오히려 더 모인다.","ph":["s66"],"m":"사진"},{"id":"45-3-37","r":45,"p":3,"n":37,"s":"실기시험","q":"(사진 13) 벌초, 등산 시에 사람에게 피해를 주는 사진의 위생곤충은?","o":["땅벌","등에","뒤영벌","호박벌","호리병벌"],"a":1,"e":"사진: 땅벌 — 작은 말벌류로 검은 바탕에 노란색(또는 흰색) 줄무늬가 있고, 땅속이나 무덤가 흙 속에 집을 짓는다. 벌초나 등산 중 땅속 벌집을 모르고 건드리면 땅벌이 떼로 공격해 쏘이는 사고가 많다. 등에는 벌이 아니라 파리목 곤충이고, 뒤영벌·호박벌은 털이 많고 온순한 편이라 먼저 공격하는 일이 드물다.","ph":["s67"],"m":"사진"},{"id":"45-3-38","r":45,"p":3,"n":38,"s":"실기시험","q":"(사진 14) 3급감염병인 중증열성혈소판감소증후군(SFTS)을 매개하는 사진의 진드기는?","o":["쥐진드기","집진드기","참진드기","털진드기","물렁진드기"],"a":3,"e":"사진: 참진드기 — 다리 8개, 몸이 납작한 타원형이고 등에 단단한 등판(순판)이 있으며, 입틀이 몸 앞쪽으로 돌출되어 있고 흡혈 후에는 콩알처럼 크게 부푼다. 중증열성혈소판감소증후군(SFTS)은 작은소피참진드기 등 참진드기가 매개하는 제3급감염병이다. 털진드기는 유충이 쯔쯔가무시증을 매개하고, 물렁진드기는 등판이 없고 입틀이 몸 아래쪽에 있어 구별된다.","ph":["s52"],"m":"사진"},{"id":"45-3-39","r":45,"p":3,"n":39,"s":"실기시험","q":"(사진 15) 사진 속 기구의 용도는?","o":["쥐 방제","바퀴 방제","집파리 방제","딱정벌레 방제","흡혈노린재 방제"],"a":1,"e":"사진: 쥐 방제 기구 — 스프링이 달린 판형 쥐덫이나 철망으로 된 상자형 생포틀처럼 미끼를 걸어 쥐를 잡는 구조이다. 이러한 쥐덫(트랩)은 살서제를 쓰지 않는 물리적 쥐 방제 기구이다. 바퀴나 집파리 방제에는 주로 끈끈이 트랩, 독먹이, 잔류분무가 쓰여 기구 형태가 다르다.","ph":["s68"],"m":"사진"},{"id":"45-3-40","r":45,"p":3,"n":40,"s":"실기시험","q":"(사진 16) 사진의 살충제 살포 방법에 관한 설명으로 옳은 것은?","o":["8 km/h 속도로 작업한다.","분사구는 30~40° 상향한다.","제제로는 수화제를 사용한다.","일출 전, 일몰 후에 작업을 한다.","분사구는 바람이 불어오는 쪽을 향한다."],"a":4,"e":"사진: 연막(가열연무) 소독 — 연막기 분사구에서 흰 연기가 짙게 뿜어져 나와 퍼지는 모습이다. 연막 소독은 기온역전으로 공기가 안정되어 연막이 지면 가까이 오래 머물고 모기 활동이 활발한 일출 전·일몰 후에 실시한다. 분사구를 바람이 불어오는 쪽으로 향하면 연막이 작업자에게 되돌아오므로 바람을 등지고 살포해야 하고, 연막에는 경유 등에 희석한 유제를 쓰며 수화제는 잔류분무용이다.","ph":["s69"],"m":"사진"},{"id":"46-1-1","r":46,"p":1,"n":1,"s":"위생관계법령","q":"「공중위생관리법」상 (   )에 들어갈 용어는?","o":["감염관리","건강증진","예방관리","위생관리","질병예방"],"a":2,"b":"이 법은 공중이 이용하는 영업의 위생관리등에 관한 사항을 규정함으로써 위생수준을 향상시켜 국민의 (   )에 기여함을 목적으로 한다.","e":"공중위생관리법의 목적은 공중이 이용하는 영업의 위생관리 등에 관한 사항을 규정해 위생수준을 향상시키고 ‘국민의 건강증진’에 기여하는 것이다. ‘위생관리’는 목적 조항 앞부분(규정 대상)에 이미 나오는 말이라 빈칸이 아니고, 감염관리·질병예방은 감염병예방법 쪽 표현이다."},{"id":"46-1-2","r":46,"p":1,"n":2,"s":"위생관계법령","q":"「공중위생관리법」상 위생사의 업무범위 중 대통령령으로 정하는 업무는?","o":["소독업무","먹는물 관리 업무","식품 위생 관리 업무","하수도 시설 관리 업무","감염병 예방 관리 업무"],"a":1,"e":"위생사의 업무범위 중 ‘그 밖에 보건위생에 영향을 미치는 것으로서 대통령령으로 정하는 업무’는 소독업무와 보건관리업무이다. 음료수(먹는물) 처리·위생관리, 식품·기구·용기의 위생관리, 하수·폐기물 처리 등은 대통령령이 아니라 법률에 직접 열거된 업무이다."},{"id":"46-1-3","r":46,"p":1,"n":3,"s":"위생관계법령","q":"「공중위생관리법」상 위생사가 되려는 사람은 누구에게 면허를 받아야 하는가?","o":["시·도지사","환경부장관","질병관리청장","보건복지부장관","식품의약품안전처장"],"a":4,"e":"위생사 면허는 위생사 국가시험에 합격한 후 보건복지부장관에게 받는다(공중위생관리법은 보건복지부 소관). 환경부장관은 먹는물·폐기물 분야, 식품의약품안전처장은 식품위생법 분야의 주무기관이라 혼동하지 않도록 한다."},{"id":"46-1-4","r":46,"p":1,"n":4,"s":"위생관계법령","q":"「공중위생관리법」상 공중위생감시원의 자격이 있는 자는?","o":["조리사","영양사","위생사","식품기사","수산제조기사"],"a":3,"e":"공중위생감시원은 위생사 또는 환경기사 2급 이상 자격증 소지자, 관련 학과(화학·환경공학·위생학 등) 졸업자, 외국 위생사 면허 소지자 등으로 임명한다. 영양사·조리사·식품기사 등은 공중위생감시원의 자격 요건에 해당하지 않는다."},{"id":"46-1-5","r":46,"p":1,"n":5,"s":"위생관계법령","q":"「공중위생관리법」상 부정행위로 시험이 정지되거나 합격이 무효로 된 자는 해당 위생사 국가시험 후에 몇 회 응시할 수 없는가?","o":["2회","3회","4회","5회","6회"],"a":1,"e":"부정행위로 시험이 정지되거나 합격이 무효가 된 사람은 그 후에 치러지는 위생사 국가시험에 2회 응시할 수 없다. 3회 이상으로 헷갈리기 쉬우나 법정 응시 제한 횟수는 2회이다."},{"id":"46-1-6","r":46,"p":1,"n":6,"s":"위생관계법령","q":"「식품위생법」상 식품위생감시원의 직무가 <u>아닌</u> 것은?","o":["시설기준의 적합 여부의 확인·검사","위생등급 지정에 관한 조사·연구 사업","영업소의 폐쇄를 위한 간판 제거 등의 조치","출입·검사 및 검사에 필요한 식품등의 수거","식품등의 위생적인 취급에 관한 기준의 이행 지도"],"a":2,"e":"식품위생감시원의 직무에는 위생적 취급기준 이행 지도, 출입·검사 및 수거, 시설기준 적합 여부 확인·검사, 영업소 폐쇄를 위한 간판 제거 등의 조치 등이 포함된다. ‘위생등급 지정에 관한 조사·연구 사업’은 현장 지도·단속 업무가 아니라 위생등급 제도 운영(식약처·위탁기관) 차원의 업무이므로 감시원 직무가 아니다."},{"id":"46-1-7","r":46,"p":1,"n":7,"s":"위생관계법령","q":"「식품위생법」상 ‘기구 및 용기·포장과 그 원재료에 관한 규격’에 관한 사항을 고시하는 자는?","o":["시·도지사","질병관리청장","보건복지부장관","시장·군수·구청장","식품의약품안전처장"],"a":5,"e":"식품위생법상 식품·식품첨가물의 기준·규격과 마찬가지로 ‘기구 및 용기·포장과 그 원재료에 관한 기준 및 규격’도 식품의약품안전처장이 정하여 고시한다. 보건복지부장관은 공중위생관리법, 질병관리청장은 감염병예방법의 주체이다."},{"id":"46-1-8","r":46,"p":1,"n":8,"s":"위생관계법령","q":"「식품위생법」상 영업신고를 하여야 하는 업종이 <u>아닌</u> 것은?","o":["식품운반업","식품조사처리업","식품냉동·냉장업","용기·포장류제조업","즉석판매제조·가공업"],"a":2,"e":"식품조사처리업은 방사선 조사 처리를 하는 업종으로 식품의약품안전처장의 ‘허가’ 대상이다. 즉석판매제조·가공업, 식품운반업, 식품냉동·냉장업, 용기·포장류제조업 등은 특별자치시장·특별자치도지사·시장·군수·구청장에게 ‘신고’하는 업종이다."},{"id":"46-1-9","r":46,"p":1,"n":9,"s":"위생관계법령","q":"「식품위생법」상 영업에 종사하지 못하는 질병의 종류가 <u>아닌</u> 것은?","o":["피부병","A형간염","기생충증","감염성 결핵","고름형성(화농성) 질환"],"a":3,"e":"영업에 종사하지 못하는 질병은 결핵(비감염성 제외), 콜레라·장티푸스·세균성이질·A형간염 등 일부 감염병, 피부병 및 그 밖의 고름형성(화농성) 질환, 후천성면역결핍증(성병 건강진단 대상자에 한함)이다. 기생충증은 여기에 포함되지 않는다."},{"id":"46-1-10","r":46,"p":1,"n":10,"s":"위생관계법령","q":"「식품위생법」상 식품의약품안전처장은 등록한 식품을 제조·가공 또는 판매하는 자에 대하여 식품이력추적관리기준의 준수 여부 등을 몇 년마다 조사·평가하여야 하는가?","o":["3년","4년","5년","6년","7년"],"a":1,"e":"식품의약품안전처장은 식품이력추적관리 등록 식품을 제조·가공·판매하는 자에 대해 식품이력추적관리기준 준수 여부 등을 3년마다 조사·평가해야 한다. 5년은 다른 제도의 주기와 혼동하기 쉬운 오답이다."},{"id":"46-1-11","r":46,"p":1,"n":11,"s":"위생관계법령","q":"「식품위생법」상 집단급식소는 1회 몇 명 이상에게 식사를 제공하는 급식소를 말하는가?","o":["10명","20명","30명","40명","50명"],"a":5,"e":"집단급식소는 영리를 목적으로 하지 않고 계속적으로 특정 다수인(1회 50명 이상)에게 음식물을 공급하는 기숙사·학교·병원·사회복지시설·산업체 등의 급식시설을 말한다. 30명·40명 등은 기준 인원이 아니다."},{"id":"46-1-12","r":46,"p":1,"n":12,"s":"위생관계법령","q":"「식품위생법」상 기준·규격이 정하여지지 아니한 화학적 합성품 등의 판매 등 금지를 위반한 경우의 벌칙으로 옳은 것은?","o":["2년 이하의 징역 또는 2천만원 이하의 벌금","4년 이하의 징역 또는 4천만원 이하의 벌금","6년 이하의 징역 또는 6천만원 이하의 벌금","8년 이하의 징역 또는 8천만원 이하의 벌금","10년 이하의 징역 또는 1억원 이하의 벌금"],"a":5,"e":"기준·규격이 정하여지지 않은 화학적 합성품 등의 판매 등 금지를 위반하면 위해식품 판매 금지 위반 등과 함께 가장 무거운 벌칙인 10년 이하의 징역 또는 1억원 이하의 벌금(병과 가능)에 처한다. 낮은 단계의 벌칙(3년·5년 등)은 그 밖의 일반 준수사항 위반에 해당한다."},{"id":"46-1-13","r":46,"p":1,"n":13,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 제4급감염병은?","o":["백일해","콜레라","장티푸스","디프테리아","급성호흡기감염증"],"a":5,"e":"급성호흡기감염증은 표본감시 대상인 제4급감염병이다(인플루엔자, 장관감염증, 수족구병 등도 제4급). 백일해·콜레라·장티푸스는 제2급, 디프테리아는 제1급감염병이다."},{"id":"46-1-14","r":46,"p":1,"n":14,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 제1급감염병은?","o":["폴리오","쯔쯔가무시증","폐렴구균 감염증","에볼라바이러스병","지카바이러스 감염증"],"a":4,"e":"에볼라바이러스병은 치명률이 높아 발생 즉시 신고하고 음압격리가 필요한 제1급감염병(바이러스성 출혈열)이다. 폴리오·폐렴구균 감염증은 제2급, 쯔쯔가무시증·지카바이러스 감염증은 제3급감염병이다."},{"id":"46-1-15","r":46,"p":1,"n":15,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 감염병 실태조사의 실시 주기는?","o":["1년","2년","3년","4년","5년"],"a":3,"e":"감염병예방법상 감염병 실태조사는 3년마다 실시한다(의료기관 감염관리 실태조사도 3년, 내성균 실태조사는 매년). 내성균 실태조사의 ‘매년’과 혼동하지 않도록 한다."},{"id":"46-1-16","r":46,"p":1,"n":16,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 감염병환자, 식품, 동식물, 그 밖의 환경 등으로부터 고위험병원체를 분리한 자는 지체 없이 ‘명칭’, ‘분리된 검체명’, ‘분리 일자’ 등을 누구에게 신고하여야 하는가?","o":["시·도지사","질병관리청장","관할 보건소장","보건복지부장관","시장·군수·구청장"],"a":2,"e":"고위험병원체를 분리하거나 이동받은 자는 지체 없이 병원체의 명칭, 분리된 검체명, 분리 일자 등을 질병관리청장에게 신고해야 한다. 감염병 환자 발생 신고처럼 관할 보건소장에게 하는 것이 아니라는 점이 함정이다."},{"id":"46-1-17","r":46,"p":1,"n":17,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 임시예방접종을 할 경우 미리 공고하지 <u>않아도</u> 되는 사항은?","o":["예방접종 일시","예방접종 장소","예방접종의 종류","예방접종의 투약량","예방접종을 받을 사람의 범위"],"a":4,"e":"임시예방접종을 할 때 미리 공고해야 하는 사항은 예방접종의 일시 및 장소, 예방접종의 종류, 예방접종을 받을 사람의 범위이다. 투약량은 의료인이 접종 시 판단·적용하는 사항으로 공고 대상이 아니다."},{"id":"46-1-18","r":46,"p":1,"n":18,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 필수예방접종 대상 감염병이 <u>아닌</u> 것은?","o":["결핵","파상풍","디프테리아","유행성이하선염","후천성면역결핍증"],"a":5,"e":"필수예방접종 대상에는 디프테리아, 폴리오, 백일해, 홍역, 파상풍, 결핵, B형간염, 유행성이하선염, 풍진, 수두, 일본뇌염 등이 있다. 후천성면역결핍증(에이즈)은 예방백신이 없으므로 필수예방접종 대상이 될 수 없다."},{"id":"46-1-19","r":46,"p":1,"n":19,"s":"위생관계법령","q":"「먹는물관리법」상 (   )에 들어갈 용어는?","o":["심층수, 수돗물","지하수, 용천수","염지하수, 지표수","지표수, 재이용수","수돗물, 재이용수"],"a":2,"b":"“샘물”이란 암반대수층(岩盤帶水層) 안의 (   ) 또는 (   ) 등 수질의 안전성을 계속 유지할 수 있는 자연 상태의 깨끗한 물을 먹는 용도로 사용할 원수(原水)를 말한다.","e":"먹는물관리법상 ‘샘물’은 암반대수층 안의 지하수 또는 용천수 등 수질의 안전성을 계속 유지할 수 있는 자연 상태의 깨끗한 물을 먹는 용도로 사용할 원수를 말한다. 염지하수는 물속에 녹아 있는 염분 등이 일정 기준 이상인 별도 개념이고, 지표수·수돗물은 샘물이 아니다."},{"id":"46-1-20","r":46,"p":1,"n":20,"s":"위생관계법령","q":"「먹는물관리법」상 ‘먹는물관련영업’이 <u>아닌</u> 것은?","o":["수돗물 제조업","수처리제 제조업","먹는샘물의 유통전문판매업","정수기의 제조업·수입판매업","먹는샘물·먹는염지하수의 제조업·수입판매업"],"a":1,"e":"먹는물관련영업은 먹는샘물·먹는염지하수의 제조업·수입판매업·유통전문판매업, 수처리제 제조업, 정수기의 제조업·수입판매업이다. 수돗물 공급은 영업이 아니라 「수도법」에 따른 수도사업으로 관리된다."},{"id":"46-1-21","r":46,"p":1,"n":21,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물, 샘물 및 염지하수의 수질 기준을 정하여 보급하는 등 먹는물, 샘물 및 염지하수의 수질 관리를 위하여 필요한 시책을 마련하여야 하는 자는?","o":["시·도지사","환경부장관","보건복지부장관","국립환경과학원장","식품의약품안전처장"],"a":2,"e":"먹는물관리법상 먹는물·샘물·염지하수의 수질기준을 정해 보급하는 등 수질관리 시책을 마련할 책무는 주무부처 장관인 환경부장관에게 있다. 보건복지부·식약처는 먹는물관리법의 주관 기관이 아니다. ※ 출제 당시 기준(2025년 10월 정부조직 개편으로 환경부는 기후에너지환경부로 개편됨)"},{"id":"46-1-22","r":46,"p":1,"n":22,"s":"위생관계법령","q":"「먹는물관리법」상 ‘샘물의 수량이 풍부하게 부존되어 있는 지역’을 샘물보전구역으로 지정할 수 있는 자는?","o":["시·도지사","환경부장관","질병관리청장","보건복지부장관","식품의약품안전처장"],"a":1,"e":"샘물보전구역은 샘물의 수량이 풍부하게 부존되어 있는 지역 등을 대상으로 시·도지사가 지정할 수 있다. 환경부장관은 정책·기준을 정하는 위치이고, 구역 지정 권한은 시·도지사에게 있다는 점이 핵심이다."},{"id":"46-1-23","r":46,"p":1,"n":23,"s":"위생관계법령","q":"「먹는물관리법」상 대통령령으로 정하는 규모 이상의 샘물 또는 염지하수를 개발하려는 자는 누구의 허가를 받아야 하는가?","o":["시·도지사","환경부장관","유역환경청장","국립환경과학원장","시장·군수·구청장"],"a":1,"e":"대통령령으로 정하는 규모 이상의 샘물 또는 염지하수를 개발하려는 자는 시·도지사의 허가를 받아야 한다(샘물 개발 허가). 환경부장관이나 유역환경청장은 이 개발 허가의 권한자가 아니다."},{"id":"46-1-24","r":46,"p":1,"n":24,"s":"위생관계법령","q":"「폐기물관리법」상 위해의료폐기물의 종류가 <u>아닌</u> 것은?","o":["병리계폐기물","혈액오염폐기물","조직물류폐기물","일반의료폐기물","생물·화학폐기물"],"a":4,"e":"폐기물관리법상 의료폐기물은 격리의료폐기물, 위해의료폐기물, 일반의료폐기물로 나뉘며, 위해의료폐기물에는 조직물류·병리계·손상성·생물·화학·혈액오염폐기물이 있다. 일반의료폐기물은 위해의료폐기물과 같은 단계의 별도 분류이므로 그 하위 종류가 아니다."},{"id":"46-1-25","r":46,"p":1,"n":25,"s":"위생관계법령","q":"「하수도법」상 (   )에 들어갈 용어는?","o":["물리, 화학","응집, 부상","침전, 분해","흡착, 흡수","산화, 환원"],"a":3,"b":"“분뇨처리시설”이라 함은 분뇨를 (   )·(   ) 등의 방법으로 처리하는 시설을 말한다.","e":"하수도법상 ‘분뇨처리시설’은 분뇨를 침전·분해 등의 방법으로 처리하는 시설을 말한다. 응집·부상, 흡착·흡수 등은 일반 수처리 공정 용어로, 법령 정의 문구가 아니다."},{"id":"46-1-26","r":46,"p":1,"n":26,"s":"환경위생학","q":"표준상태의 건조 공기 중에서 부피조성의 약 1%를 차지하는 기체성분은?","o":["산소","질소","오존","아르곤","이산화탄소"],"a":4,"e":"건조 공기의 부피 조성은 질소 약 78%, 산소 약 21%, 아르곤 약 0.93%, 이산화탄소 약 0.04% 순이므로 약 1%를 차지하는 것은 아르곤이다. 이산화탄소는 0.03~0.04% 수준으로 1%에 훨씬 못 미친다."},{"id":"46-1-27","r":46,"p":1,"n":27,"s":"환경위생학","q":"경유 자동차에서 고온, 고압의 연소 조건으로 인해 다량 배출되는 대기오염물질은?","o":["오존","메탄","일산화탄소","질소산화물","이황화탄소"],"a":4,"e":"경유(디젤) 엔진은 고온·고압의 압축착화 연소를 하므로 공기 중 질소가 산화되어 질소산화물(NOx)이 다량 생성된다(입자상 물질도 많음). 일산화탄소는 산소가 부족한 불완전연소, 특히 휘발유 엔진의 공회전·저속 운행 시 많이 나온다."},{"id":"46-1-28","r":46,"p":1,"n":28,"s":"환경위생학","q":"태양복사에너지를 차단하여 지구 대기의 온도를 떨어뜨리는 물질은?","o":["메탄","화산재","아산화질소","이산화탄소","염화불화탄소"],"a":2,"e":"화산재(및 화산 분출로 생긴 황산염 에어로졸)는 성층권까지 올라가 태양복사에너지를 반사·산란시켜 지표 기온을 낮춘다. 메탄·아산화질소·이산화탄소·염화불화탄소는 지구복사(적외선)를 흡수하는 온실가스로 기온을 높인다."},{"id":"46-1-29","r":46,"p":1,"n":29,"s":"환경위생학","q":"여름철 도시 지역 대기 중에서 광화학산화물을 생성하는 원인물질과 태양복사에너지로 묶인 것은?","o":["매연, 황산미스트, 자외선","매연, 황산미스트, 적외선","일산화탄소, 질소산화물, 적외선","질소산화물, 탄화수소화합물, 자외선","이산화탄소, 탄화수소화합물, 자외선"],"a":4,"e":"광화학 스모그는 자동차 배기가스의 질소산화물과 탄화수소가 자외선을 받아 광화학반응을 일으켜 오존·PAN 등 광화학산화물을 만드는 현상이다. 적외선은 광화학반응을 일으키지 못하고, 매연·황산미스트는 런던형 스모그의 원인이다."},{"id":"46-1-30","r":46,"p":1,"n":30,"s":"환경위생학","q":"다음 중 대기오염사건은?","o":["도노라사건","레만호사건","미나마타병사건","블루베이비병사건","이따이이따이병사건"],"a":1,"e":"도노라사건(1948년, 미국 펜실베이니아)은 기온역전 상태에서 공장 배출 아황산가스·매연이 정체되어 발생한 대기오염사건이다. 미나마타병(메틸수은)·이따이이따이병(카드뮴)·블루베이비병(질산성 질소)은 수질오염과 관련된 사건이다."},{"id":"46-1-31","r":46,"p":1,"n":31,"s":"환경위생학","q":"자동차 타이어 등 고무 제품을 손상시키는 2차 대기오염물질은?","o":["메탄","오존","질소","이산화탄소","일산화탄소"],"a":2,"e":"오존은 질소산화물과 탄화수소의 광화학반응으로 생기는 2차 대기오염물질로, 강한 산화력 때문에 고무 제품에 균열을 일으켜 손상시킨다. 일산화탄소·메탄·이산화탄소는 직접 배출되는 1차 오염물질이며 고무 손상의 대표 물질이 아니다."},{"id":"46-1-32","r":46,"p":1,"n":32,"s":"환경위생학","q":"배출가스 중 유해가스와 입자상 물질을 동시에 처리할 수 있는 장치는?","o":["세정집진장치","음파집진장치","중력집진장치","관성력집진장치","원심력집진장치"],"a":1,"e":"세정집진장치(스크러버)는 액체를 분사·접촉시켜 입자를 포집하는 동시에 수용성 유해가스를 흡수할 수 있어 가스와 입자를 함께 처리한다. 중력·관성력·원심력집진장치는 물리적 힘으로 입자만 분리할 뿐 가스 제거 기능이 없다."},{"id":"46-1-33","r":46,"p":1,"n":33,"s":"환경위생학","q":"고도가 높아질수록 기온이 낮아지고 기상현상이 일어나는 대기권은?","o":["열권","대류권","성층권","중간권","외기권"],"a":2,"e":"대류권은 지표에서 약 11~12km까지로, 고도가 높아질수록 기온이 낮아져 대류가 일어나고 구름·비 등 기상현상이 나타난다. 성층권은 오존층의 자외선 흡수로 고도가 높아질수록 기온이 올라가 대류가 거의 없다."},{"id":"46-1-34","r":46,"p":1,"n":34,"s":"환경위생학","q":"실내공기 중 이산화탄소 1,000 ppm을 백분율(%)로 환산한 농도는?","o":["0.01","0.1","1","10","100"],"a":2,"e":"【공식】 1% = 10,000 ppm (ppm은 백만분율, %는 백분율)\n【풀이】 1,000 ppm ÷ 10,000 = 0.1%. 0.01%는 100 ppm에 해당하므로 자릿수를 혼동하지 않도록 한다."},{"id":"46-1-35","r":46,"p":1,"n":35,"s":"환경위생학","q":"토양 등에서 자연적으로 배출되지만 실내 건축자재에서도 검출되며 폐암의 원인으로 알려진 기체상 물질은?","o":["라돈","석면","수은","카드뮴","염화비닐"],"a":1,"e":"라돈은 토양·암석의 우라늄 붕괴로 생기는 자연 방사성 기체로, 건축자재(석고보드·콘크리트 등)에서도 방출되며 흡연 다음가는 폐암 원인으로 알려져 있다. 석면도 폐암·악성중피종을 일으키지만 기체가 아닌 섬유상 입자상 물질이다."},{"id":"46-1-36","r":46,"p":1,"n":36,"s":"환경위생학","q":"실내에서 불감기류와 냉각력을 측정할 수 있는 계측기는?","o":["모발습도계","자기습도계","풍향풍속계","카타온도계","흑구온도계"],"a":4,"e":"카타온도계는 알코올 기둥이 일정 온도 구간을 내려가는 시간을 재어 냉각력을 구하고, 이로부터 일반 풍속계로 측정하기 어려운 불감기류(약 0.5 m/s 이하)를 측정한다. 흑구온도계는 복사열, 모발·자기습도계는 습도 측정용이다."},{"id":"46-1-37","r":46,"p":1,"n":37,"s":"환경위생학","q":"실내공기질 관리를 위하여 시간당 환기 횟수를 계산할 때 지표로 사용하는 물질은?","o":["라돈","미세먼지","이산화질소","이산화탄소","총부유세균"],"a":4,"e":"이산화탄소는 재실자의 호흡으로 증가하므로 실내 공기의 전반적인 오염도와 환기 상태를 나타내는 지표로 쓰이며, 이를 이용해 필요 환기량과 시간당 환기 횟수를 계산한다. 라돈·미세먼지 등은 개별 오염물질로서 관리하지 환기량 계산의 지표로 쓰지 않는다."},{"id":"46-1-38","r":46,"p":1,"n":38,"s":"환경위생학","q":"건습구온도계에서 건구온도와 습구온도가 같아 포화상태에 이르게 되었을 때 상대습도(%)는?","o":["0","10","50","80","100"],"a":5,"e":"습구는 젖은 헝겊의 수분 증발로 냉각되는데, 공기가 수증기로 포화되면 증발이 일어나지 않아 건구온도와 습구온도가 같아지며 이때 상대습도는 100%이다. 건습구 온도차가 클수록 공기가 건조해 상대습도가 낮다."},{"id":"46-1-39","r":46,"p":1,"n":39,"s":"환경위생학","q":"태양복사열에 직접 노출되어 체온을 조절하는 중추신경계의 장애가 생기고 심할 경우 사망에 이르게 되는 열중증은?","o":["열경련","열피로","열실신","열사병","열허탈"],"a":4,"e":"열사병(일사병)은 고온 환경·직사광선 노출로 체온조절중추에 장애가 생겨 체온이 급상승(41℃ 이상)하고 땀이 나지 않으며 의식장애·사망에 이를 수 있다. 열경련은 땀으로 인한 염분 손실로 근육경련이, 열피로·열허탈은 순환기능 부전이 주원인이다."},{"id":"46-1-40","r":46,"p":1,"n":40,"s":"환경위생학","q":"다중이용시설의 실내공기질 기준에서 기체상 물질에 해당하는 것은?","o":["석면","미세먼지","초미세먼지","이산화질소","총부유세균"],"a":4,"e":"이산화질소는 가스상(기체상) 오염물질로, 실내공기질 기준에서 일산화탄소·폼알데하이드 등과 함께 기체상 물질에 속한다. 미세먼지·초미세먼지·석면은 입자상 물질이고, 총부유세균은 생물학적 오염물질이다."},{"id":"46-1-41","r":46,"p":1,"n":41,"s":"환경위생학","q":"자외선 중 도르노선(Dorno ray)의 파장(nm)은?","o":["100~220","280~315","400~550","600~780","800~1,000"],"a":2,"e":"도르노선(건강선)은 파장 약 280~315nm(2,800~3,150Å)의 자외선으로, 피부에서 비타민 D를 생성하고 살균작용을 한다. 400nm 이상은 가시광선 영역이고, 780nm 이상은 적외선이다."},{"id":"46-1-42","r":46,"p":1,"n":42,"s":"환경위생학","q":"인체에 가장 큰 영향을 미치는 입자상 물질의 크기는?","o":["5.0 μm 이하","10~30 μm","50~100 μm","200~500 μm","1,000 μm 이상"],"a":1,"e":"입경 약 0.5~5.0 μm의 입자는 상기도에서 걸러지지 않고 폐포까지 침착되므로 인체에 가장 큰 영향을 준다. 10 μm 이상의 큰 입자는 대부분 코·기관지 점막에서 걸러져 배출된다."},{"id":"46-1-43","r":46,"p":1,"n":43,"s":"환경위생학","q":"대기오염물질의 주된 인체 침입경로는?","o":["눈","피부","비뇨기","호흡기","소화기"],"a":4,"e":"대기오염물질은 가스·입자 형태로 공기와 함께 흡입되므로 주된 인체 침입경로는 호흡기이다. 피부·눈은 일부 자극성 물질에 대한 국소 노출 경로일 뿐이고, 소화기는 수질·식품 오염물질의 주 경로이다."},{"id":"46-1-44","r":46,"p":1,"n":44,"s":"환경위생학","q":"먹는물에서 대장균 검출이 갖는 의미는?","o":["농약 오염","분변 오염","방사선 오염","중금속 오염","염소화합물 오염"],"a":2,"e":"대장균은 사람과 온혈동물의 장관에 상주하므로 먹는물에서 검출되면 분변에 오염되었음을, 즉 병원성 장내 세균이 함께 존재할 가능성을 의미한다(분변 오염 지표세균). 농약·중금속 오염은 미생물 지표로 판단하지 않는다."},{"id":"46-1-45","r":46,"p":1,"n":45,"s":"환경위생학","q":"하천수가 강바닥의 모래 혹은 자갈층에 스며들어 흐르는 수원은?","o":["천수","해수","복류수","용천수","호소수"],"a":3,"e":"복류수는 하천이나 호수 바닥의 모래·자갈층에 스며들어 흐르는 물로, 지표수와 지하수의 중간 성질을 가지며 자연여과되어 수질이 비교적 좋다. 용천수는 지하수가 지표로 자연히 솟아 나온 물이다."},{"id":"46-1-46","r":46,"p":1,"n":46,"s":"환경위생학","q":"지하수에 해당하는 수원은?","o":["해수","심층수","하천수","호소수","저수지수"],"a":2,"e":"심층수는 불투수층 아래 깊은 대수층의 지하수(피압지하수)로, 천층수·복류수·용천수와 함께 지하수에 속한다. 하천수·호소수·저수지수는 지표수, 해수는 별도 수원이다."},{"id":"46-1-47","r":46,"p":1,"n":47,"s":"환경위생학","q":"우리나라 수자원 중 최근 이용 비율이 가장 높은 것은?","o":["공업용수","농업용수","생활용수","소방용수","하천유지용수"],"a":2,"e":"우리나라 수자원 이용량 중 가장 큰 비중을 차지하는 것은 논농사 중심의 농업용수이며, 그다음이 생활용수, 하천유지용수, 공업용수 순이다. 생활용수가 가장 많다고 착각하기 쉽다. ※ 교재 확인 권장"},{"id":"46-1-48","r":46,"p":1,"n":48,"s":"환경위생학","q":"지표수와 비교하여 지하수의 일반적인 특징으로 옳은 것은?","o":["경도가 낮다.","탁도가 높다.","자정속도가 빠르다.","미생물 오염이 심하다.","계절에 따른 수온의 변화가 적다."],"a":5,"e":"지하수는 지층 속에 있어 기온 영향을 덜 받으므로 계절에 따른 수온 변화가 적다. 지하수는 광물질이 녹아 있어 경도가 높고, 토양 여과로 탁도와 미생물 오염은 낮으며, 산소·햇빛이 부족해 자정속도는 느리다."},{"id":"46-1-49","r":46,"p":1,"n":49,"s":"환경위생학","q":"물의 전도현상으로 부영양화가 발생하는 수원은?","o":["호소수","복류수","심층수","용천수","지하수"],"a":1,"e":"호소수는 봄·가을에 표층과 저층의 수온(밀도) 차가 없어지면서 물이 뒤섞이는 전도현상이 일어나, 바닥의 영양염류(질소·인)가 표층으로 올라와 조류가 번식하는 부영양화를 일으킨다. 지하수·심층수·용천수·복류수는 성층과 전도가 일어나는 정체수역이 아니다."},{"id":"46-1-50","r":46,"p":1,"n":50,"s":"환경위생학","q":"하천의 자정작용에 대한 설명으로 옳은 것은?","o":["여름보다 겨울에 잘 일어난다.","와류가 없는 곳에서 잘 일어난다.","수중의 유기물 제거는 물리적 작용이 중요하다.","수중의 생물화학적산소요구량(BOD)은 증가한다.","자갈, 모래 등으로 바닥구배가 클수록 활발하게 일어난다."],"a":5,"e":"하천 바닥에 자갈·모래가 있고 경사(구배)가 크면 유속과 와류가 커져 재폭기(산소 공급)가 활발해지므로 자정작용이 잘 일어난다. 자정작용은 수온이 높은 여름에 미생물 활동이 활발해 더 잘 일어나며, 유기물 제거는 물리적 작용보다 미생물에 의한 생물학적 분해가 중요하고, 그 결과 BOD는 감소한다."},{"id":"46-1-51","r":46,"p":1,"n":51,"s":"환경위생학","q":"밀스-라인케(Mills-Reincke) 효과가 의미하는 정수작용은?","o":["교반","여과","침사","포기","흡착"],"a":2,"e":"밀스-라인케 현상은 상수를 여과(정수 처리)하여 공급한 후 장티푸스 등 수인성 감염병뿐 아니라 일반 사망률까지 감소한 현상으로, 여과 정수의 효과를 의미한다. 포기·침사·흡착은 개별 정수 공정일 뿐 이 현상을 설명하는 개념이 아니다."},{"id":"46-1-52","r":46,"p":1,"n":52,"s":"환경위생학","q":"먹는물 수질검사에서 탁도의 단위는?","o":["CFU","NTU","ppm","MPN","mg/L"],"a":2,"e":"먹는물 수질검사에서 탁도는 산란광을 측정하는 NTU(Nephelometric Turbidity Unit)로 표시한다(먹는물 기준 1 NTU 이하, 수돗물 0.5 NTU 이하). CFU는 일반세균 집락 수, MPN은 대장균군 등의 최확수 단위이다."},{"id":"46-1-53","r":46,"p":1,"n":53,"s":"환경위생학","q":"포기(aeration)를 통해 호기성 미생물의 활성을 촉진하여 유기물을 제거하는 하수처리법은?","o":["부패조","임호프조","산화환원법","이온교환법","활성슬러지법"],"a":5,"e":"활성슬러지법은 포기조에 공기를 불어넣어(포기) 호기성 미생물 덩어리(활성슬러지)가 유기물을 산화·분해하게 한 뒤 침전시키는 대표적인 생물학적 2차 처리법이다. 부패조와 임호프조는 산소 없이 분해하는 혐기성 처리이고, 이온교환법은 이온성 물질을 제거하는 화학적·고도처리법이다."},{"id":"46-1-54","r":46,"p":1,"n":54,"s":"환경위생학","q":"하수처리시설 중 침전지에서 부유물질의 침강속도를 증가시키는 조건으로 옳은 것은?","o":["중력가속도가 적다.","처리수의 밀도가 크다.","처리수의 점성도가 크다.","부유물질의 밀도가 적다.","부유물질의 입자 직경이 크다."],"a":5,"e":"침강속도는 스토크스 법칙 V = g(ρs − ρw)d² / 18μ를 따르므로 입자 직경의 제곱에 비례해 직경이 클수록 빨리 가라앉는다. 처리수의 점성도(μ)가 크면 침강속도가 느려지고, 처리수 밀도가 크거나 부유물질 밀도가 작으면 밀도차(ρs − ρw)가 줄어 역시 느려진다."},{"id":"46-1-55","r":46,"p":1,"n":55,"s":"환경위생학","q":"하수처리 중 물리적 처리법에서 스크린(screen)으로 제거할 수 있는 물질은?","o":["총인","총질소","협잡물","바이러스","암모니아성질소"],"a":3,"e":"스크린은 하수처리 첫 단계의 물리적 처리로, 나뭇조각·비닐·종이 같은 크고 떠다니는 협잡물을 걸러 펌프와 관로를 보호한다. 총인·총질소·암모니아성질소는 물에 녹아 있는 영양염류라 생물학적·화학적 고도처리로 제거하고, 바이러스는 너무 작아 스크린에 걸리지 않고 소독으로 처리한다."},{"id":"46-1-56","r":46,"p":1,"n":56,"s":"환경위생학","q":"호소에 조류(algae)의 대량증식을 억제하기 위하여 투입하는 약품은?","o":["황산구리","과산화수소","염화제이철","황산제이철","황산마그네슘"],"a":1,"e":"호소의 부영양화로 조류가 대량 증식할 때는 살조제로 황산구리(CuSO₄)를 뿌려 조류 증식을 억제한다. 염화제이철과 황산제이철은 플록을 만드는 응집제이고, 황산마그네슘은 조류 억제 효과가 없다."},{"id":"46-1-57","r":46,"p":1,"n":57,"s":"환경위생학","q":"폐수의 화학적 처리에 사용되는 응집제는?","o":["황산(H₂SO₄)","생석회(CaO)","석회석(CaCO₃)","수산화나트륨(NaOH)","황산알루미늄(Al₂(SO₄)₃·18H₂O)"],"a":5,"e":"황산알루미늄(alum)은 물속에서 수산화알루미늄 플록을 만들어 콜로이드·부유물질을 엉기게 하는 대표 응집제이다. 생석회·석회석·수산화나트륨은 응집 시 알칼리도를 보충하거나 pH를 조절하는 약품이고, 황산은 알칼리성 폐수의 중화제이다."},{"id":"46-1-58","r":46,"p":1,"n":58,"s":"환경위생학","q":"정수처리 과정에서 염소소독의 특징은?","o":["냄새와 맛이 발생하지 않는다.","강한 소독력과 잔류효과가 없다.","오존소독보다 처리비용이 비싸다.","트리할로메탄(THM)이 생성될 수 있다.","원수의 pH 변화에 상관없이 강력한 살균력을 발휘한다."],"a":4,"e":"염소는 값싸고 소독력이 강하며 잔류효과가 있지만, 원수 속 유기물(휴믹질)과 반응해 발암성 소독부산물인 트리할로메탄(THM)을 만들 수 있다. 염소 냄새와 맛이 나고, pH가 높아지면 살균력이 강한 차아염소산(HOCl) 비율이 줄어 살균력이 떨어지므로 pH와 무관하다는 내용은 틀리다. 처리비용은 오존보다 저렴하다."},{"id":"46-1-59","r":46,"p":1,"n":59,"s":"환경위생학","q":"폐수처리에서 발생하는 탈수 슬러지의 최종 처리 방법은?","o":["개량","매립","선별","소화","압축"],"a":2,"e":"슬러지는 농축 → 소화 → 개량 → 탈수 → 최종처분 순으로 처리하며, 탈수 슬러지의 최종처분은 매립(또는 소각)이다. 소화와 개량은 탈수 이전의 중간 처리 단계이고, 선별과 압축은 주로 고형 폐기물의 중간처리 과정이다."},{"id":"46-1-60","r":46,"p":1,"n":60,"s":"환경위생학","q":"플라스틱 폐기물의 중간처리에서 절단·분쇄를 하는 주요 목적은?","o":["용적 감소 및 운반 용이","함수율 감소 및 중량 증가","유용자원 회수 및 중량 증가","표면적 증가 및 함수율 감소","혼합의 용이 및 함수율 증가"],"a":1,"e":"절단·분쇄는 폐기물 크기를 작고 균일하게 만들어 부피(용적)를 줄이고 운반·소각·매립을 쉽게 하려는 중간처리이다. 함수율을 낮추는 것은 탈수·건조의 목적이고, 분쇄한다고 중량이 늘어나지는 않는다."},{"id":"46-1-61","r":46,"p":1,"n":61,"s":"환경위생학","q":"우리나라에서 의료폐기물의 일반적인 처리 방법은?","o":["소각","중화","파쇄","탈수","재활용"],"a":1,"e":"우리나라는 폐기물관리법에 따라 감염 위험이 있는 의료폐기물을 원칙적으로 의료폐기물 전용 소각시설에서 소각 처리한다(일부는 멸균분쇄). 감염 우려 때문에 재활용은 허용되지 않으며, 중화·탈수는 의료폐기물의 일반적인 처리법이 아니다."},{"id":"46-1-62","r":46,"p":1,"n":62,"s":"환경위생학","q":"쓰레기 처리 방법 중 소각의 특징으로 옳은 것은?","o":["매립보다 처리 기간이 길다.","매립보다 처리 속도가 느리다.","대기오염물질이 발생할 우려가 있다.","소각시설 건설 부지를 취득하기 쉽다.","감염성 쓰레기의 위생적인 처리가 어렵다."],"a":3,"e":"소각은 처리 속도가 빠르고 부피 감량 효과가 크며 감염성 쓰레기를 위생적으로 처리할 수 있지만, 다이옥신·질소산화물 같은 대기오염물질이 생길 수 있다. 매립보다 처리 기간이 길거나 느리다는 내용은 반대이고, 주민 반대(님비) 때문에 소각시설 부지는 확보하기 어렵다."},{"id":"46-1-63","r":46,"p":1,"n":63,"s":"환경위생학","q":"매립지에서 유기성 폐기물의 혐기성 분해로 발생하는 가연성 가스성분은?","o":["메탄","오존","일산화탄소","질소산화물","과산화수소"],"a":1,"e":"매립지의 유기성 폐기물이 혐기성 분해되면 메탄(CH₄)과 이산화탄소가 주로 생기며, 메탄은 가연성이라 폭발 위험이 있고 에너지로 회수할 수 있다. 일산화탄소와 질소산화물은 주로 불완전 연소·고온 연소에서 생기고, 오존은 광화학 반응으로 생기는 2차 오염물질이다."},{"id":"46-1-64","r":46,"p":1,"n":64,"s":"환경위생학","q":"위해의료폐기물 중 손상성폐기물의 최대 보관기간은?","o":["10일","20일","30일","40일","50일"],"a":3,"e":"폐기물관리법 시행규칙상 손상성폐기물(주삿바늘·수술용 칼날 등)의 보관기간은 30일로, 다른 위해의료폐기물보다 길다. 조직물류·병리계·생물화학·혈액오염폐기물과 일반의료폐기물은 15일, 격리의료폐기물은 7일이다."},{"id":"46-1-65","r":46,"p":1,"n":65,"s":"환경위생학","q":"의료폐기물 중 폐백신, 폐항암제의 분류는?","o":["병리계폐기물","혈액오염폐기물","조직물류폐기물","일반의료폐기물","생물·화학폐기물"],"a":5,"e":"생물·화학폐기물에는 폐백신, 폐항암제, 폐화학치료제가 해당한다. 병리계폐기물은 시험·검사에 쓴 배양액·배양용기·슬라이드 등이고, 조직물류폐기물은 인체 조직·장기·신체 일부와 혈액·고름 등이다."},{"id":"46-1-66","r":46,"p":1,"n":66,"s":"환경위생학","q":"조명이 부적절할 때 일어나는 증상은?","o":["반상치","열경련","진폐증","청색증","안구진탕증"],"a":5,"e":"조명이 부족하거나 부적절하면 안정피로, 근시, 그리고 어두운 갱내 작업자에게 생기는 안구진탕증(눈동자가 불수의적으로 떨림)이 나타난다. 반상치는 불소 과다 섭취, 열경련은 고온 작업 시 염분 손실, 진폐증은 분진 흡입, 청색증은 질산성질소에 의한 메트헤모글로빈혈증과 관련된다."},{"id":"46-1-67","r":46,"p":1,"n":67,"s":"환경위생학","q":"전리방사선의 인체 투과력이 높은 것부터 나열한 것은?","o":["X선 > β입자 > α입자","X선 > α입자 > β입자","α입자 > β입자 > X선","α입자 > X선 > β입자","β입자 > α입자 > X선"],"a":1,"e":"투과력은 X선(γ선) > β입자 > α입자 순으로, α입자는 종이 한 장, β입자는 얇은 알루미늄판으로 막히지만 X선·γ선은 납·콘크리트가 있어야 막을 수 있다. 전리작용(전리능)은 반대로 α > β > X선 순이라 두 순서를 헷갈리지 않도록 한다."},{"id":"46-1-68","r":46,"p":1,"n":68,"s":"환경위생학","q":"석면보다 유해성이 낮은 유리섬유를 사용하여 작업환경을 개선하는 원칙은?","o":["격리","밀폐","대치","환기","교육"],"a":3,"e":"유해한 물질·공정·시설을 덜 유해한 것으로 바꾸는 원칙은 대치이며, 석면을 유리섬유로 바꾸는 것이 대표적인 예이다. 격리는 유해 요인과 작업자 사이를 물리적으로 차단하는 것이고, 밀폐는 발생원을 덮어 새지 않게 하는 격리의 한 방법이다. 환기는 오염 공기를 배출·희석하는 것이다."},{"id":"46-1-69","r":46,"p":1,"n":69,"s":"환경위생학","q":"포자 형성균을 포함한 모든 미생물을 멸균하는 가장 좋은 방법은?","o":["저온소독법","고온멸균법","자비멸균법","고압증기멸균법","고온단시간멸균법"],"a":4,"e":"고압증기멸균법은 고압솥(autoclave)에서 약 121 ℃(15파운드)로 15~20분 처리해 아포(포자)를 포함한 모든 미생물을 사멸시키는 가장 확실한 멸균법이다. 자비멸균(100 ℃ 끓는 물)은 아포를 완전히 죽이지 못하고, 저온소독법(약 63 ℃ 30분)은 우유처럼 영양 손실을 줄이며 병원균만 죽이는 방법이다."},{"id":"46-1-70","r":46,"p":1,"n":70,"s":"환경위생학","q":"사람의 피부 상처 부위에 사용하는 소독제는?","o":["3 % 과산화수소수","3 % 에틸렌옥사이드","10 % 표백분","10 % 포르말린","10 % 차아염소산나트륨"],"a":1,"e":"3 % 과산화수소수는 조직 내 카탈레이스와 반응해 산소를 발생시키며 살균하고 자극이 적어 피부 상처나 구강 소독에 쓴다. 포르말린·차아염소산나트륨·표백분은 자극이 강해 기구·실내·물 소독용이고, 에틸렌옥사이드는 기구를 멸균하는 가스이다."},{"id":"46-1-71","r":46,"p":1,"n":71,"s":"환경위생학","q":"소독제의 살균력을 비교하기 위한 석탄산 계수 시험에 사용되는 균주는?","o":["고초균","녹농균","유산균","콜레라균","포도상구균"],"a":5,"e":"석탄산 계수 시험은 시험균으로 장티푸스균과 황색포도상구균을 사용하며, 20 ℃에서 5분 안에는 죽이지 못하고 10분 안에 죽이는 희석배수를 석탄산과 비교한다(석탄산 계수 = 소독제 희석배수 ÷ 석탄산 희석배수). 고초균은 아포를 만드는 균이라 표준 시험균으로 쓰지 않는다."},{"id":"46-1-72","r":46,"p":1,"n":72,"s":"환경위생학","q":"열을 이용하지 않는 소독 방법 중 강한 투과력으로 단시간 내에 높은 멸균 효과를 얻을 수 있는 것은?","o":["저온소독법","자비멸균법","방사선멸균법","고압증기멸균법","유통증기멸균법"],"a":3,"e":"방사선멸균법은 코발트-60의 γ선 등을 쬐어 멸균하는 방법으로, 열을 쓰지 않고 투과력이 강해 포장된 상태 그대로 단시간에 멸균할 수 있다(냉살균). 저온소독·자비멸균·고압증기멸균·유통증기멸균은 모두 열을 이용하는 방법이다."},{"id":"46-1-73","r":46,"p":1,"n":73,"s":"환경위생학","q":"활성탄을 이용하여 휘발성유기화합물을 처리하는 방법은?","o":["흡착법","흡수법","여과법","관성력법","사이클론법"],"a":1,"e":"흡착법은 표면적이 넓은 활성탄의 표면에 휘발성유기화합물(VOCs) 분자를 붙잡아 제거하는 방법이다. 흡수법은 가스를 물 같은 액체 흡수제에 녹여 제거하는 방법이고, 관성력법과 사이클론법은 먼지 같은 입자상 물질을 모으는 집진법이다."},{"id":"46-1-74","r":46,"p":1,"n":74,"s":"환경위생학","q":"창의 채광 효과를 높이는 조건으로 옳은 것은?","o":["개각은 관계가 없다.","입사각은 관계가 없다.","개각은 작을수록 좋다.","입사각과 개각이 작아야 한다.","입사각과 개각이 커야 한다."],"a":5,"e":"채광 효과를 높이려면 입사각은 28° 이상, 개각은 4~5° 이상으로 클수록 좋고, 창 면적은 바닥 면적의 1/5~1/7 이상이 적당하다. 입사각과 개각이 관계없거나 작을수록 좋다는 내용은 모두 틀리다."},{"id":"46-1-75","r":46,"p":1,"n":75,"s":"환경위생학","q":"일반적인 실내 온·습도의 적정 조건으로 옳은 것은?","o":["18~20 ℃, 10~30 %","18~20 ℃, 40~70 %","18~20 ℃, 80~100 %","28~30 ℃, 10~30 %","28~30 ℃, 80~100 %"],"a":2,"e":"일반적인 실내 적정 온도는 18 ± 2 ℃, 적정 습도는 40~70 %이다. 습도가 30 % 이하로 너무 낮으면 호흡기 점막이 건조해지고, 80 % 이상으로 너무 높으면 불쾌감이 커지고 곰팡이·진드기가 잘 번식한다."},{"id":"46-1-76","r":46,"p":1,"n":76,"s":"위생곤충학","q":"분류학상 곤충강(Insecta)에 속하는 것은?","o":["거미","노래기","물벼룩","진드기","작은빨간집모기"],"a":5,"e":"곤충강은 몸이 머리·가슴·배 3부분으로 나뉘고 가슴에 다리 3쌍이 있으며, 모기(작은빨간집모기)는 파리목 곤충이다. 거미와 진드기는 다리가 4쌍인 거미강, 노래기는 배각강, 물벼룩은 갑각강에 속한다."},{"id":"46-1-77","r":46,"p":1,"n":77,"s":"위생곤충학","q":"곤충의 혈액인 혈림프액(hemolymph)에 있는 혈구(hemocyte)의 역할은?","o":["노폐물 저장","이물질 탐식","탈피과정 억제","호흡작용 억제","수분 증발 억제"],"a":2,"e":"혈림프액의 혈구는 침입한 세균·이물질을 탐식(식균작용)하거나 캡슐로 싸서 제거하고, 상처 부위의 응고에도 관여한다. 노폐물 처리는 주로 말피기관이 맡고, 호흡은 혈액이 아니라 기관계가 직접 담당한다."},{"id":"46-1-78","r":46,"p":1,"n":78,"s":"위생곤충학","q":"생활주기에 따라 방제 방법을 달리 적용하는 위생곤충은?","o":["모기","바퀴","빈대","진드기","흡혈노린재"],"a":1,"e":"모기는 알·유충·번데기는 물속에서, 성충은 육상에서 사는 완전변태 곤충이라 유충은 서식처 제거·살유충제·천적으로, 성충은 공간살포·잔류분무로 단계별로 방제 방법을 달리한다. 바퀴·빈대·흡혈노린재는 불완전변태라 약충과 성충이 같은 장소에서 비슷하게 살기 때문에 같은 방법으로 함께 방제한다."},{"id":"46-1-79","r":46,"p":1,"n":79,"s":"위생곤충학","q":"위생곤충이 주는 피해로 옳은 것은?","o":["빈대 – 체내 기생","독거미 – 생물학적 전파","옴진드기 – 화학적 외상","등에 – 호르몬 분비 교란","모기 – 흡혈로 질병 매개"],"a":5,"e":"모기는 흡혈하면서 말라리아·일본뇌염·사상충증 등을 매개하는 대표적인 질병매개곤충이다. 빈대는 몸 밖에서 흡혈하는 외부기생충으로 체내 기생과는 관계가 없고, 독거미는 병원체를 생물학적으로 전파하지 않고 독에 의한 피해를 준다."},{"id":"46-1-80","r":46,"p":1,"n":80,"s":"위생곤충학","q":"곤충 체내에서 개체 수의 변화 없이 발육만 하는 병원체와 질병은?","o":["리케차 – 발진열","바이러스 – 황열","원충 – 말라리아","리케차 – 로키산홍반열","선충 – 말레이사상충증"],"a":5,"e":"발육형 전파는 병원체가 곤충 체내에서 수가 늘지 않고 발육(형태 변화)만 하는 것으로, 모기 체내의 사상충(선충)이 대표적이다. 말라리아 원충은 수가 늘면서 발육도 하는 발육증식형이고, 황열 바이러스와 발진열 리케차는 수만 늘어나는 증식형이다."},{"id":"46-1-81","r":46,"p":1,"n":81,"s":"위생곤충학","q":"불쾌곤충(nuisance)의 설명으로 옳은 것은?","o":["사회적 환경과 무관하다.","시대적 배경과 무관하다.","일상생활에 불편함을 준다.","질병매개곤충만 해당된다.","지역적 특성과 관계없다."],"a":3,"e":"불쾌곤충은 질병을 매개하지는 않지만 대량 발생하거나 생김새·냄새 등으로 혐오감을 주어 일상생활에 불편을 주는 곤충이다(깔따구, 하루살이, 노래기 등). 질병매개곤충만 해당한다는 내용은 반대이며, 무엇을 불쾌하게 여기는지는 지역적 특성, 시대적 배경, 사회적 환경에 따라 달라진다."},{"id":"46-1-82","r":46,"p":1,"n":82,"s":"위생곤충학","q":"동물의 분(糞)을 섭취하고 파헤쳐 말림으로써 파리 유충의 서식처를 제거하는 곤충은?","o":["등에","기생벌","노린재","똥풍뎅이","사슴벌레"],"a":4,"e":"똥풍뎅이는 동물의 분을 먹고 파헤쳐 흩트려 말리기 때문에 파리 유충이 자랄 서식처를 없애는 생물학적 방제 역할을 한다. 기생벌은 파리 번데기에 알을 낳아 기생하는 방식으로 파리를 줄이는 천적이라 분을 파헤치는 것과는 다르다."},{"id":"46-1-83","r":46,"p":1,"n":83,"s":"위생곤충학","q":"유기염소계 살충제는?","o":["디디티(DDT)","세사민(sesamin)","피레스린(pyrethrin)","파라티온(parathion)","벤질벤조에이트(benzyl benzoate)"],"a":1,"e":"DDT는 BHC, 디엘드린, 린덴과 함께 대표적인 유기염소계 살충제로, 잔류성이 매우 길어 환경 문제를 일으킨다. 파라티온은 유기인계, 피레스린은 제충국 유래의 천연 피레스로이드이고, 세사민은 살충력을 높여 주는 협력제이다."},{"id":"46-1-84","r":46,"p":1,"n":84,"s":"위생곤충학","q":"살충제에서 분제(dust) 입자의 크기 범위는?","o":["100 μm 이하","150~200 μm","300~400 μm","500 μm 이상","1,000 μm 이상"],"a":1,"e":"분제(dust)는 살충제 원제를 활석·점토 같은 증량제와 섞은 가루약으로, 입자 크기가 100 μm 이하로 매우 곱다. 이보다 굵은 알갱이 형태는 입제로 분류한다."},{"id":"46-1-85","r":46,"p":1,"n":85,"s":"위생곤충학","q":"살충제의 급성독성에 관한 설명으로 옳은 것은?","o":["급성 경구독성도의 분류는 3가지이다.","급성 경피독성도의 분류는 4가지이다.","경구 및 경피독성도는 g/kg으로 표시한다.","흡입독성은 1 m³ 내의 약제농도를 g으로 표시한다.","고독성 살충제 용기에는 ‘해골과 2개의 뼈를 X자형’으로 그려 넣고 ‘POISON’으로 표시한다."],"a":5,"e":"고독성 살충제 용기에는 위험을 바로 알아볼 수 있도록 해골과 X자로 교차한 뼈 2개를 그리고 POISON이라고 표시한다. 급성 경구·경피독성은 반수치사량(LD₅₀)을 체중 1 kg당 mg(mg/kg)으로 표시하므로 g/kg 표시는 틀리다."},{"id":"46-1-86","r":46,"p":1,"n":86,"s":"위생곤충학","q":"경유 또는 석유로 희석한 살충제 용제를 400~600 ℃의 연소실을 통과시켜 입자를 0.1~40 μm로 미립화하여 에어컴프레서의 힘으로 살포하는 방법은?","o":["미스트","가열연막","분제살포","잔류분무","극미량연무"],"a":2,"e":"가열연막은 살충제를 경유·석유에 희석해 고온의 연소실을 통과시키고, 0.1~40 μm 크기의 연기 형태로 만들어 공간에 퍼뜨리는 방법이다. 극미량연무(ULV)는 열을 쓰지 않고 고농도 원제를 그대로 미세하게 분사하며, 잔류분무는 벽면 등에 약제를 뿌려 남겨 두는 방법이다."},{"id":"46-1-87","r":46,"p":1,"n":87,"s":"위생곤충학","q":"곤충의 저항성 중 한 약제에 대한 저항성이 생겼을 때 그와 화학구조가 유사한 다른 약제에 대해서도 저항성을 나타내는 것은?","o":["내성","돌연변이","교차저항성","생리적 저항성","생태적 저항성"],"a":3,"e":"교차저항성은 한 약제에 저항성이 생기면 화학구조나 작용기전이 비슷한 다른 약제에도 저항성을 보이는 현상이다. 생리적 저항성은 해독효소 증가 등 생리 기능으로 약제를 견디는 것이고, 생태적(행동) 저항성은 약제가 있는 곳을 피하는 습성이 생기는 것이다. 내성은 유전적 선택과 관계없이 원래 약제에 강한 체질을 말한다."},{"id":"46-1-88","r":46,"p":1,"n":88,"s":"위생곤충학","q":"피레스로이드계 살충제 중 천연 살충제는?","o":["피레스린(pyrethrin)","퍼메스린(permethrin)","델타메스린(deltamethrin)","사이페노스린(cyphenothrin)","사이퍼메스린(cypermethrin)"],"a":1,"e":"피레스린은 제충국(국화과 식물) 꽃에서 추출한 천연 살충 성분으로, 속효성이 좋고 온혈동물 독성이 낮다. 퍼메스린·델타메스린·사이퍼메스린·사이페노스린은 피레스린 구조를 본떠 만든 합성 피레스로이드이다."},{"id":"46-1-89","r":46,"p":1,"n":89,"s":"위생곤충학","q":"만성살서제에 관한 설명으로 옳은 것은?","o":["단일투여제","혈액응고제","사전미끼 필요","독성 작용은 섭취 후 1~2시간 내에 신속히 발현","저농도의 약제를 4~5회 중복 투여하는 것이 효과적임"],"a":5,"e":"만성살서제(와파린 같은 쿠마린계 항응혈제)는 독성이 낮은 저농도 약제를 4~5회 반복해서 먹어야 혈액응고가 억제되어 내출혈로 죽기 때문에 중복 투여가 효과적이다. 단일투여, 사전미끼 필요, 1~2시간 내 신속한 발현은 급성살서제의 특징이고, 만성살서제는 혈액응고제가 아니라 혈액이 굳지 않게 하는 항응고제이다."},{"id":"46-1-90","r":46,"p":1,"n":90,"s":"위생곤충학","q":"암컷의 날개가 짧아서 복부(abdomen)를 반만 덮고 있는 바퀴는?","o":["먹바퀴","집바퀴","경도바퀴","독일바퀴","이질바퀴"],"a":2,"e":"집바퀴(일본바퀴)는 암컷의 날개가 짧아 복부의 절반 정도만 덮고, 수컷은 날개가 복부 끝까지 덮는다. 이질바퀴와 먹바퀴는 대형 종으로 암수 모두 날개가 잘 발달해 있고, 독일바퀴는 앞가슴등판에 검은 세로줄 2개가 있는 소형 종이다."},{"id":"46-1-91","r":46,"p":1,"n":91,"s":"위생곤충학","q":"모기의 생물학적 방제 방법은?","o":["공간 살포","잔류 분무","천적 이용","방충망 설치","발육억제제 살포"],"a":3,"e":"생물학적 방제는 천적을 이용하는 것으로, 모기 유충에는 미꾸라지·송사리 같은 유충 포식어나 Bti 같은 미생물 살충제를 쓴다. 공간 살포·잔류 분무·발육억제제 살포는 화학적 방제이고, 방충망 설치는 물리적 방제이다."},{"id":"46-1-92","r":46,"p":1,"n":92,"s":"위생곤충학","q":"아파트 정화조에 집단 서식하면서 사람을 공격하는 모기는?","o":["지하집모기","토고숲모기","큰검정들모기","작은빨간집모기","중국얼룩날개모기"],"a":1,"e":"지하집모기는 아파트 정화조·지하실 물웅덩이 같은 지하 공간에서 집단으로 서식하며, 흡혈하지 않고도 첫 산란이 가능하고 겨울에도 활동하며 사람을 문다. 작은빨간집모기는 논·늪에서 발생하는 일본뇌염 매개종이고, 중국얼룩날개모기는 논에서 발생하는 말라리아 매개종이다."},{"id":"46-1-93","r":46,"p":1,"n":93,"s":"위생곤충학","q":"상수원에서 모기유충이 발견되었다. 유충 방제를 위해 사용할 수 있는 살충제는?","o":["이피엔(EPN)","템포스(temephos)","아레스린(allethrin)","디크로보스(dichlorvos)","벤디오카브(bendiocarb)"],"a":2,"e":"템포스(temephos, 아베이트)는 유기인계이지만 사람·온혈동물에 대한 독성이 매우 낮아 상수원·음용수의 모기 유충 방제에 쓸 수 있는 살유충제이다. 이피엔·디크로보스는 독성이 높은 유기인계, 벤디오카브는 카바메이트계 잔류분무제로 식수원에 넣기에 적합하지 않다."},{"id":"46-1-94","r":46,"p":1,"n":94,"s":"위생곤충학","q":"깔따구의 특성으로 옳은 것은?","o":["구부가 발달되어 있다.","알레르기를 유발하는 곤충이다.","분류학적으로 환봉아목에 속한다.","암수 모두 식물성 즙을 먹고 산다.","날개를 포함한 몸 전체에 비늘이 있다."],"a":2,"e":"깔따구는 대량 발생하면 죽은 성충의 몸 조각이 공기 중에 날려 천식 같은 알레르기를 유발하는 불쾌곤충이다. 성충은 입 부분(구부)이 퇴화해 거의 먹지 않으며, 분류학적으로는 모기와 같은 장각아목(모기아목)에 속하고 모기와 달리 몸에 비늘이 없다."},{"id":"46-1-95","r":46,"p":1,"n":95,"s":"위생곤충학","q":"모래파리에 관한 설명으로 옳은 것은?","o":["수면병을 매개한다.","수생식물의 잎 뒷면에 산란한다.","앉아 있을 때는 날개를 수직으로 세운다.","성충은 체장이 8~9 mm로 모기와 비슷하다.","암수가 다른 특이한 구조의 촉각을 가지고 있다."],"a":3,"e":"모래파리는 앉아 있을 때 날개를 V자 모양으로 수직으로 세우는 것이 특징이며, 리슈마니아증·파파타시열 등을 매개한다. 몸길이는 1.5~3 mm 정도로 매우 작고 털이 많으며, 물이 아닌 습한 흙이나 틈새에 산란한다. 수면병은 체체파리가 매개한다."},{"id":"46-1-96","r":46,"p":1,"n":96,"s":"위생곤충학","q":"유충의 두부에 한 쌍의 부채 모양을 한 구기쇄모(mouth brush)를 갖고 있는 위생곤충은?","o":["바퀴","빈대","독나방","먹파리","초파리"],"a":4,"e":"먹파리(곱추파리) 유충은 흐르는 물속 돌이나 수초에 붙어 살며, 머리에 있는 한 쌍의 부채 모양 구기쇄모로 물속 유기물을 걸러 먹는다. 먹파리는 회선사상충증을 매개하며, 초파리·바퀴·빈대·독나방 유충에는 이런 구조가 없다."},{"id":"46-1-97","r":46,"p":1,"n":97,"s":"위생곤충학","q":"파리의 기관낭(tracheal air sac)에 대한 설명으로 옳은 것은?","o":["탈피를 억제한다.","체온을 올려 준다.","이산화탄소 공급을 늘려 준다.","날아갈 때 체중을 가볍게 한다.","공기를 배출하여 몸체를 작게 한다."],"a":4,"e":"기관낭은 기관 일부가 주머니 모양으로 부풀어 공기를 저장하는 구조로, 날 때 몸의 비중을 낮춰 체중을 가볍게 하는 역할을 한다. 체온을 올리거나 탈피를 억제하는 기능과는 관계가 없다."},{"id":"46-1-98","r":46,"p":1,"n":98,"s":"위생곤충학","q":"사람에게 질병을 매개하지 않고, 2시간 간격으로 흡혈하는 위생곤충은?","o":["몸이","벼룩","빈대","머릿니","진드기"],"a":4,"e":"머릿니는 사람 머리털에 살며 질병을 매개하지 않고, 짧은 간격으로 자주 흡혈하는 것이 특징이다. 몸이는 발진티푸스·참호열·재귀열을 매개하고, 벼룩은 페스트·발진열을 매개한다. 빈대도 질병을 매개하지 않지만 며칠 간격으로 흡혈한다는 점이 다르다."},{"id":"46-1-99","r":46,"p":1,"n":99,"s":"위생곤충학","q":"흡혈 후 바로 수분을 배설하여 가구나 벽에 갈색 흔적을 남기는 위생곤충은?","o":["바퀴","빈대","깔따구","침파리","나방파리"],"a":2,"e":"빈대는 흡혈 직후 수분을 바로 배설해 가구 틈이나 벽, 침구에 갈색~흑색 점 모양의 흔적을 남기며, 취선에서 나는 특유의 냄새도 있다. 바퀴도 배설물 흔적을 남기지만 흡혈하지 않는 잡식성 곤충이다."},{"id":"46-1-100","r":46,"p":1,"n":100,"s":"위생곤충학","q":"페스트가 유행할 때 우선적으로 실시해야 하는 간접적 방제법은?","o":["쥐덫 설치","불임약제 처리","쥐의 천적 방사","급성살서제 살포","쥐구멍에 살충제 분제 살포"],"a":5,"e":"페스트 유행 시 쥐를 먼저 죽이면 쥐벼룩이 숙주를 잃고 사람에게 옮겨와 감염이 오히려 늘어난다. 그래서 먼저 쥐구멍에 살충제 분제를 뿌려 매개체인 쥐벼룩을 없애고, 그다음에 살서제·쥐덫으로 쥐를 구제한다."},{"id":"46-1-101","r":46,"p":1,"n":101,"s":"위생곤충학","q":"독나방의 독모에 관한 설명으로 옳은 것은?","o":["독모는 독낭 속에 저장된다.","독모는 성충 시기에 생성된다.","독모는 복부 말단에서 생성된다.","독모의 양 끝은 굵기와 모양이 동일하다.","독모는 요철(凹凸)형으로 길게 연결되어 있다."],"a":5,"e":"독나방의 독모는 끝이 요철 모양으로 길게 이어진 미세한 털로, 피부에 박히면 쉽게 부러지며 피부염을 일으킨다. 독모는 성충이 아니라 유충 시기에 생성되며, 암컷 성충은 복부 끝 털에 독모를 묻혀 알 덩어리를 덮는다. 독모는 별도의 독낭에 저장되지 않는다. ※ 교재 확인 권장"},{"id":"46-1-102","r":46,"p":1,"n":102,"s":"위생곤충학","q":"옥외에 개미집이 있을 때 최적의 방제법은?","o":["개미집을 흙으로 덮는다.","개미집 입구에 강한 빛을 쪼인다.","개미집 입구를 나뭇가지로 틀어 막는다.","개미집 입구를 넓히고 끓는 물을 충분히 붓는다.","개미집 근처에 미끼를 놓아 집에서 모두 나오게 한다."],"a":4,"e":"옥외 개미집은 입구를 넓히고 끓는 물을 충분히 부어 집 안의 여왕개미와 유충까지 한꺼번에 죽이는 것이 효과적이다. 흙으로 덮거나 나뭇가지로 막으면 다른 출구를 뚫거나 근처로 옮겨 가므로 근본적인 방제가 되지 않는다."},{"id":"46-1-103","r":46,"p":1,"n":103,"s":"위생곤충학","q":"진드기를 아목(Suborder)별로 분류하는 기준은?","o":["기문 위치","다리 구조","순판 모양","의두 길이","구하체 존재"],"a":1,"e":"진드기류(진드기목)는 숨구멍인 기문의 위치(또는 유무)로 아목을 나눈다. 후기문아목(참진드기 등), 중기문아목, 전기문아목(털진드기 등), 무기문아목(옴진드기 등)이 있다. 다리 구조나 순판 모양은 과·속 수준을 구별할 때 쓰는 형질이다."},{"id":"46-1-104","r":46,"p":1,"n":104,"s":"위생곤충학","q":"참진드기과의 형태에 대한 설명으로 옳은 것은?","o":["촉수는 길고 움직인다.","암컷은 수컷보다 몸이 더 크다.","기문은 의두와 제1각 사이에 위치한다.","다리는 짧고 뭉뚝하며 끝에 흡반이 있다.","순판은 발육 기간 중 성충 시기에만 볼 수 있다."],"a":2,"e":"참진드기과는 수컷은 등쪽 전체가 딱딱한 순판으로 덮여 있지만 암컷은 앞부분에만 순판이 있어, 흡혈하면 몸이 크게 부풀어 수컷보다 훨씬 커진다. 기문은 제4다리 밑마디 뒤쪽에 있고, 순판은 성충뿐 아니라 유충·약충 시기에도 있다. 촉수가 길고 움직인다는 내용은 물렁진드기과에 가까운 특징이다."},{"id":"46-1-105","r":46,"p":1,"n":105,"s":"위생곤충학","q":"주택 주변의 하수구나 땅굴에서 생활하는 쥐는?","o":["곰쥐","생쥐","시궁쥐","멧밭쥐","등줄쥐"],"a":3,"e":"시궁쥐(집쥐)는 몸집이 크고 굴을 잘 파며 헤엄을 잘 쳐서 하수구, 땅굴, 습한 곳 같은 낮은 장소에 서식한다. 곰쥐(지붕쥐)는 오르기를 잘해 천장·지붕 같은 높은 곳에, 생쥐는 실내 창고·서랍에 살고, 등줄쥐는 등에 검은 줄이 있는 들쥐로 신증후군출혈열을 매개한다."},{"id":"46-2-1","r":46,"p":2,"n":1,"s":"공중보건학","q":"질병발생의 결정인자 중 숙주요인은?","o":["기후변화","매개곤충","화학물질","생활습관","보건의료체계"],"a":4,"e":"숙주요인은 사람 자체가 가진 특성으로 유전, 연령, 성별, 면역상태, 생활습관(흡연·음주·식습관 등)이 해당한다. 기후변화와 보건의료체계는 환경요인, 매개곤충은 생물학적 환경요인에 속한다. 화학물질은 병인(물리·화학적 병원체)으로 분류된다."},{"id":"46-2-2","r":46,"p":2,"n":2,"s":"공중보건학","q":"‘오타와 헌장’에서 제시한 건강증진을 위한 기본활동 영역 중 다음과 관련 있는 것은?","o":["개인의 기술 개발","지역사회 활동 강화","건강한 공공정책 수립","건강지향적 환경의 조성","보건의료사업 방향의 재조정"],"a":5,"b":"건강문제를 유발하는 요인이 변화함에 따라 보건의료 서비스도 질병의 치료보다 생활습관 개선 등 건강증진 중심으로 전개되어야 한다.","e":"오타와 헌장의 5대 활동영역 중 '보건의료서비스 방향의 재조정'은 보건의료가 치료 중심에서 예방·건강증진 중심으로 바뀌어야 한다는 내용으로, 제시문과 일치한다. '건강한 공공정책 수립'은 모든 부문의 정책에 건강을 고려하는 것이고, '개인의 기술 개발'은 개인이 건강관리 능력을 기르도록 교육하는 것이다."},{"id":"46-2-3","r":46,"p":2,"n":3,"s":"공중보건학","q":"질병발생과 관련된 여러 가지 복잡한 요인들이 거미줄처럼 얽혀있다고 보는 모형은?","o":["원인망 모형","웰니스 모형","수레바퀴 모형","생물의학적 모형","역학적 삼각형 모형"],"a":1,"e":"원인망(거미줄) 모형은 질병이 단일 원인이 아니라 여러 요인이 거미줄처럼 얽힌 결과로 발생한다고 보며, 만성질환 설명에 적합하다. 수레바퀴 모형은 유전적 핵을 가진 숙주를 생물학적·사회적·물리적 환경이 둘러싸는 구조이고, 역학적 삼각형 모형은 병인·숙주·환경 세 요소의 균형으로 설명한다."},{"id":"46-2-4","r":46,"p":2,"n":4,"s":"공중보건학","q":"다음과 관련 있는 질병의 유행양상은?","o":["endemic","epidemic","sporadic","pandemic","short-term"],"a":4,"b":"• 1918년 스페인독감\n• 1957년 아시아독감\n• 1968년 홍콩독감\n• 2009년 신종플루\n• 2020년 코로나바이러스감염증-19","e":"스페인독감, 아시아독감, 홍콩독감, 신종플루, 코로나19는 모두 여러 국가·대륙에 걸쳐 동시에 크게 유행한 세계적 대유행(pandemic)이다. epidemic은 특정 지역에서 평소보다 많이 발생하는 유행, endemic은 특정 지역에 늘 일정 수준으로 존재하는 토착병, sporadic은 산발적 발생을 말한다."},{"id":"46-2-5","r":46,"p":2,"n":5,"s":"공중보건학","q":"역학 연구방법 중 전향성 연구(prospective study)의 장점은?","o":["비교적 비용이 적게 든다.","희귀한 질병조사에 적합하다.","빠른 시일 내에 결론을 얻는다.","조사대상자의 수가 적어도 된다.","위험요인과 질병발생 간의 인과관계 파악이 용이하다."],"a":5,"e":"전향성(코호트) 연구는 위험요인 노출군과 비노출군을 시간 순서대로 추적하므로 원인-결과의 시간적 선후관계가 명확해 인과관계 파악이 용이하고 상대위험도를 직접 구할 수 있다. 반면 많은 대상자와 긴 시간, 큰 비용이 필요하며 희귀질환 연구에는 부적합하다(희귀질환은 환자-대조군 연구가 적합)."},{"id":"46-2-6","r":46,"p":2,"n":6,"s":"공중보건학","q":"일정 시점에서 특정 질병과 위험요인을 조사하여 질병의 유병 여부와 그 관련성을 분석하는 연구방법은?","o":["단면 연구","사례 연구","코호트 연구","혼합설계 연구","환자-대조군 연구"],"a":1,"e":"단면 연구는 일정 시점에서 질병 유무와 위험요인을 동시에 조사해 유병률과 관련성을 보는 방법으로, 유병률 조사라고도 한다. 코호트 연구는 시간 경과에 따라 추적하여 발생률을 보고, 환자-대조군 연구는 환자군과 대조군의 과거 노출을 비교한다."},{"id":"46-2-7","r":46,"p":2,"n":7,"s":"공중보건학","q":"연구대상에게 어떤 조작이나 자극을 주어 그 반응이나 결과를 보는 방법으로 원인관계를 검증함에 있어 가장 결정적인 증거를 제시해 주는 연구방법은?","o":["기술역학","분석역학","실험역학","이론역학","작전역학"],"a":3,"e":"실험역학은 연구자가 대상자에게 의도적으로 조작(중재)을 가하고 그 결과를 관찰하므로 인과관계를 가장 확실하게 입증할 수 있다. 기술역학은 인적·지역적·시간적 특성을 기술해 가설을 세우는 단계이고, 분석역학은 관찰을 통해 가설을 검증하지만 연구자가 조작을 가하지는 않는다."},{"id":"46-2-8","r":46,"p":2,"n":8,"s":"공중보건학","q":"전파가능성을 고려하여 발생 또는 유행 시 24시간 이내에 신고하여야 하는 감염병은?","o":["탄저","백일해","B형간염","레지오넬라증","비브리오패혈증"],"a":2,"e":"감염병예방법상 '전파가능성을 고려하여 발생 또는 유행 시 24시간 이내에 신고하고 격리가 필요한' 감염병은 제2급감염병이며, 백일해가 이에 해당한다. 탄저는 즉시 신고하는 제1급감염병이고, B형간염·레지오넬라증·비브리오패혈증은 발생을 계속 감시할 필요가 있는 제3급감염병이다."},{"id":"46-2-9","r":46,"p":2,"n":9,"s":"공중보건학","q":"수인성 감염병의 유행 특성은?","o":["동절기에 빈발한다.","비교적 잠복기가 짧다.","치명률과 2차 감염률이 높다.","환자 발생이 집단적 또는 폭발적이다.","성별, 직업, 연령 등에 의한 이환율의 차이가 크다."],"a":4,"e":"수인성 감염병은 오염된 물을 공동으로 사용하므로 환자가 급수지역 내에서 집단적·폭발적으로 발생하는 것이 대표적 특징이다. 치명률과 2차 감염률은 낮은 편이고, 성별·직업·연령에 따른 이환율 차이가 거의 없으며 계절과 관계없이 발생할 수 있다."},{"id":"46-2-10","r":46,"p":2,"n":10,"s":"공중보건학","q":"모기가 매개하며 발육·증식형 전파를 하는 감염병은?","o":["페스트","발진열","말라리아","장티푸스","발진티푸스"],"a":3,"e":"말라리아 원충은 중국얼룩날개모기 체내에서 발육과 증식을 함께 하는 발육·증식형 전파를 한다. 페스트·발진열(벼룩), 발진티푸스(이)는 매개체 안에서 수만 늘어나는 증식형이며, 장티푸스는 절지동물 매개가 아닌 경구 감염(파리는 기계적 전파)이다."},{"id":"46-2-11","r":46,"p":2,"n":11,"s":"공중보건학","q":"다음과 관련된 인수공통감염병은?","o":["황열","파상풍","공수병","일본뇌염","렙토스피라증"],"a":4,"b":"• 모기가 매개하는 바이러스성 감염병이다.\n• 주로 돼지가 바이러스의 증폭숙주 역할을 하는 것으로 알려져 있다.","e":"일본뇌염은 작은빨간집모기가 매개하는 바이러스성 감염병으로, 돼지가 증폭숙주 역할을 해 인수공통감염병으로 분류된다. 황열도 모기 매개 바이러스 질환이지만 돼지가 증폭숙주가 아니며, 공수병은 개 등에 물려 감염되고, 렙토스피라증은 쥐 등의 소변에 오염된 물·흙으로 감염된다."},{"id":"46-2-12","r":46,"p":2,"n":12,"s":"공중보건학","q":"주로 소아에게 나타나며, 중추신경계의 손상으로 영구적인 하지마비를 일으키는 소화기계 감염병은?","o":["수두","한센병","폴리오","성홍열","수막구균 감염증"],"a":3,"e":"폴리오는 분변-경구 경로로 감염되는 소화기계 감염병으로, 바이러스가 척수 전각세포 등 중추신경계를 침범해 영구적인 이완성 하지마비를 일으키며 주로 소아에게 발생한다. 수두와 수막구균 감염증은 비말 등 호흡기계로 전파되고, 한센병은 피부·말초신경을 침범한다."},{"id":"46-2-13","r":46,"p":2,"n":13,"s":"공중보건학","q":"B형간염의 설명으로 옳은 것은?","o":["제2급감염병이다.","유행성 간염이라고도 한다.","질병관리청장이 고시하는 생물테러감염병에 해당한다.","우리나라는 의료관련감염병으로 지정하여 관리하고 있다.","주산기 감염, 수혈, 침습적 시술, 성접촉 등으로 전파된다."],"a":5,"e":"B형간염은 혈액·체액을 통해 전파되며 주산기(수직) 감염, 수혈, 오염된 주사기 등 침습적 시술, 성접촉이 주요 경로이다. 감염병예방법상 제3급감염병이며, '유행성 간염'은 경구 감염되는 A형간염을 가리킨다. 의료관련감염병은 MRSA·VRSA 등 제4급의 항생제 내성균 감염증이다."},{"id":"46-2-14","r":46,"p":2,"n":14,"s":"공중보건학","q":"심·뇌혈관질환환자를 줄이기 위한 1차 예방 활동은?","o":["급성기 집중처치","지속적 재활 관리","조기 진단 및 치료","응급이송 및 응급실 대응","금연, 금주 등 건강행태 개선"],"a":5,"e":"1차 예방은 질병 발생 전 단계에서 건강증진과 위험요인 제거로 발병 자체를 막는 것으로, 금연·금주·식이·운동 등 건강행태 개선이 해당한다. 조기 진단 및 치료는 2차 예방, 재활 관리는 3차 예방이며, 응급이송·급성기 처치는 이미 발병한 뒤의 대응이다."},{"id":"46-2-15","r":46,"p":2,"n":15,"s":"공중보건학","q":"2023년 기준 우리나라에서 사망률이 가장 높은 암은?","o":["폐암","간암","위암","대장암","갑상선암"],"a":1,"e":"통계청 2023년 사망원인통계에서 암 사망률 1위는 폐암이며, 그 다음이 간암, 대장암 순이다. 갑상선암은 발생률은 높지만 예후가 좋아 사망률은 낮다."},{"id":"46-2-16","r":46,"p":2,"n":16,"s":"공중보건학","q":"자궁경부암과 관련 있는 병원체는?","o":["지카바이러스","엔테로바이러스","마버그바이러스","에볼라바이러스","사람유두종바이러스"],"a":5,"e":"자궁경부암의 주요 원인은 사람유두종바이러스(HPV, 특히 16·18형) 지속 감염이며, 예방접종으로 예방할 수 있다. 지카바이러스는 소두증, 엔테로바이러스는 수족구병, 마버그·에볼라바이러스는 출혈열과 관련된다."},{"id":"46-2-17","r":46,"p":2,"n":17,"s":"공중보건학","q":"다음에서 설명하는 보건행정의 특성은?","o":["봉사성","조장성","연속성","기술성","합법성"],"a":2,"b":"지역사회 보건사업은 주민들과 함께 추진할 때 더 큰 성과를 얻을 수 있기 때문에 주민들이 참여할 수 있는 여건과 분위기를 만드는 것이 중요하다.","e":"조장성은 행정기관이 일방적으로 시행하기보다 주민의 자발적 참여를 유도하고 교육·지원을 통해 사업을 촉진하는 특성으로, 주민 참여 여건 조성을 강조한 제시문과 일치한다. 봉사성은 국민에게 적극적으로 서비스를 제공하는 공공성이고, 기술성은 보건의료의 전문지식과 기술을 바탕으로 한다는 특성이다."},{"id":"46-2-18","r":46,"p":2,"n":18,"s":"공중보건학","q":"1885년 설립된 우리나라 최초의 서양식 의료기관은?","o":["광혜원","상약국","태의감","활인서","혜민서"],"a":1,"e":"광혜원은 1885년 미국 선교사 알렌(H. N. Allen)의 건의로 설립된 우리나라 최초의 서양식 국립의료기관으로, 곧 제중원으로 개칭되었다. 혜민서와 활인서는 조선시대 서민 구료기관, 태의감은 고려시대 의료행정기관이다."},{"id":"46-2-19","r":46,"p":2,"n":19,"s":"공중보건학","q":"「지역보건법」상 보건소의 업무 중에서 특별히 지역주민의 만성질환 예방 및 건강한 생활습관 형성을 지원하는 기관은?","o":["국립암센터","국립재활원","대한보건협회","건강생활지원센터","한국건강증진개발원"],"a":4,"e":"지역보건법상 건강생활지원센터는 보건소 업무 중 지역주민의 만성질환 예방과 건강한 생활습관 형성을 지원하기 위해 읍·면·동 단위에 설치할 수 있는 기관이다. 한국건강증진개발원은 국민건강증진정책을 지원하는 공공기관이고, 국립재활원은 장애인 재활 전문 국립기관이다."},{"id":"46-2-20","r":46,"p":2,"n":20,"s":"공중보건학","q":"보건소의 기능 및 업무 내용으로 옳은 것은?","o":["식품첨가물의 규격 검사 및 연구","모성과 영유아의 건강유지·증진","신의료기술 평가방법 및 기준 개발","일반 및 기능성 화장품의 안전성 검사","비용 효과적인 환자 중심의 보건의료기술 개발"],"a":2,"e":"지역보건법상 보건소는 지역보건의료서비스 제공 기능의 하나로 모성과 영유아의 건강유지·증진 업무를 수행한다. 식품첨가물 규격과 화장품 안전성은 식품의약품안전처 소관이고, 신의료기술 평가와 환자 중심 보건의료기술 개발은 한국보건의료연구원 등의 업무이다."},{"id":"46-2-21","r":46,"p":2,"n":21,"s":"공중보건학","q":"「농어촌 등 보건의료를 위한 특별조치법」상 의료 취약지역에 설치·운영되는 보건의료시설은?","o":["보건소","보건지소","보건의료원","보건진료소","한국보건의료연구원"],"a":4,"e":"보건진료소는 농어촌 등 보건의료를 위한 특별조치법에 근거해 의사가 없는 의료 취약지역에 설치되며, 보건진료 전담공무원이 경미한 의료행위를 한다. 보건소·보건지소·보건의료원은 지역보건법에 근거한 시설이다."},{"id":"46-2-22","r":46,"p":2,"n":22,"s":"공중보건학","q":"제2차 세계대전 직후에 전쟁으로 피해를 받은 국가의 어린이들을 돕기 위하여 설립된 국제기구는?","o":["UNDP","UNEP","UNDCP","UNICEF","UNESCO"],"a":4,"e":"UNICEF(유엔아동기금)는 1946년 제2차 세계대전 피해국 아동을 긴급 구호하기 위해 설립되었다. UNDP는 개발계획, UNEP는 환경계획, UNESCO는 교육·과학·문화기구, UNDCP는 마약통제계획이다."},{"id":"46-2-23","r":46,"p":2,"n":23,"s":"공중보건학","q":"다음의 (   ) 안에 들어 갈 용어는?","o":["생활급여","의료급여","자활급여","사회서비스","기초생활보장"],"a":4,"b":"「사회보장기본법」상 “사회보장이란 출산, 양육, 실업, 노령, 장애, 질병, 빈곤 및 사망 등의 사회적 위험으로부터 모든 국민을 보호하고 국민 삶의 질을 향상시키는 데 필요한 소득·서비스를 보장하는 사회보험, 공공부조, (          )을/를 말한다.”라고 정의하고 있다.","e":"사회보장기본법은 사회보장을 사회보험, 공공부조, 사회서비스로 구성된다고 정의한다. 생활급여·의료급여·자활급여는 국민기초생활보장법상 공공부조의 급여 종류일 뿐 사회보장의 구성 영역이 아니다."},{"id":"46-2-24","r":46,"p":2,"n":24,"s":"공중보건학","q":"연초 인구가 100명인 A 지역에서 1년 동안 10명이 사망하고 15명이 출생하였다. 이 지역 전입자와 전출자 수가 같았다면 연간 인구증가율은?","o":["2 %","5 %","10 %","15 %","20 %"],"a":2,"e":"【공식】
