p":1,"n":4,"s":"위생관계법령","q":"「공중위생관리법」상 위생사의 업무범위가 <u>아닌</u> 것은?","o":["위생용품의 위생관리","공중위생영업소의 위생관리","음료수의 처리 및 위생관리","유해 곤충·설치류 및 매개체 관리","공중이용시설기준 적합 여부의 확인"],"a":5,"e":"공중위생관리법상 위생사 업무는 공중위생영업소·공중이용시설·위생용품의 위생관리, 음료수의 처리 및 위생관리, 폐기물 처리, 식품 등의 위생관리, 유해 곤충·설치류 및 매개체 관리 등이다. 공중이용시설기준 적합 여부의 확인은 행정기관 소속 공중위생감시원의 감시 업무이지 위생사의 업무범위가 아니다."},{"id":"43-1-5","r":43,"p":1,"n":5,"s":"위생관계법령","q":"「공중위생관리법」상 (   )에 들어갈 것으로 옳은 것은?","o":["1년","2년","3년","4년","5년"],"a":2,"b":"위생교육 실시단체의 장은 위생교육을 수료한 자에게 수료증을 교부하고, 수료증 교부대장 등 교육에 관한 기록을 (   ) 이상 보관·관리하여야 한다.","e":"공중위생관리법 시행규칙상 위생교육 실시단체의 장은 수료증을 교부하고, 수료증 교부대장 등 교육에 관한 기록을 2년 이상 보관·관리해야 한다. 폐기물 장부 보존기간(3년) 등 다른 법의 보존기간과 헷갈리지 않도록 주의한다."},{"id":"43-1-6","r":43,"p":1,"n":6,"s":"위생관계법령","q":"「식품위생법」상 식품위생법의 목적이 <u>아닌</u> 것은?","o":["식품생산의 합리적 관리","국민보건의 증진에 이바지","식품영양의 질적 향상 도모","식품에 관한 올바른 정보 제공","식품으로 인하여 생기는 위생상의 위해 방지"],"a":1,"e":"식품위생법의 목적은 식품으로 인한 위생상의 위해 방지, 식품영양의 질적 향상 도모, 식품에 관한 올바른 정보 제공을 통해 국민보건의 증진에 이바지하는 것이다. ‘식품생산의 합리적 관리’는 목적 조항에 없는 내용이다."},{"id":"43-1-7","r":43,"p":1,"n":7,"s":"위생관계법령","q":"「식품위생법」상 용어에 대한 정의로 옳지 <u>않은</u> 것은?","o":["'식품'이란 의약으로 섭취하는 것을 포함한, 모든 음식물을 말한다.","'화학적 합성품'이란 화학적 수단으로 원소 또는 화합물에 분해 반응 외의 화학 반응을 일으켜서 얻은 물질을 말한다.","'용기·포장'이란 식품 또는 식품첨가물을 넣거나 싸는 것으로서 식품 또는 식품첨가물을 주고받을 때 함께 건네는 물품을 말한다.","'위해'란 식품, 식품첨가물, 기구 또는 용기·포장에 존재하는 위험요소로서 인체의 건강을 해치거나 해칠 우려가 있는 것을 말한다.","'식중독'이란 식품 섭취로 인하여 인체에 유해한 미생물 또는 유독물질에 의하여 발생하였거나 발생한 것으로 판단되는 감염성 질환 또는 독소형 질환을 말한다."],"a":1,"e":"식품위생법상 ‘식품’은 모든 음식물을 말하되 의약으로 섭취하는 것은 제외한다. 따라서 의약으로 섭취하는 것을 포함한다는 정의는 틀렸고, 화학적 합성품(분해 반응 외의 화학 반응으로 얻은 물질)·용기·포장·위해·식중독의 정의는 법 조문 그대로이다."},{"id":"43-1-8","r":43,"p":1,"n":8,"s":"위생관계법령","q":"「식품위생법」상 기구 및 용기·포장에 관한 기준 및 규격을 정하여 고시하는 자는?","o":["보건소장","시·도지사","질병관리청장","보건복지부장관","식품의약품안전처장"],"a":5,"e":"식품위생법상 기구 및 용기·포장의 제조방법 기준과 성분 규격은 식품의약품안전처장이 정하여 고시한다. 질병관리청장은 감염병, 보건복지부장관은 공중위생·위생사 면허 소관이라 해당하지 않는다."},{"id":"43-1-9","r":43,"p":1,"n":9,"s":"위생관계법령","q":"「식품위생법」상 식품등의 기준 및 규격 관리 기본계획에 포함되는 노출량 평가·관리의 대상이 되는 유해물질의 종류가 <u>아닌</u> 것은?","o":["중금속","곰팡이 독소","유기성오염물질","제조·가공 과정에서 생성되는 오염물질","질병관리청장이 노출량 평가·관리가 필요하다고 인정한 유해물질"],"a":5,"e":"식품등의 기준 및 규격 관리 기본계획의 노출량 평가·관리 대상 유해물질은 중금속, 곰팡이 독소, 유기성오염물질, 제조·가공 과정에서 생성되는 오염물질, 그 밖에 식품의약품안전처장이 필요하다고 인정한 유해물질이다. 인정 주체가 질병관리청장이 아니라 식품의약품안전처장이므로 틀린 보기이다."},{"id":"43-1-10","r":43,"p":1,"n":10,"s":"위생관계법령","q":"「식품위생법」상 식품위생감시원의 직무가 <u>아닌</u> 것은?","o":["식품조리법에 대한 기술지도","식품등의 위생적인 취급에 관한 기준의 이행 지도","조리사 및 영양사의 법령 준수사항 이행 여부의 확인·지도","수입·판매 또는 사용 등이 금지된 식품등의 취급 여부에 관한 단속","영업자 및 종업원의 건강진단 및 위생교육의 이행 여부의 확인·지도"],"a":1,"e":"식품위생감시원은 위생적 취급기준 이행 지도, 금지 식품의 취급 단속, 영업자·종업원의 건강진단 및 위생교육 이행 확인·지도, 조리사·영양사의 법령 준수사항 이행 확인·지도 등 단속·지도 업무를 한다. 식품조리법에 대한 기술지도는 감시원의 직무에 포함되지 않는다."},{"id":"43-1-11","r":43,"p":1,"n":11,"s":"위생관계법령","q":"「식품위생법」상 식품안전관리인증기준적용업소로 받은 인증의 유효기간은 인증을 받은 날부터 몇 년인가?","o":["1년","2년","3년","4년","5년"],"a":3,"e":"식품위생법상 식품안전관리인증기준(HACCP) 적용업소 인증의 유효기간은 인증을 받은 날부터 3년이며, 연장신청으로 갱신할 수 있다. 위생교육 기록 보관(2년)이나 하수도 기술진단 주기(5년) 같은 다른 숫자와 혼동하지 않도록 한다."},{"id":"43-1-12","r":43,"p":1,"n":12,"s":"위생관계법령","q":"「식품위생법」상 식품위생심의위원회의 조사·심의 사항이 <u>아닌</u> 것은?","o":["식중독 방지에 관한 사항","식품위생에 관한 중요 사항","감염병환자의 관리에 관한 사항","식품등의 기준과 규격에 관한 사항","농약·중금속 등 유독·유해물질 잔류 허용 기준에 관한 사항"],"a":3,"e":"식품위생심의위원회는 식중독 방지, 농약·중금속 등 유독·유해물질 잔류 허용기준, 식품등의 기준과 규격, 그 밖에 식품위생에 관한 중요 사항을 조사·심의한다. 감염병환자의 관리는 감염병예방법 소관 사항으로 이 위원회의 심의 대상이 아니다."},{"id":"43-1-13","r":43,"p":1,"n":13,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 의료기관에 소속되지 아니한 의사, 치과의사 또는 한의사는 감염병환자등을 진단하거나 그 사체를 검안한 사실을 누구에게 신고하여야 하는가?","o":["시·도지사","관할 보건소장","보건복지부장관","시장·군수·구청장","식품의약품안전처장"],"a":2,"e":"감염병예방법상 의료기관에 소속되지 않은 의사·치과의사·한의사는 감염병환자등을 진단하거나 사체를 검안하면 관할 보건소장에게 신고해야 한다. 의료기관 소속이면 소속 의료기관의 장에게 보고하고, 의료기관의 장이 질병관리청장 또는 관할 보건소장에게 신고한다."},{"id":"43-1-14","r":43,"p":1,"n":14,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 일시적으로 식품접객업 업무 종사의 제한을 받는 감염병은?","o":["요충증","콜레라","간흡충증","장흡충증","연성하감"],"a":2,"e":"감염병예방법 시행규칙상 일시적으로 식품접객업 등 업무 종사가 제한되는 감염병은 콜레라, 장티푸스, 파라티푸스, 세균성이질, 장출혈성대장균감염증, A형간염 등 식품·물로 전파되는 제2급감염병이다. 요충증·간흡충증·장흡충증은 제4급 기생충감염병, 연성하감은 성매개감염병으로 종사 제한 대상이 아니다."},{"id":"43-1-15","r":43,"p":1,"n":15,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 소독업의 신고는 누구에게 하여야 하는가?","o":["질병관리청장","관할 보건소장","보건복지부장관","식품의약품안전처장","특별자치도지사 또는 시장·군수·구청장"],"a":5,"e":"감염병예방법상 소독업을 하려는 자는 시설·장비 및 인력을 갖추어 특별자치도지사 또는 시장·군수·구청장에게 신고해야 한다. 관할 보건소장이나 질병관리청장은 소독업 신고 수리 기관이 아니다."},{"id":"43-1-16","r":43,"p":1,"n":16,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 특별자치도지사 또는 시장·군수·구청장이 임시예방접종을 실시할 때 미리 정하여 공고하여야 하는 사항이 <u>아닌</u> 것은?","o":["예방접종의 일시","예방접종의 종류","예방접종의 장소","예방접종약품의 수량","예방접종을 받을 사람의 범위"],"a":4,"e":"임시예방접종을 할 때 특별자치도지사 또는 시장·군수·구청장은 예방접종의 일시·장소, 예방접종의 종류, 예방접종을 받을 사람의 범위를 미리 정하여 공고해야 한다. 예방접종약품의 수량은 공고 사항이 아니다."},{"id":"43-1-17","r":43,"p":1,"n":17,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 필수예방접종 또는 임시예방접종을 받은 사람에게 예방접종증명서를 발급하여야 하는 자는?","o":["방역관","국립환경과학원장","식품의약품안전처장","국민건강보험공단 이사장","질병관리청장, 특별자치도지사 또는 시장·군수·구청장"],"a":5,"e":"감염병예방법상 필수예방접종 또는 임시예방접종을 받은 사람에게는 질병관리청장, 특별자치도지사 또는 시장·군수·구청장이 예방접종증명서를 발급해야 한다. 국민건강보험공단 이사장이나 방역관은 증명서 발급 주체가 아니다."},{"id":"43-1-18","r":43,"p":1,"n":18,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 그 밖의 신고의무자가 제1급감염병 중 보건복지부령으로 정하는 감염병이 발생한 경우 관할 보건소장에게 지체 없이 신고하거나 알려야 하는 사항이 <u>아닌</u> 것은?","o":["감염병환자의 직업","감염병환자의 성명, 주소","감염병환자의 주요 증상 및 발병일","신고인의 성명, 주소와 감염병환자와의 관계","감염병환자가 입원한 감염병전문병원의 주소"],"a":5,"e":"그 밖의 신고의무자가 신고할 사항은 신고인의 성명·주소와 감염병환자등과의 관계, 감염병환자등의 성명·주소 및 직업, 주요 증상 및 발병일이다. 환자가 입원한 감염병전문병원의 주소는 신고 사항에 포함되지 않는다."},{"id":"43-1-19","r":43,"p":1,"n":19,"s":"위생관계법령","q":"「먹는물관리법」상 대통령령으로 정하는 규모 이상의 샘물을 개발하려는 자는 누구의 허가를 받아야 하는가?","o":["시·도지사","환경부장관","질병관리청장","보건복지부장관","식품의약품안전처장"],"a":1,"e":"먹는물관리법상 대통령령으로 정하는 규모 이상의 샘물을 개발하려는 자는 시·도지사의 허가를 받아야 한다(환경영향조사 포함). 환경부장관은 먹는물 관련 정책·기준을 정하는 위치이지 샘물개발 허가권자가 아니다."},{"id":"43-1-20","r":43,"p":1,"n":20,"s":"위생관계법령","q":"「먹는물관리법」상 암반대수층 안의 지하수 또는 용천수 등 수질의 안전성을 계속 유지할 수 있는 자연 상태의 깨끗한 물을 먹는 용도로 사용할 원수를 정의하는 용어는?","o":["상수","샘물","하수","수돗물","먹는염지하수"],"a":2,"e":"먹는물관리법상 ‘샘물’은 암반대수층 안의 지하수 또는 용천수 등 수질의 안전성을 계속 유지할 수 있는 자연 상태의 깨끗한 물을 먹는 용도로 사용할 원수를 말한다. 먹는염지하수는 염지하수를 먹기에 적합하도록 처리한 물이고, 수돗물은 수도법상 개념이다."},{"id":"43-1-21","r":43,"p":1,"n":21,"s":"위생관계법령","q":"「먹는물관리법」상 샘물보전구역을 지정할 수 있는 자는?","o":["시·도지사","환경부장관","보건복지부장관","국립환경과학원장","식품의약품안전처장"],"a":1,"e":"먹는물관리법상 샘물보전구역은 시·도지사가 지정할 수 있다. 샘물 개발허가와 먹는샘물 제조업 허가도 시·도지사 권한이므로 ‘먹는물관리법 = 시·도지사’로 묶어 기억하면 좋다."},{"id":"43-1-22","r":43,"p":1,"n":22,"s":"위생관계법령","q":"「먹는물관리법」상 (   )에 들어갈 것으로 옳은 것은?","o":["1년 | 3천만원","1년 | 5천만원","3년 | 3천만원","3년 | 5천만원","5년 | 5천만원"],"a":5,"b":"누구든지 먹는 데 제공할 목적으로 먹는샘물등 외의 물을 판매한 자는 ( ㉠ ) 이하의 징역이나 ( ㉡ ) 이하의 벌금에 처하거나, 이를 병과할 수 있다.","e":"먹는물관리법상 먹는 데 제공할 목적으로 먹는샘물등 외의 물을 판매한 자는 5년 이하의 징역이나 5천만원 이하의 벌금에 처하거나 이를 병과할 수 있다. 무허가 제조 등과 함께 가장 무거운 벌칙 구간에 해당하므로 1년·3년 구간과 구별한다."},{"id":"43-1-23","r":43,"p":1,"n":23,"s":"위생관계법령","q":"「먹는물관리법」상 시·도지사의 허가를 받아야 하는 업종은?","o":["수처리제 제조업","정수기의 제조업","먹는샘물등의 제조업","먹는샘물등의 수입판매업","먹는샘물등의 유통전문판매업"],"a":3,"e":"먹는물관리법상 먹는샘물등의 제조업은 시·도지사의 허가를 받아야 하는 업종이다. 먹는샘물등의 수입판매업·수처리제 제조업·정수기 제조업은 등록, 먹는샘물등의 유통전문판매업은 신고 대상이라 허가 업종이 아니다."},{"id":"43-1-24","r":43,"p":1,"n":24,"s":"위생관계법령","q":"「폐기물관리법」상 폐기물 처리업자는 폐기물의 발생·배출·처리상황 등을 기록한 장부를 마지막으로 기록한 날부터 얼마간 보존하여야 하는가? (단, 환경부장관이 구축·운영하는 전자정보처리프로그램을 이용하는 경우를 제외함)","o":["1년","3년","5년","7년","10년"],"a":2,"e":"폐기물관리법상 폐기물 처리업자 등은 폐기물의 발생·배출·처리상황 등을 기록한 장부를 마지막으로 기록한 날부터 3년간 보존해야 한다(전자정보처리프로그램 이용 시 제외). 위생교육 기록 보관기간(2년)과 혼동하기 쉽다."},{"id":"43-1-25","r":43,"p":1,"n":25,"s":"위생관계법령","q":"「하수도법」상 (   )에 들어갈 것으로 옳은 것은?","o":["1년","2년","3년","4년","5년"],"a":5,"b":"공공하수도관리청은 (   )마다 소관 공공하수도에 대한 기술진단을 실시하여 공공하수도의 관리상태를 점검하여야 한다.","e":"하수도법상 공공하수도관리청은 5년마다 소관 공공하수도에 대한 기술진단을 실시하여 관리상태를 점검해야 한다. HACCP 인증 유효기간(3년) 등 다른 숫자와 헷갈리지 않도록 한다."},{"id":"43-1-26","r":43,"p":1,"n":26,"s":"환경위생학","q":"대기 중 입자상 물질을 입경별로 측정하는 기구는?","o":["핸디샘플러(handy sampler)","강하분진계(dust fall sampler)","피에조밸런스분진계(piezobalance)","광산란계(light scattering detector)","앤더슨에어샘플러(Andersen air sampler)"],"a":5,"e":"앤더슨에어샘플러는 여러 단의 충돌판(cascade impactor)으로 공기를 통과시켜 입자를 크기별로 나누어 포집하므로 입경별 분포 측정에 쓴다. 강하분진계는 자연 낙하하는 분진의 양을, 피에조밸런스분진계·광산란계는 전체 분진 농도를 신속히 측정하는 기구라 입경별 분리가 되지 않는다."},{"id":"43-1-27","r":43,"p":1,"n":27,"s":"환경위생학","q":"다음의 대기오염 사건은?","o":["뮤즈계곡 사건","미나마타 사건","요코하마 사건","포자리카 사건","로스앤젤레스 사건"],"a":5,"b":"• 1954년 여름에 발생함\n• 낮 시간대에 자동차 배출가스가 주 원인이 됨\n• 오존, 질소산화물, 탄화수소가 주요한 원인 물질임\n• 광화학 반응에 의한 2차 오염이 발생됨","e":"로스앤젤레스 사건(1954)은 낮 시간대 자동차 배출가스의 질소산화물·탄화수소가 강한 햇빛 아래 광화학 반응을 일으켜 오존 등 2차 오염물질이 생긴 광화학 스모그 사건이다. 뮤즈계곡 사건은 공장 배출 SO₂와 기온역전에 의한 사건, 포자리카 사건은 황화수소 누출 사고, 미나마타 사건은 수은에 의한 수질오염 사건이다."},{"id":"43-1-28","r":43,"p":1,"n":28,"s":"환경위생학","q":"실내공기질공정시험기준에서 다중이용시설의 미세먼지 농도를 측정하는 주 시험방법으로 옳은 것은?","o":["중량법","광산란법","광투과법","베타선흡수법","피에조밸런스법"],"a":1,"e":"실내공기질공정시험기준에서 다중이용시설의 미세먼지 농도 측정의 주 시험방법은 필터에 포집한 먼지의 무게를 다는 중량법이다. 광산란법·베타선흡수법 등은 연속·간이 측정에 쓰이는 방법으로 주 시험방법이 아니다."},{"id":"43-1-29","r":43,"p":1,"n":29,"s":"환경위생학","q":"입자상 물질과 가스상 물질을 동시에 처리할 수 있는 집진장치는?","o":["세정집진장치","여과집진장치","중력집진장치","관성력집진장치","원심력집진장치"],"a":1,"e":"세정집진장치는 물 등 액체를 분사해 입자를 액적에 포집하는 동시에 수용성 가스를 흡수하므로 입자상·가스상 물질을 함께 처리할 수 있다. 여과집진장치는 미세입자 제거 효율은 높지만 가스상 물질은 처리하지 못하고, 중력·관성력·원심력 집진장치도 입자만 분리한다."},{"id":"43-1-30","r":43,"p":1,"n":30,"s":"환경위생학","q":"흡기(들숨)와 호기(날숨)의 이산화탄소(CO₂)의 농도 차이는 약 몇 %인가?","o":["0.1%","1%","4%","8%","12%"],"a":3,"e":"흡기(대기) 중 CO₂는 약 0.03~0.04%, 호기(날숨) 중 CO₂는 약 4%이므로 그 차이는 약 4%이다. 0.1%는 실내 CO₂ 유지기준(1,000 ppm)과 혼동하기 쉬운 수치이다."},{"id":"43-1-31","r":43,"p":1,"n":31,"s":"환경위생학","q":"대기 중 이산화탄소(CO₂) 증가로 나타나는 직접적인 현상은?","o":["기온 저하","지구온난화","오존층 파괴","해수면 저하","열대우림 파괴"],"a":2,"e":"CO₂는 지표에서 방출되는 적외선(장파복사)을 흡수하는 대표적 온실가스로, 증가하면 직접적으로 지구온난화를 일으킨다. 오존층 파괴는 염화불화탄소(CFCs) 등에 의한 현상이고, 해수면은 온난화로 오히려 상승한다."},{"id":"43-1-32","r":43,"p":1,"n":32,"s":"환경위생학","q":"산성비의 수소이온농도(pH) 기준으로 옳은 것은?","o":["4.2 이하","4.6 이하","5.6 이하","6.2 이하","7.0 이하"],"a":3,"e":"대기 중 CO₂가 빗물에 녹아 평형을 이루면 자연 상태의 빗물 pH가 약 5.6이 되므로, pH 5.6 이하의 비를 산성비로 정의한다. 7.0은 중성 기준이라 산성비 기준이 아니다."},{"id":"43-1-33","r":43,"p":1,"n":33,"s":"환경위생학","q":"산성비가 미치는 환경적 영향으로 옳은 것은?","o":["기온 상승","엘니뇨 발생","해수면 상승","광화학 스모그 발생","식물의 성장 및 생육 방해"],"a":5,"e":"산성비는 토양을 산성화시키고 잎을 손상시켜 식물의 성장 및 생육을 방해하며, 호수 산성화와 건축물·문화재 부식도 일으킨다. 광화학 스모그는 질소산화물·탄화수소의 광화학 반응, 기온·해수면 상승은 온실효과에 의한 현상이다."},{"id":"43-1-34","r":43,"p":1,"n":34,"s":"환경위생학","q":"표준대기압과 같은 값으로 옳은 것은?","o":["24.9 lb/in²","760 mmHg","1.0336 kg/m²","1033.6 mmH₂O","1.013×10⁶ N/m²"],"a":2,"e":"표준대기압(1 atm)은 760 mmHg = 10,332 mmH₂O ≒ 1.0332 kg/cm² ≒ 14.7 lb/in² ≒ 1.013×10⁵ N/m²이다. 따라서 1033.6 mmH₂O(자릿수 틀림), 1.0336 kg/m²(단위가 cm²가 아님), 1.013×10⁶ N/m²(지수 틀림)는 모두 함정이다."},{"id":"43-1-35","r":43,"p":1,"n":35,"s":"환경위생학","q":"방사능 오염과 관련한 감마(γ)선의 대표 핵종은?","o":["⁶⁰Co","⁵⁹Fe","⁴⁰K","³²P","⁹⁰Sr"],"a":1,"e":"⁶⁰Co(코발트-60)는 강한 감마(γ)선을 방출하는 대표 핵종으로, 식품 방사선 조사와 방사선 치료의 선원으로 쓰인다. ⁹⁰Sr과 ³²P는 주로 베타(β)선을 방출하는 핵종이다."},{"id":"43-1-36","r":43,"p":1,"n":36,"s":"환경위생학","q":"발열체가 주위에 있을 때 체온 변화에 영향을 주는 온열인자는?","o":["기류","기습","기온","복사열","감각온도"],"a":4,"e":"발열체(난로·용광로·태양 등) 주위에서는 공기를 거치지 않고 전자기파로 직접 전달되는 복사열이 체온 변화에 영향을 주며, 흑구온도계로 측정한다. 감각온도는 기온·기습·기류를 종합한 체감 지표로 단일 온열인자가 아니다."},{"id":"43-1-37","r":43,"p":1,"n":37,"s":"환경위생학","q":"인체에서 열을 가장 많이 생산하는 부위는?","o":["간","폐","대장","심장","골격근"],"a":5,"e":"인체 열생산은 골격근이 가장 많고(약 60%) 다음이 간이며, 운동 시에는 골격근 비중이 더 커진다. 간은 안정 시 대사열이 많지만 골격근보다는 적다."},{"id":"43-1-38","r":43,"p":1,"n":38,"s":"환경위생학","q":"절대습도가 10 g/m³이고, 포화습도가 20 g/m³일 때 상대습도는?","o":["10%","30%","40%","50%","60%"],"a":4,"e":"【공식】 상대습도(%) = 절대습도 ÷ 포화습도 × 100\n【풀이】 10 g/m³ ÷ 20 g/m³ × 100 = 50%"},{"id":"43-1-39","r":43,"p":1,"n":39,"s":"환경위생학","q":"태양광선 중에서 파장이 가장 긴 것은?","o":["감마선","엑스선","자외선","적외선","가시광선"],"a":4,"e":"파장은 감마선 < 엑스선 < 자외선 < 가시광선(약 400~760 nm) < 적외선 순으로 길어지므로, 적외선(760 nm 이상)이 가장 길다. 감마선은 파장이 가장 짧고 에너지가 가장 크다."},{"id":"43-1-40","r":43,"p":1,"n":40,"s":"환경위생학","q":"다음 설명에 해당하는 것은?","o":["규소","석면","가시광선","아이오딘","내분비교란물질"],"a":5,"b":"항상성 유지, 생식, 발달 또는 행동을 조절하는 생체 호르몬의 합성, 분비, 이동, 대사, 결합작용 또는 분해 등을 간섭하는 체외물질이다.","e":"생체 호르몬의 합성·분비·이동·대사·결합·분해를 간섭하는 체외물질은 내분비교란물질(환경호르몬)로, 다이옥신·비스페놀 A·프탈레이트·DDT 등이 있다. 석면은 흡입 시 석면폐·중피종을 일으키는 섬유상 물질이고, 규소는 규폐증과 관련된다."},{"id":"43-1-41","r":43,"p":1,"n":41,"s":"환경위생학","q":"통조림 용기와 수도관의 녹을 방지하기 위한 코팅제에 포함된 물질은?","o":["납","스티렌","아세톤","톨루엔","비스페놀 A"],"a":5,"e":"통조림 캔 내부와 수도관의 부식 방지 코팅에 쓰이는 에폭시수지에는 비스페놀 A가 들어 있으며, 용출 시 내분비교란 작용을 한다. 스티렌은 폴리스티렌의 단량체이고, 톨루엔·아세톤은 유기용제이다."},{"id":"43-1-42","r":43,"p":1,"n":42,"s":"환경위생학","q":"다중이용시설의 이산화탄소(CO₂) 유지기준은?","o":["1 ppm 이하","10 ppm 이하","100 ppm 이하","1,000 ppm 이하","10,000 ppm 이하"],"a":4,"e":"실내공기질 관리법상 다중이용시설의 이산화탄소(CO₂) 유지기준은 1,000 ppm 이하이다. CO₂는 실내공기 오염의 지표로 쓰이며, 다른 숫자들은 자릿수를 바꾼 함정이다."},{"id":"43-1-43","r":43,"p":1,"n":43,"s":"환경위생학","q":"조혈기능 장애를 유발하는 물질은?","o":["바륨","벤젠","아르곤","코발트","산화규소"],"a":2,"e":"벤젠은 골수를 손상시켜 재생불량성빈혈·백혈병 등 조혈기능 장애를 일으키는 대표 물질이다. 산화규소는 규폐증, 아르곤은 불활성 기체로 질식 위험 정도이다."},{"id":"43-1-44","r":43,"p":1,"n":44,"s":"환경위생학","q":"다음 (   )에 들어갈 것으로 옳은 것은?","o":["1도","3도","5도","7도","10도"],"a":3,"b":"먹는물에서 심미적 영향을 미치는 물질에 관한 기준 중 색도의 수질기준은 (   )를 넘지 않아야 한다.","e":"먹는물 수질기준 중 심미적 영향물질 항목에서 색도는 5도를 넘지 않아야 한다. 탁도(1 NTU) 등 다른 심미적 항목의 기준과 혼동하지 않도록 한다."},{"id":"43-1-45","r":43,"p":1,"n":45,"s":"환경위생학","q":"정수과정에서 물속의 유기물질과 유리염소가 반응하여 생성되는 트리할로메탄(THM)은?","o":["자일렌","톨루엔","말라티온","에틸벤젠","클로로포름"],"a":5,"e":"트리할로메탄(THM)은 정수 과정에서 유기물(부식질 등)과 유리염소가 반응해 생기는 소독부산물로, 대표 물질이 클로로포름(CHCl₃)이다. 톨루엔·자일렌·에틸벤젠은 휘발성 유기화합물, 말라티온은 유기인계 농약이다."},{"id":"43-1-46","r":43,"p":1,"n":46,"s":"환경위생학","q":"일반적으로 경도(hardness)가 높은 물은?","o":["천수","계곡수","지표수","지하수","호소수"],"a":4,"e":"지하수는 지층을 통과하면서 칼슘·마그네슘 이온을 많이 녹여 일반적으로 경도가 높다. 천수(빗물)는 광물질이 거의 없어 가장 연수에 가깝고, 지표수·호소수도 지하수보다 경도가 낮다."},{"id":"43-1-47","r":43,"p":1,"n":47,"s":"환경위생학","q":"수질오염에서 부영양화 현상의 특성은?","o":["투시거리가 길다.","현탁 물질이 적다.","질소와 인의 농도가 낮다.","플랑크톤 개체 수가 많다.","수소이온농도는 강산성이다."],"a":4,"e":"부영양화는 질소·인 등 영양염류가 유입되어 조류와 플랑크톤이 대량 증식하는 현상이다. 그 결과 투시거리가 짧아지고 현탁 물질이 많아지며, 질소·인 농도는 높은 상태이다."},{"id":"43-1-48","r":43,"p":1,"n":48,"s":"환경위생학","q":"먹는물에서 100 mL당 총대장균군의 수질기준으로 옳은 것은?","o":["불검출","5 CFU 이하","20 CFU 이하","50 CFU 이하","100 CFU 이하"],"a":1,"e":"먹는물 수질기준에서 총대장균군은 100 mL에서 검출되지 않아야(불검출) 한다(먹는샘물은 250 mL 불검출). 일반세균의 기준(1 mL 중 100 CFU 이하)과 혼동하기 쉬운데, 일반세균은 단위가 mL이다."},{"id":"43-1-49","r":43,"p":1,"n":49,"s":"환경위생학","q":"해양 심층수의 특성으로 옳은 것은?","o":["수온이 높다.","수질 변화가 심하다.","무기영양물질이 적다.","산소의 공급이 충분하다.","분해성 유기물질이 적어 깨끗하다."],"a":5,"e":"해양 심층수는 햇빛이 닿지 않는 수심(약 200 m 이하)의 물로, 분해성 유기물과 병원균이 적어 청정하다. 수온이 낮고 수질 변화가 적으며 무기영양염류는 오히려 풍부하다."},{"id":"43-1-50","r":43,"p":1,"n":50,"s":"환경위생학","q":"물의 순환과 이용에 관한 설명으로 옳은 것은?","o":["바다에서는 강수량이 증발량보다 많다.","지구상의 수자원 총량 중 담수자원은 약 3%이다.","지표면에서 흙 속으로 물이 침입하는 현상을 표면유출이라고 한다.","우리나라의 수자원 이용에서 가장 큰 비중을 차지하는 것은 생활용수이다.","식물에 흡수된 물이 식물 잎의 표면에서 빠져나가는 현상을 증발이라고 한다."],"a":2,"e":"지구 수자원의 약 97%는 해수이고 담수는 약 3%(대부분 빙하)에 불과하다. 바다에서는 증발량이 강수량보다 많고, 흙 속으로 물이 스며드는 현상은 침투, 잎에서 수분이 빠져나가는 현상은 증산이며, 우리나라 수자원 이용 비중이 가장 큰 것은 농업용수이다."},{"id":"43-1-51","r":43,"p":1,"n":51,"s":"환경위생학","q":"정수과정의 완속여과(slow sand filtration)에 대한 설명으로 옳은 것은?","o":["응집침전이 선행되어야 한다.","색도 및 탁도가 높은 물에 적합하다.","여과속도는 120 m/m²·day 정도이다.","일정시간 간격으로 역세척이 이루어져야 한다.","여과효과는 모래층 표면의 생물막에서 일어난다."],"a":5,"e":"완속여과는 모래층 표면에 형성된 생물막(여과막)에서 미생물 작용으로 여과·정화가 일어난다. 보통침전만 선행하면 되고(약품 응집침전은 급속여과), 여과속도는 약 3 m/day(120 m/day는 급속여과), 세척은 표면 모래를 긁어내는 사면대치이며 역세척은 급속여과의 방식이다."},{"id":"43-1-52","r":43,"p":1,"n":52,"s":"환경위생학","q":"먹는물의 세균 제거에 효과적인 소독법은?","o":["염소법","포기법","적외선법","과망간산칼륨법","중크롬산칼륨법"],"a":1,"e":"염소법은 강한 산화력으로 세균을 효과적으로 죽이고, 잔류염소로 지속 효과가 있으며 경제적이어서 먹는물 소독에 가장 널리 쓰인다. 포기법은 가스·냄새 제거와 철·망간 산화에, 과망간산칼륨은 산화제로 철·망간이나 맛·냄새 제거에 쓰이는 방법이다."},{"id":"43-1-53","r":43,"p":1,"n":53,"s":"환경위생학","q":"폐수배출기준(방류수)의 수소이온농도(pH) 허용범위는?","o":["1.8~3.6","3.8~5.6","5.8~8.6","8.8~9.6","9.8~11.6"],"a":3,"e":"폐수 배출허용기준과 공공하수처리시설 방류수 수질기준에서 pH는 중성 부근인 5.8~8.6으로 정해져 있다. 3.8~5.6은 산성 쪽, 8.8~9.6은 알칼리 쪽으로 기준을 벗어난 범위다."},{"id":"43-1-54","r":43,"p":1,"n":54,"s":"환경위생학","q":"하천의 생물학적 자정작용은?","o":["분해","혼합","확산","흡착","희석"],"a":1,"e":"하천의 생물학적 자정작용은 미생물이 유기물을 산화·분해하여 안정화시키는 작용이다. 혼합·확산·희석은 물리적 자정작용이고, 흡착은 물리화학적 작용이라 생물학적 작용이 아니다."},{"id":"43-1-55","r":43,"p":1,"n":55,"s":"환경위생학","q":"폐수에 함유된 입자에 미세한 기포를 부착하여 겉보기 비중을 낮추어 입자를 제거하는 단위공정은?","o":["부상","응집","중화","침전","환원"],"a":1,"e":"부상(flotation)은 미세 기포를 입자에 부착시켜 겉보기 비중을 물보다 작게 만들어 수면으로 띄워 제거하는 공정이다(예: 가압부상법). 침전은 반대로 비중이 큰 입자를 중력으로 가라앉히는 것이고, 응집은 응집제로 미세입자를 뭉쳐 플록을 만드는 공정이다."},{"id":"43-1-56","r":43,"p":1,"n":56,"s":"환경위생학","q":"하·폐수처리방법 중 물리적 처리 방법은?","o":["산화지법","역삼투법","살수여상법","소화분해법","활성오니법"],"a":2,"e":"역삼투법은 반투막에 삼투압보다 큰 압력을 가해 물만 통과시키고 용질을 걸러내는 물리적 처리법이다. 산화지법·살수여상법·활성오니법은 호기성 미생물을, 소화분해법은 혐기성 미생물을 이용하는 생물학적 처리법이다."},{"id":"43-1-57","r":43,"p":1,"n":57,"s":"환경위생학","q":"하·폐수처리시설 중 공기를 공급하는 시설은?","o":["소독시설","응집시설","중화시설","포기시설","환원시설"],"a":4,"e":"포기(aeration)시설은 폐수에 공기를 불어넣어 산소를 공급함으로써 호기성 미생물의 분해 활동을 돕고 휘발성 가스를 제거한다. 중화시설은 pH 조절, 소독시설은 병원성 미생물 제거가 목적이라 공기 공급과는 관계없다."},{"id":"43-1-58","r":43,"p":1,"n":58,"s":"환경위생학","q":"하·폐수에 호기성 처리를 했을 때 주로 발생하는 기체는?","o":["CO","CH₄","CO₂","H₂S","NH₃"],"a":3,"e":"호기성 처리에서는 유기물이 산소를 이용해 완전 산화되므로 주로 CO₂와 H₂O가 생성된다. CH₄·H₂S·NH₃는 산소가 없는 혐기성 분해(소화)에서 주로 발생하는 기체다."},{"id":"43-1-59","r":43,"p":1,"n":59,"s":"환경위생학","q":"하·폐수의 슬러지 처리에서 개량(conditioning)공정으로 옳은 것은?","o":["고온건조","슬러지케이크 소각","탈수기로 수분제거","부상분리로 유지류 농축","약품 첨가로 탈수성 향상"],"a":5,"e":"슬러지 처리는 농축 → 소화 → 개량 → 탈수 → 건조 → 소각·최종처분 순이며, 개량은 응집제 등 약품 첨가·세정·열처리로 슬러지의 탈수성을 높이는 공정이다. 탈수기로 수분을 빼는 것은 탈수 공정, 슬러지케이크 소각은 최종처리 단계로 개량과 구분된다."},{"id":"43-1-60","r":43,"p":1,"n":60,"s":"환경위생학","q":"「폐기물관리법」상 생활폐기물의 정의로 옳은 것은?","o":["사업장폐기물 외의 폐기물","사업장에서 발생되는 폐기물","폐수배출시설 등에서 발생되는 폐기물","인체조직 중 적출물, 탈지면, 실험동물의 사체","연소재, 오니 등의 사람의 생활이나 사업활동에 필요하지 않은 물질"],"a":1,"e":"「폐기물관리법」에서 생활폐기물은 ‘사업장폐기물 외의 폐기물’로 정의된다. 사업장에서 발생하는 폐기물은 사업장폐기물이고, 인체조직 중 적출물·탈지면·실험동물의 사체 등은 의료폐기물에 해당한다."},{"id":"43-1-61","r":43,"p":1,"n":61,"s":"환경위생학","q":"「폐기물관리법」상 지정폐기물은?","o":["연소재","건설폐기물","생활폐기물","폐산·폐알칼리","사업장 일반폐기물"],"a":4,"e":"지정폐기물은 사업장폐기물 중 주변 환경을 오염시키거나 인체에 위해를 줄 수 있는 유해물질로, 폐산·폐알칼리·폐유·폐석면·PCB 함유 폐기물 등이 해당한다. 생활폐기물·건설폐기물·사업장 일반폐기물은 일반적인 성상의 폐기물로 지정폐기물이 아니다."},{"id":"43-1-62","r":43,"p":1,"n":62,"s":"환경위생학","q":"폐기물의 감량화·안정화에 유리한 위생적인 처리방법은?","o":["소각법","육상투기법","해상투기법","퇴비·비료화법","동물사료이용법"],"a":1,"e":"소각법은 폐기물의 부피를 크게 줄이고(감량화) 병원균과 유기물을 고온으로 분해해 안정화시키는 가장 위생적인 처리방법이다. 해상투기는 해양오염으로 금지 추세이고, 퇴비화나 사료화는 유기성 폐기물에만 적용할 수 있어 감량 효과가 제한적이다."},{"id":"43-1-63","r":43,"p":1,"n":63,"s":"환경위생학","q":"폐기물 관리체계에서 비용이 가장 많이 드는 공정은?","o":["선별","수거","압축","적환","파쇄"],"a":2,"e":"폐기물 관리체계에서 수거(수집·운반)는 인력과 장비가 가장 많이 들어 전체 관리비용의 대부분(약 60~80%)을 차지한다. 적환은 오히려 수거 운반 효율을 높여 비용을 줄이기 위한 공정이고, 선별·압축·파쇄는 중간처리 단계다."},{"id":"43-1-64","r":43,"p":1,"n":64,"s":"환경위생학","q":"「폐기물관리법」상 일반의료폐기물은?","o":["폐백신","배양용기, 보관균주","봉합바늘, 치과용침","동물의 사체, 혈액생성물","혈액이 함유되어 있는 탈지면"],"a":5,"e":"일반의료폐기물은 혈액·체액·분비물·배설물이 함유된 탈지면, 붕대, 거즈, 일회용 기저귀, 생리대, 일회용 주사기, 수액세트 등이다. 봉합바늘·치과용침은 손상성폐기물, 배양용기·보관균주는 병리계폐기물, 폐백신은 생물·화학폐기물, 동물의 사체·혈액생성물은 조직물류폐기물로 위해의료폐기물에 속한다."},{"id":"43-1-65","r":43,"p":1,"n":65,"s":"환경위생학","q":"「폐기물관리법」상 의료폐기물 중 손상성 폐기물은?","o":["거즈","생리대","슬라이드","수술용 칼날","일회용 주사기"],"a":4,"e":"손상성폐기물은 찔리거나 베일 수 있는 것으로 주삿바늘, 봉합바늘, 수술용 칼날, 한방침, 치과용침, 파손된 유리재질 시험기구 등이 해당한다. 일회용 주사기와 혈액이 묻은 거즈·생리대는 일반의료폐기물이고, 슬라이드는 병리계폐기물이다."},{"id":"43-1-66","r":43,"p":1,"n":66,"s":"환경위생학","q":"라돈으로 유발되는 직업병은?","o":["폐암","진폐증","천식증","청색증","비중격천공"],"a":1,"e":"라돈은 토양·암석의 우라늄 붕괴로 생기는 자연방사성 기체로, 흡입 시 폐에서 알파선을 방출하여 폐암을 유발한다(광산 근로자, 실내 축적 문제). 진폐증은 분진, 비중격천공은 크롬 노출로 생기는 직업병이다."},{"id":"43-1-67","r":43,"p":1,"n":67,"s":"환경위생학","q":"산업재해 지표에서 도수율에 대한 설명으로 옳은 것은?","o":["연 근로시간 1,000시간당 재해로 잃어버린 근로손실일수","연 근로시간 합계 100,000시간당 발생되는 재해자 수","연 근로시간 합계 1,000,000시간당 재해발생 건수","재적근로자 1,000인당 1년간 발생하는 재해자 수","재적근로자 10,000인당 1년간 발생하는 사고 건수"],"a":3,"e":"도수율 = (재해발생 건수 ÷ 연 근로시간 수) × 1,000,000으로, 연 근로시간 100만 시간당 재해 발생 건수를 나타낸다. 연 근로시간 1,000시간당 근로손실일수는 강도율, 재적근로자 1,000인당 1년간 재해자 수는 연천인율이다."},{"id":"43-1-68","r":43,"p":1,"n":68,"s":"환경위생학","q":"소음성 난청이 발생하는 주파수 대역으로 옳은 것은?","o":["500~900 Hz","1,000~1,500 Hz","2,000~2,500 Hz","3,000~6,000 Hz","7,000~9,000 Hz"],"a":4,"e":"소음성 난청은 초기에 3,000~6,000 Hz, 특히 4,000 Hz 부근에서 청력이 떨어지는 C5-dip 현상으로 나타난다. 500~2,000 Hz 범위는 회화음역으로, 난청이 상당히 진행된 뒤에야 장애가 생긴다."},{"id":"43-1-69","r":43,"p":1,"n":69,"s":"환경위생학","q":"검사하고자 하는 소독약의 희석배수가 180이고, 석탄산의 희석배수가 90일 때 석탄산계수는?","o":["0.5","1.0","2.0","3.0","4.0"],"a":3,"e":"【공식】 석탄산계수 = 시험 소독약의 희석배수 ÷ 석탄산의 희석배수\n【풀이】 180 ÷ 90 = 2.0 → 시험 소독약의 살균력이 석탄산의 2배라는 뜻이다. 0.5는 분자와 분모를 거꾸로 넣었을 때 나오는 오답이다."},{"id":"43-1-70","r":43,"p":1,"n":70,"s":"환경위생학","q":"다음에 해당되는 살균법으로 옳은 것은?","o":["건열 살균법","저온 살균법","자외선 살균법","고압증기 살균법","유통증기 살균법"],"a":3,"b":"• 파장이 265 nm인 광원을 이용함\n• 결핵균이나 디프테리아균은 2~3시간이면 살균됨\n• 수술실, 무균실, 제약실, 음식점 등에서 사용함","e":"자외선 살균법은 살균력이 가장 강한 약 260~265 nm 파장(2,650 Å 부근)을 이용하며, 투과력이 약해 공기·물체 표면 살균에 쓰이므로 수술실·무균실 등에 사용된다. 건열 살균법은 160~170℃ 건열로 유리기구 등을, 고압증기 살균법은 121℃ 증기로 아포까지 사멸시키는 방법이라 광원과는 관계없다."},{"id":"43-1-71","r":43,"p":1,"n":71,"s":"환경위생학","q":"3%(V/V) 크레졸 용액 500 mL를 제조할 경우 사용되는 100% 크레졸의 양(mL)은?","o":["5","10","15","20","25"],"a":3,"e":"【공식】 필요한 원액량 = 만들 용액의 양 × (목표 농도 ÷ 원액 농도)\n【풀이】 500 mL × (3 ÷ 100) = 15 mL → 100% 크레졸 15 mL에 물을 더해 전체 500 mL로 맞춘다."},{"id":"43-1-72","r":43,"p":1,"n":72,"s":"환경위생학","q":"소독제 분자 중에 양이온이 활성화되어 살균작용이 강해지는 것은?","o":["표백분","역성비누","포르말린","과산화수소","차아염소산나트륨"],"a":2,"e":"역성비누(양성비누, 4급 암모늄염)는 보통 비누와 달리 양이온이 활성을 띠어 세정력은 약하지만 살균력이 강하다. 표백분·차아염소산나트륨은 염소(차아염소산)의 산화작용, 과산화수소는 발생기 산소의 산화작용으로 살균한다."},{"id":"43-1-73","r":43,"p":1,"n":73,"s":"환경위생학","q":"실내·외 온도 차이로 발생하는 공기의 흐름을 이용하는 환기법은?","o":["강제환기법","공기조정법","중력환기법","배기식환기법","흡입식환기법"],"a":3,"e":"중력환기는 실내·외 온도차로 생기는 공기 밀도(압력) 차이를 이용한 자연환기로, 따뜻한 공기는 위로 나가고 찬 공기는 아래로 들어온다. 강제환기·배기식·흡입식 환기는 송풍기 등 기계 동력을 이용하는 인공환기다."},{"id":"43-1-74","r":43,"p":1,"n":74,"s":"환경위생학","q":"광원으로부터 단위시간당 단위면적에서 나오는 빛의 양은?","o":["광속(lumen)","광도(candela)","휘도(luminance)","조도(illumination)","반사율(reflection)"],"a":1,"e":"광속(lumen)은 광원에서 단위시간당 방출되는 빛의 양으로, 공식 정답은 광속이다. 광도(cd)는 단위 입체각당 광속, 조도(lx)는 피조면의 단위면적에 도달하는 광속, 휘도는 단위면적당 광도로 눈부심의 지표다. 문제의 ‘단위면적’ 표현은 엄밀히는 광속발산도에 가깝지만 공식 정답 기준으로 광속을 고른다. ※ 출제 당시 기준"},{"id":"43-1-75","r":43,"p":1,"n":75,"s":"환경위생학","q":"의복의 방한력을 표시하는 단위는?","o":["lx","Bq","Gy","Sv","CLO"],"a":5,"e":"CLO는 의복의 방한력(보온력) 단위로, 1 CLO는 기온 21℃·습도 50%·기류 10 cm/sec에서 피부온도를 33℃로 유지시키는 의복의 보온력이다. lx는 조도, Bq는 방사능, Gy는 흡수선량, Sv는 등가선량 단위다."},{"id":"43-1-76","r":43,"p":1,"n":76,"s":"위생곤충학","q":"분류학에서 절지동물문의 곤충강에 속하는 것은?","o":["거미목","전갈목","파리목","돌지네목","진드기목"],"a":3,"e":"곤충강은 몸이 머리·가슴·배로 나뉘고 다리가 3쌍인 무리로, 파리목(쌍시목)이 여기에 속한다. 거미목·전갈목·진드기목은 다리가 4쌍인 거미강이고, 돌지네목은 지네강(순각강)에 속한다."},{"id":"43-1-77","r":43,"p":1,"n":77,"s":"위생곤충학","q":"구기가 스펀지형(sponging mouthpart)인 위생곤충은?","o":["바퀴","깔따구","메뚜기","잠자리","집파리"],"a":5,"e":"집파리는 순판(labellum)의 가는 홈(의기관)으로 액체를 빨아들이는 스펀지형(흡취형) 구기를 가진다. 바퀴·메뚜기·잠자리는 씹는 저작형 구기이고, 깔따구 성충은 구기가 퇴화되어 먹이를 먹지 않는다."},{"id":"43-1-78","r":43,"p":1,"n":78,"s":"위생곤충학","q":"완전변태를 하는 위생곤충은?","o":["이","모기","바퀴","빈대","진드기"],"a":2,"e":"완전변태는 알-유충-번데기-성충을 거치는 것으로 모기, 파리, 벼룩, 나방 등이 해당한다. 이·바퀴·빈대는 번데기 시기가 없는 불완전변태(알-약충-성충)이고, 진드기는 곤충이 아니며 알-유충-약충-성충으로 발육한다."},{"id":"43-1-79","r":43,"p":1,"n":79,"s":"위생곤충학","q":"위생곤충에 의해 기계적 전파로 감염되는 질병은?","o":["황열","뎅기열","콜레라","페스트","일본뇌염"],"a":3,"e":"기계적 전파는 곤충이 병원체를 몸 표면·다리·구기에 묻혀 옮기는 것으로, 곤충 체내에서 증식하지 않으며 파리·바퀴가 옮기는 콜레라·장티푸스·이질이 대표적이다. 황열·뎅기열·일본뇌염(모기)과 페스트(벼룩)는 병원체가 곤충 체내에서 증식한 뒤 옮겨지는 생물학적 전파다."},{"id":"43-1-80","r":43,"p":1,"n":80,"s":"위생곤충학","q":"위생곤충의 생활사에서 흡혈하는 시기로 옳은 것은?","o":["모기 성충","벼룩 유충","침파리 유충","먹파리 유충","털진드기 성충"],"a":1,"e":"모기는 성충 암컷만 산란에 필요한 단백질을 얻기 위해 흡혈하고, 유충은 물속 유기물을 먹는다. 벼룩 유충은 유기물과 성충의 혈변을 먹고, 털진드기는 유충 시기에만 숙주에 붙어 조직액을 먹으며 성충은 자유생활을 한다."},{"id":"43-1-81","r":43,"p":1,"n":81,"s":"위생곤충학","q":"개조충의 중간숙주는?","o":["바퀴","개벼룩","깔따구","모래파리","털진드기"],"a":2,"e":"개조충(Dipylidium caninum)의 중간숙주는 개벼룩·고양이벼룩(개털이)으로, 개나 사람(주로 어린이)이 감염된 벼룩을 삼켜 감염된다. 모래파리는 리슈마니아증, 털진드기는 쯔쯔가무시증을 매개하며 개조충과는 관계없다."},{"id":"43-1-82","r":43,"p":1,"n":82,"s":"위생곤충학","q":"외식 사업장에서 실시하는 위생곤충의 물리적 방제법은?","o":["출입구에 에어 커튼(air curtain)을 설치한다.","손님들이 출입하는 현관에 액체 소독제 발판을 설치한다.","천연약제를 주기적으로 살포하는 자동살포기를 설치한다.","바퀴를 관리하기 위해 1미터 간격으로 독먹이를 설치한다.","파리가 많이 드나드는 장소의 천장과 벽에 유제를 40 cc/m² 기준으로 분무한다."],"a":1,"e":"물리적 방제는 약제 없이 방충망, 에어 커튼, 유인등, 끈끈이 등 기계·물리적 장치로 곤충의 침입을 막거나 포획하는 방법이다. 독먹이 설치, 유제 분무, 천연약제 자동살포는 모두 약제를 쓰는 화학적 방제다."},{"id":"43-1-83","r":43,"p":1,"n":83,"s":"위생곤충학","q":"저독성 살충제 용기의 표지(label)에 명시하여야 하는 규정 단어는?","o":["독성(toxicity)","위험(danger)","주의(caution)","경고(warning)","독극물(poison)"],"a":3,"e":"살충제 표지의 규정 단어는 고독성에 ‘위험(danger)’과 ‘독극물(poison)’, 중등독성에 ‘경고(warning)’, 저독성에 ‘주의(caution)’를 표시한다. 따라서 위험·독극물은 가장 독성이 높은 등급에 쓰는 단어라 저독성 표지와 맞지 않는다."},{"id":"43-1-84","r":43,"p":1,"n":84,"s":"위생곤충학","q":"화학적 방제와 관련하여 옳은 것은?","o":["경구독성보다 경피독성에 의한 위험도가 낮다.","살충제는 원체(technical grade)를 그대로 사용할 수 있다.","유기인계보다 카바메이트계의 중독증상 발현이 현저히 느리다.","한 살충제에서 농도가 같을 때 제제(formulation)에 따른 위험도는 같다.","경미한 중독증세를 보이면 중독 여부를 측정하여 그 결과에 따라 적절한 조치를 취한다."],"a":5,"e":"살충제 중독이 의심되는 경미한 증세가 나타나면 콜린에스테라아제 활성 측정 등으로 중독 여부를 확인하고 그 결과에 따라 조치하는 것이 옳다. 살포 작업자는 주로 피부로 노출되므로 경피독성의 위험이 크고, 카바메이트계는 유기인계보다 중독증상이 빨리 나타나고 회복도 빠르다. 또 원체는 그대로 쓰지 않고 제제화하여 사용하며, 같은 농도라도 제제에 따라 피부 흡수율과 위험도가 다르다."},{"id":"43-1-85","r":43,"p":1,"n":85,"s":"위생곤충학","q":"인체독성 위험도가 극도위험(extremely hazard)에 해당되는 살충제는?","o":["카바릴(carbaryl)","크로덴(chlordane)","아레스린(allethrin)","파라티온(parathion)","디메소에이트(dimethoate)"],"a":4,"e":"파라티온은 유기인계 살충제 중 급성 독성이 매우 강해(쥐 경구 LD50 수 mg/kg 수준) WHO 분류에서 극도위험(Ia)에 해당한다. 카바릴·디메소에이트·크로덴은 중등도 위험 수준이고, 피레스로이드계인 아레스린은 인체 독성이 낮다."},{"id":"43-1-86","r":43,"p":1,"n":86,"s":"위생곤충학","q":"잔류분무 입자의 크기로 옳은 것은?","o":["1~10 μm","20~40 μm","50~70 μm","80~90 μm","100~400 μm"],"a":5,"e":"잔류분무는 살충제를 벽면 등에 부착시켜 오래 효과를 내게 하는 방법이므로 비교적 큰 100~400 μm 입자를 사용한다. 수십 μm 이하의 작은 입자는 공중에 오래 떠 있게 하는 공간살포(연무·극미량연무)에 쓰인다."},{"id":"43-1-87","r":43,"p":1,"n":87,"s":"위생곤충학","q":"디엘드린(dieldrin)에 대해 저항성이 있는 위생곤충이 알드린(aldrin), 엔드린(endrin)에 자동적으로 보이는 저항성은?","o":["내성","면역원성","교차저항성","생리적저항성","생태적저항성"],"a":3,"e":"교차저항성은 한 살충제에 저항성이 생긴 곤충이 화학구조나 작용기전이 비슷한 다른 살충제(사용한 적이 없어도)에도 저항성을 보이는 현상으로, 디엘드린·알드린·엔드린은 모두 사이클로디엔계 유기염소제다. 생리적저항성은 해독효소 증가 등 생리 기전에 의한 저항성, 생태적저항성은 약제를 피하는 행동 변화에 의한 저항성이다."},{"id":"43-1-88","r":43,"p":1,"n":88,"s":"위생곤충학","q":"유기인계 살충제에 대한 설명으로 옳은 것은?","o":["용제로 사용할 수 없다.","화학적으로 매우 안정적이다.","출혈을 유발하여 사망에 이르게 한다.","녹다운(knockdown) 되었다가 다시 회복한다.","아세틸콜린에스터라아제(acetylcholinesterase) 효소를 억제한다."],"a":5,"e":"유기인계 살충제는 아세틸콜린에스터라아제를 억제해 아세틸콜린을 축적시키고, 신경이 계속 흥분하다 마비되어 죽게 한다. 유기인계는 화학적으로 불안정해 잔류성이 짧으며(안정적인 것은 유기염소계), 녹다운 후 회복은 피레스로이드계, 출혈 유발은 항응혈성 살서제의 특징이다."},{"id":"43-1-89","r":43,"p":1,"n":89,"s":"위생곤충학","q":"살서제로 사용되는 와파린(warfarin)에 대한 설명으로 옳은 것은?","o":["항응혈성이다.","기피현상이 심하다.","사전미끼를 설치해야 한다.","포유류에 맹독성으로 2차독성이 있다.","폐에서 액체를 과다 생성하여 쥐를 죽인다."],"a":1,"e":"와파린은 비타민 K 작용을 방해해 혈액응고를 억제하는 항응혈성(만성) 살서제로, 여러 번 먹어야 내출혈로 죽는다. 서서히 작용해 기피현상이 거의 없으므로 사전미끼가 필요 없으며(사전미끼는 급성 살서제에 필요), 폐에 액체가 차게 하는 것은 안투(ANTU)의 작용이다."},{"id":"43-1-90","r":43,"p":1,"n":90,"s":"위생곤충학","q":"집합페로몬(aggregation pheromone)을 분비함으로써 은신처에서 군서생활을 하는 위생곤충은?","o":["이","바퀴","벼룩","파리","진드기"],"a":2,"e":"바퀴는 분변 등에 포함된 집합페로몬을 분비하여 은신처에 무리 지어 사는 군서생활을 한다. 그래서 바퀴 분변이 묻은 틈새가 은신처의 표시가 되며, 이·벼룩은 숙주에 기생하는 외부기생충으로 은신처 군서와 관계없다."},{"id":"43-1-91","r":43,"p":1,"n":91,"s":"위생곤충학","q":"무흡혈산란(autogeny)을 하는 모기는?","o":["동양집모기","빨간집모기","지하집모기","줄다리집모기","작은빨간집모기"],"a":3,"e":"지하집모기는 흡혈하지 않고도 첫 산란이 가능한 무흡혈산란(autogeny)을 하며, 정화조·지하실 등 지하 공간에서 겨울에도 발생한다. 빨간집모기·작은빨간집모기 등 일반 모기는 산란을 위해 반드시 흡혈해야 한다."},{"id":"43-1-92","r":43,"p":1,"n":92,"s":"위생곤충학","q":"인가 주변 폐기물 집합장의 고인 물에서 발생하는 모기는?","o":["광릉왕모기","빨간집모기","토고숲모기","반점날개늪모기","중국얼룩날개모기"],"a":2,"e":"빨간집모기는 하수구, 웅덩이, 폐기물 집합장의 고인 물 등 인가 주변의 오염된 물에서 발생하는 대표적 가주성 모기다. 토고숲모기는 해안 바위 웅덩이의 염분 섞인 물, 중국얼룩날개모기는 논·늪의 맑은 물, 광릉왕모기는 나무 구멍의 고인 물에서 발생한다."},{"id":"43-1-93","r":43,"p":1,"n":93,"s":"위생곤충학","q":"모기의 생물학적 방제방법은?","o":["아파트 정화조를 청소한다.","방충망에 살충제를 살포한다.","저수지에 송사리를 방사한다.","수로 주변의 잡초를 제거한다.","축사 주변에 유문등을 설치한다."],"a":3,"e":"생물학적 방제는 천적이나 병원체 등 생물을 이용하는 방법으로, 저수지에 송사리 같은 포식성 어류를 풀어 모기 유충을 잡아먹게 하는 것이 해당한다. 정화조 청소·잡초 제거는 발생원 제거(환경적 방제), 유문등 설치는 물리적 방제, 살충제 살포는 화학적 방제다."},{"id":"43-1-94","r":43,"p":1,"n":94,"s":"위생곤충학","q":"중남미와 아프리카 등에서 회선사상충증(onchocerciasis)을 전파하는 위생곤충은?","o":["등에","깔따구","먹파리","나방파리","등에모기"],"a":3,"e":"먹파리(Simulium)는 회선사상충을 매개하여 피부 결절과 실명(강변실명증)을 일으키며, 유충은 흐르는 깨끗한 물에서 자란다. 깔따구 성충은 흡혈하지 않고, 나방파리도 흡혈하지 않아 사상충 매개와 무관하다. ※ 교재 확인 권장"},{"id":"43-1-95","r":43,"p":1,"n":95,"s":"위생곤충학","q":"파리목의 단각아목(Brachycera)에 속하는 것은?","o":["등에과","모기과","먹파리과","나방파리과","등에모기과"],"a":1,"e":"파리목은 촉각 형태로 장각아목(긴 촉각: 모기·먹파리·나방파리·등에모기·깔따구), 단각아목(짧은 촉각: 등에·노랑등에), 환봉아목(집파리 등)으로 나뉘며 등에과가 단각아목에 속한다. 모기과·먹파리과·나방파리과·등에모기과는 모두 장각아목이다."},{"id":"43-1-96","r":43,"p":1,"n":96,"s":"위생곤충학","q":"몸체 표면에서 금속성 녹색 또는 청록색 광택이 나는 중형의 파리는?","o":["쉬파리","집파리","딸집파리","띠금파리","큰집파리"],"a":4,"e":"띠금파리는 금파리과의 중형 파리로 몸 표면에 금속성 녹색·청록색 광택이 나는 것이 특징이다. 쉬파리는 회색 바탕에 흉부 세로줄 3개와 복부 바둑판 무늬, 집파리는 회색 바탕에 흉부 세로줄 4개가 있으며 금속 광택이 없다."},{"id":"43-1-97","r":43,"p":1,"n":97,"s":"위생곤충학","q":"동물의 배설물과 부식성 식물 등으로 퇴비를 퇴적할 때 섞어 쓰는 약제는?","o":["린덴(lindane)","붕산(boric acid)","피레스린(pyrethrin)","파라티온(parathion)","디크로보스(dichlorvos)"],"a":2,"e":"붕산(또는 붕사)은 퇴비를 쌓을 때 섞어 파리 유충(구더기)의 발생을 억제하는 데 쓰이며, 비휘발성이고 퇴비의 비료 성분을 크게 해치지 않는다. 파라티온은 맹독성이라 부적합하고, 디크로보스·피레스린은 휘발·분해가 빨라 퇴비 속 잔효가 짧다. ※ 교재 확인 권장"},{"id":"43-1-98","r":43,"p":1,"n":98,"s":"위생곤충학","q":"몸이의 집단방제에 적합한 제제(formulation)는?","o":["분제","용제","입제","브리켓","수화제"],"a":1,"e":"몸이의 집단방제에는 분제(dust)를 의복과 내의 솔기 등에 직접 뿌리는 방법이 적합하다(전쟁·난민 등 집단 살포). 용제·수화제는 몸과 옷을 적셔 인체에 직접 쓰기 어렵고, 입제와 브리켓은 주로 물속 모기 유충 방제용이다."},{"id":"43-1-99","r":43,"p":1,"n":99,"s":"위생곤충학","q":"빈대의 특징으로 옳은 것은?","o":["주간활동성이다.","완전변태를 한다.","암컷은 일생에 한 번 교미한다.","성충의 수명은 실내온도와 관계없다.","각 영기(instar)마다 흡혈해야 탈피가 가능하다."],"a":5,"e":"빈대는 알-약충(5령)-성충으로 발육하며, 각 영기마다 흡혈해야 다음 단계로 탈피할 수 있다. 빈대는 야간활동성이고 번데기가 없는 불완전변태를 하며, 성충 수명은 온도의 영향을 받아 저온에서 길어진다."},{"id":"43-1-100","r":43,"p":1,"n":100,"s":"위생곤충학","q":"벼룩에 의해서 전파되는 감염병은?","o":["발진열","재귀열","참호열","말라리아","발진티푸스"],"a":1,"e":"발진열은 리케치아(Rickettsia typhi)가 쥐에서 쥐벼룩(열대쥐벼룩)을 통해 사람에게 전파되며, 벼룩 분변 속 병원체가 상처로 들어가 감염된다. 발진티푸스·참호열은 몸이, 재귀열은 이·진드기, 말라리아는 얼룩날개모기가 전파한다."},{"id":"43-1-101","r":43,"p":1,"n":101,"s":"위생곤충학","q":"다음의 방제법으로 방제되는 위생곤충은?","o":["빈대","독나방","참새털이","체체파리","모낭진드기"],"a":2,"b":"• 실내 침입 시 젖은 휴지로 덮어서 잡는다.\n• 밤에는 실내등을 끄고, 밖을 밝게 하여 옥외로 유인한다.\n• 잡목이나 풀숲에서 대량으로 발생할 때 잔류분무나 공간 살포를 실시한다.","e":"독나방은 몸과 날개의 독모(털)가 피부염을 일으키므로 젖은 휴지로 덮어 독모가 날리지 않게 잡고, 주광성이 강해 실내등을 끄고 밖을 밝혀 유인한다. 빈대는 실내 은신처에 사는 흡혈 곤충이고, 모낭진드기는 사람 모낭에 기생해 이런 방제법과 관계없다."},{"id":"43-1-102","r":43,"p":1,"n":102,"s":"위생곤충학","q":"개미의 특징으로 옳은 것은?","o":["독립생활을 한다.","완전변태를 한다.","먹이습성은 편식성이다.","수개미는 여왕개미보다 크다.","일개미는 숙주특이성이 강하다."],"a":2,"e":"개미는 벌목에 속하며 알-유충-번데기-성충의 완전변태를 한다. 개미는 독립생활이 아닌 사회생활(군서)을 하고, 잡식성이며, 군체에서 몸이 가장 큰 것은 여왕개미다."},{"id":"43-1-103","r":43,"p":1,"n":103,"s":"위생곤충학","q":"진드기를 아목(Suborder)으로 분류할 때 기준은?","o":["기문의 위치","슬절의 존재","의두의 존재","협각의 위치","구하체의 모양"],"a":1,"e":"진드기는 기문(숨구멍)의 위치와 유무에 따라 후기문아목(참진드기), 중기문아목, 전기문아목(털진드기), 무기문아목(옴진드기 등)으로 분류한다. 협각·구하체 같은 구기 형태는 과나 속 수준의 분류에 주로 쓰인다."},{"id":"43-1-104","r":43,"p":1,"n":104,"s":"위생곤충학","q":"참진드기에 의해 전파되는 감염병은?","o":["참호열","말라리아","사상충증","로키산홍반열","쯔쯔가무시증"],"a":4,"e":"참진드기는 로키산홍반열, 라임병, 중증열성혈소판감소증후군(SFTS), 진드기매개뇌염 등을 전파한다. 쯔쯔가무시증은 털진드기 유충이, 참호열은 몸이가, 말라리아는 얼룩날개모기가 전파한다."},{"id":"43-1-105","r":43,"p":1,"n":105,"s":"위생곤충학","q":"쥐의 방제방법 중 물리적 방제에 해당하는 것은?","o":["천적 이용","방서시설 설치","불임약제 이용","급성 살서제 사용","만성 살서제 사용"],"a":2,"e":"쥐의 물리적 방제는 약제 없이 방서시설(방서망, 쥐가 들어오지 못하는 구조물)이나 덫 등으로 침입을 막거나 포획하는 방법이다. 천적 이용은 생물학적 방제, 불임약제와 급성·만성 살서제 사용은 화학적 방제다."},{"id":"43-2-1","r":43,"p":2,"n":1,"s":"공중보건학","q":"세계보건기구에서 정한 건강의 정의는?","o":["신체적으로 완전한 상태","정신적으로 건전한 상태","질병이 없고 허약하지 않은 상태","신체적, 정신적으로 완전무결한 상태","신체적, 정신적, 사회적으로 안녕한 상태"],"a":5,"e":"세계보건기구(WHO) 헌장(1948)은 건강을 ‘단순히 질병이 없거나 허약하지 않은 상태가 아니라 신체적, 정신적, 사회적으로 완전히 안녕한 상태’로 정의한다. ‘질병이 없고 허약하지 않은 상태’는 정의 안에서 오히려 부정되는 소극적 개념이고, ‘신체적, 정신적으로 완전무결한 상태’는 사회적 안녕이 빠져 있어 틀리다."},{"id":"43-2-2","r":43,"p":2,"n":2,"s":"공중보건학","q":"국민건강증진종합계획을 수립해야 하는 자는?","o":["보건소장","시 · 도지사","질병관리청장","보건복지부장관","시장 · 군수 · 구청장"],"a":4,"e":"「국민건강증진법」에 따라 국민건강증진종합계획은 보건복지부장관이 관계 중앙행정기관의 장과 협의를 거쳐 5년마다 수립한다. 시·도지사와 시장·군수·구청장은 종합계획을 바탕으로 매년 실행계획을 수립·시행하는 주체이므로 종합계획 수립권자가 아니다."},{"id":"43-2-3","r":43,"p":2,"n":3,"s":"공중보건학","q":"특정 강 유역에서 간흡충증이 일정한 발생 양상을 유지하며 지속적으로 나타날 때의 역학현상은?","o":["주기적(periodic)","산발적(sporadic)","토착적(endemic)","유행적(epidemic)","범발적(pandemic)"],"a":3,"e":"토착적(endemic) 발생은 특정 지역에 질병이 일정한 수준으로 늘 존재하는 양상으로, 강 유역 주민의 간흡충증이 대표적인 예이다. 유행적(epidemic)은 평소 기대 수준을 넘어 발생하는 경우이고, 산발적(sporadic)은 시간·지역적으로 불규칙하게 흩어져 발생하는 경우이다."},{"id":"43-2-4","r":43,"p":2,"n":4,"s":"공중보건학","q":"다음에서 설명하는 역학연구방법은?","o":["단면연구","사례연구","실험연구","코호트연구","환자-대조군연구"],"a":1,"b":"• 일정한 시점에서 유병률을 산출하여 질병발생의 상호 관련성을 조사한다.\n• 상관관계만을 알 수 있을 뿐 인과관계를 설명하기는 어렵다.","e":"단면연구는 일정 시점에서 질병과 요인을 동시에 조사해 유병률을 구하고 상관관계를 파악하는 방법이며, 요인과 질병의 선후관계를 알 수 없어 인과관계 설명이 어렵다. 코호트연구는 시간 흐름에 따라 발생률을 관찰해 인과관계 추론에 유리하고, 환자-대조군연구는 과거 노출을 거슬러 조사하는 방법이다."},{"id":"43-2-5","r":43,"p":2,"n":5,"s":"공중보건학","q":"분석역학의 역할은?","o":["질병의 자연사 기술","감염병의 발생이나 유행 예측","질병발생의 원인에 대한 가설 검정","지역사회의 건강수준 및 질병양상 기술","환자의 인적, 지역적, 시간적 특성 조사"],"a":3,"e":"분석역학은 기술역학에서 세운 가설을 단면연구, 환자-대조군연구, 코호트연구 등으로 검정하여 질병의 원인을 규명하는 2단계 역학이다. 인적·지역적·시간적 특성 조사나 지역사회 질병양상 기술은 기술역학의 역할이고, 감염병 유행 예측은 이론역학의 역할이다."},{"id":"43-2-6","r":43,"p":2,"n":6,"s":"공중보건학","q":"전향성 코호트연구의 장점은?","o":["조사대상자가 적어도 된다.","희귀한 질병 조사에 적합하다.","조사시간과 비용이 적게 든다.","빠른 시일 내에 결과를 얻을 수 있다.","질병발생률에 의한 위험도를 구할 수 있다."],"a":5,"e":"전향성 코호트연구는 노출군과 비노출군을 추적하여 질병 발생률을 직접 산출하므로 상대위험도(비교위험도)와 귀속위험도를 구할 수 있다. 반면 대상자가 많이 필요하고 장기간 추적해 시간·비용이 많이 들며, 희귀질병 조사에는 환자-대조군연구가 더 적합하다."},{"id":"43-2-7","r":43,"p":2,"n":7,"s":"공중보건학","q":"인위적인 개입으로 윤리적인 문제가 발생될 수 있는 역학연구 방법은?","o":["기술역학","실험역학","분석역학","이론역학","작전역학"],"a":2,"e":"실험역학은 연구자가 백신·약물 투여 등 요인을 인위적으로 개입·조작하여 결과를 비교하므로 대상자에게 위해가 갈 수 있어 윤리적 문제가 생긴다. 기술역학과 분석역학은 이미 존재하는 현상이나 노출을 관찰할 뿐 인위적으로 개입하지 않는다."},{"id":"43-2-8","r":43,"p":2,"n":8,"s":"공중보건학","q":"감염병 발생 이론의 변천 과정으로 옳은 것은?","o":["장기설 → 접촉전염설 → 미생물병인설","장기설 → 미생물병인설 → 접촉전염설","접촉전염설 → 장기설 → 미생물병인설","접촉전염설 → 미생물병인설 → 장기설","미생물병인설 → 장기설 → 접촉전염설"],"a":1,"e":"감염병 이론은 나쁜 공기(miasma)가 병을 일으킨다는 장기설(고대 히포크라테스 시대)에서, 접촉으로 전염된다는 접촉전염설(16세기 프라카스토로), 그리고 파스퇴르·코흐가 병원미생물을 증명한 미생물병인설(19세기) 순으로 변천했다. 미생물병인설은 가장 최근의 이론이므로 앞에 올 수 없다."},{"id":"43-2-9","r":43,"p":2,"n":9,"s":"공중보건학","q":"병원소로부터 병원체의 기계적 탈출과 관련이 있는 것은?","o":["객담","분변","재채기","주사기","토사물"],"a":4,"e":"기계적 탈출은 주사기나 흡혈곤충처럼 기구·매개체가 혈액 등에서 병원체를 직접 꺼내는 방식이다. 객담·재채기는 호흡기계 탈출, 분변·토사물은 소화기계 탈출에 해당한다."},{"id":"43-2-10","r":43,"p":2,"n":10,"s":"공중보건학","q":"감염병의 일반적인 관리방법 중 숙주 대책에 해당하는 것은?","o":["구충구서","면역증강","식품위생","전파예방","환경위생"],"a":2,"e":"숙주 대책은 감수성 숙주의 저항력을 높이는 것으로 예방접종 등 면역증강, 영양관리, 휴식 등이 해당한다. 구충구서, 식품위생, 환경위생은 병원체가 숙주에 도달하는 길을 끊는 전파경로(환경) 대책이다."},{"id":"43-2-11","r":43,"p":2,"n":11,"s":"공중보건학","q":"인수공통감염병은?","o":["결핵","풍진","홍역","백일해","디프테리아"],"a":1,"e":"결핵은 소(우형결핵균)에서 우유 등을 통해 사람에게도 감염되는 인수공통감염병이다. 풍진, 홍역, 백일해, 디프테리아는 사람만 병원소로 하는 감염병이다."},{"id":"43-2-12","r":43,"p":2,"n":12,"s":"공중보건학","q":"병원체가 바이러스인 소화기계 감염병은?","o":["두창","홍역","백일해","콜레라","폴리오"],"a":5,"e":"폴리오(급성회백수염)는 폴리오바이러스가 분변-경구 경로로 감염되는 소화기계 감염병이다. 콜레라는 소화기계이지만 세균(Vibrio cholerae)이 원인이고, 두창·홍역은 바이러스성이지만 호흡기계 감염병이다."},{"id":"43-2-13","r":43,"p":2,"n":13,"s":"공중보건학","q":"경구감염이 주된 경로이지만 유충이 경피적으로 침입하여 발생할 수 있는 기생충 감염병은?","o":["구충증","요충증","조충증","회충증","간흡충증"],"a":1,"e":"구충(십이지장충)은 오염된 채소 등으로 경구감염되며, 토양 속 감염형 유충이 피부를 뚫고 경피감염도 일으킨다(채독증). 회충과 요충은 충란이 입으로 들어오는 경구감염만 일어난다."},{"id":"43-2-14","r":43,"p":2,"n":14,"s":"공중보건학","q":"후천적으로 교정이 불가능한 만성질환의 위험인자는?","o":["생활습관","스트레스","유전적 소인","부적절한 식이","신체활동 부족"],"a":3,"e":"유전적 소인, 성, 연령은 개인이 바꿀 수 없는 교정 불가능 위험인자이다. 생활습관, 스트레스, 부적절한 식이, 신체활동 부족은 행동 변화로 교정 가능한 위험인자이다."},{"id":"43-2-15","r":43,"p":2,"n":15,"s":"공중보건학","q":"동맥경화증이나 신장질환 등의 원인질환에 의해 2차적으로 발생하는 고혈압은?","o":["본태성 고혈압","속발성 고혈압","수축성 고혈압","원발성 고혈압","이완성 고혈압"],"a":2,"e":"속발성(이차성) 고혈압은 신장질환, 내분비질환, 동맥경화증 등 원인질환에 의해 이차적으로 생기는 고혈압이다. 본태성 고혈압과 원발성 고혈압은 같은 말로, 원인을 알 수 없는 고혈압이며 전체 고혈압의 대부분을 차지한다."},{"id":"43-2-16","r":43,"p":2,"n":16,"s":"공중보건학","q":"만성질환의 예방대책은?","o":["고염식 식이","음주와 흡연","적절한 체중 관리","동물성 지방 과다 섭취","고콜레스테롤 음식 섭취"],"a":3,"e":"적절한 체중 관리는 비만과 연관된 고혈압, 당뇨병, 이상지질혈증 등 만성질환을 예방하는 핵심 생활습관이다. 고염식, 음주와 흡연, 동물성 지방·고콜레스테롤 음식 섭취는 모두 만성질환의 위험요인이다."},{"id":"43-2-17","r":43,"p":2,"n":17,"s":"공중보건학","q":"전 인류의 건강 달성에 목적을 두고 1948년 국제연합의 경제사회이사회 전문기관의 하나로 발족한 기구는?","o":["국제노동기구","세계보건기구","유엔개발계획","유엔아동기금","유엔인구기금"],"a":2,"e":"세계보건기구(WHO)는 1948년 4월 7일 국제연합 경제사회이사회 산하 보건 전문기구로 발족했으며, 이날이 세계보건의 날이다. 국제노동기구(ILO)는 1919년 창설되어 시기가 맞지 않고, 유엔아동기금(UNICEF)은 아동 구호가 목적이다."},{"id":"43-2-18","r":43,"p":2,"n":18,"s":"공중보건학","q":"참모조직의 특성은?","o":["임무와 책임한계가 명확하다.","일관된 정책을 수행할 수 있다.","강력한 통제력을 발휘할 수 있다.","신속하게 사업을 수행할 수 있다.","수평적인 업무의 조정과 협조가 가능하다."],"a":5,"e":"참모조직은 계선조직을 보좌하며 전문지식을 제공하고 부서 간 수평적인 업무 조정과 협조를 가능하게 한다. 임무와 책임한계의 명확성, 강력한 통제력, 신속한 업무 수행, 일관된 정책 수행은 명령계통이 수직적인 계선조직의 특성이다."},{"id":"43-2-19","r":43,"p":2,"n":19,"s":"공중보건학","q":"일제강점기 경찰국에 설치되었던 보건행정조직은?","o":["노동과","보건과","사회과","위생과","후생과"],"a":4,"e":"일제강점기에는 보건행정이 위생경찰 체제로 운영되어 경찰조직 안에 위생과를 두고 위생 업무를 담당하게 했다. 보건과·후생과 등은 광복 이후 보건행정 조직 개편 과정에서 등장한 명칭이다."},{"id":"43-2-20","r":43,"p":2,"n":20,"s":"공중보건학","q":"보건소의 업무 중에서 특별히 지역주민의 만성질환 예방 및 건강한 생활습관 형성을 지원하기 위하여 읍 · 면 · 동을 기준으로 1개씩 설치할 수 있는 지역보건의료기관은?","o":["보건지소","보건의료원","보건진료소","건강생활지원센터","정신건강복지센터"],"a":4,"e":"「지역보건법」상 건강생활지원센터는 만성질환 예방과 건강한 생활습관 형성을 지원하기 위해 읍·면·동마다 1개씩 설치할 수 있는 기관이다. 보건지소는 읍·면마다 1개씩 설치할 수 있는 보건소의 지소이고, 보건진료소는 의료취약지역에 설치되는 기관이다."},{"id":"43-2-21","r":43,"p":2,"n":21,"s":"공중보건학","q":"세계보건기구 서태평양지역사무소 본부가 있는 곳은?","o":["일본의 동경","태국의 방콕","인도의 뉴델리","호주의 시드니","필리핀의 마닐라"],"a":5,"e":"WHO 서태평양지역사무소(WPRO)는 필리핀 마닐라에 있으며 우리나라가 소속되어 있다. 인도 뉴델리에는 동남아시아지역사무소(SEARO)가 있고, 북한이 이 지역에 속한다."},{"id":"43-2-22","r":43,"p":2,"n":22,"s":"공중보건학","q":"환자에게 의료비용의 일부를 부담하게 함으로써 의료이용의 남용을 방지하여 건강보험의 재정 안정성을 도모하기 위한 것은?","o":["과징금","미수금","상환금","대지급금","본인일부부담금"],"a":5,"e":"본인일부부담금은 진료비 일부를 환자가 직접 내게 하여 불필요한 의료이용(도덕적 해이)을 억제하고 건강보험 재정 안정을 도모하는 제도이다. 과징금은 법 위반에 대한 금전적 제재이고, 상환금은 진료비를 먼저 낸 뒤 돌려받는 방식과 관련된 개념이다."},{"id":"43-2-23","r":43,"p":2,"n":23,"s":"공중보건학","q":"우리나라에서 전 국민에게 건강보험이 실시된 연도는?","o":["1963년","1977년","1987년","1989년","2000년"],"a":4,"e":"우리나라는 1977년 500인 이상 사업장 직장의료보험을 시작으로 1988년 농어촌 지역, 1989년 도시지역 의료보험을 실시하여 전 국민 의료보험을 달성했다. 1963년은 「의료보험법」 제정, 2000년은 의료보험 조직이 국민건강보험공단으로 통합된 해이다."},{"id":"43-2-24","r":43,"p":2,"n":24,"s":"공중보건학","q":"인구정태에 해당하는 것은?","o":["사망","성비","이혼","전입","출생"],"a":2,"e":"인구정태는 특정 시점의 인구 상태로 인구 규모, 성별·연령별 구성, 성비, 인구밀도 등이 해당한다. 출생, 사망, 전입, 이혼은 일정 기간 동안의 인구 변동을 나타내는 인구동태 통계이다."},{"id":"43-2-25","r":43,"p":2,"n":25,"s":"공중보건학","q":"출생률과 사망률이 모두 높은 후진국형 인구구조는?","o":["별형","종형","호로형","항아리형","피라미드형"],"a":5,"e":"피라미드형은 출생률과 사망률이 모두 높은 다산다사형으로 후진국형 인구구조이다. 종형은 출생률과 사망률이 모두 낮은 선진국형이고, 항아리형은 출생률이 사망률보다 낮아 인구가 감소하는 형태이다."},{"id":"43-2-26","r":43,"p":2,"n":26,"s":"공중보건학","q":"다음에서 설명하는 영양소는?","o":["수분","지방","단백질","무기질","탄수화물"],"a":3,"b":"• 체조직의 구성물질, 열량 공급\n• 결핍 시 콰시오커(Kwashiorkor), 마라스무스(Marasmus) 유발","e":"단백질은 체조직을 구성하고 1 g당 4 kcal의 열량을 내며, 결핍 시 부종이 특징인 콰시오커와 에너지·단백질이 모두 부족한 마라스무스를 일으킨다. 탄수화물과 지방도 열량을 내지만 체조직 구성과 콰시오커 유발이라는 특징에는 맞지 않는다."},{"id":"43-2-27","r":43,"p":2,"n":27,"s":"공중보건학","q":"「모자보건법」에서 정하고 있는 용어의 뜻이 옳은 것은?","o":["‘모성’이란 임산부와 가임기 여성을 말한다.","‘영유아’란 출생 후 1세 미만의 사람을 말한다.","‘신생아’란 출생 후 30일 이후의 영유아를 말한다.","‘임산부’란 임신 중이거나 분만 후 1년 미만인 여성을 말한다.","‘선천성이상아’란 출생 시 체중이 2,500 g 미만인 영유아를 말한다."],"a":1,"e":"「모자보건법」에서 ‘모성’은 임산부와 가임기 여성을 말한다. ‘임산부’는 임신 중이거나 분만 후 6개월 미만인 여성이며, ‘신생아’는 출생 후 28일 이내의 영유아, ‘영유아’는 출생 후 6년 미만인 사람이고, 출생 시 체중 2,500 g 미만은 ‘선천성이상아’가 아니라 ‘미숙아’의 기준이다."},{"id":"43-2-28","r":43,"p":2,"n":28,"s":"공중보건학","q":"초고령사회(super-aged society)는 전체 인구 중 만 65세 이상의 인구가 몇 % 이상일 때인가?","o":["3","7","10","14","20"],"a":5,"e":"UN 기준으로 65세 이상 인구 비율이 7% 이상이면 고령화사회, 14% 이상이면 고령사회, 20% 이상이면 초고령사회이다. 14%는 고령사회 기준이므로 초고령사회와 혼동하지 않도록 한다."},{"id":"43-2-29","r":43,"p":2,"n":29,"s":"공중보건학","q":"대상자들이 직접 실제상황 중의 한 인물로 연기하면서 그 인물의 입장이나 처지를 이해하고, 건강문제나 상황을 분석하여 해결방안을 모색하는 보건교육방법은?","o":["역할극","워크숍","심포지엄","패널토의","브레인스토밍"],"a":1,"e":"역할극은 대상자가 실제 상황 속 인물을 직접 연기하며 그 입장을 이해하고 문제 해결방안을 모색하는 교육방법이다. 패널토의는 전문가 여러 명이 청중 앞에서 토의하는 방식이고, 브레인스토밍은 자유롭게 아이디어를 내는 집단토의 방식이다."},{"id":"43-2-30","r":43,"p":2,"n":30,"s":"공중보건학","q":"불특정 다수를 대상으로 하는 보건교육방법으로 옳은 것은?","o":["면접","상담","전화","가정방문","텔레비전 방송"],"a":5,"e":"텔레비전 방송은 대중매체를 이용한 집단 보건교육방법으로 불특정 다수에게 한꺼번에 정보를 전달할 수 있다. 면접, 상담, 전화, 가정방문은 특정 개인을 대상으로 하는 개인 접촉 방법이다."},{"id":"43-2-31","r":43,"p":2,"n":31,"s":"공중보건학","q":"학교보건교육과 학생들의 건강관리를 전담하는 인력은?","o":["간호사","영양사","위생사","보건교사","체육교사"],"a":4,"e":"「학교보건법」에 따라 학교에는 보건교육과 학생 건강관리를 담당하는 보건교사를 둔다. 영양사는 학교급식 관리를, 체육교사는 체육 교과 수업을 담당하므로 보건교육 전담 인력이 아니다."},{"id":"43-2-32","r":43,"p":2,"n":32,"s":"공중보건학","q":"정신장애의 외부적 원인에 해당하는 것은?","o":["성","연령","유전","체질","스트레스"],"a":5,"e":"스트레스는 생활환경, 인간관계 등 외부 환경에서 오는 정신장애의 외부적 원인이다. 성, 연령, 유전, 체질은 개인이 타고난 내부적(소인적) 원인이다."},{"id":"43-2-33","r":43,"p":2,"n":33,"s":"공중보건학","q":"특정 질병에 이환된 사람 중 사망한 사람을 백분율로 나타낸 것은?","o":["치명률","2차 발병률","비례사망률","주산기사망률","사인별 사망률"],"a":1,"e":"치명률은 특정 질병에 이환된 환자 중 그 질병으로 사망한 사람의 비율(사망자 수 ÷ 환자 수 × 100)로 질병의 위중도를 나타낸다. 비례사망률은 전체 사망자 중 특정 원인 사망자의 비율이고, 2차 발병률은 환자와 접촉한 감수성자 중 발병한 비율이다."},{"id":"43-2-34","r":43,"p":2,"n":34,"s":"공중보건학","q":"유병률(prevalence rate)을 산출할 때 분자가 되는 것은?","o":["특정 질병에 의한 사망 수","조사 시점(기간)의 환자 수","환자를 접촉한 감수성자 수","해당 연도에 새로 발생한 환자 수","일정기간 동안 위험에 노출된 인구 수"],"a":2,"e":"유병률은 특정 시점(기간)에 존재하는 모든 환자 수(신환자와 기존 환자 포함)를 그 시점의 인구로 나눈 값이다. 해당 기간에 새로 발생한 환자 수를 분자로 하는 것은 발생률이고, 환자 접촉 감수성자 수는 2차 발병률의 분모이다."},{"id":"43-2-35","r":43,"p":2,"n":35,"s":"공중보건학","q":"테러에 사용되는 생물무기의 특징으로 옳은 것은?","o":["운반이 어렵다.","은닉이 용이하다.","비용이 많이 든다.","전파경로의 차단이 쉽다.","생산시설의 규모가 커야 한다."],"a":2,"e":"생물무기는 소량으로도 대량 피해를 줄 수 있고 크기가 작아 은닉과 운반이 쉬우며, 적은 비용과 소규모 시설로 생산할 수 있다. 따라서 운반이 어렵다거나 비용이 많이 들고 대규모 생산시설이 필요하다는 설명은 반대이다."},{"id":"43-2-36","r":43,"p":2,"n":36,"s":"식품위생학","q":"바실러스(Bacillus) 속에 관한 설명으로 옳은 것은?","o":["편모가 없다.","포자를 형성한다.","편성혐기성균이다.","그람음성 간균이다.","단백질 분해력이 약하다."],"a":2,"e":"Bacillus 속은 그람양성 호기성(또는 통성혐기성) 간균으로 내열성 포자를 형성하고 주모성 편모를 가지며 단백질 분해력이 강하다. 편성혐기성 포자형성균은 Clostridium 속이므로 혼동하지 않도록 한다."},{"id":"43-2-37","r":43,"p":2,"n":37,"s":"식품위생학","q":"미생물의 생육에 관여하는 물리적 인자는?","o":["산소","온도","영양소","이산화탄소","수소이온농도(pH)"],"a":2,"e":"온도는 미생물 생육에 영향을 주는 대표적인 물리적 인자이며, 수분·압력·광선(방사선) 등도 물리적 인자로 분류된다. 영양소와 수소이온농도(pH)는 화학적 인자로 분류된다. ※ 교재 확인 권장"},{"id":"43-2-38","r":43,"p":2,"n":38,"s":"식품위생학","q":"유기성(유인성) 식품 위해물질은?","o":["복어독","잔류 농약","아플라톡신","아크릴아마이드","황색포도상구균"],"a":4,"e":"유기성(유인성) 위해물질은 식품의 제조·가공·저장 과정에서 생성되는 물질로, 전분식품을 고온 조리할 때 생기는 아크릴아마이드가 대표적이다. 복어독은 식품 자체에 있는 내인성 자연독이고, 잔류 농약은 외부에서 들어온 외인성 위해물질이다."},{"id":"43-2-39","r":43,"p":2,"n":39,"s":"식품위생학","q":"LD₅₀에 관한 설명으로 옳은 것은?","o":["일일섭취허용량(ADI)이다.","만성독성 실험에 이용된다.","값이 클수록 독성이 강하다.","실험동물의 체중 g당 mg으로 나타낸다.","실험동물의 50%가 사망하는 투여량이다."],"a":5,"e":"LD₅₀(반수치사량)은 실험동물의 50%가 사망하는 투여량으로 급성독성 평가에 쓰이며, 체중 kg당 mg(mg/kg)으로 나타낸다. 값이 작을수록 독성이 강하고, 일일섭취허용량(ADI)은 만성독성 실험 결과로 정하는 별개의 지표이다."},{"id":"43-2-40","r":43,"p":2,"n":40,"s":"식품위생학","q":"수분활성도가 가장 낮은 조건에서 생육 가능한 미생물은?","o":["Bacillus 속","Proteus 속","Aspergillus 속","Escherichia 속","Micrococcus 속"],"a":3,"e":"생육 최저 수분활성도는 일반적으로 세균(약 0.90 이상) > 효모(약 0.88) > 곰팡이(약 0.80) 순으로, 곰팡이인 Aspergillus 속이 가장 낮은 수분활성도에서 자랄 수 있다. Bacillus, Proteus, Escherichia, Micrococcus 속은 모두 세균이어서 더 높은 수분활성도가 필요하다."},{"id":"43-2-41","r":43,"p":2,"n":41,"s":"식품위생학","q":"식품을 보존하기 위한 화학적 처리 방법은?","o":["건조","가열 살균","자외선 조사","냉장 및 냉동","수소이온농도(pH) 조절"],"a":5,"e":"수소이온농도(pH) 조절은 산을 첨가하거나 산 발효 등으로 미생물 생육을 억제하는 화학적 보존법이다. 건조, 가열 살균, 자외선 조사, 냉장 및 냉동은 모두 물리적 보존법이다."},{"id":"43-2-42","r":43,"p":2,"n":42,"s":"식품위생학","q":"식품미생물 중 세균은?","o":["Mucor 속","Candida 속","Penicillium 속","Pseudomonas 속","Saccharomyces 속"],"a":4,"e":"Pseudomonas 속은 그람음성 간균으로 저온에서도 증식하는 대표적인 부패세균이다. Mucor 속과 Penicillium 속은 곰팡이, Candida 속과 Saccharomyces 속은 효모이다."},{"id":"43-2-43","r":43,"p":2,"n":43,"s":"식품위생학","q":"식품 성분 중에서 지방이 변질되는 현상은?","o":["부패","발효","분산","산패","응고"],"a":4,"e":"산패는 유지(지방)가 산소, 빛, 열 등에 의해 산화·분해되어 불쾌한 냄새와 맛이 나는 현상이다. 부패는 단백질이 미생물에 의해 분해되어 유해물질이 생기는 현상이고, 발효는 탄수화물 등이 분해되어 유익한 물질이 생기는 현상이다."},{"id":"43-2-44","r":43,"p":2,"n":44,"s":"식품위생학","q":"비가열 살균법은?","o":["간헐멸균법","건열멸균법","자비소독법","자외선살균법","고압증기멸균법"],"a":4,"e":"자외선살균법은 260 nm 부근(약 2,537 Å)의 자외선을 쬐어 미생물의 DNA를 손상시키는 비가열 살균법이다. 간헐멸균법, 건열멸균법, 자비소독법, 고압증기멸균법은 모두 열을 이용하는 가열 살균법이다."},{"id":"43-2-45","r":43,"p":2,"n":45,"s":"식품위생학","q":"살균력이 가장 강한 에탄올의 농도로 옳은 것은?","o":["10%","30%","50%","70%","90%"],"a":4,"e":"에탄올은 70~75% 농도에서 살균력이 가장 강한데, 적당한 수분이 있어야 균체 내부로 침투하여 단백질을 변성시키기 때문이다. 90% 이상 고농도는 표면 단백질만 급격히 응고시켜 침투력이 떨어진다."},{"id":"43-2-46","r":43,"p":2,"n":46,"s":"식품위생학","q":"독버섯의 유독성분은?","o":["리신(ricin)","셉신(sepsine)","아코니틴(aconitine)","무스카린(muscarine)","아미그달린(amygdalin)"],"a":4,"e":"무스카린은 광대버섯, 땀버섯 등 독버섯의 유독성분으로 부교감신경 흥분 증상(발한, 유연, 동공 축소 등)을 일으킨다. 리신은 피마자, 아코니틴은 투구꽃(바꽃), 아미그달린은 청매(덜 익은 매실)의 독성분이다."},{"id":"43-2-47","r":43,"p":2,"n":47,"s":"식품위생학","q":"붉은곰팡이(Fusarium) 속이 생성하는 독소로 가축의 비정상적인 발정을 유발하는 것은?","o":["푸모니신(fumonisin)","말토리진(maltoryzine)","제랄레논(zearalenone)","루브라톡신(rubratoxin)","트리코테센(trichothecene)"],"a":3,"e":"제랄레논은 Fusarium 속이 생성하는 에스트로겐 유사 독소로 돼지 등 가축에 비정상적인 발정, 불임, 유산을 일으킨다. 트리코테센도 Fusarium 독소이지만 조혈기능 장애(식중독성 무백혈구증)를 일으키고, 루브라톡신은 Penicillium 독소로 간장독이다."},{"id":"43-2-48","r":43,"p":2,"n":48,"s":"식품위생학","q":"다음에 해당하는 식중독균은?","o":["Campylobacter jejuni","Clostridium perfringens","Listeria monocytogenes","Salmonella Typhimurium","Vibrio parahaemolyticus"],"a":3,"b":"• 그람양성 통성혐기성 간균이다.\n• 저온(5℃) 및 염분이 높은 조건에서도 증식이 가능하다.\n• 감염될 경우 패혈증이나 유산을 유발하기도 한다.","e":"Listeria monocytogenes는 그람양성 통성혐기성 간균으로 냉장온도와 고염 조건에서도 증식하며, 임산부에게 유산·사산, 면역저하자에게 패혈증·수막염을 일으킨다. Clostridium perfringens는 편성혐기성 포자형성균이고, Vibrio parahaemolyticus는 그람음성 호염균이다."},{"id":"43-2-49","r":43,"p":2,"n":49,"s":"식품위생학","q":"병원성대장균 O157 : H7이 생성하는 독소로 옳은 것은?","o":["베로톡신(verotoxin)","뉴로톡신(neurotoxin)","아플라톡신(aflatoxin)","에르고톡신(ergotoxin)","오크라톡신(ochratoxin)"],"a":1,"e":"장출혈성대장균 O157:H7은 베로톡신(시가독소 유사 독소)을 생성하여 출혈성 대장염과 용혈성요독증후군을 일으킨다. 뉴로톡신은 보툴리누스균의 신경독소이고, 아플라톡신과 오크라톡신은 Aspergillus 속 곰팡이독소이다."},{"id":"43-2-50","r":43,"p":2,"n":50,"s":"식품위생학","q":"신장독을 일으키는 곰팡이독소는?","o":["파튤린(patulin)","시트리닌(citrinin)","루테오스카이린(luteoskyrin)","아이슬란디톡신(islanditoxin)","시트레오비리딘(citreoviridin)"],"a":2,"e":"시트리닌은 Penicillium citrinum이 생성하는 황변미 독소로 신장독을 일으킨다. 루테오스카이린과 아이슬란디톡신은 Penicillium islandicum이 생성하는 간장독이고, 시트레오비리딘과 파튤린은 신경독이다."},{"id":"43-2-51","r":43,"p":2,"n":51,"s":"식품위생학","q":"캠필로박터 식중독균에 관한 설명으로 옳은 것은?","o":["구균","그람음성","편모 없음","포자 형성","편성혐기성"],"a":2,"e":"캠필로박터(Campylobacter jejuni)는 그람음성 나선형(S자형) 간균으로 미호기성이며, 극모성 편모를 가지고 포자를 형성하지 않는다. 따라서 구균, 편모 없음, 포자 형성, 편성혐기성은 모두 틀린 설명이다."},{"id":"43-2-52","r":43,"p":2,"n":52,"s":"식품위생학","q":"다음에 해당하는 식중독은?","o":["리스테리아","병원성대장균","황색포도상구균","바실러스 세레우스","클로스트리듐 퍼프린젠스"],"a":2,"b":"• 원인균은 그람음성 간균이다.\n• 원인균은 포자를 생성하지 않는다.\n• 원인균은 유당을 분해하여 산과 가스를 생성한다.","e":"병원성대장균은 그람음성 무포자 간균이며, 대장균군의 특징대로 유당을 분해하여 산과 가스를 생성한다. 황색포도상구균은 그람양성 구균이고, 바실러스 세레우스와 클로스트리듐 퍼프린젠스는 그람양성 포자형성균이다."},{"id":"43-2-53","r":43,"p":2,"n":53,"s":"식품위생학","q":"세균성 식중독에서 치사율이 가장 높은 것은?","o":["살모넬라","여시니아","보툴리누스","캠필로박터","황색포도상구균"],"a":3,"e":"보툴리누스 식중독은 신경독소(뉴로톡신)에 의해 신경마비와 호흡곤란을 일으켜 세균성 식중독 중 치사율이 가장 높다. 살모넬라, 캠필로박터, 황색포도상구균 식중독은 주로 위장관 증상을 보이며 치사율이 낮다."},{"id":"43-2-54","r":43,"p":2,"n":54,"s":"식품위생학","q":"유해 착색료는?","o":["붕산(boric acid)","롱갈리트(rongalite)","아우라민(auramine)","에틸렌글리콜(ethylene glycol)","삼염화질소(nitrogen trichloride)"],"a":3,"e":"아우라민은 황색 염기성 타르색소로 과거 단무지 등에 쓰였던 유해 착색료이다. 붕산은 유해 보존료, 롱갈리트와 삼염화질소는 유해 표백제, 에틸렌글리콜은 유해 감미료에 해당한다."},{"id":"43-2-55","r":43,"p":2,"n":55,"s":"식품위생학","q":"유기인계 농약은?","o":["BHC","DDT","fussol","carbaryl","malathion"],"a":5,"e":"말라티온(malathion)은 파라티온, 다이아지논과 함께 대표적인 유기인계 농약으로 콜린에스테라제 활성을 저해한다. BHC와 DDT는 유기염소계, fussol은 유기불소계, carbaryl은 카바메이트계 농약이다."},{"id":"43-2-56","r":43,"p":2,"n":56,"s":"식품위생학","q":"마비성 조개 중독의 원인독소는?","o":["삭시톡신(saxitoxin)","팰리톡신(palytoxin)","테트라민(tetramine)","시구아테린(ciguaterin)","펙테노톡신(pectenotoxin)"],"a":1,"e":"삭시톡신은 유독 플랑크톤(와편모조류)을 섭취한 섭조개·홍합·대합 등에 축적되어 마비성 조개 중독을 일으키는 신경독소이다. 테트라민은 소라·고둥 등 권패류의 타액선 독이고, 펙테노톡신은 설사성 패독 계열이다."},{"id":"43-2-57","r":43,"p":2,"n":57,"s":"식품위생학","q":"모시조개에 의한 간장독 식중독 원인물질은?","o":["베네루핀(venerupin)","아플라톡신(aflatoxin)","오카다산(okadaic acid)","테트로도톡신(tetrodotoxin)","네오수르가톡신(neosurugatoxin)"],"a":1,"e":"베네루핀은 모시조개, 바지락, 굴 등에 함유된 간장독으로 열에 안정하여 가열해도 잘 파괴되지 않는다. 오카다산은 설사성 패독이고, 테트로도톡신은 복어의 신경독이다."},{"id":"43-2-58","r":43,"p":2,"n":58,"s":"식품위생학","q":"원인식품과 그 독성분의 연결이 옳은 것은?","o":["고사리 – 듀린(dhurrin)","독보리 – 테물린(temuline)","복어 – 테트라민(tetramine)","권패류 – 시구아테린(ciguaterin)","청매 – 프타퀼로시드(ptaquiloside)"],"a":2,"e":"독보리(지네보리)의 유독성분은 테물린(temuline)이다. 고사리의 독성분은 프타퀼로시드, 청매는 아미그달린, 복어는 테트로도톡신, 권패류는 테트라민이며, 듀린은 수수의 독성분이다."},{"id":"43-2-59","r":43,"p":2,"n":59,"s":"식품위생학","q":"목화씨에 들어있는 독성 물질은?","o":["콜린(choline)","리시닌(ricinine)","솔라닌(solanine)","고시폴(gossypol)","시큐톡신(cicutoxin)"],"a":4,"e":"고시폴은 목화씨(면실)와 정제가 불충분한 면실유에 들어 있는 독성분이다. 리시닌은 피마자, 솔라닌은 감자 싹과 녹색 부위, 시큐톡신은 독미나리의 독성분이다."},{"id":"43-2-60","r":43,"p":2,"n":60,"s":"식품위생학","q":"아플라톡신(aflatoxin) 중에서 독성이 가장 강한 것은?","o":["B₁","B₂","G₁","G₂","Q₁"],"a":1,"e":"아플라톡신 중 B₁이 독성과 간암 유발성이 가장 강하며, 자외선 아래에서 청색 형광(Blue)을 낸다. G₁, G₂는 녹색 형광(Green)을 내며 B₁보다 독성이 약하다."},{"id":"43-2-61","r":43,"p":2,"n":61,"s":"식품위생학","q":"급성회백수염의 병원체는?","o":["Hepatitis virus","Vibrio cholerae","Salmonella typhi","Poliomyelitis virus","Yersinia pseudotuberculosis"],"a":4,"e":"급성회백수염은 폴리오(소아마비)로, 병원체는 Poliomyelitis virus(폴리오바이러스)이다. Salmonella typhi는 장티푸스, Vibrio cholerae는 콜레라, Hepatitis virus는 바이러스성 간염의 병원체이다."},{"id":"43-2-62","r":43,"p":2,"n":62,"s":"식품위생학","q":"이질균에 대한 설명으로 옳은 것은?","o":["주모균","그람음성","포자 형성","협막 형성","편성혐기성균"],"a":2,"e":"이질균(Shigella 속)은 그람음성 간균으로 편모가 없어 운동성이 없고, 포자와 협막을 형성하지 않는 통성혐기성균이다. 주모균이라는 설명은 살모넬라·대장균 등에 해당한다."},{"id":"43-2-63","r":43,"p":2,"n":63,"s":"식품위생학","q":"디프테리아의 원인균은?","o":["Brucella suis","Shigella dysenteriae","Salmonella paratyphi","Mycobacterium tuberculosis","Corynebacterium diphtheriae"],"a":5,"e":"디프테리아의 원인균은 Corynebacterium diphtheriae로, 외독소를 생성해 인후에 위막을 형성한다. Shigella dysenteriae는 세균성이질, Mycobacterium tuberculosis는 결핵, Brucella suis는 브루셀라증의 원인균이다."},{"id":"43-2-64","r":43,"p":2,"n":64,"s":"식품위생학","q":"용혈성 연쇄상구균이 병원체인 경구감염병은?","o":["성홍열","콜레라","장티푸스","파라티푸스","유행성 간염"],"a":1,"e":"성홍열은 A군 용혈성 연쇄상구균(Streptococcus pyogenes)이 원인으로, 비말 외에 오염된 음식물로도 감염될 수 있다. 콜레라, 장티푸스, 파라티푸스는 그람음성 간균이 원인이고, 유행성 간염은 바이러스가 원인이다."},{"id":"43-2-65","r":43,"p":2,"n":65,"s":"식품위생학","q":"우유 매개성 감염병은?","o":["결핵","돈단독","야토병","렙토스피라증","신증후군출혈열"],"a":1,"e":"결핵은 우형결핵균에 감염된 소의 우유를 통해 사람에게 전파될 수 있어 대표적인 우유 매개 감염병이며, 우유 살균으로 예방한다. 돈단독은 돼지, 야토병은 산토끼, 렙토스피라증과 신증후군출혈열은 쥐 등 설치류와 관련된다."},{"id":"43-2-66","r":43,"p":2,"n":66,"s":"식품위생학","q":"다음에 해당하는 인수공통감염병은?","o":["결핵","Q열","브루셀라증","살모넬라병","리스테리아병"],"a":3,"b":"• 불규칙적인 발열이 특징이다.\n• 파상열이라고도 한다.\n• 가축 유산의 원인이 되기도 한다.","e":"브루셀라증은 발열이 오르내리는 파상열이 특징이며, 소·돼지·염소 등 가축에게 유산을 일으킨다. Q열도 발열이 나타나지만 파상열이라 부르지 않고, 리스테리아병은 사람의 유산과 관련된다."},{"id":"43-2-67","r":43,"p":2,"n":67,"s":"식품위생학","q":"요코가와흡충의 제1중간숙주는?","o":["가재","새우","다슬기","물벼룩","오징어"],"a":3,"e":"요코가와흡충은 제1중간숙주가 다슬기, 제2중간숙주가 은어·숭어 등 담수어이다. 가재는 폐흡충의 제2중간숙주이고, 물벼룩은 광절열두조충·유극악구충의 제1중간숙주이다."},{"id":"43-2-68","r":43,"p":2,"n":68,"s":"식품위생학","q":"제1중간숙주는 물벼룩이고, 제2중간숙주는 민물어류인 기생충은?","o":["간흡충","선모충","폐흡충","아니사키스","유극악구충"],"a":5,"e":"유극악구충은 제1중간숙주가 물벼룩, 제2중간숙주가 가물치·메기 등 민물어류이며 종숙주는 개·고양이이다. 간흡충은 제1중간숙주가 왜우렁이이고, 폐흡충은 다슬기 → 가재·게를 거친다."},{"id":"43-2-69","r":43,"p":2,"n":69,"s":"식품위생학","q":"과자류 및 빵류를 제조할 때 재료를 부풀게 할 목적으로 사용되는 식품첨가물은?","o":["유화제","이형제","팽창제","피막제","밀가루개량제"],"a":3,"e":"팽창제는 탄산수소나트륨, 명반 등으로 가스를 발생시켜 과자·빵을 부풀게 하는 식품첨가물이다. 이형제는 빵을 틀에서 쉽게 분리하기 위해 쓰고, 유화제는 물과 기름을 섞이게 하는 데 쓴다."},{"id":"43-2-70","r":43,"p":2,"n":70,"s":"식품위생학","q":"식품첨가물 중 차아염소산나트륨의 작용은?","o":["살균작용","증점작용","착색작용","추출작용","팽창작용"],"a":1,"e":"차아염소산나트륨은 살균제로 음용수, 식기, 과일·채소의 소독에 사용된다(참깨에는 사용 금지). 증점·착색·팽창 작용은 각각 증점제, 착색료, 팽창제의 역할이다."},{"id":"43-2-71","r":43,"p":2,"n":71,"s":"식품위생학","q":"식품제조 과정에서 발생하는 거품을 없애기 위하여 사용되는 식품첨가물은?","o":["강화제","발색제","소포제","표백제","추출용제"],"a":3,"e":"소포제는 식품 제조 과정에서 생기는 거품을 없애거나 줄이기 위해 사용하며, 규소수지(실리콘수지)가 대표적이다. 표백제는 색을 제거하고, 추출용제는 성분을 추출하는 데 사용한다."},{"id":"43-2-72","r":43,"p":2,"n":72,"s":"식품위생학","q":"식품의 점도를 높이고 유화 안정성을 향상시키는 식품첨가물은?","o":["산미료","증점제","착향료","고결방지제","향미증진제"],"a":2,"e":"증점제는 카복시메틸셀룰로스, 알긴산나트륨 등으로 식품의 점도를 높이고 유화 안정성을 향상시킨다. 산미료는 신맛을, 고결방지제는 분말 식품이 굳는 것을 막는 역할을 한다."},{"id":"43-2-73","r":43,"p":2,"n":73,"s":"식품위생학","q":"방사선조사 처리에 대한 설명으로 옳은 것은?","o":["식품의 온도 상승이 크다.","¹³⁷Cs의 알파선을 사용한다.","발아 촉진을 목적으로 한다.","과일, 채소의 숙성을 촉진한다.","식품 포장 후에도 살균 처리가 가능하다."],"a":5,"e":"방사선(감마선)은 투과력이 강하여 식품을 포장한 상태로도 살균 처리가 가능하다. 온도 상승이 거의 없는 냉살균법이며, 주로 ⁶⁰Co의 감마선을 이용해 발아 억제와 숙도(숙성) 지연을 목적으로 사용하므로 발아·숙성 촉진은 반대 설명이다."},{"id":"43-2-74","r":43,"p":2,"n":74,"s":"식품위생학","q":"다음 식품안전관리인증기준(HACCP)에서 설명하는 정의에 해당하는 것은?","o":["개선조치 수립","모니터링 확립","위해요소 분석","한계기준 설정","중요관리점 결정"],"a":3,"b":"식품 · 축산물 안전에 영향을 줄 수 있는 위해요소와 이를 유발할 수 있는 조건이 존재하는지 여부를 판별하기 위하여 필요한 정보를 수집하고 평가하는 일련의 과정을 말한다.","e":"위해요소 분석은 식품·축산물 안전에 영향을 줄 수 있는 위해요소와 그 유발 조건이 존재하는지 판별하기 위해 정보를 수집하고 평가하는 과정으로, HACCP 7원칙 중 첫 번째이다. 중요관리점 결정은 위해요소를 예방·제거하거나 허용수준 이하로 줄일 수 있는 단계를 정하는 것이고, 한계기준 설정은 중요관리점의 관리 기준치를 정하는 것이다."},{"id":"43-2-75","r":43,"p":2,"n":75,"s":"식품위생학","q":"식품안전관리인증기준(HACCP) 준비단계의 순서로 옳은 것은?","o":["㉢ → ㉠ → ㉣ → ㉡ → ㉤","㉢ → ㉡ → ㉠ → ㉣ → ㉤","㉢ → ㉡ → ㉤ → ㉠ → ㉣","㉢ → ㉣ → ㉤ → ㉡ → ㉠","㉢ → ㉤ → ㉡ → ㉠ → ㉣"],"a":5,"b":"㉠ 공정흐름도 작성\n㉡ 제품의 용도 확인\n㉢ HACCP팀 구성\n㉣ 공정흐름도 현장 확인\n㉤ 제품 설명서 작성","e":"HACCP 준비 5단계는 HACCP팀 구성 → 제품 설명서 작성 → 제품의 용도 확인 → 공정흐름도 작성 → 공정흐름도 현장 확인 순서이며, 이후 7원칙(위해요소 분석부터)이 이어진다. 제품의 용도 확인은 제품 설명서 작성 다음에 오고, 공정흐름도 현장 확인은 반드시 공정흐름도 작성 이후에 한다."},{"id":"43-3-1","r":43,"p":3,"n":1,"s":"실기시험","q":"그림의 봉상 알코올 온도계를 이용하여 작은 공간의 공기 온도를 측정할 때, 온도계의 최소 노출 시간으로 옳은 것은?","o":["15초","30초","1분","2분","3분"],"a":5,"e":"사진: 봉상 온도계(막대형 유리 온도계) — 가는 유리 막대 속에 착색된 알코올(또는 은색 수은) 기둥과 눈금이 새겨져 있는 형태다. 봉상 온도계로 기온을 잴 때는 온도계가 주위 공기와 열평형에 이르도록 충분히 노출해야 하며, 알코올 온도계는 최소 3분(수은 온도계는 2분) 이상 노출한 뒤 읽는다. 15초·30초·1분은 평형에 도달하기에 너무 짧은 시간이다.","ph":["s18"],"m":"그림"},{"id":"43-3-2","r":43,"p":3,"n":2,"s":"실기시험","q":"고온 작업환경의 쾌적 조건을 나타내는 습구흑구온도지수(WBGT Index, wet bulb globe temperature index)를 구하기 위해 필요한 요소는?","o":["쾌적선","등온지수","불쾌지수","카타냉각력","자연습구온도"],"a":5,"e":"WBGT는 자연습구온도, 흑구온도, 건구온도로 구하며, 옥내(태양광선 없음)는 0.7×자연습구온도 + 0.3×흑구온도, 옥외(태양광선 있음)는 0.7×자연습구온도 + 0.2×흑구온도 + 0.1×건구온도로 계산한다. 불쾌지수는 건구·습구온도로 구하는 별도 지표이고, 카타냉각력은 카타온도계로 재는 기류·냉각력 지표라 WBGT의 구성 요소가 아니다."},{"id":"43-3-3","r":43,"p":3,"n":3,"s":"실기시험","q":"대기오염공정시험기준에서 미세먼지의 입경 기준은?","o":["5 μm 이하","7 μm 이하","10 μm 이하","13 μm 이하","15 μm 이하"],"a":3,"e":"대기오염공정시험기준에서 미세먼지(PM10)는 입자의 공기역학적 지름이 10 μm 이하인 먼지를 말한다. 2.5 μm 이하는 초미세먼지(PM2.5)이며, 5·7·13·15 μm는 기준으로 쓰이지 않는다."},{"id":"43-3-4","r":43,"p":3,"n":4,"s":"실기시험","q":"환경대기 중의 먼지농도를 측정하는 기기는?","o":["직독식검지관","원자흡수분광광도계","고용량공기시료채취기","비분산적외선분광광도계","자외선가시선분광광도계"],"a":3,"e":"고용량공기시료채취기(High Volume Air Sampler)는 다량의 공기를 여과지에 통과시켜 포집된 먼지 무게로 환경대기 중 먼지(부유먼지) 농도를 구하는 기기다. 원자흡수분광광도계는 중금속 분석에, 비분산적외선분광광도계는 일산화탄소 등 가스 분석에 쓰이며, 직독식검지관은 현장에서 가스 농도를 바로 읽는 기구다."},{"id":"43-3-5","r":43,"p":3,"n":5,"s":"실기시험","q":"그림의 소음계로 환경기준 중 일반지역의 소음측정에서, 가능한 한 측정점 반경 얼마 이내에 장애물이 없어야 하는가?","o":["1.5 m","2.5 m","3.5 m","4.5 m","5.5 m"],"a":3,"e":"사진: 소음계 — 앞쪽 끝에 마이크로폰(흔히 스펀지 방풍망 씌움)이 있고 손잡이형 본체에 표시창과 조작 버튼이 있는 형태다. 소음·진동공정시험기준상 환경기준 일반지역 측정은 옥외를 원칙으로 하며, 가능한 한 측정점 반경 3.5 m 이내에 담·건물 같은 반사성 장애물이 없는 지점의 지면 위 1.2~1.5 m 높이에서 측정한다. 1.5 m는 측정 높이 기준과 헷갈리기 쉬운 숫자다.","ph":["s19"],"m":"그림"},{"id":"43-3-6","r":43,"p":3,"n":6,"s":"실기시험","q":"진동 가속도레벨의 단위는?","o":["Bq","dB","Hz","phon","sone"],"a":2,"e":"진동가속도레벨(VAL)은 기준 가속도에 대한 측정 가속도의 비를 로그로 나타낸 값이라 단위는 dB이다(감각보정한 진동레벨은 dB(V)). Hz는 주파수 단위, phon과 sone은 소리의 크기 단위, Bq는 방사능 단위다."},{"id":"43-3-7","r":43,"p":3,"n":7,"s":"실기시험","q":"(사진 1) 평판집락법에 따라 중온일반세균수를 측정할 때 사용하는 사진의 기기는?","o":["비색계","분광광도계","질량분석기","집락계수기","기체크로마토그래피"],"a":4,"e":"사진: 집락계수기(콜로니 카운터) — 페트리접시를 올려놓는 조명 받침판(격자판) 위에 확대렌즈가 달려 있고, 집락을 짚으며 세는 계수 장치가 있는 형태다. 평판집락법은 배양(중온일반세균은 35℃ 내외 48시간) 후 평판에 생긴 집락 수를 세어 세균수를 구하므로 집락계수기를 사용한다. 분광광도계·비색계는 흡광도나 색 비교로 농도를 측정하는 기기라 집락 계수와는 관계없다.","ph":["s20"],"m":"사진"},{"id":"43-3-8","r":43,"p":3,"n":8,"s":"실기시험","q":"하·폐수의 물리적 처리 중 비중이 큰 무기성 입자가 다른 입자의 영향을 받지 않고 침전할 경우 침전속도에 관한 법칙으로 옳은 것은?","o":["보일의 법칙","샤를의 법칙","허블의 법칙","헨리의 법칙","스토크스의 법칙"],"a":5,"e":"비중이 큰 무기성 입자가 서로 간섭 없이 독립적으로 가라앉는 독립침전(Ⅰ형 침전)의 침전속도는 스토크스의 법칙(침전속도 = g(ρs−ρw)d²/18μ)을 따르며, 입자 지름의 제곱과 밀도 차에 비례하고 점성계수에 반비례한다. 헨리의 법칙은 기체의 용해도, 보일·샤를의 법칙은 기체의 압력·부피·온도 관계에 관한 법칙이다."},{"id":"43-3-9","r":43,"p":3,"n":9,"s":"실기시험","q":"용액의 분자나 입자가 물리적 또는 화학적 결합력에 의해 고체 표면에 붙는 현상은?","o":["부상","응집","중화","침강","흡착"],"a":5,"e":"흡착은 용액 속 분자나 입자가 물리적(반데르발스 힘) 또는 화학적 결합력으로 고체 표면에 달라붙는 현상으로, 활성탄 처리가 대표적이다. 응집은 응집제를 넣어 미세입자를 뭉쳐 플록을 만드는 것이고, 침강은 입자가 중력으로 가라앉는 것이다."},{"id":"43-3-10","r":43,"p":3,"n":10,"s":"실기시험","q":"열처리나 화학적 살균제를 사용할 수 없는 액체의 살균에 사용하는 비가열 살균법은?","o":["건열멸균법","세균여과법","염소소독법","자비멸균법","화염멸균법"],"a":2,"e":"세균여과법은 가열하거나 살균제를 넣을 수 없는 액체(혈청, 백신, 당액 등)를 미세한 여과기에 통과시켜 세균을 걸러내는 비가열 제균법이며, 바이러스는 제거되지 않는다. 건열멸균법·자비멸균법·화염멸균법은 모두 열을 이용하고, 염소소독법은 화학적 살균제를 쓰므로 조건에 맞지 않는다."},{"id":"43-3-11","r":43,"p":3,"n":11,"s":"실기시험","q":"먹는물수질공정시험기준에서 총대장균군을 분석할 때, 추정시험단계에서 양·음성을 판정하기 위해 사용하는 기구는?","o":["뷰렛","네슬러관","다람시험관","둥근플라스크","킬달플라스크"],"a":3,"e":"총대장균군 추정시험에서는 유당배지가 든 시험관 속에 다람시험관(Durham tube)을 거꾸로 넣고 배양하여, 관 안에 가스가 모이면 양성으로 판정한다. 네슬러관은 비색 분석용, 킬달플라스크는 질소 분석용 기구다."},{"id":"43-3-12","r":43,"p":3,"n":12,"s":"실기시험","q":"다음은 먹는물수질공정시험기준에서 제시하는 경도의 정의이다. (    ) 안에 들어갈 것으로 옳은 것은?","o":["염화칼슘","탄산칼슘","크롬산칼륨","산화마그네슘","염화마그네슘"],"a":2,"b":"경도(hardness)란 먹는물 중에 존재하는 칼슘과 마그네슘의 농도를 (          )의 농도(mg/L)로 나타낸 값이다.","e":"먹는물수질공정시험기준에서 경도는 물속 칼슘과 마그네슘 농도를 탄산칼슘(CaCO₃)으로 환산한 농도(mg/L)로 나타낸다. 염화칼슘·염화마그네슘은 경도를 일으키는 염의 한 종류일 뿐 환산 기준 물질이 아니다."},{"id":"43-3-13","r":43,"p":3,"n":13,"s":"실기시험","q":"먹는물수질공정시험기준에서 불소를 측정하기 위한 시료를 4℃ 냉암소에 보관할 때, 최대로 보존할 수 있는 일수는?","o":["3일","7일","14일","21일","28일"],"a":5,"e":"먹는물수질공정시험기준에서 불소 시료는 4℃ 냉암소에 보관할 때 최대 28일까지 보존할 수 있다. 불소는 비교적 안정한 무기이온이라 보존기간이 긴 편이며, 3일·7일처럼 짧은 기간은 미생물이나 휘발성 성분처럼 변하기 쉬운 항목과 헷갈린 것이다."},{"id":"43-3-14","r":43,"p":3,"n":14,"s":"실기시험","q":"화학적산소요구량(CODCr)을 측정하기 위해 다이크롬산칼륨법(적정법)을 사용할 경우 적정 종말점의 색깔 변화로 옳은 것은?","o":["청색 → 무색","청록색 → 적갈색","무색 → 엷은 갈색","무색 → 엷은 홍색","무색 → 엷은 적황색"],"a":2,"e":"CODCr(다이크롬산칼륨법) 적정법은 남은 다이크롬산칼륨을 황산제일철암모늄 용액으로 적정하며, 지시약 1,10-페난트롤린(페로인)에 의해 종말점에서 청록색이 적갈색으로 변한다. 무색 → 엷은 홍색은 과망간산칼륨법(CODMn)의 종말점이라 헷갈리지 않도록 한다."},{"id":"43-3-15","r":43,"p":3,"n":15,"s":"실기시험","q":"폴리염화비닐(PVC) 재질의 식품 포장재에서 용출될 수 있는 내분비교란물질은?","o":["둘신","메탄올","니트로소아민","파라티온화합물","프탈레이트화합물"],"a":5,"e":"프탈레이트화합물은 PVC를 부드럽게 만드는 가소제로, 식품 포장재에서 용출될 수 있는 대표적인 내분비교란물질(환경호르몬)이다. 둘신은 사용이 금지된 인공감미료이고, 니트로소아민은 아질산염과 아민이 반응해 생기는 발암물질이다."},{"id":"43-3-16","r":43,"p":3,"n":16,"s":"실기시험","q":"그림의 장치로 식품에 들어있는 곤충 및 동물의 털과 같이 물에 젖지 않는 가벼운 이물을 검출하는 방법은?","o":["침강법","여과법","적정법","체분별법","와일드만플라스크법"],"a":5,"e":"사진: 와일드만 트랩 플라스크 — 삼각플라스크 안에 끝에 마개(고무 원판)가 달린 긴 막대가 꽂혀 있어, 막대를 올리고 내려 플라스크 목을 막을 수 있는 형태다. 와일드만플라스크법은 곤충이나 동물의 털처럼 물에 젖지 않는 가벼운 이물을 유기용매(휘발유 등)로 포집해 물 층과 경계면에 떠오르게 하여 분리·검출한다. 침강법은 쥐똥·흙처럼 무거운 이물을, 체분별법은 비교적 큰 이물을 체로 거르는 방법이다.","ph":["s21","g:wildman"],"m":"그림"},{"id":"43-3-17","r":43,"p":3,"n":17,"s":"실기시험","q":"식품공전에 의한 우유류 규격기준 중 산도(젖산으로서) 값으로 옳은 것은?","o":["0.18% 이하","0.19~0.20%","0.25~0.30%","0.35~0.40%","0.45% 이상"],"a":1,"e":"식품공전 우유류 규격에서 산도(젖산으로서)는 0.18% 이하이다. 산도가 높으면 유산균 등에 의한 젖산 생성, 즉 신선도 저하를 뜻하므로 상한 기준(이하)으로 정해진 것이며, 일정 범위나 이상으로 표시된 보기는 틀리다."},{"id":"43-3-18","r":43,"p":3,"n":18,"s":"실기시험","q":"단백질 식품의 신선도 및 부패 판정에 이용되는 검사는?","o":["요오드가","비누화가","카르보닐가","과산화물가","휘발성염기질소"],"a":5,"e":"휘발성염기질소(VBN)는 단백질이 미생물에 의해 분해될 때 생기는 암모니아·아민류를 측정하는 것으로, 어육 등 단백질 식품의 신선도·초기부패 판정에 쓰인다. 과산화물가·카르보닐가는 유지의 산패도, 요오드가는 불포화도, 비누화가는 지방산 분자량의 지표라 지방 관련 검사다."},{"id":"43-3-19","r":43,"p":3,"n":19,"s":"실기시험","q":"(사진 2) 사진은 삼각 플라스크 등 초자기구를 160~170℃에서 1~2시간 멸균하는 기기이다. 이 기기의 명칭은?","o":["건열멸균기","자비멸균기","방사선멸균기","고압증기멸균기","유통증기멸균기"],"a":1,"e":"사진: 건열멸균기 — 앞쪽에 여닫이문이 달린 금속 상자(오븐)형으로, 온도조절 장치와 내부 선반이 있다. 건열멸균기는 160~170℃에서 1~2시간 건조한 열로 유리기구(초자기구)·금속기구 등을 멸균한다. 고압증기멸균기는 압력계가 달린 밀폐 용기에서 121℃ 포화증기로 15~20분 멸균하므로 조건이 다르다.","ph":["s22"],"m":"사진"},{"id":"43-3-20","r":43,"p":3,"n":20,"s":"실기시험","q":"식품공전에서 우유류 살균법 중 초고온순간처리법(UHT, ultra high temperature short time method)의 온도와 시간으로 옳은 것은?","o":["63~65℃, 30분","75~95℃, 5.0~15초","130~150℃, 0.5~5초","160~180℃, 0.5~3초","190~210℃, 0.1~1초"],"a":3,"e":"식품공전에서 우유류의 초고온순간처리법(UHT)은 130~150℃에서 0.5~5초간 가열하는 방법이다. 63~65℃ 30분은 저온장시간살균법(LTLT)이며, 고온단시간살균법(HTST)은 72~75℃에서 15~20초간 처리한다."},{"id":"43-3-21","r":43,"p":3,"n":21,"s":"실기시험","q":"그림의 백금이를 멸균하는 방법은?","o":["습열멸균","증기멸균","화염멸균","화학소독","자외선멸균"],"a":3,"e":"사진: 백금이(접종 고리) — 긴 손잡이 끝에 가는 백금(또는 니크롬) 선을 둥근 고리 모양으로 만든 접종 도구다. 백금이는 알코올램프나 분젠버너 불꽃에 선 부분을 빨갛게 달굴 때까지 가열하는 화염멸균으로 멸균한다. 습열·증기멸균은 배지나 기구를 고압증기멸균기 등에서 멸균할 때 쓰는 방법이다.","ph":["s23"],"m":"그림"},{"id":"43-3-22","r":43,"p":3,"n":22,"s":"실기시험","q":"그림과 같이 단편모가 있으며 3~5% 식염수에서 잘 증식하는 간균은?","o":["살모넬라균","세레우스균","여시니아균","리스테리아균","장염비브리오균"],"a":5,"e":"사진: 장염비브리오균 — 약간 굽은 막대 모양 균체의 한쪽 끝에 긴 편모가 하나 달린(단모성) 형태다. 장염비브리오균은 그람음성 간균으로 3~5% 식염수에서 잘 자라는 호염성 세균이며, 어패류 생식으로 감염된다. 살모넬라균은 주모성 편모를 가지며 호염성이 아니고, 리스테리아균은 그람양성 간균이다.","ph":["s24"],"m":"그림"},{"id":"43-3-23","r":43,"p":3,"n":23,"s":"실기시험","q":"병원성 대장균 O157:H7은 분류상 어디에 속하는가?","o":["장관병원성 대장균","장관응집성 대장균","장관출혈성 대장균","장관침투성 대장균","장관독소원성 대장균"],"a":3,"e":"O157:H7은 베로독소(시가독소)를 생성하여 출혈성 설사와 용혈성요독증후군을 일으키는 장관출혈성 대장균(EHEC)에 속한다. 장관독소원성 대장균은 장독소로 여행자 설사를, 장관침투성 대장균은 장 점막 침입으로 이질과 비슷한 증상을 일으킨다."},{"id":"43-3-24","r":43,"p":3,"n":24,"s":"실기시험","q":"식품 섭취 후 2~4시간 내에 심한 구역, 구토, 설사를 유발하는 독소형 식중독 균은?","o":["브루셀라(Brucella)","살모넬라(Salmonella)","에어로모나스(Aeromonas)","캠필로박터(Campylobacter)","황색포도상구균(Staphylococcus)"],"a":5,"e":"황색포도상구균은 식품 속에서 내열성 장독소(엔테로톡신)를 만드는 독소형 식중독균으로, 잠복기가 평균 약 3시간으로 짧고 심한 구역·구토·설사를 일으킨다. 살모넬라와 캠필로박터는 균 자체가 장에서 증식하는 감염형이라 잠복기가 보통 12시간 이상으로 길다."},{"id":"43-3-25","r":43,"p":3,"n":25,"s":"실기시험","q":"그림과 같이 채찍과 같은 형태의 기생충으로, 채소를 통하여 감염되는 것은?","o":["편충","유구조충","무구조충","아니사키스","광절열두조충"],"a":1,"e":"사진: 편충 — 몸의 앞쪽 약 3/5이 채찍처럼 가늘고 길며 뒤쪽은 굵은 형태이고, 충란은 양 끝에 마개 같은 돌기가 있는 술통 모양이다. 편충은 충란에 오염된 채소 등을 통해 경구 감염되며 주로 맹장에 기생한다. 유구조충은 돼지고기, 무구조충은 소고기, 아니사키스는 해산 어류를 통해 감염된다.","ph":["s25"],"m":"그림"},{"id":"43-3-26","r":43,"p":3,"n":26,"s":"실기시험","q":"(사진 3) 어린이에게 수면장애, 식욕감소, 불쾌감, 신경과민과 발작을 초래하며, 항문 주위에 산란하는 사진의 기생충은?","o":["회충","요충","폐흡충","간흡충","요코가와흡충"],"a":2,"e":"사진: 요충 — 흰 실 모양의 작은 선충으로 암컷은 꼬리가 뾰족하고, 충란은 한쪽이 납작한 비대칭 타원형이다. 요충 암컷은 밤에 항문 주위로 나와 산란하므로 항문 주위 가려움, 수면장애, 신경과민 등이 생기며, 셀로판테이프 항문주위도말법으로 진단하고 가족·집단 감염이 잦다. 회충은 소장에 기생하며 대변으로 충란이 배출되므로 항문 주위 산란과는 관계없다.","ph":["s26"],"m":"사진"},{"id":"43-3-27","r":43,"p":3,"n":27,"s":"실기시험","q":"(사진 4) 사진에서 보이는 장티푸스균의 편모 및 균의 형태는?","o":["단모성 간균","단모성 구균","양모성 구균","주모성 간균","주모성 구균"],"a":4,"e":"사진: 장티푸스균 — 막대 모양 균체의 표면 전체에서 여러 개의 편모가 사방으로 뻗어 있는 형태다. 장티푸스균(Salmonella Typhi)은 그람음성 간균이며 균체 둘레에 편모가 고루 분포하는 주모성 편모를 가진다. 단모성은 한쪽 끝에 편모가 하나뿐인 형태(예: 비브리오)이며, 장티푸스균은 둥근 구균이 아니다.","ph":["s27"],"m":"사진"},{"id":"43-3-28","r":43,"p":3,"n":28,"s":"실기시험","q":"(사진 5) 사진과 같이 포자가 있는 그람양성 간균이 원인균인 인수공통감염병은?","o":["Q열","탄저","야토병","발진티푸스","신증후군출혈열"],"a":2,"e":"사진: 탄저균 — 굵고 큰 막대균이 대나무 마디처럼 사슬로 이어지고 균체 안에 밝게 비치는 포자가 보이는 형태다. 탄저는 포자를 형성하는 그람양성 대형 간균(Bacillus anthracis)이 원인인 인수공통감염병으로, 소·양 등 초식동물과 접촉하거나 오염 육류를 먹어 감염된다. Q열은 리케치아성 세균(Coxiella), 야토병은 그람음성 세균, 신증후군출혈열은 한타바이러스가 원인이다.","ph":["s28"],"m":"사진"},{"id":"43-3-29","r":43,"p":3,"n":29,"s":"실기시험","q":"다음의 특징이 있는 위생곤충은?","o":["개미","등에","바퀴","빈대","파리"],"a":3,"b":"• 잡식성\n• 군서습성\n• 야간활동성\n• 불완전변태","e":"바퀴는 무엇이든 먹는 잡식성이고, 집합페로몬으로 무리 지어 사는 군서습성, 밤에 활동하는 야간활동성을 가지며, 알-약충-성충의 불완전변태를 한다. 빈대도 야간활동성·불완전변태지만 피만 빠는 흡혈성이라 잡식성이 아니고, 파리는 번데기 단계가 있는 완전변태를 한다."},{"id":"43-3-30","r":43,"p":3,"n":30,"s":"실기시험","q":"크기가 4.5 mm 정도이고 체색이 암갈색이며 주둥이 중앙에 백색 띠가 있는 그림의 위생곤충은?","o":["광릉왕모기","토고숲모기","흰줄숲모기","작은빨간집모기","중국얼룩날개모기"],"a":4,"e":"사진: 작은빨간집모기 — 몸길이 약 4.5 mm의 소형 암갈색 모기로, 주둥이 중앙에 흰 띠가 있는 것이 핵심 특징이다. 작은빨간집모기는 일본뇌염을 매개하며 논·웅덩이 등에서 발생한다. 흰줄숲모기는 검은 몸의 가슴 등판에 흰 줄이 하나 있고 다리에 흰 띠가 있으며, 중국얼룩날개모기는 날개에 흑백 반점이 있고 말라리아를 매개한다.","ph":["s29"],"m":"그림"},{"id":"43-3-31","r":43,"p":3,"n":31,"s":"실기시험","q":"(사진 6) 사진의 생물로 방제할 수 있는 위생곤충은?","o":["개미 유충","나방 유충","말벌 유충","모기 유충","벼룩 유충"],"a":4,"e":"사진: 모기고기(Gambusia) — 몸길이 수 cm의 작은 회갈색 민물고기로, 입이 위를 향하고 꼬리지느러미가 둥글며 암컷은 배가 불룩하다. 모기고기는 물 표면 가까이 사는 장구벌레(모기 유충)를 잡아먹으므로 생물학적 방제에 이용된다. 나방·벌·벼룩 유충은 물속에 살지 않아 물고기로 방제할 수 없다.","ph":["s30"],"m":"사진"},{"id":"43-3-32","r":43,"p":3,"n":32,"s":"실기시험","q":"(사진 7) 사진의 위생곤충은?","o":["등에 유충","깔따구 유충","나방파리 유충","등에모기 유충","모래파리 유충"],"a":2,"e":"사진: 깔따구 유충 — 가늘고 긴 원통형 몸에 마디가 뚜렷하며, 헤모글로빈 때문에 선명한 붉은색을 띠는 경우가 많다. 깔따구 유충은 유기물이 많은 오염된 물(하수구, 정체수 등)에서 대량 발생하여 수질오염 지표생물로 쓰이며, 성충은 흡혈하지 않지만 알레르기 원인이 된다. 나방파리 유충은 회색빛의 작은 유충이고, 등에 유충은 굵은 방추형이라 구별된다.","ph":["s31"],"m":"사진"},{"id":"43-3-33","r":43,"p":3,"n":33,"s":"실기시험","q":"그림의 위생곤충에 대한 설명으로 옳은 것은?","o":["사람의 머리털에 기생한다.","사람의 음부털에 기생한다.","쥐가 서식하는 동굴에 서식한다.","들쥐의 귀와 항문 주위에 기생한다.","풀잎의 끝에 모여 숙주를 기다린다."],"a":2,"e":"사진: 사면발이 — 몸이 짧고 넓은 게 모양이며, 가운데·뒷다리에 털을 붙잡는 굵은 발톱이 있다. 사면발이는 주로 사람의 음부털에 기생하며 성접촉 등 밀접 접촉으로 전파된다. 사람의 머리털에 기생하는 것은 길쭉한 몸의 머릿니이고, 풀잎 끝에 모여 숙주를 기다리는 것은 참진드기의 습성이다.","ph":["s32"],"m":"그림"},{"id":"43-3-34","r":43,"p":3,"n":34,"s":"실기시험","q":"(사진 8) 사진과 같은 방법으로 발견할 수 있는 위생곤충은?","o":["등에","모기","빈대","파리","깔따구"],"a":3,"e":"사진: 빈대 흔적 — 침대 매트리스 이음새나 틈을 들추어 보면 검은 점 같은 배설물 자국, 핏자국, 탈피 껍질, 흰 쌀알 모양의 알이 보인다. 빈대는 낮에는 침대·가구 틈에 숨어 있다가 밤에 흡혈하므로 이런 은신처를 직접 살펴 발견한다. 모기·파리·깔따구는 침대 틈에 숨어 사는 곤충이 아니라 이 방법으로 찾지 않는다.","ph":["s33e"],"m":"사진"},{"id":"43-3-35","r":43,"p":3,"n":35,"s":"실기시험","q":"(사진 9) 사진의 위생곤충은?","o":["개벼룩","사람벼룩","고양이벼룩","유럽쥐벼룩","장님쥐벼룩"],"a":2,"e":"사진: 사람벼룩 — 머리가 둥글고 머리 아래쪽의 협즐치와 앞가슴등판의 전흉즐치(빗 모양 가시)가 모두 없는 것이 특징이다. 개벼룩·고양이벼룩은 협즐치와 전흉즐치를 모두 가지고, 유럽쥐벼룩은 전흉즐치만 있어 즐치 유무로 구별한다.","ph":["s34"],"m":"사진"},{"id":"43-3-36","r":43,"p":3,"n":36,"s":"실기시험","q":"(사진 10) 사진의 위생곤충이 일으키는 피해는?","o":["뇌염","관절염","피부염","출혈열","기생충증"],"a":3,"e":"예측 사진: 독나방 또는 청딱지개미반날개(화상벌레) — 독나방은 독털(독모)이 피부에 박혀서, 청딱지개미반날개는 몸이 눌릴 때 나오는 체액(페데린)이 닿아서 화상 같은 피부염을 일으킨다. 뇌염은 모기, 출혈열은 쥐·진드기가 매개하는 감염병이고 기생충증은 기생충 감염이라 접촉성 피부 피해와 구별된다. ※ 실제 사진은 비공개라 대상을 추정함","pr":1,"ph":["s35","s66"],"m":"사진"},{"id":"43-3-37","r":43,"p":3,"n":37,"s":"실기시험","q":"(사진 11) 사진의 위생곤충은?","o":["꿀벌","말벌","맵시벌","호박벌","호리병벌"],"a":2,"e":"사진: 말벌(장수말벌) — 몸이 매우 크고 주황색의 큰 머리를 가지며, 배에 흑갈색과 노란색 줄무늬가 있다. 말벌은 공격성이 강하고 독침에 쏘이면 심한 통증과 아나필락시스 쇼크를 일으킬 수 있어 위생곤충으로 다룬다. 꿀벌은 몸이 작고 털이 많으며, 호박벌은 털이 빽빽한 통통한 몸이라 구별된다.","ph":["s36"],"m":"사진"},{"id":"43-3-38","r":43,"p":3,"n":38,"s":"실기시험","q":"그림의 위생해충이 전파하는 질병은?","o":["라임병","페스트","일본뇌염","쯔쯔가무시증","진드기매개뇌염"],"a":4,"e":"사진: 털진드기 — 몸 전체에 깃털 모양의 털이 빽빽하고 붉은빛을 띠며, 흡혈하는 유충은 다리가 3쌍이다. 털진드기는 유충 시기에만 한 번 흡혈하며 이때 쯔쯔가무시증(Orientia tsutsugamushi)을 전파한다. 라임병과 진드기매개뇌염은 참진드기, 페스트는 벼룩, 일본뇌염은 모기가 매개한다.","ph":["s37"],"m":"그림"},{"id":"43-3-39","r":43,"p":3,"n":39,"s":"실기시험","q":"(사진 12) 사진의 위생동물은?","o":["곰쥐(Rattus rattus)","생쥐(Mus musculus)","등줄쥐(Apodemus agrarius)","멧밭쥐(Micromys minutus)","시궁쥐(Rattus norvegicus)"],"a":1,"e":"사진: 곰쥐 — 꼬리가 머리와 몸통을 합한 길이보다 길고, 귀가 크고 얇아 앞으로 접으면 눈을 덮으며, 주둥이가 뾰족하고 몸이 날씬하다. 곰쥐는 기어오르기를 잘해 건물 천장이나 지붕 등 높은 곳에 산다. 시궁쥐는 몸이 크고 꼬리가 몸통보다 짧으며 귀가 작고 주둥이가 뭉툭하고, 등줄쥐는 등 가운데에 검은 줄이 있다.","ph":["s16"],"m":"사진"},{"id":"43-3-40","r":43,"p":3,"n":40,"s":"실기시험","q":"그림의 기구 이름은?","o":["유문등","흡충관","파리격자","말레이트랩","베레스원추통"],"a":5,"e":"사진: 베를레제(툴그렌) 깔때기 — 위에 전등(열원)이 있고, 깔때기 안의 체망에 흙·낙엽 시료를 올리며, 아래에 알코올 수집병을 받친 구조다. 베레스원추통은 빛과 열을 피해 아래로 내려가는 토양 속 진드기 등 작은 절지동물을 깔때기 아래 용기에 모아 채집하는 기구다. 유문등은 불빛으로 야간 곤충을 유인하는 채집기이고, 말레이트랩은 텐트 모양으로 날아다니는 곤충을 잡는 기구다.","ph":["s38","g:berlese"],"m":"그림"},{"id":"44-1-1","r":44,"p":1,"n":1,"s":"위생관계법령","q":"「공중위생관리법」상 위생사의 면허취소 처분을 위해 청문을 실시하는 사람은?","o":["시·도지사","질병관리청장","보건복지부장관","국립보건연구원장","한국보건의료인국가시험원장"],"a":3,"e":"「공중위생관리법」상 위생사 면허는 보건복지부장관이 내주므로, 면허취소 처분과 그에 앞선 청문도 보건복지부장관이 한다. 시·도지사나 시장·군수·구청장은 공중위생영업소 폐쇄명령 같은 영업 관련 처분의 청문을 맡는다. 한국보건의료인국가시험원장은 국가시험만 관리한다."},{"id":"44-1-2","r":44,"p":1,"n":2,"s":"위생관계법령","q":"「공중위생관리법」상 위생사의 업무범위가 <u>아닌</u> 것은?","o":["감염병의 예방 및 방역대책","음료수의 처리 및 위생관리","쓰레기, 분뇨, 하수, 그 밖의 폐기물처리","공중위생영업소, 공중이용시설 및 위생용품의 위생관리","식품·식품첨가물과 이에 관련된 기구·용기에 관한 위생관리"],"a":1,"e":"「공중위생관리법」상 위생사의 업무범위는 공중위생영업소·공중이용시설·위생용품 위생관리, 음료수 처리·위생관리, 쓰레기·분뇨·하수 등 폐기물 처리, 식품·식품첨가물과 관련 기구·용기·포장 위생관리, 유해 곤충·설치류 및 매개체 관리 등이다. ‘감염병의 예방 및 방역대책’은 위생사 업무범위로 규정되어 있지 않다. 비슷하게 들리는 매개체 관리나 소독 업무와 헷갈리지 않도록 한다."},{"id":"44-1-3","r":44,"p":1,"n":3,"s":"위생관계법령","q":"「공중위생관리법」상 ‘같은 명칭의 사용금지’ 규정을 위반하여, 위생사라는 명칭을 사용한 자에 대한 벌칙은?","o":["100만원 이하의 과태료","200만원 이하의 과태료","300만원 이하의 과태료","400만원 이하의 과태료","500만원 이하의 과태료"],"a":1,"e":"「공중위생관리법」은 위생사가 아닌 사람이 위생사라는 명칭을 쓰지 못하게 하고, 이를 위반하면 100만원 이하의 과태료를 부과한다. 300만원·200만원 이하 과태료는 영업소 관련 의무 위반(보고·출입검사 거부, 위생관리 의무 위반 등)에 붙는 금액이라 헷갈리기 쉽다."},{"id":"44-1-4","r":44,"p":1,"n":4,"s":"위생관계법령","q":"「공중위생관리법」상 공중위생영업이 <u>아닌</u> 것은?","o":["이용업","세탁업","미용업","휴게소영업","건물위생관리업"],"a":4,"e":"「공중위생관리법」상 공중위생영업은 숙박업, 목욕장업, 이용업, 미용업, 세탁업, 건물위생관리업의 6가지다. ‘휴게소영업’은 이에 해당하지 않으며, 「식품위생법」상 휴게음식점영업과 혼동하기 쉽다."},{"id":"44-1-5","r":44,"p":1,"n":5,"s":"위생관계법령","q":"「공중위생관리법」상 목욕장 목욕물의 수질기준 중 원수의 과망간산칼륨 소비량은?","o":["10 mg/L 이하","20 mg/L 이하","30 mg/L 이하","40 mg/L 이하","50 mg/L 이하"],"a":1,"e":"「공중위생관리법」상 목욕장 원수의 과망간산칼륨 소비량 기준은 10 mg/L 이하이다. 욕조수 기준은 25 mg/L 이하로 따로 정해져 있어서 원수와 욕조수 수치를 구분해 외워야 한다."},{"id":"44-1-6","r":44,"p":1,"n":6,"s":"위생관계법령","q":"「식품위생법」상 판매를 목적으로 하는 식품 또는 식품첨가물의 기준과 규격에 대해 식품의약품안전처장이 정하여 고시하는 사항이 <u>아닌</u> 것은?","o":["성분에 관한 규격","가격에 관한 기준","사용 방법에 관한 기준","제조 방법에 관한 기준","조리 방법에 관한 기준"],"a":2,"e":"「식품위생법」상 식품의약품안전처장은 판매 목적 식품·식품첨가물의 제조·가공·사용·조리·보존 방법에 관한 기준과 성분에 관한 규격을 정하여 고시한다. ‘가격’은 위생과 관계없는 사항이라 기준·규격 고시 대상이 아니다."},{"id":"44-1-7","r":44,"p":1,"n":7,"s":"위생관계법령","q":"「식품위생법」상 위해평가에서 평가하여야 할 위해요소 중 화학적 요인이 <u>아닌</u> 것은?","o":["중금속","잔류농약","환경오염물질","식품등의 이물(異物)","잔류 동물용 의약품"],"a":4,"e":"「식품위생법」상 위해평가의 위해요소는 생물학적·화학적·물리적 요인으로 나뉜다. 중금속, 잔류농약, 잔류 동물용 의약품, 환경오염물질, 식품첨가물 등은 화학적 요인이다. ‘식품등의 이물’은 물리적 요인이다."},{"id":"44-1-8","r":44,"p":1,"n":8,"s":"위생관계법령","q":"「식품위생법」상 식품안전관리인증기준 대상 식품이 <u>아닌</u> 것은?","o":["레토르트식품","빙과류 중 빙과","어육가공품 중 어묵","냉동식품 중 피자류","다류(茶類) 및 커피류"],"a":5,"e":"「식품위생법」상 식품안전관리인증기준(HACCP) 의무 적용 대상에는 레토르트식품, 빙과류 중 빙과, 어육가공품 중 어묵, 냉동식품 중 피자류·만두류·면류 등이 들어간다. 음료류도 대상이지만 ‘다류 및 커피류’는 명시적으로 제외된다."},{"id":"44-1-9","r":44,"p":1,"n":9,"s":"위생관계법령","q":"「식품위생법」상 (   ) 안에 해당되는 것은?","o":["1","2","3","4","5"],"a":2,"b":"유전자변형식품등의 안전성 심사를 위해 설치하는 안전성 심사위원회 위원의 임기는 (   )년으로 한다. 다만, 공무원인 위원의 임기는 해당 직에 재직하는 기간, 보궐위원의 임기는 전임위원의 남은 기간으로 한다.","e":"「식품위생법」상 유전자변형식품등 안전성 심사위원회 위원의 임기는 2년이다. 공무원 위원은 재직 기간 동안, 보궐위원은 전임위원의 남은 기간 동안 맡는다는 단서까지 함께 기억해 두면 좋다."},{"id":"44-1-10","r":44,"p":1,"n":10,"s":"위생관계법령","q":"「식품위생법」상 식품위생감시원을 두지 <u>않는</u> 곳은?","o":["보건복지부","특별자치도","특별시·광역시","식품의약품안전처","시·군·구(자치구)"],"a":1,"e":"「식품위생법」상 식품위생감시원은 식품의약품안전처(지방식품의약품안전청 포함), 특별시·광역시·특별자치시·도·특별자치도, 시·군·구에 둔다. 식품위생 업무는 식품의약품안전처 소관이므로 보건복지부에는 식품위생감시원을 두지 않는다."},{"id":"44-1-11","r":44,"p":1,"n":11,"s":"위생관계법령","q":"「식품위생법」상 집단급식소를 설치·운영하려는 자는 이를 누구에게 신고해야 하는가?","o":["질병관리청장","식품의약품안전처장","지방식품의약품안전청장","시·도 보건환경연구원장","특별자치시장·특별자치도지사·시장·군수·구청장"],"a":5,"e":"「식품위생법」상 집단급식소를 설치·운영하려는 자는 특별자치시장·특별자치도지사·시장·군수·구청장에게 신고해야 한다. 식품의약품안전처장은 기준·규격 고시나 식품조사처리업 허가 등을 맡는 기관이지 집단급식소 신고를 받는 기관이 아니다."},{"id":"44-1-12","r":44,"p":1,"n":12,"s":"위생관계법령","q":"「식품위생법」상 식품의약품안전처장의 허가를 받아야 할 업종은?","o":["단란주점영업","유흥주점영업","식품조사처리업","식품첨가물제조업","식품제조·가공업"],"a":3,"e":"「식품위생법」상 식품조사처리업(방사선 조사)은 식품의약품안전처장의 허가를 받아야 한다. 단란주점·유흥주점영업은 특별자치시장·특별자치도지사·시장·군수·구청장의 허가 대상이다. 식품제조·가공업과 식품첨가물제조업은 허가가 아니라 등록 대상이다."},{"id":"44-1-13","r":44,"p":1,"n":13,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 제1급감염병은?","o":["결핵","백일해","파상풍","말라리아","신종감염병증후군"],"a":5,"e":"「감염병예방법」상 제1급감염병에는 에볼라, 페스트, 탄저, 두창, 보툴리눔독소증, 디프테리아, 신종인플루엔자 등과 함께 ‘신종감염병증후군’이 포함된다. 결핵과 백일해는 제2급, 파상풍과 말라리아는 제3급감염병이다."},{"id":"44-1-14","r":44,"p":1,"n":14,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 전파가능성을 고려하여 감염병의 발생 또는 유행 시 24시간 이내에 신고하여야 하고, 격리가 필요한 감염병은?","o":["제1급감염병","제2급감염병","제3급감염병","제4급감염병","기생충감염병"],"a":2,"e":"「감염병예방법」상 제2급감염병은 전파가능성을 고려해 발생 또는 유행 시 24시간 이내에 신고해야 하고 격리가 필요한 감염병이다. 제1급은 즉시 신고하고 음압격리 같은 높은 수준의 격리가 필요하다. 제3급은 24시간 이내에 신고하지만 격리 요건 없이 발생을 계속 감시하는 감염병이다."},{"id":"44-1-15","r":44,"p":1,"n":15,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 질병관리청장은 감염병의 예방 및 관리에 관한 기본계획을 몇 년마다 수립·시행하여야 하는가?","o":["1년","2년","3년","4년","5년"],"a":5,"e":"「감염병예방법」상 질병관리청장은 보건복지부장관과 협의하여 감염병 예방 및 관리에 관한 기본계획을 5년마다 수립·시행해야 한다. 시·도지사와 시장·군수·구청장은 이 기본계획에 따라 시행계획을 매년 수립한다."},{"id":"44-1-16","r":44,"p":1,"n":16,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 감염병관리위원회가 심의하는 내용이 <u>아닌</u> 것은?","o":["기본계획의 수립","감염병 관련 의료 제공","감염병병원체의 보유허가","감염병에 관한 조사 및 연구","감염병의 예방·관리 등에 관한 지식 보급"],"a":3,"e":"「감염병예방법」상 감염병관리위원회는 기본계획 수립, 감염병 관련 의료 제공, 감염병 조사·연구, 감염병 예방·관리 지식 보급, 예방접종 대상·기준 등 정책 사항을 심의한다. 감염병병원체(고위험병원체)의 보유·반입과 관련된 신고·허가는 위원회 심의가 아니라 질병관리청장의 행정 절차로 처리한다."},{"id":"44-1-17","r":44,"p":1,"n":17,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 질병관리청장 및 시·도지사가 실시하는 실태조사 중 ‘감염병 실태조사’에 포함되어야 할 사항이 <u>아닌</u> 것은?","o":["의료기관의 감염관리체계","감염병환자등의 임상적 증상 및 경과","감염병환자등의 연령별·성별·지역별 분포","감염병환자등의 진단·검사·처방 등 진료정보","감염병의 진료 및 연구와 관련된 인력·시설 및 장비"],"a":1,"e":"「감염병예방법」상 실태조사는 의료기관 감염관리 실태조사, 감염병 실태조사, 내성균 실태조사로 나뉜다. 감염병 실태조사에는 환자의 연령별·성별·지역별 분포, 임상 증상과 경과, 진단·검사·처방 등 진료정보, 진료·연구 관련 인력·시설·장비 등이 들어간다. ‘의료기관의 감염관리체계’는 의료기관 감염관리 실태조사에 해당하는 항목이다. ※ 교재 확인 권장"},{"id":"44-1-18","r":44,"p":1,"n":18,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 필수예방접종을 실시하여야 하는 질병이 <u>아닌</u> 것은?","o":["인플루엔자","일본뇌염","백일해","요충증","홍역"],"a":4,"e":"「감염병예방법」상 필수예방접종 대상에는 디프테리아, 폴리오, 백일해, 홍역, 파상풍, 결핵, B형간염, 일본뇌염, 수두, 인플루엔자, A형간염 등이 있다. ‘요충증’은 백신으로 예방하는 질병이 아니라 구충제로 치료하는 기생충 감염이라 필수예방접종 대상이 아니다."},{"id":"44-1-19","r":44,"p":1,"n":19,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물관련영업이 <u>아닌</u> 것은?","o":["지표수 제조업","정수기 제조업","수처리제 제조업","먹는샘물 제조업","먹는염지하수 제조업"],"a":1,"e":"「먹는물관리법」상 먹는물관련영업은 먹는샘물·먹는염지하수의 제조업·수입판매업·유통전문판매업, 수처리제 제조업, 정수기 제조업·수입판매업이다. ‘지표수 제조업’이라는 영업은 법에 없다."},{"id":"44-1-20","r":44,"p":1,"n":20,"s":"위생관계법령","q":"「먹는물관리법」상 (   ) 안에 해당되는 것은?","o":["50","100","150","200","300"],"a":5,"b":"1일 취수능력 (   )톤 이상의 샘물을 개발하려는 자는 시·도지사의 허가를 받아야 한다.","e":"「먹는물관리법」상 1일 취수능력 300톤 이상의 샘물(또는 염지하수)을 개발하려는 자는 시·도지사의 허가를 받아야 한다. 이 샘물 개발허가와 먹는샘물제조업 영업허가는 별개의 절차라는 점도 함께 기억한다."},{"id":"44-1-21","r":44,"p":1,"n":21,"s":"위생관계법령","q":"「먹는물관리법」상 샘물등의 개발허가의 유효기간은?","o":["3년","5년","8년","10년","12년"],"a":2,"e":"「먹는물관리법」상 샘물등의 개발허가 유효기간은 5년이다. 연장이 필요하면 유효기간이 끝나기 전에 시·도지사에게 연장 허가를 받아야 한다."},{"id":"44-1-22","r":44,"p":1,"n":22,"s":"위생관계법령","q":"「먹는물관리법」상 먹는샘물제조업의 영업허가권자는?","o":["식품의약품안전처장","시장·군수·구청장","질병관리청장","시·도지사","국무총리"],"a":4,"e":"「먹는물관리법」상 먹는샘물·먹는염지하수 제조업은 시·도지사의 허가를 받아야 한다. 먹는물 관리는 환경부 소관이므로 식품의약품안전처장이나 시장·군수·구청장의 허가로 헷갈리지 않도록 한다."},{"id":"44-1-23","r":44,"p":1,"n":23,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물 수질검사기관이 <u>아닌</u> 것은?","o":["국립환경과학원","지방식품의약품안전청","시·도 보건환경연구원","유역환경청 또는 지방환경청","특별시·광역시의 상수도연구소·수질검사소"],"a":2,"e":"「먹는물관리법」상 먹는물 수질검사기관은 환경부 계열 기관과 지자체 기관이 중심이다. 국립환경과학원, 유역·지방환경청, 시·도 보건환경연구원, 특별시·광역시의 상수도연구소·수질검사소 등이 여기에 해당한다. 지방식품의약품안전청은 식품 검사 기관이라 먹는물 수질검사기관에 포함되지 않는다. ※ 교재 확인 권장"},{"id":"44-1-24","r":44,"p":1,"n":24,"s":"위생관계법령","q":"「폐기물관리법」상 환경부장관이 폐기물 시험·분석 전문기관으로 지정할 수 있는 곳은?","o":["한국환경공단","한국수자원공사","한국농어촌공사","한국폐기물협회","폐기물처리공제조합"],"a":1,"e":"「폐기물관리법」상 환경부장관은 한국환경공단, 수도권매립지관리공사, 보건환경연구원 등을 폐기물 시험·분석 전문기관으로 지정할 수 있다. 한국수자원공사는 수자원, 한국농어촌공사는 농업기반 담당 기관이라 폐기물 분석과는 관계가 없다."},{"id":"44-1-25","r":44,"p":1,"n":25,"s":"위생관계법령","q":"「하수도법」상 수거식 화장실에서 수거되는 액체성 또는 고체성의 오염물질은?","o":["하수","분뇨","중수도","축산폐수","생활폐기물"],"a":2,"e":"「하수도법」상 ‘분뇨’는 수거식 화장실에서 수거되는 액체성 또는 고체성의 오염물질을 말한다(개인하수처리시설 청소 과정의 찌꺼기 포함). ‘하수’는 생활·경제활동으로 오염된 물(오수)과 건물·도로 등에서 하수도로 들어오는 빗물·지하수를 뜻한다."},{"id":"44-1-26","r":44,"p":1,"n":26,"s":"환경위생학","q":"용접작업 중 금속의 증기가 응축되어 발생하는 고체 입자는?","o":["훈연(fume)","매연(smoke)","미스트(mist)","스모그(smog)","에어로졸(aerosol)"],"a":1,"e":"훈연(fume)은 용접처럼 금속이 녹아 증발한 뒤 공기 중에서 응축되어 생긴 매우 작은 고체 입자다. 미스트(mist)는 고체가 아니라 액체 입자다. 매연(smoke)은 연료가 불완전 연소되어 생기는 탄소 입자다."},{"id":"44-1-27","r":44,"p":1,"n":27,"s":"환경위생학","q":"여름철 도시지역에서 광화학 반응에 의해 생성되는 2차 대기오염물질은?","o":["벤젠","암모니아","알데히드","이산화황","황화수소"],"a":3,"e":"알데히드는 질소산화물과 탄화수소가 강한 햇빛 아래에서 광화학 반응을 일으켜 생기는 2차 대기오염물질이며, 오존·PAN과 함께 대표적인 광화학 산화물이다. 이산화황, 황화수소, 암모니아, 벤젠은 배출원에서 직접 나오는 1차 오염물질이다."},{"id":"44-1-28","r":44,"p":1,"n":28,"s":"환경위생학","q":"대류권에서 고도가 100 m 상승함에 따라 낮아지는 기온은?","o":["0.12℃","0.65℃","2.52℃","3.55℃","4.56℃"],"a":2,"e":"대류권에서는 고도가 100 m 올라갈 때마다 기온이 평균 약 0.65℃씩 낮아진다(환경감률, 1 km당 약 6.5℃). 건조단열감률(약 1℃/100 m)과 헷갈리지 않도록 한다."},{"id":"44-1-29","r":44,"p":1,"n":29,"s":"환경위생학","q":"인체에 유해한 자외선을 흡수하는 오존층이 있는 대기권역은?","o":["열권","대류권","성층권","외기권","중간권"],"a":3,"e":"오존층은 성층권(약 20~30 km 부근)에 있으며 유해한 자외선을 흡수한다. 대류권은 기상현상이 일어나는 가장 아래층이다. 열권은 오로라와 전리층이 있는 층이다."},{"id":"44-1-30","r":44,"p":1,"n":30,"s":"환경위생학","q":"로스앤젤레스 스모그(L.A. smog) 사건에 대한 설명으로 옳은 것은?","o":["기온역전: 복사역전","발생원인: 석유연소","발생시기: 겨울철 새벽","기상조건: 90% 이상의 습도","주요 원인물질: 황산화물과 매연"],"a":2,"e":"L.A. 스모그는 자동차 배기가스 등 석유계 연료 연소에서 나온 질소산화물·탄화수소가 원인인 광화학 스모그다. 여름 낮, 침강성 역전, 비교적 낮은 습도가 조건이다. 겨울 새벽, 복사역전, 90% 이상 높은 습도, 황산화물·매연은 런던 스모그의 특징이다."},{"id":"44-1-31","r":44,"p":1,"n":31,"s":"환경위생학","q":"대기오염 배출시설에서 황산화물의 처리방법으로 옳은 것은?","o":["굴뚝의 높이를 낮춘다.","세정집진장치를 설치한다.","중력집진장치를 설치한다.","원심력집진장치를 설치한다.","처리시설에 산성물질을 주입한다."],"a":2,"e":"황산화물(SO₂)은 가스상 물질이므로 알칼리성 흡수액을 뿌리는 세정(습식) 집진장치나 배연탈황으로 흡수·제거한다. 중력·원심력 집진장치는 입자상 물질만 걸러 낼 수 있다. 산성 가스를 중화하려면 산성물질이 아니라 알칼리성 물질을 넣어야 한다."},{"id":"44-1-32","r":44,"p":1,"n":32,"s":"환경위생학","q":"역사적인 대기오염 사건에서 공통적으로 나타나는 기상조건은?","o":["고기압","저기압","기온역전","눈이 온 후","비가 온 후"],"a":3,"e":"뮤즈계곡, 도노라, 런던, L.A. 등 역사적인 대기오염 사건에는 공통적으로 기온역전과 무풍 상태가 있었다. 이 때문에 오염물질이 위로 확산되지 못하고 지표 가까이 쌓였다. 고기압은 침강역전과 관련은 있지만 모든 사건에 공통된 조건으로 꼽히는 것은 기온역전이다."},{"id":"44-1-33","r":44,"p":1,"n":33,"s":"환경위생학","q":"지구온난화를 일으키는 대표적인 온실가스는?","o":["H₂","N₂","CO","CO₂","SO₂"],"a":4,"e":"이산화탄소(CO₂)는 배출량이 가장 많아 지구온난화에 가장 크게 기여하는 대표적인 온실가스다. 일산화탄소(CO)는 헤모글로빈과 결합하는 유독가스다. 이산화황(SO₂)은 산성비의 원인물질이다."},{"id":"44-1-34","r":44,"p":1,"n":34,"s":"환경위생학","q":"지하공간의 실내공기질을 관리하기 위하여, 벽의 균열이나 지하수의 누수 여부를 확인해야 하는 오염물질은?","o":["라돈","미세먼지","일산화탄소","이산화질소","포름알데히드"],"a":1,"e":"라돈은 토양·암석 속 우라늄이 붕괴할 때 생기는 무색·무취의 방사성 기체로, 건물 바닥·벽의 균열이나 지하수를 통해 실내로 들어온다. 그래서 지하공간에서는 균열과 누수를 점검해야 한다. 포름알데히드는 건축자재·가구에서, 일산화탄소는 연소에서 나온다."},{"id":"44-1-35","r":44,"p":1,"n":35,"s":"환경위생학","q":"실내에서 0.5 m/s 이하의 기류를 측정할 수 있는 기구는?","o":["건구온도계","습구온도계","자기온도계","카타온도계","흑구온도계"],"a":4,"e":"카타온도계는 알코올 기둥이 일정 구간을 내려오는 데 걸리는 냉각 시간으로 0.5 m/s 이하의 불감기류(미풍)를 측정하는 기구다. 흑구온도계는 복사열을 재고, 건구·습구온도계는 기온과 습도를 구하는 데 쓴다."},{"id":"44-1-36","r":44,"p":1,"n":36,"s":"환경위생학","q":"인체에서 체열발산 비율이 가장 큰 것은?","o":["날숨","대소변","폐포에서의 증발","피부에서의 증발","피부에서의 복사와 전도"],"a":5,"e":"인체의 체열은 대부분 피부에서 복사와 전도·대류로 발산되며, 이것이 전체 열 발산에서 차지하는 비율이 가장 크다. 피부에서의 증발이 그다음이다. 날숨, 폐포 증발, 대소변으로 빠져나가는 열은 적다."},{"id":"44-1-37","r":44,"p":1,"n":37,"s":"환경위생학","q":"실내에서 안정 시 쾌적함을 느낄 수 있는 의복기후는?","o":["0~10℃","11~13℃","21~25℃","31~33℃","41~45℃"],"a":4,"e":"실내에서 안정 시 쾌적한 의복기후는 피부와 옷 사이 공기층의 온도가 약 32±1℃, 습도 50±10%, 기류 10±5 cm/s인 상태다. 21~25℃는 쾌적한 실내 기온 범위라서 의복기후와 헷갈리기 쉽다."},{"id":"44-1-38","r":44,"p":1,"n":38,"s":"환경위생학","q":"실내환경에서의 생물학적 유해인자는?","o":["고열","소음","자외선","집먼지진드기","비전리방사선"],"a":4,"e":"집먼지진드기는 살아 있는 생물로 알레르기를 일으키므로 생물학적 유해인자다. 고열, 소음, 자외선, 비전리방사선은 모두 물리적 유해인자다."},{"id":"44-1-39","r":44,"p":1,"n":39,"s":"환경위생학","q":"비전리방사선에 해당하는 것은?","o":["감마선","베타선","알파선","엑스선","가시광선"],"a":5,"e":"비전리방사선은 물질을 이온화할 에너지가 없는 전자기파로 자외선, 가시광선, 적외선, 마이크로파 등이 있다. 알파선, 베타선, 감마선, 엑스선은 모두 전리방사선이다."},{"id":"44-1-40","r":44,"p":1,"n":40,"s":"환경위생학","q":"자외선에 대한 설명으로 옳은 것은?","o":["열선으로 불린다.","비타민D 형성에 관여한다.","가시광선보다 파장이 길다.","인체의 피부온도를 상승시킨다.","일사병의 직접적인 원인으로 작용한다."],"a":2,"e":"자외선 중 도르노선(건강선, 약 280~320 nm)은 피부에서 비타민D 형성을 돕는다. 열선이라고 불리며 피부온도 상승과 일사병의 원인이 되는 것은 적외선이다. 자외선은 가시광선보다 파장이 짧다."},{"id":"44-1-41","r":44,"p":1,"n":41,"s":"환경위생학","q":"전리방사선에 대해 감수성이 가장 높은 인체부위는?","o":["골수","근육","신경","피부","지방조직"],"a":1,"e":"전리방사선은 세포분열이 활발한 조직일수록 감수성이 높아서 골수(조혈조직), 림프조직, 생식선, 장 상피 등이 가장 민감하다. 근육, 신경, 지방조직은 분열이 적어 감수성이 낮다."},{"id":"44-1-42","r":44,"p":1,"n":42,"s":"환경위생학","q":"탄소화합물이 불완전 연소될 때 발생하는 입경 1 μm 이상인 입자상 물질은?","o":["안개(fog)","검댕(soot)","증기(vapor)","미스트(mist)","에어로졸(aerosol)"],"a":2,"e":"검댕(soot)은 탄소화합물이 불완전 연소될 때 생긴 유리탄소가 응결해 입경 1 μm 이상이 된 입자상 물질이다. 매연은 유리탄소가 주성분인 더 미세한 입자를 말한다. 미스트와 안개는 액체 입자다."},{"id":"44-1-43","r":44,"p":1,"n":43,"s":"환경위생학","q":"산소에 비해 헤모글로빈과의 결합력이 250~300배 정도 높아 혈액의 산소운반 능력을 감소시키는 기체상 물질은?","o":["암모니아","아산화질소","이산화탄소","이황화탄소","일산화탄소"],"a":5,"e":"일산화탄소(CO)는 헤모글로빈과의 결합력이 산소보다 약 250~300배 강해서 일산화탄소헤모글로빈(CO-Hb)을 만든다. 그 결과 혈액의 산소운반 능력이 떨어져 조직이 저산소증에 빠진다. 이산화탄소는 이런 강한 결합을 하지 않는다."},{"id":"44-1-44","r":44,"p":1,"n":44,"s":"환경위생학","q":"여과지 면적이 1,000 m²이고 하루 처리량이 25,000 m³일 때 여과속도는?","o":["5 m/일","25 m/일","50 m/일","100 m/일","150 m/일"],"a":2,"e":"【공식】 여과속도(m/일) = 하루 처리량(m³/일) ÷ 여과지 면적(m²)\n【풀이】 25,000 m³/일 ÷ 1,000 m² = 25 m/일. 완속여과 속도(약 3~5 m/일)와 같은 공식으로 계산한다."},{"id":"44-1-45","r":44,"p":1,"n":45,"s":"환경위생학","q":"물의 경도를 낮추기 위해 연수화 과정에서 제거해야 하는 물질은?","o":["불소","아연","칼슘","크롬","알루미늄"],"a":3,"e":"물의 경도는 주로 칼슘(Ca²⁺)과 마그네슘(Mg²⁺) 이온 때문에 생기므로, 연수화할 때는 이 이온들을 제거한다. 불소, 아연, 크롬, 알루미늄은 경도를 일으키는 물질이 아니다."},{"id":"44-1-46","r":44,"p":1,"n":46,"s":"환경위생학","q":"상수의 염소소독에서 살균력이 가장 강한 것은?","o":["OCl⁻","HOCl","NCl₃","NHCl₂","NH₂Cl"],"a":2,"e":"차아염소산(HOCl)은 전하가 없어 세균 세포막을 쉽게 통과하므로 살균력이 가장 강하다. 그래서 pH가 낮아 HOCl 비율이 높을수록 소독 효과가 좋다. 차아염소산이온(OCl⁻)은 HOCl보다 훨씬 약하고, 클로라민류(NH₂Cl, NHCl₂, NCl₃) 같은 결합잔류염소는 더 약하다."},{"id":"44-1-47","r":44,"p":1,"n":47,"s":"환경위생학","q":"내분비계교란물질이 수용체 결합 부위를 차단함으로써 정상호르몬이 수용체에 접근하는 것을 막아 기능을 발휘하지 못하도록 하는 것은?","o":["모방작용","봉쇄작용","유사작용","촉발작용","흡수작용"],"a":2,"e":"봉쇄작용은 내분비
