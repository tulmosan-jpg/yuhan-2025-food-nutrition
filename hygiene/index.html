계교란물질이 호르몬 수용체의 결합 부위를 막아서 정상 호르몬이 결합하지 못하게 하는 작용이다. 모방작용은 교란물질이 호르몬처럼 수용체에 결합해 반응을 일으키는 것이다. 촉발작용은 수용체와 결합해 정상과 다른 비정상적인 반응을 유발하는 것이다."},{"id":"44-1-48","r":44,"p":1,"n":48,"s":"환경위생학","q":"수질오염에 의한 미나마타병의 원인물질은?","o":["납","벤젠","크롬","카드뮴","유기수은"],"a":5,"e":"미나마타병은 공장 폐수에 섞인 유기수은(메틸수은)이 어패류에 축적되고, 이를 먹은 사람에게 신경장애가 생긴 공해병이다. 카드뮴은 이타이이타이병의 원인물질이라서 헷갈리기 쉽다."},{"id":"44-1-49","r":44,"p":1,"n":49,"s":"환경위생학","q":"질소, 인 등 영양물질이 다량 함유된 하수가 바다로 유입되어 나타나는 것은?","o":["기화현상","대류현상","역전현상","적조현상","전도현상"],"a":4,"e":"질소·인 같은 영양염류가 바다로 많이 들어가면 부영양화가 일어나 플랑크톤이 이상 증식하고 바닷물이 붉게 변하는 적조현상이 생긴다. 호수나 하천에서 같은 원리로 생기는 것은 녹조(수화)다. 역전·전도현상은 수온층 변화와 관련된 현상이다."},{"id":"44-1-50","r":44,"p":1,"n":50,"s":"환경위생학","q":"하수의 물리적 자정작용은?","o":["산화","식균","중화","침전","환원"],"a":4,"e":"하수의 물리적 자정작용에는 희석, 확산, 혼합, 침전, 여과가 있다. 산화·환원·중화는 화학적 자정작용이다. 미생물에 의한 분해와 식균은 생물학적 자정작용이다."},{"id":"44-1-51","r":44,"p":1,"n":51,"s":"환경위생학","q":"원수를 두꺼운 모래층에 통과시켜 부유물을 제거하는 공정은?","o":["부상","소독","여과","응집","중화"],"a":3,"e":"여과는 원수를 두꺼운 모래층에 통과시켜 부유물과 세균을 걸러 내는 정수 공정이다(완속·급속여과). 응집은 약품을 넣어 미세입자를 플록으로 뭉치게 하는 공정이고, 소독은 염소 등으로 병원균을 죽이는 공정이다."},{"id":"44-1-52","r":44,"p":1,"n":52,"s":"환경위생학","q":"발암성 물질로 알려진 염소소독 부산물은?","o":["톨루엔","에틸벤젠","파라티온","다이아지논","트리할로메탄"],"a":5,"e":"트리할로메탄(THM)은 염소가 물속 유기물(부식질 등)과 반응해 생기는 소독부산물로, 클로로포름이 대표적인 발암성 물질이다. 파라티온과 다이아지논은 유기인계 농약이다. 톨루엔과 에틸벤젠은 휘발성 유기화합물이다."},{"id":"44-1-53","r":44,"p":1,"n":53,"s":"환경위생학","q":"수질오염현상 중 부영양화에 대한 설명으로 옳은 것은?","o":["투명도가 높아진다.","용존산소가 증가한다.","수온이 낮을 때 발생한다.","영양물질이 부족할 때 발생한다.","식물성 플랑크톤의 수가 증가한다."],"a":5,"e":"부영양화는 질소·인 등 영양염류가 과다 유입되어 식물성 플랑크톤(조류)이 급격히 증식하는 현상으로, 녹조·적조의 원인이 된다. 조류 증식으로 투명도는 오히려 낮아지고, 사멸 조류의 분해로 용존산소는 감소한다. 수온이 높고 영양물질이 풍부할 때 잘 발생한다."},{"id":"44-1-54","r":44,"p":1,"n":54,"s":"환경위생학","q":"수질오염원 중 점오염원은?","o":["도로","산지","축사","해안","농경지"],"a":3,"e":"점오염원은 공장·하수처리장·축사처럼 배출 지점이 특정되어 관거를 통해 한 곳으로 배출되는 오염원이다. 도로·농경지·산지 등은 빗물에 씻겨 넓은 지역에서 불특정하게 유입되는 비점오염원에 해당한다."},{"id":"44-1-55","r":44,"p":1,"n":55,"s":"환경위생학","q":"폐수 중 유기화합물의 화학적 산소요구량(COD)을 측정할 때 사용하는 산화제는?","o":["과산화수소(H₂O₂)","황산제일철(FeSO₄)","과망간산칼륨(KMnO₄)","황산마그네슘(MgSO₄)","황산알루미늄((Al₂(SO₄)₃)"],"a":3,"e":"우리나라 수질오염공정시험기준의 COD는 산성 조건에서 과망간산칼륨(KMnO₄)을 산화제로 사용해 소비된 산소량을 측정한다(국제적으로는 중크롬산칼륨법도 사용). 황산알루미늄은 응집제, 황산제일철은 적정·응집에 쓰이는 물질로 COD 산화제가 아니다."},{"id":"44-1-56","r":44,"p":1,"n":56,"s":"환경위생학","q":"일반적인 정수처리 과정으로 옳은 것은?","o":["소독 → 침사 → 침전 → 여과","여과 → 소독 → 침사 → 침전","여과 → 침전 → 침사 → 소독","침사 → 여과 → 소독 → 침전","침사 → 침전 → 여과 → 소독"],"a":5,"e":"일반 정수처리는 큰 모래·토사를 가라앉히는 침사 → 응집·침전으로 부유물 제거 → 여과로 미세입자·세균 제거 → 마지막 염소 소독 순으로 진행된다. 소독은 잔류염소 유지를 위해 항상 마지막 단계이므로, 소독이나 여과가 먼저 나오는 순서는 틀리다."},{"id":"44-1-57","r":44,"p":1,"n":57,"s":"환경위생학","q":"하수처리 시 침사지의 설치 목적은?","o":["토사류 제거","부유성 슬러지 농축","용존성 무기물 제거","용존성 유기물 제거","응집성 물질 약품처리"],"a":1,"e":"침사지는 하수 중 모래·자갈 등 비중이 큰 토사류를 침강·제거하여 펌프 마모와 관로 폐색을 막기 위해 처리 초기에 설치한다. 용존성 유기물 제거는 생물학적 처리(활성슬러지 등), 슬러지 농축은 농축조의 역할이다."},{"id":"44-1-58","r":44,"p":1,"n":58,"s":"환경위생학","q":"폐수의 생물학적 처리법은?","o":["부상분리법","살수여상법","약품처리법","중력침전법","흡착처리법"],"a":2,"e":"살수여상법은 쇄석 등 여재 표면에 형성된 호기성 미생물막이 폐수 중 유기물을 분해하는 생물학적 처리법이다. 부상분리법·중력침전법은 물리적 처리, 약품처리법·흡착처리법은 화학적(물리화학적) 처리에 해당한다."},{"id":"44-1-59","r":44,"p":1,"n":59,"s":"환경위생학","q":"폐수의 슬러지 처리 순서로 옳은 것은?","o":["개량 → 농축 → 건조 → 탈수 → 소각","건조 → 농축 → 개량 → 소각 → 탈수","농축 → 개량 → 탈수 → 건조 → 소각","소각 → 탈수 → 건조 → 농축 → 개량","탈수 → 건조 → 개량 → 소각 → 농축"],"a":3,"e":"슬러지는 먼저 농축으로 부피를 줄이고, 소화·개량(약품 처리)으로 탈수성을 높인 뒤 탈수 → 건조 → 소각(최종처분) 순으로 처리한다. 탈수나 건조를 농축보다 먼저 하면 처리 효율이 떨어지므로 농축이 첫 단계다."},{"id":"44-1-60","r":44,"p":1,"n":60,"s":"환경위생학","q":"폐기물의 부피를 줄여 매립지의 사용기간을 늘리는 전처리 방법은?","o":["분별","선별","압축","중화","퇴비화"],"a":3,"e":"압축은 폐기물에 압력을 가해 부피를 줄이는 전처리로, 운반 효율을 높이고 매립지 사용기간을 연장한다. 선별·분별은 재활용 가능한 성분을 골라내는 과정이고, 퇴비화는 유기성 폐기물을 자원화하는 방법이다."},{"id":"44-1-61","r":44,"p":1,"n":61,"s":"환경위생학","q":"「폐기물관리법」상 지정폐기물은?","o":["폐석면","폐의류","폐우유팩","폐유리병","폐알루미늄캔"],"a":1,"e":"지정폐기물은 사업장폐기물 중 주변 환경을 오염시키거나 인체에 위해를 줄 수 있는 유해물질로, 폐석면·폐유·폐산·폐알칼리·의료폐기물 등이 해당한다. 폐의류·폐우유팩·폐유리병·폐알루미늄캔은 일반 생활폐기물(재활용품)이다."},{"id":"44-1-62","r":44,"p":1,"n":62,"s":"환경위생학","q":"폐기물 소각법의 장점으로 옳은 것은?","o":["건설비 및 유지비가 높다.","소각장 부지 선정이 용이하다.","정상운전 시 숙련기술이 요구된다.","폐열을 회수하여 재이용이 가능하다.","저온연소 시 다이옥신이 발생할 수 있다."],"a":4,"e":"소각법은 부피를 크게 줄이고 위생적이며, 연소 시 발생하는 폐열을 회수해 발전·난방에 재이용할 수 있다는 장점이 있다. 높은 건설·유지비, 숙련 기술 필요, 저온연소 시 다이옥신 발생, 부지 선정의 어려움(주민 반대)은 모두 단점이다."},{"id":"44-1-63","r":44,"p":1,"n":63,"s":"환경위생학","q":"「폐기물관리법」상 폐기물관리 원칙의 우선순위로 옳은 것은?","o":["재활용 → 매립 → 소각 → 발생억제 → 재사용","재활용 → 재사용 → 소각 → 발생억제 → 매립","발생억제 → 매립 → 재활용 → 재사용 → 소각","발생억제 → 재사용 → 재활용 → 소각 → 매립","발생억제 → 매립 → 재활용 → 소각 → 재사용"],"a":4,"e":"「폐기물관리법」의 기본원칙은 먼저 발생을 억제하고, 발생한 폐기물은 재사용 → 재활용 → 에너지 회수(소각) 순으로 처리하며, 처리할 수 없는 것만 매립하는 것이다. 매립은 최후 수단이므로 매립이 앞쪽에 오는 순서는 모두 틀리다."},{"id":"44-1-64","r":44,"p":1,"n":64,"s":"환경위생학","q":"「폐기물관리법」상 의료폐기물을 수집·운반하는 차량의 색상은?","o":["흰색","검은색","노란색","빨간색","파란색"],"a":1,"e":"「폐기물관리법」 시행규칙의 의료폐기물 처리기준에 따라 의료폐기물 수집·운반 차량의 차체는 흰색으로 색칠하고, 적재함은 냉장설비(4℃ 이하)를 갖추어야 한다. 노란색·빨간색 등은 차량 색상 기준이 아니다."},{"id":"44-1-65","r":44,"p":1,"n":65,"s":"환경위생학","q":"의료폐기물의 수집, 운반 및 보관 처리기준에 관한 설명으로 옳은 것은?","o":["보관창고는 주 1회 이상 약물소독을 한다.","보관창고의 구조는 밖에서 볼 수 있어야 한다.","운반차량은 5~10℃의 냉장시설을 갖추어야 한다.","전용용기는 보건복지부장관이 검사한 용기를 사용한다.","의료폐기물의 종류를 표기할 때에는 양이 가장 적은 것으로 한다."],"a":1,"e":"「폐기물관리법」상 의료폐기물 보관창고는 주 1회 이상 약물소독을 하여야 한다. 보관창고는 외부에서 내부가 보이지 않는 구조여야 하고, 운반차량 적재함은 4℃ 이하의 냉장설비를 갖춰야 하므로 5~10℃는 틀리다. 전용용기는 환경부장관이 정한 기준에 따라 검사받은 용기를 사용한다."},{"id":"44-1-66","r":44,"p":1,"n":66,"s":"환경위생학","q":"레이노병(Raynaud’s disease)이 발생하기 쉬운 신체부위는?","o":["등","목","어깨","허리","손가락"],"a":5,"e":"레이노병(레이노 현상)은 착암기·전기톱 등 국소진동에 장기간 노출되어 손가락 말초혈관이 수축하면서 창백해지고 저리는 증상(백지증)이다. 진동 공구를 쥐는 손가락에 주로 나타나며, 등·허리는 전신진동이나 근골격계 질환과 관련된다."},{"id":"44-1-67","r":44,"p":1,"n":67,"s":"환경위생학","q":"고온다습한 작업장의 근로자에게 나타날 수 있는 직업병은?","o":["규폐증","면폐증","열중증","잠함병","참호족"],"a":3,"e":"고온다습한 환경에서는 체온조절 장애로 열경련·열허탈증·열사병·열쇠약증 등 열중증이 발생한다. 규폐증은 유리규산 분진, 면폐증은 면 분진, 잠함병은 고압 환경에서 급히 감압할 때, 참호족은 저온·습윤 환경에서 생긴다."},{"id":"44-1-68","r":44,"p":1,"n":68,"s":"환경위생학","q":"물리적 장벽을 이용하여 작업자의 유해물질 노출량을 줄이는 방법은?","o":["격리","교육","대치","조정","환기"],"a":1,"e":"격리는 차폐벽·밀폐·거리 확보 등 물리적 장벽으로 작업자와 유해물질을 분리하여 노출량을 줄이는 작업환경 관리법이다. 대치는 유해물질·공정·시설을 덜 유해한 것으로 바꾸는 것이고, 환기는 공기를 배출·희석하는 방법이다."},{"id":"44-1-69","r":44,"p":1,"n":69,"s":"환경위생학","q":"소독제가 갖추어야 할 조건으로 옳은 것은?","o":["안정성이 없을 것","부식성이 있을 것","물에 잘 녹지 않을 것","석탄산계수가 높을 것","인체에 미치는 독성이 높을 것"],"a":4,"e":"석탄산계수는 석탄산 대비 살균력을 나타내므로, 소독제는 석탄산계수가 높을수록 살균력이 강해 좋다. 그 밖에 안정성이 있고, 부식성·독성은 낮으며, 물에 잘 녹는 것이 바람직하므로 나머지 내용은 모두 반대로 서술되었다."},{"id":"44-1-70","r":44,"p":1,"n":70,"s":"환경위생학","q":"미생물의 발육을 저지 또는 정지하는 방법은?","o":["멸균","방부","분해","세척","소독"],"a":2,"e":"방부는 미생물을 죽이지는 않고 발육·증식을 저지 또는 정지시켜 부패·발효를 막는 것이다. 멸균은 아포를 포함한 모든 미생물을 사멸시키는 것이고, 소독은 병원성 미생물을 죽이거나 감염력을 없애는 것으로 방부보다 강한 개념이다."},{"id":"44-1-71","r":44,"p":1,"n":71,"s":"환경위생학","q":"세균에 오염된 의복의 소독방법으로 옳은 것은?","o":["DDT로 소독","가시광선으로 살균","121.5℃에서 1분 공기소독","세제가 없이 냉수로 손세탁","100℃ 물에서 30분 열탕소독"],"a":5,"e":"의복·침구·식기 등은 끓는 물(100℃)에서 일정 시간 처리하는 열탕(자비)소독이 간편하고 효과적이다. 121℃ 처리는 고압증기멸균(약 15~20분)이며 1분으로는 부족하고, DDT는 살충제이지 세균 소독제가 아니다."},{"id":"44-1-72","r":44,"p":1,"n":72,"s":"환경위생학","q":"미생물을 살균하여 물과 공기의 자정작용에 기여하는 태양복사에너지는?","o":["감마선","엑스선","자외선","초음파","가시광선"],"a":3,"e":"태양광선 중 자외선(특히 약 260nm 부근)은 미생물의 DNA를 손상시켜 살균력이 강하며, 물과 공기의 자정작용에 기여한다. 가시광선은 살균력이 거의 없고, 감마선·엑스선은 태양복사로 지표에 거의 도달하지 않는 전리방사선이다."},{"id":"44-1-73","r":44,"p":1,"n":73,"s":"환경위생학","q":"주택의 자연조명에서 방바닥 면적에 대한 창의 크기로 적절한 비율은?","o":["1~3%","4~7%","8~10%","11~13%","14~20%"],"a":5,"e":"주택의 자연조명을 위해 창의 면적은 방바닥 면적의 1/7~1/5, 즉 약 14~20%가 적당하다. 이보다 작은 비율은 채광이 부족하다."},{"id":"44-1-74","r":44,"p":1,"n":74,"s":"환경위생학","q":"다중이용시설의 실내공기질 유지기준 물질은?","o":["오존","아황산가스","이산화질소","일산화질소","포름알데히드"],"a":5,"e":"「실내공기질 관리법」상 다중이용시설 유지기준 물질은 미세먼지(PM10·PM2.5), 이산화탄소, 포름알데히드, 총부유세균, 일산화탄소이다. 이산화질소·라돈·총휘발성유기화합물·곰팡이는 권고기준 물질이고, 아황산가스는 대기환경기준 항목이다."},{"id":"44-1-75","r":44,"p":1,"n":75,"s":"환경위생학","q":"카타(kata) 냉각력은?","o":["외부환경에 의한 의복의 기후조절량","환기할 때 수증기와 함께 배출되는 총열량","기습, 기류가 작용하여 인체가 느끼는 불쾌감","쾌적함이 느껴지도록 냉각하는 데 필요한 시간","기온, 기습, 기류의 종합적인 작용에 의한 인체 표면의 체열 발산량"],"a":5,"e":"카타 냉각력은 기온·기습·기류가 종합적으로 작용하여 인체 표면에서 열을 빼앗는 정도(체열 발산량)를 말하며, 카타온도계로 측정하고 주로 미약한 기류 측정에 이용된다. 불쾌감을 나타내는 것은 불쾌지수이므로 혼동하지 않는다."},{"id":"44-1-76","r":44,"p":1,"n":76,"s":"위생곤충학","q":"거미강(Arachnida)에 속하는 것은?","o":["가재","벼룩","전갈","지네","파리"],"a":3,"e":"전갈은 진드기·거미와 함께 거미강에 속하며, 다리가 4쌍이고 더듬이가 없다. 가재는 갑각강, 지네는 순각강(지네강)이며, 벼룩과 파리는 다리 3쌍의 곤충강이다."},{"id":"44-1-77","r":44,"p":1,"n":77,"s":"위생곤충학","q":"위생곤충의 소화과정에서 역행을 방지하는 기관은?","o":["맹낭","소낭","인두","전위","회장"],"a":4,"e":"전위(前胃)는 전장의 소낭 뒤에 위치한 근육질 기관으로, 판막 구조를 통해 먹은 음식물이 역류하는 것을 방지한다. 소낭은 음식물 저장, 맹낭은 중장 앞쪽에서 소화효소를 분비하는 기관이다."},{"id":"44-1-78","r":44,"p":1,"n":78,"s":"위생곤충학","q":"위생곤충의 완전변태를 결정하는 발육단계는?","o":["알","성충","유충","자충","번데기"],"a":5,"e":"완전변태는 알 → 유충 → 번데기 → 성충을 거치므로 번데기 단계의 유무가 완전변태와 불완전변태를 가른다. 자충(약충)은 번데기 없이 성충이 되는 불완전변태 곤충의 미성숙 단계이다."},{"id":"44-1-79","r":44,"p":1,"n":79,"s":"위생곤충학","q":"위생곤충의 간접적 가해 방법은?","o":["인체기생","기계적 외상","독성물질의 주입","국부적 알레르기 반응","병원체의 인체 내 주입"],"a":5,"e":"위생곤충의 간접 피해는 병원체를 기계적 또는 생물학적으로 전파하여 질병을 일으키는 것이다. 기계적 외상, 인체기생, 독성물질 주입, 알레르기 반응은 곤충이 직접 사람에게 해를 주는 직접 피해에 해당한다."},{"id":"44-1-80","r":44,"p":1,"n":80,"s":"위생곤충학","q":"위생곤충이 매개하는 리케치아(rickettsia)성 질병은?","o":["황열","뎅기열","발진열","일본뇌염","파파타시열"],"a":3,"e":"발진열은 Rickettsia typhi에 의한 리케치아성 질병으로 쥐벼룩(열대쥐벼룩)이 매개한다. 황열·뎅기열·일본뇌염은 모기가 매개하는 바이러스성 질병이고, 파파타시열은 모래파리가 매개하는 바이러스성 질병이다."},{"id":"44-1-81","r":44,"p":1,"n":81,"s":"위생곤충학","q":"깔따구의 보건위생적 피해 현상은?","o":["불쾌감을 준다.","피부를 물어 뜯어 아프다.","2차적 세균감염을 유발한다.","침으로 공격하여 따끔거린다.","날개의 독극모가 붉은 반점을 만든다."],"a":1,"e":"깔따구는 흡혈하지 않으며, 대량 발생하여 불빛 주변에 떼 지어 날아다니며 불쾌감을 주고, 사체가 알레르기 원인이 되는 정도의 피해를 준다. 피부를 물거나 침으로 쏘는 피해는 깔따구에 해당하지 않는다."},{"id":"44-1-82","r":44,"p":1,"n":82,"s":"위생곤충학","q":"모기 유충의 물리적 방제법은?","o":["웅덩이 매립","유문등 이용","발생원에 살충제 입제 살포","잠자리 약충을 자연계에 방사","잔류성 유기염소계 살충제 사용"],"a":1,"e":"웅덩이 매립·배수로 정비처럼 유충의 서식처를 없애는 것이 물리적(환경적) 방제이다. 유문등은 성충을 잡는 방법이고, 살충제 살포는 화학적 방제, 잠자리 약충 방사는 천적을 이용한 생물학적 방제이다."},{"id":"44-1-83","r":44,"p":1,"n":83,"s":"위생곤충학","q":"살충제와 함께 사용되는 효력증강제(synergist)는?","o":["카바릴(Carbaryl)","나프탈렌(Naphthalene)","디엘드린(Dieldrin)","다이아지논(Diazinon)","썰폭사이드(Sulfoxide)"],"a":5,"e":"효력증강제는 자체 살충력은 약하지만 살충제(주로 피레스로이드)와 함께 쓰면 해독효소를 억제해 효력을 높이는 물질로, 썰폭사이드·피페로닐부톡사이드 등이 있다. 카바릴은 카바메이트계, 다이아지논은 유기인계, 디엘드린은 유기염소계 살충제이다. ※ 교재 확인 권장"},{"id":"44-1-84","r":44,"p":1,"n":84,"s":"위생곤충학","q":"위생곤충에 대한 기피제(repellent)로 옳은 것은?","o":["쎄사민(Sesamin)","메소프렌(Methoprene)","썰폭사이드(Sulfoxide)","아카리나스린(Acarinathrin)","벤질벤조에이트(Benzyl benzoate)"],"a":5,"e":"벤질벤조에이트는 DEET·DMP(디메틸프탈레이트) 등과 함께 대표적인 기피제로, 진드기·모기 등이 접근하지 못하게 한다. 메소프렌은 유약호르몬 유사체인 곤충성장조절제(IGR)이고, 썰폭사이드와 쎄사민은 효력증강제 계열이다. ※ 교재 확인 권장"},{"id":"44-1-85","r":44,"p":1,"n":85,"s":"위생곤충학","q":"살충제 원체(technical grade)에 증량제와 친수제 및 계면활성제를 혼합하여 잔류분무에 사용하는 제제는?","o":["분제(dust)","용제(solution)","유제(emulsifiable concentrate)","입제(granule)","수화제(water dispersible powder)"],"a":5,"e":"수화제는 살충제 원체에 증량제(고령토 등), 친수제, 계면활성제를 섞은 가루로, 물에 타서 현탁액으로 잔류분무에 사용하며 흡수성 벽면에서 효과가 좋다. 유제는 원체를 용매에 녹이고 유화제를 넣은 액체이고, 분제는 증량제와 섞은 가루를 그대로 살포한다."},{"id":"44-1-86","r":44,"p":1,"n":86,"s":"위생곤충학","q":"살충제 감수성과 저항성 시험에서 LC₅₀이 의미하는 것은?","o":["사람과 가축을 비교하기 위한 독성 비율","공시동물의 50%를 치사시킬 수 있는 살충제 농도","공시동물의 50%를 치사시킬 수 있는 살충제의 양","일정 공간에 살포한 살충제의 사용량이 50 g이라는 뜻","일정 공간에 살포한 살충제의 희석농도가 50%라는 의미"],"a":2,"e":"LC₅₀(반수치사농도)은 공시동물의 50%를 죽일 수 있는 살충제의 농도이다. 50%를 죽이는 살충제의 양(용량)은 LD₅₀(반수치사량)으로, 농도와 양을 구분하는 것이 핵심이다."},{"id":"44-1-87","r":44,"p":1,"n":87,"s":"위생곤충학","q":"액체 전자모기향의 살충작용은?","o":["훈증","가열연막","공간분무","에어로졸","잔류분무"],"a":1,"e":"액체 전자모기향은 전기 열로 살충제를 기화(증산)시켜 공간에 퍼뜨리는 방식으로, 기체 상태의 약제가 작용하는 훈증 작용을 한다. 가열연막은 연막기로 약제를 경유 등과 함께 연기로 만드는 방식이고, 잔류분무는 벽면에 약제를 남겨 접촉시키는 방식이다."},{"id":"44-1-88","r":44,"p":1,"n":88,"s":"위생곤충학","q":"살충작용은 속효성이고, 잔효성은 적어 실내 공간살포용으로 적합한 것은?","o":["무기 살충제","유기인계 살충제","유기염소계 살충제","카바메이트계 살충제","피레스로이드계 살충제"],"a":5,"e":"피레스로이드계 살충제는 속효성(녹다운 효과)이 뛰어나고 잔효성은 짧으며 포유류 독성이 낮아 실내 공간살포에 적합하다. 유기염소계는 잔효성이 길어 잔류분무에 쓰였으며, 유기인계·카바메이트계도 상대적으로 잔류 효과가 있다."},{"id":"44-1-89","r":44,"p":1,"n":89,"s":"위생곤충학","q":"살서제를 청색이나 흑색으로 착색하는 이유는?","o":["쥐의 경계심을 낮춘다.","먹이의 맛을 좋게 한다.","쥐의 살서효과를 높인다.","쥐의 유인효과를 높인다.","사람의 중독사고를 예방한다."],"a":5,"e":"살서제(쥐약)를 청색·흑색으로 착색하는 것은 사람, 특히 어린이가 음식으로 착각해 먹는 중독사고를 예방하기 위해서이다. 쥐는 색을 거의 구분하지 못하므로 착색이 유인효과나 살서효과를 높이지는 않는다."},{"id":"44-1-90","r":44,"p":1,"n":90,"s":"위생곤충학","q":"가주성 바퀴의 생태 습성으로 옳은 것은?","o":["편식성","군서습성","완전변태","주간활동성","옥외 서식습성"],"a":2,"e":"가주성 바퀴는 집합페로몬에 의해 무리를 지어 사는 군서습성이 있다. 그 밖에 야간활동성, 잡식성, 실내 서식성이 있으며, 알 → 약충 → 성충의 불완전변태를 한다."},{"id":"44-1-91","r":44,"p":1,"n":91,"s":"위생곤충학","q":"모기가 매개하는 질병은?","o":["라임병","발진열","사상충증","샤가스병","바베시아증"],"a":3,"e":"사상충증(말레이사상충증)은 토고숲모기·중국얼룩날개모기 등 모기가 매개한다. 라임병·바베시아증은 참진드기, 발진열은 쥐벼룩, 샤가스병은 흡혈노린재가 매개한다."},{"id":"44-1-92","r":44,"p":1,"n":92,"s":"위생곤충학","q":"모기가 벽면에 앉는 습성을 이용한 방제법은?","o":["에어로졸","가열연막법","잔류분무법","극미량연무법","유문등이용법"],"a":3,"e":"잔류분무법은 모기가 흡혈 전후 벽면에 앉아 쉬는 습성을 이용해, 잔효성 살충제를 벽면에 뿌려 앉은 모기가 접촉하여 죽도록 하는 방법이다. 가열연막법·극미량연무법·에어로졸은 공중의 성충을 대상으로 하는 공간살포이다."},{"id":"44-1-93","r":44,"p":1,"n":93,"s":"위생곤충학","q":"모기가 겨울철 대형건물 내에서 활동하는 경우 발생원이 될 수 있는 곳은?","o":["옥상","화분","발코니","지하정화조","옥외배수로"],"a":4,"e":"빨간집모기의 아종인 지하집모기는 겨울에도 휴면하지 않고, 수온이 유지되는 대형건물의 지하정화조·지하 집수정 등에서 발생한다. 옥상·발코니·화분·옥외배수로는 겨울철 기온이 낮아 발생원이 되기 어렵다."},{"id":"44-1-94","r":44,"p":1,"n":94,"s":"위생곤충학","q":"다음 중 흡혈성 파리는?","o":["금파리","집파리","침파리","검정파리","딸집파리"],"a":3,"e":"침파리는 주둥이가 앞으로 길게 돌출된 찌르는 구기를 가져 암수 모두 흡혈한다. 집파리·금파리·검정파리·딸집파리는 핥아먹는 구기를 가진 비흡혈성 파리이다."},{"id":"44-1-95","r":44,"p":1,"n":95,"s":"위생곤충학","q":"집파리의 구기(mouth part)가 먹이의 형태에 따라 변형되는 부위는?","o":["순판(labellum)","큰턱(mandible)","윗입술(labrum)","하인두(hypopharynx)","전구치(prestomal teeth)"],"a":1,"e":"집파리는 핥아먹는 형 구기를 가지며, 끝의 순판(labellum)이 먹이 형태에 따라 펼쳐지거나 오므려지고 의기관으로 액체를 흡수한다. 집파리 구기에는 큰턱이 발달하지 않아 씹는 기능이 없다."},{"id":"44-1-96","r":44,"p":1,"n":96,"s":"위생곤충학","q":"다음의 특징이 있는 파리는?","o":["쉬파리","집파리","털파리","딸집파리","검정파리"],"a":4,"b":"• 촉각극모(arista)는 단모이다.\n• 흉부 순판에 흑색종선이 3개 있다.\n• 유충은 각 체절에 육질돌기가 있다.\n• 날아다닐 때 공중의 한 점에서 정지 비행하는 습성이 있다.","e":"딸집파리는 촉각극모가 털 없는 단모이고, 흉부 순판에 흑색종선이 3개이며, 유충 각 체절에 육질돌기가 있고, 공중의 한 점에서 정지 비행하는 습성이 특징이다. 집파리는 촉각극모가 깃털 모양(우모)이고 흉부 종선이 4개여서 구별된다."},{"id":"44-1-97","r":44,"p":1,"n":97,"s":"위생곤충학","q":"체체파리에 의해 매개되는 질병은?","o":["홍역","콜레라","말라리아","장티푸스","아프리카수면병"],"a":5,"e":"체체파리는 트리파노소마 원충을 매개하여 아프리카수면병을 일으킨다. 말라리아는 얼룩날개모기가 매개하고, 콜레라·장티푸스는 주로 물과 음식으로 전파되는 수인성 감염병이며, 홍역은 비말로 전파된다."},{"id":"44-1-98","r":44,"p":1,"n":98,"s":"위생곤충학","q":"이(louse)의 입 구조에서 타액선과 연결되어 흡혈한 혈액을 위(gut)로 보내는 것은?","o":["밑마디(cardo)","배자침(1st stylet)","중자침(2nd stylet)","복자침(3rd stylet)","아랫입술수염(labial palp)"],"a":3,"e":"이의 구기에서 중자침은 하인두에서 유래한 구조로 타액관과 연결되어 흡혈 과정에 관여한다. 배자침과 복자침은 중자침을 감싸며 피부를 찌르고 절개하는 역할을 하고, 아랫입술수염은 감각기관이다. ※ 교재 확인 권장"},{"id":"44-1-99","r":44,"p":1,"n":99,"s":"위생곤충학","q":"빈대는 분류학상 어느 목(Order)에 속하는가?","o":["나비목(Order Lepidoptera)","파리목(Order Diptera)","메뚜기목(Order Orthoptera)","노린재목(Order Hemiptera)","딱정벌레목(Order Coleoptera)"],"a":4,"e":"빈대는 찌르고 빠는 구기를 가진 노린재목(반시목) 빈대과에 속하며, 날개가 퇴화되어 날지 못한다. 파리목은 날개 1쌍, 딱정벌레목은 단단한 앞날개, 나비목은 비늘 덮인 날개가 특징이다."},{"id":"44-1-100","r":44,"p":1,"n":100,"s":"위생곤충학","q":"벼룩의 종류와 그에 대한 설명으로 옳은 것은?","o":["개벼룩 – 협즐치는 있으나 전흉즐치는 없다.","사람벼룩 – 협즐치와 전흉즐치가 모두 있다.","고양이벼룩 – 전흉즐치는 있으나 협즐치는 없다.","유럽쥐벼룩 – 협즐치는 있으나 전흉즐치는 없다.","열대쥐벼룩 – 즐치는 없으며 중흉복판에 중흉측선이 있다."],"a":5,"e":"열대쥐벼룩은 협즐치와 전흉즐치가 모두 없으며, 중흉측판의 중흉측선이 있어 즐치가 없는 사람벼룩과 구별된다. 개벼룩·고양이벼룩은 협즐치와 전흉즐치가 모두 있고, 사람벼룩은 둘 다 없으며, 유럽쥐벼룩은 전흉즐치만 있다."},{"id":"44-1-101","r":44,"p":1,"n":101,"s":"위생곤충학","q":"독나방 유충이 발생하는 장소를 확인하기 위해 조사해야 하는 곳은?","o":["거실","정원숲","정화조","지하실","하수구"],"a":2,"e":"독나방 유충은 참나무·벚나무 등 활엽수 잎을 먹고 자라므로 정원숲이나 산림에서 발생원을 조사해야 한다. 성충은 주광성이 있어 불빛을 따라 실내로 들어오지만, 거실·지하실·하수구·정화조는 유충 발생 장소가 아니다."},{"id":"44-1-102","r":44,"p":1,"n":102,"s":"위생곤충학","q":"독침으로 사람에게 피해를 입히는 위생곤충은?","o":["각다귀","반날개","침개미","큰집파리","청색하늘소붙이"],"a":3,"e":"침개미는 꼬리 끝의 독침으로 사람을 쏘아 통증과 알레르기 반응을 일으킨다. 청딱지개미반날개와 청색하늘소붙이는 쏘지 않고, 몸이 눌릴 때 나오는 체액(독성물질)으로 피부염·수포를 일으키며, 각다귀는 흡혈하지 않는다."},{"id":"44-1-103","r":44,"p":1,"n":103,"s":"위생곤충학","q":"라임병(lyme disease)을 전파하는 매개체는?","o":["벼룩","빈대","털진드기","참진드기","흡혈노린재"],"a":4,"e":"라임병은 보렐리아(Borrelia burgdorferi) 균에 의한 질병으로 참진드기(Ixodes속)가 매개한다. 털진드기는 쯔쯔가무시증, 벼룩은 페스트·발진열, 흡혈노린재는 샤가스병을 매개한다."},{"id":"44-1-104","r":44,"p":1,"n":104,"s":"위생곤충학","q":"자충과 성충은 자유생활을 하고, 유충은 포유동물에 기생하여 흡혈하는 진드기는?","o":["옴진드기","털진드기","참진드기","먼지진드기","물렁진드기"],"a":2,"e":"털진드기는 유충 시기에만 포유동물에 기생하여 조직액을 섭취하고, 자충과 성충은 토양에서 자유생활을 하며, 쯔쯔가무시증을 매개한다. 참진드기는 유충·자충·성충 모든 단계에서 흡혈하고, 옴진드기는 전 생활사를 피부 속에서 기생한다."},{"id":"44-1-105","r":44,"p":1,"n":105,"s":"위생곤충학","q":"국내에서 서식하는 절대 우점종인 들쥐 중 1976년 세계 최초로 한타바이러스(Hantavirus)가 분리된 쥐는?","o":["곰쥐","갈밭쥐","두더지","등줄쥐","시궁쥐"],"a":4,"e":"1976년 이호왕 박사가 국내 들쥐의 우점종인 등줄쥐에서 한탄바이러스를 세계 최초로 분리하였으며, 이는 신증후군출혈열(유행성출혈열)의 원인체이다. 시궁쥐는 도시형인 서울바이러스와 관련되고, 두더지는 쥐류가 아닌 식충목이다."},{"id":"44-2-1","r":44,"p":2,"n":1,"s":"공중보건학","q":"1차 보건의료의 필수적인 사업은?","o":["전문의약품 개발","만성질환자 관리","회복기환자의 방문간호","장애방지를 위한 진단과 치료","주요 감염병에 대한 예방접종"],"a":5,"e":"알마아타 선언(1978)에서 제시한 1차 보건의료의 필수 사업에는 보건교육, 식량·영양 공급, 안전한 물과 환경위생, 모자보건·가족계획, 주요 감염병 예방접종, 풍토병 관리, 흔한 질병·상해의 적절한 치료, 필수의약품 공급이 포함된다. 전문의약품 개발은 1차 보건의료의 범위가 아니며, 장애방지를 위한 진단·치료나 회복기환자 방문간호는 2·3차 예방·의료 단계에 해당한다."},{"id":"44-2-2","r":44,"p":2,"n":2,"s":"공중보건학","q":"다음 설명과 관련된 것은?","o":["파리 협정","교토 의정서","오타와 헌장","라론드 보고서","알마아타 선언"],"a":4,"b":"• 건강결정요인을 생물학적 요인, 환경적 요인, 생활양식, 보건의료체계로 나누었다.\n• 생활양식의 변화와 환경의 개선이 건강문제 해결을 위한 보다 중요한 요인임을 강조하였다.","e":"캐나다의 라론드 보고서(1974)는 건강장(health field) 개념으로 건강결정요인을 생물학적 요인, 환경, 생활양식, 보건의료체계의 4가지로 나누고 생활양식과 환경 개선을 강조했다. 오타와 헌장(1986)은 건강증진의 3대 원칙과 5대 활동 영역을, 알마아타 선언(1978)은 1차 보건의료를 제시한 것이다."},{"id":"44-2-3","r":44,"p":2,"n":3,"s":"공중보건학","q":"가설을 증명하기 위하여 관찰을 통해 특정요인과 특정질병 간의 인과관계를 알아낼 수 있도록 설계된 2단계 역학은?","o":["기술역학","분석역학","작전역학","환경역학","이론역학"],"a":2,"e":"분석역학은 기술역학(1단계)에서 세운 가설을 관찰을 통해 검증하여 특정 요인과 질병 간 인과관계를 밝히는 2단계 역학이다. 기술역학은 누가·언제·어디서 발생했는지를 기술하여 가설을 설정하는 1단계이고, 이론역학은 수리적 모형으로 유행을 설명하는 단계이다."},{"id":"44-2-4","r":44,"p":2,"n":4,"s":"공중보건학","q":"질병 발생양상이 2~3년을 주기로 반복되어 유행하는 역학적 현상은?","o":["순환 변화","단기 변화","추세 변화","장기 변화","불규칙 변화"],"a":1,"e":"순환 변화는 2~4년을 주기로 유행이 반복되는 현상으로, 홍역(2~3년)과 백일해(2~4년)가 대표적이다. 추세 변화(장기 변화)는 장티푸스·디프테리아처럼 수십 년 단위로 나타나는 변화이고, 불규칙 변화는 외래 감염병 유입 등으로 돌발적으로 발생하는 유행이다."},{"id":"44-2-5","r":44,"p":2,"n":5,"s":"공중보건학","q":"인간집단에서 발생하는 질병의 자연사를 역학적인 변수에 따라 사실 그대로 정리하고 요약하는 역학은?","o":["기술역학","분석역학","실험역학","임상역학","작전역학"],"a":1,"e":"기술역학은 질병의 발생 분포와 자연사를 인적(누가)·시간적(언제)·지역적(어디서) 변수에 따라 있는 그대로 기술하고 요약하는 1단계 역학이다. 분석역학은 가설을 검증하여 인과관계를 밝히는 단계이고, 실험역학은 연구자가 요인을 직접 조작하여 효과를 확인하는 방법이다."},{"id":"44-2-6","r":44,"p":2,"n":6,"s":"공중보건학","q":"희귀질병이나 잠복기가 긴 질병의 원인을 비교적 짧은 기간에 밝히는 데 적합한 역학 연구방법은?","o":["단면 연구","기술 연구","전향성 연구","코호트 연구","환자-대조군 연구"],"a":5,"e":"환자-대조군 연구는 이미 질병이 있는 환자군과 없는 대조군의 과거 요인 노출을 비교하는 후향적 연구로, 희귀질병이나 잠복기가 긴 질병의 원인을 비교적 짧은 기간과 적은 비용으로 조사할 수 있다. 코호트(전향성) 연구는 장기간 대규모 집단을 추적해야 하므로 희귀질병 연구에 부적합하고, 단면 연구는 한 시점의 유병 상태만 보므로 시간적 선후관계를 밝히기 어렵다."},{"id":"44-2-7","r":44,"p":2,"n":7,"s":"공중보건학","q":"옴란(Omran)이 소개한 것으로, 지역사회 보건의료서비스의 운영에 관한 계통적 연구는?","o":["기술역학","분석역학","실험역학","이론역학","작전역학"],"a":5,"e":"작전역학은 지역사회 보건의료서비스의 운영·관리와 그 효과를 계통적으로 연구하여 보건사업의 개선에 활용하는 역학으로, 옴란(Omran)이 소개하였다. 이론역학은 감염병 유행을 수리적 모형으로 설명하는 것이고, 실험역학은 연구자가 요인을 인위적으로 조작해 효과를 검증하는 방법이다."},{"id":"44-2-8","r":44,"p":2,"n":8,"s":"공중보건학","q":"절지동물의 다리나 체표면에 묻은 병원체가 아무런 변화 없이 그대로 옮겨지는 방식은?","o":["직접 전파","경란형 전파","기계적 전파","생물학적 전파","비활성매개체 전파"],"a":3,"e":"기계적 전파는 파리·바퀴벌레 등 절지동물의 다리나 체표면에 묻은 병원체가 매개체 내에서 증식이나 발육 없이 그대로 옮겨지는 방식이다. 생물학적 전파는 병원체가 매개곤충 체내에서 증식·발육한 뒤 전파되는 것이며, 경란형 전파는 그중 진드기처럼 병원체가 알을 통해 다음 세대로 전달되는 형태이다."},{"id":"44-2-9","r":44,"p":2,"n":9,"s":"공중보건학","q":"병원체가 원충류인 것은?","o":["임질","발진열","폴리오","말라리아","록키산홍반열"],"a":4,"e":"말라리아는 원충류인 Plasmodium 속이 원인이며 얼룩날개모기(Anopheles)가 매개한다. 임질은 세균(임균), 발진열과 록키산홍반열은 리케치아, 폴리오는 바이러스가 병원체이다."},{"id":"44-2-10","r":44,"p":2,"n":10,"s":"공중보건학","q":"자연수동면역이 획득되는 경우는?","o":["예방접종","모유 수유","항독소 투여","질병에의 이환","감마글로불린 주사"],"a":2,"e":"자연수동면역은 태반이나 모유를 통해 모체의 항체를 받아 얻는 면역이다. 질병에 이환된 후 얻는 면역은 자연능동면역, 예방접종은 인공능동면역이며, 항독소나 감마글로불린 주사는 만들어진 항체를 주입하는 인공수동면역이다."},{"id":"44-2-11","r":44,"p":2,"n":11,"s":"공중보건학","q":"생물테러감염병 또는 치명률이 높거나 집단 발생의 우려가 커서 발생 또는 유행 즉시 신고하여야 하고, 음압격리와 같은 높은 수준의 격리가 필요한 감염병에 해당하는 것은?","o":["레지오넬라증","비브리오패혈증","보툴리눔독소증","후천성면역결핍증","장출혈성대장균감염증"],"a":3,"e":"보툴리눔독소증은 「감염병의 예방 및 관리에 관한 법률」상 제1급감염병으로, 생물테러 가능성과 높은 치명률 때문에 발생 즉시 신고하고 높은 수준의 격리가 필요하다. 장출혈성대장균감염증은 제2급(24시간 이내 신고), 레지오넬라증·비브리오패혈증·후천성면역결핍증은 제3급감염병이다."},{"id":"44-2-12","r":44,"p":2,"n":12,"s":"공중보건학","q":"발열과 전신에 홍반성 발진이 생기며, 예방하기 위해 MMR백신을 접종하는 감염병은?","o":["홍역","백일해","말라리아","장티푸스","세균성이질"],"a":1,"e":"홍역은 발열, 코플릭 반점에 이어 전신의 홍반성 발진이 나타나며, 홍역·유행성이하선염·풍진을 함께 예방하는 MMR백신으로 예방한다. 백일해는 DTaP 백신으로 예방하며, 장티푸스와 세균성이질은 발진성 질환이 아닌 소화기계 감염병이다."},{"id":"44-2-13","r":44,"p":2,"n":13,"s":"공중보건학","q":"다음 설명과 관련된 감염병은?","o":["폴리오","A형간염","파라티푸스","인플루엔자","아니사키스"],"a":4,"b":"• 동절기에 빈발하는 급성호흡기계감염병이다.\n• 항원변이가 생겨 면역력이 없는 집단에 대규모 유행을 일으킬 수 있기 때문에 국제적인 감시가 필요하다.","e":"인플루엔자는 겨울철에 빈발하는 급성 호흡기 감염병으로, 항원소변이(drift)와 항원대변이(shift)로 새로운 아형이 생기면 면역이 없는 집단에 세계적 대유행을 일으킬 수 있어 WHO 중심의 국제 감시가 이루어진다. 폴리오, A형간염, 파라티푸스는 소화기계 감염병이고, 아니사키스는 기생충 질환이다."},{"id":"44-2-14","r":44,"p":2,"n":14,"s":"공중보건학","q":"만성질환의 역학적 특성은?","o":["잠복기간이 짧다.","직접적인 원인이 존재한다.","질병의 발생시점이 분명하다.","질병발생과 질병경과가 일치한다.","연령이 증가함에 따라 유병률이 증가한다."],"a":5,"e":"만성질환은 퇴행성 변화와 누적 노출이 관련되므로 연령이 증가할수록 유병률이 높아진다. 잠복기가 길고, 여러 요인이 복합적으로 작용해 직접적 원인이 뚜렷하지 않으며, 발생 시점도 분명하지 않다는 점에서 나머지 설명은 급성 감염병의 특성에 가깝다."},{"id":"44-2-15","r":44,"p":2,"n":15,"s":"공중보건학","q":"뇌졸중의 위험인자 중 조절이 가능한 것은?","o":["연령","흡연","성별","인종","가족력"],"a":2,"e":"흡연은 개인의 생활습관이므로 금연을 통해 조절할 수 있는 뇌졸중 위험인자이다(고혈압, 당뇨병, 이상지질혈증, 음주, 비만 등도 조절 가능). 연령, 성별, 인종, 가족력은 바꿀 수 없는 조절 불가능한 위험인자이다."},{"id":"44-2-16","r":44,"p":2,"n":16,"s":"공중보건학","q":"다음 설명의 만성질환은?","o":["암","고혈압","뇌전증","당뇨병","부정맥"],"a":2,"b":"• 아무런 증상이 없다가 어느 날 갑자기 생명을 위협하기 때문에 ‘침묵의 살인자’라고도 한다.\n• 어떤 현성질병으로 취급하기보다는 이로 인해 유발될 질병의 사전 예방을 위한 지표로써 의미가 크다.\n• 뇌졸중, 신장장애, 동맥경화, 망막장애가 주요 병발증이다.","e":"고혈압은 대부분 자각증상이 없어 ‘침묵의 살인자’로 불리며, 그 자체보다 뇌졸중, 동맥경화, 신장장애, 망막장애 등 합병증을 예방하기 위한 지표로서 의미가 크다. 당뇨병도 망막·신장 합병증이 있으나 혈당 이상이 핵심이며 침묵의 살인자라는 표현과 이 지표적 성격은 고혈압을 가리킨다."},{"id":"44-2-17","r":44,"p":2,"n":17,"s":"공중보건학","q":"의료인 면허제도로 인해 나타나는 보건의료서비스의 사회·경제적인 특성은?","o":["공급의 독점성","수요의 불확실성","외부효과의 존재","노동집약적인 성격","소비재와 투자재의 혼재"],"a":1,"e":"의료인 면허제도는 자격을 가진 사람만 의료서비스를 제공할 수 있도록 진입을 제한하므로 공급의 독점성이 나타난다. 수요의 불확실성은 질병 발생을 예측할 수 없다는 특성이고, 외부효과는 예방접종처럼 소비의 효과가 타인에게도 미치는 특성이다."},{"id":"44-2-18","r":44,"p":2,"n":18,"s":"공중보건학","q":"「지역보건법」상 병원의 요건을 갖춘 보건소가 사용할 수 있는 명칭은?","o":["보건지소","보건진료소","보건의료원","보건진료원","건강생활지원센터"],"a":3,"e":"「지역보건법」상 보건소 중 「의료법」에 따른 병원의 요건을 갖춘 보건소는 보건의료원이라는 명칭을 사용할 수 있다. 보건지소는 읍·면 단위에 두는 보건소의 지소이고, 보건진료소는 「농어촌 등 보건의료를 위한 특별조치법」에 따른 기관이다."},{"id":"44-2-19","r":44,"p":2,"n":19,"s":"공중보건학","q":"조선시대 감염병 환자의 치료를 담당했던 기관은?","o":["약전","활인서","상약국","의학원","전의감"],"a":2,"e":"활인서는 조선시대에 감염병 환자의 치료와 빈민 구료를 담당한 기관이다. 전의감은 일반 의료행정과 의학교육을 맡았고, 서민 의료는 혜민서가 담당하였다."},{"id":"44-2-20","r":44,"p":2,"n":20,"s":"공중보건학","q":"「지역보건법」상 보건소 설치 기준의 (   )에 들어갈 말로 옳은 것은?","o":["특별시·광역시","시·도","시·군·구","읍·면","리·동"],"a":3,"b":"지역주민의 건강을 증진하고 질병을 예방·관리하기 위하여 (   )에 1개소의 보건소를 설치한다.","e":"「지역보건법」에 따라 보건소는 시·군·구에 1개소씩 설치하며, 필요시 대통령령 기준에 따라 추가 설치할 수 있다. 읍·면 단위에는 보건소가 아닌 보건지소를 둔다."},{"id":"44-2-21","r":44,"p":2,"n":21,"s":"공중보건학","q":"산업재해예방 및 산업안전보건정책을 담당하는 중앙 행정기관은?","o":["교육부","환경부","고용노동부","보건복지부","행정안전부"],"a":3,"e":"산업재해 예방과 산업안전보건 정책(「산업안전보건법」 소관)은 고용노동부가 담당한다. 보건복지부는 보건의료·사회복지, 환경부는 환경보전 정책을 담당한다."},{"id":"44-2-22","r":44,"p":2,"n":22,"s":"공중보건학","q":"환경 관련 국제 협력 및 조정, 지구 환경의 감시, 환경 관련 지식 발전 등의 역할을 수행하는 국제 기구는?","o":["ILO","FAO","WTO","UNEP","UNICEF"],"a":4,"e":"UNEP(유엔환경계획)는 1972년 스톡홀름 유엔인간환경회의를 계기로 설립되어 환경 관련 국제 협력·조정과 지구 환경 감시를 수행한다. ILO는 노동 문제, FAO는 식량·농업, UNICEF는 아동 보호를 담당하는 국제기구이다."},{"id":"44-2-23","r":44,"p":2,"n":23,"s":"공중보건학","q":"사회보험에 해당하는 것은?","o":["의료급여","재해구호","국민건강보험","노인복지서비스","국민기초생활보장"],"a":3,"e":"국민건강보험은 국민연금, 고용보험, 산업재해보상보험, 노인장기요양보험과 함께 사회보험에 해당한다. 의료급여와 국민기초생활보장은 저소득층을 국가 재정으로 지원하는 공공부조이고, 노인복지서비스는 사회서비스에 해당한다."},{"id":"44-2-24","r":44,"p":2,"n":24,"s":"공중보건학","q":"0~14세 인구에 대한 65세 이상 인구의 백분율로 산출하는 보건지표는?","o":["부양비","노년부양비","노령화지수","비례사망지수","유소년부양비"],"a":3,"e":"노령화지수는 (65세 이상 인구 ÷ 0~14세 인구) × 100으로 산출한다. 노년부양비는 65세 이상 인구를 15~64세 생산가능인구로 나눈 값이므로 분모가 다르다는 점에 주의한다."},{"id":"44-2-25","r":44,"p":2,"n":25,"s":"공중보건학","q":"3차 성비(sex ratio)는?","o":["태아의 성비","출생 시의 성비","수태 시의 성비","결혼 시의 성비","현재 인구의 성비"],"a":5,"e":"3차 성비는 현재 인구의 성비이다. 1차 성비는 태아(수태 시)의 성비, 2차 성비는 출생 시의 성비이다."},{"id":"44-2-26","r":44,"p":2,"n":26,"s":"공중보건학","q":"부족 시 야맹증, 안구건조증 등을 유발하는 비타민은?","o":["A","D","E","F","K"],"a":1,"e":"비타민 A는 망막의 로돕신 형성과 상피조직 유지에 필요하여, 결핍 시 야맹증, 안구건조증, 각막연화증이 생긴다. 비타민 D 결핍은 구루병·골연화증, 비타민 K 결핍은 혈액응고 지연을 일으킨다."},{"id":"44-2-27","r":44,"p":2,"n":27,"s":"공중보건학","q":"출생 후 4주 이내에 예방접종을 해야 하는 감염병은?","o":["결핵","파상풍","A형간염","디프테리아","유행성이하선염"],"a":1,"e":"결핵 예방을 위한 BCG 백신은 생후 4주 이내에 접종한다. 디프테리아·파상풍은 DTaP로 생후 2·4·6개월에, 유행성이하선염은 MMR로 생후 12~15개월에, A형간염은 생후 12~23개월에 접종을 시작한다."},{"id":"44-2-28","r":44,"p":2,"n":28,"s":"공중보건학","q":"노인의 기능상태를 평가하기 위한 ‘도구적 일상생활 수행능력(Instrumental Activities of Daily Living: IADL)’에 해당하는 항목은?","o":["옷입기","식사하기","세수하기","화장실가기","교통수단이용하기"],"a":5,"e":"도구적 일상생활 수행능력(IADL)은 교통수단 이용, 전화 사용, 장보기, 식사 준비, 금전 관리, 약 복용 등 독립적인 사회생활에 필요한 복합적 활동을 평가한다. 옷입기, 식사하기, 세수하기, 화장실 가기는 기본적 일상생활 수행능력(ADL)에 해당한다."},{"id":"44-2-29","r":44,"p":2,"n":29,"s":"공중보건학","q":"지역사회에 미치는 파급효과가 크며 지속력이 높은 보건교육은?","o":["가정보건교육","성인보건교육","직장보건교육","학교보건교육","환자보건교육"],"a":4,"e":"학교보건교육은 학생이 학습 의욕과 수용성이 높고, 학생을 통해 가정과 지역사회로 파급효과가 크며, 형성된 건강습관이 오래 지속된다는 장점이 있다. 환자보건교육이나 직장보건교육은 대상이 특정 집단에 한정되어 지역사회 전체로의 파급효과가 상대적으로 작다."},{"id":"44-2-30","r":44,"p":2,"n":30,"s":"공중보건학","q":"코로나바이러스감염증-19(COVID-19)와 같은 급성 감염병이 유행할 때 국민들에게 신속하게 보건교육을 하기에 좋은 대중접촉방법은?","o":["강의","세미나","워크숍","가정방문","텔레비전 방송"],"a":5,"e":"텔레비전 방송 같은 대중매체는 짧은 시간에 다수의 국민에게 동시에 정보를 전달할 수 있어 급성 감염병 유행 시 신속한 보건교육에 적합하다. 강의, 세미나, 워크숍은 집단접촉방법이고, 가정방문은 개인접촉방법이므로 전파 범위와 속도가 제한적이다."},{"id":"44-2-31","r":44,"p":2,"n":31,"s":"공중보건학","q":"「교육환경 보호에 관한 법률」상 교육환경 보호구역을 설정·고시하여야 하는 자는?","o":["시장","교육감","학교장","보건소장","교육부장관"],"a":2,"e":"「교육환경 보호에 관한 법률」에 따라 교육감은 학교경계 등으로부터 직선거리 200m 범위 안에서 교육환경보호구역(학교 출입문에서 50m의 절대보호구역과 그 외의 상대보호구역)을 설정·고시해야 한다. 학교장이나 교육부장관이 설정하는 것이 아니라는 점에 주의한다."},{"id":"44-2-32","r":44,"p":2,"n":32,"s":"공중보건학","q":"「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」상 기초정신건강복지센터를 설치·운영할 수 있는 자는?","o":["행정안전부장관","보건복지부장관","시·도지사","시장·군수·구청장","보건소장"],"a":4,"e":"「정신건강증진 및 정신질환자 복지서비스 지원에 관한 법률」상 시장·군수·구청장은 관할 지역에 기초정신건강복지센터를 설치·운영할 수 있다. 시·도지사는 광역정신건강복지센터를 설치·운영하는 주체이며, 보건소장은 설치 주체가 아니다."},{"id":"44-2-33","r":44,"p":2,"n":33,"s":"공중보건학","q":"보건통계에서 대푯값에 해당하는 것은?","o":["범위","변이계수","산술평균","평균편차","표준편차"],"a":3,"e":"대푯값(중심경향값)은 자료의 중심을 나타내는 값으로 산술평균, 중앙값, 최빈값 등이 있다. 범위, 평균편차, 표준편차, 변이계수는 자료가 흩어진 정도를 나타내는 산포도이다."},{"id":"44-2-34","r":44,"p":2,"n":34,"s":"공중보건학","q":"보통사망률(crude death rate) 산출 시 분자에 해당하는 것은?","o":["연앙인구","총 인구수","모성사망자수","연간 총 사망자수","50세 이상 사망자수"],"a":4,"e":"【공식】 보통사망률 = (연간 총 사망자수 ÷ 연앙인구) × 1,000\n【풀이】 분자는 그 해의 연간 총 사망자수이고, 분모는 그 해 7월 1일 기준의 연앙인구이다. 연앙인구는 분자가 아니라 분모에 해당하며, 모성사망자수는 모성사망비·모성사망률의 분자이다."},{"id":"44-2-35","r":44,"p":2,"n":35,"s":"공중보건학","q":"질병관리청장이 고시한 생물테러감염병은?","o":["탄저","황열","뎅기열","콜레라","브루셀라증"],"a":1,"e":"질병관리청장이 고시한 생물테러감염병은 탄저, 보툴리눔독소증, 페스트, 마버그열, 에볼라바이러스병, 라싸열, 두창, 야토병이다. 황열·뎅기열·브루셀라증은 제3급감염병, 콜레라는 제2급감염병으로 생물테러감염병 고시 대상이 아니다."},{"id":"44-2-36","r":44,"p":2,"n":36,"s":"식품위생학","q":"세계보건기구(WHO)의 식품위생에 대한 정의에서 (   ) 안에 들어갈 내용은?","o":["기능성","기호성","보건성","안전성","영양성"],"a":4,"b":"식품위생이란 식품의 생육, 생산, 제조에서부터 최종적으로 사람에게 섭취되기까지의 모든 단계에 있어서 식품의 (   ), 건전성 및 완전무결성을 확보하기 위한 모든 수단을 말한다.","e":"WHO는 식품위생을 식품의 생육·생산·제조부터 최종 섭취까지 모든 단계에서 식품의 안전성(safety), 건전성(soundness), 완전무결성(wholesomeness)을 확보하기 위한 모든 수단으로 정의한다. 기호성이나 영양성은 식품의 품질 요소이지 이 정의에 포함된 용어가 아니다."},{"id":"44-2-37","r":44,"p":2,"n":37,"s":"식품위생학","q":"내인성 위해요소가 포함되어 있는 식품은?","o":["덜 익은 매실","숯불에 탄 쇠고기","맥각이 혼입된 보리","가열 처리한 튀김유지","농약이 묻어 있는 채소"],"a":1,"e":"내인성 위해요소는 식품 자체에 원래 들어 있는 유독 성분으로, 덜 익은 매실(청매)의 아미그달린 같은 자연독이 대표적이다. 숯불에 탄 고기의 벤조피렌이나 가열한 튀김유지의 산화물은 조리·가공 중 생성되는 유기성(유도성) 위해요소이고, 맥각 혼입이나 잔류농약은 외부에서 들어온 외인성 위해요소이다."},{"id":"44-2-38","r":44,"p":2,"n":38,"s":"식품위생학","q":"식품의 안전성을 평가하기 위해 최대무작용량을 결정하는 독성시험은?","o":["번식시험","만성독성시험","유전독성시험","최기형성시험","아급성독성시험"],"a":2,"e":"만성독성시험은 시험동물에 장기간(보통 1~2년) 시험물질을 투여하여 최대무작용량(NOAEL)을 결정하며, 이를 근거로 1일 섭취허용량(ADI)을 산출한다. 아급성독성시험은 1~3개월 투여로 만성독성시험의 투여량을 정하기 위한 시험이고, 반수치사량(LD50)은 급성독성시험으로 구한다."},{"id":"44-2-39","r":44,"p":2,"n":39,"s":"식품위생학","q":"시험물질의 독성을 반수치사량(LD₅₀)으로 표시하는 것은?","o":["발암성시험","급성독성시험","면역독성시험","변이원성시험","생식독성시험"],"a":2,"e":"급성독성시험은 시험물질을 1회 투여한 뒤 일정 기간 관찰하여 시험동물의 50%가 죽는 양인 반수치사량(LD50)으로 독성을 표시한다. LD50 값이 작을수록 독성이 강하며, 최대무작용량을 정하는 것은 만성독성시험이다."},{"id":"44-2-40","r":44,"p":2,"n":40,"s":"식품위생학","q":"미생물의 발육에 필요한 최저 수분활성도(Aw)가 높은 순으로 옳은 것은?","o":["곰팡이 > 세균 > 효모","세균 > 효모 > 곰팡이","효모 > 세균 > 곰팡이","세균 > 곰팡이 > 효모","곰팡이 > 효모 > 세균"],"a":2,"e":"미생물 발육에 필요한 최저 수분활성도는 일반적으로 세균(약 0.90~0.94) > 효모(약 0.88) > 곰팡이(약 0.80) 순이다. 곰팡이가 가장 건조한 조건에서도 자랄 수 있으므로 건조식품의 변질은 주로 곰팡이에 의해 일어난다."},{"id":"44-2-41","r":44,"p":2,"n":41,"s":"식품위생학","q":"다음의 설명에 해당하는 미생물 속은?","o":["Bacillus","Salmonella","Escherichia","Micrococcus","Pseudomonas"],"a":1,"b":"• 그람양성의 호기성 또는 통성혐기성 간균이다.\n• 내열성 포자를 형성한다.\n• 단백질과 전분의 분해력이 강해 쌀밥, 어육제품 등의 부패 원인균이다.","e":"Bacillus 속은 그람양성의 호기성 또는 통성혐기성 간균으로 내열성 포자를 형성하며, 전분·단백질 분해력이 강해 쌀밥이나 어육제품 부패의 원인이 된다. Pseudomonas는 그람음성 간균으로 포자를 만들지 않으며 저온에서 어패류·육류를 부패시키고, Micrococcus는 구균이다."},{"id":"44-2-42","r":44,"p":2,"n":42,"s":"식품위생학","q":"다음의 설명에 해당하는 곰팡이 속은?","o":["Mucor","Fusarium","Rhizopus","Penicillium","Aspergillus"],"a":5,"b":"• 누룩곰팡이 또는 국균이라고 부른다.\n• 아플라톡신을 생산하는 균주가 있다.","e":"Aspergillus 속은 누룩곰팡이(국균)로 A. oryzae는 장류·주류 양조에 쓰이고, A. flavus 등 일부 균주는 간암을 유발하는 아플라톡신을 생산한다. Penicillium은 푸른곰팡이, Rhizopus는 거미줄곰팡이, Fusarium은 붉은곰팡이이다."},{"id":"44-2-43","r":44,"p":2,"n":43,"s":"식품위생학","q":"부패의 정의로 옳은 것은?","o":["비타민이 분해되어 저분자 물질이 되는 것","지방이 공기 중의 산소에 의해 변질되는 것","단백질이 혐기적인 조건에서 미생물에 의해 변질되는 것","탄수화물이 미생물의 작용을 받아 알코올을 생성하는 것","무기질이 수소이온농도(pH)의 변화에 의해서 변질되는 것"],"a":3,"e":"부패는 단백질 식품이 혐기적 조건에서 미생물에 의해 분해되어 아민, 황화수소, 암모니아 등 악취와 유해물질이 생기는 현상이다. 지방이 산소에 의해 변질되는 것은 산패이고, 탄수화물이 미생물에 의해 알코올·유기산 등 유용한 물질로 변하는 것은 발효이다."},{"id":"44-2-44","r":44,"p":2,"n":44,"s":"식품위생학","q":"다음의 설명에 해당하는 물리적 소독법은?","o":["간헐멸균","건열멸균","자비살균","자외선조사","고압증기멸균"],"a":4,"b":"• 살균의 잔류효과가 없다.\n• 살균효과가 표면에 한정된다.\n• 비가열처리 살균이다.","e":"자외선조사는 비가열 살균법으로 2,500~2,600Å(약 260nm) 파장에서 살균력이 가장 강하지만 투과력이 약해 표면만 살균되고 잔류효과가 없다. 고압증기멸균·건열멸균·자비살균·간헐멸균은 모두 열을 이용한 가열 살균법이다."},{"id":"44-2-45","r":44,"p":2,"n":45,"s":"식품위생학","q":"다음의 설명에 해당하는 화학적 소독제는?","o":["역성비누","에틸알코올","염소화합물","요오드화합물","크레졸비누액"],"a":1,"b":"• 계면활성제의 일종이다.\n• 제4급 암모늄염의 유도체이다.\n• 세척력은 약하나 살균력이 강하다.","e":"역성비누는 양이온 계면활성제인 제4급 암모늄염 유도체로, 세척력은 약하지만 살균력이 강하고 무색·무취·무독하여 손이나 식기 소독에 쓰인다. 보통비누와 섞으면 살균력이 떨어지므로 보통비누로 먼저 씻은 뒤 사용하며, 크레졸비누액은 냄새가 강해 주로 배설물 소독에 쓰인다."},{"id":"44-2-46","r":44,"p":2,"n":46,"s":"식품위생학","q":"유독화된 섭조개에 의한 식중독 독소는?","o":["듀린(dhurrin)","테물린(temuline)","삭시톡신(saxitoxin)","프타퀼로시드(ptaquiloside)","아마니타톡신(amanitatoxin)"],"a":3,"e":"섭조개(홍합류)나 대합이 유독 와편모조류를 섭취해 축적하는 삭시톡신은 마비성 패독으로, 입술·혀의 마비와 호흡곤란을 일으킨다. 바지락·굴의 독소는 베네루핀이며, 듀린은 수수, 테물린은 독보리, 프타퀼로시드는 고사리의 독성분이다."},{"id":"44-2-47","r":44,"p":2,"n":47,"s":"식품위생학","q":"3~5%의 식염에서 잘 발육하는 식중독균은?","o":["Bacillus cereus","Escherichia coli","Salmonella Enteritidis","Clostridium botulinum","Vibrio parahaemolyticus"],"a":5,"e":"Vibrio parahaemolyticus(장염비브리오균)는 3~5% 식염 농도에서 잘 발육하는 호염성 그람음성 간균으로, 여름철 어패류 생식으로 감염된다. 담수에 약하므로 수돗물 세척과 가열로 예방하며, 나머지 균들은 호염성 세균이 아니다."},{"id":"44-2-48","r":44,"p":2,"n":48,"s":"식품위생학","q":"다음의 설명에 해당하는 식중독균은?","o":["Morganella morganii","Salmonella Enteritidis","Campylobacter jejuni","Cronobacter sakazakii","Pathogenic Escherichia coli"],"a":3,"b":"• 나선형 간균이다.\n• 수백 정도의 소량 균수로도 식중독을 유발한다.\n• Guillain-Barre Syndrome 증상을 동반할 수 있다.","e":"Campylobacter jejuni는 나선형(S자형)의 미호기성 그람음성 간균으로, 수백 개 정도의 적은 균수로도 식중독을 일으키며 길랭-바레 증후군을 동반할 수 있다. Cronobacter sakazakii는 영유아 분유와 관련된 균이고, Morganella morganii는 히스타민을 생성하는 알레르기성 식중독 관련 균이다."},{"id":"44-2-49","r":44,"p":2,"n":49,"s":"식품위생학","q":"저온조건 및 진공포장상태에서도 증식이 가능한 식중독균은?","o":["Bacillus subtilis","Escherichia coli","Clostridium botulinum","Yersinia enterocolitica","Vibrio parahaemolyticus"],"a":4,"e":"Yersinia enterocolitica는 0~5℃의 냉장 온도에서도 증식할 수 있는 저온성 통성혐기성균이어서 냉장·진공포장 식육에서도 증식이 가능하다. Clostridium botulinum은 혐기 조건(진공포장)에서는 증식하지만 일반적인 냉장 저온에서는 증식이 억제되는 편이고, Vibrio parahaemolyticus는 저온에 약하다."},{"id":"44-2-50","r":44,"p":2,"n":50,"s":"식품위생학","q":"다음의 설명에 해당하는 식중독균은?","o":["Vibrio cholerae","Escherichia coli","Clostridium botulinum","Listeria monocytogenes","Staphylococcus aureus"],"a":5,"b":"• 화농균이다.\n• 내열성 독소 생성균이다.\n• 그람양성의 비운동성 통성혐기성균이다.","e":"Staphylococcus aureus(황색포도상구균)는 화농성 질환의 원인균으로, 그람양성의 비운동성 통성혐기성 구균이며 내열성 독소인 엔테로톡신을 생성해 가열해도 독소가 파괴되지 않는다. Clostridium botulinum은 편성혐기성균이고 그 독소(뉴로톡신)는 열에 약하며, Listeria monocytogenes는 운동성이 있다."},{"id":"44-2-51","r":44,"p":2,"n":51,"s":"식품위생학","q":"포자형성균으로, 가열조리 후에도 식품에 증식하기 쉬운 식중독균은?","o":["Vibrio vulnificus","Campylobacter jejuni","Clostridium perfringens","Listeria monocytogenes","Salmonella Typhimurium"],"a":3,"e":"Clostridium perfringens(웰치균)는 혐기성 포자형성균으로, 대량 조리한 식품을 서서히 식히거나 실온에 방치하면 살아남은 포자가 발아하여 증식한다. Vibrio vulnificus, Campylobacter jejuni, Salmonella는 포자를 형성하지 않아 충분히 가열하면 사멸한다."},{"id":"44-2-52","r":44,"p":2,"n":52,"s":"식품위생학","q":"식품의 외인성 위해요소는?","o":["버섯독","복어독","잔류농약","니트로사민","지질과산화물"],"a":3,"e":"외인성 위해요소는 식품 외부에서 혼입되는 유해물질로 잔류농약, 중금속, 유해첨가물, 미생물 등이 해당한다. 버섯독과 복어독은 식품 자체의 자연독으로 내인성이고, 니트로사민과 지질과산화물은 제조·가공·저장 중 생성되는 유기성(유도성) 위해요소이다."},{"id":"44-2-53","r":44,"p":2,"n":53,"s":"식품위생학","q":"콜린에스터라아제(cholinesterase) 저해제로 독성이 강한 유기인제 농약은?","o":["BHC","DDT","aldrin","nissol","parathion"],"a":5,"e":"파라티온은 유기인제 농약으로 콜린에스터라아제 활성을 저해하여 아세틸콜린이 축적되고 축동, 침 흘림, 근육 경련 등 부교감신경 자극 증상을 일으킨다. BHC, DDT, aldrin은 잔류성이 큰 유기염소제이며, nissol은 유기불소제이다."},{"id":"44-2-54","r":44,"p":2,"n":54,"s":"식품위생학","q":"등푸른 생선의 알레르기 식중독 원인 물질은?","o":["테트라민(tetramine)","히스타민(histamine)","무스카린(muscarine)","뉴로톡신(neurotoxin)","에르고톡신(ergotoxin)"],"a":2,"e":"고등어·꽁치 등 등푸른 생선의 히스티딘이 Morganella morganii 등의 탈탄산 작용으로 히스타민이 되어 두드러기·홍조 같은 알레르기성 식중독을 일으키며, 항히스타민제로 치료한다. 테트라민은 소라·고둥의 타액선 독, 무스카린은 독버섯 독, 에르고톡신은 맥각 독이다."},{"id":"44-2-55","r":44,"p":2,"n":55,"s":"식품위생학","q":"이타이이타이병의 원인 중금속은?","o":["구리","수은","크롬","카드뮴","알루미늄"],"a":4,"e":"이타이이타이병은 카드뮴 만성중독으로 신장장애와 골연화증을 일으키며, 일본 광산 폐수에 오염된 쌀과 물이 원인이었다. 미나마타병은 수은(메틸수은) 중독으로 생긴다."},{"id":"44-2-56","r":44,"p":2,"n":56,"s":"식품위생학","q":"복어중독의 원인 독소는?","o":["리시닌(ricinine)","리코린(lycorine)","베네루핀(venerupin)","에르고톡신(ergotoxin)","테트로도톡신(tetrodotoxin)"],"a":5,"e":"복어중독은 주로 난소·간에 많은 테트로도톡신이 원인으로, 열에 강해 가열해도 파괴되지 않으며 신경마비와 호흡마비를 일으킨다. 베네루핀은 바지락·굴, 리시닌은 피마자, 리코린은 꽃무릇(석산)의 독성분이다."},{"id":"44-2-57","r":44,"p":2,"n":57,"s":"식품위생학","q":"온도감각이상(dryice sensation)의 증상을 나타내는 독소는?","o":["삭시톡신(saxitoxin)","테트라민(tetramine)","베네루핀(venerupin)","시구아톡신(ciguatoxin)","오카다산(okadaic acid)"],"a":4,"e":"시구아톡신은 열대·아열대 산호초 어류에 축적되는 시가테라 독으로, 찬 것을 뜨겁게 느끼는 등 온도감각이상(드라이아이스 센세이션)이 특징이다. 삭시톡신은 마비성 패독, 오카다산은 설사성 패독, 베네루핀은 간독성을 나타내는 바지락·굴의 독이다."},{"id":"44-2-58","r":44,"p":2,"n":58,"s":"식품위생학","q":"발아된 감자의 자연독 성분은?","o":["리신(ricin)","솔라닌(solanine)","고시폴(gossypol)","시큐톡신(cicutoxin)","아미그달린(amygdalin)"],"a":2,"e":"솔라닌은 감자의 싹이 튼 부분과 햇빛에 노출되어 녹색으로 변한 껍질 부위에 많은 알칼로이드 배당체로, 열에 안정하므로 싹과 녹색 부위를 제거해야 한다. 고시폴은 목화씨(면실유), 시큐톡신은 독미나리, 아미그달린은 청매·살구씨, 리신은 피마자의 독성분이다."},{"id":"44-2-59","r":44,"p":2,"n":59,"s":"식품위생학","q":"황변미독으로, 신경장애를 일으키는 것은?","o":["제랄레논(zearalenone)","에르고타민(ergotamine)","루테오스카이린(luteoskyrin)","아이슬란디톡신(islanditoxin)","시트레오비리딘(citreoviridin)"],"a":5,"e":"시트레오비리딘은 Penicillium citreoviride가 생성하는 황변미독으로 신경독성을 나타낸다. 같은 황변미독 중 루테오스카이린과 아이슬란디톡신은 간장독이며, 제랄레논은 Fusarium의 생식독소, 에르고타민은 맥각독이다."},{"id":"44-2-60","r":44,"p":2,"n":60,"s":"식품위생학","q":"붉은곰팡이 속이 생산하는 독소는?","o":["파툴린(patulin)","푸모니신(fumonisin)","루브라톡신(rubratoxin)","오크라톡신(ochratoxin)","스테리그마토시스틴(sterigmatocystin)"],"a":2,"e":"붉은곰팡이(Fusarium) 속은 푸모니신, 제랄레논, T-2 독소 등을 생산하며 푸모니신은 주로 옥수수에서 문제가 된다. 오크라톡신과 스테리그마토시스틴은 Aspergillus 속, 파툴린과 루브라톡신은 Penicillium 속이 생산하는 독소이다."},{"id":"44-2-61","r":44,"p":2,"n":61,"s":"식품위생학","q":"발생 또는 유행 즉시 신고해야 하는 감염병은?","o":["콜레라","A형간염","장티푸스","디프테리아","세균성이질"],"a":4,"e":"디프테리아는 「감염병의 예방 및 관리에 관한 법률」상 제1급감염병으로 발생 또는 유행 즉시 신고해야 한다. 콜레라, 장티푸스, 세균성이질, A형간염은 제2급감염병으로 24시간 이내에 신고한다."},{"id":"44-2-62","r":44,"p":2,"n":62,"s":"식품위생학","q":"다음의 설명에 해당하는 경구감염병은?","o":["콜레라","폴리오","B형간염","세균성이질","파라티푸스"],"a":4,"b":"• 원인균이 Shigella dysenteriae이다.\n• 38~39℃의 고열을 일으키며 변에 혈액과 고름이 섞여 나온다.","e":"세균성이질은 Shigella dysenteriae 등이 원인으로, 적은 균수로도 감염되며 38~39℃의 고열과 혈액·고름이 섞인 점액혈변(이급후중)이 특징이다. 콜레라는 발열이 거의 없이 쌀뜨물 같은 설사를 하며, B형간염은 혈액·체액으로 전파되어 경구감염병이 아니다."},{"id":"44-2-63","r":44,"p":2,"n":63,"s":"식품위생학","q":"바이러스성 경구감염병은?","o":["성홍열","콜레라","장티푸스","브루셀라증","유행성 간염"],"a":5,"e":"유행성 간염(A형간염)은 A형간염 바이러스가 분변-경구 경로로 전파되는 바이러스성 경구감염병이다. 콜레라와 장티푸스는 세균성 경구감염병이고, 성홍열은 용혈성 연쇄상구균에 의한 호흡기 감염병, 브루셀라증은 세균성 인수공통감염병이다."},{"id":"44-2-64","r":44,"p":2,"n":64,"s":"식품위생학","q":"장티푸스의 원인균은?","o":["Salmonella Typhi","Staphylococcus aureus","Listeria monocytogenes","Vibrio parahaemolyticus","Pseudomonas fluorescens"],"a":1,"e":"장티푸스는 Salmonella Typhi가 원인이며 고열, 장미진, 비장 비대가 특징이고 보균자 관리가 중요하다. Vibrio parahaemolyticus는 장염비브리오 식중독, Listeria monocytogenes는 리스테리아증의 원인균이다."},{"id":"44-2-65","r":44,"p":2,"n":65,"s":"식품위생학","q":"인수공통감염병은?","o":["결핵","이질","콜레라","장티푸스","급성회백수염"],"a":1,"e":"결핵은 소(우형결핵균) 등 동물과 사람이 함께 감염되는 인수공통감염병으로, 살균되지 않은 우유 등을 통해 전파될 수 있다. 이질, 콜레라, 장티푸스, 급성회백수염(폴리오)은 주로 사람 사이에서 전파되는 경구감염병이다."},{"id":"44-2-66","r":44,"p":2,"n":66,"s":"식품위생학","q":"다음의 설명에 해당하는 기생충은?","o":["요충","편충","회충","무구조충","십이지장충"],"a":5,"b":"• 채소류를 통하여 감염된다.\n• 경구와 경피를 통하여 감염된다.\n• 경구감염으로 채독증(菜毒症)을 일으킨다.","e":"십이지장충(구충)은 채소를 통해 경구감염되거나 피낭유충이 피부를 뚫고 경피감염되며, 경구감염 시 채독증을, 성충은 흡혈로 빈혈을 일으킨다. 회충은 경구감염만 하고, 요충은 항문 주위 산란으로 인한 소양증과 집단감염이 특징이다."},{"id":"44-2-67","r":44,"p":2,"n":67,"s":"식품위생학","q":"육류의 섭취로 감염될 수 있는 기생충은?","o":["회충","요충","편충","선모충","동양모양선충"],"a":4,"e":"선모충은 덜 익힌 돼지고기 등 육류를 통해 감염되는 기생충이다. 회충, 요충, 편충, 동양모양선충은 오염된 채소나 손 등을 통해 감염되는 채소매개 기생충이다."},{"id":"44-2-68","r":44,"p":2,"n":68,"s":"식품위생학","q":"광절열두조충의 제1중간숙주는?","o":["가재","참게","개구리","담수어","물벼룩"],"a":5,"e":"광절열두조충은 제1중간숙주가 물벼룩, 제2중간숙주가 송어·연어 등 담수어(반담수어)이다. 가재와 참게는 폐흡충의 제2중간숙주이며, 담수어를 제1중간숙주로 착각하지 않도록 주의한다."},{"id":"44-2-69","r":44,"p":2,"n":69,"s":"식품위생학","q":"식품의 기호성을 향상시키기 위해 사용하는 식품첨가물은?","o":["감미료","보존료","소포제","추출제","피막제"],"a":1,"e":"감미료는 조미료, 산미료, 착향료, 착색료 등과 함께 식품의 맛을 개선하여 기호성을 향상시키는 첨가물이다. 보존료는 미생물에 의한 변질을 막아 보존성을 높이고, 소포제와 추출제는 제조·가공 공정에 필요한 첨가물, 피막제는 과일 표면에 막을 형성해 신선도를 유지하는 첨가물이다."},{"id":"44-2-70","r":44,"p":2,"n":70,"s":"식품위생학","q":"보존료로 사용되는 식품첨가물은?","o":["아질산나트륨","초산비닐수지","프로피온산나트륨","글리세린지방산에스테르","카복시메틸셀룰로스칼슘"],"a":3,"e":"프로피온산나트륨은 빵·과자류 등에 사용되는 보존료로, 곰팡이 억제에 효과가 있다. 아질산나트륨은 주 용도가 육제품의 발색제이며, 초산비닐수지는 피막제·껌기초제, 글리세린지방산에스테르는 유화제, 카복시메틸셀룰로스칼슘은 증점제 용도로 쓰인다."},{"id":"44-2-71","r":44,"p":2,"n":71,"s":"식품위생학","q":"식품의 형태를 유지하기 위해 원료가 용기에 붙는 것을 방지하여 분리하기 쉽도록 하는 식품첨가물은?","o":["강화제","이형제","유화제","발색제","팽창제"],"a":2,"e":"이형제는 빵 반죽 등이 틀(용기)에 달라붙지 않도록 하여 쉽게 분리되게 하고 식품의 형태를 유지시키는 첨가물로, 유동파라핀이 대표적이다. 유화제는 물과 기름을 균일하게 섞어주고, 팽창제는 빵·과자를 부풀게 하는 첨가물이다."},{"id":"44-2-72","r":44,"p":2,"n":72,"s":"식품위생학","q":"밀가루 개량제로 옳은 것은?","o":["과산화수소","안식향산나트륨","차아염소산나트륨","과산화벤조일(희석)","데히드로초산나트륨"],"a":4,"e":"밀가루 개량제는 밀가루의 표백과 숙성 기간 단축, 제빵 효과 향상을 위해 쓰이며 과산화벤조일(희석), 과황산암모늄, 이산화염소 등이 있다. 안식향산나트륨과 데히드로초산나트륨은 보존료, 차아염소산나트륨과 과산화수소는 살균제이다."},{"id":"44-2-73","r":44,"p":2,"n":73,"s":"식품위생학","q":"유전자변형식품을 개발하는 방법은?","o":["스와브법","이온교환법","발광분광법","아그로박테리움법","크로마토그래피법"],"a":4,"e":"아그로박테리움법은 식물에 감염하는 Agrobacterium tumefaciens의 Ti 플라스미드를 운반체로 이용해 원하는 유전자를 식물 세포에 삽입하는 대표적인 유전자변형 방법이다(그 밖에 유전자총법 등). 스와브법은 표면 미생물 검사법이고, 크로마토그래피법·이온교환법·발광분광법은 물질의 분리·분석 방법이다."},{"id":"44-2-74","r":44,"p":2,"n":74,"s":"식품위생학","q":"식품안전관리인증기준(HACCP)의 7원칙 중 다음의 설명에 해당하는 것은?","o":["한계기준 설정","중요관리점 결정","개선조치방법 수립","모니터링 체계 확립","검증절차 및 방법 수립"],"a":3,"b":"• 기기 고장 시 즉시 작업 중단 및 수리를 의뢰한다.\n• 가열 온도 및 시간 이탈 시 해당 제품을 즉시 재가열한다.\n• 이탈에 대한 원인 규명 및 재발을 방지하기 위한 방법을 결정한다.","e":"개선조치방법 수립은 모니터링 결과 중요관리점이 한계기준을 이탈했을 때 취할 조치(작업 중단·수리, 재가열, 원인 규명과 재발 방지)를 미리 정하는 단계이다. 모니터링 체계 확립은 한계기준 준수 여부를 측정·관찰하는 단계이고, 검증절차 수립은 HACCP 계획 전체가 제대로 작동하는지 확인하는 단계이다."},{"id":"44-2-75","r":44,"p":2,"n":75,"s":"식품위생학","q":"식품안전관리인증기준(HACCP)에서 화학적 위해요소는?","o":["기생충","유리조각","살균소독제","살모넬라균","간염바이러스"],"a":3,"e":"HACCP에서 화학적 위해요소는 잔류 살균소독제, 농약, 중금속, 항생물질, 허용되지 않은 첨가물 등이다. 기생충, 살모넬라균, 간염바이러스는 생물학적 위해요소이고, 유리조각은 물리적 위해요소이다."},{"id":"44-3-1","r":44,"p":3,"n":1,"s":"실기시험","q":"(사진 1) 사진의 장비로 측정하는 온열인자는?","o":["기류","기습","기압","냉각열","복사열"],"a":2,"e":"사진: 아스만 통풍건습계 — 금속관에 싸인 건구·습구 온도계 2개와 상단의 통풍 팬(태엽·전동)이 특징이다. 건구와 습구 온도의 차이로 상대습도, 곧 기습을 구한다. 기류는 카타온도계나 풍속계로, 복사열은 흑구온도계로 측정한다.","ph":["s39"],"m":"사진"},{"id":"44-3-2","r":44,"p":3,"n":2,"s":"실기시험","q":"톰(E.C. Thom) 등이 고안한 불쾌지수(discomfort index) 계산식에 필요한 것만으로 묶은 것은?","o":["기류, 건구온도","기압, 상대습도","복사열, 습구온도","습구온도, 건구온도","절대습도, 상대습도"],"a":4,"e":"톰의 불쾌지수는 건구온도와 습구온도만으로 계산한다(DI = (건구온도 + 습구온도) × 0.72 + 40.6, ℃ 기준). 기류는 감각온도 산출에는 쓰지만 불쾌지수 식에는 들어가지 않는다. 복사열이나 기압도 이 식과는 관계없다."},{"id":"44-3-3","r":44,"p":3,"n":3,"s":"실기시험","q":"(사진 2) 사진의 기기를 사용하여 미세먼지(PM₁₀)를 측정하는 방법은?","o":["광산란법","광투과법","베타선법","고용량 공기포집법","저용량 공기포집법"],"a":5,"e":"사진: 공기 포집기 — 흡인 펌프와 유량계에 작은 원형 여과지 홀더가 달린 시료 채취 장비이다. 저용량 공기포집법은 분립장치로 PM10을 걸러 낸 공기를 일정 유량으로 흡인해 여과지에 포집하고, 포집 전후의 여과지 무게 차이로 질량농도를 구하는 중량법이다. 고용량 공기포집법은 큰 직사각형 여과지와 대유량 흡인을 쓰는 장비이고, 베타선법은 포집된 먼지에 베타선을 쬐어 흡수량을 재는 자동측정법이다. ※ 교재 확인 권장","ph":["s40"],"m":"사진"},{"id":"44-3-4","r":44,"p":3,"n":4,"s":"실기시험","q":"공기 중 입자상 오염물질로, 폐암을 일으키는 것은?","o":["납(Pb)","철(Fe)","망간(Mn)","석면(asbestos)","아연(Zn)"],"a":4,"e":"석면은 섬유상 입자로 폐에 침착해 석면폐, 폐암, 악성 중피종을 일으키는 대표적인 1군 발암물질이다. 납은 빈혈과 신경장애를, 망간은 파킨슨병과 비슷한 신경장애를 주로 일으킨다."},{"id":"44-3-5","r":44,"p":3,"n":5,"s":"실기시험","q":"음이 진행하는 방향과 수직이 되는 단위면적을 단위시간에 통과하는 음 에너지를 나타내는 것은?","o":["변위(displacement)","진폭(amplitude)","파장(wavelength)","주파수(frequency)","음의 세기(sound intensity)"],"a":5,"e":"음의 세기는 음이 진행하는 방향에 수직인 단위면적을 단위시간에 통과하는 음에너지이며, 단위는 W/m²이다. 주파수는 1초 동안의 진동 횟수(Hz)이고, 진폭은 매질 입자가 평형 위치에서 벗어난 거리(변위)의 최댓값이다."},{"id":"44-3-6","r":44,"p":3,"n":6,"s":"실기시험","q":"(사진 3) 손으로 소음계를 잡고 환경소음을 측정할 경우 소음계는 측정자의 몸에서 최소 몇 m 이상 떨어져야 하는가?","o":["0.3 m","0.5 m","0.7 m","0.9 m","1.0 m"],"a":2,"e":"사진: 소음계 — 앞쪽 끝에 마이크로폰이 달리고 몸체에 dB 표시창이 있는 휴대형 측정기이다. 소음·진동공정시험기준에 따라 손으로 소음계를 잡고 측정할 때는 측정자의 몸에서 0.5 m 이상 떨어뜨려 몸에서 반사되는 음의 영향을 줄인다. 측정 높이 1.2~1.5 m와 헷갈리지 않도록 한다.","ph":["s19"],"m":"사진"},{"id":"44-3-7","r":44,"p":3,"n":7,"s":"실기시험","q":"(사진 4) 총부유세균용 배지 멸균에 사용되는, 사진의 고압증기멸균기의 온도는?","o":["81°C","91°C","101°C","111°C","121°C"],"a":5,"e":"사진: 고압증기멸균기(오토클레이브) — 압력계와 안전밸브가 달린 원통형 금속 압력용기로, 뚜껑을 잠그는 구조이다. 배지는 보통 121℃(약 15 lb/in²)에서 15~20분 고압증기로 멸균해 세균 포자까지 사멸시킨다. 101℃처럼 상압의 끓는점 부근 온도로는 포자를 완전히 죽일 수 없다.","ph":["s03"],"m":"사진"},{"id":"44-3-8","r":44,"p":3,"n":8,"s":"실기시험","q":"(사진 5) 사진의 원자흡수분광광도계(AAS)로 측정할 수 있는 항목은?","o":["구리","탁도","페놀","유기인계농약","음이온계면활성제"],"a":1,"e":"사진: 원자흡수분광광도계(AAS) — 중공음극램프, 불꽃(버너)부, 분광부가 연결된 대형 분석기기이다. 시료를 불꽃 속에서 원자화한 뒤 원소 고유의 빛 흡수를 측정하므로 구리, 납, 카드뮴, 아연 같은 금속 분석에 쓴다. 페놀과 음이온계면활성제는 흡광광도법으로, 탁도는 탁도계로 측정한다.","ph":["s41"],"m":"사진"},{"id":"44-3-9","r":44,"p":3,"n":9,"s":"실기시험","q":"화학적 폐수처리방법은?","o":["부상법","증발법","침강법","살수여상법","이온교환법"],"a":5,"e":"이온교환법은 이온교환수지가 폐수 속 이온(중금속 등)을 화학적으로 교환·제거하는 화학적 처리법이다. 부상, 침강, 증발은 물리적 처리법이다. 살수여상법은 미생물 막을 이용하는 생물학적 처리법이다."},{"id":"44-3-10","r":44,"p":3,"n":10,"s":"실기시험","q":"먹는물의 저온일반세균 측정에서 즉시 시험할 수 없는 시료를 보관할 때의 온도와 최대 보존 시간으로 옳은 것은?","o":["4℃, 24시간","8℃, 18시간","12℃, 12시간","16℃, 6시간","20℃, 3시간"],"a":1,"e":"먹는물 미생물 시료는 채취 후 즉시 시험하는 것이 원칙이며, 그럴 수 없을 때는 4℃ 냉장 상태로 보관해 24시간 이내에 시험한다. 보관 온도가 이보다 높거나(8~20℃) 보존 시간이 다르면 세균이 늘거나 줄어 결과가 왜곡되므로 공정시험기준에 맞지 않는다."},{"id":"44-3-11","r":44,"p":3,"n":11,"s":"실기시험","q":"(사진 6) 사진의 경도측정기로 측정하는 경도의 단위는?","o":["cm/m³","mg/L","mS/L","mV/m","μL/m²"],"a":2,"e":"사진: 경도 측정 — 시료에 지시약과 시약을 넣어 색 변화로 판정하는 키트(EDTA 적정)나 휴대용 측정기 형태이다. 경도는 칼슘과 마그네슘 이온의 양을 탄산칼슘(CaCO₃)으로 환산해 mg/L로 나타내며, 먹는물 기준은 300 mg/L 이하이다. 전기전도도는 μS/cm·mS/cm 단위를, 산화환원전위는 mV 단위를 쓴다.","ph":["s42"],"m":"사진"},{"id":"44-3-12","r":44,"p":3,"n":12,"s":"실기시험","q":"「먹는물의 수질기준」 중 심미적 영향물질은?","o":["냄새","불소","수은","시안","크롬"],"a":1,"e":"「먹는물 수질기준」에서 냄새는 맛, 색도, 탁도, 경도, 철, 망간 등과 함께 심미적 영향물질에 속한다. 불소, 수은, 시안, 크롬은 건강상 유해영향 무기물질로 분류된다."},{"id":"44-3-13","r":44,"p":3,"n":13,"s":"실기시험","q":"하천수의 용존산소를 적정법으로 측정할 때 종말점에서의 색상 변화는?","o":["녹색 → 청색","무색 → 홍색","청색 → 무색","청색 → 홍색","청색 → 황색"],"a":3,"e":"용존산소를 적정법(윙클러법 변법)으로 측정할 때는 유리된 요오드를 티오황산나트륨으로 적정하며, 전분 지시약을 넣어 생긴 청색이 사라져 무색이 되는 점이 종말점이다. 무색에서 홍색으로 바뀌는 것은 페놀프탈레인 지시약을 쓰는 적정의 색 변화이다."},{"id":"44-3-14","r":44,"p":3,"n":14,"s":"실기시험","q":"그림의 기구로 채취하는 시료는?","o":["물(water)","공기(air)","먼지(dust)","식품(food)","토양(soil)"],"a":1,"e":"사진: 채수기 — 줄에 매달아 원하는 수심까지 내린 뒤 양 끝 마개를 닫아 물을 가두는 원통형 기구이다. 수심별로 하천수, 호소수 같은 물 시료를 채취하는 데 쓴다. 공기 시료는 공기 포집기나 임핀저로, 토양 시료는 토양 채취기(오거)로 채취한다.","ph":["s43"],"m":"그림"},{"id":"44-3-15","r":44,"p":3,"n":15,"s":"실기시험","q":"다음의 (   ) 안에 해당하는 것은?","o":["감마선","방사선","엑스선","자외선","적외선"],"a":4,"b":"집단급식소 조리장에는 주방용 식기류를 소독하기 위한 (   ) 또는 전기살균 소독기를 설치하거나 열탕 세척 소독시설을 갖추어야 한다.","e":"식품위생법령의 집단급식소 시설기준에 따르면 조리장에는 주방용 식기류를 소독하기 위한 자외선 또는 전기살균 소독기를 설치하거나 열탕 세척 소독시설을 갖추어야 한다. 감마선이나 엑스선 같은 방사선은 식품 조사 처리에 쓰는 것으로, 식기 소독시설 기준에는 해당하지 않는다."},{"id":"44-3-16","r":44,"p":3,"n":16,"s":"실기시험","q":"식품의 부패 판정법 중 화학적 검사법은?","o":["관능검사","탄성측정","점성측정","세균수검사","수소이온농도(pH)측정"],"a":5,"e":"pH 측정은 휘발성염기질소나 트리메틸아민 측정과 함께 부패 정도를 판정하는 화학적 검사법이다. 관능검사는 감각에 의한 검사이고, 탄성·점성 측정은 물리적 검사이다. 세균수 검사는 미생물학적 검사이다."},{"id":"44-3-17","r":44,"p":3,"n":17,"s":"실기시험","q":"해산어류의 부패로 생성되는 것은?","o":["타우린","헥사날","헤모글로빈","트리메틸아민","글루탐산나트륨"],"a":4,"e":"해산어류에 들어 있는 트리메틸아민옥사이드(TMAO)가 세균에 의해 환원되면 비린내 나는 트리메틸아민(TMA)이 생기며, 이 물질은 어류 신선도와 부패의 지표로 쓰인다. 타우린은 어패류의 정상 성분이고, 헥사날은 지방이 산패할 때 생기는 알데히드이다."},{"id":"44-3-18","r":44,"p":3,"n":18,"s":"실기시험","q":"식품안전관리인증기준(HACCP)의 7원칙 중 제1원칙은?","o":["위해요소 분석","한계기준 설정","중요관리점 결정","개선조치 방법 수립","모니터링 체계 확립"],"a":1,"e":"HACCP 7원칙은 위해요소 분석, 중요관리점 결정, 한계기준 설정, 모니터링 체계 확립, 개선조치 방법 수립, 검증 절차 수립, 문서화·기록 유지 순서이며, 제1원칙은 위해요소 분석이다. 중요관리점 결정은 제2원칙이고, 한계기준 설정은 제3원칙이다."},{"id":"44-3-19","r":44,"p":3,"n":19,"s":"실기시험","q":"비가열 멸균법에 해당하는 것은?","o":["간헐멸균","건열멸균","화염멸균","고압증기멸균","방사선조사멸균"],"a":5,"e":"방사선조사멸균은 코발트-60의 감마선 등으로 미생물을 죽이는 비가열(냉) 멸균법이다. 간헐멸균은 100℃ 증기를 하루 1회씩 3일 반복하는 방법이고, 건열·화염·고압증기멸균도 모두 열을 이용하는 가열 멸균법이다."},{"id":"44-3-20","r":44,"p":3,"n":20,"s":"실기시험","q":"피펫 등 유리 기구의 멸균에 사용되는 방법은?","o":["건열멸균법","저온살균법","자외선멸균법","고온단시간살균법","초고온순간살균법"],"a":1,"e":"건열멸균법은 건열멸균기에서 160~170℃로 1~2시간 가열하는 방법으로, 습기에 약하지 않은 피펫, 페트리접시 같은 유리기구와 금속기구 멸균에 쓴다. 자외선멸균은 투과력이 약해 표면 살균에만 쓰인다. 저온살균과 고온단시간살균은 우유 같은 식품의 살균법이다."},{"id":"44-3-21","r":44,"p":3,"n":21,"s":"실기시험","q":"우유의 저온살균(pasteurization)에 적절한 온도와 시간은?","o":["63℃, 30분","75℃, 15분","100℃, 10분","121℃, 5분","135℃, 15초"],"a":1,"e":"우유의 저온장시간살균(LTLT)은 63~65℃에서 30분 동안 가열해 결핵균 등 병원균을 죽이면서 영양과 풍미 손실을 줄이는 방법이다. 고온단시간살균은 72~75℃에서 15~20초이므로 75℃·15분은 맞지 않다. 초고온순간살균은 130~150℃에서 수 초간 가열한다."},{"id":"44-3-22","r":44,"p":3,"n":22,"s":"실기시험","q":"살모넬라균의 그람염색 결과 나타나는 색은?","o":["무색","자색","적색","청색","흑색"],"a":3,"e":"살모넬라균은 그람음성 간균이어서 탈색 단계에서 크리스탈바이올렛이 빠지고 사프라닌 대조염색으로 적색(분홍색)을 띤다. 자색은 크리스탈바이올렛-요오드 복합체가 남는 그람양성균(예: 황색포도상구균)의 색이다."},{"id":"44-3-23","r":44,"p":3,"n":23,"s":"실기시험","q":"(사진 7) 사진의 식중독균이 생산하는 독소는?","o":["베로톡신(verotoxin)","베네루핀(venerupin)","뉴로톡신(neurotoxin)","엔테로톡신(enterotoxin)","테트로도톡신(tetrodotoxin)"],"a":4,"e":"사진: 황색포도상구균 — 구균이 포도송이처럼 불규칙하게 뭉쳐 있고 그람염색에서 자색을 띤다. 이 균은 내열성 장독소인 엔테로톡신을 만들어 독소형 식중독을 일으키며, 이 독소는 100℃에서 30분 가열해도 쉽게 파괴되지 않는다. 베로톡신은 장출혈성대장균의 독소이고, 테트로도톡신은 복어독이다.","ph":["s05"],"m":"사진"},{"id":"44-3-24","r":44,"p":3,"n":24,"s":"실기시험","q":"다음에서 설명하는 식중독균은?","o":["Bacillus cereus","Morganella morganii","Campylobacter jejuni","Clostridium botulinum","Listeria monocytogenes"],"a":4,"b":"• 그람양성 간균이며, 편성혐기성균이다.\n• 내열성 포자를 형성하고 신경독소를 생산한다.\n• 통조림 제품과 관련된 식중독의 원인균이다.","e":"클로스트리디움 보툴리눔은 그람양성의 편성혐기성 간균이다. 내열성 포자를 형성하고 신경독소를 생산하며, 산소가 차단된 통조림, 병조림, 소시지 등이 주요 원인식품이다. 바실루스 세레우스도 그람양성 포자형성균이지만 통성혐기성이고, 신경독이 아닌 구토형·설사형 독소를 만든다. 리스테리아 모노사이토제네스는 포자를 만들지 않는다."},{"id":"44-3-25","r":44,"p":3,"n":25,"s":"실기시험","q":"쇠고기를 생식했을 때 감염될 수 있는 그림의 기생충은?","o":["간흡충","폐흡충","무구조충","유구조충","요코가와흡충"],"a":3,"e":"사진: 무구조충(민촌충) — 머리(두절)에 갈고리 없이 흡반 4개만 있고, 편절의 자궁 측지가 15~30개로 많은 긴 촌충이다. 덜 익힌 쇠고기 속 낭미충을 먹어 감염된다. 유구조충은 돼지고기로 감염되며 두절에 갈고리가 있다.","ph":["s44"],"m":"그림"},{"id":"44-3-26","r":44,"p":3,"n":26,"s":"실기시험","q":"(사진 8) 생활사가 사진과 같은 기생충은?","o":["간흡충","폐흡충","아니사키스","광절열두조충","요코가와흡충"],"a":2,"e":"사진: 폐흡충 생활사 — 충란에서 제1중간숙주인 다슬기를 거쳐 제2중간숙주인 민물 가재·게로 이어지고, 사람의 폐에 기생하는 순환 그림이다. 가재나 게를 날로 먹거나 덜 익혀 먹으면 감염된다. 간흡충은 쇠우렁이와 민물고기를, 요코가와흡충은 다슬기와 은어를 거친다.","ph":["s45"],"m":"사진"},{"id":"44-3-27","r":44,"p":3,"n":27,"s":"실기시험","q":"(사진 9) 사진의 미생물이 병원체인 경구감염병은?","o":["이질","콜레라","폴리오","장티푸스","파라티푸스"],"a":2,"e":"사진: 콜레라균 — 쉼표(콤마) 모양으로 약간 휜 그람음성 간균이며, 한쪽 끝에 편모가 1개(단모성) 있다. 오염된 물이나 어패류로 감염되어 쌀뜨물 같은 설사를 일으키는 경구감염병의 병원체이다. 이질균은 편모가 없고, 장티푸스균은 주모성 편모를 가진 간균이다. 폴리오는 바이러스 질환이다.","ph":["s46"],"m":"사진"},{"id":"44-3-28","r":44,"p":3,"n":28,"s":"실기시험","q":"가축 사육 중 인체의 피부 상처, 호흡기 등으로 침입하는 아포(spore)형성 균은?","o":["결핵균","탄저균","돈단독균","브루셀라균","병원성 대장균"],"a":2,"e":"탄저균은 아포를 형성하는 그람양성 대형 간균으로, 소·양 등 가축과 접촉할 때 피부 상처(피부탄저)나 호흡기(폐탄저)를 통해 사람에게 침입하는 인수공통감염병의 원인균이다. 브루셀라균, 결핵균, 돈단독균은 인수공통감염병의 원인균이지만 아포를 만들지 않는다."},{"id":"44-3-29","r":44,"p":3,"n":29,"s":"실기시험","q":"다음 위생곤충의 촉각 형태는?","o":["두상","편상","곤봉상","새엽상","즐치상"],"a":2,"e":"예측 그림: 바퀴 — 몸길이만큼 긴 촉각이 가늘고 짧은 마디로 이어져 끝으로 갈수록 가늘어지는 채찍 모양이라 편상(鞭狀) 촉각이다. 새엽상은 끝마디들이 판 모양으로 겹친 풍뎅이류, 즐치상은 마디마다 빗살 같은 돌기가 난 형태, 곤봉상은 끝으로 갈수록 굵어지는 형태, 두상은 끝마디가 공처럼 둥글게 커진 형태다. ※ 실제 그림은 비공개라 바퀴로 추정함","pr":1,"ph":["g:antenna","g:antenna_sol","s74"],"m":"그림"},{"id":"44-3-30","r":44,"p":3,"n":30,"s":"실기시험","q":"그림의 각 지점(○로 표시한 부분)에서 군무를 추며, 암컷을 유인하여 교미하는 습성이 있는 위생곤충은?","o":["나방","말벌","모기","딸집파리","체체파리"],"a":3,"e":"사진: 모기 군무 — 나무 끝, 건물 모서리, 사람 머리 위 같은 눈에 띄는 표지물 위에서 수컷이 기둥 모양으로 무리 지어 나는 모습이다. 수컷 모기는 이런 곳에서 군무를 추고, 그 속으로 날아든 암컷과 교미한다. 체체파리는 아프리카수면병을 매개하는 흡혈 파리로, 이런 군무 습성으로 출제되지 않는다.","ph":["s47"],"m":"그림"},{"id":"44-3-31","r":44,"p":3,"n":31,"s":"실기시험","q":"(사진 10) 뎅기열(dengue fever)을 매개하는, 사진의 모기는?","o":["금빛숲모기","빨간집모기","흰줄숲모기","작은빨간집모기","중국얼룩날개모기"],"a":3,"e":"사진: 흰줄숲모기 — 검은 몸의 가슴 등판 가운데에 흰 세로줄이 1개 있고, 다리에 흰 띠가 있다. 뎅기열, 지카바이러스감염증, 치쿤구니야열을 매개하며 낮에 흡혈한다. 작은빨간집모기는 일본뇌염을, 중국얼룩날개모기는 말라리아를 매개한다.","ph":["s48"],"m":"사진"},{"id":"44-3-32","r":44,"p":3,"n":32,"s":"실기시험","q":"(사진 11) 사진에서 욕반(pulvillus)이 있는 위치는?","o":["A","B","C","D","E"],"a":4,"e":"사진: 파리 다리 끝 — 발목마디 맨 끝에 발톱 1쌍이 있고, 그 아래에 샘털이 빽빽한 패드 모양의 욕반 1쌍이 붙어 있다. 욕반에서 끈적한 분비물이 나와 매끈한 면에도 붙을 수 있으며, 여기에 병원체가 묻어 기계적 전파가 일어난다. 따라서 사진에서는 발톱 바로 아래 패드 부분인 D가 욕반이다. 발톱과 욕반 사이의 털 모양 조간반과 헷갈리지 않도록 한다. ※ 교재 확인 권장","ns":1,"ph":["s49","g:pulvillus"],"m":"사진"},{"id":"44-3-33","r":44,"p":3,"n":33,"s":"실기시험","q":"(사진 12) 사람에게 2차적 세균 감염을 일으키는, 사진의 위생곤충은?","o":["몸이","빈대","머릿니","진드기","사면발이"],"a":5,"e":"사진: 사면발이 — 몸이 짧고 폭이 넓은 게 모양이며, 가운데다리와 뒷다리의 발톱이 굵다. 주로 음모에 기생하며, 가려워서 긁은 상처로 2차 세균감염이 생긴다. 몸이는 몸이 길쭉하고 발진티푸스, 참호열, 재귀열을 매개한다. 빈대는 날개 없는 납작한 적갈색 타원형이다.","ph":["s32"],"m":"사진"},{"id":"44-3-34","r":44,"p":3,"n":34,"s":"실기시험","q":"그림으로 제시한 알(egg)의 성충은?","o":["이","바퀴","벼룩","빈대","진드기"],"a":4,"e":"사진: 빈대 알 — 길이 약 1 mm의 유백색 긴 타원형으로, 한쪽 끝에 뚜껑(난개)이 있고 침대 이음새나 매트리스 틈에 붙여 낳는다. 이 알에서 깨어난 빈대는 성충이 되어 사람을 흡혈한다. 이의 알(서캐)은 머리카락이나 옷 섬유에 단단히 붙어 있다. 바퀴는 알을 알주머니(난협) 속에 넣어 낳는다.","ph":["s33e"],"m":"그림"},{"id":"44-3-35","r":44,"p":3,"n":35,"s":"실기시험","q":"(사진 13) 쥐구멍과 그 주변에 살충제를 잔류분무하며, 살서제를 이용하여 구제하는 숙주와 관련된, 사진의 위생곤충은?","o":["몸이","벼룩","빈대","진드기","쥐며느리"],"a":2,"e":"사진: 열대쥐벼룩 — 좌우로 납작한 몸에 날개가 없고, 뒷다리가 발달했으며 협즐치와 전흉즐치가 없다. 페스트와 발진열을 매개하는 쥐벼룩은 숙주인 쥐가 죽으면 사람에게 옮겨 가므로, 쥐구멍 주변에 살충제를 잔류분무해 벼룩을 먼저 없앤 뒤 살서제로 쥐를 구제한다. 진드기는 다리가 4쌍인 거미강이고, 쥐며느리는 갑각류이다.","ph":["s50"],"m":"사진"},{"id":"44-3-36","r":44,"p":3,"n":36,"s":"실기시험","q":"(사진 14) 다음 중 독나방의 성충은?","o":["가","나","다","라","마"],"a":5,"e":"사진: 독나방 — 성충은 전체가 노란색이고 앞날개에 갈색 띠가 있으며, 유충은 독모가 빽빽한 털벌레이다. 유충의 독모가 고치를 거쳐 성충 몸에 붙어 있다가 피부에 닿으면 피부염을 일으킨다. 성충은 7~8월에 불빛에 잘 모여든다. 따라서 보기 사진 중 이런 노란 날개 특징을 가진 것이 독나방 성충인 마이다. ※ 교재 확인 권장","ns":1,"ph":["s35"],"m":"사진"},{"id":"44-3-37","r":44,"p":3,"n":37,"s":"실기시험","q":"(사진 15) 사진에 제시된 개미의 방제법은?","o":["훈증법","도포제법","독먹이법","끈끈이트랩","잔류분무법"],"a":3,"e":"사진: 애집개미 — 몸길이 2 mm 정도의 작은 황갈색 개미로, 건물 안 벽 틈이나 주방에 군체를 이룬다. 일개미가 먹이를 둥지로 날라 여왕개미와 유충까지 죽게 하는 독먹이법(베이트)이 효과적이다. 잔류분무법은 일개미만 죽이고 군체가 흩어져 오히려 퍼질 수 있어 적합하지 않다.","ph":["s51"],"m":"사진"},{"id":"44-3-38","r":44,"p":3,"n":38,"s":"실기시험","q":"(사진 16) 사진의 진드기가 속하는 분류군은?","o":["무기문아목","이기문아목","전기문아목","중기문아목","후기문아목"],"a":5,"e":"사진: 참진드기 — 몸이 비교적 크고 등판(순판)이 있으며, 입틀이 몸 앞쪽으로 돌출하고 흡혈하면 크게 부푼다. 참진드기는 기문이 넷째 다리 뒤쪽에 있는 후기문아목에 속하며, 작은소피참진드기는 중증열성혈소판감소증후군(SFTS)을 매개한다. 털진드기(쯔쯔가무시증 매개)는 전기문아목, 집진드기·쥐진드기는 중기문아목이다.","ph":["s52"],"m":"사진"},{"id":"44-3-39","r":44,"p":3,"n":39,"s":"실기시험","q":"(사진 17) 다음에서 설명하는 쥐는?","o":["곰쥐","생쥐","갈밭쥐","등줄쥐","시궁쥐"],"a":5,"b":"• 성체는 체중이 400 ~ 500 g 정도이다.\n• 꼬리의 길이가 두동장보다 짧거나 두동장과 같다.\n• 귀와 눈이 몸집에 비해 작다.\n• 창고 바닥이나 부엌 바닥에 주로 서식한다.","e":"사진: 시궁쥐 — 몸집이 크고 주둥이가 뭉툭하며 귀와 눈이 작고, 꼬리가 굵고 몸통(두동장)보다 짧거나 같다. 체중 400~500 g의 대형 쥐로 하수구, 창고·부엌 바닥에 굴을 파고 산다. 곰쥐는 꼬리가 두동장보다 길고 귀가 커서 천장 같은 높은 곳에 살고, 생쥐는 체중 10~20 g의 소형이다.","ph":["s15"],"m":"사진"},{"id":"44-3-40","r":44,"p":3,"n":40,"s":"실기시험","q":"(사진 18) 사진의 방제법은?","o":["도포법","분무법","훈연법","미스트법","분제살포법"],"a":3,"e":"사진: 훈연제 — 캔 같은 용기에서 흰 연기가 피어오르며 밀폐된 실내로 퍼지는 장면이다. 훈연법은 살충제를 열로 연기 입자로 만들어 밀폐 공간 구석구석까지 확산시켜 바퀴 같은 해충을 구제하는 방법이다. 미스트법은 액체 살충제를 미세한 물방울로 분사하고, 분무법은 액체를 비교적 큰 입자로 뿌린다.","ph":["s53","g:smoke"],"m":"사진"},{"id":"45-1-1","r":45,"p":1,"n":1,"s":"위생관계법령","q":"「공중위생관리법」상 (   )에 들어갈 용어로 옳게 묶인 것은?","o":["식품운반업–세탁업–목욕장업","폐기물처리업–목욕장업–세탁업","소독업–건물위생관리업–세탁업","목욕장업–세탁업–건물위생관리업","먹는물관련영업–건물위생관리업–목욕장업"],"a":4,"b":"“공중위생영업”이라 함은 다수인을 대상으로 위생관리서비스를 제공하는 영업으로서 숙박업·(   )·이용업·미용업·(   )·(   )을 말한다.","e":"「공중위생관리법」상 공중위생영업은 숙박업·목욕장업·이용업·미용업·세탁업·건물위생관리업의 6가지이므로 빈칸에는 차례로 목욕장업, 세탁업, 건물위생관리업이 들어간다. 소독업은 감염병예방법, 식품운반업은 식품위생법, 폐기물처리업은 폐기물관리법, 먹는물관련영업은 먹는물관리법에서 다루는 영업이라 공중위생영업이 아니다."},{"id":"45-1-2","r":45,"p":1,"n":2,"s":"위생관계법령","q":"「공중위생관리법」상 공중위생감시원의 업무범위가 <u>아닌</u> 것은?","o":["위생교육 이행여부의 확인","위생지도 및 개선명령 이행여부의 확인","공중위생영업의 종류별 시설 및 설비의 확인","공중위생관리법의 위반행위에 대한 신고 및 자료 제공","공중위생영업 관련 시설 및 설비의 위생상태 확인·검사"],"a":4,"e":"공중위생감시원은 시설·설비 확인, 위생상태 확인·검사, 위생지도 및 개선명령 이행여부 확인, 영업정지 등 처분 이행여부 확인, 위생교육 이행여부 확인 같은 행정 점검을 맡는다. ‘위반행위에 대한 신고 및 자료 제공’은 민간인이 위촉되는 명예공중위생감시원의 업무라서 공중위생감시원의 업무가 아니다."},{"id":"45-1-3","r":45,"p":1,"n":3,"s":"위생관계법령","q":"「공중위생관리법」상 위생사가 면허증을 대여했을 때 보건복지부장관이 하는 행정처분은?","o":["영업정지","면허취소","취업금지","벌금부과","과징금처분"],"a":2,"e":"「공중위생관리법」상 보건복지부장관은 위생사가 면허증을 다른 사람에게 대여한 경우 그 면허를 취소한다. 영업정지와 과징금처분은 영업자에게 내리는 처분이고, 벌금은 행정처분이 아니라 형사처벌이므로 오답이다."},{"id":"45-1-4","r":45,"p":1,"n":4,"s":"위생관계법령","q":"「공중위생관리법」상 위생관리등급을 공중위생영업자에게 통보하고 이를 공표하는 자는?","o":["환경부장관","질병관리청장","보건복지부장관","시장·군수·구청장","식품의약품안전처장"],"a":4,"e":"시장·군수·구청장은 위생서비스평가 결과에 따른 위생관리등급을 해당 공중위생영업자에게 통보하고 공표한다. 시·도지사는 위생서비스평가계획을 세우고, 보건복지부장관은 평가 기준 등을 정할 뿐 등급을 직접 통보·공표하지 않는다."},{"id":"45-1-5","r":45,"p":1,"n":5,"s":"위생관계법령","q":"「공중위생관리법」상 목욕장 목욕물의 수질기준 중 원수 몇 mL에서 총대장균군이 검출되지 아니하여야 하는가?","o":["100","150","200","250","300"],"a":1,"e":"목욕장 원수의 수질기준에서 총대장균군은 100mL 중 검출되지 않아야 한다. 이는 먹는물의 총대장균군 기준(100mL 중 불검출)과 같은 단위이므로 함께 외워 두면 좋다. 욕조수 기준(대장균군 1mL 중 1개 이하)과 헷갈리지 않도록 주의한다."},{"id":"45-1-6","r":45,"p":1,"n":6,"s":"위생관계법령","q":"「식품위생법」상 질병에 걸려 죽은 동물의 고기는 판매할 수 없다. 이에 해당하지 <u>않는</u> 질병은?","o":["선모충증","유구조충증","살모넬라병","리스테리아병","파스튜렐라병"],"a":2,"e":"「식품위생법」상 판매 등이 금지되는 병든 동물 고기의 질병은 축산물 위생관리법에 따라 도축이 금지되는 가축전염병과 리스테리아병, 살모넬라병, 파스튜렐라병, 선모충증이다. 유구조충증(갈고리촌충)은 여기에 포함되지 않는다. 선모충증도 기생충 질환이지만 법령에 명시되어 있으므로 헷갈리지 않도록 한다."},{"id":"45-1-7","r":45,"p":1,"n":7,"s":"위생관계법령","q":"「식품위생법」상 식품등을 채취·제조·가공·사용·조리·저장·소분·운반 또는 진열하는 영업자에 대하여 식품전문 시험·검사기관에서 검사 받을 것을 명령할 수 있는 자는?","o":["질병관리청장","특별자치시장","특별자치도지사","식품의약품안전처장","시장·군수·구청장"],"a":4,"e":"식품의약품안전처장은 위해 우려가 있는 식품등을 다루는 영업자에게 식품전문 시험·검사기관 등에서 검사를 받도록 명령(검사명령)할 수 있다. 특별자치시장·특별자치도지사·시장·군수·구청장은 출입·검사·수거 같은 지도·단속 권한을 갖지만 이 검사명령의 주체는 아니다. 질병관리청장은 감염병 관련 기관이라 해당하지 않는다."},{"id":"45-1-8","r":45,"p":1,"n":8,"s":"위생관계법령","q":"「식품위생법」상 식품위생감시원의 자격에 해당하지 <u>않는</u> 것은?","o":["위생사","영양사","식품기사, 식품산업기사","수질환경기사, 수질환경산업기사","수산제조기사, 수산제조산업기사"],"a":4,"e":"식품위생감시원의 자격은 위생사, 영양사, 식품기술사·식품기사·식품산업기사, 수산제조기술사·수산제조기사·수산제조산업기사, 관련 학과 졸업자, 1년 이상 식품위생행정 종사자 등이다. 수질환경기사·수질환경산업기사는 먹는물·수질 분야 자격이라 식품위생감시원 자격에 해당하지 않는다."},{"id":"45-1-9","r":45,"p":1,"n":9,"s":"위생관계법령","q":"「식품위생법」상 식품조사처리업을 허가하는 자는?","o":["특별자치시장","관할 보건소장","특별자치도지사","시장·군수·구청장","식품의약품안전처장"],"a":5,"e":"식품조사처리업(방사선 조사 처리)은 식품의약품안전처장의 허가를 받아야 한다. 단란주점영업과 유흥주점영업은 특별자치시장·특별자치도지사·시장·군수·구청장의 허가 대상이므로 허가권자를 구분해서 외워야 한다. 관할 보건소장은 영업 허가권자가 아니다."},{"id":"45-1-10","r":45,"p":1,"n":10,"s":"위생관계법령","q":"「식품위생법」상 식품위생교육기관 등이 하는 식품위생교육 및 위생관리책임자에 대한 교육 내용으로 옳지 <u>않은</u> 것은?","o":["식품위생","개인위생","학교위생관리","식품위생시책","식품의 품질관리"],"a":3,"e":"식품위생교육 및 위생관리책임자 교육 내용은 식품위생, 개인위생, 식품위생시책, 식품의 품질관리 등이다. 학교위생관리는 학교보건 영역의 내용이라 식품위생교육 내용에 포함되지 않는다."},{"id":"45-1-11","r":45,"p":1,"n":11,"s":"위생관계법령","q":"「식품위생법」상 자가품질검사에 관한 기록서의 보관기간은?","o":["1년","2년","3년","4년","5년"],"a":2,"e":"「식품위생법」상 자가품질검사에 관한 기록서는 2년간 보관해야 한다. 먹는물관리법의 자가품질검사 성적서 보존기간도 2년이라 함께 외우면 편하다."},{"id":"45-1-12","r":45,"p":1,"n":12,"s":"위생관계법령","q":"「식품위생법」상 ‘탄저병’의 질병에 걸린 동물을 사용하여 판매할 목적으로 식품을 제조·가공·수입 또는 조리한 자에 대한 벌칙은?","o":["1년 이상의 징역","2년 이상의 징역","3년 이상의 징역","4년 이상의 징역","5년 이상의 징역"],"a":3,"e":"소해면상뇌증(광우병), 탄저병, 가금 인플루엔자에 걸린 동물을 사용해 판매 목적으로 식품을 제조·가공·수입·조리한 자는 3년 이상의 징역에 처한다. 마황·부자·천오·초오·백부자·섬수·백선피·사리풀 등 위해 원료를 사용한 경우는 1년 이상의 징역이므로 둘을 헷갈리지 않도록 한다."},{"id":"45-1-13","r":45,"p":1,"n":13,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 제2급감염병은?","o":["브루셀라증","발진티푸스","비브리오패혈증","신증후군출혈열","폐렴구균 감염증"],"a":5,"e":"폐렴구균 감염증은 제2급감염병이다. 브루셀라증, 발진티푸스, 비브리오패혈증, 신증후군출혈열은 모두 제3급감염병이라 오답이다."},{"id":"45-1-14","r":45,"p":1,"n":14,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 제3급감염병은?","o":["두창","콜레라","장티푸스","디프테리아","후천성면역결핍증"],"a":5,"e":"후천성면역결핍증(AIDS)은 제3급감염병이다. 두창과 디프테리아는 제1급감염병, 콜레라와 장티푸스는 제2급감염병이다."},{"id":"45-1-15","r":45,"p":1,"n":15,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 보건복지부장관은 내성균 발생 예방 및 확산 방지 등을 위하여 내성균 관리 대책을 몇 년마다 수립·추진하여야 하는가?","o":["1년","2년","3년","4년","5년"],"a":5,"e":"「감염병의 예방 및 관리에 관한 법률」상 보건복지부장관은 감염병관리위원회의 심의를 거쳐 내성균 관리대책을 5년마다 수립·추진해야 한다. 감염병 예방 및 관리에 관한 기본계획도 5년마다 수립하므로 ‘5년’으로 묶어서 외우면 된다."},{"id":"45-1-16","r":45,"p":1,"n":16,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 (   )에 들어갈 것으로 옳게 묶인 것은?","o":["황열, 뎅기열, 공수병","폴리오, 한센병, 성홍열","회충증, 편충증, 요충증","결핵, 콜레라, 파라티푸스","두창, 페스트, 신종인플루엔자"],"a":4,"b":"“그 밖의 신고대상 감염병 중 보건복지부령으로 정하는 감염병”이란 다음의 감염병을 말한다.\n(   ), 홍역, (   ), 장티푸스, (   ), 세균성이질, 장출혈성대장균감염증, A형간염","e":"보건복지부령으로 정하는 그 밖의 신고대상 감염병은 결핵, 홍역, 콜레라, 장티푸스, 파라티푸스, 세균성이질, 장출혈성대장균감염증, A형간염으로, 사람 간 전파 위험이 높은 제2급감염병들이다. 그래서 빈칸에는 결핵, 콜레라, 파라티푸스가 들어간다. 두창·페스트·신종인플루엔자는 제1급, 황열·뎅기열·공수병은 제3급이라 맞지 않는다."},{"id":"45-1-17","r":45,"p":1,"n":17,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 표본감시의 대상이 되는 감염병은?","o":["제1급감염병","제2급감염병","제3급감염병","제4급감염병","생물테러감염병"],"a":4,"e":"표본감시는 지정된 감시기관이 발생 추이를 지속적으로 보고하는 방식으로, 유행 여부 조사가 필요한 제4급감염병이 대상이다. 제1~3급감염병은 발생하면 모든 의사 등이 신고해야 하는 전수감시 대상이라 오답이다."},{"id":"45-1-18","r":45,"p":1,"n":18,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 감염병이 발생하여 유행할 우려가 있다고 인정되면 지체 없이 역학조사를 해야 하는 자는?","o":["보건복지부장관","관할 보건소장","국립환경과학원장","식품의약품안전처장","질병관리청장, 시·도지사 또는 시장·군수·구청장"],"a":5,"e":"감염병이 발생해 유행할 우려가 있다고 인정되면 질병관리청장, 시·도지사 또는 시장·군수·구청장이 지체 없이 역학조사를 해야 한다. 2020년 질병관리청이 출범하면서 감염병 관리 권한이 보건복지부장관에서 질병관리청장으로 넘어갔으므로 보건복지부장관은 오답이다."},{"id":"45-1-19","r":45,"p":1,"n":19,"s":"위생관계법령","q":"「먹는물관리법」상 여러 사람에게 먹는물을 공급할 목적으로 개발하였거나 저절로 형성된 약수터, 샘터 및 우물 등을 말하는 용어는?","o":["샘물","먹는물","먹는샘물","먹는염지하수","먹는물공동시설"],"a":5,"e":"먹는물공동시설은 여러 사람에게 먹는물을 공급할 목적으로 개발했거나 저절로 형성된 약수터, 샘터, 우물 등을 말한다. 샘물은 암반대수층의 지하수·용천수 등 먹는 용도로 쓸 원수이고, 먹는샘물은 샘물을 먹기에 알맞게 물리적으로 처리해 제조한 물이다."},{"id":"45-1-20","r":45,"p":1,"n":20,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물 수질 감시원의 자격요건에 해당하지 <u>않는</u> 자는?","o":["영양사","위생사","수질환경기사","1년 이상 환경행정 분야의 사무에 종사한 사람","1년 이상 식품위생행정 분야의 사무에 종사한 사람"],"a":1,"e":"먹는물 수질 감시원은 위생사, 수질환경기사 등 환경 관련 자격자와 1년 이상 환경행정·식품위생행정 분야의 사무에 종사한 사람 등이 될 수 있다. 영양사는 식품위생감시원의 자격에는 들어가지만 먹는물 수질 감시원의 자격요건에는 해당하지 않는다."},{"id":"45-1-21","r":45,"p":1,"n":21,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물 수질 감시원의 직무 범위에 해당하는 것은?","o":["먹는물의 수질관리에 관한 조사·지도 및 감시","하수의 수질관리에 관한 조사·지도 및 감시","분뇨의 수질관리에 관한 조사·지도 및 감시","오수의 수질관리에 관한 조사·지도 및 감시","폐수의 수질관리에 관한 조사·지도 및 감시"],"a":1,"e":"먹는물 수질 감시원은 「먹는물관리법」에 따라 먹는물의 수질관리에 관한 조사·지도 및 감시를 맡는다. 하수·분뇨·오수·폐수는 하수도법, 물환경보전법 등 다른 법령에서 관리하는 대상이라 먹는물 수질 감시원의 직무가 아니다."},{"id":"45-1-22","r":45,"p":1,"n":22,"s":"위생관계법령","q":"「먹는물관리법」상 품질관리인을 두어야 하는 영업자는?","o":["먹는샘물등의 제조업자","먹는샘물 판매업자","수처리제 판매업자","먹는샘물 수입업자","정수기 판매업자"],"a":1,"e":"품질관리인은 제조 단계의 품질을 책임지는 사람이어서 먹는샘물등의 제조업자에게 두도록 의무화되어 있다. 판매업자와 수입업자는 직접 제조하지 않으므로 품질관리인을 둘 의무가 없다. ※ 교재 확인 권장"},{"id":"45-1-23","r":45,"p":1,"n":23,"s":"위생관계법령","q":"「먹는물관리법」상 먹는샘물등, 수처리제, 정수기 제조업자의 ‘자가 품질 검사성적서’ 보존기간은?","o":["1년","2년","3년","4년","5년"],"a":2,"e":"먹는샘물등, 수처리제, 정수기 제조업자는 자가품질검사를 하고 그 검사성적서를 2년간 보존해야 한다. 식품위생법의 자가품질검사 기록서 보관기간(2년)과 같다. ※ 교재 확인 권장"},{"id":"45-1-24","r":45,"p":1,"n":24,"s":"위생관계법령","q":"「폐기물관리법」상 위해의료폐기물 중 조직물류폐기물에 해당하는 것은?","o":["보관균주","주사바늘","동물의 사체","폐화학치료제","일회용 주사기"],"a":3,"e":"조직물류폐기물은 인체·동물의 조직·장기·기관·신체 일부, 동물의 사체, 혈액·고름 및 혈액생성물(혈청, 혈장, 혈액제제) 등이다. 주사바늘은 손상성폐기물, 보관균주는 병리계폐기물, 폐화학치료제는 생물·화학폐기물로 분류된다. 일회용 주사기는 일반의료폐기물이다."},{"id":"45-1-25","r":45,"p":1,"n":25,"s":"위생관계법령","q":"「하수도법」상 엄격한 방류수수질기준 적용지역 중 “대통령령으로 정하는 지역”이 <u>아닌</u> 곳은?","o":["습지보호지역","해양보호구역","산림보전지역","상수원보호구역","지하수보전구역"],"a":3,"e":"엄격한 방류수수질기준을 적용하는 지역은 상수원보호구역, 습지보호지역, 해양보호구역, 지하수보전구역처럼 물과 수생태계를 보호하려고 지정한 지역이다. 산림보전지역은 산지·산림 관리를 위한 지역이라 여기에 포함되지 않는다. ※ 교재 확인 권장"},{"id":"45-1-26","r":45,"p":1,"n":26,"s":"환경위생학","q":"자외선에 의한 공기의 자정작용은?","o":["교환작용","살균작용","세정작용","응축작용","확산작용"],"a":2,"e":"자외선은 공기 중의 미생물을 죽이는 살균작용으로 공기를 스스로 깨끗하게 한다. 세정작용은 비·눈이 오염물질을 씻어내는 작용이고, 확산(희석)작용은 기류에 의해 오염물질이 퍼지는 작용이라 자외선과 관계가 없다."},{"id":"45-1-27","r":45,"p":1,"n":27,"s":"환경위생학","q":"자동차에서 배출된 후 대기 중에서 광화학스모그를 일으키는 원인물질은?","o":["암모니아","황화수소","질소산화물","이산화탄소","일산화탄소"],"a":3,"e":"자동차가 배출하는 질소산화물(NOx)은 탄화수소와 함께 햇빛(자외선) 아래에서 광화학반응을 일으켜 오존, PAN 같은 광화학스모그 물질을 만든다. 일산화탄소도 자동차 배출가스이지만 광화학스모그의 주원인물질은 아니다."},{"id":"45-1-28","r":45,"p":1,"n":28,"s":"환경위생학","q":"다음에서 설명하는 역사적인 대기오염사건은?","o":["미국 도노라사건","일본 요코하마사건","영국 런던스모그사건","멕시코 포자리카사건","벨기에 뮤즈벨리사건"],"a":4,"b":"• 공장에서 황화수소(H₂S) 가스가 대량으로 누출되었다.\n• 가스누출로 인근 마을 주민 다수가 급성중독으로 사망하고, 대부분 주민에게는 기침과 호흡곤란 증상이 발생하였다.","e":"멕시코 포자리카사건(1950)은 공장에서 황화수소가 누출되어 주민이 급성중독으로 사망한 사건이다. 도노라, 런던스모그, 뮤즈벨리 사건은 기온역전 상태에서 아황산가스·매연이 쌓여 일어난 사건으로 원인물질이 다르다."},{"id":"45-1-29","r":45,"p":1,"n":29,"s":"환경위생학","q":"여름철 도시지역의 대기 중에서 생성되는 2차 대기오염물질은?","o":["오존(O₃)","암모니아(NH₃)","이산화황(SO₂)","이황화탄소(CS₂)","일산화탄소(CO)"],"a":1,"e":"오존은 질소산화물과 휘발성유기화합물이 햇빛이 강한 여름철에 광화학반응을 일으켜 생기는 대표적인 2차 대기오염물질이다. 이산화황과 일산화탄소는 배출원에서 직접 나오는 1차 오염물질이다."},{"id":"45-1-30","r":45,"p":1,"n":30,"s":"환경위생학","q":"기체상 대기오염물질을 고체 표면에 부착하여 제거하는 방법은?","o":["산화","흡착","중화","환원","소각"],"a":2,"e":"흡착은 활성탄 같은 고체 표면에 기체상 오염물질을 붙여 제거하는 방법이다. 흡수는 액체(세정액)에 녹여 제거하는 방법이고, 소각은 태워서 산화시키는 방법이므로 원리가 다르다."},{"id":"45-1-31","r":45,"p":1,"n":31,"s":"환경위생학","q":"대류권에서 고도가 높아질수록 기온이 올라가는 기상현상은?","o":["기온순환","기온역전","기온하강","열섬효과","온실효과"],"a":2,"e":"대류권에서는 보통 고도가 높아질수록 기온이 내려가는데(약 0.65℃/100m), 반대로 상층 기온이 더 높은 현상을 기온역전이라 한다. 기온역전이 생기면 대기가 안정해져 오염물질이 쌓이기 쉽다. 열섬효과는 도시 중심부의 기온이 주변보다 높아지는 수평적 현상이라 다른 개념이다."},{"id":"45-1-32","r":45,"p":1,"n":32,"s":"환경위생학","q":"성층권에서 오존층을 파괴하는 물질은?","o":["수증기(H₂O)","황화수소(H₂S)","일산화탄소(CO)","이황화탄소(CS₂)","프레온가스(CFCs)"],"a":5,"e":"프레온가스(CFCs)는 성층권에서 자외선에 분해되면서 염소원자를 내놓고, 이 염소가 오존을 연쇄적으로 파괴한다. 할론도 같은 오존층 파괴물질이다. 일산화탄소와 황화수소는 대류권 대기오염물질이라 오존층 파괴와 관련이 없다."},{"id":"45-1-33","r":45,"p":1,"n":33,"s":"환경위생학","q":"온실가스의 적외선 흡수능력을 의미하는 지구온난화지수를 산정하고자 할 때 기준이 되는 물질은?","o":["메탄(CH₄)","아산화질소(N₂O)","이산화탄소(CO₂)","과불화탄소(PFCs)","수소불화탄소(HFCs)"],"a":3,"e":"지구온난화지수(GWP)는 이산화탄소(CO₂)를 1로 기준 삼아 다른 온실가스의 온난화 효과를 상대값으로 나타낸다. 메탄, 아산화질소, 과불화탄소, 수소불화탄소는 CO₂보다 GWP가 훨씬 큰 비교 대상이지 기준물질은 아니다."},{"id":"45-1-34","r":45,"p":1,"n":34,"s":"환경위생학","q":"「실내공기질 관리법」상 다중이용시설의 실내공기질 유지기준에서 총부유세균의 단위는?","o":["Sv","ppm","Gy/m³","μg/m³","CFU/m³"],"a":5,"e":"총부유세균은 공기 1m³ 속에서 배양되어 집락(colony)을 만드는 세균 수로 나타내므로 단위가 CFU/m³이다. μg/m³는 미세먼지·포름알데히드, ppm은 이산화탄소·일산화탄소 같은 가스 농도에 쓰는 단위다."},{"id":"45-1-35","r":45,"p":1,"n":35,"s":"환경위생학","q":"「실내공기질 관리법」상 의료기관 등 다중이용시설에 대한 이산화탄소의 유지 기준은?","o":["1,000 ppm 이하","2,000 ppm 이하","3,000 ppm 이하","4,000 ppm 이하","5,000 ppm 이하"],"a":1,"e":"「실내공기질 관리법」상 이산화탄소의 유지기준은 의료기관을 포함한 다중이용시설에서 1,000ppm 이하다. 2,000ppm 이상의 값들은 유지기준이 아니므로 오답이다."},{"id":"45-1-36","r":45,"p":1,"n":36,"s":"환경위생학","q":"흑구온도계로 측정할 수 있는 온열인자는?","o":["기압","기온","기습","복사열","실내기류"],"a":4,"e":"흑구온도계는 검은 구가 흡수하는 열로 주위의 복사열을 측정한다. 기류는 카타온도계, 기습은 아스만 통풍건습계로 측정하므로 헷갈리지 않도록 한다."},{"id":"45-1-37","r":45,"p":1,"n":37,"s":"환경위생학","q":"밀폐된 실내 공간에 다수의 사람들이 머무르고 있는 경우 시간이 경과된 후 발생할 수 있는 공기의 이화학적 변화는?","o":["기온 상승, 습도 상승, O₂ 증가, CO₂ 감소","기온 상승, 습도 상승, O₂ 감소, CO₂ 증가","기온 상승, 습도 하강, O₂ 증가, CO₂ 증가","기온 하강, 습도 하강, O₂ 감소, CO₂ 감소","기온 하강, 습도 상승, O₂ 감소, CO₂ 증가"],"a":2,"e":"밀폐된 공간에 사람이 많으면 체열과 수증기 때문에 기온과 습도가 오르고, 호흡으로 O₂는 줄고 CO₂는 늘어난다. 이런 상태가 두통·불쾌감을 일으키는 군집독의 원인이 된다. 기온이 내려가거나 CO₂가 줄어든다는 조합은 모두 틀렸다."},{"id":"45-1-38","r":45,"p":1,"n":38,"s":"환경위생학","q":"감각온도의 종합작용을 설명하는 온열인자는?","o":["기습, 기류, 기압","기온, 기습, 기류","기온, 기류, 복사열","기온, 기습, 복사열","기류, 기압, 자외선"],"a":2,"e":"감각온도(실효온도)는 기온, 기습, 기류의 3가지 인자가 함께 작용해 사람이 느끼는 온도다. 여기에 복사열을 반영하려고 기온 대신 흑구온도를 쓰는 것은 수정감각온도이므로 구별해야 한다."},{"id":"45-1-39","r":45,"p":1,"n":39,"s":"환경위생학","q":"인체에서 열을 가장 많이 생산하는 부위는?","o":["폐","신장","심장","간장","골격근"],"a":5,"e":"인체 열생산의 약 60%를 골격근이 담당해 가장 많다. 간장이 그다음이고, 신장·심장·폐(호흡)는 비율이 훨씬 낮다."},{"id":"45-1-40","r":45,"p":1,"n":40,"s":"환경위생학","q":"건축자재에서 방출되어 새집증후군과 아토피 피부염의 원인물질로 작용하는 휘발성유기화합물은?","o":["라돈(Rn)","이산화황(SO₂)","일산화탄소(CO)","이산화질소(NO₂)","포름알데히드(HCHO)"],"a":5,"e":"포름알데히드(HCHO)는 합판·접착제·단열재 등 건축자재에서 나오는 휘발성유기화합물로 새집증후군과 아토피 피부염의 대표 원인물질이다. 라돈도 건축자재·토양에서 나오지만 방사성 기체이고 폐암과 관련되며, 휘발성유기화합물이 아니다."},{"id":"45-1-41","r":45,"p":1,"n":41,"s":"환경위생학","q":"체내 비타민D 형성에 기여하는 태양복사에너지는?","o":["감마선","알파선","자외선","적외선","가시광선"],"a":3,"e":"자외선 중 도르노선(UV-B, 약 290~320nm)이 피부에서 비타민D 형성을 돕는다. 적외선은 열작용을 하는 열선이고, 가시광선은 눈으로 보는 빛이라 비타민D 형성과 관계없다."},{"id":"45-1-42","r":45,"p":1,"n":42,"s":"환경위생학","q":"벤젠, 톨루엔 및 자일렌과 같은 실내공기 오염물질을 총칭하는 용어는?","o":["황산화물","질소산화물","트리할로메탄","아민류화합물","탄화수소화합물"],"a":5,"e":"벤젠, 톨루엔, 자일렌(BTX)은 탄소와 수소로 이루어진 방향족 탄화수소로, 휘발성유기화합물에 속하는 탄화수소화합물이다. 트리할로메탄은 물을 염소소독할 때 생기는 부산물이라 다른 개념이다."},{"id":"45-1-43","r":45,"p":1,"n":43,"s":"환경위생학","q":"실내에서 인체가 페인트와 접착제 등의 유기용제에 노출될 때 발생할 수 있는 영향은?","o":["진폐증","흑피증","신경장해","비중격천공","누적외상성증후군"],"a":3,"e":"페인트·접착제 등의 유기용제는 지용성이어서 신경계에 잘 축적되므로 두통, 어지럼증, 말초신경염 같은 신경장해를 일으킨다. 진폐증은 분진, 비중격천공은 크롬, 흑피증은 비소 노출로 생긴다."},{"id":"45-1-44","r":45,"p":1,"n":44,"s":"환경위생학","q":"수중의 pH가 6에서 5로 되었을 때 수소이온의 농도 변화는?","o":["0.5배 감소","0.5배 증가","5배 증가","10배 증가","10배 감소"],"a":4,"e":"【공식】 pH = −log[H⁺] 이므로 [H⁺] = 10^(−pH) mol/L\n【풀이】 pH 6일 때 [H⁺] = 10⁻⁶, pH 5일 때 [H⁺] = 10⁻⁵ → 10⁻⁵ ÷ 10⁻⁶ = 10, 즉 수소이온 농도는 10배 증가한다. pH가 1 낮아질 때마다 수소이온 농도는 10배씩 커진다."},{"id":"45-1-45","r":45,"p":1,"n":45,"s":"환경위생학","q":"수중의 현미경적 생물을 대상으로 ‘전(全) 생물개체수’ 중 ‘무(無)엽록체 생물개체수’를 %로 나타내는 오염지표는?","o":["pH","SS","BIP","BOD","COD"],"a":3,"e":"BIP(Biological Index of Pollution)는 현미경적 생물 가운데 무엽록체 생물이 차지하는 비율(%)로, 값이 클수록 유기물 오염이 심하다는 뜻이다. BOD와 COD는 산소요구량으로 나타내는 화학적 지표이고, SS는 부유물질의 양이라 생물지표가 아니다."},{"id":"45-1-46","r":45,"p":1,"n":46,"s":"환경위생학","q":"수질의 오염도를 판단하는 생물등급(약간 나쁨~매우 나쁨)의 생물지표종은?","o":["가재","다슬기","실지렁이","통영새우","민하루살이"],"a":3,"e":"실지렁이는 붉은깔따구, 나방파리 등과 함께 오염에 강해 수질이 ‘약간 나쁨~매우 나쁨’ 등급인 물에 사는 지표생물이다. 가재와 민하루살이는 ‘매우 좋음~좋음’, 다슬기는 ‘좋음~보통’ 등급의 깨끗한 물을 나타내는 생물이다."},{"id":"45-1-47","r":45,"p":1,"n":47,"s":"환경위생학","q":"지표나 해양 등에서 증발한 수증기가 응축하여 떨어지는 눈, 비 및 우박 등을 표현하는 용어는?","o":["천수","복류수","심층수","지하수","용천수"],"a":1,"e":"천수는 대기 중 수증기가 응축해 떨어지는 비, 눈, 우박 등의 강수를 말한다. 복류수는 하천 바닥의 모래·자갈층을 따라 흐르는 물이고, 용천수는 지하수가 지표로 저절로 솟아나는 물이다."},{"id":"45-1-48","r":45,"p":1,"n":48,"s":"환경위생학","q":"수질오염에 의한 이따이이따이병의 원인물질은?","o":["납(Pb)","수은(Hg)","크롬(Cr)","카드뮴(Cd)","벤젠(C₆H₆)"],"a":4,"e":"이따이이따이병은 일본 진즈강 유역에서 광산 폐수의 카드뮴(Cd)에 오염된 물과 쌀을 먹어 생긴 병으로, 신장장해와 골연화증을 일으킨다. 미나마타병은 수은(메틸수은)이 원인이므로 둘을 구분해야 한다."},{"id":"45-1-49","r":45,"p":1,"n":49,"s":"환경위생학","q":"호기성 미생물이 수중의 유기물을 분해하는 자정작용은?","o":["산화","중화","침전","확산","흡수"],"a":1,"e":"호기성 미생물이 용존산소를 이용해 유기물을 CO₂와 H₂O로 분해하는 것은 생물학적 자정작용인 산화작용이다. 침전과 확산(희석)은 물리적 자정작용이고, 중화는 화학적 반응이라 오답이다."},{"id":"45-1-50","r":45,"p":1,"n":50,"s":"환경위생학","q":"생활하수의 하천 유입으로 영양염류가 증가하여 발생하는 수질오염현상은?","o":["전도","석회화","성층화","안정화","부영양화"],"a":5,"e":"생활하수 속 질소(N)와 인(P) 같은 영양염류가 늘어나 조류가 지나치게 번식하는 현상을 부영양화라 한다. 이것이 녹조·적조의 원인이 된다. 성층화는 수온 차이로 물이 층을 이루는 현상이고, 전도는 봄·가을에 수온이 변하며 위아래 물이 뒤섞이는 현상이다."},{"id":"45-1-51","r":45,"p":1,"n":51,"s":"환경위생학","q":"먹는물의 정수과정에서 불쾌한 맛·냄새를 유발하는 물질을 제거하는 데 효과적인 흡착제는?","o":["염화제2철","황산제1철","황산제2철","입상활성탄","황산알루미늄"],"a":4,"e":"입상활성탄은 넓은 다공성 표면에 지오스민, 2-MIB 같은 맛·냄새 유발물질을 흡착해 제거한다. 황산알루미늄, 염화제2철, 황산제1철, 황산제2철은 탁도를 낮추는 응집제이지 흡착제가 아니다."},{"id":"45-1-52","r":45,"p":1,"n":52,"s":"환경위생학","q":"물의 특성에 관한 설명으로 옳은 것은?","o":["밀도는 약 4℃에서 최대가 된다.","수온이 낮아지면 점도가 감소한다.","액체에서 고체로 변하면 부피가 감소한다.","물분자 사이의 수소결합으로 표면장력이 작다.","분자량이 유사한 다른 화합물에 비해 비열이 작다."],"a":1,"e":"물은 수소결합 때문에 약 4℃에서 밀도가 가장 크다. 반대로 얼음이 되면 부피가 약 9% 늘어나고, 수온이 낮아지면 점도는 커진다. 또 수소결합 때문에 표면장력과 비열이 다른 화합물보다 크다는 점도 알아 두어야 한다."},{"id":"45-1-53","r":45,"p":1,"n":53,"s":"환경위생학","q":"하수의 혐기성 처리방법은?","o":["산화지법","임호프조법","살수여상법","회전원판법","활성슬러지법"],"a":2,"e":"임호프조법은 상층 침전실과 하층 소화실로 나뉜 탱크에서 침전된 슬러지를 산소 없이 혐기성 소화시키는 처리법이다(부패조, 혐기성 소화조도 같은 혐기성 계열). 활성슬러지법, 살수여상법, 회전원판법, 산화지법은 모두 미생물에 산소를 공급하는 호기성 처리법이다."},{"id":"45-1-54","r":45,"p":1,"n":54,"s":"환경위생학","q":"산업폐수에 대한 설명으로 옳은 것은?","o":["생활용수로 사용된 물이다.","가정용수와 공공하수로 구분된다.","취사, 목욕, 조리, 세탁 시에 발생한다.","세척수, 분뇨 등 화장실에서 배출된다.","생산공정에 따라 고농도의 중금속이 함유될 수 있다."],"a":5,"e":"산업폐수는 공장의 생산공정에서 배출되므로 업종에 따라 카드뮴·수은·크롬 등 중금속이나 유해물질이 고농도로 함유될 수 있다. 취사·목욕·세탁수나 화장실 분뇨 배출수, 생활용수로 쓰인 물은 가정에서 나오는 생활하수(오수)에 대한 설명이다."},{"id":"45-1-55","r":45,"p":1,"n":55,"s":"환경위생학","q":"하수종말처리시설에서 처리할 수 있는 대상은?","o":["오수, 우수","오수, 폐수","중수, 폐수","냉각수, 폐수","실험실세척수, 중수"],"a":1,"e":"하수종말처리시설(공공하수처리시설)은 생활오수와 빗물(우수)이 하수관거를 통해 유입되는 하수를 처리하는 시설로, 처리 대상은 오수와 우수이다. 공장에서 나오는 산업폐수는 원칙적으로 폐수종말처리시설(공공폐수처리시설)에서 별도로 처리한다."},{"id":"45-1-56","r":45,"p":1,"n":56,"s":"환경위생학","q":"하·폐수의 화학적 성분분석 항목은?","o":["밀도","온도","탁도","투과도","알칼리도"],"a":5,"e":"알칼리도는 물이 산을 중화할 수 있는 능력(탄산염·중탄산염·수산화물 농도)을 적정으로 측정하는 화학적 분석 항목이다. 온도, 탁도, 밀도, 투과도는 물질의 화학 조성이 아닌 물리적 성상을 나타내는 물리적 항목이다."},{"id":"45-1-57","r":45,"p":1,"n":57,"s":"환경위생학","q":"수질오염의 척도가 되는 지표생물의 선정 조건으로 옳은 것은?","o":["서식의 밀도가 낮을 것","이동성이 커서 정착하지 아니할 것","분류가 쉽고 육안 구별이 용이할 것","샘플링이 곤란해 수질판정이 어려울 것","생식의 제한인자가 수질의 영향이 없을 것"],"a":3,"e":"지표생물은 분류가 쉽고 육안으로 구별이 용이해야 하며, 서식 밀도가 높고 이동성이 적어 한곳에 정착하고, 수질 변화에 민감하게 반응해야 한다. 이동성이 커서 정착하지 않거나 수질의 영향을 받지 않는 생물은 그 지점의 수질을 반영하지 못하므로 지표가 될 수 없다."},{"id":"45-1-58","r":45,"p":1,"n":58,"s":"환경위생학","q":"폐수 중 부유물을 침강시킬 때 플록(Floc)을 형성시켜 처리효과를 높이는 처리법은?","o":["부상분리","응집침전","이온교환","중화처리","탈수여과"],"a":2,"e":"응집침전은 황산알루미늄(명반)·염화제2철 등 응집제를 넣어 미세한 콜로이드 입자를 뭉쳐 크고 무거운 플록을 만든 뒤 침전시키는 방법이다. 부상분리는 미세기포로 입자를 수면에 띄워 제거하는 방법이고, 중화처리는 pH 조정, 이온교환은 용존 이온 제거가 목적이다."},{"id":"45-1-59","r":45,"p":1,"n":59,"s":"환경위생학","q":"스토크법칙(Stokes law)에서 유체 중 구형 입자의 침강속도를 감소시키는 요인은?","o":["물의 온도 상승","물의 점도 증가","입자의 밀도 증가","입자의 직경 증가","입자의 밀도와 물의 밀도 차이 증가"],"a":2,"e":"스토크스 법칙에서 침강속도 V = g(ρp − ρw)d² / 18μ 이므로, 분모인 물의 점도(μ)가 커지면 침강속도는 감소한다. 입자의 직경 증가(제곱에 비례), 입자와 물의 밀도 차 증가는 속도를 높이고, 수온이 오르면 점도가 낮아져 오히려 침강이 빨라진다."},{"id":"45-1-60","r":45,"p":1,"n":60,"s":"환경위생학","q":"지정폐기물의 종류에 대한 설명으로 옳은 것은?","o":["폐산은 pH가 12.5 이상인 것이다.","폐알칼리는 pH가 2.0 이하인 것이다.","폐유는 기름성분이 3% 미만 함유한 것이다.","오니류는 수분 함량이 95% 미만이거나 고형물 함량이 5% 이상인 것이다.","폐페인트는 페인트 제조업 용적 2 m³ 이상의 도장시설에서 발생되는 것이다."],"a":4,"e":"「폐기물관리법」상 지정폐기물 중 오니류는 수분 함량 95% 미만이거나 고형물 함량 5% 이상인 것으로 규정된다. 폐산은 pH 2.0 이하, 폐알칼리는 pH 12.5 이상으로 두 보기는 수치가 서로 뒤바뀌어 있고, 폐유는 기름성분이 5% 이상 함유된 것이다. ※ 교재 확인 권장"},{"id":"45-1-61","r":45,"p":1,"n":61,"s":"환경위생학","q":"국내 사업장 폐기물 관리의 기본원칙은?","o":["소각","매립","퇴비화","재활용","해양투기"],"a":4,"e":"국내 사업장폐기물 관리는 발생 억제와 함께 발생된 폐기물을 최대한 재활용하는 것을 기본원칙으로 하며, 재활용이 불가능한 것만 소각·매립 등으로 처리한다. 해양투기는 런던협약에 따라 국내에서 전면 금지되었고, 소각과 매립은 최종 처분 수단일 뿐 기본원칙이 아니다."},{"id":"45-1-62","r":45,"p":1,"n":62,"s":"환경위생학","q":"호기성 미생물에 의해 유기물이 분해되는 과정에서 가스와 열이 발생하는 처리방법은?","o":["용융","소각","투기","파쇄","퇴비화"],"a":5,"e":"퇴비화는 호기성 미생물이 유기물을 분해하면서 CO₂·수증기 등 가스와 열을 발생시키며, 이 발효열로 퇴비 더미가 50~60℃ 이상으로 올라가 병원균과 잡초 씨앗이 사멸된다. 소각과 용융은 미생물이 아닌 고온 연소·용해에 의한 열적 처리이고, 파쇄는 물리적으로 크기만 줄이는 전처리이다."},{"id":"45-1-63","r":45,"p":1,"n":63,"s":"환경위생학","q":"폐기물 처리 퇴비화의 적정 C/N비는?","o":["1","5","10","15","30"],"a":5,"e":"퇴비화에 적정한 C/N비는 약 25~50 정도로, 보기 중에서는 30이 적정하다. C/N비가 너무 낮으면(질소 과다) 질소가 암모니아로 휘산되어 악취가 나고, 너무 높으면(탄소 과다) 미생물의 질소 부족으로 분해가 느려진다."},{"id":"45-1-64","r":45,"p":1,"n":64,"s":"환경위생학","q":"「폐기물관리법」상 위해의료폐기물 중 주사바늘 및 봉합바늘의 분류는?","o":["손상성폐기물","병리계폐기물","조직물류폐기물","혈액오염폐기물","생물·화학폐기물"],"a":1,"e":"「폐기물관리법」상 손상성폐기물은 주사바늘, 봉합바늘, 수술용 칼날, 한방침, 치과용침, 파손된 유리재질의 시험기구처럼 찔리거나 베일 위험이 있는 의료폐기물이다. 혈액오염폐기물은 폐혈액백·혈액투석 폐기물 등 혈액이 묻은 것이고, 조직물류폐기물은 인체 조직·장기·태반 등이다."},{"id":"45-1-65","r":45,"p":1,"n":65,"s":"환경위생학","q":"「폐기물관리법」상 위해의료폐기물 중 시험, 검사 등에 사용된 배양액, 배양용기 및 보관균주의 분류는?","o":["병리계폐기물","손상성폐기물","조직물류폐기물","혈액오염폐기물","생물·화학폐기물"],"a":1,"e":"「폐기물관리법」상 병리계폐기물은 시험·검사 등에 사용된 배양액, 배양용기, 보관균주, 폐시험관, 슬라이드, 커버글라스, 폐배지, 폐장갑 등이다. 생물·화학폐기물은 폐백신·폐항암제·폐화학치료제이고, 손상성폐기물은 주사바늘·봉합바늘처럼 날카로운 것이다."},{"id":"45-1-66","r":45,"p":1,"n":66,"s":"환경위생학","q":"산업재해로 인한 근로 손실 정도를 나타내어 재해 발생의 심각성을 나타내는 지표는?","o":["건수율","발생률","도수율","강도율","천인율"],"a":4,"e":"강도율은 연간 총근로시간 1,000시간당 근로손실일수(근로손실일수 ÷ 연근로시간 수 × 1,000)로, 재해로 잃은 근로일수를 반영해 재해의 심각성(강도)을 나타낸다. 도수율은 100만 근로시간당 재해 발생 건수로 재해 발생 빈도를 나타낼 뿐 심각성은 반영하지 않고, 천인율은 근로자 1,000명당 재해자 수이다."},{"id":"45-1-67","r":45,"p":1,"n":67,"s":"환경위생학","q":"국소 진동에 노출되어 나타날 수 있는 대표적인 직업병은?","o":["난청(hearing loss)","열사병(heat stroke)","진폐증(pneumoconiosis)","VDT증후군(VDT syndrome)","레이노병(Raynaud’s disease)"],"a":5,"e":"착암기·전기톱 등 진동공구 사용으로 손에 국소 진동이 반복 노출되면 말초혈관이 수축해 손가락이 하얗게 변하는 레이노병(레이노 현상, 백지증)이 생긴다. 난청은 소음, 진폐증은 분진 흡입, VDT증후군은 컴퓨터 단말기 장시간 작업이 원인이다."},{"id":"45-1-68","r":45,"p":1,"n":68,"s":"환경위생학","q":"4기압 이상의 고압 환경에서 정상기압 환경으로 갑자기 복귀할 때 발생하는 장해는?","o":["항공병","고산병","감압병","참호족","열사병"],"a":3,"e":"고압 환경(잠수·잠함 작업)에서 체내에 녹아 있던 질소가 급격한 감압 시 기포로 변해 혈관을 막고 관절통·마비 등을 일으키는 것이 감압병(잠함병)이다. 고산병과 항공병은 고지대·고공의 저기압·저산소 환경에서 생기는 장해이고, 참호족은 저온 다습 환경에 의한 국소 동상이다."},{"id":"45-1-69","r":45,"p":1,"n":69,"s":"환경위생학","q":"멸균의 개념으로 옳은 것은?","o":["미생물 생균 수 유지","병원미생물의 증식 저지","병원미생물의 활성 정지","미생물 사멸 및 아포 파괴","병원미생물의 감염력을 억제"],"a":4,"e":"멸균은 병원성·비병원성을 가리지 않고 모든 미생물을 사멸시키고 내성이 강한 아포까지 파괴하는 것이다. 병원미생물의 감염력을 없애는 것은 소독, 미생물의 증식을 억제·저지하는 것은 방부로 멸균보다 약한 개념이다."},{"id":"45-1-70","r":45,"p":1,"n":70,"s":"환경위생학","q":"습열을 이용하여 처리하는 소독법은?","o":["세균 여과법","방사선 멸균법","자외선 멸균법","초음파 멸균법","유통증기 멸균법"],"a":5,"e":"유통증기 멸균법은 100℃의 흐르는 수증기로 30~60분간 처리하는 습열 소독법이며, 습열에는 이 외에 자비소독, 고압증기멸균, 저온살균법 등이 있다. 자외선·방사선 멸균은 열을 쓰지 않는 조사법이고, 세균 여과법은 여과에 의한 물리적 제균법이다."},{"id":"45-1-71","r":45,"p":1,"n":71,"s":"환경위생학","q":"100℃ 끓는 물에서 15~20분간 처리하는 소독법은?","o":["염소소독","자비소독","건열소독","화염소독","약물소독"],"a":2,"e":"자비소독은 100℃ 끓는 물에 15~20분간 담가 처리하는 습열 소독법으로 식기, 행주, 의류 등에 쓰이지만 아포는 완전히 사멸시키지 못한다. 건열소독은 건열멸균기에서 160~170℃로 1~2시간 처리하고, 화염소독은 불꽃에 직접 20초 이상 가열하는 방법이다."},{"id":"45-1-72","r":45,"p":1,"n":72,"s":"환경위생학","q":"석탄산계수 산정에 사용되는 시험균주는?","o":["대장균","콜레라균","페스트균","장티푸스균","슈도모나스균"],"a":4,"e":"석탄산계수는 시험 소독제의 살균력을 석탄산(페놀)과 비교한 값으로, 20℃에서 장티푸스균(또는 황색포도상구균)을 5분 이내에는 죽이지 못하고 10분 이내에 죽이는 희석배수의 비로 구한다. 대장균은 수질의 분변오염 지표균이지 석탄산계수 시험균주가 아니다."},{"id":"45-1-73","r":45,"p":1,"n":73,"s":"환경위생학","q":"인공환기에 대한 설명으로 옳은 것은?","o":["중력환기와 풍력환기가 있다.","경제적으로 비용이 들지 않는다.","기계적인 힘을 이용하는 환기이다.","창문을 통한 공기의 확산에 의한 환기이다.","실내·외의 온도차에 의해 발생하는 환기이다."],"a":3,"e":"인공환기는 송풍기·배풍기(환풍기) 등 기계적인 힘을 이용하는 환기로 기계환기라고도 하며 설비·전력 비용이 든다. 중력환기(실내외 온도차)와 풍력환기(바람)는 자연환기의 종류이고, 창문을 통한 공기 확산도 자연환기에 해당한다."},{"id":"45-1-74","r":45,"p":1,"n":74,"s":"환경위생학","q":"차광물 존재 시 채광량이 가장 좋은 개각과 입사각으로 옳게 묶인 것은?","o":["0~1°, 12°","2~3°, 16°","4~5°, 20°","2~3°, 24°","4~5°, 28°"],"a":5,"e":"자연채광에서 차광물(건물 등)이 있을 때 실내 채광이 충분하려면 개각은 4~5° 이상, 입사각은 28° 이상이어야 한다. 개각과 입사각이 클수록 채광이 좋아지므로 그보다 작은 각도 조합은 기준에 미달한다."},{"id":"45-1-75","r":45,"p":1,"n":75,"s":"환경위생학","q":"인공조명 사용 시 고려해야 할 사항으로 옳은 것은?","o":["가격이 비쌀 것","조명도가 균등하지 않을 것","유해가스가 발생하지 않을 것","반드시 직접조명이 되도록 설치할 것","광색은 푸른색에 가깝게 조도를 낮출 것"],"a":3,"e":"인공조명은 연소 시 유해가스가 발생하지 않고 화재·폭발 위험이 없어야 하며, 조도가 균등하고 충분해야 한다. 또한 눈을 보호하기 위해 직접조명보다 간접조명이 좋고, 광색은 주광색(태양광)에 가까워야 하며, 가격은 저렴하고 취급이 간편해야 한다."},{"id":"45-1-76","r":45,"p":1,"n":76,"s":"위생곤충학","q":"지네강에 속하는 것은?","o":["벌목","바퀴목","노린재목","잠자리목","왕지네목"],"a":5,"e":"지네강(순각강)에는 왕지네목, 돌지네목, 땅지네목, 그리마목 등이 속한다. 벌목, 바퀴목, 노린재목, 잠자리목은 모두 곤충강에 속하는 목이다."},{"id":"45-1-77","r":45,"p":1,"n":77,"s":"위생곤충학","q":"말피기관(Malpighian tubules)이 속하는 기관은?","o":["배설기관","생식기관","소화기관","순환기관","호흡기관"],"a":1,"e":"말피기관은 중장과 후장 경계에 붙은 가는 관으로, 체강 내 혈림프에서 질소성 노폐물(요산)을 걸러 후장으로 보내는 곤충의 배설기관이다. 곤충의 호흡은 기문·기관계, 순환은 배혈관(개방혈관계)이 담당한다."},{"id":"45-1-78","r":45,"p":1,"n":78,"s":"위생곤충학","q":"불완전변태를 하는 위생곤충은?","o":["등에","모기","벼룩","빈대","파리"],"a":4,"e":"빈대는 알 → 약충 → 성충으로 번데기 시기가 없는 불완전변태를 하며, 이·바퀴·노린재도 같은 불완전변태 곤충이다. 모기, 파리, 벼룩, 등에는 알 → 유충 → 번데기 → 성충을 거치는 완전변태 곤충이다."},{"id":"45-1-79","r":45,"p":1,"n":79,"s":"위생곤충학","q":"매개체와 질병이 옳게 연결된 것은?","o":["모기–재귀열","빈대–페스트","진드기–황열병","체체파리–수면병","모래파리–발진티푸스"],"a":4,"e":"체체파리는 아프리카수면병의 원충(트리파노소마)을 매개한다. 재귀열은 이·진드기, 페스트는 벼룩(쥐벼룩), 황열은 이집트숲모기, 발진티푸스는 몸이가 매개하며, 모래파리는 리슈만편모충증을 매개한다."},{"id":"45-1-80","r":45,"p":1,"n":80,"s":"위생곤충학","q":"다음 중 병원체가 바이러스인 것은?","o":["뎅기열","참호열","발진열","발진티푸스","로키산홍반열"],"a":1,"e":"뎅기열은 플라비바이러스인 뎅기바이러스가 원인이며 이집트숲모기·흰줄숲모기가 매개한다. 발진티푸스, 발진열, 로키산홍반열은 리케차가 병원체이고, 참호열도 이가 매개하는 세균성(과거 리케차로 분류된 바르토넬라) 질환이다."},{"id":"45-1-81","r":45,"p":1,"n":81,"s":"위생곤충학","q":"불쾌곤충(nuisance)에 대한 설명으로 옳은 것은?","o":["객관적이다.","후진국형이다.","혐오감을 준다.","질병을 매개한다.","방제 평가가 쉽다."],"a":3,"e":"불쾌곤충은 질병을 매개하지는 않지만 존재 자체로 혐오감·불쾌감을 주는 곤충(깔따구, 노린재 등)이다. 불쾌감은 사람마다 다른 주관적 기준이라 방제 평가가 어렵고, 생활수준이 높아질수록 문제가 되는 선진국형 피해이다."},{"id":"45-1-82","r":45,"p":1,"n":82,"s":"위생곤충학","q":"위생곤충의 물리적 방제 방법은?","o":["끈끈이줄을 이용한다.","독먹이통을 이용한다.","고유의 향기를 이용한다.","바퀴가 좋아하는 먹이를 이용한다.","개체 간 약육강식 경쟁을 이용한다."],"a":1,"e":"물리적 방제는 끈끈이줄·끈끈이 트랩, 유문등(빛), 방충망처럼 살충제나 생물을 쓰지 않고 물리적 수단으로 잡거나 차단하는 방법이다. 독먹이통과 먹이 유인 미끼는 살충제를 쓰는 화학적 방제이고, 천적·경쟁 관계를 이용하는 것은 생물학적 방제이다."},{"id":"45-1-83","r":45,"p":1,"n":83,"s":"위생곤충학","q":"펜티온(Fenthion)이 속하는 것은?","o":["미생물제제","발육억제제","유기인계 살충제","퍼머스린계 살충제","카바메이트계 살충제"],"a":3,"e":"펜티온(바이텍스)은 아세틸콜린에스테라아제를 저해하는 유기인계 살충제로, 모기 유충 및 성충 방제에 사용된다. 퍼머스린은 피레스로이드계, 벤디오카브·프로폭서 등은 카바메이트계이며, 발육억제제는 메토프렌 같은 유약호르몬 유사체 등이다."},{"id":"45-1-84","r":45,"p":1,"n":84,"s":"위생곤충학","q":"효력증강제와 혼용해서 사용하는 살충제는?","o":["유기인계","무기살충제","유기염소계","카바메이트계","피레스로이드계"],"a":5,"e":"피레스로이드계 살충제는 체내 분해효소에 의해 쉽게 해독되어 효력이 짧으므로, 피페로닐 부톡사이드 같은 효력증강제(공력제)를 혼용해 분해를 막고 살충효과를 높인다. 유기인계나 유기염소계는 일반적으로 효력증강제와의 혼용을 기본으로 하지 않는다."},{"id":"45-1-85","r":45,"p":1,"n":85,"s":"위생곤충학","q":"흡수력이 약한 실내 타일벽에 잔류살포하는 제제는?","o":["용제(solution)","입제(granule)","유제(emulsifiable concentrate)","수용제(soluble powder)","수화제(water dispersible powder)"],"a":3,"e":"유제는 살충제를 유기용매와 유화제에 녹인 제제로, 타일·유리·페인트칠한 벽처럼 흡수력이 약한 매끈한 표면에 잔류분무하면 약제가 표면에 얇은 막으로 남아 효과적이다. 수화제는 흙벽·시멘트벽처럼 흡수력이 강한 표면에 적합하고, 입제는 물웅덩이 등 유충 서식처에 뿌리는 제형이다."},{"id":"45-1-86","r":45,"p":1,"n":86,"s":"위생곤충학","q":"실험곤충군에 살충제를 처리했을 때 그 실험곤충의 50%를 치사시킬 수 있는 농도는?","o":["FO₅₀","KT₅₀","TLₘ","LD₅₀","LC₅₀"],"a":5,"e":"LC₅₀(반수치사농도)은 공기·물 등 매체 중 살충제 농도로 실험곤충의 50%를 치사시키는 농도이다. LD₅₀은 체중당 투여량(용량)으로 50%를 치사시키는 값이고, KT₅₀은 50%가 녹다운되는 데 걸리는 시간, TLm은 어류 독성시험에서 50%가 생존하는 한계농도이다."},{"id":"45-1-87","r":45,"p":1,"n":87,"s":"위생곤충학","q":"살충제 용기 표지에 ‘주의(CAUTION)’란 단어의 의미는?","o":["고독성","저독성","중독성","경미독성","실질적인 무독성"],"a":2,"e":"살충제 용기의 독성 표지에서 ‘위험(DANGER)’은 고독성, ‘경고(WARNING)’는 중독성, ‘주의(CAUTION)’는 저독성을 뜻한다. 따라서 ‘주의’ 표시를 고독성이나 중독성으로 해석하는 것은 틀리다."},{"id":"45-1-88","r":45,"p":1,"n":88,"s":"위생곤충학","q":"카바메이트계 살충제는?","o":["디디티(DDT)","알드린(Aldrin)","템포스(Temephos)","파라티온(Parathion)","벤디오카브(Bendiocarb)"],"a":5,"e":"벤디오카브는 프로폭서와 함께 대표적인 카바메이트계 살충제이다. 디디티와 알드린은 유기염소계, 템포스(테메포스)와 파라티온은 유기인계 살충제이다."},{"id":"45-1-89","r":45,"p":1,"n":89,"s":"위생곤충학","q":"쥐가 급성살서제를 기피하는 현상을 줄이는 방법으로 옳은 것은?","o":["쥐의 서식처를 청소한다.","사전미끼(pre-bait)를 설치한다.","쥐의 주요 통로를 밝게 해 준다.","아주 약한 살서제를 독먹이로 설치한다.","쥐가 지그재그로 다니도록 방벽을 설치한다."],"a":2,"e":"쥐는 새로운 먹이를 경계하는 습성(신기피성)이 있고 급성살서제 섭취 후 살아남으면 미끼를 기피하므로, 독이 없는 사전미끼를 며칠간 놓아 익숙해지게 한 뒤 독먹이로 교체하면 기피를 줄일 수 있다. 아주 약한 살서제를 놓으면 치사량에 못 미쳐 오히려 미끼 기피를 학습시키게 된다."},{"id":"45-1-90","r":45,"p":1,"n":90,"s":"위생곤충학","q":"전흉배판(pronotum)에 흑색 종대(縱帶)가 두 줄로 있고, 전국에 서식하는 바퀴는?","o":["먹바퀴","독일바퀴","경도바퀴","이질바퀴","일본바퀴"],"a":2,"e":"독일바퀴는 소형(약 1.2 cm)의 황갈색 바퀴로 전흉배판에 두 줄의 흑색 종대가 뚜렷하며 전국 실내에 가장 흔히 서식한다. 이질바퀴는 대형으로 전흉배판 가장자리에 황색 무늬가 둘러 있고, 먹바퀴는 전체가 흑갈색이다."},{"id":"45-1-91","r":45,"p":1,"n":91,"s":"위생곤충학","q":"알이 물에 뜨도록 난괴를 형성하는 모기는?","o":["광능왕모기","빨간집모기","노랑늪모기","흰줄숲모기","잿빛얼룩날개모기"],"a":2,"e":"빨간집모기 등 집모기속은 알을 수면에 한 덩어리로 붙여 낳아 물에 뜨는 난괴(egg raft)를 형성한다. 얼룩날개모기속은 부낭이 있는 알을 하나씩 수면에 낳고, 숲모기속(흰줄숲모기)은 알을 수면 바로 위 물체의 벽에 하나씩 낳으며, 늪모기속은 수생식물 뒷면에 난괴를 붙인다."},{"id":"45-1-92","r":45,"p":1,"n":92,"s":"위생곤충학","q":"지카바이러스를 매개하는 모기는?","o":["흰줄숲모기","지하집모기","반점날개늪모기","작은빨간집모기","중국얼룩날개모기"],"a":1,"e":"지카바이러스는 이집트숲모기와 흰줄숲모기 같은 숲모기속 모기가 주간에 흡혈하며 매개한다. 작은빨간집모기는 일본뇌염, 중국얼룩날개모기는 삼일열말라리아를 매개한다."},{"id":"45-1-93","r":45,"p":1,"n":93,"s":"위생곤충학","q":"모기가 매개하
