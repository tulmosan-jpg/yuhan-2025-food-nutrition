<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위생사 기출 반복풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --soft:#f3f3f1; --soft2:#e9e9e6; --ink:#1e1e1e; --muted:#6e6e6a;
  --ok:#2456a4; --ok-bg:#eaf0f8; --bad:#cf3a2f; --bad-bg:#fbeeec;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding:0 16px 64px}
.wrap{max-width:760px;margin:0 auto}
header.top{padding:32px 0 8px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;font-size:.86rem;max-width:64ch}
.bar{background:var(--bg);padding:12px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--soft2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tabs .lab{font-size:.74rem;color:var(--muted);margin-right:4px;min-width:2.6em}
.tab{font:inherit;font-size:.82rem;border:0;background:var(--soft);color:var(--ink);padding:4px 10px;border-radius:4px;cursor:pointer}
.tab:hover{background:var(--soft2)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#modes .tab{font-weight:600;font-size:.88rem;padding:5px 11px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.84rem}
.tools button{font:inherit;font-size:.8rem;border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--soft2)}
.tools button:hover{color:var(--ink)}
.tools button.primary{background:var(--ink);color:var(--bg);text-decoration:none;padding:5px 12px}
.tools button[aria-pressed="true"]{color:var(--ink);text-decoration-color:var(--ink)}
.tools .tab{background:var(--soft);color:var(--ink);text-decoration:none;padding:4px 10px}
.tools .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.score b{color:var(--ink)}
.q{padding:22px 0 6px;border-bottom:1px solid var(--soft)}
.meta{font-size:.74rem;color:var(--muted);margin-bottom:4px}
.meta .hot{color:var(--bad)}
.qhead{display:flex;gap:10px;align-items:baseline}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);flex:none;font-size:.9rem}
.q.ok .num{color:var(--ok)} .q.bad .num{color:var(--bad)}
.stem{font-family:var(--f-display);font-size:1.05rem;min-width:0}
.box{display:block;background:var(--soft);border-radius:4px;padding:10px 12px;margin-top:8px;font-family:var(--f-body);font-size:.9rem;white-space:pre-line}
.prnote{margin-top:8px;font-size:.78rem;color:#8a4b0f;background:#fff4e5;border-radius:4px;padding:7px 10px;line-height:1.5}
.prb{position:absolute;left:8px;bottom:8px;background:#b45309;color:#fff;font-size:.68rem;font-weight:600;padding:2px 7px;border-radius:3px}
.prb.sol{background:#1f5fa8}
.gal[data-rv="0"] .cap{display:none}
.opts.imgopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.imgopts .opt{flex-direction:column;align-items:stretch;gap:4px;border:1px solid var(--soft2);padding:6px 8px}
.oimg{display:block;width:100%}
.oimg svg{display:block;width:100%;height:auto;border-radius:4px}
.oname{font-size:.8rem;font-weight:600}
.xq .fig.pr{color:#8a4b0f;font-weight:600}
.xq ol.imgo{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}
.xq ol.imgo li button{flex-direction:column;align-items:stretch;border:1px solid #ccc;border-radius:6px;padding:5px}
.xq .gal .main:has(svg){height:300px;max-width:420px;background:#fff}
.figno{margin-top:8px;font-size:.8rem;color:var(--muted);background:var(--soft);border-radius:4px;padding:8px 10px}
.opts{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:2px}
.opt{width:100%;text-align:left;font:inherit;font-size:.93rem;background:transparent;color:var(--ink);border:0;border-radius:4px;padding:7px 10px;cursor:pointer;display:flex;gap:8px}
.opt:hover:not(:disabled){background:var(--soft)}
.opt:disabled{cursor:default;color:var(--muted)}
.opt.right{background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-bg);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.mk{flex:none;width:1.2em;opacity:.7}
.res{margin-top:8px;font-size:.86rem;background:var(--soft);border-radius:4px;padding:9px 12px}
.res b.okt{color:var(--ok)} .res b.badt{color:var(--bad)}
.gal{margin-top:10px}
.gal .main{position:relative;background:#111;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-height:420px}
.gal .main img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.gal .main svg{width:100%;height:100%;background:#f7f5ef}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.85);color:#111;width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.gal .nav.l{left:8px} .gal .nav.r{right:8px}
.gal .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:1px 7px;border-radius:10px}
.thumbs{display:flex;gap:4px;margin-top:6px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;border:2px solid transparent;padding:0;border-radius:4px;overflow:hidden;cursor:pointer;background:var(--soft);width:58px;height:44px}
.thumbs button[aria-current="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .svgt{font-size:.6rem;color:var(--muted);display:flex;align-items:center;justify-content:center;height:100%}
.credit{font-size:.7rem;color:var(--muted);margin-top:4px;word-break:break-all}
.credit a{color:inherit}
.what{margin-top:6px;font-size:.86rem;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.more{display:flex;justify-content:center;margin:24px 0}
.btn{font:inherit;font-size:.86rem;border:0;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.subj{padding:20px 0;border-bottom:1px solid var(--soft)}
.subj h3{font-family:var(--f-display);font-size:1.05rem;margin:0 0 6px}
.subj h3 .hid{background:var(--soft2);color:transparent;border-radius:3px;cursor:pointer;padding:0 6px}
.subj .qs{font-size:.76rem;color:var(--muted);margin-top:4px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:16px 0}
.dash div{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:.8rem;color:var(--muted)}
.dash b{display:block;font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.opt:focus-visible,.tab:focus-visible,.tools button:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
footer{margin-top:40px;font-size:.74rem;color:var(--muted)}
/* 해설 */
.exp{margin-top:8px;font-size:.86rem;background:#fbfaf6;border-left:3px solid var(--soft2);padding:9px 12px;white-space:pre-line}
.exp .tag{display:inline-block;font-size:.68rem;color:var(--muted);border:1px solid var(--soft2);border-radius:3px;padding:0 5px;margin-right:6px}
/* 모의고사 */
body.mockon .xq .gal .thumbs{display:none}
.xq .gal .main{aspect-ratio:auto;height:230px;max-width:340px;background:#f2f2ef;border:1px solid #bbb;border-radius:0}
.xq .gal .main svg{background:#fff}
.xq .gal .nav{width:28px;height:28px;font-size:.95rem}
.xq .gal .credit{max-width:340px}
@media (max-width:480px){.xbar{gap:6px}.xbar .btn{padding:7px 10px;font-size:.82rem}.xbar .timer{font-size:1rem}}
.pg{position:relative;padding-bottom:6px}
.pg+.pg{border-top:1px dashed #999;margin-top:26px;padding-top:18px}
.pg .ph2{display:flex;justify-content:flex-end;border-bottom:1.5px solid #111;padding-bottom:4px;font-weight:700;font-size:.85rem}
.pg .pf{text-align:center;font-size:.8rem;color:#555;margin-top:6px}
body.mockon .wrap{max-width:1120px}
.msetup{padding:20px 0}
.msetup h2{font-family:var(--f-display);font-size:1.3rem;margin:0 0 6px}
.msetup .row{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin:10px 0}
.msetup .row .lab{font-size:.78rem;color:var(--muted);min-width:3em}
.msetup .info{font-size:.84rem;color:var(--muted);margin:8px 0 14px}
.hist{width:100%;border-collapse:collapse;font-size:.82rem;margin-top:18px}
.hist th,.hist td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--soft)}
.hist th{color:var(--muted);font-weight:600;font-size:.74rem}
.xbar{position:sticky;top:0;z-index:6;background:var(--bg);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--soft2)}
.xbar .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem}
.xbar .timer.low{color:var(--bad)}
.xbar .cnt{font-size:.82rem;color:var(--muted)}
.xbar .sp{flex:1}
.sheet{background:#fff;border:1px solid #cfcfcb;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:28px 26px 40px;margin:16px 0}
.sheet .ttl{display:flex;align-items:flex-end;justify-content:center;position:relative;border-bottom:2px solid #111;padding-bottom:8px}
.sheet .ttl h2{font-family:var(--f-body);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:-.01em;text-align:center}
.sheet .ttl .pno{position:absolute;right:0;bottom:4px;font-family:"Times New Roman",serif;font-size:2.2rem;font-weight:700;line-height:1}
.cols{column-count:1;column-gap:34px;column-rule:1px solid #111;margin-top:14px}
@media (min-width:900px){.cols{column-count:2}}
.instr{display:inline-block;border:1px solid #111;padding:4px 10px;font-weight:700;font-size:.95rem;margin:4px 0 14px}
.sbox{display:block;width:fit-content;margin:6px auto 16px;border:1px solid #111;padding:3px 26px;font-weight:700;font-size:1.05rem;break-after:avoid}
.xq{break-inside:avoid;margin:0 0 22px;font-family:var(--f-body)}
.xq .qt{display:flex;gap:6px;font-size:.95rem;line-height:1.6}
.xq .qt b{flex:none}
.xq .bx{border:1px solid #111;padding:8px 10px;margin:8px 0 6px 18px;font-size:.9rem;white-space:pre-line}
.xq .fig{margin:6px 0 4px 18px;font-size:.78rem;color:#c0392b;font-weight:700}
.xq .gal{margin-left:18px}
.xq ol{list-style:none;padding:0;margin:6px 0 0 18px}
.xq li button{font:inherit;font-size:.92rem;background:transparent;border:0;color:var(--ink);text-align:left;padding:3px 6px;border-radius:12px;cursor:pointer;display:flex;gap:6px;width:100%}
.xq li button:hover{background:var(--soft)}
.xq li button[aria-pressed="true"]{background:#e9e9e6;font-weight:600}
.xq li button[aria-pressed="true"] .c{background:#111;color:#fff;border-radius:50%}
.xq .c{flex:none;width:1.25em;height:1.25em;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem}
.xq.rv-ok .qt b{color:var(--ok)} .xq.rv-bad .qt b{color:var(--bad)}
.xq li button.right{color:var(--ok);font-weight:700}
.xq li button.wrong{color:var(--bad);text-decoration:line-through}
.omr{position:fixed;right:12px;bottom:12px;top:70px;width:min(300px,calc(100vw - 24px));background:#fff;border:1px solid #cfcfcb;box-shadow:0 6px 24px rgba(0,0,0,.15);border-radius:6px;overflow:auto;z-index:8;padding:10px 12px}
.omr h3{margin:0 0 6px;font-size:.9rem}
.omr .r{display:flex;align-items:center;gap:3px;font-size:.78rem;padding:2px 0;border-bottom:1px dotted #e3e3e0}
.omr .r .n{width:2.2em;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);cursor:pointer;margin-right:4px}
.omr .r button{border:1px solid #b9b9b4;background:#fff;border-radius:50%;width:22px;height:22px;font-size:.66rem;cursor:pointer;color:#555;padding:0}
.omr .r button[aria-pressed="true"]{background:#111;color:#fff;border-color:#111}
.omr .sub{font-size:.72rem;color:var(--muted);margin:8px 0 2px;font-weight:600}
.rtable{width:100%;border-collapse:collapse;font-size:.88rem;margin:10px 0}
.rtable th,.rtable td{padding:7px 8px;border-bottom:1px solid var(--soft2);text-align:left}
.rtable td.fail{color:var(--bad);font-weight:700}
.verdict{font-family:var(--f-display);font-size:1.3rem;margin:10px 0 4px}
.verdict.pass{color:var(--ok)} .verdict.fail{color:var(--bad)}

</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>위생사 기출 반복풀이</h1>
  <p class="sub">제42~47회 기출 1,240문제(1·2교시) + 제42~45회 3교시 실기. 정답은 국시원 최종답안 기준이에요. 실기 사진은 시험에서 비공개라, 문제 정답으로 대상을 추정해 같은 대상의 공개 사진을 여러 장 넣었어요.</p>
</header>
<div class="bar" id="bar">
  <div class="tabs" id="modes"></div>
  <div class="tabs" id="subjects"></div>
  <div class="tabs" id="rounds"></div>
  <div class="tools">
    <button class="primary" id="newset">새 세트</button>
    <button id="redo">이 세트 다시 풀기</button>
    <button id="shuf" aria-pressed="true">보기 섞기</button>
    <span id="sizeSel"></span>
    <span class="score" id="score"></span>
  </div>
</div>
<main id="list"></main>
<footer>사진 출처는 각 사진 아래에 표시했어요(Wikimedia Commons·iNaturalist·논문·판매처 등). 개인 학습용으로만 써 주세요. 실제 시험 사진과 다를 수 있으니, 대상의 생김새를 익히는 용도로 보세요. 기록은 이 브라우저에만 저장돼요.</footer>
</div>
<script>
const QS=[{"id":"42-1-1","r":42,"p":1,"n":1,"s":"위생관계법령","q":"「공중위생관리법」이 적용되지 <u>않는</u> 영업은?","o":["세탁업","소독업","목욕장업","피부미용업","건물위생관리업"],"a":2,"e":"공중위생관리법의 공중위생영업은 숙박업·목욕장업·이용업·미용업·세탁업·건물위생관리업이며, 소독업은 「감염병의 예방 및 관리에 관한 법률」에서 규율하므로 적용되지 않는다. 피부미용업은 미용업에 포함되고, 건물위생관리업도 공중위생영업에 해당한다."},{"id":"42-1-2","r":42,"p":1,"n":2,"s":"위생관계법령","q":"「공중위생관리법」상 위생사의 위생업무 중 대통령령으로 정한 업무는?","o":["보건관리업무","음료수의 처리","위생용품의 위생관리","공중위생영업소의 위생관리","유해 곤충·설치류 및 매개체 관리"],"a":1,"e":"위생사 업무 중 법률에 열거된 것 외에 대통령령으로 정한 업무는 소독업무와 보건관리업무이다. 음료수의 처리, 공중위생영업소·위생용품의 위생관리, 유해 곤충·설치류 및 매개체 관리는 대통령령이 아니라 법률에 직접 규정된 위생사 업무이다."},{"id":"42-1-3","r":42,"p":1,"n":3,"s":"위생관계법령","q":"「공중위생관리법」상 공중위생영업자가 준수하여야 하는 위생관리기준 등으로 옳은 것은?","o":["목욕장의 욕조수는 매년 1회 이상 수질검사를 하여야 한다.","피부미용 시 안전을 위해 약사법에 따른 의약품을 사용하여야 한다.","숙박업장의 객실 조명도는 60럭스 이상이 되도록 유지하여야 한다.","목욕장 수면실의 조명도는 20럭스 이상이 되도록 유지하여야 한다.","이용업자의 작업장 조명도는 70럭스 이상이 되도록 유지하여야 한다."],"a":1,"e":"목욕장업자는 욕조수에 대해 매년 1회 이상 수질검사를 받아야 한다. 숙박업 객실·이용업 작업장 조명도는 75럭스 이상이 기준이므로 60럭스·70럭스는 틀리고, 피부미용에는 약사법상 의약품을 사용해서는 안 된다."},{"id":"42-1-4","r":42,"p":1,"n":4,"s":"위생관계법령","q":"「공중위생관리법」상 (    )에 들어갈 것으로 옳은 것은?","o":["50","100","500","1,000","3,000"],"a":4,"b":"해수를 목욕물로 사용할 때 총대장균군수는 100 mL당 (    ) 이하가 되어야 한다.","e":"목욕물로 해수를 사용할 경우 원수의 총대장균군은 100 mL당 1,000 이하여야 한다. 해수는 담수보다 기준이 완화되어 있어 50이나 100 같은 작은 값과 혼동하지 않도록 한다."},{"id":"42-1-5","r":42,"p":1,"n":5,"s":"위생관계법령","q":"「공중위생관리법」상 이용기구 및 미용기구의 소독 기준으로 옳지 <u>않은</u> 것은?","o":["자외선소독: 1 cm²당 70 μW 이상의 자외선을 20분 이상 쬐어준다.","건열멸균소독: 섭씨 100℃ 이상의 건조한 열에 20분 이상 쐬어준다.","증기소독: 섭씨 100℃ 이상의 습한 열에 20분 이상 쐬어준다.","열탕소독: 섭씨 100℃ 이상의 물속에 10분 이상 끓여준다.","에탄올소독: 에탄올수용액(에탄올 70%인 수용액)에 10분 이상 담가둔다."],"a":1,"e":"이·미용기구의 자외선소독 기준은 1 cm²당 85 μW 이상의 자외선을 20분 이상 쬐는 것이므로 70 μW는 틀린 기준이다. 건열멸균·증기소독은 100℃ 이상에서 20분 이상, 열탕소독은 100℃ 이상에서 10분 이상, 에탄올소독은 70% 에탄올에 10분 이상 담그는 것으로 모두 옳다."},{"id":"42-1-6","r":42,"p":1,"n":6,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 것으로 옳은 것은?","o":["1","2","3","5","10"],"a":4,"b":"식품의약품안전처장은 관계 중앙행정기관의 장과의 협의 및 심의위원회의 심의를 거쳐 식품등의 기준 및 규격 관리 기본계획을 (    )년마다 수립·추진할 수 있다.","e":"식품의약품안전처장은 관계 중앙행정기관의 장과 협의하고 심의위원회 심의를 거쳐 식품등의 기준 및 규격 관리 기본계획을 5년마다 수립·추진할 수 있다. 식품이력추적관리 조사·평가 주기(영유아식품 2년)와 혼동하지 않도록 한다."},{"id":"42-1-7","r":42,"p":1,"n":7,"s":"위생관계법령","q":"「식품위생법」상 식품 등의 위해평가를 위한 위해요소가 <u>아닌</u> 것은?","o":["중금속","잔류농약","트랜스지방","식중독 유발 세균","잔류 동물용 의약품"],"a":3,"e":"위해평가 대상 위해요소는 잔류농약·중금속·식품첨가물·잔류 동물용 의약품 등 화학적 요인, 식중독 유발 세균·바이러스 등 생물학적 요인, 방사선 등 물리적 요인이다. 트랜스지방은 영양표시·관리 대상 성분일 뿐 위해평가의 위해요소로 규정되어 있지 않다."},{"id":"42-1-8","r":42,"p":1,"n":8,"s":"위생관계법령","q":"「식품위생법」상 소비자식품위생감시원의 직무로 옳은 것은?","o":["식품등의 압류·폐기","행정처분의 이행 여부 확인","영업소의 폐쇄를 위한 간판의 제거","시설기준의 적합 여부의 확인·검사","식품접객영업자에 대한 위생관리 상태 점검"],"a":5,"e":"소비자식품위생감시원은 식품접객영업자의 위생관리 상태 점검, 허위표시 확인, 식품위생감시원의 수거·검사 지원 등 보조적 직무를 한다. 식품등의 압류·폐기, 행정처분 이행 확인, 간판 제거, 시설기준 적합 여부 확인·검사는 공무원인 식품위생감시원의 직무이다."},{"id":"42-1-9","r":42,"p":1,"n":9,"s":"위생관계법령","q":"「식품위생법」상 식품조사처리업의 허가권자는?","o":["보건복지부장관","농림축산식품부장관","식품의약품안전처장","시·도지사","원자력안전위원장"],"a":3,"e":"방사선을 쬐어 식품의 보존성을 높이는 식품조사처리업은 식품의약품안전처장의 허가를 받아야 한다. 시·도지사 허가 대상(단란주점·유흥주점 등)이나 원자력안전위원장과 혼동하지 않도록 한다."},{"id":"42-1-10","r":42,"p":1,"n":10,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 것으로 옳은 것은?","o":["1","2","3","5","10"],"a":2,"b":"식품의약품안전처장은 식품이력추적관리기준에 따라 등록한 영유아 식품을 제조·가공 또는 판매하는 자에 대하여 식품이력추적관리기준 준수 여부 등을 (    )년마다 조사·평가하여야 한다.","e":"식품이력추적관리 등록 식품은 원칙적으로 3년마다 조사·평가하지만, 의무 등록 대상인 영유아식품 등은 2년마다 조사·평가하여야 한다. 일반 등록 식품의 주기인 3년과 혼동하기 쉽다."},{"id":"42-1-11","r":42,"p":1,"n":11,"s":"위생관계법령","q":"「식품위생법」상 식품안전정보원의 사업으로 옳은 것은?","o":["식품위생에 관한 교육·홍보","식품산업에 관한 조사·연구","식품이력추적관리의 등록·관리","식품등의 기준과 규격에 관한 사항","건강 위해가능 영양성 함량 모니터링"],"a":3,"e":"식품안전정보원은 식품안전정보의 수집·분석·제공, 식품이력추적관리의 등록·관리 및 정보시스템 운영, 이력추적관리 교육·홍보 등을 수행한다. 일반적인 식품위생 교육·홍보나 식품등의 기준과 규격에 관한 사항은 식품안전정보원의 고유 사업이 아니다."},{"id":"42-1-12","r":42,"p":1,"n":12,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 것으로 옳은 것은?","o":["1년 | 1천만 원","3년 | 3천만 원","5년 | 5천만 원","7년 | 7천만 원","10년 | 1억 원"],"a":5,"b":"기준·규격이 정해지지 아니한 화학적 합성품인 첨가물을 함유한 식품을 판매한 자에 대해서는 ( ㉠ ) 이하의 징역 또는 ( ㉡ ) 이하의 벌금에 처하거나 이를 병과할 수 있다.","e":"기준·규격이 고시되지 않은 화학적 합성품 등을 판매하는 것은 위해식품·병든 동물 고기 판매 등과 함께 가장 무거운 벌칙 대상으로, 10년 이하의 징역 또는 1억 원 이하의 벌금에 처하거나 이를 병과할 수 있다. 5년·5천만 원은 이보다 가벼운 위반에 해당하는 벌칙이다."},{"id":"42-1-13","r":42,"p":1,"n":13,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 제3급감염병은?","o":["E형간염","일본뇌염","인플루엔자","유행성이하선염","중동호흡기증후군(MERS)"],"a":2,"e":"일본뇌염은 모기 매개로 발생을 계속 감시해야 하는 제3급감염병이다. E형간염·유행성이하선염은 제2급, 인플루엔자는 제4급, 중동호흡기증후군(MERS)은 제1급감염병이다."},{"id":"42-1-14","r":42,"p":1,"n":14,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 시장·군수·구청장이 발병 신고를 받으면 그 즉시 발병 사실을 질병관리청장에게 통보하여야 하는 가축전염병은?","o":["결핵","탄저","야토병","일본뇌염","브루셀라증"],"a":2,"e":"인수공통감염병 중 탄저, 고병원성조류인플루엔자, 광견병 등은 가축전염병예방법에 따라 신고를 받은 시장·군수·구청장이 즉시 질병관리청장에게 통보해야 한다. 결핵·브루셀라증은 이 즉시 통보 대상 목록에 포함되지 않으며, 일본뇌염은 가축전염병이 아닌 모기 매개 감염병이다."},{"id":"42-1-15","r":42,"p":1,"n":15,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 장출혈성대장균 역학조사의 환경검체 대상으로 옳은 것은?","o":["보존식","상수도","지하수","공중시설의 물","냉·온수기의 물"],"a":5,"e":"장출혈성대장균감염증 역학조사의 환경검체로는 환자가 이용한 냉·온수기의 물 등 실제 섭취 경로의 물이 대상이 된다. 보존식은 환경검체가 아니라 식품검체에 해당한다. ※ 교재 확인 권장"},{"id":"42-1-16","r":42,"p":1,"n":16,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 감염병 환자, 식품, 동식물, 그 밖의 환경 등으로부터 고위험병원체를 분리한 자는 누구에게 지체 없이 신고하여야 하는가?","o":["환경부장관","식품의약품안전처장","질병관리청장","시·도지사","관할 보건소장"],"a":3,"e":"감염병 환자, 식품, 동식물, 그 밖의 환경 등에서 고위험병원체를 분리한 자는 지체 없이 질병관리청장에게 신고하여야 한다. 고위험병원체는 국가 차원의 관리가 필요하므로 시·도지사나 관할 보건소장이 아니라 질병관리청장이 신고처이다."},{"id":"42-1-17","r":42,"p":1,"n":17,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 약물소독에 사용되는 약품이 <u>아닌</u> 것은?","o":["석탄산 3% 수용액","메탄올 70% 수용액","크롤칼키 5% 수용액","생석회(대한약전 규격품)","포르마린(대한약전 규격품)"],"a":2,"e":"감염병예방법상 약물소독 약품은 석탄산수(3%), 크레졸수(3%), 승홍수(0.1%), 생석회, 크롤칼키수(5%), 포르마린 등이다. 메탄올은 인체 독성이 강해 소독약으로 쓰지 않으며, 소독용 알코올은 에탄올이다."},{"id":"42-1-18","r":42,"p":1,"n":18,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 일시적으로 집단급식소 업무 종사의 제한을 받는 감염병은?","o":["페스트","A형간염","디프테리아","신종인플루엔자","중증급성호흡기증후군(SARS)"],"a":2,"e":"업무 종사의 일시 제한 대상은 콜레라, 장티푸스, 파라티푸스, 세균성이질, 장출혈성대장균감염증, A형간염으로, 식품을 매개로 전파되는 소화기계 감염병이다. 페스트·디프테리아·SARS·신종인플루엔자는 제1급감염병으로 입원치료·격리 대상이지 이 조항의 대상이 아니다."},{"id":"42-1-19","r":42,"p":1,"n":19,"s":"위생관계법령","q":"「먹는물관리법」상 특별자치시장·특별자치도지사·시장·군수 또는 구청장이 지정하는 관리대상 먹는물 공동시설의 상시 이용인구는?","o":["50명 이상","100명 이상","500명 이상","1,000명 이상","5,000명 이상"],"a":1,"e":"시장·군수·구청장은 상시 이용인구가 50명 이상인 약수터·샘터·우물 등을 관리대상 먹는물공동시설로 지정하여 수질검사 등을 관리한다. 100명이나 500명 등 더 큰 수치와 혼동하지 않도록 한다."},{"id":"42-1-20","r":42,"p":1,"n":20,"s":"위생관계법령","q":"「먹는물관리법」상 먹는염지하수의 개발허가를 받아야 하는 자는?","o":["1일 취수능력 30톤 이상 개발하려는 자","1일 취수능력 50톤 이상 개발하려는 자","1일 취수능력 100톤 이상 개발하려는 자","1일 취수능력 200톤 이상 개발하려는 자","1일 취수능력 300톤 이상 개발하려는 자"],"a":5,"e":"샘물·염지하수 등의 개발허가 기준이 되는 취수능력은 1일 300톤 이상이므로 공식 정답은 300톤이다. 먹는샘물·먹는염지하수 제조업을 위한 개발은 취수량과 관계없이 허가 대상이라는 규정도 있으므로 함께 정리해 둔다. ※ 교재 확인 권장"},{"id":"42-1-21","r":42,"p":1,"n":21,"s":"위생관계법령","q":"「먹는물관리법」상 먹는샘물 제조업자가 실시하는 자가 품질검사에서 매일 1회 이상 실시하여야 하는 검사항목이 <u>아닌</u> 것은?","o":["냄새","색도","탁도","일반세균","수소이온농도"],"a":4,"e":"먹는샘물 제조업자의 자가품질검사에서 매일 1회 이상 하는 항목은 냄새·맛·색도·탁도·수소이온농도 같은 간이 이화학 항목이다. 일반세균 등 미생물 항목은 배양에 시간이 걸려 별도 주기(주 단위)로 검사한다. ※ 교재 확인 권장"},{"id":"42-1-22","r":42,"p":1,"n":22,"s":"위생관계법령","q":"「먹는물관리법」상 청문을 하여야 할 처분이 <u>아닌</u> 것은?","o":["품질관리인 자격취소","샘물등의 개발허가 취소","먹는물검사기관 지정취소","환경조사대행자 등록취소","먹는물관련영업자 영업장 폐쇄"],"a":1,"e":"먹는물관리법상 청문 대상은 샘물등의 개발허가 취소, 먹는물관련영업자의 영업장 폐쇄, 먹는물검사기관 지정취소, 환경영향조사대행자 등록취소 등 영업 기반을 박탈하는 처분이다. 품질관리인 자격취소는 청문 대상으로 열거되어 있지 않다."},{"id":"42-1-23","r":42,"p":1,"n":23,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물의 수질 기준 중 건강상 유해영향 무기물질이 <u>아닌</u> 것은?","o":["납(Pb)","비소(As)","아연(Zn)","수은(Hg)","크롬(Cr)"],"a":3,"e":"아연은 먹는물 수질기준에서 건강상 유해영향 무기물질이 아니라 심미적 영향물질(3 mg/L 이하)로 분류된다. 납·비소·수은·크롬은 모두 독성이 강한 건강상 유해영향 무기물질이다."},{"id":"42-1-24","r":42,"p":1,"n":24,"s":"위생관계법령","q":"「폐기물관리법」상 의료폐기물의 종류 중 병리계폐기물은?","o":["혈장","폐백신","폐혈액백","인체 장기","시험 배양액"],"a":5,"e":"병리계폐기물은 시험·검사 등에 사용된 배양액, 배양용기, 보관균주, 폐시험관, 슬라이드 등이다. 혈장·폐혈액백은 혈액오염폐기물, 인체 장기는 조직물류폐기물, 폐백신은 생물·화학폐기물에 해당한다."},{"id":"42-1-25","r":42,"p":1,"n":25,"s":"위생관계법령","q":"「하수도법」상 분뇨처리시설의 방류수수질기준으로 옳은 것은?","o":["총인(T-P): 20 mg/L 이하","총질소(T-N): 70 mg/L 이하","부유물질(SS): 30 mg/L 이하","화학적 산소요구량(COD): 60 mg/L 이하","생물화학적 산소요구량(BOD): 40 mg/L 이하"],"a":3,"e":"분뇨처리시설의 방류수수질기준은 부유물질(SS) 30 mg/L 이하이며, BOD도 30 mg/L 이하이다. 따라서 BOD 40 mg/L은 틀리고, 총질소는 60 mg/L, 총인은 8 mg/L 이하가 기준이다."},{"id":"42-1-26","r":42,"p":1,"n":26,"s":"환경위생학","q":"초미세먼지(PM-2.5)의 대기환경기준(24시간 평균치)은?","o":["35 μg/m³ 이하","40 μg/m³ 이하","45 μg/m³ 이하","50 μg/m³ 이하","55 μg/m³ 이하"],"a":1,"e":"대기환경기준상 초미세먼지(PM-2.5)의 24시간 평균치는 35 μg/m³ 이하, 연간 평균치는 15 μg/m³ 이하이다. 미세먼지(PM-10)의 24시간 기준인 100 μg/m³과 혼동하지 않도록 한다."},{"id":"42-1-27","r":42,"p":1,"n":27,"s":"환경위생학","q":"2차 대기오염물질은?","o":["PAN","미세먼지","아황산가스","이산화탄소","일산화탄소"],"a":1,"e":"PAN(peroxyacetyl nitrate)은 질소산화물과 탄화수소가 햇빛에 의해 광화학반응을 일으켜 생성되는 2차 대기오염물질이다. 아황산가스·일산화탄소·이산화탄소·미세먼지는 배출원에서 직접 나오는 1차 오염물질이다."},{"id":"42-1-28","r":42,"p":1,"n":28,"s":"환경위생학","q":"비중격천공을 일으키는 물질은?","o":["납(Pb)","비소(As)","크롬(Cr)","수은(Hg)","구리(Cu)"],"a":3,"e":"6가크롬은 점막을 부식시켜 비중격천공과 피부궤양을 일으키는 대표 물질이다. 수은은 미나마타병, 납은 빈혈과 연선(잇몸의 납 침착선), 비소는 흑피증 등과 연결해 기억한다."},{"id":"42-1-29","r":42,"p":1,"n":29,"s":"환경위생학","q":"대기오염물질의 자연적 발생원은?","o":["발전소","소각장","활화산","아연공장","디젤자동차"],"a":3,"e":"활화산은 이산화황·먼지 등을 내뿜는 대기오염물질의 자연적 발생원이다. 발전소·소각장·아연공장·디젤자동차는 모두 인간 활동에 의한 인위적 발생원이다."},{"id":"42-1-30","r":42,"p":1,"n":30,"s":"환경위생학","q":"식물에 독성 피해를 주는 물질은?","o":["산소(O₂)","헬륨(He)","아르곤(Ar)","불화수소(HF)","이산화탄소(CO₂)"],"a":4,"e":"불화수소(HF)는 아주 낮은 농도에서도 잎끝 괴사 등 식물에 독성 피해를 주는 대표 물질이다. 산소·이산화탄소는 식물의 호흡·광합성에 쓰이고, 헬륨·아르곤은 반응성이 없는 비활성 기체이다."},{"id":"42-1-31","r":42,"p":1,"n":31,"s":"환경위생학","q":"온열인자의 요소는?","o":["기온, 기습, 기압","기온, 기습, 지형","기온, 기습, 기류","기온, 기압, 복사량","기온, 기압, 일조량"],"a":3,"e":"온열인자(온열요소)는 기온·기습·기류이며, 여기에 복사열을 더하면 4대 온열인자가 된다. 기압이나 지형·일조량은 온열인자에 포함되지 않는다."},{"id":"42-1-32","r":42,"p":1,"n":32,"s":"환경위생학","q":"오존층을 파괴하는 물질은?","o":["수증기(H₂O)","프레온(CFCs)","황화수소(H₂S)","일산화탄소(CO)","이황화탄소(CS₂)"],"a":2,"e":"프레온가스(CFCs)는 성층권에서 자외선에 분해되어 나온 염소 원자가 오존을 연쇄적으로 파괴한다. 일산화탄소·황화수소는 독성 가스이지만 오존층 파괴의 주원인 물질이 아니다."},{"id":"42-1-33","r":42,"p":1,"n":33,"s":"환경위생학","q":"온실가스로 옳은 것은?","o":["붕소(B)","수소(H₂)","질소(N₂)","메탄(CH₄)","아르곤(Ar)"],"a":4,"e":"메탄(CH₄)은 이산화탄소·아산화질소·HFCs·PFCs·SF₆와 함께 6대 온실가스에 해당한다. 질소·수소·아르곤은 적외선을 거의 흡수하지 않아 온실가스가 아니다."},{"id":"42-1-34","r":42,"p":1,"n":34,"s":"환경위생학","q":"실내온도 18~20℃에서 적절한 습도의 범위는?","o":["0~9%","10~24%","25~39%","55~65%","85~95%"],"a":4,"e":"실내온도 18~20℃에서 쾌적한 습도는 대략 55~65% 범위이다. 습도가 너무 낮으면 호흡기 점막이 건조해지고, 85% 이상으로 높으면 불쾌감과 곰팡이 번식이 늘어난다."},{"id":"42-1-35","r":42,"p":1,"n":35,"s":"환경위생학","q":"다중이용시설 중 지하역사 및 영화상영관 등의 일산화탄소(CO)에 대한 실내공기질 유지기준은?","o":["10 ppm 이하","15 ppm 이하","20 ppm 이하","25 ppm 이하","30 ppm 이하"],"a":1,"e":"실내공기질관리법상 지하역사·영화상영관 등 다중이용시설의 일산화탄소 유지기준은 10 ppm 이하이다. 실내주차장은 25 ppm 이하로 따로 정해져 있어 혼동하기 쉽다."},{"id":"42-1-36","r":42,"p":1,"n":36,"s":"환경위생학","q":"공기에 의한 희석, 강우에 의한 세정으로 설명할 수 있는 현상은?","o":["온실효과","침강성 역전","복사성 역전","탄소의 동화 작용","공기의 자정 작용"],"a":5,"e":"공기의 자정 작용에는 희석, 강우에 의한 세정, 산화, 자외선 살균, 식물의 탄소동화작용이 포함된다. 문제에서 희석과 세정을 함께 묶어 말하므로 이를 모두 아우르는 공기의 자정 작용이 답이며, 탄소의 동화 작용은 그 일부에 불과하다."},{"id":"42-1-37","r":42,"p":1,"n":37,"s":"환경위생학","q":"정상 공기 중 아르곤(Ar) 등 미량원소를 제외한 O₂:N₂의 부피 백분율은?","o":["21:78","38:61","50:49","61:38","78:21"],"a":1,"e":"정상 공기의 부피 조성은 질소 약 78%, 산소 약 21%이므로 O₂:N₂는 21:78이다. 순서를 거꾸로 적은 78:21에 속지 않도록 한다."},{"id":"42-1-38","r":42,"p":1,"n":38,"s":"환경위생학","q":"다수의 사람이 모여 있는 밀폐된 공간에서 시간이 경과함에 따라 나타나는 현상은?","o":["실온 하강, 습도 하강, CO₂ 감소, O₂ 감소","실온 하강, 습도 상승, CO₂ 증가, O₂ 감소","실온 상승, 습도 상승, CO₂ 감소, O₂ 증가","실온 상승, 습도 하강, CO₂ 증가, O₂ 증가","실온 상승, 습도 상승, CO₂ 증가, O₂ 감소"],"a":5,"e":"밀폐 공간에 많은 사람이 모이면 체열과 호흡으로 실온과 습도가 오르고, CO₂는 증가하며 O₂는 감소하는 군집독이 나타난다. 하나라도 방향이 반대인 조합(실온 하강, CO₂ 감소 등)은 틀리다."},{"id":"42-1-39","r":42,"p":1,"n":39,"s":"환경위생학","q":"라돈에 대한 것으로 옳은 것은?","o":["색상: 노란색","취기: 자극성","원소기호: Ra","성상: 비활성 기체","인체 영향: 비발암성"],"a":4,"e":"라돈(Rn)은 무색·무취의 비활성(불활성) 방사성 기체로, 라듐(Ra)이 붕괴하며 생긴다. 원소기호 Ra는 라듐이고, 라돈은 흡연 다음가는 폐암 원인 물질이므로 비발암성이라는 설명도 틀리다."},{"id":"42-1-40","r":42,"p":1,"n":40,"s":"환경위생학","q":"이산화탄소(CO₂)의 실내공기질 유지기준은?","o":["0.001% 이하","0.01% 이하","0.1% 이하","1.0% 이하","10% 이하"],"a":3,"e":"실내공기질 유지기준에서 이산화탄소는 1,000 ppm 이하이며, 이는 0.1%에 해당한다(1% = 10,000 ppm). 0.01%(100 ppm)이나 1.0%(10,000 ppm)는 단위 환산을 잘못한 값이다."},{"id":"42-1-41","r":42,"p":1,"n":41,"s":"환경위생학","q":"30℃를 화씨온도로 환산하면 몇 °F인가?","o":["56","66","76","86","96"],"a":4,"e":"【공식】 °F = (9/5) × ℃ + 32\n【풀이】 (9/5) × 30 + 32 = 54 + 32 = 86 °F"},{"id":"42-1-42","r":42,"p":1,"n":42,"s":"환경위생학","q":"대기오염물질 중 입자상 물질은?","o":["퓸(fume)","황산화물(sulfur oxide)","황화수소(hydrogen sulfide)","질소산화물(nitrogen oxide)","일산화탄소(carbon monoxide)"],"a":1,"e":"퓸(fume)은 금속 증기가 응축·산화되어 생긴 미세한 고체 입자이므로 입자상 물질이다. 황산화물·질소산화물·황화수소·일산화탄소는 모두 가스상 물질이다."},{"id":"42-1-43","r":42,"p":1,"n":43,"s":"환경위생학","q":"오염된 실내공기를 관리하는 방법은?","o":["차광","환기","냉방","조명","건조"],"a":2,"e":"오염된 실내공기는 외부의 신선한 공기와 교환하는 환기로 관리하는 것이 기본이다. 냉방이나 건조는 온도·습도를 조절할 뿐 오염물질 농도를 낮추지 못한다."},{"id":"42-1-44","r":42,"p":1,"n":44,"s":"환경위생학","q":"부영양화 발생의 원인물질은?","o":["질소, 인","시안, 염소","페놀, 벤젠","불소, 카드뮴","칼슘, 나트륨"],"a":1,"e":"부영양화는 질소와 인 같은 영양염류가 호소·하천에 과다하게 유입되어 조류가 대량 번식하는 현상이다. 시안·페놀·카드뮴 등은 독성 오염물질이지만 부영양화의 원인물질은 아니다."},{"id":"42-1-45","r":42,"p":1,"n":45,"s":"환경위생학","q":"상수 처리 중 약품 침전에 사용하는 응집제는?","o":["염화칼륨(KCl)","황산망간(MnSO₄)","수산화칼륨(KOH)","과산화수소(H₂O₂)","황산알루미늄(Al₂(SO₄)₃)"],"a":5,"e":"황산알루미늄(명반)은 물속에서 수산화알루미늄 플록을 만들어 콜로이드·부유물을 응집·침전시키는 대표적인 응집제이다. 염화칼륨이나 수산화칼륨은 응집제가 아니며, 과산화수소는 산화제이다."},{"id":"42-1-46","r":42,"p":1,"n":46,"s":"환경위생학","q":"수질오염물질 중 영유아에게 메트헤모글로빈혈증(methemoglobinemia)을 일으키는 물질은?","o":["페놀(phenol)","암모니아(ammonia)","질산성질소(NO₃-N)","클로로포름(chloroform)","총트리할로메탄(THMs)"],"a":3,"e":"질산성질소는 영유아 체내에서 아질산염으로 환원되어 헤모글로빈을 메트헤모글로빈으로 바꾸므로 청색증(blue baby)을 일으킨다. 총트리할로메탄·클로로포름은 염소 소독 부산물로 발암성이 문제가 된다."},{"id":"42-1-47","r":42,"p":1,"n":47,"s":"환경위생학","q":"지하수와 비교할 때 나타나는 지표수의 특성으로 옳은 것은?","o":["탁도가 낮다.","경도가 낮다.","알칼리도가 높다.","오염 가능성이 적다.","수온의 계절 변화가 적다."],"a":2,"e":"지표수는 지층의 칼슘·마그네슘을 덜 녹여 지하수보다 경도가 낮다. 반면 탁도가 높고, 오염 가능성이 크며, 계절에 따른 수온 변화도 크다."},{"id":"42-1-48","r":42,"p":1,"n":48,"s":"환경위생학","q":"원수 처리의 단위 조작 중 부유물질 처리 공정은?","o":["중화","산화","응집","용해","이온교환"],"a":3,"e":"응집은 응집제를 넣어 작은 부유물질·콜로이드를 큰 플록으로 뭉쳐 침전·여과로 제거하는 공정이다. 중화는 pH 조절, 이온교환은 용존 이온 제거를 위한 공정이다."},{"id":"42-1-49","r":42,"p":1,"n":49,"s":"환경위생학","q":"물의 경도를 유발하는 원인물질은?","o":["비소(As)","칼슘(Ca)","크롬(Cr)","수은(Hg)","나트륨(Na)"],"a":2,"e":"물의 경도는 주로 칼슘(Ca²⁺)과 마그네슘(Mg²⁺) 이온 때문에 생긴다. 나트륨은 1가 이온이라 경도 유발 물질이 아니고, 비소·수은·크롬은 독성 중금속이다."},{"id":"42-1-50","r":42,"p":1,"n":50,"s":"환경위생학","q":"호소(湖沼)의 성층화를 일으키는 인자는?","o":["경도","수온","탁도","수압","표면장력"],"a":2,"e":"호소의 성층화는 수온에 따른 물의 밀도 차이로 표수층·수온약층·심수층이 나뉘는 현상이다. 여름에는 성층이 뚜렷하고, 봄·가을에는 수온이 비슷해져 전도(turnover)가 일어난다."},{"id":"42-1-51","r":42,"p":1,"n":51,"s":"환경위생학","q":"상수 처리에서 철(Fe)의 제거법으로 옳은 것은?","o":["희석(dilution)","포기(aeration)","여과(filtration)","소독(disinfection)","침사(sedimentation)"],"a":2,"e":"포기(aeration)는 물에 공기를 불어넣어 용해성 2가 철을 불용성 3가 철로 산화시킨 뒤 침전·여과로 제거하는 방법이다. 여과만으로는 녹아 있는 철을 거르지 못하므로 포기로 먼저 산화하는 과정이 핵심이다."},{"id":"42-1-52","r":42,"p":1,"n":52,"s":"환경위생학","q":"다음 상수도의 계통도에서 (    ) 안에 들어갈 내용은?","o":["여과 | 침전","정수 | 배수","침사 | 여과","소독 | 침전","침사 | 소독"],"a":2,"b":"수원 – 취수 – 도수 – ( ㉠ ) – 송수 – ( ㉡ ) – 급수","e":"상수도 계통은 수원 → 취수 → 도수 → 정수 → 송수 → 배수 → 급수 순서이다. 침전·여과·소독은 정수 과정 안에서 이루어지는 세부 공정이므로 계통도 단계에 들어가지 않는다."},{"id":"42-1-53","r":42,"p":1,"n":53,"s":"환경위생학","q":"하수 처리 중 활성슬러지 처리 원리는?","o":["기계적","물리적","화학적","혐기성","호기성"],"a":5,"e":"활성슬러지법은 포기조에 공기(산소)를 불어넣어 호기성 미생물(플록)이 유기물을 산화·분해하게 하는 생물학적 처리법이다. 혐기성은 산소 없이 메탄발효가 일어나는 슬러지 소화 공정의 원리이고, 기계적·물리적 처리는 스크린·침사·침전 같은 1차 처리에 해당한다."},{"id":"42-1-54","r":42,"p":1,"n":54,"s":"환경위생학","q":"하·폐수의 발생 지점에 따라 구별되는 비점오염원은?","o":["공장","폐광","발전소","농경지","폐수 처리장"],"a":4,"e":"비점오염원은 배출 지점이 특정되지 않고 빗물 등에 씻겨 넓은 지역에서 유출되는 오염원으로, 농경지·도로·임야·도시 노면 등이 대표적이다. 공장, 발전소, 폐수 처리장은 배출구가 특정되는 점오염원이다."},{"id":"42-1-55","r":42,"p":1,"n":55,"s":"환경위생학","q":"공기가 존재하지 않는 조건하에서 환원반응으로 진행되는 슬러지 처리 공정은?","o":["개량","건조","농축","소화","탈수"],"a":4,"e":"소화(혐기성 소화)는 산소가 없는 상태에서 혐기성 미생물이 슬러지 유기물을 유기산을 거쳐 메탄과 이산화탄소로 분해(환원)하는 공정이다. 농축·탈수·건조는 수분을 줄이는 물리적 공정이고, 개량은 탈수가 잘 되도록 약품 등을 넣는 전처리다."},{"id":"42-1-56","r":42,"p":1,"n":56,"s":"환경위생학","q":"하·폐수의 특성에 대한 설명으로 옳은 것은?","o":["부영양화 발생은 수질을 개선한다.","유기물의 농도가 높아지면 BOD가 상승한다.","COD가 높다는 것은 수질이 좋다는 것을 의미한다.","DO가 높다는 것은 수질이 나쁘다는 것을 의미한다.","조류(algae)의 개체 수가 많아지면 수질이 좋아진다."],"a":2,"e":"BOD는 미생물이 유기물을 분해할 때 소비하는 산소량이므로 유기물 농도가 높을수록 BOD가 상승한다. COD가 높으면 오히려 오염이 심하다는 뜻이고, DO가 높으면 수질이 좋다는 뜻이다. 부영양화와 조류 증식은 수질을 악화시킨다."},{"id":"42-1-57","r":42,"p":1,"n":57,"s":"환경위생학","q":"하·폐수 처리 시설 중 침강성 고형물을 제거하기 위해 스크린과 침사지 다음에 설치하는 시설은?","o":["포기조","침전조","부패조","소독조","부상조"],"a":2,"e":"하수 처리 순서는 스크린 → 침사지 → (1차) 침전조 → 포기조 → 2차 침전조 → 소독조이며, 침사지 다음의 침전조에서 침강성 부유물을 가라앉혀 제거한다. 포기조는 생물학적 2차 처리, 소독조는 마지막 단계다."},{"id":"42-1-58","r":42,"p":1,"n":58,"s":"환경위생학","q":"폐수 중의 기름 성분을 분리하는 단위조작법은?","o":["고도처리법","부상분리법","활성오니법","섬모상생물접촉법","연속회분식반응법"],"a":2,"e":"부상분리법은 미세 기포를 불어넣어 물보다 가벼운 기름·부유물을 수면으로 띄워 걷어내는 물리적 단위조작이다. 활성오니법과 섬모상생물접촉법, 연속회분식반응법은 유기물을 미생물로 분해하는 생물학적 처리법이다."},{"id":"42-1-59","r":42,"p":1,"n":59,"s":"환경위생학","q":"슬러지의 혐기성 처리 과정에서 발생하는 물질은?","o":["CH₄","C₂H₂","C₃H₈","C₄H₁₀","C₆H₆"],"a":1,"e":"슬러지의 혐기성 소화에서는 메탄(CH₄, 약 60~70%)과 이산화탄소가 주로 발생하며, 이 소화가스는 연료로 회수할 수 있다. 아세틸렌, 프로판, 부탄, 벤젠은 혐기성 소화의 주산물이 아니다."},{"id":"42-1-60","r":42,"p":1,"n":60,"s":"환경위생학","q":"사업장 폐기물에서 수분 함량 95% 미만, 고형물 함량 5% 이상인 지정폐기물은?","o":["오니류","소각재","폐농약","폐흡착제","폐합성고무"],"a":1,"e":"「폐기물관리법」 시행령상 특정시설에서 발생되는 지정폐기물 중 오니류는 수분 함량 95% 미만이거나 고형물 함량 5% 이상인 것으로 규정된다. 소각재와 폐흡착제는 유해물질 함유 폐기물로, 폐농약과 폐합성고무는 별도 항목으로 분류된다."},{"id":"42-1-61","r":42,"p":1,"n":61,"s":"환경위생학","q":"가연성 폐기물은?","o":["금속","도기","석기","초자","폐지"],"a":5,"e":"폐지(종이)는 나무·플라스틱·고무·섬유와 함께 대표적인 가연성 폐기물이다. 금속, 도기, 석기, 초자(유리)는 타지 않는 불연성 폐기물이다."},{"id":"42-1-62","r":42,"p":1,"n":62,"s":"환경위생학","q":"위해 의료폐기물 중 인체 또는 동물의 장기·기관·신체의 일부는 어떤 폐기물로 분류하는가?","o":["손상성폐기물","병리계폐기물","조직물류폐기물","혈액오염폐기물","생물·화학폐기물"],"a":3,"e":"「폐기물관리법」상 조직물류폐기물은 인체 또는 동물의 조직·장기·기관·신체의 일부, 동물의 사체, 혈액·고름 및 혈액생성물(혈청·혈장·혈액제제)을 말한다. 병리계폐기물은 시험·검사에 쓰인 배양액·배양용기·슬라이드 등이고, 손상성폐기물은 주삿바늘·수술용 칼날 등이다."},{"id":"42-1-63","r":42,"p":1,"n":63,"s":"환경위생학","q":"생활폐기물을 소각방법으로 처리할 경우 소각로의 단점은?","o":["설치 면적이 적다.","악취 발생이 없다.","건설비가 많이 든다.","폐열을 이용할 수 없다.","매립보다 처리 기간이 길다."],"a":3,"e":"소각은 건설비와 운영비가 많이 들고 다이옥신 등 대기오염 물질이 생길 수 있다는 것이 단점이다. 설치 면적이 적다는 것과 처리 기간이 매립보다 짧다는 것은 장점이며, 소각 시 발생하는 폐열은 회수해 이용할 수 있다."},{"id":"42-1-64","r":42,"p":1,"n":64,"s":"환경위생학","q":"지정폐기물 중 특정시설에서 발생되는 폐기물로 옳은 것은?","o":["폐유","폐산","폐촉매","폐알칼리","폐합성 고분자화합물"],"a":5,"e":"「폐기물관리법」 시행령상 특정시설에서 발생되는 지정폐기물에는 폐합성 고분자화합물(폐합성수지·폐합성고무), 오니류, 폐농약이 포함된다. 폐산과 폐알칼리는 부식성 폐기물, 폐촉매는 유해물질 함유 폐기물이며, 폐유는 별도 항목이다."},{"id":"42-1-65","r":42,"p":1,"n":65,"s":"환경위생학","q":"우리나라 폐기물 관리에서 자원 생산성의 향상을 위해 우선으로 하는 것은?","o":["소각","매립","퇴비","재활용","고형연료화"],"a":4,"e":"자원순환 원칙상 폐기물 관리 우선순위는 발생 억제 → 재사용 → 재활용(물질 재활용) → 에너지 회수 → 소각·매립 등 최종 처분 순이므로, 자원 생산성 향상을 위해 재활용을 우선한다. 고형연료화는 에너지 회수에 해당해 재활용보다 후순위이고, 소각·매립은 최후 수단이다."},{"id":"42-1-66","r":42,"p":1,"n":66,"s":"환경위생학","q":"근로자의 육체적 작업강도 지표로 사용되는 것은?","o":["안정대사량","기초대사량","작업밀도량","재해발생률","에너지대사율"],"a":5,"e":"에너지대사율(RMR)은 (작업 시 소비에너지 − 안정 시 소비에너지) ÷ 기초대사량으로 구하며, 근로자의 육체적 작업강도를 나타내는 지표다. 기초대사량은 생명 유지에 필요한 최소 에너지로 RMR 계산의 기준값일 뿐, 그 자체가 작업강도 지표는 아니다."},{"id":"42-1-67","r":42,"p":1,"n":67,"s":"환경위생학","q":"손가락의 혈관이 수축하고 혈류량이 감소하여 창백해지는 장애의 원인은?","o":["소음","진동","방사선","기압변동","고온작업"],"a":2,"e":"착암기·전기톱 등 국소진동에 오래 노출되면 손가락 혈관이 수축해 하얗게 변하는 레이노 현상(백지증)이 생긴다. 소음은 소음성 난청, 기압변동은 잠함병(감압병)의 원인이다."},{"id":"42-1-68","r":42,"p":1,"n":68,"s":"환경위생학","q":"벤젠을 사용하는 작업장의 근로자에게 주로 나타날 수 있는 직업병은?","o":["흑피증","구내염","백혈병","단백뇨","골연화"],"a":3,"e":"벤젠은 골수를 손상시켜 재생불량성 빈혈 등 조혈장애와 백혈병을 일으키는 대표적 직업성 발암물질이다. 흑피증은 비소, 구내염은 수은, 단백뇨·골연화는 카드뮴 중독의 특징이다."},{"id":"42-1-69","r":42,"p":1,"n":69,"s":"환경위생학","q":"습열멸균의 소독 방법은?","o":["화염 멸균법","방사선 멸균법","자외선 멸균법","초음파 멸균법","고압증기 멸균법"],"a":5,"e":"고압증기 멸균법은 포화수증기를 이용하는 습열멸균으로, 보통 121℃에서 15~20분 처리해 아포까지 사멸시킨다. 화염 멸균법은 건열멸균이고, 자외선·방사선·초음파 멸균법은 열을 쓰지 않는 방법이다."},{"id":"42-1-70","r":42,"p":1,"n":70,"s":"환경위생학","q":"화학적 소독제로 사용되는 크레졸의 농도는?","o":["3%","10%","15%","20%","25%"],"a":1,"e":"크레졸은 보통 3% 수용액(크레졸 비누액)으로 사용하며 석탄산보다 살균력이 약 2배 강하고 배설물·오물 소독에 쓴다. 10% 이상 농도는 일반 소독 농도가 아니다."},{"id":"42-1-71","r":42,"p":1,"n":71,"s":"환경위생학","q":"균체의 단백질이나 핵산의 알킬화 작용으로 강한 살균력을 나타내는 기체 소독제는?","o":["붕산","질산은","생석회","요오드","에틸렌옥사이드"],"a":5,"e":"에틸렌옥사이드(EO 가스)는 균체 단백질과 핵산을 알킬화해 아포까지 죽이는 기체 소독제로, 열에 약한 의료기구의 저온 가스 멸균에 쓰인다. 요오드는 산화 작용, 생석회는 분변 등 오물 소독에 쓰이는 고체 소독제다."},{"id":"42-1-72","r":42,"p":1,"n":72,"s":"환경위생학","q":"살균력이 강하여 약 1,000배로 희석하여 사용하는 소독제는?","o":["승홍","생석회","석탄산수","포르말린","크레졸수"],"a":1,"e":"승홍(염화제이수은)은 살균력이 매우 강해 0.1%(약 1,000배 희석) 수용액으로 손 소독 등에 쓰이며, 금속 부식성과 독성이 강하다. 석탄산수와 크레졸수는 3% 정도로 사용하므로 1,000배 희석과 맞지 않는다."},{"id":"42-1-73","r":42,"p":1,"n":73,"s":"환경위생학","q":"창문의 채광 조건 중 입사각으로 가장 좋은 것은?","o":["12°","16°","20°","24°","28°"],"a":5,"e":"실내 채광 기준은 창의 입사각 28° 이상, 개각(가시각) 4~5° 이상, 창 면적은 바닥 면적의 1/7~1/5 정도다. 따라서 보기 중 입사각이 가장 큰 28°가 가장 좋은 조건이다."},{"id":"42-1-74","r":42,"p":1,"n":74,"s":"환경위생학","q":"아포(spore)를 포함한 모든 미생물을 파괴하는 것은?","o":["멸균","소독","방부","정균","발효"],"a":1,"e":"멸균은 아포를 포함한 모든 미생물을 완전히 사멸시키는 것이다. 소독은 병원성 미생물을 죽이거나 감염력을 없애는 것으로 아포까지는 못 죽일 수 있고, 방부·정균은 미생물 증식을 억제하는 데 그친다."},{"id":"42-1-75","r":42,"p":1,"n":75,"s":"환경위생학","q":"「악취방지법」상 지정악취물질은?","o":["암모니아","일산화질소","이산화질소","이산화탄소","일산화탄소"],"a":1,"e":"「악취방지법」상 지정악취물질에는 암모니아, 황화수소, 메틸메르캅탄, 트라이메틸아민, 아세트알데하이드, 스타이렌, 톨루엔 등이 있다. 일산화질소·이산화질소·일산화탄소·이산화탄소는 대기오염물질이지만 지정악취물질은 아니다."},{"id":"42-1-76","r":42,"p":1,"n":76,"s":"위생곤충학","q":"분류학상 곤충강에 속하는 것은?","o":["거미","전갈","지네","파리","진드기"],"a":4,"e":"곤충강은 몸이 머리·가슴·배 세 부분이고 다리 3쌍, 더듬이 1쌍인데 파리가 이에 해당한다. 거미·전갈·진드기는 다리가 4쌍인 거미강, 지네는 순각강(지네강)이다."},{"id":"42-1-77","r":42,"p":1,"n":77,"s":"위생곤충학","q":"모기의 구기(mouthpart) 형태는?","o":["저작형","핥는형","스폰지형","저작흡수형","천공흡수형"],"a":5,"e":"모기는 가늘고 긴 주둥이로 피부를 찔러 피를 빨아들이는 천공흡수형 구기를 가진다. 바퀴는 저작형, 집파리는 핥아 먹는 스폰지형 구기다."},{"id":"42-1-78","r":42,"p":1,"n":78,"s":"위생곤충학","q":"약충과 성충의 서식처가 같은 위생곤충은?","o":["모기","벼룩","빈대","파리","독나방"],"a":3,"e":"빈대는 불완전변태 곤충으로 약충과 성충이 모양·습성이 비슷해 같은 가옥 틈에 함께 살며 둘 다 흡혈한다. 모기와 파리는 완전변태로 유충(물, 퇴비 등)과 성충의 서식처가 다르고, 벼룩도 유충은 바닥 먼지 속 유기물을 먹고 성충은 숙주 체표에 산다."},{"id":"42-1-79","r":42,"p":1,"n":79,"s":"위생곤충학","q":"구기가 퇴화된 곤충으로 알레르기원이 되는 위생곤충은?","o":["등에","말벌","벼룩","깔따구","참진드기"],"a":4,"e":"깔따구 성충은 구기가 퇴화해 흡혈하지 않지만, 물가에서 대량 발생해 사체 부스러기가 천식 등 알레르기를 일으킨다. 등에·벼룩·참진드기는 흡혈하고 말벌은 독침으로 피해를 준다."},{"id":"42-1-80","r":42,"p":1,"n":80,"s":"위생곤충학","q":"매개곤충과 질병의 연결이 옳은 것은?","o":["이 – 사상충증","빈대 – 일본뇌염","등에모기 – 페스트","모기 – 발진티프스","참진드기 – 라임병"],"a":5,"e":"참진드기는 라임병(보렐리아균)과 중증열성혈소판감소증후군(SFTS) 등을 매개한다. 발진티푸스는 이, 페스트는 벼룩이 매개하고, 모기는 일본뇌염·말라리아·사상충증을 매개한다."},{"id":"42-1-81","r":42,"p":1,"n":81,"s":"위생곤충학","q":"뉴슨스(nuisance) 곤충은?","o":["먹파리","모래파리","하루살이","열대쥐벼룩","작은빨간집모기"],"a":3,"e":"뉴슨스 곤충은 질병을 매개하거나 흡혈하지 않지만 대량 발생으로 불쾌감을 주는 곤충으로, 하루살이·깔따구 등이 대표적이다. 먹파리(회선사상충증), 모래파리(리슈마니아증), 열대쥐벼룩(페스트), 작은빨간집모기(일본뇌염)는 질병 매개 곤충이다."},{"id":"42-1-82","r":42,"p":1,"n":82,"s":"위생곤충학","q":"위생곤충 방제에 발육억제제로 사용되는 약제는?","o":["펜티온(fenthion)","카바릴(carbaryl)","피레스린(pyrethrin)","크마포스(coumaphos)","메소프렌(methoprene)"],"a":5,"e":"메소프렌은 유약호르몬 유사체(곤충성장조절제, IGR)로 유충이 정상적으로 탈피·변태하지 못하게 해 발육을 억제한다. 펜티온·크마포스는 유기인계, 카바릴은 카바메이트계, 피레스린은 천연 피레트린계로 신경에 작용하는 살충제다."},{"id":"42-1-83","r":42,"p":1,"n":83,"s":"위생곤충학","q":"독먹이법으로 방제할 수 있는 위생곤충은?","o":["등에","바퀴","빈대","깔따구","진드기"],"a":2,"e":"바퀴는 잡식성이라 살충제를 섞은 독먹이(히드라메틸논, 붕산 먹이 등)에 잘 유인되어 독먹이법이 효과적이다. 빈대·진드기·등에는 흡혈성이라 먹이로 유인하기 어렵고, 깔따구 성충은 먹이를 거의 먹지 않는다."},{"id":"42-1-84","r":42,"p":1,"n":84,"s":"위생곤충학","q":"살충제 제제 중 마이크로캡슐제의 특징으로 옳은 것은?","o":["잔류기간이 짧다.","약제 기피성이 증가한다.","수서해충 방제에 사용한다.","살포하면 용매 냄새가 난다.","인체에 대한 안전성이 높다."],"a":5,"e":"마이크로캡슐제는 살충제를 고분자 막으로 감싸 천천히 방출시키므로 잔류 기간이 길고, 냄새·기피성이 적으며 피부 흡수가 줄어 인체 안전성이 높다. 잔류기간이 짧다거나 용매 냄새가 난다는 것은 반대 설명이다."},{"id":"42-1-85","r":42,"p":1,"n":85,"s":"위생곤충학","q":"분사되는 살충제 입자가 50~100 μm로 공간살포와 잔류분무의 살충 효과를 낼 수 있는 방법은?","o":["훈연","훈증","미스트","가열연무","극미량연무"],"a":3,"e":"미스트는 입자 크기 약 50~100 μm로, 공중에 떠 있는 곤충을 죽이는 공간살포 효과와 표면에 내려앉아 남는 잔류 효과를 함께 낸다. 가열연무와 극미량연무는 입자가 더 작아 공간살포 효과가 주이고, 훈증은 기체 상태로 밀폐 공간에 쓴다."},{"id":"42-1-86","r":42,"p":1,"n":86,"s":"위생곤충학","q":"가열연무의 설명으로 옳은 것은?","o":["정오에 살포한다.","분사구는 하향하여 연무한다.","바람의 방향을 고려할 필요가 없다.","지형을 고려해 살포폭을 조정할 필요가 없다.","살충제 미립자가 커서 살포와 동시에 땅에 떨어진다."],"a":2,"e":"가열연무는 분사구를 아래로 향하게 하여 연무해야 연무가 지면 가까이 퍼진다. 상승기류가 생기는 정오보다 바람이 약한 새벽이나 해질녘에 살포하고, 바람 방향과 지형을 고려해 살포폭을 정한다. 연무 입자는 매우 작아 공중에 오래 떠 있으므로 바로 떨어진다는 설명은 틀리다."},{"id":"42-1-87","r":42,"p":1,"n":87,"s":"위생곤충학","q":"한 약제에 대해 저항성이 생기면 화학구조가 유사한 다른 약제에 대해서도 저항성이 나타나는 것은?","o":["내성","항상성","교차저항성","생리적 저항성","생태적 저항성"],"a":3,"e":"교차저항성은 한 살충제에 저항성이 생기면 화학구조나 작용기전이 비슷한 다른 살충제에도 저항성이 함께 나타나는 현상이다. 생태적(행동적) 저항성은 약제를 피하는 습성으로 생기는 것이고, 내성은 개체가 일시적으로 강해지는 것으로 유전되는 저항성과 다르다."},{"id":"42-1-88","r":42,"p":1,"n":88,"s":"위생곤충학","q":"모기나 진드기에 사용하는 기피제는?","o":["디트(DEET)","디디티(DDT)","카바릴(carbaryl)","크리미딘(crimidine)","썰폭사이드(sulfoxide)"],"a":1,"e":"디트(DEET)는 피부나 옷에 발라 모기·진드기가 접근하지 못하게 하는 대표적 기피제다. DDT는 유기염소계, 카바릴은 카바메이트계 살충제이고, 크리미딘은 살서제, 설폭사이드는 살충효과를 높이는 협력제다."},{"id":"42-1-89","r":42,"p":1,"n":89,"s":"위생곤충학","q":"회색의 결정분말로 마늘냄새가 나며 수분이 있는 상태에서 먹이와 섞이면 인화수소(phosphine: PH₃) 가스를 방출하는 살서제는?","o":["안투(antu)","아비산(arsenious acid)","인화아연(zinc phosphide)","노르모마이드(normomide)","소듐플루로아세테이트(sodium fluroacetate)"],"a":3,"e":"인화아연은 회흑색 분말로 마늘 냄새가 나며, 수분이나 위산과 반응해 포스핀(PH₃) 가스를 내는 급성 살서제다. 안투는 시궁쥐에 폐수종을 일으키는 급성 살서제이고, 소듐플루오로아세테이트는 냄새·맛이 거의 없는 맹독성 살서제다."},{"id":"42-1-90","r":42,"p":1,"n":90,"s":"위생곤충학","q":"바퀴 방제를 위하여 타일벽, 벽지, 금속표면에 잔류분무하는 제제는?","o":["유제","용제","입제","수화제","증강제"],"a":1,"e":"타일벽, 금속표면처럼 약제를 흡수하지 않는 표면에는 유제를 잔류분무한다. 수화제는 시멘트·흙벽 등 흡수성 표면에 약제 입자를 남기기 위해 쓰고, 입제는 물이나 토양에 뿌리는 제제다."},{"id":"42-1-91","r":42,"p":1,"n":91,"s":"위생곤충학","q":"학질모기에 대한 설명으로 옳은 것은?","o":["알에 부낭이 없다.","난괴 형태로 산란한다.","성충은 날개에 무늬가 없다.","유충은 수면에 수평으로 뜬다.","암컷의 촉수는 주둥이보다 짧다."],"a":4,"e":"학질모기(얼룩날개모기) 유충은 호흡관이 없어 수면에 수평으로 뜬다. 알에는 부낭이 있고 하나씩 낱개로 산란하며, 날개에는 흑백 반점 무늬가 있고 암컷 촉수는 주둥이와 길이가 비슷하다. 난괴 산란과 비스듬히 매달리는 유충은 집모기의 특징이다."},{"id":"42-1-92","r":42,"p":1,"n":92,"s":"위생곤충학","q":"바닷가 바위의 고인 물에서 서식하는 모기종은?","o":["광릉왕모기","노랑늪모기","지하집모기","토고숲모기","작은빨간집모기"],"a":4,"e":"토고숲모기는 해안가 바위 웅덩이에 고인 빗물이나 바닷물에서 발생하며 말레이사상충증을 매개한다. 작은빨간집모기는 논·늪, 지하집모기는 건물 지하 정화조 등 고인 물에서 발생한다."},{"id":"42-1-93","r":42,"p":1,"n":93,"s":"위생곤충학","q":"연못에 서식하는 모기 유충의 방제법으로 옳은 것은?","o":["가열연막을 한다.","잔류분무를 한다.","기피제를 뿌린다.","유문등을 가동한다.","B.t.i.입제를 살포한다."],"a":5,"e":"B.t.i.(Bacillus thuringiensis israelensis)는 모기 유충이 먹으면 장에서 독소가 작용해 죽게 하는 미생물 살충제로, 다른 수서생물에 안전해 연못 등 유충 발생지에 입제로 살포한다. 가열연막과 유문등은 성충 대상이고, 기피제는 사람을 보호할 뿐 유충 방제법이 아니다."},{"id":"42-1-94","r":42,"p":1,"n":94,"s":"위생곤충학","q":"기생벌(parasitic wasp)을 이용해 방제할 수 있는 위생곤충은?","o":["모기","벼룩","빈대","진드기","집파리"],"a":5,"e":"집파리는 번데기에 알을 낳는 기생벌(좀벌류 등)을 이용해 생물학적으로 방제할 수 있다. 모기 유충은 주로 미꾸라지·송사리 같은 천적 어류나 B.t.i.로 생물학적 방제를 한다."},{"id":"42-1-95","r":42,"p":1,"n":95,"s":"위생곤충학","q":"파리목(Diptera)의 환봉아목(Cyclorrhapha)에 속하는 것은?","o":["등에","모기","먹파리","검정파리","나방파리"],"a":4,"e":"환봉아목은 위용(유충 껍질이 굳은 번데기집)의 둥근 뚜껑을 열고 성충이 나오는 무리로 집파리, 검정파리, 쉬파리, 체체파리 등이 속한다. 모기·먹파리·나방파리는 장각아목(긴뿔파리아목), 등에는 단각아목이다."},{"id":"42-1-96","r":42,"p":1,"n":96,"s":"위생곤충학","q":"성충은 자궁 속에서 유충을 발육시켜 배출하고 1세대에 1개체를 생산하는 파리는?","o":["금파리","쉬파리","침파리","검정파리","체체파리"],"a":5,"e":"체체파리는 암컷 자궁 속에서 유충 1마리를 자궁선 분비물로 키워 다 자란 유충을 낳는 태생(번데기 직전 유충 산출)이며, 아프리카 수면병을 매개한다. 쉬파리도 유충을 낳지만 한 번에 여러 마리의 1령 유충을 낳는다는 점이 다르다."},{"id":"42-1-97","r":42,"p":1,"n":97,"s":"위생곤충학","q":"집파리의 다리를 비비는 습성으로 인해 방제효과가 상승하는 방제법은?","o":["훈증법","가열연무법","잔류분무법","기생벌적용법","극미량연무법"],"a":3,"e":"잔류분무법은 파리가 잘 앉는 표면에 살충제를 남겨 두는 방법으로, 집파리가 다리를 비비는 습성 때문에 다리에 묻은 약제가 몸과 입으로 더 많이 옮겨져 효과가 커진다. 가열연무·극미량연무는 공중에 떠 있는 곤충을 겨냥하는 일시적 공간살포다."},{"id":"42-1-98","r":42,"p":1,"n":98,"s":"위생곤충학","q":"사면발이의 형태적 특징으로 옳은 것은?","o":["복부가 좁고 길다.","두부가 흉부보다 넓다.","구기에서 대악이 발달되어 있다.","몸은 두흉부와 복부로 되어 있다.","체형은 원형이고 게(crab) 모양이다."],"a":5,"e":"사면발이는 몸이 짧고 넓어 둥근 게(crab) 모양이고, 가운데·뒷다리 발톱이 커서 음모를 붙잡고 산다. 복부가 좁고 긴 것은 머릿니·몸니의 특징이고, 몸이 두흉부와 복부로 나뉘는 것은 거미강이다. 이의 구기는 흡혈용이라 대악이 발달하지 않는다."},{"id":"42-1-99","r":42,"p":1,"n":99,"s":"위생곤충학","q":"빈대의 베레제기관은?","o":["생식기관","소화기관","순환기관","신경기관","호흡기관"],"a":1,"e":"베레제기관(Berlese's organ)은 빈대 암컷 복부에 있는 정자를 받아들이는 생식(교미)기관으로, 빈대 수컷은 암컷 체벽을 뚫어 이곳에 정자를 넣는다. 소화·순환·신경·호흡과는 관계없다."},{"id":"42-1-100","r":42,"p":1,"n":100,"s":"위생곤충학","q":"흑사병을 매개하고 형태가 사람벼룩과 유사하나 중흉측판에 중흉측선이 있는 종은?","o":["개벼룩","좀닭벼룩","고양이벼룩","열대쥐벼룩","유럽쥐벼룩"],"a":4,"e":"열대쥐벼룩은 사람벼룩처럼 즐치(빗살 모양 가시)가 없지만, 중흉측판에 중흉측선이 있는 점으로 구별하며 페스트(흑사병)와 발진열을 매개한다. 개벼룩·고양이벼룩은 협즐치와 전흉즐치가 모두 있어 구별된다."},{"id":"42-1-101","r":42,"p":1,"n":101,"s":"위생곤충학","q":"독나방의 생활사 중 독모가 생성되는 발육 단계는?","o":["알","성충","유충","자충","번데기"],"a":3,"e":"독나방의 독모는 유충 시기에 생성되며, 고치를 만들 때 독모가 고치에 붙고 우화한 암컷 성충이 이를 복부 끝에 묻혀 다니며 퍼뜨린다. 성충이 직접 독모를 만드는 것이 아니다."},{"id":"42-1-102","r":42,"p":1,"n":102,"s":"위생곤충학","q":"독침으로 피해를 주는 곤충은?","o":["등에","땅벌","벼룩","파리","왕모기"],"a":2,"e":"땅벌은 벌목 곤충으로 암컷의 산란관이 변형된 독침으로 쏘아 피해를 준다. 등에·벼룩은 흡혈로, 파리는 병원체 기계적 전파로 피해를 주며 독침은 없다."},{"id":"42-1-103","r":42,"p":1,"n":103,"s":"위생곤충학","q":"털진드기가 흡혈하는 시기는?","o":["번데기","산란기","성충기","유충기","자충기"],"a":4,"e":"털진드기는 유충기에만 한 번 숙주에 붙어 조직액을 흡혈하며, 이때 쯔쯔가무시증을 매개한다. 자충과 성충은 흙 속에서 자유생활을 하며 흡혈하지 않는다."},{"id":"42-1-104","r":42,"p":1,"n":104,"s":"위생곤충학","q":"공주진드기라고도 하며 수명이 10~20년으로 진드기매개재귀열과 아프리카돈열을 매개하는 진드기는?","o":["옴진드기","참진드기","털진드기","가시진드기","물렁진드기"],"a":5,"e":"물렁진드기(공주진드기)는 등판(순판)이 없는 연질 진드기로 수명이 10~20년으로 길고, 진드기매개 재귀열과 아프리카돼지열병을 매개한다. 참진드기는 등판이 있는 경질 진드기로 라임병·SFTS를, 털진드기는 쯔쯔가무시증을 매개한다."},{"id":"42-1-105","r":42,"p":1,"n":105,"s":"위생곤충학","q":"만성살서제에 대한 설명으로 옳은 것은?","o":["독먹이에 대한 기피성이 생긴다.","사람이나 가축에 맹독성을 나타낸다.","혈액응고를 방해하고 출혈을 일으킨다.","방제효과를 높이기 위해 사전미끼가 필요하다.","독성작용은 1~2시간 이내에 신속히 나타난다."],"a":3,"e":"만성살서제(와파린 등 항응혈성 살서제)는 비타민 K 작용을 방해해 혈액응고를 막고 내출혈로 쥐를 죽인다. 여러 날 조금씩 먹어야 효과가 나므로 기피성이 적어 사전미끼가 필요 없고, 사람·가축에 비교적 안전하다. 기피성, 사전미끼 필요, 신속한 독성은 급성살서제의 특징이다."},{"id":"42-2-1","r":42,"p":2,"n":1,"s":"공중보건학","q":"건강개념의 변천으로 옳은 것은?","o":["생활개념 → 심신개념 → 신체개념","신체개념 → 생활개념 → 심신개념","신체개념 → 심신개념 → 생활개념","심신개념 → 생활개념 → 신체개념","심신개념 → 신체개념 → 생활개념"],"a":3,"e":"건강개념은 몸에 병이 없는 상태를 보던 신체개념에서, 정신까지 함께 보는 심신개념으로, 다시 사회생활·환경과의 관계까지 포함하는 생활개념(생태학적 개념)으로 넓어져 왔다. 생활개념에서 출발하는 순서는 역사적 흐름을 거꾸로 놓은 것이다."},{"id":"42-2-2","r":42,"p":2,"n":2,"s":"공중보건학","q":"건강증진의 접근 원칙과 활동 영역을 제시한 제1차 국제 건강증진 회의와 관련 있는 것은?","o":["방콕헌장","오타와헌장","헬싱키선언","알마아타선언","자카르타선언"],"a":2,"e":"1986년 캐나다 오타와에서 열린 제1차 국제건강증진회의에서 오타와헌장이 채택되었고, 옹호·역량강화·연합의 3대 원칙과 건강한 공공정책 수립 등 5대 활동영역을 제시했다. 알마아타선언(1978)은 일차보건의료에 관한 것이고, 자카르타선언(제4차)과 방콕헌장(제6차)은 이후 회의에서 나왔다."},{"id":"42-2-3","r":42,"p":2,"n":3,"s":"공중보건학","q":"나쁜 공기로 인하여 감염병이 발생한다는 질병발생설은?","o":["장기설","점성설","종교설","접촉감염설","미생물병인설"],"a":1,"e":"장기설(miasma theory)은 오염된 나쁜 공기(장기)가 질병을 일으킨다는 고대·중세의 학설이다. 접촉감염설은 환자와 접촉해서 전파된다는 학설이고, 미생물병인설은 파스퇴르·코흐가 세운 병원체 원인설이다."},{"id":"42-2-4","r":42,"p":2,"n":4,"s":"공중보건학","q":"질병발생의 수레바퀴모형에서 숙주요인의 핵심(A)에 해당하는 것은?","o":["경제적 소인","물리적 소인","사회적 소인","유전적 소인","화학적 소인"],"a":4,"e":"수레바퀴모형은 숙주를 중심(핵심)에 두는데, 그 핵심은 유전적 소인이고 바깥을 생물학적·사회적·물리화학적 환경이 둘러싼다. 사회적·물리적·화학적 요인은 핵심이 아니라 바깥쪽 환경 요소에 해당한다.","ph":["g:wheel","g:wheel_sol"],"pr":1},{"id":"42-2-5","r":42,"p":2,"n":5,"s":"공중보건학","q":"코로나바이러스감염증-19(COVID-19)와 같이 다수의 국가에서 유행하는 감염병의 발생 양상은?","o":["계절적(seasonal)","산발성(sporadic)","토착성(endemic)","유행성(epidemic)","세계적 유행(pandemic)"],"a":5,"e":"세계적 유행(pandemic)은 여러 국가나 대륙에 걸쳐 동시에 크게 유행하는 양상으로, COVID-19가 대표적이다. 유행성(epidemic)은 한 지역에서 평소보다 많이 발생하는 경우이고, 토착성(endemic)은 특정 지역에 늘 일정 수준으로 존재하는 경우이다."},{"id":"42-2-6","r":42,"p":2,"n":6,"s":"공중보건학","q":"신약을 개발한 후 해당 질병이 있는 집단을 두 개의 군으로 나누고 한 군에는 신약을, 다른 군에는 위약(placebo)을 투여하여 신약의 효과를 알아보는 역학은?","o":["기술역학","분석역학","실험역학","이론역학","작전역학"],"a":3,"e":"연구자가 대상자를 신약군과 위약군으로 나누어 요인을 직접 조작하고 결과를 비교하므로 실험역학(임상시험)이다. 분석역학은 요인을 조작하지 않고 관찰만 하는 연구(환자-대조군, 코호트 연구)이다."},{"id":"42-2-7","r":42,"p":2,"n":7,"s":"공중보건학","q":"이론역학에 해당하는 것은?","o":["환자-대조군 연구","보건사업의 효과 평가","협의의 지역사회 진단","질병의 자연사에 대한 기술","질병 발생 양상에 관한 수학적 모형 설정"],"a":5,"e":"이론역학은 질병 발생 양상을 수학적 모형으로 설정하고 유행을 예측·분석하는 역학이다. 환자-대조군 연구는 분석역학, 질병의 자연사 기술은 기술역학, 보건사업의 효과 평가는 작전역학에 해당한다."},{"id":"42-2-8","r":42,"p":2,"n":8,"s":"공중보건학","q":"병원체가 감염된 숙주에게 현성질병을 일으키는 능력은?","o":["독력","감염력","면역력","병원력","전파력"],"a":4,"e":"병원력은 병원체가 감염된 숙주에게 현성질병을 일으키는 능력(감염자 중 현성감염자 비율)이다. 감염력은 숙주에 감염을 일으키는 능력이고, 독력은 현성감염자 중 중증이나 사망을 일으키는 정도이다."},{"id":"42-2-9","r":42,"p":2,"n":9,"s":"공중보건학","q":"다음의 (   ) 안에 들어갈 것으로 옳은 것은?","o":["5일","6일","10일","최소잠복기","최대잠복기"],"a":5,"b":"신종인플루엔자의 감시 또는 격리기간은 (   )을/를 초과할 수 없다.","e":"감염병예방법령에서는 신종인플루엔자 등의 감시 또는 격리기간을 해당 감염병의 최대잠복기를 초과할 수 없도록 정하고 있다. 최소잠복기나 5일·10일 같은 고정 일수가 아니라, 잠복기 중 가장 긴 기간이 상한이다. ※ 교재 확인 권장"},{"id":"42-2-10","r":42,"p":2,"n":10,"s":"공중보건학","q":"비활성 매개체 중에서 개달물(fomites)은?","o":["공기","수건","식수","식품","우유"],"a":2,"e":"개달물(fomites)은 의복, 수건, 침구, 장난감처럼 병원체를 옮기는 생명이 없는 물건을 말한다. 공기, 식수, 식품, 우유도 비활성 매개체이지만 개달물이 아니라 각각 공기·물·식품 매개체로 따로 분류한다."},{"id":"42-2-11","r":42,"p":2,"n":11,"s":"공중보건학","q":"병원체가 리케차(rickettsia)인 감염병은?","o":["말라리아","장티푸스","세균성이질","파라티푸스","쯔쯔가무시증"],"a":5,"e":"쯔쯔가무시증은 리케차의 일종인 Orientia tsutsugamushi가 털진드기 유충을 통해 전파되어 생긴다. 말라리아의 병원체는 원충이고, 장티푸스·세균성이질·파라티푸스는 세균이 원인이다."},{"id":"42-2-12","r":42,"p":2,"n":12,"s":"공중보건학","q":"공기로 전파되는 감염병은?","o":["매독","황열","콜레라","파라티푸스","유행성이하선염"],"a":5,"e":"유행성이하선염은 비말이나 공기를 통해 퍼지는 호흡기계 감염병이다. 콜레라와 파라티푸스는 오염된 물·음식으로 전파되는 소화기계 감염병이고, 황열은 모기, 매독은 성접촉으로 전파된다."},{"id":"42-2-13","r":42,"p":2,"n":13,"s":"공중보건학","q":"다음의 설명에 해당하는 것은?","o":["감염면역","집단면역","선천적면역","인공능동면역","자연수동면역"],"a":2,"b":"지역사회에 특정 질병에 대한 면역을 획득한 인구의 비율이 어느 정도 되면 마치 해당 질병에 면역된 것처럼 지역사회에 유행이 발생하지 않게 된다.","e":"집단면역은 지역사회 인구 중 면역을 가진 사람의 비율이 일정 수준(한계밀도)을 넘으면 감수성자가 있어도 유행이 일어나지 않는 현상이다. 인공능동면역이나 감염면역은 개인 단위의 면역 획득 방식을 말한다."},{"id":"42-2-14","r":42,"p":2,"n":14,"s":"공중보건학","q":"뇌혈관의 국소적인 기능부전으로 인한 신경학적 결손을 수반하는 질환은?","o":["뇌졸중","부정맥","폐부종","협심증","심근경색증"],"a":1,"e":"뇌졸중은 뇌혈관이 막히거나(뇌경색) 터져서(뇌출혈) 뇌의 일부 기능이 갑자기 떨어지고, 편마비·언어장애 같은 신경학적 결손이 나타나는 질환이다. 협심증과 심근경색증은 심장의 관상동맥 질환이다."},{"id":"42-2-15","r":42,"p":2,"n":15,"s":"공중보건학","q":"암 발생과 관련 있는 숙주요인은?","o":["가족력","자외선","중금속","바이러스","전리방사선"],"a":1,"e":"가족력(유전적 소인)은 사람 자체가 가진 특성이므로 숙주요인이다. 자외선, 중금속, 바이러스, 전리방사선은 외부에서 노출되는 환경요인(발암 요인)이다."},{"id":"42-2-16","r":42,"p":2,"n":16,"s":"공중보건학","q":"2019년 기준 우리나라에서 사망률이 가장 높은 암은?","o":["간암","위암","폐암","대장암","신장암"],"a":3,"e":"통계청 2019년 사망원인통계에서 암 사망률 1위는 폐암(인구 10만 명당 약 36명)이고 간암, 대장암, 위암 순이었다. 발생률 상위인 위암·간암과 헷갈리기 쉽지만 사망률은 폐암이 가장 높다."},{"id":"42-2-17","r":42,"p":2,"n":17,"s":"공중보건학","q":"지역사회 주민의 자발적 참여를 강조하는 보건행정의 특성은?","o":["공공성","과학성","봉사성","조장성","합법성"],"a":4,"e":"조장성(교육성)은 보건행정이 강제보다 교육과 지원을 통해 주민의 자발적 참여를 이끌어 내는 특성이다. 공공성은 주민 전체의 이익을 위한다는 특성이고, 봉사성은 적극적으로 서비스를 제공한다는 특성이다."},{"id":"42-2-18","r":42,"p":2,"n":18,"s":"공중보건학","q":"조직원이나 하부 조직에 업무 내용을 분담하는 원리는?","o":["목적의 원리","분업의 원리","조정의 원리","명령통일의 원리","통솔범위의 원리"],"a":2,"e":"분업의 원리(전문화의 원리)는 업무를 성질별로 나누어 조직원이나 하부 조직에 분담시키는 원리이다. 조정의 원리는 나누어진 업무와 노력을 하나로 통합하는 원리이고, 통솔범위의 원리는 한 상관이 직접 감독할 수 있는 부하 수에 한계가 있다는 원리이다."},{"id":"42-2-19","r":42,"p":2,"n":19,"s":"공중보건학","q":"조직원 또는 부서 간의 행동 통일을 위한 집단적인 노력에 해당하는 행정관리과정은?","o":["기획","인사","조정","조직","지휘"],"a":3,"e":"조정은 조직원과 부서의 활동을 공동 목표를 향해 통일하고 조화시키는 행정관리과정이다. 지휘는 조직원을 이끌고 지시하는 것이고, 조직은 업무와 권한의 구조를 짜는 과정이다."},{"id":"42-2-20","r":42,"p":2,"n":20,"s":"공중보건학","q":"감염병 예방관리체계를 강화하고 효과적인 만성질환관리, 보건의료 연구개발 역량을 확보하기 위하여 설립한 보건복지부 소속 중앙행정기관은?","o":["국립재활원","질병관리청","국립중앙의료원","국민건강보험공단","식품의약품안전처"],"a":2,"e":"질병관리청은 감염병 대응과 만성질환 관리, 보건의료 연구개발 역량 강화를 위해 2020년에 질병관리본부를 승격하여 세운 보건복지부 소속 중앙행정기관이다. 식품의약품안전처는 국무총리 소속이고, 국민건강보험공단은 공공기관(공단)이다."},{"id":"42-2-21","r":42,"p":2,"n":21,"s":"공중보건학","q":"의료 취약지역에서 보건진료전담공무원으로 하여금 의료행위를 하게 하기 위하여 시장·군수가 설치·운영하는 보건의료시설은?","o":["보건소","보건지소","보건의료원","보건진료소","건강생활지원센터"],"a":4,"e":"보건진료소는 농어촌 등 보건의료를 위한 특별조치법에 따라 의료 취약지역에 시장·군수가 설치하고, 보건진료전담공무원이 경미한 의료행위를 하는 시설이다. 보건지소는 읍·면 단위의 보건소 하부 조직이고, 보건의료원은 병원 요건을 갖춘 보건소이다."},{"id":"42-2-22","r":42,"p":2,"n":22,"s":"공중보건학","q":"제2차 세계대전 직후에 전쟁 피해국의 어린이들을 돕기 위하여 설립한 국제기구는?","o":["WHO","UNEP","UNFPA","UNICEF","UNESCO"],"a":4,"e":"UNICEF(국제연합아동기금)는 1946년 제2차 세계대전 피해국 어린이를 긴급 구호하기 위해 설립되었다. WHO는 보건 전반, UNEP는 환경, UNESCO는 교육·과학·문화를 담당한다."},{"id":"42-2-23","r":42,"p":2,"n":23,"s":"공중보건학","q":"1977년에 500인 이상 사업장의 근로자를 대상으로 시행한 사회보험제도는?","o":["고용보험","국민연금","자동차보험","국민건강보험","산업재해보상보험"],"a":4,"e":"우리나라는 1977년 500인 이상 사업장 근로자를 대상으로 의료보험(현 국민건강보험)을 처음 시행했다. 산업재해보상보험은 1964년, 국민연금은 1988년, 고용보험은 1995년에 시행되어 시기가 다르다."},{"id":"42-2-24","r":42,"p":2,"n":24,"s":"공중보건학","q":"우리나라에서는 인구주택총조사를 몇 년마다 실시하는가?","o":["2년","3년","5년","7년","10년"],"a":3,"e":"인구주택총조사는 5년마다(연도 끝자리가 0과 5인 해) 실시하는 전국 단위 인구 센서스이다. 2015년부터는 행정자료를 활용한 등록센서스 방식으로 바뀌었지만 주기는 5년으로 같다."},{"id":"42-2-25","r":42,"p":2,"n":25,"s":"공중보건학","q":"출생률과 사망률이 모두 낮은 인구정지형에 해당하는 인구구조는?","o":["별형","종형","기타형","항아리형","피라미드형"],"a":2,"e":"종형은 출생률과 사망률이 모두 낮아 인구 증가가 거의 없는 인구정지형 구조이다. 피라미드형은 출생률과 사망률이 모두 높은 인구증가형이고, 항아리형은 출생률이 사망률보다 낮은 인구감소형이다."},{"id":"42-2-26","r":42,"p":2,"n":26,"s":"공중보건학","q":"결핍 시 펠라그라(pellagra)를 유발하는 비타민은?","o":["니아신(niacin)","티아민(thiamine)","코발라민(cobalamin)","피리독신(pyridoxine)","리보플라빈(riboflavin)"],"a":1,"e":"니아신이 부족하면 피부염, 설사, 치매(3D)가 특징인 펠라그라가 생긴다. 티아민 결핍은 각기병, 코발라민 결핍은 악성빈혈, 리보플라빈 결핍은 구순구각염을 일으킨다."},{"id":"42-2-27","r":42,"p":2,"n":27,"s":"공중보건학","q":"임신 37주 미만의 출생아 또는 출생 시 체중이 2,500 g 미만인 자로서 보건소장 또는 의료기관의 장이 임신 37주 이상인 출생아 등과는 다른 특별한 의료적 관리와 보호가 필요하다고 판단하는 아이는?","o":["영아","유아","과숙아","신생아","미숙아"],"a":5,"e":"모자보건법에서 미숙아는 임신 37주 미만 출생아 또는 출생 시 체중 2,500 g 미만인 자로서 특별한 의료적 관리가 필요하다고 판단되는 영유아로 정의한다. 신생아는 출생 후 28일 이내의 영유아이고, 영아는 만 1세 미만이다."},{"id":"42-2-28","r":42,"p":2,"n":28,"s":"공중보건학","q":"노인성질환 등으로 장애가 발생하여 도움이 필요한 노인을 입소시켜 급식, 요양과 그 밖의 일상생활에 필요한 편의를 제공하는 노인의료복지시설은?","o":["노인복지관","노인복지주택","노인요양시설","노인전문병원","노인보호전문기관"],"a":3,"e":"노인요양시설은 치매·중풍 등 노인성질환으로 도움이 필요한 노인을 입소시켜 급식·요양 등 일상생활 편의를 제공하는 노인의료복지시설(노인복지법)이다. 노인복지관은 노인여가복지시설, 노인복지주택은 노인주거복지시설에 해당한다."},{"id":"42-2-29","r":42,"p":2,"n":29,"s":"공중보건학","q":"앤더슨(G. Anderson)이 공중보건의 목적을 달성하는 데 가장 중요한 요소로 제시한 것은?","o":["국제보건","보건교육","보건영양","보건통계","인구보건"],"a":2,"e":"앤더슨은 공중보건 목적을 달성하는 수단으로 보건행정(봉사), 법규(통제), 보건교육을 들었고, 그중 보건교육을 가장 중요한 요소로 보았다. 보건통계나 인구보건은 앤더슨이 제시한 핵심 요소가 아니다. ※ 교재 확인 권장"},{"id":"42-2-30","r":42,"p":2,"n":30,"s":"공중보건학","q":"어떤 주제에 대해 서로 다른 견해를 가진 소수의 전문가들이 사회자의 안내에 따라 토의를 진행하는 교육방법은?","o":["역할극(role playing)","심포지엄(symposium)","분단토의(buzz session)","패널토의(panel discussion)","브레인스토밍(brainstorming)"],"a":4,"e":"패널토의는 서로 다른 견해를 가진 소수 전문가가 사회자의 진행에 따라 청중 앞에서 토의하는 방법이다. 심포지엄은 여러 전문가가 각자 의견을 발표한 뒤 청중과 질의응답하는 방식이고, 분단토의(buzz session)는 전체를 작은 그룹으로 나누어 토의하는 방식이다."},{"id":"42-2-31","r":42,"p":2,"n":31,"s":"공중보건학","q":"보건교사의 직무는?","o":["학교보건계획의 수립","식생활 지도 및 영양상담","위생·안전·작업관리 및 검식","학교에서 사용하는 의약품의 검사","학생 및 교직원의 건강진단과 건강평가"],"a":1,"e":"학교보건법령에서 보건교사의 직무에는 학교보건계획의 수립, 학교 환경위생 유지·관리, 보건교육 등이 있다. 식생활 지도·영양상담과 위생·안전·작업관리 및 검식은 영양교사, 의약품 검사는 학교약사, 건강진단과 건강평가는 학교의사의 직무이다."},{"id":"42-2-32","r":42,"p":2,"n":32,"s":"공중보건학","q":"정신보건 2차 예방활동으로 옳은 것은?","o":["개인습관의 변화","사회생활 복귀훈련","잔존기능의 의학적 재활","조기 진단 및 신속한 치료","가족 및 지역사회 지원체계의 구축"],"a":4,"e":"정신보건의 2차 예방은 정신질환을 조기에 발견하고 신속히 치료하여 악화를 막는 활동이다. 개인습관의 변화는 발생 자체를 막는 1차 예방이고, 사회생활 복귀훈련과 잔존기능 재활은 3차 예방에 해당한다."},{"id":"42-2-33","r":42,"p":2,"n":33,"s":"공중보건학","q":"측정값이 3, 10, 9, 3, 8일 때 8에 해당하는 것은?","o":["중앙치","최빈치","기하평균","산술평균","조화평균"],"a":1,"e":"【공식】 중앙치 = 측정값을 크기순으로 나열했을 때 가운데 위치한 값(n이 홀수이면 (n+1)/2번째 값)\n【풀이】 크기순으로 나열하면 3, 3, 8, 9, 10이고 n=5이므로 3번째 값인 8이 중앙치이다. 최빈치는 가장 많이 나온 3이고, 산술평균은 33÷5=6.6이다."},{"id":"42-2-34","r":42,"p":2,"n":34,"s":"공중보건학","q":"한 여성이 일생 동안 낳을 것으로 예상되는 평균 출생아 수를 나타내는 지표는?","o":["보통출생률","순재생산율","일반출산율","총재생산율","합계출산율"],"a":5,"e":"합계출산율은 가임기(15~49세) 여성 한 명이 평생 낳을 것으로 예상되는 평균 출생아 수이다. 총재생산율은 그중 여아만 센 값이고, 순재생산율은 여아 수에 어머니 세대의 사망률까지 반영한 값이다."},{"id":"42-2-35","r":42,"p":2,"n":35,"s":"공중보건학","q":"다음의 설명에 해당하는 생물테러감염병은?","o":["두창","탄저","야토병","페스트","보툴리눔독소증"],"a":1,"b":"• 세계보건기구는 이 감염병이 근절된 것으로 선언하였다.\n• 병원체는 바이러스이다.\n• 발진, 수포, 농포성의 병적인 피부 변화가 나타난다.","e":"두창은 바이러스(Variola virus)가 원인이며, 반점-구진-수포-농포로 진행하는 피부 병변이 특징이고, 1980년 WHO가 근절을 선언했다. 탄저, 페스트, 야토병은 세균이 원인이고, 보툴리눔독소증은 세균이 만든 독소가 원인이다."},{"id":"42-2-36","r":42,"p":2,"n":36,"s":"식품위생학","q":"살균제의 살균력 평가 기준으로 이용되는 물질은?","o":["석탄산","알코올","질산은","크레졸","포르말린"],"a":1,"e":"석탄산(페놀)은 살균력이 안정적이어서 소독제의 살균력을 비교하는 기준(석탄산계수 = 소독제의 희석배수 ÷ 석탄산의 희석배수)으로 쓴다. 크레졸은 석탄산보다 살균력이 약 2배 강한 소독제이지만 평가 기준 물질은 아니다."},{"id":"42-2-37","r":42,"p":2,"n":37,"s":"식품위생학","q":"염소를 함유하는 플라스틱이나 쓰레기를 태울 때 생성되는 유독물질은?","o":["다이옥신(dioxin)","메탄올(methanol)","니트로사민(nitrosamine)","비스페놀 A(bisphenol A)","트리메틸아민(trimethylamine)"],"a":1,"e":"다이옥신은 PVC 같은 염소 함유 플라스틱이나 쓰레기를 저온에서 불완전 연소할 때 생기는 유기염소계 유독물질이다. 니트로사민은 아질산염과 아민이 반응해 생기고, 비스페놀 A는 폴리카보네이트 용기 등에서 녹아 나오는 내분비계 장애물질이다."},{"id":"42-2-38","r":42,"p":2,"n":38,"s":"식품위생학","q":"식중독의 외인성 위해요인은?","o":["버섯독","방사성물질","시안배당체","산화된 유지","식물알칼로이드"],"a":2,"e":"외인성 위해요인은 식품 밖에서 들어온 것으로 미생물, 유해첨가물, 잔류농약, 방사성물질 등이 해당한다. 버섯독, 시안배당체, 식물알칼로이드는 식품 자체에 들어 있는 내인성 요인이고, 산화된 유지는 저장·가공 중 생기는 유인성 요인이다."},{"id":"42-2-39","r":42,"p":2,"n":39,"s":"식품위생학","q":"실험동물에게 시험물질을 1회만 투여하여 그 독성의 영향을 관찰하는 시험법은?","o":["발암성 시험","급성독성 시험","만성독성 시험","변이원성 시험","아급성독성 시험"],"a":2,"e":"급성독성 시험은 실험동물에 시험물질을 1회 투여하고 단기간 관찰하여 반수치사량(LD50)을 구하는 시험이다. 아급성독성 시험은 1~3개월, 만성독성 시험은 6개월~평생 반복 투여한다."},{"id":"42-2-40","r":42,"p":2,"n":40,"s":"식품위생학","q":"토양에 분포하는 아포형성 세균의 속명으로 옳은 것은?","o":["비브리오(Vibrio)","바실루스(Bacillus)","프로테우스(Proteus)","살모넬라(Salmonella)","엔테로박터(Enterobacter)"],"a":2,"e":"바실루스(Bacillus)는 토양에 널리 분포하는 그람양성 호기성(또는 통성혐기성) 아포형성 간균이다. 비브리오는 해수, 살모넬라·프로테우스·엔테로박터는 장내세균과로 아포를 만들지 않는다."},{"id":"42-2-41","r":42,"p":2,"n":41,"s":"식품위생학","q":"식품에 존재하는 미생물 중 곰팡이(fungi)에 속하는 것은?","o":["Penicillium","Micrococcus","Lactobacillus","Pseudomonas","Staphylococcus"],"a":1,"e":"Penicillium(푸른곰팡이)은 곰팡이(진균)로 황변미 독소 등 곰팡이독을 만드는 종이 있다. Micrococcus, Lactobacillus, Pseudomonas, Staphylococcus는 모두 세균이다."},{"id":"42-2-42","r":42,"p":2,"n":42,"s":"식품위생학","q":"식품의 분변오염 지표균으로 이용되는 것은?","o":["대장균군","일반세균","콜레라균","살모넬라균","포도상구균"],"a":1,"e":"대장균군은 사람과 동물의 장에 많이 살아 식품·물의 분변오염 지표균으로 쓴다. 일반세균수는 전반적인 위생 상태나 신선도 지표이고, 살모넬라균과 포도상구균은 지표균이 아니라 식중독 원인균이다."},{"id":"42-2-43","r":42,"p":2,"n":43,"s":"식품위생학","q":"식용유지의 산패를 확인하기 위한 지표는?","o":["헤너가(Hener value)","카르보닐가(Carbonyl value)","폴렌스키가(Polenske value)","비누화가(Saponification value)","라이헤르트마이슬가(Reichert-Meissl value)"],"a":2,"e":"카르보닐가는 유지가 산화되어 생긴 알데히드·케톤 같은 카르보닐 화합물의 양을 재므로 산패 확인 지표이다. 헤너가, 폴렌스키가, 라이헤르트마이슬가, 비누화가는 지방산 조성 같은 유지의 고유 특성을 보는 값이다."},{"id":"42-2-44","r":42,"p":2,"n":44,"s":"식품위생학","q":"단백질 식품의 부패 생성물은?","o":["아민(amine)","과산화물(peroxide)","엔테로톡신(enterotoxin)","메틸알코올(methyl alcohol)","아마니타톡신(amanitatoxin)"],"a":1,"e":"단백질이 부패하면 아미노산이 탈탄산되어 히스타민, 푸트레신 같은 아민류와 암모니아, 황화수소가 생긴다. 과산화물은 유지가 산패할 때 생기고, 엔테로톡신은 세균이 만드는 독소이다."},{"id":"42-2-45","r":42,"p":2,"n":45,"s":"식품위생학","q":"자외선 살균에 대한 설명으로 옳은 것은?","o":["투과력이 강하다.","잔류 효과가 있다.","살균등의 파장은 253.7 nm이다.","특정세균에만 살균 효과가 있다.","유기물 존재 시 살균력이 높아진다."],"a":3,"e":"살균력이 가장 강한 자외선 파장은 약 260 nm 부근이며, 살균등은 253.7 nm(2,537 Å)의 빛을 낸다. 자외선은 투과력이 약해 표면만 살균하고 잔류 효과가 없으며, 유기물이 있으면 살균력이 떨어진다."},{"id":"42-2-46","r":42,"p":2,"n":46,"s":"식품위생학","q":"감염독소형(생체 내 독소형) 식중독을 일으키는 세균은?","o":["Campylobacter jejuni","Staphylococcus aureus","Clostridium perfringens","Listeria monocytogenes","Vibrio parahaemolyticus"],"a":3,"e":"Clostridium perfringens는 장 속에서 증식하면서 아포를 만들 때 엔테로톡신을 내므로 감염독소형(생체 내 독소형) 식중독을 일으킨다. Staphylococcus aureus는 식품 속에서 미리 만들어진 독소를 먹어서 생기는 독소형이고, Vibrio parahaemolyticus는 감염형이다."},{"id":"42-2-47","r":42,"p":2,"n":47,"s":"식품위생학","q":"Vibrio parahaemolyticus에 대한 설명으로 옳은 것은?","o":["포자를 형성한다.","그람양성의 간균이다.","편성혐기성 세균이다.","주모성 편모를 갖는다.","60℃에서 30분 가열로 사멸된다."],"a":5,"e":"장염비브리오균(Vibrio parahaemolyticus)은 열에 약해 60℃에서 30분 정도 가열하면 사멸한다. 그람음성 간균이고, 포자를 만들지 않으며, 통성혐기성이고, 주모성이 아닌 단모성(극모) 편모를 가진다. ※ 교재 확인 권장"},{"id":"42-2-48","r":42,"p":2,"n":48,"s":"식품위생학","q":"용혈요독증후군(hemolytic uremic syndrome)을 유발하는 병원성 대장균은?","o":["장관병원성 대장균","장관응집성 대장균","장관출혈성 대장균","장관침입성 대장균","장관독소원성 대장균"],"a":3,"e":"장관출혈성 대장균(EHEC, O157:H7 등)은 베로독소(시가독소)를 만들어 출혈성 대장염과 용혈요독증후군을 일으킨다. 장관독소원성 대장균은 여행자 설사, 장관침입성 대장균은 이질과 비슷한 증상을 일으킨다."},{"id":"42-2-49","r":42,"p":2,"n":49,"s":"식품위생학","q":"다음의 식중독균은?","o":["Bacillus cereus","Yersinia enterocolitica","Clostridium botulinum","Staphylococcus aureus","Vibrio parahaemolyticus"],"a":2,"b":"• 장내세균과에 속한다.\n• 4℃ 이하의 냉장온도에서도 증식이 가능하다.\n• 돈육의 냉장, 냉동 및 유통과정에서 주의를 요한다.","e":"Yersinia enterocolitica는 장내세균과에 속하고 4℃ 이하 냉장온도에서도 증식하는 저온균이며, 돼지고기가 주요 원인식품이다. Listeria monocytogenes도 저온에서 증식하지만 보기에 없고, Clostridium botulinum은 장내세균과가 아닌 혐기성 아포형성균이다."},{"id":"42-2-50","r":42,"p":2,"n":50,"s":"식품위생학","q":"다음의 식중독을 일으키는 균은?","o":["Campylobacter jejuni","Yersinia enterocolitica","Staphylococcus aureus","Listeria monocytogenes","Salmonella Typhimurium"],"a":3,"b":"• 잠복기가 평균 3시간으로 매우 짧다\n• 구토가 나타나며 발열이 거의 없다.\n• 유제품, 식육제품, 도시락 등이 원인식품이다.","e":"황색포도상구균(Staphylococcus aureus) 식중독은 식품 속에서 미리 만들어진 내열성 엔테로톡신 때문에 생기는 독소형으로, 잠복기가 평균 3시간으로 짧고 구토가 주증상이며 열이 거의 없다. 살모넬라나 캄필로박터 같은 감염형은 잠복기가 길고 발열이 동반된다."},{"id":"42-2-51","r":42,"p":2,"n":51,"s":"식품위생학","q":"Clostridium botulinum이 생산하는 독소는?","o":["삭시톡신(saxitoxin)","시큐톡신(cicutoxin)","베로톡신(verotoxin)","뉴로톡신(neurotoxin)","엔테로톡신(enterotoxin)"],"a":4,"e":"Clostridium botulinum은 신경독소인 뉴로톡신을 만들어 복시, 연하곤란, 호흡마비 같은 신경 증상을 일으킨다. 삭시톡신은 마비성 패독, 시큐톡신은 독미나리 독, 베로톡신은 장관출혈성 대장균이 만드는 독소이다."},{"id":"42-2-52","r":42,"p":2,"n":52,"s":"식품위생학","q":"다음의 식중독을 일으키는 균은?","o":["Bacillus cereus","Campylobacter coli","Salmonella Enteritidis","Yersinia enterocolitica","Listeria monocytogenes"],"a":1,"b":"• 엔테로톡신(enterotoxin)이 식중독을 유발한다.\n• 식중독 형태에는 설사형과 구토형이 있다.\n• 동·식물성 단백질 및 전분질 식품에 의한 것이 많다.","e":"Bacillus cereus는 엔테로톡신으로 식중독을 일으키며, 설사형(육류·수프 등 단백질 식품)과 구토형(볶음밥 같은 전분질 식품)이 있다. Listeria와 Yersinia는 저온 증식이 특징이고, 설사형과 구토형으로 나뉘지 않는다."},{"id":"42-2-53","r":42,"p":2,"n":53,"s":"식품위생학","q":"히스타민(histamine)을 생성하여 알레르기성 식중독을 유발하는 세균은?","o":["Vibrio vulnificus","Morganella morganii","Cronobacter sakazakii","Yersinia enterocolitica","Clostridium botulinum"],"a":2,"e":"Morganella morganii는 꽁치·고등어 같은 붉은살 생선의 히스티딘을 히스타민으로 바꾸어 알레르기성 식중독을 일으킨다. Cronobacter sakazakii는 분유, Vibrio vulnificus는 패혈증과 관련이 있다."},{"id":"42-2-54","r":42,"p":2,"n":54,"s":"식품위생학","q":"유해 인공 감미료는?","o":["수단 III(Sudan III)","롱갈리트(rongalite)","아우라민(auramine)","시클라메이트(cyclamate)","포름알데히드(formaldehyde)"],"a":4,"e":"시클라메이트(cyclamate)는 발암성 문제로 사용이 금지된 유해 인공감미료이다. 아우라민과 수단 III는 유해 착색료, 롱갈리트는 유해 표백제, 포름알데히드는 유해 보존료이다."},{"id":"42-2-55","r":42,"p":2,"n":55,"s":"식품위생학","q":"이타이이타이병의 특징으로 옳은 것은?","o":["빈혈이 생긴다.","연록이 나타난다.","연산통이 나타난다.","골연화증을 일으킨다.","비중격천공을 일으킨다."],"a":4,"e":"이타이이타이병은 카드뮴 중독으로, 신장 기능 장애와 칼슘 대사 이상이 생겨 골연화증과 심한 뼈 통증이 나타난다. 연록(잇몸의 납 침착선)·연산통·빈혈은 납 중독, 비중격천공은 크롬 중독의 특징이다."},{"id":"42-2-56","r":42,"p":2,"n":56,"s":"식품위생학","q":"체내에서 대사되어 아코니타아제(aconitase)의 활성을 저해하여서 독성을 나타내는 농약은?","o":["비소제","유기인제","유기불소제","유기염소제","카바메이트제"],"a":3,"e":"유기불소제(플루오로아세트산 등)는 체내에서 플루오로시트르산으로 바뀌어 TCA 회로의 아코니타아제를 저해한다. 유기인제와 카바메이트제는 콜린에스테라아제를 저해하는 농약이다."},{"id":"42-2-57","r":42,"p":2,"n":57,"s":"식품위생학","q":"포름알데히드(formaldehyde)가 용출될 수 있는 열경화성 수지는?","o":["멜라민 수지","염화비닐 수지","폴리스틸렌 수지","폴리에틸렌 수지","폴리프로필렌 수지"],"a":1,"e":"멜라민 수지는 멜라민과 포름알데히드로 만든 열경화성 수지라서 가공이 불량하거나 산성·고온 조건에서 포름알데히드가 용출될 수 있다. 염화비닐, 폴리스틸렌, 폴리에틸렌, 폴리프로필렌 수지는 열가소성 수지이다."},{"id":"42-2-58","r":42,"p":2,"n":58,"s":"식품위생학","q":"덜 익은 매실(청매)의 독성분은?","o":["리신(ricin)","솔라닌(solanine)","고시폴(gossypol)","시큐톡신(cicutoxin)","아미그달린(amygdalin)"],"a":5,"e":"덜 익은 매실(청매)과 살구씨, 복숭아씨에는 시안배당체인 아미그달린이 있어, 분해되면 청산(HCN)이 생긴다. 솔라닌은 감자 싹, 고시폴은 목화씨, 리신은 피마자, 시큐톡신은 독미나리의 독성분이다."},{"id":"42-2-59","r":42,"p":2,"n":59,"s":"식품위생학","q":"황변미 중독의 원인독소는?","o":["아플라톡신(aflatoxin)","에르고톡신(ergotoxin)","엔테로톡신(enterotoxin)","이슬란디톡신(islanditoxin)","테트로도톡신(tetrodotoxin)"],"a":4,"e":"황변미 중독은 Penicillium 속 곰팡이가 쌀에 번식하여 생기며, Penicillium islandicum이 만드는 이슬란디톡신(간장독)이 원인독소 중 하나이다. 아플라톡신은 Aspergillus flavus가 땅콩·곡류에 만드는 독소이고, 에르고톡신은 맥각 독소이다."},{"id":"42-2-60","r":42,"p":2,"n":60,"s":"식품위생학","q":"맥각균(Claviceps purpurea)이 생산하는 곰팡이독소는?","o":["파툴린(patulin)","시트리닌(citrinin)","에르고톡신(ergotoxin)","루브라톡신(rubratoxin)","제아랄레논(zearalenone)"],"a":3,"e":"맥각균(Claviceps purpurea)은 호밀·보리 이삭에 기생하면서 에르고톡신, 에르고타민 같은 맥각 알칼로이드를 만든다. 파툴린은 사과의 Penicillium, 제아랄레논은 Fusarium이 만드는 곰팡이독소이다."},{"id":"42-2-61","r":42,"p":2,"n":61,"s":"식품위생학","q":"바이러스성 경구감염병은?","o":["이질","성홍열","콜레라","A형간염","파라티푸스"],"a":4,"e":"A형간염은 A형간염 바이러스가 오염된 물·음식을 통해 경구로 전파되는 바이러스성 감염병이다. 이질, 콜레라, 파라티푸스, 성홍열은 세균이 원인이다."},{"id":"42-2-62","r":42,"p":2,"n":62,"s":"식품위생학","q":"장티푸스균의 속명은?","o":["Proteus","Escherichia","Salmonella","Clostridium","Pseudomonas"],"a":3,"e":"장티푸스균은 Salmonella Typhi로, 살모넬라(Salmonella) 속에 속한다. Escherichia는 대장균, Clostridium은 혐기성 아포형성균 속이다."},{"id":"42-2-63","r":42,"p":2,"n":63,"s":"식품위생학","q":"다음의 경구감염병은?","o":["성홍열","콜레라","장티푸스","디프테리아","파라티푸스"],"a":2,"b":"• 복통, 구토, 쌀뜨물 같은 설사 등의 증상이 발생한다.\n• 수분 손실로 인한 탈수 증상이 나타난다.","e":"콜레라는 Vibrio cholerae가 원인이며, 열 없이 쌀뜨물 같은 심한 설사와 구토가 나타나 탈수가 빨리 진행된다. 장티푸스와 파라티푸스는 지속적인 고열이 특징이다."},{"id":"42-2-64","r":42,"p":2,"n":64,"s":"식품위생학","q":"보균자의 분변에 오염된 음식을 통하여 감염되며 주로 불현성 감염으로 나타나는 바이러스성 감염병은?","o":["Q열","파상열","폴리오","장티푸스","렙토스피라증"],"a":3,"e":"폴리오는 폴리오바이러스가 분변-경구 경로로 전파되며, 감염자 대부분이 증상이 없는 불현성 감염으로 지나간다. 장티푸스는 세균성이고, Q열과 파상열, 렙토스피라증은 인수공통감염병이다."},{"id":"42-2-65","r":42,"p":2,"n":65,"s":"식품위생학","q":"인수공통감염병은?","o":["이질","야토병","폴리오","콜레라","장티푸스"],"a":2,"e":"야토병은 산토끼 같은 야생 설치류에서 사람으로 전파되는 인수공통감염병이다. 이질, 폴리오, 콜레라, 장티푸스는 사람만 병원소인 경구감염병이다."},{"id":"42-2-66","r":42,"p":2,"n":66,"s":"식품위생학","q":"결핵의 원인이 되는 병원체는?","o":["Bacillus anthracis","Brucella melitensis","Pasteurella tularensis","Erysipelothrix rhusiopathiae","Mycobacterium tuberculosis"],"a":5,"e":"결핵의 병원체는 Mycobacterium tuberculosis(결핵균)이다. Bacillus anthracis는 탄저, Brucella melitensis는 파상열(브루셀라증), Pasteurella tularensis는 야토병, Erysipelothrix rhusiopathiae는 돈단독의 원인균이다."},{"id":"42-2-67","r":42,"p":2,"n":67,"s":"식품위생학","q":"채소류에 의해 감염되는 기생충은?","o":["무구조충","유구조충","십이지장충","유극악구충","광절열두조충"],"a":3,"e":"십이지장충(구충)은 채소에 붙은 유충을 먹거나 피부로 유충이 침입해 감염되는 채소류 매개 기생충이다. 무구조충은 소고기, 유구조충은 돼지고기, 광절열두조충은 연어·송어 같은 민물고기를 통해 감염된다."},{"id":"42-2-68","r":42,"p":2,"n":68,"s":"식품위생학","q":"오징어 등 해산어류의 생식에 의해 감염되는 기생충은?","o":["선모충","아니사키스","광절열두조충","만손열두조충","톡소플라스마"],"a":2,"e":"아니사키스는 오징어, 고등어, 대구 같은 해산어류를 날로 먹을 때 감염되는 기생충이다. 선모충은 돼지고기, 광절열두조충은 연어·송어, 톡소플라스마는 고양이 분변이나 덜 익힌 고기로 감염된다."},{"id":"42-2-69","r":42,"p":2,"n":69,"s":"식품위생학","q":"식품의 변질이나 부패를 방지하기 위해 사용하는 식품첨가물은?","o":["강화제","보존료","소포제","착향료","피막제"],"a":2,"e":"보존료는 미생물 증식을 억제하여 식품의 변질과 부패를 막는 식품첨가물로, 소브산·안식향산 등이 있다. 소포제는 거품을 없애고, 피막제는 표면에 막을 만들어 수분 증발을 막는 첨가물이다."},{"id":"42-2-70","r":42,"p":2,"n":70,"s":"식품위생학","q":"식품의 최종 완성 전에 분해하거나 제거해야 하는 표백제는?","o":["과산화수소","무수아황산","아황산나트륨","차아황산나트륨","메타중아황산칼륨"],"a":1,"e":"과산화수소는 표백·살균 목적으로 쓰지만 최종 식품이 완성되기 전에 분해하거나 제거해야 한다는 사용기준이 있다. 무수아황산, 아황산나트륨 같은 아황산류 표백제는 잔류량 기준 안에서 남아 있어도 된다."},{"id":"42-2-71","r":42,"p":2,"n":71,"s":"식품위생학","q":"육류의 발색제는?","o":["아질산나트륨","알긴산나트륨","안식향산나트륨","차아염소산나트륨","프로피온산나트륨"],"a":1,"e":"아질산나트륨은 육류의 미오글로빈과 결합해 안정한 붉은색 니트로소미오글로빈을 만드는 발색제이다. 안식향산나트륨과 프로피온산나트륨은 보존료, 알긴산나트륨은 증점제, 차아염소산나트륨은 살균제이다."},{"id":"42-2-72","r":42,"p":2,"n":72,"s":"식품위생학","q":"물과 기름을 잘 혼합시켜 분리되지 않도록 하는 식품첨가물은?","o":["강화제","소포제","유화제","이형제","추출제"],"a":3,"e":"유화제는 물과 기름처럼 섞이지 않는 두 물질을 고르게 섞어 분리되지 않게 하는 첨가물로, 레시틴·글리세린지방산에스테르 등이 있다. 소포제는 거품을 없애고, 이형제는 빵을 틀에서 쉽게 떼어 내는 데 쓴다."},{"id":"42-2-73","r":42,"p":2,"n":73,"s":"식품위생학","q":"식품 살균에 사용하는 방사선원은?","o":["³H","¹⁴C","³⁶S","⁶⁰Co","¹³¹I"],"a":4,"e":"식품 조사(照射) 살균에는 감마선을 내는 코발트-60(⁶⁰Co)이 주로 쓰인다. ¹³¹I는 갑상선 관련 방사성 오염물질, ³H와 ¹⁴C는 추적자로 쓰이는 동위원소이다."},{"id":"42-2-74","r":42,"p":2,"n":74,"s":"식품위생학","q":"다음의 정의에 해당하는 용어는?","o":["검증","위해요소","한계기준","중요관리점","HACCP 관리계획"],"a":4,"b":"HACCP을 적용하여 식품의 위해요소를 예방·제거하거나, 허용수준 이하로 감소시켜 당해 식품의 안전성을 확보할 수 있는 중요한 단계·과정 또는 공정을 말한다.","e":"중요관리점(CCP)은 HACCP을 적용하여 위해요소를 예방·제거하거나 허용수준 이하로 줄여 식품 안전성을 확보할 수 있는 중요한 단계·과정·공정이다. 한계기준은 중요관리점에서 위해요소가 관리되는지 판단하는 기준값이고, 위해요소는 건강을 해칠 수 있는 생물학적·화학적·물리적 인자이다."},{"id":"42-2-75","r":42,"p":2,"n":75,"s":"식품위생학","q":"HACCP 적용을 위한 12절차 중 준비(예비)단계에 속하는 것은?","o":["위해요소 분석","공정흐름도 작성","중요관리점 결정","개선조치방법 수립","모니터링체계 확립"],"a":2,"e":"HACCP 준비단계 5절차는 HACCP팀 구성, 제품설명서 작성, 용도 확인, 공정흐름도 작성, 공정흐름도 현장 확인이다. 위해요소 분석, 중요관리점 결정, 모니터링체계 확립, 개선조치방법 수립은 7원칙에 해당한다."},{"id":"42-3-1","r":42,"p":3,"n":1,"s":"실기시험","q":"(사진 1) 사진과 같은 기구를 이용하여 측정하는 온열인자는?","o":["기류","기습","기압","기온","복사열"],"a":5,"e":"사진: 흑구온도계(흑구가 달린 WBGT 측정기) — 검게 칠한 구리 구(지름 약 15 cm) 안에 온도계가 꽂혀 있는 모양이 알아보는 포인트다. 흑구가 주변의 복사열을 흡수하므로 15~20분 뒤 읽은 흑구온도로 복사열을 평가한다. 기류는 카타온도계·풍속계로, 기습은 아스만 통풍건습계로 측정하므로 틀리다.","ph":["s01"],"m":"사진"},{"id":"42-3-2","r":42,"p":3,"n":2,"s":"실기시험","q":"그림과 같은 감각온도 도표에서 건구온도 70°F, 습구온도 60°F, 기류의 속도가 200 ft/min일 때 공기의 감각온도는?","o":["55°F","60°F","65°F","70°F","75°F"],"a":3,"e":"감각온도 도표는 건구온도와 습구온도 눈금을 직선으로 잇고, 그 선이 해당 기류 속도 곡선과 만나는 점에서 감각온도를 읽는다. 건구 70°F, 습구 60°F, 기류 200 ft/min 조건을 이렇게 읽으면 65°F가 된다. 기류가 있으면 건구온도보다 낮게 느껴지므로 70°F·75°F는 맞지 않는다.","pr":1,"ph":["g:et","g:et_sol"],"m":"그림"},{"id":"42-3-3","r":42,"p":3,"n":3,"s":"실기시험","q":"다음 공식으로 계산하는 지수는?","o":["감각지수","등온지수","불쾌지수","온열지수","습구흑구온도지수"],"a":3,"b":"(건구온도℃ + 습구온도℃) × 0.72 + 40.6","e":"(건구온도 + 습구온도)℃ × 0.72 + 40.6은 불쾌지수(DI) 공식이며, 화씨로는 (건구 + 습구)°F × 0.4 + 15이다. 습구흑구온도지수(WBGT)는 습구·흑구·건구온도에 가중치(옥외 0.7·0.2·0.1)를 주는 공식이라 다르다."},{"id":"42-3-4","r":42,"p":3,"n":4,"s":"실기시험","q":"실내 공기에 존재하는 석면을 측정하는 시험방법은?","o":["위상차현미경법","자외선/가시선분광법","마이크로파 산분해법","기체크로마토그래피","고성능액체크로마토그래피"],"a":1,"e":"실내공기질 공정시험기준에서 석면은 필터에 포집한 뒤 위상차현미경으로 섬유 수를 세는 위상차현미경법으로 측정한다. 기체크로마토그래피는 휘발성유기화합물, 고성능액체크로마토그래피는 폼알데하이드 분석에 쓰는 방법이라 틀리다."},{"id":"42-3-5","r":42,"p":3,"n":5,"s":"실기시험","q":"오물 또는 객담을 소독할 때 사용하며 물에 난용성이고 석탄산계수가 2인 소독약은?","o":["염소","생석회","승홍수","크레졸","포르말린"],"a":4,"e":"크레졸은 석탄산계수가 약 2로 석탄산보다 살균력이 강하지만 물에 잘 녹지 않아 비누액(크레졸비누액)으로 만들어 약 3%로 쓰며, 오물·객담 소독에 적합하다. 승홍수는 단백질과 결합해 침전하고 금속을 부식시키므로 객담 소독에는 맞지 않다."},{"id":"42-3-6","r":42,"p":3,"n":6,"s":"실기시험","q":"생활폐기물 시료의 전체 수분이 60%, 회분이 0.7%로 분석되었을 때, 이 생활폐기물의 가연분 함량(%)은?","o":["39.3","40.0","40.7","41.3","42.0"],"a":1,"e":"【공식】 가연분(%) = 100 − 수분(%) − 회분(%)\n【풀이】 100 − 60 − 0.7 = 39.3%\n폐기물은 수분, 회분, 가연분의 세 성분으로 나누므로 회분을 빼지 않은 40.0%는 틀리다."},{"id":"42-3-7","r":42,"p":3,"n":7,"s":"실기시험","q":"다음은 「폐기물공정시험기준」에 따라 강열감량 및 유기물 함량을 측정하는 방법이다. (    ) 안에 들어갈 온도는?","o":["400±25","500±25","600±25","700±25","800±25"],"a":3,"b":"시료에 질산암모늄 용액(25%)을 넣고 가열한 다음 (          )℃의 전기로 안에서 3시간 동안 강열하고 데시케이터에서 식힌 후 무게를 달아 증발접시의 무게 차이로부터 강열감량 및 유기물함량(%)을 구한다.","e":"폐기물공정시험기준의 강열감량 및 유기물 함량 측정에서는 질산암모늄 용액(25%)을 넣고 가열한 뒤 600±25℃ 전기로에서 3시간 강열한다. 수분·고형물 측정의 건조 온도(105~110℃)나 다른 강열 온도와 헷갈리지 않도록 '600℃, 3시간'을 묶어서 외운다."},{"id":"42-3-8","r":42,"p":3,"n":8,"s":"실기시험","q":"먹는물의 분석에서 용액 100 g 중 성분 용량(mL)을 백분율로 표시하는 기호는?","o":["V/V%","V/W%","W/L%","W/V%","W/W%"],"a":2,"e":"V/W%는 용액 100 g 중 성분의 용량(mL)을 나타낸다. W/V%는 용액 100 mL 중 성분 무게(g), V/V%는 용액 100 mL 중 성분 용량(mL), W/W%는 용액 100 g 중 성분 무게(g)이므로 분모가 질량인지 부피인지로 구분한다."},{"id":"42-3-9","r":42,"p":3,"n":9,"s":"실기시험","q":"그림은 일반적인 도시 하수 처리의 계통도이다. (가)~(마) 중 물리적 처리로 이루어지는 공정 구간은?","o":["(가)","(나)","(다)","(라)","(마)"],"a":1,"e":"도시 하수 처리는 스크린·침사지·1차 침전지의 물리적 처리, 포기조(활성슬러지 등)의 생물학적 처리, 소독의 화학적 처리 순으로 이루어진다. 따라서 계통도의 처음 구간(가)이 물리적 처리 구간이다. 포기조와 2차 침전지는 미생물을 이용하는 생물학적 처리라서 오답이다.","ns":1,"pr":1,"ph":["g:sewage","g:sewage_sol"],"m":"그림"},{"id":"42-3-10","r":42,"p":3,"n":10,"s":"실기시험","q":"화학적 소독법에서 소독제가 갖추어야 할 조건으로 옳은 것은?","o":["독성이 높을 것","용해성이 낮을 것","표백성이 있을 것","안정성이 없을 것","석탄산 계수가 높을 것"],"a":4,"e":"공식 정답은 '안정성이 없을 것'으로 발표되었다. 다만 일반 교재에서는 소독제가 갖춰야 할 조건으로 '안정성이 있을 것'과 '석탄산계수가 높을 것(살균력이 강할 것)'을 들고 있어 공식 정답과 어긋난다. 독성이 높을 것, 용해성이 낮을 것, 표백성이 있을 것은 어느 기준으로 보아도 틀린 조건이다. ※ 출제 당시 기준 ※ 교재 확인 권장"},{"id":"42-3-11","r":42,"p":3,"n":11,"s":"실기시험","q":"(사진 2) 사진과 같은 기기로 측정할 수 있는 것은?","o":["경도","색도","탁도","잔류염소","수소이온농도"],"a":5,"e":"사진: pH 미터(수소이온농도 측정기) — 숫자가 표시되는 본체에 유리전극(막대 모양 프로브)이 연결된 모양이 알아보는 포인트다. 유리전극과 비교전극 사이의 전위차로 수소이온농도(pH)를 측정하며, 사용 전에 표준완충액으로 교정한다. 탁도는 탁도계(NTU)로, 잔류염소는 DPD 비색법 등으로 측정하므로 틀리다.","ph":["s02"],"m":"사진"},{"id":"42-3-12","r":42,"p":3,"n":12,"s":"실기시험","q":"그림에서 유기물 유입 후 생물화학적 산소요구량이 1단계와 2단계를 구분하는 변곡점까지 가는 데 걸리는 배양 일수는?","o":["2~5일","9~12일","15~18일","21~24일","25~28일"],"a":2,"e":"BOD 곡선의 1단계는 탄소계 유기물 분해에 의한 산소 소비이고, 약 9~12일 무렵 변곡점 이후 2단계인 질산화(질소계 BOD)가 나타난다. 2~5일은 아직 1단계가 진행 중인 구간이며, BOD를 5일간 배양해 측정하는 것도 질산화의 영향을 피하기 위해서다.","pr":1,"ph":["g:bod","g:bod_sol"],"m":"그림"},{"id":"42-3-13","r":42,"p":3,"n":13,"s":"실기시험","q":"다음은 물속에 존재하는 총인을 자외선/가시선분광법으로 측정하는 방법이다. (    ) 안에 들어갈 것으로 옳은 것은?","o":["과황산칼륨","니트로페놀","아스코빈산","과망간산칼륨","수산화나트륨"],"a":3,"b":"유기물화합물 형태의 인을 산화 분해하여 모든 인 화합물을 인산염(PO₄³⁻) 형태로 변화시킨 다음 몰리브덴산암모늄과 반응하여 생성된 몰리브덴산인암모늄을 (          )(으)로 환원하여 생성된 몰리브덴산의 흡광도를 880 nm에서 측정하여 총인의 양을 정량하는 방법이다.","e":"총인 측정에서는 과황산칼륨으로 유기 인을 산화 분해해 인산염으로 바꾸고, 몰리브덴산암모늄과 반응시켜 생긴 몰리브덴산인암모늄을 아스코빈산으로 환원한 뒤 880 nm에서 흡광도를 측정한다. 과황산칼륨은 앞 단계의 산화제이므로 빈칸(환원제)에 들어갈 수 없다."},{"id":"42-3-14","r":42,"p":3,"n":14,"s":"실기시험","q":"하천수의 부유물질(SS)을 측정할 때 유리섬유 여과지를 건조하는 온도는?","o":["85~90℃","95~100℃","105~110℃","115~120℃","125~130℃"],"a":3,"e":"부유물질(SS) 측정에서는 유리섬유 여과지를 105~110℃에서 건조해 항량으로 만든 뒤, 여과 전후의 무게 차로 SS를 구한다. 600℃ 같은 고온은 강열감량·휘발성 부유물질 측정 조건이라 다르다."},{"id":"42-3-15","r":42,"p":3,"n":15,"s":"실기시험","q":"식품의 제조, 가공 및 보존 중에 생성되는 발암성 유해물질은?","o":["리신(ricin)","솔라닌(solanine)","삭시톡신(saxitoxin)","테트로도톡신(tetrodotoxin)","N-니트로사민(N-nitrosamine)"],"a":5,"e":"N-니트로사민은 아질산염과 2급 아민이 식품 가공·보존 중이나 위 속 산성 조건에서 반응해 생기는 발암물질이다. 솔라닌(감자), 테트로도톡신(복어), 삭시톡신(마비성 패독), 리신(피마자)은 원래 생물에 들어 있는 자연독이라 틀리다."},{"id":"42-3-16","r":42,"p":3,"n":16,"s":"실기시험","q":"식품 제조시설의 작업장 내벽에는 바닥으로부터 몇 미터까지 밝은색으로 내수성 설비를 해야 하는가?","o":["0.5 m","1.0 m","1.5 m","2.0 m","2.5 m"],"a":3,"e":"식품위생법령의 식품 제조·가공업 시설기준에 따르면, 작업장 내벽은 바닥에서 1.5 m까지 밝은색의 내수성 자재로 설비하거나 세균방지용 페인트로 도색해야 한다. 바닥에 물이 튀고 오염되기 쉬운 높이를 청소하기 쉽게 하려는 기준이다."},{"id":"42-3-17","r":42,"p":3,"n":17,"s":"실기시험","q":"식품위생 시설의 바닥과 벽의 접속 부분 구조로 옳은 것은?","o":["A","B","C","D","E"],"a":1,"e":"식품위생 시설에서 바닥과 벽이 만나는 부분은 직각으로 두지 않고 둥글게(곡면) 처리해야 먼지와 오물이 쌓이지 않고 물청소가 쉽다. 그림에서는 모서리가 곡선으로 이어진 구조(A)를 고르면 된다. 직각이거나 틈·턱이 있는 구조는 오염물이 고여 미생물이 번식하기 쉬워 부적합하다.","ns":1,"pr":1,"ph":["g:floorwall","g:floorwall_sol"],"m":"그림"},{"id":"42-3-18","r":42,"p":3,"n":18,"s":"실기시험","q":"초기 부패로 판정할 수 있는 식품 1 g 또는 1 mL당 세균 수는?","o":["10¹~10²","10³~10⁴","10⁵~10⁶","10⁷~10⁸","10⁹~10¹⁰"],"a":4,"e":"식품 1 g(또는 1 mL)당 일반세균 수가 10⁷~10⁸이면 초기 부패로 판정한다. 10⁵ 수준은 아직 비교적 신선한 상태로 보며, 이 범위를 초기 부패 기준으로 착각하기 쉽다."},{"id":"42-3-19","r":42,"p":3,"n":19,"s":"실기시험","q":"(사진 3) 사진과 같은 기기를 사용한 배지의 멸균 조건은?","o":["61℃에서 10~15분 유지","81℃에서 15~20분 유지","101℃에서 10~15분 유지","111℃에서 15~20분 유지","121℃에서 15~20분 유지"],"a":5,"e":"사진: 고압증기멸균기(오토클레이브) — 압력계와 잠금식 뚜껑이 달린 원통형 금속 용기가 알아보는 포인트다. 고압증기멸균은 약 15 lb/in²(약 1기압 가압)에서 121℃로 15~20분 유지하는 조건으로, 아포까지 사멸시켜 배지 멸균에 쓰인다. 61℃·81℃ 같은 낮은 온도는 저온살균 수준이라 멸균이 되지 않는다.","ph":["s03"],"m":"사진"},{"id":"42-3-20","r":42,"p":3,"n":20,"s":"실기시험","q":"우유 살균의 North 도표에서 화살표 A는 어떤 균을 사멸하는 온도와 시간의 조합인가?","o":["결핵균","대장균","장티푸스균","연쇄상구균","디프테리아균"],"a":1,"e":"우유 살균 조건은 내열성이 비교적 강한 병원균인 결핵균을 사멸시키는 온도-시간 조합을 기준으로 정한다. North 도표의 기준선(A)도 결핵균 사멸 곡선이며, 저온살균(63~65℃, 30분)이 이 곡선보다 위에 오도록 설정된다. 장티푸스균·디프테리아균 등은 이 조건에서 함께 사멸하므로 기준균이 아니다.","pr":1,"ph":["g:north","g:north_sol"],"m":"그림"},{"id":"42-3-21","r":42,"p":3,"n":21,"s":"실기시험","q":"역성비누(invert soap)의 성분은?","o":["은화합물","과산화수소","수은화합물","4급 암모늄염","지방족화합물"],"a":4,"e":"역성비누는 4급 암모늄염 계열의 양이온 계면활성제로, 무색·무취·무독성에 가까워 손 소독이나 식기 소독에 쓴다. 보통 비누(음이온)와 섞으면 효력이 떨어진다. 수은화합물은 승홍이고 과산화수소는 산화 소독제라 다르다."},{"id":"42-3-22","r":42,"p":3,"n":22,"s":"실기시험","q":"그림에서 미생물의 증식이 기하급수적으로 일어나는 곳은?","o":["A","B","C","D","E"],"a":2,"e":"미생물 증식곡선은 유도기 → 대수기 → 정지기 → 사멸기 순으로 진행되며, 기하급수적으로 증식하는 시기는 유도기 바로 다음의 대수기(B)다. 유도기는 새 환경에 적응하느라 수가 거의 늘지 않고, 정지기는 증식과 사멸이 균형을 이루는 시기다.","ns":1,"pr":1,"ph":["g:growth","g:growth_sol"],"m":"그림"},{"id":"42-3-23","r":42,"p":3,"n":23,"s":"실기시험","q":"(사진 4) 사진과 같이 주모성 편모를 가진 식중독균은?","o":["결핵균","장구균","살모넬라균","연쇄상구균","장염비브리오균"],"a":3,"e":"사진: 주모성 편모(균체 전체에 편모) — 살모넬라 등 — 균체 둘레 전체에 가는 편모가 여러 개 퍼져 있는 모양이 알아보는 포인트다. 살모넬라균은 주모성 편모를 가진 그람음성 간균으로 감염형 식중독을 일으킨다. 장염비브리오균은 한쪽 끝에 편모가 하나인 단모성이고, 연쇄상구균·장구균·결핵균은 편모가 없다.","ph":["s04"],"m":"사진"},{"id":"42-3-24","r":42,"p":3,"n":24,"s":"실기시험","q":"(사진 5) 사진과 같은 형태의 구균으로 독소형 식중독을 유발하는 것은?","o":["pathogenic E. coli","Shigella dysenteriae","Clostridium botulinum","Staphylococcus aureus","Vibrio parahaemolyticus"],"a":4,"e":"사진: 황색포도상구균(포도송이 모양 구균) — 둥근 구균이 포도송이처럼 불규칙하게 뭉쳐 있는 모양이 알아보는 포인트다. Staphylococcus aureus는 열에 강한 장독소(enterotoxin)를 만들어 잠복기가 짧은 독소형 식중독을 일으킨다. Clostridium botulinum도 독소형이지만 아포를 형성하는 간균이라 형태가 다르다.","ph":["s05"],"m":"사진"},{"id":"42-3-25","r":42,"p":3,"n":25,"s":"실기시험","q":"그림과 같은 생활사를 갖는 기생충은?","o":["회충","선모충","무구조충","유구조충","만손열두조충"],"a":1,"e":"사진: 회충(성충·충란) — 성충은 유백색의 굵고 긴 선충이고, 충란은 표면이 울퉁불퉁한 두꺼운 단백막에 싸여 있는 것이 알아보는 포인트다. 회충은 충란을 먹으면 소장에서 부화한 유충이 간·폐를 거쳐(폐순환) 기관지·식도로 올라왔다가 다시 소장에서 성충이 된다. 무구조충(소고기)과 유구조충(돼지고기)은 중간숙주 고기를 통해 감염되므로 생활사가 다르다.","ph":["s06"],"m":"그림"},{"id":"42-3-26","r":42,"p":3,"n":26,"s":"실기시험","q":"다음에 해당하는 기생충은?","o":["아니사키스","동양모양선충","아메리카구충","요코가와흡충","톡소플라스마"],"a":5,"b":"• 발열, 두통, 근육통, 발진 증상을 유발함\n• 임신부가 감염되면 유산 또는 조산의 원인이 됨\n• 개, 고양이의 배설물에 오염된 식품을 섭취할 때 감염됨","e":"톡소플라스마는 고양이가 종숙주인 원충으로, 고양이 배설물에 오염된 식품이나 덜 익힌 고기를 통해 감염되며, 임신부가 감염되면 유산·조산이나 선천성 감염을 일으킨다. 아니사키스는 해산어류, 요코가와흡충은 은어 등 민물고기를 생식해 감염되므로 틀리다."},{"id":"42-3-27","r":42,"p":3,"n":27,"s":"실기시험","q":"(사진 6) 사진과 같이 편모가 없는 균은?","o":["콜레라균","여시니아균","세균성이질균","파라티푸스균","캠필로박터균"],"a":3,"e":"사진: 이질균(편모 없는 그람음성 간균) — 짧은 막대 모양 균체에 편모가 전혀 보이지 않는 것이 알아보는 포인트다. 세균성이질균(Shigella)은 편모가 없어 운동성이 없다. 콜레라균은 단모성, 캠필로박터균은 양 끝 극모, 파라티푸스균은 주모성 편모를 가져 운동성이 있다.","ph":["s07"],"m":"사진"},{"id":"42-3-28","r":42,"p":3,"n":28,"s":"실기시험","q":"그림과 같이 환자의 체온 변화가 나타나는 인수공통감염병은?","o":["야토병","탄저병","말라리아","브루셀라증","장관독소원성대장균감염증"],"a":4,"e":"브루셀라증은 소·돼지·염소 등에서 사람에게 옮는 인수공통감염병으로, 발열과 해열이 물결처럼 되풀이되는 파상열(undulant fever)이 특징이다. 그림의 체온 곡선이 이렇게 오르내림을 반복한다. 말라리아도 주기적으로 열이 나지만 인수공통감염병이 아니고 모기가 매개한다.","pr":1,"ph":["g:fever","g:fever_sol"],"m":"그림"},{"id":"42-3-29","r":42,"p":3,"n":29,"s":"실기시험","q":"(사진 7) 사진의 바퀴에 대한 설명으로 옳은 것은?","o":["수컷이다.","먹바퀴 자충이다.","몸길이는 32~38 mm이다.","체색은 전체적으로 광택성 적갈색이다.","전흉배판의 표면은 다른 바퀴에 비해 울퉁불퉁하다."],"a":5,"e":"사진: 일본바퀴 — 광택 있는 흑갈색 몸에 전흉배판 표면이 울퉁불퉁한(요철) 것이 알아보는 포인트이며, 암컷은 날개가 짧다. 이 전흉배판의 요철이 다른 바퀴와 구분하는 핵심 특징이다. 전체적으로 광택성 적갈색이고 몸이 큰 것은 이질바퀴의 특징이라 틀리다.","ph":["s08"],"m":"사진"},{"id":"42-3-30","r":42,"p":3,"n":30,"s":"실기시험","q":"그림과 같은 모양으로 산란하는 모기는?","o":["숲모기","왕모기","집모기","학질모기","얼룩날개모기"],"a":3,"e":"사진: 집모기 알덩이(난괴, 뗏목 모양) — 수백 개의 알이 수면에 세로로 붙어 뗏목처럼 떠 있는 것이 알아보는 포인트다. 집모기는 이렇게 난괴로 산란한다. 학질모기(얼룩날개모기)는 부낭(공기주머니)이 달린 알을 하나씩 낳고, 숲모기는 물가 벽면 등에 알을 하나씩 낳는다.","ph":["s09"],"m":"그림"},{"id":"42-3-31","r":42,"p":3,"n":31,"s":"실기시험","q":"(사진 8) 사진과 같이 관개수로를 개선하여 방제할 수 있는 위생곤충은?","o":["모기","파리","독나방","진드기","흡혈노린재"],"a":1,"e":"사진: 관개수로(논 물길) — 논 사이로 물이 흐르거나 고여 있는 물길이 알아보는 포인트이며, 이곳이 모기 유충의 발생원이다. 수로를 정비해 물이 고이지 않고 흐르게 하는 것은 환경적(물리적) 모기 방제법이다. 파리는 쓰레기·분변 등 유기물에서 발생하므로 수로 개선과는 관계가 적다.","ph":["s10"],"m":"사진"},{"id":"42-3-32","r":42,"p":3,"n":32,"s":"실기시험","q":"그림과 같은 파리는?","o":["쉬파리","집파리","침파리","딸집파리","큰집파리"],"a":3,"e":"사진: 침파리(Stomoxys calcitrans) — 겉모습은 집파리와 비슷하지만 가늘고 긴 주둥이(구기)가 앞으로 뾰족하게 튀어나와 있는 것이 알아보는 포인트다. 침파리는 이 주둥이로 사람과 가축을 흡혈한다. 집파리는 핥아 먹는 구기를 가져 흡혈하지 않는다.","ph":["s11"],"m":"그림"},{"id":"42-3-33","r":42,"p":3,"n":33,"s":"실기시험","q":"그림의 새털이목(Mallophaga)에 대한 설명으로 옳은 것은?","o":["사람에도 기생한다.","숙주동물을 흡혈한다.","숙주선택성이 엄격하다.","몸은 두흉부와 복부로 나뉜다.","조류독감을 전파하는 매개체이다."],"a":3,"e":"사진: 새털이(씹는이, Mallophaga) — 납작하고 날개가 없으며 머리가 가슴보다 넓은 작은 곤충인 것이 알아보는 포인트다. 새털이는 조류의 깃털이나 피부 부스러기를 씹어 먹는 이로 숙주선택성이 엄격하다. 흡혈하지 않고 사람에게 기생하지 않으며, 곤충이므로 몸이 머리·가슴·배로 나뉜다(두흉부+복부는 거미류의 구조).","ph":["s12"],"m":"그림"},{"id":"42-3-34","r":42,"p":3,"n":34,"s":"실기시험","q":"그림과 같은 위생곤충으로 인한 피해는?","o":["인체 기생","기계적 외상","기생충의 중간숙주","병원체의 기계적 전파","병원체의 생물학적 전파"],"a":2,"e":"예측 그림: 등에 — 칼날처럼 생긴 입틀로 피부를 베어 흘러나온 피를 빨기 때문에 물린 자리에 상처(기계적 외상)와 통증이 남는다. 기계적 외상은 물거나 찌르는 행위 자체로 피부에 상처를 내는 직접 피해로, 병원체를 옮기지 않아도 생긴다는 점이 핵심이다. 병원체의 기계적 전파(파리·바퀴처럼 몸에 묻혀 옮김)나 생물학적 전파(모기 체내에서 증식·발육)와 구분해야 한다. ※ 실제 그림은 비공개라 등에로 추정함","pr":1,"ph":["s72"],"m":"그림"},{"id":"42-3-35","r":42,"p":3,"n":35,"s":"실기시험","q":"그림과 같은 벼룩은?","o":["개벼룩","사람벼룩","모래벼룩","좀닭벼룩","열대쥐벼룩"],"a":1,"e":"사진: 개벼룩(즐치 있음, Ctenocephalides) — 머리 아래쪽의 협즐치와 앞가슴의 전흉즐치(빗 모양 가시)가 모두 있는 것이 알아보는 포인트다. 이 두 즐치가 개벼룩 동정의 핵심이다. 사람벼룩과 열대쥐벼룩은 즐치가 없어 구분된다.","ph":["s13"],"m":"그림"},{"id":"42-3-36","r":42,"p":3,"n":36,"s":"실기시험","q":"(사진 9) 사진과 같은 위생곤충이 대량으로 발생했을 때 이를 방제하는 방법으로 옳은 것은?","o":["기피제 사용","흡충관 사용","함정 트랩 사용","살충제 잔류분무","이산화탄소 트랩 사용"],"a":4,"e":"예측 사진: 노래기·독일바퀴처럼 한꺼번에 많이 발생하는 해충 — 대량 발생 시에는 서식처나 건물 주변 벽면·바닥에 효과가 오래가는 살충제를 뿌려 두고, 그 위를 지나는 개체가 접촉해 죽게 하는 잔류분무가 가장 효과적이다. 기피제는 개인 보호용이고, 흡충관·함정 트랩·이산화탄소 트랩은 채집이나 밀도조사용이라 대량 방제 수단이 아니다. ※ 실제 사진은 비공개라 대상을 추정함","pr":1,"ph":["s73","s74"],"m":"사진"},{"id":"42-3-37","r":42,"p":3,"n":37,"s":"실기시험","q":"(사진 10) 사진과 같은 위생곤충이 주는 피해는?","o":["인체에 기생한다.","독성물질을 주입한다.","알레르기 천식을 유발한다.","2차적인 세균감염을 일으킨다.","병원체를 기계적으로 전파한다."],"a":2,"e":"예측 사진: 벌(말벌·꿀벌) — 배 끝의 독침으로 피부를 찔러 독성물질(봉독)을 주입해 통증·부종을 일으키고, 심하면 아나필락시스 쇼크까지 생긴다. 알레르기 천식은 집먼지진드기·바퀴 배설물 같은 알레르겐에 의한 피해, 인체 기생은 이·옴진드기, 병원체의 기계적 전파는 파리·바퀴의 피해라 다르다. ※ 실제 사진은 비공개라 벌로 추정함","pr":1,"ph":["s36","s71"],"m":"사진"},{"id":"42-3-38","r":42,"p":3,"n":38,"s":"실기시험","q":"그림과 같은 위생곤충은?","o":["몸이","사면발이","옴진드기","참진드기","물렁진드기"],"a":3,"e":"사진: 옴진드기(Sarcoptes scabiei) — 둥글고 납작한 몸에 다리가 짧고, 등 표면에 주름과 작은 가시가 있는 것이 알아보는 포인트다. 옴진드기는 피부 각질층에 굴을 파고 기생해 밤에 심해지는 가려움(옴)을 일으킨다. 참진드기는 훨씬 크고 흡혈하며, 사면발이는 다리가 3쌍인 이(곤충)다.","ph":["s14"],"m":"그림"},{"id":"42-3-39","r":42,"p":3,"n":39,"s":"실기시험","q":"(사진 11) 사진 속 동물의 천적은?","o":["수달","고라니","족제비","청설모","청둥오리"],"a":3,"e":"사진: 시궁쥐(Rattus norvegicus) — 몸이 굵고 주둥이가 뭉툭하며, 귀가 작고 꼬리가 몸통보다 짧은 것이 알아보는 포인트다. 족제비는 쥐를 잡아먹는 대표적인 천적이다. 청설모와 고라니는 초식성이고, 수달은 주로 물고기를 먹으므로 틀리다.","ph":["s15"],"m":"사진"},{"id":"42-3-40","r":42,"p":3,"n":40,"s":"실기시험","q":"파리의 방제 효과를 확인하기 위한 밀도조사에 필요한 기구는?","o":["흡충관","유문등(라이트 트랩)","파리격자","피트폴 트랩(함정)","포충망"],"a":3,"e":"파리격자(Scudder grill)는 가는 나무 살을 일정 간격으로 붙인 격자판으로, 파리가 모이는 곳에 놓고 일정 시간(약 30초) 동안 앉은 파리 수를 세어 방제 전후의 밀도를 비교한다. 흡충관·포충망은 곤충을 직접 잡는 채집 도구, 유문등은 빛으로 모기 등을 모으는 채집기, 피트폴 트랩은 땅에 묻어 기어다니는 곤충을 잡는 함정이라 파리 밀도조사용이 아니다. ※ 보기 그림은 비공개라 예측해 그림","ns":1,"pr":1,"oi":["g:o_asp","g:o_light","g:o_grill","g:o_pit","g:o_net"],"pa":1,"ph":["s17","g:grill"],"m":"그림"},{"id":"43-1-1","r":43,"p":1,"n":1,"s":"위생관계법령","q":"「공중위생관리법」상 공중이 이용하는 건축물·시설물등의 청결유지와 실내공기정화를 위한 청소등을 대행하는 영업을 정의하는 용어는?","o":["숙박업","미용업","세탁업","목욕장업","건물위생관리업"],"a":5,"e":"공중위생관리법은 공중이 이용하는 건축물·시설물 등의 청결유지와 실내공기정화를 위한 청소 등을 대행하는 영업을 건물위생관리업으로 정의한다. 세탁업은 의류 기타 섬유제품을 세탁하는 영업, 숙박업은 손님이 잠을 자고 머물 수 있도록 시설을 제공하는 영업이라 정의가 다르다."},{"id":"43-1-2","r":43,"p":1,"n":2,"s":"위생관계법령","q":"「공중위생관리법」상 보건복지부장관이 위생사의 면허를 취소하는 처분을 할 때 거쳐야 하는 절차는?","o":["보상","재심","청문","심문","소청"],"a":3,"e":"공중위생관리법상 보건복지부장관이 위생사 면허를 취소하려면 처분 전에 당사자의 의견을 듣는 청문을 거쳐야 한다(시장·군수·구청장의 영업소 폐쇄명령 등도 청문 대상). 재심이나 소청은 판결·징계에 대한 불복 절차로 행정처분 전 절차가 아니다."},{"id":"43-1-3","r":43,"p":1,"n":3,"s":"위생관계법령","q":"「공중위생관리법」상 위생사가 되려면 위생사 국가시험에 합격한 후 누구의 면허를 받아야 하는가?","o":["환경부장관","보건복지부장관","지방환경관서의 장","식품의약품안전처장","한국보건의료인국가시험원장"],"a":2,"e":"위생사는 위생사 국가시험에 합격한 후 보건복지부장관의 면허를 받아야 한다. 한국보건의료인국가시험원장은 시험을 시행할 뿐 면허를 주지 않으며, 환경부장관·식품의약품안전처장은 면허 발급권자가 아니다."},{"id":"43-1-4","r":43,"
