<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위생사 기출 반복풀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --soft:#f3f3f1; --soft2:#e9e9e6; --ink:#1e1e1e; --muted:#6e6e6a;
  --ok:#2456a4; --ok-bg:#eaf0f8; --bad:#cf3a2f; --bad-bg:#fbeeec;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding:0 16px 64px}
.wrap{max-width:760px;margin:0 auto}
header.top{padding:32px 0 8px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;font-size:.86rem;max-width:64ch}
.bar{background:var(--bg);padding:12px 0;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--soft2)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.tabs .lab{font-size:.74rem;color:var(--muted);margin-right:4px;min-width:2.6em}
.tab{font:inherit;font-size:.82rem;border:0;background:var(--soft);color:var(--ink);padding:4px 10px;border-radius:4px;cursor:pointer}
.tab:hover{background:var(--soft2)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#modes .tab{font-weight:600;font-size:.88rem;padding:5px 11px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.84rem}
.tools button{font:inherit;font-size:.8rem;border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--soft2)}
.tools button:hover{color:var(--ink)}
.tools button.primary{background:var(--ink);color:var(--bg);text-decoration:none;padding:5px 12px}
.tools button[aria-pressed="true"]{color:var(--ink);text-decoration-color:var(--ink)}
.tools .tab{background:var(--soft);color:var(--ink);text-decoration:none;padding:4px 10px}
.tools .tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.score b{color:var(--ink)}
.q{padding:22px 0 6px;border-bottom:1px solid var(--soft)}
.meta{font-size:.74rem;color:var(--muted);margin-bottom:4px}
.meta .hot{color:var(--bad)}
.qhead{display:flex;gap:10px;align-items:baseline}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);flex:none;font-size:.9rem}
.q.ok .num{color:var(--ok)} .q.bad .num{color:var(--bad)}
.stem{font-family:var(--f-display);font-size:1.05rem;min-width:0}
.box{display:block;background:var(--soft);border-radius:4px;padding:10px 12px;margin-top:8px;font-family:var(--f-body);font-size:.9rem;white-space:pre-line}
.figno{margin-top:8px;font-size:.8rem;color:var(--muted);background:var(--soft);border-radius:4px;padding:8px 10px}
.opts{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:2px}
.opt{width:100%;text-align:left;font:inherit;font-size:.93rem;background:transparent;color:var(--ink);border:0;border-radius:4px;padding:7px 10px;cursor:pointer;display:flex;gap:8px}
.opt:hover:not(:disabled){background:var(--soft)}
.opt:disabled{cursor:default;color:var(--muted)}
.opt.right{background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-bg);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.mk{flex:none;width:1.2em;opacity:.7}
.res{margin-top:8px;font-size:.86rem;background:var(--soft);border-radius:4px;padding:9px 12px}
.res b.okt{color:var(--ok)} .res b.badt{color:var(--bad)}
.gal{margin-top:10px}
.gal .main{position:relative;background:#111;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;max-height:420px}
.gal .main img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.gal .main svg{width:100%;height:100%;background:#f7f5ef}
.gal .nav{position:absolute;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.85);color:#111;width:34px;height:34px;border-radius:50%;font-size:1.1rem;cursor:pointer}
.gal .nav.l{left:8px} .gal .nav.r{right:8px}
.gal .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:.72rem;padding:1px 7px;border-radius:10px}
.thumbs{display:flex;gap:4px;margin-top:6px;overflow-x:auto;padding-bottom:2px}
.thumbs button{flex:none;border:2px solid transparent;padding:0;border-radius:4px;overflow:hidden;cursor:pointer;background:var(--soft);width:58px;height:44px}
.thumbs button[aria-current="true"]{border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .svgt{font-size:.6rem;color:var(--muted);display:flex;align-items:center;justify-content:center;height:100%}
.credit{font-size:.7rem;color:var(--muted);margin-top:4px;word-break:break-all}
.credit a{color:inherit}
.what{margin-top:6px;font-size:.86rem;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.more{display:flex;justify-content:center;margin:24px 0}
.btn{font:inherit;font-size:.86rem;border:0;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:4px;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.subj{padding:20px 0;border-bottom:1px solid var(--soft)}
.subj h3{font-family:var(--f-display);font-size:1.05rem;margin:0 0 6px}
.subj h3 .hid{background:var(--soft2);color:transparent;border-radius:3px;cursor:pointer;padding:0 6px}
.subj .qs{font-size:.76rem;color:var(--muted);margin-top:4px}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:16px 0}
.dash div{background:var(--soft);border-radius:6px;padding:10px 12px;font-size:.8rem;color:var(--muted)}
.dash b{display:block;font-size:1.25rem;color:var(--ink);font-variant-numeric:tabular-nums}
.opt:focus-visible,.tab:focus-visible,.tools button:focus-visible,.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
footer{margin-top:40px;font-size:.74rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>위생사 기출 반복풀이</h1>
  <p class="sub">제42~47회 기출 1,240문제(1·2교시) + 제42~45회 3교시 실기. 정답은 국시원 최종답안 기준이에요. 실기 사진은 시험에서 비공개라, 문제 정답으로 대상을 추정해 같은 대상의 공개 사진을 여러 장 넣었어요.</p>
</header>
<div class="bar" id="bar">
  <div class="tabs" id="modes"></div>
  <div class="tabs" id="subjects"></div>
  <div class="tabs" id="rounds"></div>
  <div class="tools">
    <button class="primary" id="newset">새 세트</button>
    <button id="redo">이 세트 다시 풀기</button>
    <button id="shuf" aria-pressed="true">보기 섞기</button>
    <span id="sizeSel"></span>
    <span class="score" id="score"></span>
  </div>
</div>
<main id="list"></main>
<footer>사진 출처: Wikimedia Commons(각 사진 아래 저작자·라이선스 표시). 실제 시험 사진과 다를 수 있으니, 대상의 생김새를 익히는 용도로 보세요. 기록은 이 브라우저에만 저장돼요.</footer>
</div>
<script>
const QS=[{"id":"42-1-1","r":42,"p":1,"n":1,"s":"위생관계법령","q":"「공중위생관리법」이 적용되지 <u>않는</u> 영업은?","o":["세탁업","소독업","목욕장업","피부미용업","건물위생관리업"],"a":2},{"id":"42-1-2","r":42,"p":1,"n":2,"s":"위생관계법령","q":"「공중위생관리법」상 위생사의 위생업무 중 대통령령으로 정한 업무는?","o":["보건관리업무","음료수의 처리","위생용품의 위생관리","공중위생영업소의 위생관리","유해 곤충·설치류 및 매개체 관리"],"a":1},{"id":"42-1-3","r":42,"p":1,"n":3,"s":"위생관계법령","q":"「공중위생관리법」상 공중위생영업자가 준수하여야 하는 위생관리기준 등으로 옳은 것은?","o":["목욕장의 욕조수는 매년 1회 이상 수질검사를 하여야 한다.","피부미용 시 안전을 위해 약사법에 따른 의약품을 사용하여야 한다.","숙박업장의 객실 조명도는 60럭스 이상이 되도록 유지하여야 한다.","목욕장 수면실의 조명도는 20럭스 이상이 되도록 유지하여야 한다.","이용업자의 작업장 조명도는 70럭스 이상이 되도록 유지하여야 한다."],"a":1},{"id":"42-1-4","r":42,"p":1,"n":4,"s":"위생관계법령","q":"「공중위생관리법」상 (    )에 들어갈 것으로 옳은 것은?","o":["50","100","500","1,000","3,000"],"a":4,"b":"해수를 목욕물로 사용할 때 총대장균군수는 100 mL당 (    ) 이하가 되어야 한다."},{"id":"42-1-5","r":42,"p":1,"n":5,"s":"위생관계법령","q":"「공중위생관리법」상 이용기구 및 미용기구의 소독 기준으로 옳지 <u>않은</u> 것은?","o":["자외선소독: 1 cm²당 70 μW 이상의 자외선을 20분 이상 쬐어준다.","건열멸균소독: 섭씨 100℃ 이상의 건조한 열에 20분 이상 쐬어준다.","증기소독: 섭씨 100℃ 이상의 습한 열에 20분 이상 쐬어준다.","열탕소독: 섭씨 100℃ 이상의 물속에 10분 이상 끓여준다.","에탄올소독: 에탄올수용액(에탄올 70%인 수용액)에 10분 이상 담가둔다."],"a":1},{"id":"42-1-6","r":42,"p":1,"n":6,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 것으로 옳은 것은?","o":["1","2","3","5","10"],"a":4,"b":"식품의약품안전처장은 관계 중앙행정기관의 장과의 협의 및 심의위원회의 심의를 거쳐 식품등의 기준 및 규격 관리 기본계획을 (    )년마다 수립·추진할 수 있다."},{"id":"42-1-7","r":42,"p":1,"n":7,"s":"위생관계법령","q":"「식품위생법」상 식품 등의 위해평가를 위한 위해요소가 <u>아닌</u> 것은?","o":["중금속","잔류농약","트랜스지방","식중독 유발 세균","잔류 동물용 의약품"],"a":3},{"id":"42-1-8","r":42,"p":1,"n":8,"s":"위생관계법령","q":"「식품위생법」상 소비자식품위생감시원의 직무로 옳은 것은?","o":["식품등의 압류·폐기","행정처분의 이행 여부 확인","영업소의 폐쇄를 위한 간판의 제거","시설기준의 적합 여부의 확인·검사","식품접객영업자에 대한 위생관리 상태 점검"],"a":5},{"id":"42-1-9","r":42,"p":1,"n":9,"s":"위생관계법령","q":"「식품위생법」상 식품조사처리업의 허가권자는?","o":["보건복지부장관","농림축산식품부장관","식품의약품안전처장","시·도지사","원자력안전위원장"],"a":3},{"id":"42-1-10","r":42,"p":1,"n":10,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 것으로 옳은 것은?","o":["1","2","3","5","10"],"a":2,"b":"식품의약품안전처장은 식품이력추적관리기준에 따라 등록한 영유아 const $=id=>document.getElementById(id);
const MK=['①','②','③','④','⑤','⑥'];
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/&lt;u&gt;/g,'<u>').replace(/&lt;\/u&gt;/g,'</u>');
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let ST=store.get('hyg-stats-v1',{}); // id -> {c,w,l(last ok?)}
const save=()=>store.set('hyg-stats-v1',ST);
const SUBJ=['위생관계법령','환경위생학','위생곤충학','공중보건학','식품위생학','실기시험'];
const ROUNDS=[42,43,44,45,46,47];
let mode=store.get('hyg-mode','rand'),subj=store.get('hyg-subj','all'),round='all',size=store.get('hyg-size',20),shOn=true;
let SET=[],ANS={},ORD={};
function tabs(el,items,get,set,label){el.innerHTML=label?`<span class="lab">${label}</span>`:'';items.forEach(([k,l])=>{const b=document.createElement('button');b.className='tab';b.textContent=l;b.setAttribute('aria-pressed',String(k)===String(get()));b.onclick=()=>{set(k);el.querySelectorAll('.tab').forEach(x=>x.setAttribute('aria-pressed',x===b));};el.appendChild(b)})}
function pool(){return QS.filter(q=>(subj==='all'||q.s===subj)&&(round==='all'||q.r===+round))}
function makeSet(){
  let P=pool();
  if(mode==='wrong'){P=P.filter(q=>ST[q.id]&&ST[q.id].w>0).sort((a,b)=>(ST[b.id].w-ST[b.id].c*.5)-(ST[a.id].w-ST[a.id].c*.5));P=P.slice(0,Math.max(size,P.length));P=shuf(P.slice(0,size*3)).slice(0,size)}
  else if(mode==='new'){P=shuf(P.filter(q=>!ST[q.id])).slice(0,size)}
  else if(mode==='order'){P=P.slice().sort((a,b)=>a.r-b.r||a.p-b.p||a.n-b.n)}
  else {P=shuf(P).slice(0,size)}
  SET=P;ANS={};ORD={};shown=mode==='order'?size:SET.length;
  SET.forEach(q=>{ORD[q.id]=(shOn&&!q.ns)?shuf([0,1,2,3,4].slice(0,q.o.length)):q.o.map((_,i)=>i)});
}
let shown=20;
function scoreLine(){
  const all=Object.keys(ST).length,ok=Object.values(ST).filter(v=>v.l).length;
  const d=Object.keys(ANS).length,c=Object.entries(ANS).filter(([id,v])=>v.ok).length;
  $('score').innerHTML=`이번 세트 <b>${c}</b>/${d} · 전체 진도 <b>${all}</b>/${QS.length}`+(all?` · 마지막 풀이 정답 ${Math.round(ok/all*100)}%`:'');
}
function photoBlock(q,reveal){
  if(!q.ph)return q.m?`<div class="figno">이 문제의 ${q.m==='사진'?'사진':'그림'}은 시험에서 비공개예요. ${q.m==='그림'?'도표·그림형이라 사진 없이 개념으로 풀어요.':'대상을 특정하기 어려워 사진을 넣지 않았어요.'}</div>`:'';
  const items=[];q.ph.forEach(k=>{const p=PH[k];if(!p)return;if(p.svg)items.push({svg:p.svg,l:p.l});else p.i.forEach(i=>items.push({u:i[0],pg:i[1],lic:i[2],au:i[3],l:p.l}))});
  if(!items.length)return '';
  const labels=[...new Set(q.ph.map(k=>PH[k]&&PH[k].l).filter(Boolean))].join(' / ');
  return `<div class="gal" data-n="${items.length}" data-i="${Math.floor(Math.random()*items.length)}">${'<!--'+encodeURIComponent(JSON.stringify(items))+'-->'}</div>`+(reveal?`<div class="what">사진 속 대상: ${esc(labels)}</div>`:'');
}
function mountGal(g){
  const items=JSON.parse(decodeURIComponent(g.innerHTML.slice(4,-3)));let i=+g.dataset.i;
  g.innerHTML='';const main=document.createElement('div');main.className='main';const th=document.createElement('div');th.className='thumbs';const cr=document.createElement('div');cr.className='credit';
  const show=()=>{const it=items[i];main.innerHTML=(it.svg?it.svg:`<img src="${it.u}" alt="실기 사진 ${i+1}" loading="lazy" referrerpolicy="no-referrer">`)+(items.length>1?'<button class="nav l" aria-label="이전 사진">‹</button><button class="nav r" aria-label="다음 사진">›</button>':'')+`<span class="cnt">${i+1}/${items.length}</span>`;
    main.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{i=(i+(b.classList.contains('l')?-1:1)+items.length)%items.length;show()});
    th.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-current',j===i));
    cr.innerHTML=it.svg?'직접 그린 모식도':`사진: <a href="${it.pg}" target="_blank" rel="noopener">Wikimedia Commons</a> · ${esc(it.au||'작성자 미상')} · ${esc(it.lic)}`};
  items.forEach((it,j)=>{const b=document.createElement('button');b.innerHTML=it.svg?'<span class="svgt">모식도</span>':`<img src="${it.u}" alt="" loading="lazy" referrerpolicy="no-referrer">`;b.onclick=()=>{i=j;show()};th.appendChild(b)});
  g.append(main);if(items.length>1)g.append(th);g.append(cr);show();
}
function card(q,k){
  const a=ANS[q.id],el=document.createElement('article');el.className='q'+(a?(a.ok?' ok':' bad'):'');
  const s=ST[q.id];const hist=s?` · 기록 ${s.c}번 맞음 / <span class="${s.w?'hot':''}">${s.w}번 틀림</span>`:'';
  el.innerHTML=`<div class="meta">제${q.r}회 ${q.p}교시 ${q.n}번 · ${q.s}${hist}</div><div class="qhead"><span class="num">${k}</span><div class="stem">${esc(q.q)}${q.b?`<span class="box">${esc(q.b)}</span>`:''}</div></div>`+photoBlock(q,!!a);
  const ul=document.createElement('ul');ul.className='opts';
  ORD[q.id].forEach((oi,pos)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="mk">${MK[pos]}</span><span>${esc(q.o[oi])}</span>`;
    if(a){b.disabled=true;if(oi===q.a-1)b.classList.add('right');else if(oi===a.pick)b.classList.add('wrong')}
    b.onclick=()=>pick(q,oi,el,k);li.appendChild(b);ul.appendChild(li)});
  el.appendChild(ul);
  if(a){const r=document.createElement('div');r.className='res';const pos=ORD[q.id].indexOf(q.a-1);r.innerHTML=`<b class="${a.ok?'okt':'badt'}">${a.ok?'정답':'오답'}</b> · 정답 ${MK[pos]} ${esc(q.o[q.a-1])}${q.ns||!shOn?'':` <span style="color:var(--muted)">(시험지 원래 번호 ${MK[q.a-1]})</span>`}`;el.appendChild(r)}
  el.querySelectorAll('.gal').forEach(mountGal);
  return el;
}
function pick(q,oi,el,k){
  if(ANS[q.id])return;const ok=oi===q.a-1;ANS[q.id]={pick:oi,ok};
  const s=ST[q.id]||{c:0,w:0};ok?s.c++:s.w++;s.l=ok?1:0;ST[q.id]=s;save();
  el.replaceWith(card(q,k));scoreLine();
}
function render(){
  const list=$('list');list.innerHTML='';scoreLine();
  if(mode==='gallery'){renderGallery(list);return}
  if(mode==='stat'){renderStat(list);return}
  if(!SET.length){list.innerHTML=`<p class="empty">${mode==='wrong'?'아직 틀린 문제가 없어요. 문제를 풀면 틀린 문제가 여기에 모여요.':mode==='new'?'이 범위는 다 풀었어요.':'문제가 없어요.'}</p>`;return}
  const n=mode==='order'?Math.min(shown,SET.length):SET.length;
  SET.slice(0,n).forEach((q,i)=>list.appendChild(card(q,i+1)));
  if(n<SET.length){const m=document.createElement('div');m.className='more';const b=document.createElement('button');b.className='btn ghost';b.textContent=`다음 ${Math.min(size,SET.length-n)}문제 더 보기 (${n}/${SET.length})`;b.onclick=()=>{shown+=size;render()};m.appendChild(b);list.appendChild(m)}
  else{const m=document.createElement('div');m.className='more';const b=document.createElement('button');b.className='btn';b.textContent='새 세트 풀기';b.onclick=()=>{makeSet();render();window.scrollTo({top:0})};m.appendChild(b);list.appendChild(m)}
}
function renderGallery(list){
  const used={};QS.filter(q=>q.ph).forEach(q=>q.ph.forEach(k=>{(used[k]=used[k]||[]).push(q)}));
  const keys=shuf(Object.keys(used).filter(k=>!k.startsWith('g:')||true));
  list.innerHTML='<p class="sub" style="margin:16px 0 0">실기 사진만 모아 봤어요. 이름은 가려져 있으니 사진을 보고 떠올린 뒤 회색 칸을 눌러 확인하세요. 순서는 들어올 때마다 섞여요.</p>';
  keys.forEach(k=>{const p=PH[k];const d=document.createElement('section');d.className='subj';
    const qs=used[k].map(q=>`${q.r}회 ${q.n}번`).join(', ');
    d.innerHTML=`<h3>이 사진은? <span class="hid" tabindex="0">${esc(p.l)}</span></h3>`+photoBlock({ph:[k]},false)+`<div class="qs">출제: ${qs}</div>`;
    d.querySelector('.hid').onclick=e=>{e.target.style.color='var(--ink)';e.target.style.background='transparent'};
    d.querySelectorAll('.gal').forEach(mountGal);list.appendChild(d)});
}
function renderStat(list){
  const by={};SUBJ.forEach(s=>by[s]={t:0,d:0,ok:0,w:0});
  QS.forEach(q=>{const b=by[q.s];b.t++;const s=ST[q.id];if(s){b.d++;if(s.l)b.ok++;if(s.w)b.w++}});
  list.innerHTML='<div class="dash">'+SUBJ.map(s=>{const b=by[s];return `<div>${s}<b>${b.d}/${b.t}</b>마지막 풀이 정답 ${b.d?Math.round(b.ok/b.d*100):0}% · 틀린 적 ${b.w}문제</div>`}).join('')+'</div>';
  const top=QS.filter(q=>ST[q.id]&&ST[q.id].w>1).sort((a,b)=>ST[b.id].w-ST[a.id].w).slice(0,30);
  if(top.length){const h=document.createElement('p');h.className='sub';h.textContent='여러 번 틀린 문제 (많이 틀린 순)';list.appendChild(h);top.forEach((q,i)=>{ORD[q.id]=ORD[q.id]||q.o.map((_,j)=>j);list.appendChild(card(q,i+1))})}
  const r=document.createElement('div');r.className='more';const b=document.createElement('button');b.className='btn ghost';b.textContent='풀이 기록 모두 지우기';b.onclick=()=>{if(b.dataset.c){ST={};save();render()}else{b.dataset.c=1;b.textContent='한 번 더 누르면 지워져요'}};r.appendChild(b);list.appendChild(r);
}
function setup(){
  tabs($('modes'),[['rand','랜덤 반복'],['order','회차별 순서대로'],['wrong','틀린 문제 다시'],['new','안 푼 문제'],['gallery','실기 사진 모아보기'],['stat','내 기록']],()=>mode,v=>{mode=v;store.set('hyg-mode',v);makeSet();render()});
  tabs($('subjects'),[['all','전체'],...SUBJ.map(s=>[s,s==='실기시험'?'3교시 실기':s])],()=>subj,v=>{subj=v;store.set('hyg-subj',v);makeSet();render()},'과목');
  tabs($('rounds'),[['all','전체'],...ROUNDS.map(r=>[r,r+'회'])],()=>round,v=>{round=v;makeSet();render()},'회차');
  tabs($('sizeSel'),[[20,'20문제'],[50,'50문제'],[100,'100문제']],()=>size,v=>{size=+v;store.set('hyg-size',size);makeSet();render()});
  $('sizeSel').className='tabs';
  $('newset').onclick=()=>{makeSet();render();window.scrollTo({top:0})};
  $('redo').onclick=()=>{ANS={};render();window.scrollTo({top:0})};
  $('shuf').onclick=e=>{shOn=!shOn;e.target.setAttribute('aria-pressed',shOn);makeSet();render()};
  makeSet();render();
}
setup();
</script>
</body>
</html>
