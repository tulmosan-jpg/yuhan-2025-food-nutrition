 인구증가율(%) = (자연증가 + 사회증가) ÷ 연초인구 × 100, 자연증가 = 출생 − 사망, 사회증가 = 전입 − 전출\n【풀이】 자연증가 = 15 − 10 = 5명, 사회증가 = 0명(전입=전출) → 5 ÷ 100 × 100 = 5 %. 출생수 15명만 넣어 15 %로 계산하지 않도록 주의한다."},{"id":"46-2-25","r":46,"p":2,"n":25,"s":"공중보건학","q":"초고령사회는 전체 인구 중에서 65세 이상 고령인구가 차지하는 비율이 얼마 이상일 때인가?","o":["5 %","7 %","10 %","14 %","20 %"],"a":5,"e":"UN 기준으로 65세 이상 인구 비율이 7 % 이상이면 고령화사회, 14 % 이상이면 고령사회, 20 % 이상이면 초고령사회이다. 우리나라는 2024년 말 초고령사회에 진입했다."},{"id":"46-2-26","r":46,"p":2,"n":26,"s":"공중보건학","q":"체내 부족 시 괴혈병을 유발할 수 있는 비타민은?","o":["A","B₁","B₂","C","D"],"a":4,"e":"비타민 C(아스코르브산)는 콜라겐 합성에 필요하며 부족하면 잇몸 출혈, 피하출혈 등 괴혈병이 생긴다. 비타민 B₁ 결핍은 각기병, 비타민 D 결핍은 구루병, 비타민 A 결핍은 야맹증을 일으킨다."},{"id":"46-2-27","r":46,"p":2,"n":27,"s":"공중보건학","q":"신생아 사망수에 대한 영아 사망수의 비로 나타내는 보건지표는?","o":["PMI","α-index","영아사망률","유아사망률","신생아사망률"],"a":2,"e":"α-index는 영아사망수 ÷ 신생아사망수로, 값이 1에 가까울수록 영아사망 대부분이 예방하기 어려운 신생아기 사망이라는 뜻이므로 보건수준이 높다. 영아사망률은 출생아 1,000명당 영아사망수, PMI(비례사망지수)는 전체 사망 중 50세 이상 사망 비율이다."},{"id":"46-2-28","r":46,"p":2,"n":28,"s":"공중보건학","q":"노인의 기본적인 신체기능을 조사하기 위한 일상생활 수행능력(Activities of Daily Living, ADL)의 평가 항목은?","o":["옷 입기","전화 사용하기","물건 구입하기","금전 관리하기","교통수단 이용하기"],"a":1,"e":"ADL(기본적 일상생활 수행능력)은 옷 입기, 세수, 목욕, 식사, 이동, 화장실 사용, 대소변 조절 등 자기관리 동작을 평가한다. 전화 사용, 물건 구입, 금전 관리, 교통수단 이용은 더 복잡한 도구적 일상생활 수행능력(IADL) 항목이다."},{"id":"46-2-29","r":46,"p":2,"n":29,"s":"공중보건학","q":"앤더슨(G. Anderson)이 공중보건의 목적 달성 3요소를 제시하고, 이 중 가장 중요하다고 한 것은?","o":["보건교육","보건법규","보건행정","사회보장","환경위생"],"a":1,"e":"앤더슨은 공중보건 목적 달성 3요소로 보건봉사(행정), 보건법규, 보건교육을 제시하고, 그중 주민의 자발적 행동 변화를 이끄는 보건교육이 가장 중요하다고 하였다. 보건법규는 강제력은 있으나 지속적인 행동 변화를 이끌기에는 한계가 있다. ※ 교재 확인 권장"},{"id":"46-2-30","r":46,"p":2,"n":30,"s":"공중보건학","q":"전체 집단을 몇 개의 소집단으로 나누어 토론한 후 전체가 다시 모여 의견을 수렴하는 보건교육방법은?","o":["역할극","세미나","분단토의","패널토의","심포지엄"],"a":3,"e":"분단토의(buzz session)는 전체를 6~8명 정도의 소집단으로 나누어 토의한 뒤 다시 모여 결과를 발표·종합하는 방법이다. 패널토의는 전문가 몇 명이 청중 앞에서 토의하는 방식이고, 심포지엄은 전문가들이 주제의 서로 다른 측면을 순서대로 발표한 뒤 질의응답하는 방식이다."},{"id":"46-2-31","r":46,"p":2,"n":31,"s":"공중보건학","q":"학교 건강검사에서 신체의 발달상황 검사항목은?","o":["몸무게","피부병","병리검사","예방접종","팔굽혀펴기"],"a":1,"e":"학교건강검사규칙상 신체의 발달상황 검사항목은 키와 몸무게이며, 이를 바탕으로 비만도를 산출한다. 피부병과 병리검사는 건강검진 항목이고, 팔굽혀펴기 같은 체력 측정은 신체능력검사에 해당한다."},{"id":"46-2-32","r":46,"p":2,"n":32,"s":"공중보건학","q":"「의료법」에 따른 정신병원은 정신건강증진시설 중 어디에 해당하는가?","o":["정신요양시설","정신의료기관","정신재활시설","정신건강복지센터","중독관리통합지원센터"],"a":2,"e":"정신건강복지법상 정신건강증진시설은 정신의료기관, 정신요양시설, 정신재활시설로 나뉘며, 의료법에 따른 정신병원과 정신과 의원 등은 정신의료기관에 속한다. 정신요양시설은 만성 정신질환자의 요양·보호시설이고, 정신건강복지센터와 중독관리통합지원센터는 정신건강증진시설에 포함되지 않는다."},{"id":"46-2-33","r":46,"p":2,"n":33,"s":"공중보건학","q":"측정 자료에서 최댓값과 최솟값의 차이는?","o":["범위","변이계수","평균편차","표준오차","표준편차"],"a":1,"e":"범위(range)는 최댓값에서 최솟값을 뺀 값으로 가장 간단한 산포도이다. 표준편차는 편차 제곱 평균의 제곱근이고, 변이계수는 표준편차를 평균으로 나눈 값(%)으로 단위가 다른 자료의 산포를 비교할 때 쓴다."},{"id":"46-2-34","r":46,"p":2,"n":34,"s":"공중보건학","q":"일반출산율 산출식에서 분모에 해당하는 것은?","o":["연앙인구","연간 출생아수","임신한 여자수","전체 여자인구","가임연령의 여자인구"],"a":5,"e":"일반출산율 = 연간 출생아수 ÷ 가임연령(15~49세) 여자인구 × 1,000이다. 분모에 연앙인구(전체 인구)를 쓰는 것은 조출생률이며, 전체 여자인구는 사용하지 않는다."},{"id":"46-2-35","r":46,"p":2,"n":35,"s":"공중보건학","q":"생물테러에 사용될 가능성이 있는 물질은?","o":["다이옥신","일산화탄소","시안화수소","포름알데히드","보툴리눔독소"],"a":5,"e":"보툴리눔독소는 Clostridium botulinum이 생성하는 생물학적 독소로 극소량으로도 치명적이어서 생물테러 물질로 분류되며, 보툴리눔독소증은 생물테러감염병에 해당한다. 시안화수소·일산화탄소는 화학물질(화학테러 가능 물질)이고, 다이옥신과 포름알데히드는 환경오염물질이다."},{"id":"46-2-36","r":46,"p":2,"n":36,"s":"식품위생학","q":"세균의 증식곡선 중 생균수가 최고치를 유지하는 시기는?","o":["대수기","사멸기","유도기","적응기","정지기"],"a":5,"e":"정지기는 영양소 고갈과 대사산물 축적으로 증식 속도와 사멸 속도가 같아져 생균수가 최고치로 일정하게 유지되는 시기로, 포자 형성과 독소 생성이 활발해진다. 대수기는 세포 수가 기하급수적으로 증가하고 세대시간이 가장 짧은 시기이며, 유도기(적응기)는 환경에 적응하며 거의 증식하지 않는 시기이다."},{"id":"46-2-37","r":46,"p":2,"n":37,"s":"식품위생학","q":"식품의 물리적 부패 판정 기준으로 옳은 것은?","o":["탄성","생균수","수소이온농도","트리메틸아민","휘발성 염기질소"],"a":1,"e":"물리적 부패 판정은 식품의 경도, 탄성, 점성, 색, 전기저항 등의 변화를 측정한다. 수소이온농도(pH), 트리메틸아민, 휘발성 염기질소는 화학적 판정법이고, 생균수는 미생물학적 판정법이다."},{"id":"46-2-38","r":46,"p":2,"n":38,"s":"식품위생학","q":"쓰레기를 소각할 때 발생하는 내분비계 교란물질은?","o":["다이옥신","트랜스지방","트리할로메탄","포름알데히드","N-니트로사민"],"a":1,"e":"다이옥신은 염소가 포함된 쓰레기를 저온 소각할 때 생성되는 내분비계 교란물질로, 지용성이라 지방조직에 축적되고 발암성이 있다. 트리할로메탄은 염소 소독 시 생성되는 소독부산물이고, N-니트로사민은 아질산염과 아민의 반응으로 생기는 발암물질이다."},{"id":"46-2-39","r":46,"p":2,"n":39,"s":"식품위생학","q":"손 소독에 가장 효과적인 에틸알코올 농도는?","o":["20 %","40 %","50 %","70 %","100 %"],"a":4,"e":"에틸알코올은 70 % 내외일 때 단백질 응고·변성 작용이 가장 강해 손 소독에 가장 효과적이다. 100 %에 가까우면 세포 표면 단백질만 급히 응고시켜 내부로 침투하지 못해 오히려 살균력이 떨어진다."},{"id":"46-2-40","r":46,"p":2,"n":40,"s":"식품위생학","q":"그람양성 세균은?","o":["대장균","바실러스균","비브리오균","살모넬라균","여시니아균"],"a":2,"e":"바실러스균(Bacillus속)은 호기성의 그람양성 포자형성 간균이다. 대장균, 비브리오균, 살모넬라균, 여시니아균은 모두 그람음성균이다."},{"id":"46-2-41","r":46,"p":2,"n":41,"s":"식품위생학","q":"식품의 신선도 판정 시 초기 부패에 해당하는 생균수(CFU/g)는?","o":["10⁰ ~ 10¹","10² ~ 10³","10⁴ ~ 10⁵","10⁷ ~ 10⁸","10⁹ ~ 10¹⁰"],"a":4,"e":"식품 1 g당 생균수가 10⁷~10⁸이면 초기부패로 판정하며, 10⁵ 이하이면 안전한 수준으로 본다. 참고로 휘발성 염기질소는 30~40 mg%를 초기부패 기준으로 한다."},{"id":"46-2-42","r":46,"p":2,"n":42,"s":"식품위생학","q":"식품의 알코올 발효에 이용하는 효모는?","o":["Bacillus속","Proteus속","Clostridium속","Micrococcus속","Saccharomyces속"],"a":5,"e":"Saccharomyces속(특히 S. cerevisiae)은 당을 에탄올과 이산화탄소로 분해하는 효모로 맥주·포도주·빵 발효에 이용된다. Bacillus, Proteus, Clostridium, Micrococcus는 효모가 아닌 세균이다."},{"id":"46-2-43","r":46,"p":2,"n":43,"s":"식품위생학","q":"식품의 구성 성분 중 산패가 일어나는 것은?","o":["수분","지질","단백질","무기질","탄수화물"],"a":2,"e":"산패는 지질(유지)이 산소·빛·열·금속 등에 의해 산화·가수분해되어 불쾌한 냄새와 맛, 과산화물이 생기는 현상이다. 단백질이 미생물에 의해 분해되는 것은 부패, 탄수화물이 분해되어 유용물질이 생기는 것은 발효라 한다."},{"id":"46-2-44","r":46,"p":2,"n":44,"s":"식품위생학","q":"「식품공전」상 유가공품의 고온단시간 살균법은?","o":["50 ~ 55 ℃에서 60분간","63 ~ 65 ℃에서 30분간","72 ~ 75 ℃에서 15초 내지 20초간","90 ~ 95 ℃에서 10초 내지 15초간","130 ~ 150 ℃에서 0.5초 내지 5초간"],"a":3,"e":"식품공전상 유가공품 고온단시간살균법(HTST)은 72~75 ℃에서 15~20초간 가열한다. 저온장시간살균법(LTLT)은 63~65 ℃에서 30분간, 초고온순간살균법(UHT)은 130~150 ℃에서 0.5~5초간이다."},{"id":"46-2-45","r":46,"p":2,"n":45,"s":"식품위생학","q":"다음에 해당하는 방사성 동위원소는?","o":["³H","¹⁴C","⁶⁰Co","¹³¹I","¹³⁷Cs"],"a":3,"b":"• 식품조사처리(방사선조사)에 사용된다.\n• 붕괴 시 감마선을 방출하며, 반감기는 약 5년이다.","e":"⁶⁰Co(코발트-60)는 감마선을 방출하며 반감기가 약 5.3년으로, 식품 방사선 조사의 선원으로 사용된다. ¹³⁷Cs는 반감기 약 30년, ¹³¹I는 약 8일로 원전 사고 시 식품 오염 지표로 주로 다뤄진다."},{"id":"46-2-46","r":46,"p":2,"n":46,"s":"식품위생학","q":"외인성 위해 요소가 포함되어 있는 식품은?","o":["산패된 유지","덜 익은 매실","싹이 튼 감자","숯불에 탄 돼지고기","농약이 잔류하는 과일"],"a":5,"e":"외인성 위해요소는 식품 자체에 없던 물질이 외부에서 들어온 것으로, 잔류농약·유해첨가물·병원미생물 등이 해당한다. 덜 익은 매실(아미그달린)과 싹이 튼 감자(솔라닌)는 식품 자체에 있는 내인성 위해요소이고, 산패된 유지와 숯불에 탄 고기(벤조피렌)는 제조·가공·저장 중에 생성되는 유기성(유인성) 위해요소이다."},{"id":"46-2-47","r":46,"p":2,"n":47,"s":"식품위생학","q":"장독소(enterotoxin)를 생성하는 독소형 식중독균은?","o":["Morganella morganii","Salmonella Enteritidis","Yersinia enterocolitica","Staphylococcus aureus","Vibrio parahaemolyticus"],"a":4,"e":"황색포도상구균(Staphylococcus aureus)은 식품 중에서 내열성 장독소(enterotoxin)를 생성하는 독소형 식중독균으로, 잠복기가 평균 3시간 정도로 짧다. Salmonella, Vibrio parahaemolyticus, Yersinia는 균 자체가 증식해 일으키는 감염형이며, Morganella morganii는 히스타민을 생성하는 알레르기성 식중독의 원인균이다."},{"id":"46-2-48","r":46,"p":2,"n":48,"s":"식품위생학","q":"다음에 해당하는 병원성 대장균은?","o":["장관병원성 대장균","장관출혈성 대장균","장관침투성 대장균","장관폐쇄성 대장균","장관독소원성 대장균"],"a":2,"b":"• Escherichia coli O157 : H7이 해당된다.\n• 베로톡신(verotoxin)을 생산한다.","e":"장관출혈성 대장균(EHEC)은 O157:H7이 대표적이며, 베로톡신(시가독소 유사)을 생산해 출혈성 대장염과 용혈성 요독증후군을 일으킨다. 장관독소원성 대장균(ETEC)은 이열성·내열성 장독소로 여행자 설사를, 장관침투성 대장균(EIEC)은 대장 점막 침투로 이질 유사 증상을 일으킨다."},{"id":"46-2-49","r":46,"p":2,"n":49,"s":"식품위생학","q":"병원성 대장균의 특징으로 옳은 것은?","o":["나선균이다.","그람양성이다.","유당을 분해한다.","포자를 생성한다.","편성혐기성균이다."],"a":3,"e":"대장균은 유당을 분해해 산과 가스를 생성하는 것이 특징이며, 이를 이용해 분변오염 지표로 검사한다. 대장균은 그람음성 간균이고, 포자를 만들지 않으며, 주모성 편모를 가진 통성혐기성균이다."},{"id":"46-2-50","r":46,"p":2,"n":50,"s":"식품위생학","q":"리스테리아 식중독을 일으키는 균에 대한 설명으로 옳은 것은?","o":["구균이다.","그람양성균이다.","편성혐기성균이다.","단모성 편모가 있다.","내열성 포자를 생성한다."],"a":2,"e":"리스테리아 식중독 원인균(Listeria monocytogenes)은 그람양성 단간균이며, 주모성 편모를 가지고 포자는 형성하지 않는 통성혐기성균이다. 특히 4 ℃ 냉장온도에서도 증식할 수 있어 냉장 보관 식품에서 문제가 된다."},{"id":"46-2-51","r":46,"p":2,"n":51,"s":"식품위생학","q":"세균성 식중독을 일으키는 균은?","o":["Vibrio cholerae","Salmonella Typhi","Campylobacter jejuni","Mycobacterium tuberculosis","Corynebacterium diphtheriae"],"a":3,"e":"Campylobacter jejuni는 닭고기 등 가금류를 통해 감염되는 감염형 세균성 식중독균으로, 미호기성이다. Vibrio cholerae는 콜레라, Salmonella Typhi는 장티푸스를 일으키는 감염병 원인균이며, Mycobacterium tuberculosis는 결핵, Corynebacterium diphtheriae는 디프테리아의 원인균이다."},{"id":"46-2-52","r":46,"p":2,"n":52,"s":"식품위생학","q":"포자를 형성하는 편성혐기성 식중독균은?","o":["Bacillus subtilis","Salmonella Enteritidis","Clostridium perfringens","Staphylococcus aureus","Pseudomonas aeruginosa"],"a":3,"e":"Clostridium perfringens(웰치균)는 아포를 형성하는 편성혐기성 그람양성 간균으로, 대량 조리 후 서서히 식힌 육류 요리 등에서 식중독을 일으킨다. Bacillus subtilis도 포자를 형성하지만 호기성이고, Salmonella·S. aureus·Pseudomonas는 포자를 만들지 않는다."},{"id":"46-2-53","r":46,"p":2,"n":53,"s":"식품위생학","q":"식품에 사용할 수 <u>없는</u> 유해감미료는?","o":["둘신(dulcin)","승홍(HgCl₂)","붕산(H₃BO₃)","아우라민(auramine)","롱갈리트(rongalite)"],"a":1,"e":"둘신은 설탕의 약 250배 단맛을 내지만 혈액독·간장독 등 독성이 있어 사용이 금지된 유해감미료이다. 승홍과 붕산은 유해보존료, 아우라민은 유해착색료, 롱갈리트는 유해표백제이다."},{"id":"46-2-54","r":46,"p":2,"n":54,"s":"식품위생학","q":"다음에 해당하는 중금속은?","o":["납","비소","아연","크롬","카드뮴"],"a":2,"b":"• 1955년 일본 조제분유사건의 원인 중금속이다.\n• 만성 중독 시 피부가 청색으로 변하고 손발, 피부에 각화현상이 일어난다.","e":"비소는 1955년 일본 모리나가 조제분유 중독사건(안정제로 쓴 제2인산나트륨에 비소 혼입)의 원인 물질로, 만성 중독 시 피부 색소침착과 손발의 각화증이 나타난다. 카드뮴은 이타이이타이병, 납은 빈혈·연연(잇몸의 청회색선) 등을 일으킨다. ※ 교재 확인 권장"},{"id":"46-2-55","r":46,"p":2,"n":55,"s":"식품위생학","q":"다음에 해당하는 농약은?","o":["유기인계","유기불소계","유기수은계","유기염소계","카바메이트계"],"a":4,"b":"• 환경 중에서 오래 잔류하고 지용성이다.\n• aldrin, 2,4-D 등이 있다.","e":"유기염소계 농약(DDT, BHC, aldrin, dieldrin, 2,4-D 등)은 화학적으로 안정해 환경에 오래 잔류하고 지용성이라 체지방에 축적된다. 유기인계(파라티온 등)는 콜린에스테라아제를 억제하는 급성 독성이 강하지만 잔류성이 낮고, 카바메이트계도 콜린에스테라아제 저해제로 잔류성이 낮다."},{"id":"46-2-56","r":46,"p":2,"n":56,"s":"식품위생학","q":"미나마타병의 원인 중금속은?","o":["철","망간","수은","주석","안티몬"],"a":3,"e":"미나마타병은 공장 폐수의 메틸수은이 어패류에 축적되고 이를 섭취해 발생한 중추신경계 장애이다. 카드뮴은 이타이이타이병, 주석은 통조림 용출에 의한 급성 위장장애와 관련된다."},{"id":"46-2-57","r":46,"p":2,"n":57,"s":"식품위생학","q":"독버섯의 독소는?","o":["솔라닌(solanine)","무스카린(muscarine)","아플라톡신(aflatoxin)","에르고톡신(ergotoxin)","아이슬란디톡신(islanditoxin)"],"a":2,"e":"무스카린은 광대버섯 등 독버섯의 독소로, 부교감신경을 자극해 발한·유연·동공 축소 등을 일으킨다. 솔라닌은 감자 싹, 아플라톡신은 Aspergillus flavus 곰팡이독, 에르고톡신은 맥각, 아이슬란디톡신은 황변미 곰팡이독이다."},{"id":"46-2-58","r":46,"p":2,"n":58,"s":"식품위생학","q":"식물성 자연독과 원인 식품의 연결이 옳은 것은?","o":["듀린(dhurrin) – 수수","셉신(sepsine) – 피마자","테물린(temuline) – 오색콩","아코니틴(aconitine) – 콩류","아미그달린(amygdalin) – 감자"],"a":1,"e":"듀린(dhurrin)은 수수에 들어 있는 청산배당체이다. 셉신은 썩은 감자, 테물린은 독보리, 아코니틴은 바꽃(투구꽃·초오)의 독성분이고, 아미그달린은 덜 익은 매실(청매)·살구씨에 있다. 오색콩의 독성분은 파세오루나틴, 피마자는 리신이다."},{"id":"46-2-59","r":46,"p":2,"n":59,"s":"식품위생학","q":"황변미 독소 중 신장독은?","o":["시트리닌(citrinin)","푸모니신(fumonisin)","에르고타민(ergotamine)","트리코테센(trichothecene)","시트레오비리딘(citreoviridin)"],"a":1,"e":"시트리닌은 Penicillium citrinum이 생성하는 황변미 독소로 신장독을 일으킨다. 시트레오비리딘은 신경독, 아이슬란디톡신·루테오스카이린은 간장독이며, 푸모니신·트리코테센은 붉은곰팡이(Fusarium) 독소, 에르고타민은 맥각 독소이다."},{"id":"46-2-60","r":46,"p":2,"n":60,"s":"식품위생학","q":"붉은곰팡이가 생성하는 독소로 가축의 발정증후군을 유발하는 것은?","o":["파툴린(patulin)","말토리진(maltoryzine)","제랄레논(zearalenone)","루브라톡신(rubratoxin)","오크라톡신(ochratoxin)"],"a":3,"e":"제랄레논은 붉은곰팡이(Fusarium)가 생성하는 에스트로겐 유사 독소로, 가축(특히 돼지)에 외음부 비대 등 발정증후군과 불임·유산을 일으킨다. 파툴린은 Penicillium의 사과 관련 독소(신경독), 오크라톡신은 Aspergillus ochraceus의 신장독, 루브라톡신은 간장독이다."},{"id":"46-2-61","r":46,"p":2,"n":61,"s":"식품위생학","q":"다음에 해당하는 경구감염병은?","o":["B형간염","디프테리아","파라티푸스","보툴리눔독소증","후천성면역결핍증"],"a":3,"b":"• 제2급감염병이다.\n• 급성 전신성 열성 감염병이다.\n• 병원균은 A, B, C형이 있으며 그람음성 간균으로 운동성이 있다.","e":"파라티푸스는 Salmonella Paratyphi A, B, C형에 의한 제2급 경구감염병으로, 주모성 편모가 있는 그람음성 간균이 원인이며 장티푸스와 비슷한 급성 전신성 열성 질환이다. 디프테리아는 비말 감염되는 제1급감염병, B형간염은 혈액 매개의 제3급감염병이다."},{"id":"46-2-62","r":46,"p":2,"n":62,"s":"식품위생학","q":"콜레라의 설명으로 옳은 것은?","o":["제1급감염병이다.","원인균은 편모가 있다.","원인균은 Shigella속이다.","원인균은 그람양성균이다.","감염 후 영구면역이 형성된다."],"a":2,"e":"콜레라균(Vibrio cholerae)은 그람음성의 콤마 모양 간균으로 한 개의 극단모(편모)가 있어 운동성이 활발하다. 콜레라는 제2급감염병이며, 원인균은 Shigella가 아닌 Vibrio속이고, 감염 후 면역은 오래가지 않아 영구면역이 생기지 않는다."},{"id":"46-2-63","r":46,"p":2,"n":63,"s":"식품위생학","q":"제3급감염병은?","o":["두창","폴리오","수족구병","비브리오패혈증","유행성이하선염"],"a":4,"e":"비브리오패혈증은 감염병예방법상 제3급감염병이다. 두창은 제1급, 폴리오와 유행성이하선염은 제2급, 수족구병은 제4급감염병이다."},{"id":"46-2-64","r":46,"p":2,"n":64,"s":"식품위생학","q":"용혈성 연쇄상구균에 의한 감염병은?","o":["성홍열","파상풍","폴리오","디프테리아","세균성이질"],"a":1,"e":"성홍열은 A군 β-용혈성 연쇄상구균이 원인으로, 발열·인두염과 함께 딸기혀, 전신 발진이 특징인 제2급감염병이다. 파상풍은 Clostridium tetani, 디프테리아는 Corynebacterium diphtheriae, 세균성이질은 Shigella가 원인이며, 폴리오는 바이러스 질환이다."},{"id":"46-2-65","r":46,"p":2,"n":65,"s":"식품위생학","q":"다음에 해당하는 질병은?","o":["결핵","공수병","돈단독","발진열","야토병"],"a":5,"b":"• 제1급감염병이다.\n• 원인균은 Francisella tularensis이다.","e":"야토병은 Francisella tularensis가 원인인 인수공통감염병으로, 산토끼 등 야생동물과 접촉하거나 진드기 등에 의해 감염되며 생물테러 가능성 때문에 제1급감염병으로 지정되어 있다. 돈단독은 Erysipelothrix, 발진열은 Rickettsia typhi, 공수병은 광견병 바이러스가 원인이다."},{"id":"46-2-66","r":46,"p":2,"n":66,"s":"식품위생학","q":"다음에 해당하는 인수공통감염병은?","o":["Q열","탄저","돈단독","브루셀라증","렙토스피라증"],"a":4,"b":"• 원인균은 그람음성 무포자 간균이다.\n• 임신한 소, 돼지가 감염되면 유산한다.\n• 파상열이라고도 한다.","e":"브루셀라증은 Brucella속(그람음성 무포자 간균)에 의한 인수공통감염병으로, 감염된 소·돼지·양 등은 유산을 일으키고 사람에게는 열이 오르내리는 파상열을 일으킨다. Q열은 Coxiella burnetii, 탄저는 그람양성 포자형성균 Bacillus anthracis가 원인이다."},{"id":"46-2-67","r":46,"p":2,"n":67,"s":"식품위생학","q":"다음에 해당하는 기생충은?","o":["회충","무구조충","십이지장충","아니사키스","유극악구충"],"a":2,"b":"• 소고기를 생식하거나 불충분하게 가열하여 섭취 시 감염될 수 있다.\n• 소화 불량, 복통, 오심, 구토 등을 일으키며 장폐색증이 나타나기도 한다.","e":"무구조충(민촌충, Taenia saginata)은 소가 중간숙주로, 소고기를 날것이나 덜 익혀 먹으면 감염된다. 유구조충(갈고리촌충)은 돼지고기, 아니사키스는 해산어류(오징어·고등어 등), 유극악구충은 가물치·메기 등 민물고기를 통해 감염된다."},{"id":"46-2-68","r":46,"p":2,"n":68,"s":"식품위생학","q":"요코가와흡충의 제1중간숙주는?","o":["가재","은어","다슬기","물벼룩","왜우렁이"],"a":3,"e":"요코가와흡충의 제1중간숙주는 다슬기, 제2중간숙주는 은어·잉어 등 담수어이다. 다슬기를 제1중간숙주로 하는 폐흡충은 제2중간숙주가 가재·게라는 점과 구별하며, 간흡충의 제1중간숙주는 왜우렁이(쇠우렁이)이다."},{"id":"46-2-69","r":46,"p":2,"n":69,"s":"식품위생학","q":"식품이 건조되는 것을 방지하는 식품첨가물은?","o":["살균제","습윤제","유화제","이형제","증점제"],"a":2,"e":"습윤제는 식품이 건조되는 것을 막고 수분을 유지시키는 식품첨가물로, 글리세린·D-소비톨 등이 쓰인다. 증점제는 점도를 높이고, 이형제는 빵 등을 틀에서 쉽게 분리되도록 하며, 유화제는 물과 기름을 섞이게 한다."},{"id":"46-2-70","r":46,"p":2,"n":70,"s":"식품위생학","q":"식품첨가물 중 보존료의 사용 목적은?","o":["거품 제거","산미 증가","색의 안정화","영양 성분 보충","미생물에 의한 품질 저하 방지"],"a":5,"e":"보존료는 미생물의 증식을 억제해 부패·변질 등 품질 저하를 막고 보존기간을 늘리기 위해 사용한다(소브산, 안식향산, 프로피온산 등). 거품 제거는 소포제, 산미 증가는 산도조절제(산미료), 색의 안정화는 발색제·색소 관련 첨가물의 목적이다."},{"id":"46-2-71","r":46,"p":2,"n":71,"s":"식품위생학","q":"식품의 표백을 목적으로 사용하는 첨가물은?","o":["헥산","D-소비톨","소브산칼륨","유동파라핀","메타중아황산나트륨"],"a":5,"e":"메타중아황산나트륨은 환원 작용으로 식품을 표백하는 아황산염류 표백제이다. 헥산은 추출용제, D-소비톨은 감미료·습윤제, 소브산칼륨은 보존료, 유동파라핀은 이형제·피막제로 쓰인다."},{"id":"46-2-72","r":46,"p":2,"n":72,"s":"식품위생학","q":"식육가공품 발색에 사용하는 첨가물은?","o":["사카린나트륨","아질산나트륨","몰식자산프로필","안식향산나트륨","소르비탄지방산에스테르"],"a":2,"e":"아질산나트륨은 육류의 미오글로빈과 결합해 선명한 적색의 니트로소미오글로빈을 만드는 발색제로 햄·소시지 등에 사용되며, 보툴리눔균 억제 효과도 있다. 사카린나트륨은 감미료, 몰식자산프로필은 산화방지제, 안식향산나트륨은 보존료, 소르비탄지방산에스테르는 유화제이다."},{"id":"46-2-73","r":46,"p":2,"n":73,"s":"식품위생학","q":"국내 유전자 변형 농산물의 비의도적 혼입 허용치는?","o":["3 % 이하","5 % 이하","7 % 이하","10 % 이하","15 % 이하"],"a":1,"e":"우리나라는 GMO 표시제도에서 비의도적 혼입치를 3 % 이하로 인정하여, 이 이하로 혼입된 경우에는 GMO 표시 대상에서 제외한다. 참고로 EU는 0.9 %, 일본은 5 %를 기준으로 한다."},{"id":"46-2-74","r":46,"p":2,"n":74,"s":"식품위생학","q":"식품안전관리인증기준(HACCP)에서 다음의 정의에 해당하는 것은?","o":["검증","개선조치","모니터링","한계기준 설정","중요관리점 설정"],"a":1,"b":"HACCP 관리 계획의 유효성과 실행 여부를 정기적으로 평가하는 일련의 활동을 말한다.","e":"검증은 HACCP 관리계획이 적절히 수립되어 효과적으로 시행되고 있는지(유효성과 실행 여부)를 정기적으로 평가하는 활동이다. 모니터링은 중요관리점이 한계기준 내에서 관리되는지 확인하기 위한 측정·관찰이고, 개선조치는 모니터링 결과 한계기준을 벗어났을 때 취하는 조치이다."},{"id":"46-2-75","r":46,"p":2,"n":75,"s":"식품위생학","q":"식품안전관리인증기준(HACCP)에서 물리적 위해요소는?","o":["바이러스","식중독균","잔류농약","유리 조각","곰팡이 독소"],"a":4,"e":"물리적 위해요소는 유리 조각, 금속 조각, 돌 등 섭취 시 상해를 줄 수 있는 이물이다. 바이러스·식중독균은 생물학적 위해요소, 잔류농약은 화학적 위해요소이며, 곰팡이 독소도 화학적 위해요소로 분류한다."},{"id":"47-2-1","r":47,"p":2,"n":1,"s":"공중보건학","q":"리벨(Leavell)과 클라크(Clark)는 질병의 자연사를 5단계로 나누고 질병 예방을 위한 활동을 3가지 차원의 수준으로 나누어 설명하였다. 3차 예방에 해당하는 단계는?","o":["회복기","비병원성기","초기병원성기","불현성 감염기","발현성 질환기"],"a":1,"e":"리벨과 클라크의 예방 수준에서 3차 예방은 질병이 진행된 뒤 불구를 막고 재활·사회복귀를 돕는 단계로, 질병 자연사의 회복기(재활기)에 해당한다. 비병원성기와 초기병원성기는 1차 예방(건강증진·특수예방), 불현성 감염기와 발현성 질환기는 2차 예방(조기진단·조기치료)에 해당한다."},{"id":"47-2-2","r":47,"p":2,"n":2,"s":"공중보건학","q":"건강 결정요인을 유전·환경·생활양식·보건의료체계로 나누고, 생활습관의 변화와 환경 개선이 건강에 기여하는 정도가 높다고 주장한 것은?","o":["람사르 협약","오타와 헌장","라론드 보고서","알마아타 선언","몬트리올 의정서"],"a":3,"e":"라론드 보고서(1974, 캐나다)는 건강 결정요인을 유전(생물학적 요인)·환경·생활양식·보건의료체계로 나누고, 생활양식과 환경 개선이 건강에 가장 크게 기여한다고 주장했다. 오타와 헌장(1986)은 건강증진의 5대 활동영역을, 알마아타 선언(1978)은 일차보건의료를 제시한 것이다."},{"id":"47-2-3","r":47,"p":2,"n":3,"s":"공중보건학","q":"감염병 생성과정의 6개 요소 중 병인적 요인에 해당하는 것은?","o":["병원체","병원소로부터 병원체의 탈출","전파","새로운 숙주로의 침입","숙주의 감수성과 면역"],"a":1,"e":"감염병 생성 6요소는 병원체, 병원소, 병원소로부터의 탈출, 전파, 새로운 숙주로의 침입, 숙주의 감수성이며, 이 중 병원체(와 병원소)가 병인적 요인이다. 탈출·전파·침입은 환경적 요인(전파과정), 숙주의 감수성과 면역은 숙주적 요인에 해당한다."},{"id":"47-2-4","r":47,"p":2,"n":4,"s":"공중보건학","q":"다음에서 설명하는 질병 발생 모형은?","o":["거미줄 모형","삼각형 모형","웰리스 모형","수레바퀴 모형","생의학적 모형"],"a":4,"b":"• 중심 부분에 숙주요인이 있고, 그 가운데를 유전적 소인이 차지한다.\n• 숙주요인을 중심으로 그 밖을 외적요인인 생물학적, 사회·경제적, 물리적인 환경이 에워싸고 있다.","e":"수레바퀴 모형은 중심에 유전적 소인을 가진 숙주를 두고, 그 바깥을 생물학적·사회경제적·물리적 환경이 둘러싸는 형태로 질병 발생을 설명한다. 거미줄 모형은 여러 원인이 그물처럼 얽힌 경로를, 삼각형 모형은 병인·숙주·환경 세 요인의 균형을 강조한다."},{"id":"47-2-5","r":47,"p":2,"n":5,"s":"공중보건학","q":"질병이 순환변화하는 양상으로 발생하는 감염병은?","o":["홍역","성홍열","장티푸스","디프테리아","인플루엔자"],"a":1,"e":"순환변화(단기변화)는 2~4년 주기로 유행이 반복되는 것으로, 집단면역 수준의 변동 때문에 생기며 홍역·백일해가 대표적이다. 장티푸스·디프테리아는 수십 년 주기로 변하는 추세변화(장기변화)의 예로 자주 출제된다."},{"id":"47-2-6","r":47,"p":2,"n":6,"s":"공중보건학","q":"지역사회 보건의료서비스의 운영에 관한 계통적 연구로서 서비스 향상을 목적으로 하는 연구방법은?","o":["기술역학","분석역학","실험역학","이론역학","작전역학"],"a":5,"e":"작전역학은 지역사회 보건의료서비스의 운영 과정을 계통적으로 연구하여 서비스의 향상을 도모하는 역학이다. 기술역학은 질병의 분포를 인적·지역적·시간적으로 기술하고, 이론역학은 수리적 모형으로 유행을 예측한다."},{"id":"47-2-7","r":47,"p":2,"n":7,"s":"공중보건학","q":"다음에서 설명하는 역학 연구방법은?","o":["단면연구","실험연구","환자–대조군 연구","전향성 연구","코호트 연구"],"a":3,"b":"• 장기간의 추적을 요하는 연구보다 시간, 경비, 노력이 절약된다.\n• 희귀질환이나 잠복기가 긴 질병의 연구에 적합하다.\n• 의심되는 여러 개의 가설을 동시에 검증할 수 있다.","e":"환자-대조군 연구는 이미 질병이 있는 군과 없는 군의 과거 노출을 비교하므로 시간·경비·노력이 적게 들고, 희귀질환이나 잠복기가 긴 질병에 적합하며 여러 요인을 동시에 검토할 수 있다. 코호트 연구(전향성 연구)는 장기간 추적이 필요해 비용과 시간이 많이 들고 희귀질환에는 부적합하다."},{"id":"47-2-8","r":47,"p":2,"n":8,"s":"공중보건학","q":"병원체가 원충류인 것은?","o":["공수병","말라리아","발진티푸스","록키산홍반열","신증후군출혈열"],"a":2,"e":"말라리아의 병원체는 원충류인 Plasmodium 속(삼일열·열대열 원충 등)이며 모기가 매개한다. 공수병과 신증후군출혈열은 바이러스, 발진티푸스와 록키산홍반열은 리케치아가 병원체이다."},{"id":"47-2-9","r":47,"p":2,"n":9,"s":"공중보건학","q":"병원체가 숙주에 침입하여 알맞은 기관에 자리 잡고 증식하는 능력은?","o":["독력","병원력","감염력","면역력","저항력"],"a":3,"e":"감염력은 병원체가 숙주에 침입해 알맞은 기관에 자리 잡고 증식하는 능력이다. 병원력은 감염된 사람 중 현성 질환을 일으키는 능력, 독력은 질병의 중증도(중증·사망)를 일으키는 능력을 말한다."},{"id":"47-2-10","r":47,"p":2,"n":10,"s":"공중보건학","q":"제3급감염병으로 가을철에 주로 유행하는 급성 발열성 질병은?","o":["디프테리아","렙토스피라증","수막구균감염증","신종감염병증후군","장출혈성대장균감염증"],"a":2,"e":"렙토스피라증은 제3급감염병으로, 쥐 등 감염동물의 소변에 오염된 물·흙에 접촉해 감염되며 추수기인 가을철에 주로 유행하는 급성 발열성 질환이다. 디프테리아와 신종감염병증후군은 제1급, 수막구균감염증과 장출혈성대장균감염증은 제2급감염병이다."},{"id":"47-2-11","r":47,"p":2,"n":11,"s":"공중보건학","q":"병원체가 소화기계로 탈출하는 감염병은?","o":["풍진","홍역","파상풍","일본뇌염","세균성이질"],"a":5,"e":"세균성이질은 장관에서 증식한 병원체가 분변(소화기계)으로 탈출해 오염된 음식·물이나 손을 통해 경구 전파된다. 풍진과 홍역은 호흡기계로 탈출하고, 일본뇌염은 모기 흡혈을 통한 기계적 탈출을 한다."},{"id":"47-2-12","r":47,"p":2,"n":12,"s":"공중보건학","q":"다음과 같은 특성을 지닌 감염병은?","o":["두창","콜레라","A형간염","첨규콘딜롬","비브리오패혈증"],"a":1,"b":"• 제1급감염병\n• 세계보건기구 감시대상 감염병\n• 생물테러감염병","e":"두창은 제1급감염병이면서 세계보건기구 감시대상 감염병이고, 탄저·페스트·보툴리눔독소증 등과 함께 생물테러감염병에 속한다. 콜레라는 제2급감염병이며 생물테러감염병에는 해당하지 않는다."},{"id":"47-2-13","r":47,"p":2,"n":13,"s":"공중보건학","q":"다음에서 설명하는 감염병은?","o":["결핵","풍진","홍역","한센병","B형간염"],"a":1,"b":"• 코흐(Koch)에 의해 원인균이 발견되었다.\n• 모든 영유아를 대상으로 BCG 예방접종을 해야 한다.\n• 진단은 흉부방사선촬영, 객담검사 등으로 한다.","e":"결핵은 코흐가 원인균(Mycobacterium tuberculosis)을 발견했고, 영유아 대상 BCG 예방접종을 실시하며, 흉부방사선촬영과 객담검사로 진단한다. 한센병은 한센(Hansen)이 원인균을 발견했고, 홍역·풍진은 MMR로 예방한다."},{"id":"47-2-14","r":47,"p":2,"n":14,"s":"공중보건학","q":"최근 10년간 우리나라 사망원인 중 1순위인 만성질환은?","o":["암","당뇨병","심장질환","뇌혈관질환","고혈압성질환"],"a":1,"e":"통계청 사망원인통계에서 암(악성신생물)은 1983년 이후 계속 사망원인 1위이며, 최근 10년간에도 1위를 유지하고 있다. 심장질환과 뇌혈관질환은 그 뒤를 잇는 순위에 위치한다."},{"id":"47-2-15","r":47,"p":2,"n":15,"s":"공중보건학","q":"심뇌혈관질환의 발생을 줄이기 위한 1차 예방활동은?","o":["재발방지","사회복귀","식습관 개선","중증화 방지","조기진단 및 관리"],"a":3,"e":"1차 예방은 질병 발생 전 위험요인을 줄이는 활동으로, 식습관 개선·금연·운동 같은 생활습관 개선이 해당한다. 조기진단 및 관리와 중증화 방지는 2차 예방, 재발방지와 사회복귀는 3차 예방이다."},{"id":"47-2-16","r":47,"p":2,"n":16,"s":"공중보건학","q":"만성질환의 위험인자 중 조절할 수 있는 것은?","o":["성별","나이","인종","가족력","스트레스"],"a":5,"e":"스트레스는 생활방식과 관리로 조절할 수 있는 위험인자로, 흡연·음주·식습관·신체활동과 같은 범주에 속한다. 성별·나이·인종·가족력은 바꿀 수 없는 조절 불가능한 위험인자이다."},{"id":"47-2-17","r":47,"p":2,"n":17,"s":"공중보건학","q":"우리나라 국민건강보험제도에 대한 설명으로 옳은 것은?","o":["공공부조에 해당한다.","보험자는 보건복지부이다.","주된 재원은 조세이다.","보험료는 차등부과 한다.","조합주의 방식으로 운영된다."],"a":4,"e":"국민건강보험은 사회보험으로, 소득·재산 등 부담능력에 따라 보험료를 차등부과하고 보험급여는 필요에 따라 균등하게 제공한다. 보험자는 보건복지부가 아니라 국민건강보험공단이며, 주된 재원은 조세가 아닌 보험료이고, 조합주의가 아닌 통합주의(단일보험자) 방식으로 운영된다."},{"id":"47-2-18","r":47,"p":2,"n":18,"s":"공중보건학","q":"다음에서 설명하는 조직의 원리는?","o":["목적의 원리","조정의 원리","계층제의 원리","명령통일의 원리","통솔범위의 원리"],"a":3,"b":"• 권한과 책임의 정도에 따라 직무를 등급화 함\n• 상·하 등급 간 직무상의 지휘, 복종관계가 이루어지게 함","e":"계층제의 원리는 권한과 책임의 정도에 따라 직무를 등급화하고 상하 간 지휘·복종 관계를 형성하는 원리이다. 명령통일의 원리는 한 사람의 상관에게서만 명령을 받아야 한다는 것이고, 통솔범위의 원리는 한 상관이 효과적으로 통솔할 수 있는 부하의 수에 한계가 있다는 것이다."},{"id":"47-2-19","r":47,"p":2,"n":19,"s":"공중보건학","q":"조직 구성원의 참여하에 조직목표, 부서목표, 개인목표를 설정하고 사업 수행 후에, 활동결과를 평가, 환류하는 관리체제는?","o":["운영연구(OR)","체계분석(SA)","목표관리(MBO)","기획사업예산체계(PPBS)","사업평가 및 검토기법(PERT)"],"a":3,"e":"목표관리(MBO)는 구성원의 참여로 조직·부서·개인 목표를 설정하고 사업 수행 후 결과를 평가·환류하는 관리체제이다. 기획사업예산체계(PPBS)는 장기 기획과 단기 예산을 연결하는 예산제도이고, PERT는 작업 순서와 소요시간을 네트워크로 관리하는 기법이다."},{"id":"47-2-20","r":47,"p":2,"n":20,"s":"공중보건학","q":"보건복지부 소속기관에 해당하는 곳은?","o":["보건소","보건의료원","보건진료소","국립재활원","국립대학병원"],"a":4,"e":"국립재활원은 국립정신건강센터·국립소록도병원 등과 함께 보건복지부 소속기관이다. 보건소·보건의료원·보건진료소는 지방자치단체 소속의 지역 보건기관이며, 국립대학병원은 교육부 소관이다."},{"id":"47-2-21","r":47,"p":2,"n":21,"s":"공중보건학","q":"세계보건기구(WHO) 본부의 위치와 지역사무소의 수가 바르게 연결된 것은?","o":["워싱턴, 5개","제네바, 5개","제네바, 6개","마닐라, 5개","마닐라, 6개"],"a":3,"e":"세계보건기구(WHO) 본부는 스위스 제네바에 있으며, 지역사무소는 6개(아프리카, 아메리카, 동남아시아, 유럽, 동지중해, 서태평양)이다. 마닐라는 우리나라가 속한 서태평양지역 사무소 소재지이고, 워싱턴은 아메리카지역 사무소 소재지이다."},{"id":"47-2-22","r":47,"p":2,"n":22,"s":"공중보건학","q":"국가와 지방자치단체의 책임하에 생활 유지 능력이 없거나 생활이 어려운 국민의 최저생활을 보장하고 자립을 지원하는 제도는?","o":["고용보험","공공부조","국민연금","노인장기요양보험","산업재해보상보험"],"a":2,"e":"공공부조는 국가와 지방자치단체의 책임하에 생활 유지 능력이 없거나 어려운 국민의 최저생활을 보장하고 자립을 지원하는 제도로, 국민기초생활보장·의료급여가 대표적이다. 고용보험·국민연금·노인장기요양보험·산업재해보상보험은 보험료를 재원으로 하는 사회보험이다."},{"id":"47-2-23","r":47,"p":2,"n":23,"s":"공중보건학","q":"산업재해보상보험의 급여로 옳은 것은?","o":["노령연금","시설급여","실업급여","재가급여","상병보상연금"],"a":5,"e":"상병보상연금은 요양급여를 받는 근로자가 2년이 지나도 치유되지 않고 중증요양상태인 경우 지급하는 산업재해보상보험의 급여이다. 노령연금은 국민연금, 시설급여와 재가급여는 노인장기요양보험, 실업급여는 고용보험의 급여이다."},{"id":"47-2-24","r":47,"p":2,"n":24,"s":"공중보건학","q":"우리나라에서 현장조사로 이루어지는 인구주택총조사의 실시 주기는?","o":["2년","3년","4년","5년","10년"],"a":4,"e":"인구주택총조사의 현장조사는 5년마다(연도 끝자리가 0과 5인 해) 실시한다. 2015년부터는 행정자료를 활용한 등록센서스가 매년 이루어지지만, 표본 현장조사는 여전히 5년 주기이다."},{"id":"47-2-25","r":47,"p":2,"n":25,"s":"공중보건학","q":"(65세 이상 인구)/(15~64세 인구)×100으로 산출하는 것은?","o":["성비","총부양비","노년부양비","노령화지수","유소년부양비"],"a":3,"e":"노년부양비는 (65세 이상 인구)/(15~64세 인구)×100으로, 생산가능인구가 부양해야 할 노인 인구의 비율이다. 노령화지수는 (65세 이상 인구)/(0~14세 인구)×100이고, 총부양비는 (0~14세 + 65세 이상 인구)/(15~64세 인구)×100이다."},{"id":"47-2-26","r":47,"p":2,"n":26,"s":"공중보건학","q":"건강한 사람들의 일일 영양소 필요량의 중앙값으로부터 산출한 수치에 해당하는 것은?","o":["상한섭취량","권장섭취량","충분섭취량","평균필요량","생물학적필요량"],"a":4,"e":"평균필요량은 건강한 사람들의 일일 영양소 필요량의 중앙값으로부터 산출한 수치이다. 권장섭취량은 평균필요량에 표준편차의 2배를 더해 산출하고, 충분섭취량은 필요량을 정하기 어려울 때 건강한 사람들의 섭취량을 근거로 정한다."},{"id":"47-2-27","r":47,"p":2,"n":27,"s":"공중보건학","q":"「모자보건법」상 (      ) 안에 들어갈 내용으로 옳은 것은?","o":["조산아","영유아","미숙아","과숙아","신생아"],"a":2,"b":"(      )란 출생 후 6년 미만인 사람을 말한다.","e":"「모자보건법」상 영유아는 출생 후 6년 미만인 사람을 말한다. 신생아는 출생 후 28일 이내의 영유아이고, 미숙아는 신체의 발육이 미숙한 채로 출생한 영유아(임신 37주 미만 또는 출생 시 체중 2.5kg 미만 등)를 말한다."},{"id":"47-2-28","r":47,"p":2,"n":28,"s":"공중보건학","q":"「노인복지법」상 노인의료복지시설은?","o":["경로당","노인교실","양로시설","노인복지관","노인요양시설"],"a":5,"e":"「노인복지법」상 노인의료복지시설은 노인요양시설과 노인요양공동생활가정이다. 양로시설은 노인주거복지시설이고, 경로당·노인교실·노인복지관은 노인여가복지시설에 해당한다."},{"id":"47-2-29","r":47,"p":2,"n":29,"s":"공중보건학","q":"「국민건강증진법」상 개인 또는 집단으로 하여금 건강에 유익한 행위를 자발적으로 수행하도록 하는 교육은?","o":["보건영양","보건교육","보건법규","모자보건","정신보건"],"a":2,"e":"「국민건강증진법」상 보건교육은 개인 또는 집단으로 하여금 건강에 유익한 행위를 자발적으로 수행하도록 하는 교육을 말한다. 같은 법에서 영양개선은 개인 또는 집단이 균형된 식생활을 통해 건강을 개선시키는 것으로 따로 정의한다."},{"id":"47-2-30","r":47,"p":2,"n":30,"s":"공중보건학","q":"다음에서 설명하는 집단교육방법은?","o":["강연회","패널토의","분단토의","심포지엄","브레인스토밍"],"a":5,"b":"• 참가자들의 다양한 아이디어를 모을 때 활용할 수 있는 방법\n• 번개처럼 번뜩이는 기발한 생각을 잘 포착해 낸다는 의미가 담겨 있음","e":"브레인스토밍은 비판 없이 자유롭게 다양한 아이디어를 모으는 방법으로, 번개처럼 떠오르는 기발한 생각을 포착한다는 의미를 담고 있다. 심포지엄은 여러 전문가가 각자 발표한 뒤 청중과 질의응답하고, 패널토의는 전문가 몇 명이 청중 앞에서 토의하는 방식이다."},{"id":"47-2-31","r":47,"p":2,"n":31,"s":"공중보건학","q":"「학교건강검사규칙」상 건강조사 항목으로 옳은 것은?","o":["키","시력","청력","몸무게","약물의 사용"],"a":5,"e":"「학교건강검사규칙」상 건강조사 항목에는 예방접종 및 병력, 식생활 및 비만, 위생관리, 신체활동, 안전의식, 학교폭력, 흡연·음주 및 약물의 사용 등이 포함된다. 키와 몸무게는 신체의 발달상황 검사 항목이고, 시력과 청력은 건강검진 항목이다."},{"id":"47-2-32","r":47,"p":2,"n":32,"s":"공중보건학","q":"도덕적 치료를 주장하며 정신질환자를 쇠사슬로부터 해방시킨 사람은?","o":["피넬(Pinel)","프랑크(Frank)","프로이드(Freud)","라마치니(Ramazzini)","히포크라테스(Hippocrates)"],"a":1,"e":"피넬(Pinel)은 18세기 말 프랑스에서 정신질환자를 쇠사슬에서 해방시키고 인도적인 도덕적 치료를 주장했다. 라마치니는 직업병 연구로 산업보건의 시조로 불리며, 프랑크는 『전 의사경찰체계』로 공중보건의 체계를 세웠다."},{"id":"47-2-33","r":47,"p":2,"n":33,"s":"공중보건학","q":"모성사망비 계산에서 분모에 해당하는 것은?","o":["연간 사산아 수","연간 출생아 수","연간 가임여성 수","연간 모성사망자 수","연간 임신 중 발병자 수"],"a":2,"e":"【공식】 모성사망비 = (연간 모성사망자 수 / 연간 출생아 수) × 100,000\n【풀이】 모성사망비의 분모는 연간 출생아 수이고, 연간 모성사망자 수는 분자이다. 분모가 가임여성 수(15~49세 여성 인구)인 것은 모성사망률이다."},{"id":"47-2-34","r":47,"p":2,"n":34,"s":"공중보건학","q":"발단환자(index case)가 존재하는 가구의 감수성이 있는 가구원 중에서, 해당 병원체의 최장 잠복기간 내에 환자가 발병하는 율은?","o":["치명률","2차발병률","시점유병률","기간유병률","감수성지수"],"a":2,"e":"【공식】 2차발병률 = (최장 잠복기 내 발병한 환자 수 / 발단환자와 접촉한 감수성 있는 사람 수) × 100\n【풀이】 발단환자가 있는 가구의 감수성자 중 최장 잠복기 내 발병하는 비율이므로 2차발병률이며, 병원체의 감염력을 간접적으로 보여준다. 치명률은 환자 중 사망자의 비율이고, 유병률은 특정 시점(또는 기간)에 질병을 가진 사람의 비율이다."},{"id":"47-2-35","r":47,"p":2,"n":35,"s":"공중보건학","q":"다음에서 설명하는 생물테러 위기경보 단계는?","o":["관심단계","주의단계","경계단계","심각단계","지연단계"],"a":1,"b":"• 우리나라 대상 테러위협 첩보 입수\n• 국제 테러단체의 활동증가로 국제테러 빈발","e":"생물테러 위기경보는 관심-주의-경계-심각의 4단계이며, 국내 대상 테러위협 첩보를 입수하거나 국제테러가 빈발하는 등 위협 징후만 있는 초기 상황은 관심단계에 해당한다. 주의·경계·심각 단계는 테러 위협이 구체화되거나 실제 생물테러가 발생·확산되는 상황으로 점차 격상된다. 지연단계는 위기경보 단계에 없다. ※ 교재 확인 권장"},{"id":"47-2-36","r":47,"p":2,"n":36,"s":"식품위생학","q":"식품첨가물의 최대무작용량을 추정하는 독성시험은?","o":["번식시험","급성독성시험","만성독성시험","변이원성시험","최기형성시험"],"a":3,"e":"만성독성시험은 시험물질을 장기간 반복 투여해 독성이 나타나지 않는 최대무작용량(NOAEL)을 구하며, 이를 근거로 1일섭취허용량(ADI)을 정한다. 급성독성시험은 1회 투여로 반수치사량(LD50)을 구하는 시험이다."},{"id":"47-2-37","r":47,"p":2,"n":37,"s":"식품위생학","q":"바이러스가 유발하는 제2급감염병은?","o":["세균성이질","콜레라","A형간염","장티푸스","디프테리아"],"a":3,"e":"A형간염은 A형간염 바이러스가 원인인 제2급감염병으로, 분변-경구 경로로 전파된다. 세균성이질·콜레라·장티푸스는 세균이 원인인 제2급감염병이고, 디프테리아는 세균이 원인인 제1급감염병이다."},{"id":"47-2-38","r":47,"p":2,"n":38,"s":"식품위생학","q":"멸균에 대한 정의로 옳은 것은?","o":["세균의 증식 억제","병원성 세균의 사멸","세균의 감염력 상실","병원성 세균의 불활성화","미생물 영양세포 및 포자의 사멸"],"a":5,"e":"멸균은 병원성 여부와 관계없이 미생물의 영양세포와 포자까지 모두 사멸시키는 것이다. 병원성 세균을 사멸·불활성화해 감염력을 없애는 것은 소독이고, 세균의 증식을 억제하는 것은 방부이다."},{"id":"47-2-39","r":47,"p":2,"n":39,"s":"식품위생학","q":"식품의 내인성 위해요인은?","o":["시안배당체","벤조피렌","아질산염","잔류농약","유해첨가물"],"a":1,"e":"내인성 위해요인은 식품 자체에 본래 함유된 유해물질로, 청매·은행 등에 들어 있는 시안배당체(아미그달린 등)가 대표적이다. 잔류농약과 유해첨가물은 외부에서 들어오는 외인성 요인이고, 벤조피렌은 가열·가공 중 생성되는 유인성 요인이다."},{"id":"47-2-40","r":47,"p":2,"n":40,"s":"식품위생학","q":"대부분의 세균 생육에 필요한 최저 수분활성도는?","o":["0.10","0.30","0.50","0.70","0.90"],"a":5,"e":"대부분의 세균은 수분활성도(Aw) 0.90 이상에서 생육하며, 미생물별 최저 Aw는 세균 0.90 > 효모 0.88 > 곰팡이 0.80 순이다. 내건성 곰팡이나 내삼투압성 효모는 0.6대에서도 자랄 수 있지만 일반 세균은 그보다 훨씬 높은 Aw가 필요하다."},{"id":"47-2-41","r":47,"p":2,"n":41,"s":"식품위생학","q":"미생물의 증식곡선에서 열처리에 감수성이 가장 큰 시기는?","o":["대수기","유도기","정상기","정지기","사멸기"],"a":1,"e":"대수기는 세포 분열이 가장 활발한 시기로, 세포가 생리적으로 활성이 높아 열처리 등 물리·화학적 처리에 대한 감수성이 가장 크다. 정지기(정상기)에는 생균수가 최대로 일정하게 유지되며 세포가 상대적으로 저항성을 띤다."},{"id":"47-2-42","r":47,"p":2,"n":42,"s":"식품위생학","q":"식품위생의 지표미생물에 대한 설명으로 옳은 것은?","o":["직접 질병을 유발함","편성혐기성 균이어야 함","분변 오염과 관련이 있음","미생물 배양이 어려워야 함","식품의 제조 과정 중 쉽게 사멸되어야 함"],"a":3,"e":"식품위생 지표미생물(대장균군, 대장균, 장구균 등)은 분변 오염 여부를 판정하기 위한 것으로, 분변 오염과 관련이 있어야 한다. 지표미생물은 검출과 배양이 쉬워야 하고 병원균과 같거나 더 큰 저항성을 가져야 하므로, 배양이 어렵거나 쉽게 사멸되어서는 안 된다."},{"id":"47-2-43","r":47,"p":2,"n":43,"s":"식품위생학","q":"유지의 산패 판정에 사용되는 것은?","o":["과산화물가","생균수","암모니아","요오드가","히스타민"],"a":1,"e":"과산화물가는 유지가 자동산화될 때 초기에 생성되는 과산화물의 양을 측정하여 산패 정도를 판정하는 지표이다. 요오드가는 유지의 불포화도를 나타내는 값이고, 암모니아·히스타민·생균수는 단백질 식품의 부패 판정에 쓰인다."},{"id":"47-2-44","r":47,"p":2,"n":44,"s":"식품위생학","q":"관능적 부패판정법은?","o":["K값","탄력성","pH변화","트리메틸아민","휘발성 염기질소"],"a":2,"e":"관능적 부패판정법은 냄새·맛·색·조직감(탄력성) 등을 사람의 감각으로 판정하는 방법이다. K값·트리메틸아민·휘발성 염기질소·pH변화는 화학적 부패판정법에 해당한다."},{"id":"47-2-45","r":47,"p":2,"n":45,"s":"식품위생학","q":"다음에서 설명하는 물리적 소독법은?","o":["건열멸균","열탕살균","화염멸균","자외선살균","고압증기멸균"],"a":4,"b":"비가열처리 살균으로 살균효과는 표면에 한정되며, 살균 후 잔류효과가 없다.","e":"자외선살균은 260nm 부근(2,537Å)의 파장을 이용하는 비가열 살균법으로, 투과력이 약해 표면에만 효과가 있고 살균 후 잔류효과가 없다. 건열멸균·화염멸균·고압증기멸균·열탕살균은 모두 열을 이용하는 방법이다."},{"id":"47-2-46","r":47,"p":2,"n":46,"s":"식품위생학","q":"Aspergillus flavus가 생성하는 독소는?","o":["리신(ricin)","시트리닌(citrinin)","시큐톡신(cicutoxin)","아플라톡신(aflatoxin)","루테오스카이린(luteoskyrin)"],"a":4,"e":"Aspergillus flavus는 강력한 간암 유발물질인 아플라톡신을 생성하며, 땅콩·옥수수 등 곡류에서 주로 문제가 된다. 시트리닌은 Penicillium citrinum, 루테오스카이린은 Penicillium islandicum이 생성하는 황변미 독소이고, 리신은 피마자, 시큐톡신은 독미나리의 독성분이다."},{"id":"47-2-47","r":47,"p":2,"n":47,"s":"식품위생학","q":"살모넬라(Salmonella) 식중독균의 특징으로 옳은 것은?","o":["구균이다.","초고온균이다.","포자형성균이다.","통성혐기성균이다.","독소형 식중독균이다."],"a":4,"e":"살모넬라균은 그람음성 간균으로 주모성 편모가 있고 포자를 형성하지 않는 통성혐기성균이며, 감염형 식중독을 일으킨다. 열에 약해 60℃에서 20~30분 가열하면 사멸하므로 초고온균이나 포자형성균이 아니다."},{"id":"47-2-48","r":47,"p":2,"n":48,"s":"식품위생학","q":"장염 비브리오 식중독균(Vibrio parahaemolyticus)의 특징으로 옳은 것은?","o":["구균이다.","호염균이다.","편모가 없다.","그람양성균이다.","내열성 포자를 생성한다."],"a":2,"e":"장염 비브리오균은 3~4% 식염 농도에서 잘 자라는 호염균으로, 여름철 어패류 생식으로 감염형 식중독을 일으킨다. 그람음성 간균이며 단모성(극모) 편모가 있고 포자를 형성하지 않는다."},{"id":"47-2-49","r":47,"p":2,"n":49,"s":"식품위생학","q":"다음에서 설명하는 식중독균은?","o":["Bacillus cereus","Listeria monocytogenes","Pathogenic Escherichia coli","Staphylococcus aureus","Clostridium perfringens"],"a":2,"b":"• 내염성이 있다.\n• 원인균은 5 ℃의 냉장 온도에서 생육한다.\n• 메스꺼움, 구토, 설사와 함께 수막염, 패혈증과 같은 합병증을 유발할 수도 있다.","e":"Listeria monocytogenes는 내염성이 있고 5℃ 냉장 온도에서도 증식하는 저온균으로, 수막염·패혈증을 일으키며 임산부에게는 유산·사산 위험이 있다. Staphylococcus aureus도 내염성이 있지만 냉장 온도에서는 증식하지 않고 수막염 같은 합병증을 일으키지 않는다."},{"id":"47-2-50","r":47,"p":2,"n":50,"s":"식품위생학","q":"다음에서 설명하는 식중독균은?","o":["Bacillus subtilis","Salmonella Enteritidis","Campylobacter jejuni","Vibrio parahaemolyticus","Pathogenic Escherichia coli"],"a":3,"b":"• 형태는 나선형의 간균이다.\n• 미호기성으로 5~10 % 산소 존재하에서 잘 자란다.","e":"Campylobacter jejuni는 나선형(S자형) 간균으로, 산소 5~10% 정도의 미호기성 조건과 42℃ 부근에서 잘 자라며 닭고기 등 가금류가 주요 원인식품이다. Vibrio parahaemolyticus는 호염성 간균, Salmonella Enteritidis는 통성혐기성 간균으로 미호기성이 특징이 아니다."},{"id":"47-2-51","r":47,"p":2,"n":51,"s":"식품위생학","q":"여시니아 식중독균(Yersinia enterocolitica)의 특징은?","o":["구균이다.","편모가 없다.","그람양성균이다.","포자를 생성한다.","냉장 조건에서도 생육이 가능하다."],"a":5,"e":"여시니아균(Yersinia enterocolitica)은 0~5℃의 냉장 조건에서도 증식할 수 있는 저온균으로, 진공포장 식품·돼지고기·우유 등이 원인이 된다. 그람음성 간균으로 포자를 형성하지 않으며, 25℃ 부근에서는 주모성 편모로 운동성을 보인다."},{"id":"47-2-52","r":47,"p":2,"n":52,"s":"식품위생학","q":"황색포도상구균(Staphylococcus aureus)의 특징은?","o":["장독소 생성균이다.","운동성이 있다.","그람음성균이다.","포자를 생성한다.","편성혐기성균이다."],"a":1,"e":"황색포도상구균은 내열성 장독소(enterotoxin)를 생성하는 독소형 식중독균으로, 독소는 100℃에서 30분 가열해도 파괴되지 않는다. 그람양성 구균이며 편모가 없어 운동성이 없고, 포자를 형성하지 않는 통성혐기성균이다."},{"id":"47-2-53","r":47,"p":2,"n":53,"s":"식품위생학","q":"보툴리눔 식중독균(Clostridium botulinum)의 특징은?","o":["간균이다.","단모균이다.","그람음성균이다.","통성혐기성균이다.","포자를 생성하지 않는다."],"a":1,"e":"보툴리눔균은 그람양성 간균으로 주모성 편모를 가지며, 내열성 포자를 형성하는 편성혐기성균이다. 통조림·소시지 등 혐기 상태의 식품에서 신경독소를 생성하며, 단모균이나 그람음성균이 아니다."},{"id":"47-2-54","r":47,"p":2,"n":54,"s":"식품위생학","q":"유기인계 농약은?","o":["2,4-D","알드린(aldrin)","프라톨(fratol)","카바릴(carbaryl)","말라티온(malathion)"],"a":5,"e":"말라티온은 파라티온·다이아지논·EPN 등과 같은 유기인계 농약으로, 콜린에스테라아제 활성을 억제해 신경 증상을 일으킨다. 알드린은 유기염소계, 카바릴은 카바메이트계, 프라톨은 유기불소계, 2,4-D는 페녹시계 제초제이다."},{"id":"47-2-55","r":47,"p":2,"n":55,"s":"식품위생학","q":"「식품공전」에서 허용치를 규제하는 방사능 물질은?","o":["망간(⁵⁵Mn)","크롬(⁵⁴Cr)","요오드(¹³¹I)","우라늄(²³⁸U)","코발트(⁶⁰Co)"],"a":3,"e":"「식품공전」은 방사능 오염 기준으로 요오드(¹³¹I)와 세슘(¹³⁴Cs+¹³⁷Cs)의 허용 기준을 정해 규제한다. 망간·크롬·우라늄·코발트 동위원소는 식품공전의 방사능 허용 기준 대상이 아니다."},{"id":"47-2-56","r":47,"p":2,"n":56,"s":"식품위생학","q":"다음에서 설명하는 중금속은?","o":["납","비소","수은","크롬","카드뮴"],"a":5,"b":"• 만성중독시 신장장애를 유발한다.\n• 골연화증, 골다공증을 유발한다.\n• ‘이따이이따이’병의 원인물질이다.","e":"카드뮴은 만성중독 시 신장장애(세뇨관 손상)를 일으키고 칼슘 대사를 교란해 골연화증·골다공증을 유발하며, 일본 이타이이타이병의 원인물질이다. 수은은 미나마타병, 비소는 흑피증과 피부암의 원인물질로 구분한다."},{"id":"47-2-57","r":47,"p":2,"n":57,"s":"식품위생학","q":"열경화성 수지에서 용출되는 유독 물질은?","o":["에틸렌","프로필렌","비스페놀A","포름알데히드","프탈레이트"],"a":4,"e":"페놀수지·요소수지·멜라민수지 같은 열경화성 수지는 제조 시 포름알데히드를 원료로 사용하므로 가열·산성 조건에서 포름알데히드가 용출될 수 있다. 비스페놀A는 폴리카보네이트 수지, 프탈레이트는 PVC 등의 가소제에서 용출되는 물질이다."},{"id":"47-2-58","r":47,"p":2,"n":58,"s":"식품위생학","q":"복어독 성분은?","o":["삭시톡신(saxitoxin)","테트라민(tetramine)","베네루핀(venerupin)","오카다산(okadaic acid)","테트로도톡신(tetrodotoxin)"],"a":5,"e":"복어독은 테트로도톡신으로, 난소·간에 많이 들어 있으며 열에 강해 가열해도 파괴되지 않고 신경마비를 일으킨다. 삭시톡신은 섭조개·대합의 마비성 패류독, 베네루핀은 모시조개·바지락·굴, 테트라민은 소라고둥의 독성분이다."},{"id":"47-2-59","r":47,"p":2,"n":59,"s":"식품위생학","q":"식품과, 이에 함유된 자연독 성분이 옳게 연결된 것은?","o":["청매 – 솔라닌(solanine)","독버섯 – 무스카린(muscarine)","고사리 – 듀린(dhurrin)","수수 – 테물린(temuline)","독미나리 – 고시폴(gossypol)"],"a":2,"e":"독버섯(광대버섯 등)의 대표적 독성분은 무스카린으로, 부교감신경을 자극해 발한·유연·구토를 일으킨다. 솔라닌은 감자, 청매는 아미그달린이며, 듀린은 수수, 테물린은 독보리, 고시폴은 면실유, 독미나리는 시큐톡신이 독성분이다."},{"id":"47-2-60","r":47,"p":2,"n":60,"s":"식품위생학","q":"푸른곰팡이가 생성하는 곰팡이독은?","o":["푸모니신(fumonisin)","말토리진(maltoryzine)","에르고톡신(ergotoxin)","루브라톡신(rubratoxin)","제랄레논(zearalenone)"],"a":4,"e":"루브라톡신은 푸른곰팡이(Penicillium rubrum)가 생성하는 간장독이다. 푸모니신과 제랄레논은 붉은곰팡이(Fusarium) 독소이고, 에르고톡신은 맥각균, 말토리진은 Aspergillus oryzae var. microsporus가 생성하는 독소이다."},{"id":"47-2-61","r":47,"p":2,"n":61,"s":"식품위생학","q":"급성회백수염의 병원체는?","o":["Hepatitis virus","Vibrio cholerae","Bacillus anthracis","Poliomyelitis virus","Pseudomonas fluorescens"],"a":4,"e":"급성회백수염(폴리오, 소아마비)의 병원체는 폴리오바이러스(Poliomyelitis virus)로, 분변-경구 경로로 감염되어 척수 신경을 침범한다. Vibrio cholerae는 콜레라, Bacillus anthracis는 탄저의 원인균이다."},{"id":"47-2-62","r":47,"p":2,"n":62,"s":"식품위생학","q":"장티푸스에 대한 설명으로 옳은 것은?","o":["제1급감염병이다.","인수공통감염병이다.","파상열이라고도 불린다.","원인균은 Salmonella 속이다.","투베르쿨린 검사로 감염 여부를 확인한다."],"a":4,"e":"장티푸스의 원인균은 Salmonella Typhi로 Salmonella 속에 속하며, 사람만이 숙주인 제2급감염병이다. 파상열은 브루셀라증의 다른 이름이고, 투베르쿨린 검사는 결핵 감염 여부를 확인하는 방법이다."},{"id":"47-2-63","r":47,"p":2,"n":63,"s":"식품위생학","q":"세균성 이질균의 특징은?","o":["구균이다.","편모가 있다.","그람음성균이다.","포자를 형성한다.","원인균은 Proteus 속이다."],"a":3,"e":"세균성 이질균(Shigella 속)은 그람음성 간균이며, 편모가 없어 운동성이 없고 포자를 형성하지 않는다. Proteus는 알레르기성 식중독(히스타민)과 관련된 균으로 이질균과 다르다."},{"id":"47-2-64","r":47,"p":2,"n":64,"s":"식품위생학","q":"디프테리아 원인균의 특징은?","o":["간균이다.","편모가 있다.","그람음성균이다.","포자를 생성한다.","Pseudomonas 속이다."],"a":1,"e":"디프테리아 원인균(Corynebacterium diphtheriae)은 그람양성 간균으로, 편모가 없어 운동성이 없고 포자를 형성하지 않는다. Pseudomonas 속은 그람음성 간균으로 디프테리아와 관련이 없다."},{"id":"47-2-65","r":47,"p":2,"n":65,"s":"식품위생학","q":"다음에서 설명하는 인수공통감염병은?","o":["Q열","결핵","탄저","페스트","브루셀라증"],"a":2,"b":"• Mycobacterium 속에 의해 일어나는 질병이다.\n• 감염된 소의 우유 섭취를 통해 발생된다.","e":"결핵은 Mycobacterium 속(소의 경우 우형결핵균 M. bovis)에 의해 발생하며, 감염된 소의 우유를 살균 없이 섭취하면 사람에게 감염되는 인수공통감염병이다. 브루셀라증도 소·양의 우유로 감염되지만 원인균이 Brucella 속이고, Q열은 리케치아(Coxiella burnetii)가 원인이다."},{"id":"47-2-66","r":47,"p":2,"n":66,"s":"식품위생학","q":"채소류를 통해 감염을 일으키는 기생충은?","o":["요충","폐흡충","무구조충","유구조충","요코가와흡충"],"a":1,"e":"요충은 충란에 오염된 채소·음식·손 등을 통해 경구 감염되는 채소매개성 선충으로, 항문 주위에 산란해 가려움을 일으키고 집단감염이 잘 된다. 폐흡충은 가재·게, 무구조충은 소고기, 유구조충은 돼지고기, 요코가와흡충은 은어 등 민물고기를 통해 감염된다."},{"id":"47-2-67","r":47,"p":2,"n":67,"s":"식품위생학","q":"다음에서 설명하는 기생충은?","o":["편충","간흡충","선모충","아니사키스","유극악구충"],"a":3,"b":"• 병원체는 Trichinella spiralis이다.\n• 돼지고기를 생식하여 감염된다.","e":"선모충(Trichinella spiralis)은 돼지고기를 생식할 때 근육 속 피낭유충이 섭취되어 감염되는 기생충이다. 아니사키스는 고래회충으로 해산어류의 생식, 간흡충은 민물고기 생식으로 감염된다."},{"id":"47-2-68","r":47,"p":2,"n":68,"s":"식품위생학","q":"연어, 송어 등이 제2중간숙주인 기생충은?","o":["구충","회충","폐흡충","광절열두조충","동양모양선충"],"a":4,"e":"광절열두조충(긴촌충)은 제1중간숙주가 물벼룩, 제2중간숙주가 연어·송어·농어 등 민물 또는 회유성 어류이다. 폐흡충은 다슬기와 가재·게를 중간숙주로 하고, 회충·구충·동양모양선충은 중간숙주 없이 채소 등으로 감염된다."},{"id":"47-2-69","r":47,"p":2,"n":69,"s":"식품위생학","q":"두 가지 또는 그 이상의 성분을 일정한 분산 형태로 유지시키는 식품첨가물은?","o":["발색제","분사제","안정제","이형제","충전제"],"a":3,"e":"「식품첨가물 공전」상 안정제는 두 가지 또는 그 이상의 성분을 일정한 분산 형태로 유지시키는 식품첨가물이다. 이형제는 식품이 형틀에 달라붙지 않게 하고, 분사제는 용기에서 식품을 방출시키는 가스를 말한다."},{"id":"47-2-70","r":47,"p":2,"n":70,"s":"식품위생학","q":"「식품첨가물 공전」상 주용도가 보존료인 것은?","o":["만니톨","산화칼슘","소브산칼륨","탄산수소나트륨","몰식자산 프로필"],"a":3,"e":"소브산칼륨(소르빈산칼륨)은 「식품첨가물 공전」상 주용도가 보존료로, 미생물의 증식을 억제한다. 몰식자산 프로필은 산화방지제, 탄산수소나트륨은 팽창제, 만니톨은 감미료로 쓰인다."},{"id":"47-2-71","r":47,"p":2,"n":71,"s":"식품위생학","q":"「식품첨가물 공전」상 주용도가 산도조절제인 것은?","o":["질산","초산","헥산","알긴산","탄닌산"],"a":2,"e":"초산(빙초산)은 「식품첨가물 공전」상 산도조절제로 식품의 산도를 조절한다. 헥산은 유지 추출에 쓰는 추출용제이고, 알긴산은 증점제로 쓰인다."},{"id":"47-2-72","r":47,"p":2,"n":72,"s":"식품위생학","q":"「식품첨가물 공전」상 주용도가 피막제인 것은?","o":["아스파탐","결정셀룰로스","초산비닐수지","안식향산나트륨","이소프로필알콜"],"a":3,"e":"초산비닐수지는 「식품첨가물 공전」상 피막제(과일·채소 표면 코팅)이자 껌기초제로 쓰인다. 아스파탐은 감미료, 안식향산나트륨은 보존료, 이소프로필알콜은 추출용제이다."},{"id":"47-2-73","r":47,"p":2,"n":73,"s":"식품위생학","q":"식품 방사선 조사에 대한 설명으로 옳은 것은?","o":["포장된 식품을 살균할 수 있다.","살충 목적으로 사용할 수 없다.","방사선량의 단위는 베크렐(Bq)이다.","열이 발생하므로 열 살균이라고도 한다.","「식품공전」상, 발아 촉진 목적으로 사용된다."],"a":1,"e":"방사선(감마선)은 투과력이 강해 포장된 상태의 식품도 살균·살충할 수 있다. 온도 상승이 거의 없어 냉살균이라 하며, 흡수선량 단위는 그레이(Gy)이고 「식품공전」상 발아 억제·살균·살충·숙도조절 목적으로 사용한다(발아 촉진이 아니다)."},{"id":"47-2-74","r":47,"p":2,"n":74,"s":"식품위생학","q":"식품안전관리인증기준(HACCP) 관리계획을 수립하기 위한 준비 5단계의 순서로 옳은 것은?","o":["㉠ – ㉣ – ㉤ – ㉡ – ㉢","㉢ – ㉣ – ㉠ – ㉤ – ㉡","㉠ – ㉢ – ㉡ – ㉣ – ㉤","㉤ – ㉣ – ㉢ – ㉠ – ㉡","㉢ – ㉠ – ㉡ – ㉣ – ㉤"],"a":2,"b":"㉠ 용도 확인\n㉡ 공정흐름도 현장 확인\n㉢ HACCP팀 구성\n㉣ 제품설명서 작성\n㉤ 공정흐름도 작성","e":"HACCP 준비 5단계의 순서는 HACCP팀 구성 → 제품설명서 작성 → 용도 확인 → 공정흐름도 작성 → 공정흐름도 현장 확인이다. 공정흐름도는 먼저 작성한 뒤 현장에서 확인해야 하므로, 현장 확인이 작성보다 앞서는 순서는 틀리다."},{"id":"47-2-75","r":47,"p":2,"n":75,"s":"식품위생학","q":"식품안전관리인증기준(HACCP)의 7원칙에서 다음 설명에 해당하는 것은?","o":["검증계획 수립","위해요소 분석","한계기준 설정","중요관리점 결정","모니터링 방법 수립"],"a":2,"b":"식품 안전에 영향을 줄 수 있는 위해요소와 이를 유발할 수 있는 조건이 존재하는지 여부를 판별하기 위하여 필요한 정보를 수집하고 평가하는 일련의 과정","e":"위해요소 분석은 HACCP 7원칙 중 원칙 1로, 식품 안전에 영향을 줄 수 있는 위해요소와 그 유발 조건이 존재하는지 판별하기 위해 정보를 수집·평가하는 과정이다. 중요관리점 결정은 분석된 위해요소를 예방·제거·허용수준 이하로 감소시킬 수 있는 단계를 정하는 원칙 2이다."},{"id":"47-1-1","r":47,"p":1,"n":1,"s":"위생관계법령","q":"「공중위생관리법」상 위생사의 업무 중 옳지 <u>않은</u> 것은?","o":["유해 곤충·설치류 및 매개체 관리","쓰레기, 분뇨, 하수, 그 밖의 폐기물의 처리","집단급식소의 운영일지 작성","공중위생영업소, 공중이용시설 및 위생용품의 위생관리","식품·식품첨가물과 이에 관련된 기구·용기 및 포장의 제조와 가공에 관한 위생관리"],"a":3,"e":"공중위생관리법상 위생사의 업무는 공중위생영업소·공중이용시설·위생용품의 위생관리, 먹는물 위생관리, 쓰레기·분뇨·하수 등 폐기물 처리, 식품·식품첨가물과 관련 기구·용기·포장의 위생관리, 유해 곤충·설치류 및 매개체 관리 등이다. 집단급식소의 운영일지 작성은 이 목록에 없으며 급식 운영(영양사·조리 실무) 쪽 업무이다. 해충·설치류 관리나 폐기물 처리는 생소해 보여도 위생사 업무에 포함된다."},{"id":"47-1-2","r":47,"p":1,"n":2,"s":"위생관계법령","q":"「공중위생관리법」상 공중위생감시원이 될 수 <u>없는</u> 사람은?","o":["위생사","공중위생 관련 협회 추천자","환경기사 2급 이상의 자격증 취득자","1년 이상 공중위생 행정에 종사한 경력이 있는 사람","대학에서 화학·화공학·환경공학 분야를 전공한 졸업자"],"a":2,"e":"공중위생감시원은 위생사·환경기사 2급 이상 자격자, 대학에서 화학·화공학·환경공학·위생학 분야를 전공한 졸업자, 1년 이상 공중위생 행정 경력자 등 자격을 갖춘 소속 공무원 중에서 임명한다. 공중위생 관련 협회 추천은 공중위생감시원이 아니라 ‘명예공중위생감시원’ 위촉 대상이므로 헷갈리지 않도록 한다."},{"id":"47-1-3","r":47,"p":1,"n":3,"s":"위생관계법령","q":"「공중위생관리법」상 위생사가 아니면 위생사라는 명칭을 사용하지 못하는 규정을 위반한 자에 대한 행정처분은?","o":["과태료 100만원 이하","과태료 200만원 이하","과태료 300만원 이하","과태료 400만원 이하","과태료 500만원 이하"],"a":1,"e":"공중위생관리법상 위생사가 아니면서 위생사 명칭을 사용한 자에게는 100만원 이하의 과태료가 부과된다. 300만원 이하·200만원 이하 과태료는 개선명령 위반, 영업소 위생관리 의무 위반 등 다른 위반행위에 해당하는 금액이다."},{"id":"47-1-4","r":47,"p":1,"n":4,"s":"위생관계법령","q":"「공중위생관리법」상 숙박업에서 제외되는 시설은?","o":["여관","호텔","펜션","청소년수련시설","휴양 콘도미니엄"],"a":4,"e":"공중위생관리법상 숙박업은 손님이 잠을 자고 머물 수 있도록 시설과 설비를 제공하는 영업이지만, 농어촌민박, 자연휴양림 안의 시설, 청소년수련시설 등 다른 법령으로 관리되는 시설은 제외된다. 청소년수련시설은 청소년활동 관련 법에 따라 따로 관리되므로 숙박업에서 빠진다. 호텔·여관·펜션 등은 숙박업에 해당한다."},{"id":"47-1-5","r":47,"p":1,"n":5,"s":"위생관계법령","q":"「공중위생관리법」상 위생관리등급의 구분 중 우수업소 등급은?","o":["백색등급","녹색등급","청색등급","황색등급","적색등급"],"a":4,"e":"공중위생관리법상 위생관리등급은 최우수업소 녹색등급, 우수업소 황색등급, 일반관리대상 업소 백색등급으로 구분한다. 녹색등급을 우수업소로 착각하기 쉬운데 녹색은 한 단계 위인 최우수업소이다."},{"id":"47-1-6","r":47,"p":1,"n":6,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 용어로 옳은 것은?","o":["물리방지","화학방지","생물방지","산화방지","분해방지"],"a":4,"b":"“식품첨가물”이란 식품을 제조·가공·조리 또는 보존하는 과정에서 감미, 착색, 표백 또는 (      ) 등을 목적으로 식품에 사용되는 물질을 말한다.","e":"식품위생법상 식품첨가물은 식품을 제조·가공·조리·보존하는 과정에서 감미, 착색, 표백 또는 산화방지 등을 목적으로 식품에 사용되는 물질로 정의된다(기구·용기·포장을 살균·소독하는 데 쓰여 식품으로 옮아갈 수 있는 물질 포함). 물리방지·생물방지 같은 용어는 정의에 나오지 않는다."},{"id":"47-1-7","r":47,"p":1,"n":7,"s":"위생관계법령","q":"「식품위생법」상 병든 동물 고기 등의 판매등 금지에 해당하는 질병이 <u>아닌</u> 것은?","o":["방선균증","선모충증","살모넬라병","리스테리아병","파스튜렐라병"],"a":1,"e":"식품위생법상 판매 등이 금지되는 병든 동물 고기의 질병은 도축이 금지되는 가축전염병과 리스테리아병, 살모넬라병, 파스튜렐라병, 선모충증이다. 방선균증은 이 목록에 포함되지 않는다. 선모충증은 기생충 질환이라 빠질 것 같지만 명시되어 있다."},{"id":"47-1-8","r":47,"p":1,"n":8,"s":"위생관계법령","q":"「식품위생법」상 식품 또는 식품첨가물의 기준과 규격 등을 실은 식품등의 공전을 작성·보급하여야 하는 자는?","o":["질병관리청장","시·도지사","식품의약품안전처장","시장·군수·구청장","국립환경과학원장"],"a":3,"e":"식품위생법상 식품의약품안전처장은 식품·식품첨가물의 기준과 규격 등을 실은 식품등의 공전을 작성·보급하여야 한다. 질병관리청장은 감염병, 시·도지사나 시장·군수·구청장은 지역 단위 위생 행정을 담당하므로 공전 작성 주체가 아니다."},{"id":"47-1-9","r":47,"p":1,"n":9,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 숫자로 옳은 것은?","o":["5","10","15","20","30"],"a":4,"b":"유전자변형식품등 안전성심사위원회는 위원장 1명을 포함한 (    )명 이내의 위원으로 구성한다.","e":"식품위생법상 유전자변형식품등 안전성심사위원회는 위원장 1명을 포함한 20명 이내의 위원으로 구성한다. 식품위생심의위원회(위원장 1명, 부위원장 2명 포함 100명 이내)와 인원 기준을 혼동하지 않도록 한다."},{"id":"47-1-10","r":47,"p":1,"n":10,"s":"위생관계법령","q":"「식품위생법」상 식품의약품안전처장의 자문에 응하여, 식품위생심의위원회가 조사·심의하는 사항이 <u>아닌</u> 것은?","o":["식중독 방지에 관한 사항","식품등의 판매에 관한 사항","식품등의 기준과 규격에 관한 사항","그 밖에 식품위생에 관한 중요 사항","농약·중금속 등 유독·유해물질 잔류 허용 기준에 관한 사항"],"a":2,"e":"식품위생법상 식품위생심의위원회는 식약처장의 자문에 응하여 식중독 방지, 농약·중금속 등 유독·유해물질 잔류 허용 기준, 식품등의 기준과 규격, 그 밖에 식품위생에 관한 중요 사항을 조사·심의한다. 식품등의 판매에 관한 사항은 심의 대상이 아니다."},{"id":"47-1-11","r":47,"p":1,"n":11,"s":"위생관계법령","q":"「식품위생법」상 식중독 환자나 식중독이 의심되는 자를 진단하였거나 그 사체를 검안한 의사 또는 한의사는 누구에게 보고하여야 하는가?","o":["질병관리청장","보건복지부장관","국립환경과학원장","지방식품의약품안전청장","관할 특별자치시장·시장·군수·구청장"],"a":5,"e":"식품위생법상 식중독 환자나 의심자를 진단하거나 그 사체를 검안한 의사·한의사는 지체 없이 관할 특별자치시장·시장·군수·구청장에게 보고해야 한다. 이후 시장·군수·구청장이 식약처장과 시·도지사에게 보고하는 체계이므로, 의사가 질병관리청장이나 지방식약청장에게 직접 보고하는 것이 아니다."},{"id":"47-1-12","r":47,"p":1,"n":12,"s":"위생관계법령","q":"「식품위생법」상 (    )에 들어갈 용어는?","o":["특정 다수인 – 급식시설","특정 다수인 – 식품 가공시설","특정 다수인 – 식품 보존시설","불특정 다수인 – 급식시설","불특정 다수인 – 식품 가공시설"],"a":1,"b":"“집단급식소”란 영리를 목적으로 하지 아니하면서 (    )에게 계속하여 음식물을 공급하는 곳의 (    )로 대통령령으로 정하는 시설을 말한다.","e":"식품위생법상 집단급식소는 영리를 목적으로 하지 않으면서 특정 다수인에게 계속하여 음식물을 공급하는 기숙사·학교·병원 등의 급식시설로서 대통령령으로 정하는 시설(1회 50명 이상)이다. 불특정 다수인을 대상으로 하는 것은 일반음식점 같은 식품접객업이므로 ‘불특정’이 들어간 보기는 틀리다."},{"id":"47-1-13","r":47,"p":1,"n":13,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 제2급감염병으로 옳은 것은?","o":["폴리오","요충증","야토병","뎅기열","신종인플루엔자"],"a":1,"e":"감염병예방법상 폴리오는 결핵·수두·홍역·콜레라·장티푸스 등과 함께 제2급감염병이다. 야토병과 신종인플루엔자는 제1급, 뎅기열은 제3급, 요충증은 제4급감염병이다."},{"id":"47-1-14","r":47,"p":1,"n":14,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 다음에 해당하는 것은?","o":["기생충감염병","성매개감염병","생물테러감염병","인수공통감염병","세계보건기구 감시대상 감염병"],"a":3,"b":"고의 또는 테러 등을 목적으로 이용된 병원체에 의하여 발생된 감염병 중에서 질병관리청장이 고시하는 감염병","e":"감염병예방법상 고의 또는 테러 등을 목적으로 이용된 병원체에 의하여 발생된 감염병 중 질병관리청장이 고시하는 감염병은 생물테러감염병이다(탄저, 보툴리눔독소증, 페스트, 천연두 등). 인수공통감염병은 동물과 사람 간에 서로 전파되는 감염병으로, 고의성 여부와 관계가 없다."},{"id":"47-1-15","r":47,"p":1,"n":15,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 질병관리청장은 보건복지부장관과 협의하여 감염병의 예방 및 관리에 관한 기본계획을 몇 년마다 수립·시행하여야 하는가?","o":["1년","2년","3년","4년","5년"],"a":5,"e":"감염병예방법상 질병관리청장은 보건복지부장관과 협의하여 감염병의 예방 및 관리에 관한 기본계획을 5년마다 수립·시행하여야 한다. 시·도지사와 시장·군수·구청장은 이 기본계획에 따라 매년 시행계획을 수립하므로 ‘1년’과 혼동하지 않도록 한다."},{"id":"47-1-16","r":47,"p":1,"n":16,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 역학조사에 포함되지 <u>않는</u> 내용은?","o":["감염병환자등의 발병일 및 발병 장소","감염병의 감염원인 및 감염경로","예방접종대상인 감염병관리에 관한 비용지원에 관한 사항","감염병환자등 및 감염병의심자의 인적 사항","감염병환자등 및 감염병의심자에 관한 진료기록"],"a":3,"e":"감염병예방법상 역학조사에는 감염병환자등 및 의심자의 인적 사항, 발병일·발병 장소, 감염원인·감염경로, 진료기록, 그 밖에 감염병의 원인 규명에 필요한 사항이 포함된다. 예방접종 비용지원은 예방접종 관련 규정의 내용이지 역학조사 항목이 아니다."},{"id":"47-1-17","r":47,"p":1,"n":17,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 고위험병원체의 분리신고서를 누구에게 제출하여야 하는가?","o":["시·도지사","질병관리청장","보건복지부장관","감염병관리위원장","식품의약품안전처장"],"a":2,"e":"감염병예방법상 고위험병원체를 분리하거나 이동받은 자는 지체 없이 그 사실을 질병관리청장에게 신고하여야 한다. 고위험병원체 관리는 감염병 총괄기관인 질병관리청 소관이며, 식약처장이나 시·도지사가 받는 신고가 아니다."},{"id":"47-1-18","r":47,"p":1,"n":18,"s":"위생관계법령","q":"「감염병의 예방 및 관리에 관한 법률」상 필수 예방 접종이 <u>아닌</u> 것은?","o":["홍역","결핵","풍진","수두","중동호흡기증후군"],"a":5,"e":"감염병예방법상 필수예방접종 대상은 디프테리아, 폴리오, 백일해, 홍역, 파상풍, 결핵, B형간염, 유행성이하선염, 풍진, 수두, 일본뇌염, b형헤모필루스인플루엔자, 폐렴구균, 인플루엔자, A형간염, 사람유두종바이러스, 그룹 A형 로타바이러스 등이다. 중동호흡기증후군(MERS)은 제1급감염병이지만 상용 백신이 없어 필수예방접종 대상이 아니다."},{"id":"47-1-19","r":47,"p":1,"n":19,"s":"위생관계법령","q":"「먹는물관리법」상 샘물을 먹기에 적합하도록 물리적으로 처리하는 등의 방법으로 제조한 물은?","o":["샘물","먹는물","먹는샘물","먹는염지하수","먹는해양심층수"],"a":3,"e":"먹는물관리법상 먹는샘물은 샘물을 먹기에 적합하도록 물리적으로 처리하는 등의 방법으로 제조한 물이다. 샘물은 처리 전의 자연 상태의 깨끗한 원수(암반대수층의 지하수·용천수 등)를 말하므로 제조된 물인 먹는샘물과 구분해야 한다."},{"id":"47-1-20","r":47,"p":1,"n":20,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물 수질검사기관으로 지정되지 <u>않은</u> 기관은?","o":["국립환경과학원","한국표준과학연구원","시·도 보건환경연구원","유역환경청 또는 지방환경청","특별시·광역시의 상수도연구소·수질검사소"],"a":2,"e":"먹는물관리법상 먹는물 수질검사기관에는 국립환경과학원, 유역환경청·지방환경청, 시·도 보건환경연구원, 특별시·광역시의 상수도연구소·수질검사소 등 수질 관련 행정·연구기관이 포함된다. 한국표준과학연구원은 측정 표준 연구기관으로 먹는물 수질검사기관에 해당하지 않는다."},{"id":"47-1-21","r":47,"p":1,"n":21,"s":"위생관계법령","q":"「먹는물관리법」상 먹는물 수질 감시원의 직무 범위로 옳은 것은?","o":["먹는물의 관련 시설 감독 관리","먹는물의 수질 검사기관 운영","먹는물의 분석 방법에 관한 개선","먹는물의 시설관리에 관한 방법 관리","먹는물의 수질관리에 관한 조사·지도 및 감시"],"a":5,"e":"먹는물관리법상 먹는물 수질 감시원은 먹는물의 수질관리에 관한 조사·지도 및 감시를 직무로 한다. 수질 검사기관 운영이나 분석 방법 개선은 검사기관·연구기관의 역할이지 감시원의 직무가 아니다. ※ 교재 확인 권장"},{"id":"47-1-22","r":47,"p":1,"n":22,"s":"위생관계법령","q":"「먹는물관리법」상 샘물등의 개발허가 유효기간은?","o":["1년","2년","3년","4년","5년"],"a":5,"e":"먹는물관리법상 샘물등의 개발허가 유효기간은 5년이며, 연장이 필요하면 다시 허가를 받아야 한다. 짧은 1~3년 보기와 혼동하기 쉬우나 법정 유효기간은 5년이다."},{"id":"47-1-23","r":47,"p":1,"n":23,"s":"위생관계법령","q":"「먹는물관리법」상 먹는샘물등의 제조업을 하려는 자는 기후에너지환경부령으로 정하는 바에 따라 누구의 허가를 받아야 하는가?","o":["시·도지사","국립환경과학원장","시장·군수·구청장","기후에너지환경부장관","시·도 보건환경연구원장"],"a":1,"e":"먹는물관리법상 먹는샘물등의 제조업을 하려는 자는 시·도지사의 허가를 받아야 한다. 수입판매업(등록)과 유통전문판매업(신고)도 시·도지사 소관이며, 기후에너지환경부장관이나 시장·군수·구청장이 허가하는 것이 아니다."},{"id":"47-1-24","r":47,"p":1,"n":24,"s":"위생관계법령","q":"「폐기물관리법」상 폐기물분석전문기관으로 지정될 수 <u>없는</u> 기관은?","o":["한국환경공단","한국수자원공사","보건환경연구원","수도권매립지관리공사","그 밖에 기후에너지환경부장관이 폐기물의 시험·분석 능력이 있다고 인정하는 기관"],"a":2,"e":"폐기물관리법상 폐기물분석전문기관으로는 한국환경공단, 수도권매립지관리공사, 보건환경연구원, 그 밖에 기후에너지환경부장관이 시험·분석 능력이 있다고 인정하는 기관이 지정될 수 있다. 한국수자원공사는 수자원·상수도 관리 기관으로 폐기물분석전문기관 지정 대상이 아니다."},{"id":"47-1-25","r":47,"p":1,"n":25,"s":"위생관계법령","q":"「하수도법」상 엄격한 방류수수질기준의 적용 지역이 <u>아닌</u> 곳은?","o":["「자연공원법」에 따른 자연공원","「먹는물관리법」에 따른 샘물보전구역","「환경정책기본법」에 따른 특별대책지역","「국토의 계획 및 이용에 관한 법률」에 따른 수산자원보호구역","「해양생태계의 보전 및 관리에 관한 법률」에 따른 해양보호구역"],"a":2,"e":"하수도법상 엄격한 방류수수질기준은 환경정책기본법상 특별대책지역, 자연공원법상 자연공원, 국토계획법상 수산자원보호구역, 해양생태계법상 해양보호구역 등 보전 가치가 큰 지역에 적용된다. 먹는물관리법상 샘물보전구역은 이 적용 지역에 포함되지 않는다. ※ 교재 확인 권장"},{"id":"47-1-26","r":47,"p":1,"n":26,"s":"환경위생학","q":"금속의 증기가 응축할 때 공기 중에 생성되는 고체상 물질은?","o":["검댕(soot)","연무(mist)","훈연(fume)","매연(smoke)","스모그(smog)"],"a":3,"e":"훈연(fume)은 금속 등이 고온에서 증발한 뒤 그 증기가 응축하여 생긴 고체 미립자로, 용접 흄이 대표적이다. 연무(mist)는 액체 입자이고, 검댕(soot)은 불완전연소로 생긴 탄소 입자이므로 금속 증기 응축과 관계가 없다."},{"id":"47-1-27","r":47,"p":1,"n":27,"s":"환경위생학","q":"표준상태에서 건조공기를 기준으로 할 때 공기의 부피 조성으로 옳은 것은?","o":["질소 78.1 %","산소 15.2 %","아르곤 0.7 %","이산화탄소 0.5 %","이황화탄소 0.2 %"],"a":1,"e":"표준상태 건조공기의 부피 조성은 질소 약 78.1 %, 산소 약 20.9 %, 아르곤 약 0.93 %, 이산화탄소 약 0.03~0.04 %이다. 산소 15.2 %나 아르곤 0.7 %, 이산화탄소 0.5 %는 실제 값과 맞지 않는다."},{"id":"47-1-28","r":47,"p":1,"n":28,"s":"환경위생학","q":"도시지역에서 광화학스모그 발생 시, 하루 중 정오를 지나 최대농도를 나타내는 대기오염물질은?","o":["오존","이산화황","이산화질소","일산화질소","일산화탄소"],"a":1,"e":"오존은 질소산화물과 탄화수소가 햇빛을 받아 광화학반응으로 생성되는 2차 오염물질이므로 일사량이 강한 정오 이후 오후에 최대농도를 보인다. 일산화질소는 출근 시간대 자동차 배출로 아침에 먼저 높아지고, 이산화질소는 그 뒤를 이어 오전에 정점을 보인다."},{"id":"47-1-29","r":47,"p":1,"n":29,"s":"환경위생학","q":"대류권에서 일반 대기 중 고도가 100 m 상승할 때의 평균 기온 변화로 옳은 것은?","o":["0.50 ℃ 증가","0.65 ℃ 감소","0.65 ℃ 증가","1.50 ℃ 감소","1.50 ℃ 증가"],"a":2,"e":"대류권에서는 고도가 높아질수록 기온이 낮아지며, 평균 기온감률은 100 m당 약 0.65 ℃ 감소이다. 건조단열감률(약 1 ℃/100 m)과 혼동하지 않도록 하고, 고도 상승 시 기온이 ‘증가’하는 보기는 기온역전 상황이라 일반적인 경우가 아니다."},{"id":"47-1-30","r":47,"p":1,"n":30,"s":"환경위생학","q":"지구에서 방출되는 장파장의 복사에너지로 지구 열수지(heat balance)에 관여하는 것은?","o":["감마선","자외선","적외선","엑스선","가시광선"],"a":3,"e":"지구는 태양에서 받은 에너지를 장파장의 적외선(지구복사)으로 방출하며, 온실가스가 이를 흡수해 지구 열수지에 관여한다. 가시광선과 자외선은 태양에서 들어오는 단파장 복사이므로 지구가 방출하는 장파 복사가 아니다."},{"id":"47-1-31","r":47,"p":1,"n":31,"s":"환경위생학","q":"인체에 유해한 자외선을 흡수하는 오존층이 있는 대기권역은?","o":["열권","외기권","중간권","성층권","대류권"],"a":4,"e":"오존층은 성층권(약 10~50 km, 특히 20~30 km 부근)에 있으며 인체에 유해한 자외선을 흡수한다. 대류권은 기상 현상이 일어나는 가장 아래층이고, 대류권의 오존은 오히려 광화학스모그 오염물질이다."},{"id":"47-1-32","r":47,"p":1,"n":32,"s":"환경위생학","q":"인체의 호흡작용 시 산소와 이산화탄소의 가스교환이 대부분 일어나는 부위는?","o":["인두","후두","폐포","기관지","세기관지"],"a":3,"e":"산소와 이산화탄소의 가스교환은 모세혈관이 둘러싼 폐포에서 대부분 일어난다. 기관지와 세기관지는 공기를 폐포까지 운반하는 통로(전도기도) 역할을 할 뿐 가스교환은 거의 하지 않는다."},{"id":"47-1-33","r":47,"p":1,"n":33,"s":"환경위생학","q":"산성비의 수소이온농도(pH) 기준은?","o":["5.6 이하","5.6 초과","6.5 이하","6.5 초과","7.0 이하"],"a":1,"e":"자연 상태 빗물도 대기 중 이산화탄소가 녹아 pH 약 5.6이 되므로 산성비는 pH 5.6 이하인 비를 기준으로 한다. 중성인 pH 7.0이나 6.5를 기준으로 생각하기 쉬우나 이는 이산화탄소 용해를 고려하지 않은 값이다."},{"id":"47-1-34","r":47,"p":1,"n":34,"s":"환경위생학","q":"많은 사람들이 모인 실내 공간에서 환기가 되지 않을 때 시간이 경과함에 따라 나타나는 현상으로 옳은 것은?","o":["CO₂ 증가, N₂ 감소","CO₂ 증가, N₂ 유지","CO₂ 감소, N₂ 증가","CO₂ 감소, N₂ 감소","CO₂ 유지, N₂ 유지"],"a":2,"e":"환기가 안 되는 밀폐 공간에서는 사람의 호흡으로 산소는 줄고 이산화탄소는 늘지만, 질소는 호흡에 관여하지 않는 불활성 기체라 농도가 거의 그대로 유지된다. 그래서 질소가 감소하거나 증가한다는 보기는 틀리다."},{"id":"47-1-35","r":47,"p":1,"n":35,"s":"환경위생학","q":"공기의 희석과 강우에 의한 세정으로 설명할 수 있는 자연 현상은?","o":["기온역전","동화작용","온실효과","열섬효과","자정작용"],"a":5,"e":"대기의 자정작용은 희석작용, 강우에 의한 세정작용, 산화작용, 자외선 살균작용, 식물의 탄소동화작용(이산화탄소·산소 교환) 등으로 이루어진다. 동화작용은 자정작용의 일부일 뿐이며 희석과 세정을 설명하는 개념은 아니다. 기온역전과 열섬효과는 오히려 오염을 악화시키는 현상이다."},{"id":"47-1-36","r":47,"p":1,"n":36,"s":"환경위생학","q":"불쾌지수 산출에 필요한 기후요소는?","o":["냉각열, 지적온도","등가온도, 냉각열","건구온도, 습구온도","감각온도, 건구온도","지적온도, 습구온도"],"a":3,"e":"불쾌지수는 건구온도와 습구온도로 산출하며, DI = (건구온도 + 습구온도)℃ × 0.72 + 40.6 으로 계산한다. 감각온도는 기온·기습·기류를 종합한 지표이고, 냉각열은 카타온도계로 구하는 지표이므로 불쾌지수 산출 요소가 아니다."},{"id":"47-1-37","r":47,"p":1,"n":37,"s":"환경위생학","q":"다음에서 설명하는 실내공기오염물질은?","o":["라돈","질소","황산화물","트리할로메탄","휘발성유기화합물"],"a":1,"b":"• 무색, 무취, 무미의 기체상 물질이다.\n• 공기보다 무거워 지하실 등에서 높은 농도를 나타낸다.\n• 자연방사선 물질로, 노출 시에 폐암을 유발할 수 있다.","e":"라돈은 토양·암석의 우라늄 붕괴로 생기는 무색·무취·무미의 자연방사성 기체로, 공기보다 무거워 지하실 등에 고농도로 쌓이고 장기 노출 시 폐암을 유발한다. 휘발성유기화합물은 대체로 냄새가 있고 방사성 물질이 아니며, 트리할로메탄은 수돗물 염소소독 부산물이다."},{"id":"47-1-38","r":47,"p":1,"n":38,"s":"환경위생학","q":"실내 공간에서 사람의 체온과 비슷한 100 ℉의 온도계 눈금이 95 ℉로 떨어지는 시간을 측정하여 산출할 수 있는 온열지수는?","o":["습구온도","감각온도","상대습도","불쾌지수","카타냉각력"],"a":5,"e":"카타온도계는 100 ℉에서 95 ℉로 떨어지는 데 걸리는 시간을 측정해 공기의 냉각력(카타냉각력)을 구하고, 이를 통해 미세한 기류(불감기류)를 측정한다. 감각온도는 기온·기습·기류를 종합한 체감지표이고, 불쾌지수는 건구·습구온도로 계산하므로 측정 원리가 다르다."},{"id":"47-1-39","r":47,"p":1,"n":39,"s":"환경위생학","q":"인체에서 체열발산 비율이 가장 큰 것은?","o":["날숨","들숨","소변 및 대변","폐포에서의 증발","피부에서의 복사와 전도"],"a":5,"e":"인체 체열발산은 피부를 통한 복사·전도·대류가 약 70 % 이상으로 가장 크고, 그다음이 피부의 수분 증발이다. 폐포에서의 증발이나 날숨의 가온은 몇 % 수준이며, 소변·대변으로 나가는 열은 가장 적다."},{"id":"47-1-40","r":47,"p":1,"n":40,"s":"환경위생학","q":"실내 공간에서 급성중독 시 중추신경계 증상이 나타날 수 있고, 만성중독 시에 백혈병을 일으키는 휘발성유기화합물은?","o":["메탄","벤젠","암모니아","프레온가스","이산화질소"],"a":2,"e":"벤젠은 급성 중독 시 두통·현기증 등 중추신경계 억제 증상을, 만성 중독 시 조혈기능 장애와 백혈병을 일으키는 대표적 휘발성유기화합물이다. 이산화질소와 암모니아는 주로 호흡기 자극 물질이며, 메탄은 독성이 낮은 온실가스이다."},{"id":"47-1-41","r":47,"p":1,"n":41,"s":"환경위생학","q":"자외선에 대한 설명으로 옳은 것은?","o":["열선으로 불린다.","전리방사선에 해당한다.","비타민D 생성에 관여한다.","파장이 가시광선보다 길다.","눈으로 볼 수 있는 전자기파이다."],"a":3,"e":"자외선(특히 280~320 nm의 도르노선)은 피부의 7-디하이드로콜레스테롤을 비타민 D로 전환시킨다. 열선으로 불리는 것은 적외선이고, 자외선은 가시광선보다 파장이 짧으며 눈에 보이지 않는 비전리방사선이다."},{"id":"47-1-42","r":47,"p":1,"n":42,"s":"환경위생학","q":"「실내공기질 관리법」상 실내공기질 유지기준이 다른 시설에 비해 더욱 엄격하게 적용되는 다중이용시설은?","o":["지하역사","어린이집","영화상영관","실내 주차장","실내 체육시설"],"a":2,"e":"실내공기질 관리법상 어린이집, 의료기관, 산후조리원, 노인요양시설, 실내 어린이놀이시설은 민감계층이 이용하므로 미세먼지·폼알데하이드·총부유세균 등의 유지기준이 더 엄격하게 적용된다. 지하역사·영화상영관 등은 일반 기준이 적용되고, 실내 주차장은 오히려 기준이 완화되어 있다."},{"id":"47-1-43","r":47,"p":1,"n":43,"s":"환경위생학","q":"실내공기 중 연소, 외부 유입 등으로 발생되는 입자상 물질로 호흡기질환, 심장질환, 조기사망을 초래하는 실내공기질 유지기준 항목은?","o":["이산화탄소","이산화질소","일산화탄소","미세먼지(PM-10)","총휘발성유기화합물"],"a":4,"e":"미세먼지(PM-10)는 연소나 외부 유입 등으로 생기는 입자상 물질로 호흡기·심장질환과 조기사망을 초래하며 실내공기질 유지기준 항목이다. 이산화탄소·이산화질소·일산화탄소·총휘발성유기화합물은 모두 가스상 물질이므로 ‘입자상 물질’에 해당하지 않는다."},{"id":"47-1-44","r":47,"p":1,"n":44,"s":"환경위생학","q":"물의 물리적 특성 중 어는점, 끓는점, 밀도(4 ℃)를 순서대로 바르게 나열한 것은?","o":["0 ℃, 100 ℃, 0.5 g/cm³","0 ℃, 100 ℃, 1.0 g/cm³","0 ℃, 100 ℃, 1.5 g/cm³","100 ℃, 0 ℃, 0.5 g/cm³","100 ℃, 0 ℃, 1.0 g/cm³"],"a":2,"e":"1기압에서 물의 어는점은 0 ℃, 끓는점은 100 ℃이며, 4 ℃에서 밀도가 가장 커 약 1.0 g/cm³이다. 어는점과 끓는점 순서가 뒤바뀐 보기나 밀도가 0.5·1.5 g/cm³인 보기는 틀리다."},{"id":"47-1-45","r":47,"p":1,"n":45,"s":"환경위생학","q":"「먹는물관리법」상 수돗물의 수질기준에서 건강상 유해영향 무기물질은?","o":["경도","페놀","수은","클로로포름","유리잔류염소"],"a":3,"e":"먹는물 수질기준에서 건강상 유해영향 무기물질에는 납, 불소, 비소, 셀레늄, 수은, 시안, 크롬, 카드뮴, 질산성질소 등이 있다. 페놀은 유해영향 유기물질, 클로로포름은 소독부산물, 유리잔류염소는 소독제 항목이며, 경도는 심미적 영향물질이다."},{"id":"47-1-46","r":47,"p":1,"n":46,"s":"환경위생학","q":"수인성 감염병에 해당하는 것은?","o":["홍역","백일해","디프테리아","파라티푸스","발진티푸스"],"a":4,"e":"파라티푸스는 장티푸스·콜레라·세균성이질·A형간염과 함께 오염된 물을 통해 전파되는 대표적 수인성 감염병이다. 홍역·백일해·디프테리아는 비말 등 호흡기로 전파되고, 발진티푸스는 이(louse)가 매개하는 감염병이다."},{"id":"47-1-47","r":47,"p":1,"n":47,"s":"환경위생학","q":"「환경정책기본법」상 하천의 수질환경기준에서 수질 등급이 ‘매우 좋음’일 때 생물화학적산소요구량(BOD) 기준은?","o":["1 mg/L 이하","3 mg/L 이하","5 mg/L 이하","10 mg/L 이하","15 mg/L 초과"],"a":1,"e":"환경정책기본법상 하천 수질환경기준에서 ‘매우 좋음(Ia)’ 등급의 BOD는 1 mg/L 이하이다. ‘약간 좋음’이 3 mg/L 이하, ‘보통’이 5 mg/L 이하, ‘나쁨’이 10 mg/L 이하이므로 다른 수치와 등급을 혼동하지 않도록 한다."},{"id":"47-1-48","r":47,"p":1,"n":48,"s":"환경위생학","q":"「먹는물관리법」상 수돗물의 수질기준 중 일반세균의 기준은?","o":["불검출","1 CFU/mL 이하","10 CFU/mL 이하","100 CFU/mL 이하","1,000 CFU/mL 이하"],"a":4,"e":"먹는물 수질기준에서 일반세균은 1 mL 중 100 CFU를 넘지 않아야 한다. 불검출 기준은 총대장균군(100 mL 중) 등 대장균 관련 항목에 적용되는 것이므로 일반세균과 혼동하지 않도록 한다."},{"id":"47-1-49","r":47,"p":1,"n":49,"s":"환경위생학","q":"특정오염물질의 생물농축 정도를 나타내는 농축계수 산정식으로 옳은 것은?","o":["생체 내 농도 + 환경수 중 농도","생체 내 농도 – 환경수 중 농도","환경수 중 농도 – 생체 내 농도","생체 내 농도 ÷ 환경수 중 농도","환경수 중 농도 ÷ 생체 내 농도"],"a":4,"e":"농축계수(생물농축계수)는 생물체 내 오염물질 농도를 그 생물이 사는 환경수 중 농도로 나눈 값으로, 값이 클수록 생체 내에 많이 축적됨을 뜻한다. 분모와 분자를 뒤집은 보기나 차이(뺄셈)로 구하는 보기는 농축 정도를 나타내지 못한다."},{"id":"47-1-50","r":47,"p":1,"n":50,"s":"환경위생학","q":"부영양화 발생의 원인물질은?","o":["질소, 인","불소, 벤젠","시안, 칼륨","칼슘, 염소","납, 나트륨"],"a":1,"e":"부영양화는 생활하수·비료 등으로 영양염류인 질소와 인이 수계에 과다 유입되어 조류가 급증하는 현상이다. 불소·벤젠·납 등은 독성 오염물질이지 조류의 영양원이 아니다."},{"id":"47-1-51","r":47,"p":1,"n":51,"s":"환경위생학","q":"수 처리 시 여과 공정의 주된 제거물질은?","o":["페놀","철이온","구리이온","부유물질","용해성 유기물"],"a":4,"e":"정수 처리에서 여과 공정은 응집·침전 후 남은 부유물질(탁도 유발 입자)과 일부 세균을 모래층 등에서 걸러 제거하는 과정이다. 페놀이나 용해성 유기물처럼 물에 녹아 있는 물질은 여과로 잘 제거되지 않아 활성탄 흡착 등이 필요하다."},{"id":"47-1-52","r":47,"p":1,"n":52,"s":"환경위생학","q":"먹는물에서 반상치를 유발하는 물질은?","o":["망간","불소","비소","수은","염소"],"a":2,"e":"먹는물 속 불소가 과다하면(기준 1.5 mg/L 초과) 치아에 반점이 생기는 반상치가 생기고, 부족하면 충치(우치)가 늘어난다. 비소는 피부 흑색증·피부암, 수은은 미나마타병의 원인 물질로 반상치와 관계가 없다."},{"id":"47-1-53","r":47,"p":1,"n":53,"s":"환경위생학","q":"「물환경보전법」상 폐수배출기준에서 방류수의 수소이온농도(pH) 허용 범위는?","o":["1.6 ~ 3.4","3.7 ~ 5.5","5.8 ~ 8.6","9.7 ~ 10.8","11.6 ~ 13.9"],"a":3,"e":"「물환경보전법」의 배출허용기준에서 수소이온농도(pH)는 지역 구분 없이 5.8~8.6으로 정해져 있다. 중성 부근(7)을 중심으로 한 범위이므로, 1.6~3.4나 11.6~13.9처럼 강산성·강알칼리성 범위는 방류할 수 없는 수준이다."},{"id":"47-1-54","r":47,"p":1,"n":54,"s":"환경위생학","q":"화학적 응집에서 콜로이드성 고형물의 크기는?","o":["0.001 μm ~ 0.1 μm","3.0 μm ~ 5.0 μm","6.0 μm ~ 10.0 μm","11.0 μm ~ 15.0 μm","20.0 μm 이상"],"a":1,"e":"콜로이드성 고형물은 약 0.001~0.1 μm(1~100 nm) 크기로, 표면 전하 때문에 서로 반발해 자연 침전되지 않으므로 응집제를 넣어 전하를 중화시켜 플록으로 만든 뒤 제거한다. 수 μm 이상인 입자는 현탁고형물로 보통침전이나 여과로 제거할 수 있어 콜로이드 범위가 아니다."},{"id":"47-1-55","r":47,"p":1,"n":55,"s":"환경위생학","q":"먹는물의 수질검사에서 과망간산칼륨(KMnO₄) 소비량이 많을 때 예상되는 수질의 상태는?","o":["높은 경도","착색 유발","높은 알칼리도","높은 용존산소","다량의 유기물 함유"],"a":5,"e":"과망간산칼륨 소비량은 물속 유기물이 KMnO₄에 의해 산화될 때 소비되는 양으로, 값이 크면 유기물(분뇨·하수 등)에 오염되었음을 뜻한다. 높은 경도는 칼슘·마그네슘 이온, 착색은 철·망간이나 부식질 때문이므로 KMnO₄ 소비량과 직접 관계가 없다."},{"id":"47-1-56","r":47,"p":1,"n":56,"s":"환경위생학","q":"비중이 물보다 작은 입자나, 겉보기 비중을 감소시켜야 하는 입자를 분리하는 폐수처리법은?","o":["부상법","중화법","흡착법","이온교환법","응집침전법"],"a":1,"e":"부상법은 미세한 공기방울을 입자에 부착시켜 겉보기 비중을 물보다 작게 만들어 수면으로 띄운 뒤 걷어내는 방법으로, 기름이나 비중이 작은 입자 분리에 쓰인다. 응집침전법은 플록을 만들어 가라앉히는 방법이고, 중화법은 pH를 조정하는 화학적 처리이다."},{"id":"47-1-57","r":47,"p":1,"n":57,"s":"환경위생학","q":"호기성 미생물을 이용한 하수의 생물학적 처리법은?","o":["막공법","중화법","흡착법","응집침전법","활성슬러지법"],"a":5,"e":"활성슬러지법은 폭기조에 산소를 불어넣어 호기성 미생물 덩어리(활성슬러지)가 하수 속 유기물을 분해하게 하는 대표적인 생물학적 처리법이다. 응집침전법·중화법·흡착법은 미생물을 쓰지 않는 물리·화학적 처리법이다."},{"id":"47-1-58","r":47,"p":1,"n":58,"s":"환경위생학","q":"슬러지의 혐기성 처리 시 중온 소화법의 온도와 기간은?","o":["10 ~ 15 ℃, 30일","15 ~ 25 ℃, 15일","30 ~ 35 ℃, 30일","50 ~ 55 ℃, 15일","50 ~ 55 ℃, 30일"],"a":3,"e":"슬러지 혐기성 소화에서 중온소화는 약 30~35 ℃에서 약 30일, 고온소화는 약 50~55 ℃에서 약 15일 정도 소화시킨다. 50~55 ℃는 고온소화 온도이므로 중온소화와 혼동하지 않아야 한다."},{"id":"47-1-59","r":47,"p":1,"n":59,"s":"환경위생학","q":"하수의 슬러지 처리 단계로 옳은 것은?","o":["탈수 – 농축조 – 소화조 – 운반","탈수 – 소화조 – 농축조 – 운반","농축조 – 소화조 – 탈수 – 운반","농축조 – 탈수 – 소화조 – 운반","소화조 – 탈수 – 농축조 – 운반"],"a":3,"e":"슬러지는 먼저 농축조에서 수분을 줄여 부피를 감소시키고, 소화조에서 유기물을 분해·안정화한 뒤, 탈수하여 운반·최종 처분한다. 탈수를 소화보다 먼저 하면 유기물이 안정화되지 않은 상태로 처리되므로 순서가 맞지 않다."},{"id":"47-1-60","r":47,"p":1,"n":60,"s":"환경위생학","q":"생활폐기물에 해당하는 것은?","o":["폐산","폐유","폐석면","음식폐기물","폐유기용제"],"a":4,"e":"생활폐기물은 사업장폐기물 외의 폐기물로, 가정 등에서 나오는 음식폐기물이 대표적이다. 폐산·폐유·폐유기용제·폐석면은 주변 환경을 오염시키거나 인체에 해를 줄 수 있는 지정폐기물(사업장폐기물)에 해당한다."},{"id":"47-1-61","r":47,"p":1,"n":61,"s":"환경위생학","q":"고형폐기물의 혐기성 소화에 대한 설명으로 옳은 것은?","o":["악취가스 발생이 없음","메탄이 유기산으로 전환됨","메탄생성균은 증식속도가 빠름","아미노산이 단백질로 가수분해됨","고농도의 유기성 폐기물 처리에 이용함"],"a":5,"e":"혐기성 소화는 산소 없이 미생물이 유기물을 분해해 메탄을 생성하는 방법으로, 고농도 유기성 폐기물 처리에 적합하고 메탄을 에너지로 회수할 수 있다. 황화수소 등 악취가스가 발생하며, 메탄생성균은 증식속도가 느리고, 유기산이 메탄으로 전환되는 것이지 그 반대가 아니다."},{"id":"47-1-62","r":47,"p":1,"n":62,"s":"환경위생학","q":"「폐기물관리법」상 지정폐기물 중 오니의 고형물 함량 기준은?","o":["1 % 이상","5 % 이상","10 % 이상","20 % 이상","30 % 이상"],"a":2,"e":"「폐기물관리법」상 지정폐기물인 오니류는 수분함량 95 % 미만 또는 고형물함량 5 % 이상인 것으로 한정된다. 고형물함량 기준(5 % 이상)과 수분함량 기준(95 % 미만)이 같은 의미이므로 함께 기억하면 헷갈리지 않는다."},{"id":"47-1-63","r":47,"p":1,"n":63,"s":"환경위생학","q":"「폐기물관리법」상 위생매립에서 식생대층의 최종 복토 두께는?","o":["5 cm 이상","10 cm 이상","30 cm 이상","40 cm 이상","60 cm 이상"],"a":5,"e":"위생매립 최종복토층 중 식물이 자랄 수 있도록 맨 위에 두는 식생대층은 60 cm 이상으로 한다. 가스배제층·배수층(30 cm 이상)이나 일일복토(15 cm 이상)·중간복토(30 cm 이상) 두께와 혼동하기 쉽다."},{"id":"47-1-64","r":47,"p":1,"n":64,"s":"환경위생학","q":"의료폐기물 처리법으로 옳은 것은?","o":["재사용","소각","해양투기","가축사료","퇴비화"],"a":2,"e":"의료폐기물은 감염 위험이 있으므로 원칙적으로 소각(또는 멸균분쇄)하여 처분한다. 재사용·해양투기·가축사료·퇴비화는 병원체 확산 위험이 있어 허용되지 않는다."},{"id":"47-1-65","r":47,"p":1,"n":65,"s":"환경위생학","q":"의료폐기물 수집·운반차량의 차체 색상은?","o":["녹색","흰색","검은색","노란색","붉은색"],"a":2,"e":"「폐기물관리법」 시행규칙에서 의료폐기물 수집·운반 차량의 차체는 흰색으로 칠하도록 규정하고 있다. 붉은색·노란색·검은색은 의료폐기물 전용용기에 표시하는 도형 색상(격리·위해·일반 의료폐기물 구분)과 혼동하기 쉬운 오답이다."},{"id":"47-1-66","r":47,"p":1,"n":66,"s":"환경위생학","q":"작업환경 중 화학적 유해요인에 해당하는 것은?","o":["기온","조명","복사열","유기용제","전리방사선"],"a":4,"e":"유기용제는 흡입·피부 흡수로 중독을 일으키는 화학적 유해요인이다. 기온·조명·복사열·전리방사선은 모두 물리적 유해요인에 해당한다."},{"id":"47-1-67","r":47,"p":1,"n":67,"s":"환경위생학","q":"전리방사선에 해당하는 것은?","o":["알파선","자외선","적외선","가시광선","마이크로파"],"a":1,"e":"전리방사선은 물질을 이온화시킬 수 있는 높은 에너지의 방사선으로 알파선·베타선·감마선·X선·중성자선이 해당한다. 자외선·적외선·가시광선·마이크로파는 이온화 능력이 없는 비전리방사선이다."},{"id":"47-1-68","r":47,"p":1,"n":68,"s":"환경위생학","q":"조사 대상 기간 동안, 평균 실근로자 수 1,000명당 발생한 재해건수를 의미하는 재해지표는?","o":["강도율","건수율","도수율","재해일수율","평균손실일수"],"a":2,"e":"건수율은 평균 실근로자 1,000명당 재해건수(재해건수 ÷ 평균 실근로자 수 × 1,000)로 산출한다. 도수율은 연근로시간 100만 시간당 재해건수, 강도율은 연근로시간 1,000시간당 근로손실일수이므로 기준이 다르다."},{"id":"47-1-69","r":47,"p":1,"n":69,"s":"환경위생학","q":"습열멸균법에 해당하는 것은?","o":["세균여과법","방사선멸균법","자외선멸균법","초음파멸균법","고압증기멸균법"],"a":5,"e":"고압증기멸균법은 고압솥(오토클레이브)에서 약 121 ℃의 포화수증기로 15~20분간 처리하는 습열멸균법으로, 아포까지 사멸시킨다. 자외선·방사선·초음파·세균여과는 열을 이용하지 않는 멸균법이다."},{"id":"47-1-70","r":47,"p":1,"n":70,"s":"환경위생학","q":"과산화수소(H₂O₂)의 살균기전은?","o":["산화작용","여과작용","침강작용","핵산에 작용","중금속염의 형성"],"a":1,"e":"과산화수소는 분해될 때 생기는 발생기 산소의 강한 산화작용으로 미생물을 죽이며, 3 % 용액이 상처 소독에 쓰인다. 핵산에 작용하는 것은 자외선의 살균기전이고, 중금속염 형성은 승홍 같은 중금속 화합물의 기전이다."},{"id":"47-1-71","r":47,"p":1,"n":71,"s":"환경위생학","q":"다음에서 설명하는 소독제는?","o":["승홍","생석회","크레졸","계면활성제","에틸렌옥사이드"],"a":5,"b":"• 물에 쉽게 용해되는 물질로서 기체 상태로 소독할 수 있다.\n• 균체 단백질이나 핵산을 알킬화함으로써 강한 살균력을 지닌다.\n• 실험기자재, 서적, 각종 플라스틱 등 열이나 습기에 약한 것들을 소독할 수 있다.","e":"에틸렌옥사이드(EO)는 기체 상태로 단백질·핵산을 알킬화하여 살균하므로, 열이나 습기에 약한 플라스틱·실험기구·서적 등의 저온 가스멸균에 쓰인다. 크레졸은 단백질 응고 작용의 액체 소독제이고, 생석회는 분변·화장실 소독에 쓰여 기체 소독과는 거리가 멀다."},{"id":"47-1-72","r":47,"p":1,"n":72,"s":"환경위생학","q":"무균실, 수술실, 제약실 등을 대상으로 사용되는 소독방법은?","o":["건열멸균법","자비멸균법","저온멸균법","자외선멸균법","초음파멸균법"],"a":4,"e":"자외선멸균법은 약 260 nm 부근(2,500~2,800 Å) 파장의 살균력을 이용하며, 투과력은 약하지만 공기와 표면을 소독할 수 있어 무균실·수술실·제약실에 사용된다. 건열멸균법은 유리기구 등 고온에 견디는 물품, 자비멸균법은 끓는 물에 담글 수 있는 식기·기구에 사용한다."},{"id":"47-1-73","r":47,"p":1,"n":73,"s":"환경위생학","q":"보건학적으로 주택의 적정한 실내 습도는?","o":["10 % 이하","20 % ~ 30 %","40 % ~ 70 %","80 % ~ 90 %","90 % 이상"],"a":3,"e":"보건학적으로 쾌적한 실내 습도는 40~70 % 범위이다. 습도가 너무 낮으면 호흡기 점막이 건조해지고, 80 % 이상으로 높으면 곰팡이·진드기 번식과 불쾌감이 증가한다."},{"id":"47-1-74","r":47,"p":1,"n":74,"s":"환경위생학","q":"자극성의 냄새가 있는 무색의 기체로 건축자재 및 단열재에서 발생하는 실내공기오염물질은?","o":["수소(H₂)","메탄(CH₄)","이산화탄소(CO₂)","일산화탄소(CO)","포름알데히드(HCHO)"],"a":5,"e":"포름알데히드는 자극성 냄새가 나는 무색 기체로, 단열재·합판·접착제 등 건축자재에서 방출되어 새집증후군의 주요 원인이 된다. 일산화탄소와 이산화탄소는 무색·무취여서 자극성 냄새가 있다는 설명과 맞지 않다."},{"id":"47-1-75","r":47,"p":1,"n":75,"s":"환경위생학","q":"실내와 실외의 온도차가 있을 때 공기의 밀도차로 인해 발생하는 환기는?","o":["국소 환기","기계 환기","송기 환기","중력 환기","흡입 환기"],"a":4,"e":"중력환기는 실내외 온도차로 생기는 공기 밀도차(따뜻한 공기는 위로, 찬 공기는 아래로)에 의해 일어나는 자연환기로, 온도차가 클수록 환기량이 많아진다. 기계환기는 송풍기·배풍기 등 동력을 이용하는 방식이므로 밀도차에 의한 환기와 다르다."},{"id":"47-1-76","r":47,"p":1,"n":76,"s":"위생곤충학","q":"거미강(Arachnida)에 속하는 위생곤충은?","o":["전갈","독나방","바퀴","모기","딸집파리"],"a":1,"e":"거미강은 몸이 두흉부와 복부 2부분이고 다리가 4쌍이며 더듬이·날개가 없는 무리로, 전갈·거미·진드기가 속한다. 독나방·바퀴·모기 등은 몸이 머리·가슴·배 3부분이고 다리 3쌍인 곤충강이다."},{"id":"47-1-77","r":47,"p":1,"n":77,"s":"위생곤충학","q":"파리의 다리에서 조간반(empodium)이 있는 곳은?","o":["기절","부절","경절","전절","퇴절"],"a":2,"e":"파리 다리의 끝마디인 부절(발목마디) 끝에는 발톱 1쌍, 욕반 1쌍과 그 사이의 조간반이 있다. 퇴절(넓적다리마디)·경절(종아리마디)은 다리 중간 마디로, 부착 구조가 없다."},{"id":"47-1-78","r":47,"p":1,"n":78,"s":"위생곤충학","q":"생활사에서 불완전변태를 하는 위생곤충은?","o":["나방","모기","바퀴","벼룩","집파리"],"a":3,"e":"바퀴는 알 – 약충 – 성충으로 번데기 단계가 없는 불완전변태를 한다. 모기·벼룩·집파리·나방은 알 – 유충 – 번데기 – 성충을 거치는 완전변태 곤충이다."},{"id":"47-1-79","r":47,"p":1,"n":79,"s":"위생곤충학","q":"위생곤충에 의한 직접적 가해에 속하는 것은?","o":["모기에 의한 사상충","파리에 의한 수면병","진드기가 전파하는 쯔쯔가무시증","말벌의 독성물질에 의한 알레르기성 질환","집파리 몸에 묻은 오염물질에 의한 식중독"],"a":4,"e":"직접적 가해는 흡혈·자상·독성물질 주입·알레르기·기생처럼 곤충이 사람에게 직접 피해를 주는 것으로, 말벌 독에 의한 알레르기가 이에 해당한다. 사상충·수면병·쯔쯔가무시증은 병원체를 생물학적으로 전파하는 것이고, 집파리 몸에 묻은 오염물질에 의한 식중독은 기계적 전파로, 모두 간접적 가해(질병 매개)이다."},{"id":"47-1-80","r":47,"p":1,"n":80,"s":"위생곤충학","q":"인체의 상처 부위에 파리가 알을 낳아서 발생하는 증상은?","o":["구더기증","간흡충증","사상충증","브루셀라증","로아사상충증"],"a":1,"e":"구더기증(승저증)은 파리가 상처·코·귀 등에 알을 낳아 부화한 유충(구더기)이 인체 조직에 기생하는 질환이다. 간흡충증은 민물고기 생식, 사상충증은 모기 매개로 생기는 질환이어서 파리 산란과 무관하다."},{"id":"47-1-81","r":47,"p":1,"n":81,"s":"위생곤충학","q":"질병명 – 병원체 – 매개종이 바르게 묶인 것은?","o":["흑사병 – 세균 – 모기","사상충증 – 선충 – 깔따구","뎅기열 – 바이러스 – 벼룩","쯔쯔가무시증 – 세균 – 등에","라임병 – 스피로헤타 – 참진드기"],"a":5,"e":"라임병은 스피로헤타인 보렐리아균이 원인이며 참진드기(Ixodes 속 등)가 매개한다. 흑사병은 벼룩이, 뎅기열은 숲모기가 매개하고, 쯔쯔가무시증은 리케치아(오리엔티아)를 털진드기 유충이 매개하므로 짝이 맞지 않다."},{"id":"47-1-82","r":47,"p":1,"n":82,"s":"위생곤충학","q":"질병을 매개하는 위생곤충에 대한 화학적 방제법은?","o":["천적 방사","트랩 이용","살충제 살포","방충망 설치","유문등 설치"],"a":3,"e":"살충제를 살포하는 것은 약제를 이용한 화학적 방제이다. 트랩·방충망·유문등 설치는 물리적 방제, 천적 방사는 생물학적 방제에 해당한다."},{"id":"47-1-83","r":47,"p":1,"n":83,"s":"위생곤충학","q":"밀폐된 장소에서 가스 또는 증기 상태의 살충제로 위생곤충을 구제하는 방법은?","o":["훈증법","미스트법","에어로졸법","잔류분무법","극미량연무법"],"a":1,"e":"훈증법은 밀폐된 공간에 가스나 증기 상태의 살충제(훈증제)를 채워 틈새의 해충까지 구제하는 방법이다. 에어로졸법·극미량연무법·미스트법은 미세한 액체 입자를 공간에 뿌리는 공간살포이고, 잔류분무법은 표면에 약제를 남기는 방법이다."},{"id":"47-1-84","r":47,"p":1,"n":84,"s":"위생곤충학","q":"살충제의 독성평가 방법 중, 50 % 시험곤충의 비상능력이나 보행능력의 소실 시간을 나타내는 것은?","o":["LC₅₀","KT₅₀","FO₅₀","TLm","LD₅₀"],"a":2,"e":"KT₅₀(Knockdown Time 50)은 시험곤충의 50 %가 비상·보행능력을 잃고 쓰러지는(녹다운) 데 걸리는 시간으로, 살충제의 속효성을 평가한다. LC₅₀은 50 % 치사농도, LD₅₀은 50 % 치사량으로 '죽음'을 기준으로 하므로 녹다운 시간과 다르다."},{"id":"47-1-85","r":47,"p":1,"n":85,"s":"위생곤충학","q":"유기인계 살충제 중독 증상이 나타난 방역 종사자에게 투여해야 할 약제는?","o":["페니실린","아트로핀","아세틸살리실산","아세트아미노펜","인산오셀타미비르"],"a":2,"e":"유기인계 살충제는 콜린에스테라아제를 억제해 아세틸콜린이 축적되게 하므로, 무스카린 수용체를 차단하는 아트로핀(필요 시 PAM 병용)을 해독제로 투여한다. 아세틸살리실산·아세트아미노펜은 해열진통제, 인산오셀타미비르는 인플루엔자 치료제로 해독 작용이 없다."},{"id":"47-1-86","r":47,"p":1,"n":86,"s":"위생곤충학","q":"에어로졸로 분사되는 살충제 입자 크기로 옳은 것은?","o":["30 μm 이하","40 μm 이하","50 μm 이하","60 μm 이하","70 μm 이하"],"a":1,"e":"에어로졸은 입자 크기가 약 30 μm 이하로 매우 작아 공중에 오래 떠 있으면서 비행 중인 곤충에 접촉하는 공간살포 방법이다. 미스트는 약 50~100 μm, 잔류분무는 100~400 μm로 입자가 더 크다. ※ 교재 확인 권장(교재마다 에어로졸 입자 범위 표기가 다를 수 있음)"},{"id":"47-1-87","r":47,"p":1,"n":87,"s":"위생곤충학","q":"살충제 희석액을 100 ~ 400 μm로 분사하는 위생곤충 방제는?","o":["미스트","가열연무","에어로졸","잔류분무","극미량연무"],"a":4,"e":"잔류분무는 100~400 μm의 비교적 큰 입자를 벽면 등 곤충의 휴식처에 뿌려 약제가 오래 남아 접촉한 곤충을 죽이게 하는 방법이다. 극미량연무는 약 5~50 μm, 미스트는 약 50~100 μm의 작은 입자로 공간에 떠다니게 하는 공간살포이다."},{"id":"47-1-88","r":47,"p":1,"n":88,"s":"위생곤충학","q":"살충력은 강하나 물리·화학적으로 안정되어 잘 분해되지 않기 때문에 토양과 수질에 대한 오염도가 높은 살충제는?","o":["미생물제","유기인계","유기염소계","카바메이트계","피레스로이드계"],"a":3,"e":"유기염소계(DDT, BHC, 디엘드린 등)는 살충력이 강하고 화학적으로 매우 안정해 잘 분해되지 않으므로 토양·수질 잔류와 생물농축 문제가 크다. 유기인계와 카바메이트계는 환경에서 비교적 빨리 분해되고, 피레스로이드계는 속효성이며 포유류 독성이 낮다."},{"id":"47-1-89","r":47,"p":1,"n":89,"s":"위생곤충학","q":"강한 마늘 냄새가 나고 가주성 쥐 방제에 효과적인 급성 살서제는?","o":["레드스킬(red squil)","시라트레인(silatrane)","인화아연(zinc phosphide)","아비산(arsenious oxide)","황산탈륨(thallium sulfate)"],"a":3,"e":"인화아연은 강한 마늘 냄새가 나는 급성 살서제로, 위산과 반응해 독성 가스(포스핀)를 발생시키며 집 안팎에 사는 가주성 쥐 방제에 널리 쓰인다. 아비산·황산탈륨은 무미·무취에 가까운 급성 살서제여서 마늘 냄새라는 특징과 맞지 않다."},{"id":"47-1-90","r":47,"p":1,"n":90,"s":"위생곤충학","q":"바퀴 방제를 위하여 블록벽, 콘크리트벽, 페인트를 칠하지 않은 판자 등에 잔류분무를 하는 제제는?","o":["용제","유제","입제","증강제","수화제"],"a":5,"e":"수화제는 물에 희석하면 현탁액이 되며, 블록벽·콘크리트·도장하지 않은 판자처럼 흡수성이 큰 표면에 뿌려도 입자가 표면에 남아 잔효성이 좋다. 유제는 흡수성 표면에 스며들어 효과가 떨어지므로 페인트칠한 비흡수성 표면에 적합하고, 입제는 주로 유충 서식처에 뿌린다."},{"id":"47-1-91","r":47,"p":1,"n":91,"s":"위생곤충학","q":"모기가 매개하는 질병은?","o":["발진열","샤가스병","에볼라열","발진티푸스","치쿤쿠니야열"],"a":5,"e":"치쿤구니야열은 이집트숲모기·흰줄숲모기가 매개하는 바이러스성 질환이다. 발진열은 쥐벼룩, 발진티푸스는 몸이, 샤가스병은 트리아토민노린재가 매개하며, 에볼라열은 환자 체액 접촉으로 전파된다."},{"id":"47-1-92","r":47,"p":1,"n":92,"s":"위생곤충학","q":"연못에 서식하는 모기 유충의 방제법으로 옳은 것은?","o":["잔류분무를 한다.","살문등을 가동한다.","미꾸라지를 방사한다.","효력증강제를 뿌린다.","이산화탄소 발생기를 가동한다."],"a":3,"e":"미꾸라지·송사리 같은 천적 어류를 연못에 방사하여 모기 유충을 잡아먹게 하는 것은 환경 피해가 적은 생물학적 방제이다. 살문등이나 이산화탄소 발생기는 성충을 유인하는 방법이고, 잔류분무는 성충 휴식처에 쓰는 방법이어서 연못 속 유충에는 맞지 않다."},{"id":"47-1-93","r":47,"p":1,"n":93,"s":"위생곤충학","q":"말라리아 환자를 격리하여 치료할 때 필요한 물리적 방법은?","o":["모기장을 설치한다.","에어로졸을 분사한다.","불임수컷 모기를 방사한다.","속효성 살충제를 분사한다.","벽면에 잔류성이 긴 살충제를 잔류분무한다."],"a":1,"e":"말라리아 환자를 모기장 안에서 치료하면 모기가 환자를 흡혈해 원충을 옮기는 것을 물리적으로 차단할 수 있다. 에어로졸·살충제 분사는 화학적 방법, 불임수컷 방사는 유전적(생물학적) 방법이어서 '물리적 방법'에 해당하지 않는다."},{"id":"47-1-94","r":47,"p":1,"n":94,"s":"위생곤충학","q":"모체의 자궁에서 한 개의 알이 부화하여 3령기 유충 상태에서 자궁 밖으로 나오는 파리는?","o":["금파리","집파리","침파리","검정파리","체체파리"],"a":5,"e":"체체파리는 자궁 안에서 알 1개가 부화하고, 유충이 자궁샘 분비물을 먹으며 3령기까지 자란 뒤 밖으로 나와 곧 번데기가 되는 태생(유생생식)을 하며, 아프리카 수면병을 매개한다. 집파리·금파리·검정파리는 알을 낳는 난생 파리이다."},{"id":"47-1-95","r":47,"p":1,"n":95,"s":"위생곤충학","q":"잔류분무 방제효과를 상승시키는 파리의 습성은?","o":["다리 비비기","공중에서 날갯짓하기","평균곤으로 균형 유지하기","욕반을 허공쪽으로 유지하기","허공으로 내미는 전구치로 먹이 긁기"],"a":1,"e":"파리는 앉아 있을 때 다리를 서로 비비는 습성이 있어, 잔류분무 면에 앉았을 때 다리에 묻은 살충제가 몸의 다른 부위로 퍼지고 입으로도 들어가 방제효과가 높아진다. 날갯짓이나 평균곤으로 균형을 잡는 것은 비행 관련 습성이라 약제 표면과의 접촉과 관계가 적다. ※ 교재 확인 권장"},{"id":"47-1-96","r":47,"p":1,"n":96,"s":"위생곤충학","q":"모래파리의 흡혈에 의해 발생되는 질병은?","o":["뎅기열","말라리아","샤가스병","파파타시열","회선사상충증"],"a":4,"e":"파파타시열(모래파리열)은 모래파리(Phlebotomus) 흡혈로 전파되는 바이러스성 질환이며, 모래파리는 리슈마니아증도 매개한다. 뎅기열은 숲모기, 말라리아는 얼룩날개모기, 샤가스병은 트리아토민노린재, 회선사상충증은 먹파리가 매개한다."},{"id":"47-1-97","r":47,"p":1,"n":97,"s":"위생곤충학","q":"수입농수산물 검역단계에서 해충을 구제하는 방법으로 옳은 것은?","o":["기피제 사용","방사선 조사","불임제 사용","유인제 사용","발육억제제 사용"],"a":2,"e":"수입농수산물 검역 단계에서는 감마선 등 방사선을 조사해 화물 속 해충을 죽이거나 번식하지 못하게 하는 방법이 쓰인다. 기피제·유인제·불임제·발육억제제는 야외에서 해충 개체군을 관리하는 방법이어서 검역 화물의 해충을 즉시 구제하는 데는 적합하지 않다."},{"id":"47-1-98","r":47,"p":1,"n":98,"s":"위생곤충학","q":"몸이(body louse)의 습성에 대한 설명으로 옳은 것은?","o":["암컷만 흡혈한다.","음부털에 기생한다.","머리카락에 기생한다.","숙주 체온이 3 ~ 4 ℃ 상승하면 숙주로부터 떨어진다.","성충의 수명이 20일이며 최적 온도는 25 ℃ 이하이다."],"a":4,"e":"몸이는 숙주가 열이 나 체온이 오르거나 사망해 체온이 떨어지면 숙주를 떠나 다른 사람에게 옮겨 가며, 이 습성 때문에 발진티푸스 등을 전파한다. 이는 암수 모두 흡혈하며, 음부털에 기생하는 것은 사면발니, 머리카락에 기생하는 것은 머릿니이다."},{"id":"47-1-99","r":47,"p":1,"n":99,"s":"위생곤충학","q":"베레제기관(Berlese organ)을 지닌 위생곤충은?","o":["바퀴","벼룩","빈대","진드기","트리아토민노린재"],"a":3,"e":"베레제기관(Berlese organ)은 빈대 암컷의 복부 배판에 있는 교미 관련 기관으로, 수컷이 생식기로 암컷의 체벽을 뚫어 정자를 넣는 외상성 교미와 관련이 있다. 바퀴·벼룩·진드기에는 이런 기관이 없으므로 빈대를 구별하는 특징으로 기억한다."},{"id":"47-1-100","r":47,"p":1,"n":100,"s":"위생곤충학","q":"흑사병이 유행할 때에 벼룩을 구제하기 위해 쥐구멍에 살포하는 잔효성 살충 제제는?","o":["분제","용제","유제","수화제","증량제"],"a":1,"e":"분제는 가루 형태의 살충제로 물 없이 쥐구멍이나 쥐 통로에 직접 뿌릴 수 있고 잔효성이 있어, 흑사병 유행 시 쥐벼룩 구제에 사용된다. 증량제는 약제를 희석하는 보조제이고, 유제·수화제는 물에 희석해 분무하는 제제여서 좁은 쥐구멍 처리에는 적합하지 않다."},{"id":"47-1-101","r":47,"p":1,"n":101,"s":"위생곤충학","q":"독나방의 독모가 피부에 묻었을 때 응급처치 방법은?","o":["햇빛에 말린다.","맨손으로 털어낸다.","마른 휴지로 닦는다.","젖은 수건으로 닦는다.","세게 흐르는 물로 씻는다."],"a":5,"e":"독나방의 독모는 피부를 문지르면 더 깊이 박히고 퍼지므로, 문지르지 말고 흐르는 물로 씻어내는 것이 응급처치이다. 맨손으로 털거나 휴지·수건으로 닦으면 독모가 피부에 눌려 박혀 증상이 심해진다."},{"id":"47-1-102","r":47,"p":1,"n":102,"s":"위생곤충학","q":"벌목(Hymenoptera)의 설명으로 옳은 것은?","o":["불완전변태를 한다.","말벌과(Vespidae) 집단은 다년간 유지된다.","미수정란은 암컷이 되며 이중 여왕벌이 된다.","집단사회를 구성하는 벌의 절대 다수는 일벌이다.","벌독침에 쏘였을 때 독성작용의 강도는 ‘꿀벌 – 호박벌 – 말벌’ 순으로 높다."],"a":4,"e":"벌은 여왕벌·수벌·일벌로 이루어진 사회성 곤충이며, 집단의 절대 다수는 일벌이다. 벌은 번데기 시기가 있는 완전변태를 하고, 미수정란은 수컷(수벌)이 되며 수정란이 암컷(일벌·여왕벌)이 된다."},{"id":"47-1-103","r":47,"p":1,"n":103,"s":"위생곤충학","q":"중증열성혈소판감소증후군(SFTS)을 매개하는 위생곤충은?","o":["물렁진드기(Argas boueti)","옴진드기(Sarcoptes scabiei)","새진드기(Dermanyssus gallinae)","작은소피참진드기(Haemaphysalis longicornis)","큰다리먼지진드기(Dermatophagoides farinae)"],"a":4,"e":"중증열성혈소판감소증후군(SFTS)은 SFTS 바이러스를 가진 작은소피참진드기에게 물려 감염된다. 옴진드기는 피부에 굴을 파 옴을 일으키고, 큰다리먼지진드기는 집먼지진드기로 알레르기의 원인이 되며 SFTS를 매개하지 않는다."},{"id":"47-1-104","r":47,"p":1,"n":104,"s":"위생곤충학","q":"풀베기하는 사람에게 쯔쯔가무시증이 전파되는 것을 예방하기 위한 방법은?","o":["슬리퍼를 신는다.","짧은 바지를 입는다.","짧은 자루의 낫을 이용한다.","작업복에 기피제 처리를 한다.","잔디에 앉아서 휴식을 취한다."],"a":4,"e":"쯔쯔가무시증은 풀숲의 털진드기 유충이 사람을 물어 전파되므로, 작업복에 기피제를 처리하고 긴 옷·장화를 착용하는 것이 예방법이다. 짧은 바지나 슬리퍼, 잔디에 앉아 쉬는 행동은 피부 노출과 털진드기 접촉을 늘려 오히려 위험하다."},{"id":"47-1-105","r":47,"p":1,"n":105,"s":"위생곤충학","q":"쥐가 매개하는 질병은?","o":["성병","참호열","한센병","웨스트나일열","렙토스피라증"],"a":5,"e":"렙토스피라증은 감염된 쥐의 오줌으로 배출된 렙토스피라균이 물·흙을 통해 피부 상처나 점막으로 들어와 감염되며, 추수기 농부에게 많다. 참호열은 몸이, 웨스트나일열은 모기가 매개하고, 한센병은 사람 간 접촉으로 전파된다."}];

function pool(){return QS.filter(q=>(subj==='all'||q.s===subj)&&(round==='all'||q.r===+round))}
function makeSet(){
  let P=pool();
  if(mode==='wrong'){P=P.filter(q=>ST[q.id]&&ST[q.id].w>0).sort((a,b)=>(ST[b.id].w-ST[b.id].c*.5)-(ST[a.id].w-ST[a.id].c*.5));P=P.slice(0,Math.max(size,P.length));P=shuf(P.slice(0,size*3)).slice(0,size)}

let shown=20;
function scoreLine(){

function photoBlock(q,reveal){

  const items=[];q.ph.forEach(k=>{const p=PH[k];if(!p||(p.rv&&!reveal))return;if(p.svg)items.push({svg:p.svg,l:p.l,sol:p.rv?1:0});else p.i.forEach(i=>items.push({u:i[0],pg:i[1],lic:i[2],au:i[3],l:p.l}))});

}
