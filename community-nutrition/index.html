<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="지역사회영양학 2~6주차 변형문제·이론 정리">
<title>중간고사 문제 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 시험지처럼 한 열로 읽히는 문항 — 테두리·강조선 없이 여백과 회색 바탕으로만 구분, 채점은 파란펜(정답)·빨간펜(오답) */
:root{
  --bg:#ffffff; --soft:#f3f3f1; --soft2:#e9e9e6; --ink:#1e1e1e; --muted:#6e6e6a;
  --ok:#2456a4; --ok-bg:#eaf0f8; --bad:#cf3a2f; --bad-bg:#fbeeec;
  --f-display:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-inline:16px;padding-block:0 56px}
.wrap{max-width:760px;margin:0 auto}
header.top{padding-block:32px 8px}
h1{font-family:var(--f-display);font-weight:700;font-size:1.8rem;margin:0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:6px 0 0;font-size:.88rem;max-width:62ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 12px -12px rgba(0,0,0,.25)}
.bar{will-change:transform}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font:inherit;font-size:.85rem;border:0;background:var(--soft);color:var(--ink);padding:5px 11px;border-radius:4px;cursor:pointer}
.tab:hover{background:var(--soft2)}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
#subj .tab{font-weight:700;font-size:.95rem;padding:6px 14px}
#subj{padding-bottom:6px;border-bottom:1px solid var(--soft2)}
#modes .tab{font-weight:600;font-size:.9rem}
#kinds .tab,#tabs .tab{font-size:.8rem;padding:3px 9px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.85rem}
.tools button{font:inherit;font-size:.8rem;border:0;background:transparent;color:var(--muted);padding:4px 8px;border-radius:4px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--soft2)}
.tools button:hover{color:var(--ink)}
.tools button[aria-pressed="true"]{color:var(--bad);text-decoration-color:var(--bad)}
.tools button.primary{background:var(--ink);color:var(--bg);text-decoration:none;padding:5px 12px}
.score{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.score b{color:var(--ink)}
.airow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topic{font-family:var(--f-display);font-size:1.25rem;margin:36px 0 2px;color:var(--ink)}
.topic small{font-family:var(--f-body);font-size:.78rem;color:var(--muted);margin-left:8px;font-weight:400}
.q{padding-block:20px 4px}
.qhead{display:flex;gap:10px;align-items:baseline}
.num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);flex:none;font-size:.9rem}
.q.done-ok .num{color:var(--ok)} .q.done-bad .num{color:var(--bad)}
.sub-num{font-style:normal}
.stem{font-family:var(--f-display);font-size:1.05rem;min-width:0}
.case{display:block;background:var(--soft);border-radius:4px;padding:10px 12px;margin-top:8px;font-family:var(--f-body);font-size:.92rem;white-space:pre-line}
.aitag{display:block;width:fit-content;margin-top:6px;font-family:var(--f-body);font-size:.72rem;color:var(--muted)}
.opts{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-direction:column;gap:2px}
.opt{width:100%;text-align:left;font:inherit;font-size:.93rem;background:transparent;color:var(--ink);border:0;border-radius:4px;padding:7px 10px;cursor:pointer;display:flex;gap:8px}
.opt:hover:not(:disabled){background:var(--soft)}
.opt:disabled{cursor:default;color:var(--muted)}
.opt.right{background:var(--ok-bg);color:var(--ok);font-weight:600}
.opt.wrong{background:var(--bad-bg);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.opts.oxrow{flex-direction:row;gap:8px}
.opts.oxrow li{flex:1}
.opt.oxb{background:var(--soft);justify-content:center;font-size:1.3rem;font-weight:700;padding:10px}
.mk{flex:none;width:1.2em;color:inherit;opacity:.7}
.opt:focus-visible,.tab:focus-visible,.tools button:focus-visible,.btn:focus-visible,.ans:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.exp{margin-top:10px;font-size:.88rem;color:var(--ink);background:var(--soft);border-radius:4px;padding:10px 12px;white-space:pre-line}
.exp b{margin-right:6px}
.exp b.okt{color:var(--ok)} .exp b.badt{color:var(--bad)}
.kind{margin:10px 0 6px;font-size:.78rem;color:var(--muted)}
.ans{width:100%;font:inherit;font-size:.93rem;color:var(--ink);background:var(--soft);border:0;border-radius:4px;padding:9px 11px}
textarea.ans{min-height:100px;resize:vertical}
.srow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.btn{font:inherit;font-size:.84rem;border:0;background:var(--soft);color:var(--ink);padding:5px 12px;border-radius:4px;cursor:pointer}
.btn:hover{background:var(--soft2)}
.btn.on{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.5;cursor:wait}
.hint{font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:48px 0}
.theory h3{font-family:var(--f-display);font-size:1.08rem;margin:28px 0 8px}
.theory p{margin:0 0 10px;max-width:65ch}
.tw{overflow-x:auto;margin:8px 0}
.tw table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
.tw th,.tw td{text-align:left;vertical-align:top;padding:8px 10px}
.tw thead th{font-size:.78rem;color:var(--muted);font-weight:600;padding-bottom:4px}
.tw tbody tr:nth-child(odd){background:var(--soft)}
.tw tbody th{font-weight:600;white-space:nowrap}
.tbox{margin:8px 0;padding:10px 12px;background:var(--soft);border-radius:4px;font-size:.9rem}
.tbox b{margin-right:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header class="top">
    <h1>중간고사 문제 정리</h1>
    <p class="sub">2~7주차 활동지·강의안 기반 · 새로고침하거나 ‘새 세트’를 누를 때마다 인물·상황·숫자가 바뀐 새 문제 세트(주차별 객관식 20 + 주관식 5)</p>
  </header>
  <div class="bar">
    <div class="tabs" id="subj"></div>
    <div class="tabs" id="modes"></div>
    <div class="tabs" id="tabs"></div>
    <div class="tabs" id="kinds"></div>
    <div class="tools" id="toolsRow">
      <button id="newset" class="primary">새 세트 만들기</button>
      <button id="wrongOnly" aria-pressed="false">오답만 보기</button>
      <button id="shuffle">문제 섞기</button>
      <button id="reset">이 범위 다시 풀기</button>
      <span class="score" id="score"></span>
    </div>
    <div class="airow" id="aiRow" hidden><button id="aiBtn" class="btn">AI로 완전 새 문제 5개</button><span id="aiMsg" class="hint">선택한 주차(전체면 무작위 주차)로 Claude가 새 사례 문제를 만들어요.</span></div>
  </div>
  <main id="list"></main>
</div>

<script>
const W={
2:"건강신념모델(HBM) · 합리적·계획적 행동이론(TRA·TPB)",
3:"사회인지이론 · 범이론적모형 · 지역사회 수준 이론",
4:"요구진단 — 발생률·유병률 · PRECEDE-PROCEED",
5:"목적과 목표 — 결과·효과·과정·구조목표",
6:"영양교육안(lesson plan) 작성"};
// [주차, 문제, 사례(없으면 ""), 보기[], 정답 index, 해설]
const Q=[
// ---------- 2주차 ----------
[2,"다음 사례에 해당하는 HBM 구성요소는?","아버지를 대장암으로 잃은 P씨는 \"우리 집안 내력을 보면 나도 대장암에 걸릴 수 있겠다\"고 생각한다.",["인지된 민감성","인지된 심각성","인지된 이익","자아효능감"],0,"‘나도 걸릴 수 있다’ = 질병에 걸릴 가능성에 대한 인식 → 인지된 민감성."],
[2,"다음 사례에 해당하는 HBM 구성요소는?","Q씨는 \"골다공증으로 고관절이 부러지면 거동을 못 하고 오래 누워 지내야 한다\"며 걱정한다.",["인지된 민감성","인지된 심각성","인지된 장애","행동수정 실행의 계기"],1,"질병이 가져올 결과가 얼마나 나쁜지에 대한 인식 → 인지된 심각성."],
[2,"다음 사례에 해당하는 HBM 구성요소는?","R씨는 \"매끼 채소를 챙겨 먹으면 변비가 줄고 혈당 관리에도 좋다더라\"는 이야기를 듣고 해볼 마음이 생겼다.",["인지된 심각성","인지된 장애","인지된 이익","자아효능감"],2,"예방행동을 했을 때 얻는 좋은 점 → 인지된 이익."],
[2,"다음 사례에 해당하는 HBM 구성요소는?","S씨는 \"잡곡밥은 쌀값보다 비싸고 식구들이 싫어해서 바꾸기 힘들다\"며 미루고 있다.",["인지된 이익","인지된 장애","인지된 민감성","주관적 규범"],1,"행동을 할 때 겪는 비용·불편·어려움 → 인지된 장애."],
[2,"다음 사례에 해당하는 HBM 구성요소는?","T씨는 보건소에서 ‘무료 혈당검사 안내’ 문자를 받은 뒤 자신의 식단을 점검하기 시작했다.",["인지된 이익","자아효능감","행동수정 실행의 계기","행동의도"],2,"행동을 촉발한 외부 자극(캠페인·권유·안내 문자·의사의 경고 등) → 행동수정 실행의 계기."],
[2,"다음 사례에 해당하는 HBM 구성요소는?","U씨는 \"밥을 작은 그릇에 덜어 먹는 것쯤은 나도 충분히 지킬 수 있다\"며 바로 실천하기로 했다.",["인지된 이익","자아효능감","인지된 민감성","행동에 대한 태도"],1,"그 행동을 해낼 수 있다는 자신감 → 자아효능감."],
[2,"건강신념모델(HBM)의 구성요소가 아닌 것은?","",["인지된 민감성","인지된 장애","주관적 규범","행동수정 실행의 계기","자아효능감"],2,"주관적 규범은 TRA·TPB의 구성요소다. HBM 6요소: 민감성·심각성·이익·장애·실행의 계기·자아효능감."],
[2,"HBM에서 ‘질병에 대한 인지’로 묶이는 두 요소는?","",["인지된 이익 · 인지된 장애","인지된 민감성 · 인지된 심각성","실행의 계기 · 자아효능감","태도 · 주관적 규범"],1,"질병에 대한 인지 = 민감성·심각성 / 행동에 대한 인지 = 이익·장애 / 실행 요인 = 계기·자아효능감."],
[2,"HBM 예측 모형에서 연령·성별·교육수준 같은 인구학적 변수는 어떤 역할을 하는가?","",["행동의 직접 원인","수정요인으로서 질병위협 인지에 영향","행동의도를 직접 결정","강화 요인"],1,"인구학적·사회심리적·구조적 변수는 ‘수정요인’으로 질병위협 인지에 영향을 준다."],
[2,"HBM을 영양교육에 적용할 때 가장 핵심이 되는 전략은?","",["주변인의 기대를 강조","대상자의 변화단계부터 파악","위험 인식 강화와 실행장애 완화","또래 모델의 행동을 관찰시킴"],2,"HBM → 위험 인식(민감성·심각성) 강화 + 장애 완화. 나머지는 TPB, 변화단계모델, 사회인지이론 전략."],
[2,"다음 사례에 해당하는 TRA·TPB 구성요소는?","V씨는 \"아침을 거르지 않는 건 몸에 좋은 습관이니 해볼 만하다\"고 생각한다.",["행동에 대한 태도","주관적 규범","인지된 행동통제력","행동의도"],0,"행동을 좋게/나쁘게 평가하는 것 → 행동에 대한 태도."],
[2,"다음 사례에 해당하는 TRA·TPB 구성요소는?","W씨는 \"어머니가 내가 야식을 끊길 바라신다\"는 것을 알고 신경이 쓰인다.",["행동에 대한 태도","주관적 규범","인지된 행동통제력","인지된 민감성"],1,"중요한 타인이 나의 행동을 어떻게 생각할지에 대한 믿음 → 주관적 규범."],
[2,"다음 사례에 해당하는 TRA·TPB 구성요소는?","X씨는 \"회식이 잦아서 술자리 안주는 내 마음대로 조절하기 어렵다\"고 느낀다.",["행동의도","주관적 규범","인지된 행동통제력","인지된 장애"],2,"그 행동을 하기가 쉽다/어렵다고 느끼는 정도 → 인지된 행동통제력(TPB에서 추가된 요소). ‘쉽다/어렵다’가 단서."],
[2,"다음 사례에 해당하는 TRA·TPB 구성요소는?","Y씨는 \"이번 달부터 점심에는 꼭 샐러드를 먹겠다\"고 다짐했다.",["행동에 대한 태도","행동의도","인지된 행동통제력","자아효능감"],1,"‘~하겠다고 다짐/결심’ → 행동으로 이어지는 의도, 즉 행동의도."],
[2,"합리적 행동이론(TRA)과 비교한 계획적 행동이론(TPB)의 특징은?","",["태도 요소를 제거했다","주관적 규범을 제외했다","인지된 행동통제력을 추가했다","질병의 심각성을 추가했다"],2,"TPB는 TRA를 확장해 ‘인지된 행동통제력’을 추가한 이론이다."],
[2,"TRA·TPB 구조모형에서 주관적 규범을 형성하는 요소는?","",["행동신념 + 결과평가","규범적 신념 + 순응동기","통제신념 + 지각된 영향력","민감성 + 심각성"],1,"태도 = 행동신념+결과평가 / 주관적 규범 = 규범적 신념+순응동기 / 인지된 행동통제 = 통제신념+지각된 영향력."],
[2,"TRA·TPB 구조모형에서 ‘행동에 대한 태도’를 형성하는 요소는?","",["행동신념 + 결과평가","규범적 신념 + 순응동기","통제신념 + 지각된 영향력","관찰학습 + 강화"],0,"행동신념(그 행동이 어떤 결과를 낼지 믿음)과 결과평가(그 결과가 좋은지 나쁜지)가 태도를 만든다."],
[2,"TRA·TPB에서 실제 행동의 바로 앞에 위치하는 요인은?","",["주관적 규범","행동에 대한 태도","행동의도","인지된 민감성"],2,"태도 + 주관적 규범 (+ 인지된 행동통제) → 행동의도 → 행동."],
[2,"다음 중 TPB로 분석하기에 가장 적합한 진술은?","",["\"나도 고혈압에 걸릴 수 있겠다\"","\"고혈압이 오면 뇌졸중까지 갈 수 있다\"","\"친구들 모두 탄산음료를 끊어서 나만 마시기 눈치 보인다\"","\"보건소 문자를 받고 혈압을 재봤다\""],2,"주변 사람의 기대·시선 → TPB의 주관적 규범. 나머지는 HBM의 민감성·심각성·실행의 계기."],
[2,"건강행동 이론 중 ‘개인 내 수준’에 해당하지 않는 것은?","",["건강신념모델","계획적 행동이론","변화단계모델","사회인지이론"],3,"사회인지이론은 개인 간 수준. 개인 내 수준 = HBM, TRA·TPB, 변화단계모델."],
// ---------- 3주차 ----------
[3,"다음 사례에 해당하는 사회인지이론 구성요소는?","A군은 \"아침에 간단한 도시락 싸는 정도는 나도 할 수 있다\"고 생각한다.",["결과기대","자아효능감","관찰학습","자기조절"],1,"‘나도 할 수 있다’ → 자아효능감(개인적 요인)."],
[3,"다음 사례에 해당하는 사회인지이론 구성요소는?","B양은 좋아하는 유튜버가 오트밀로 아침을 먹는 영상을 보고 자신도 따라 만들어 먹었다.",["관찰학습","긍정적 강화","결과기대","자기조절"],0,"직접 해보지 않고 타인의 행동을 보고 따라 함(대리경험·모방) → 관찰학습."],
[3,"다음 사례에 해당하는 사회인지이론 구성요소는?","C군이 물을 하루 2L 마신 날마다 어머니가 칭찬해주자, C군은 다음 날에도 물을 챙겨 마셨다.",["부정적 강화","결과기대","긍정적 강화","관찰학습"],2,"칭찬·포상으로 행동을 계속하게 함 → 긍정적 강화."],
[3,"다음 사례에 해당하는 사회인지이론 구성요소는?","D양은 \"점심에 샐러드를 먹으면 오후 수업에 덜 졸릴 것 같다\"고 기대한다.",["자아효능감","결과기대","자기조절","긍정적 강화"],1,"행동의 결과에 대한 기대 → 결과기대."],
[3,"다음 사례에 해당하는 사회인지이론 구성요소는?","E씨는 걸음 수 앱으로 매일 활동량을 기록하고, 목표에 못 미친 날은 저녁에 산책을 더 한다.",["관찰학습","자기조절","결과기대","긍정적 강화"],1,"스스로 기록·점검하고 조절함 → 자기조절(행동적 요인)."],
[3,"이 강의 정의에 따를 때, 다음 사례에 해당하는 구성요소는?","F씨는 저녁 간식 줄이기를 며칠 쉬었더니 다시 예전의 야식 습관으로 돌아갔다.",["긍정적 강화","부정적 강화","관찰학습","재발기"],1,"강의안 정의: 부정적 강화 = 행동변화를 그치거나 과거로 돌아가게 하는 것(야단·처벌과는 다름). 활동지도 같은 사례를 이 항목으로 다룸. ※ 일반 심리학의 ‘부정적 강화’ 정의와 다르니 수업 기준으로 외우기."],
[3,"사회인지이론의 상호결정론을 이루는 세 요소는?","",["지식·태도·행동","개인·행동·환경","태도·규범·통제력","민감성·심각성·이익"],1,"개인적 요인(인식·자아효능감) + 행동적 요인(행동수행력·자기조절) + 환경적 요인(환경·관찰학습·강화)."],
[3,"강의안 분류에서 ‘관찰학습’과 ‘강화’는 상호결정론의 어느 요인에 속하는가?","",["개인적 요인","행동적 요인","환경적 요인","수정요인"],2,"환경적 요인 = 환경·상황·관찰학습·강화."],
[3,"사회마케팅의 4P 마케팅믹스에 해당하지 않는 것은?","",["상품(Product)","가격(Price)","장소(Place)","판촉(Promotion)","인력(People)"],4,"4P = 상품·가격·장소·판촉. 사회마케팅은 환경분석(SWOT) → 시장세분화 → 전략 수립 → 운영·관리 순."],
[3,"다음 사례에 해당하는 변화단계는?","G씨는 \"라면 국물 다 마시는 게 뭐가 문제냐\"며 자신의 식습관에 문제가 없다고 생각한다.",["고려전단계","고려단계","준비단계","재발기"],0,"문제 자체를 인식하지 못함 → 고려전단계."],
[3,"다음 사례에 해당하는 변화단계는?","H씨는 \"국물을 줄여야 한다는 건 아는데, 아직은 바꿀 엄두가 안 난다\"고 말한다.",["고려전단계","고려단계","준비단계","실행단계"],1,"문제는 알지만 실행 의지가 아직 없음 → 고려단계."],
[3,"다음 사례에 해당하는 변화단계는?","I씨는 다음 달부터 시작하려고 보건소 저염식 교실에 등록하고 저염 간장을 미리 사두었다.",["고려단계","준비단계","실행단계","유지단계"],1,"구체적인 준비 행동(교육 등록·장보기 변경)을 시작함 → 준비단계."],
[3,"다음 사례에 해당하는 변화단계는?","J씨는 3주째 국물을 남기고 저염 반찬을 먹고 있다.",["준비단계","실행단계","유지단계","고려단계"],1,"실제로 행동을 실천 중이지만 6개월 미만 → 실행단계."],
[3,"다음 사례에 해당하는 변화단계는?","K씨는 1년 가까이 저염식을 꾸준히 이어오며 식단 기록 앱도 계속 쓰고 있다.",["실행단계","유지단계","준비단계","재발기"],1,"변화된 행동을 6개월 이상 지속 → 유지단계."],
[3,"다음 사례에 해당하는 변화단계는?","L씨는 4개월간 저염식을 하다가 최근 다시 짜게 먹는 습관으로 돌아갔다.",["고려전단계","고려단계","유지단계","재발기"],3,"실천하다 이전 행동으로 후퇴 → 재발기."],
[3,"범이론적모형에서 ‘문제 행동은 인식하지만 6개월 이내에 행동변화를 실행할 의지는 아직 없는 단계’는?","",["고려전단계","고려단계","준비단계","실행단계","유지단계"],1,"고려단계. 고려전단계는 문제 자체를 인식하지 못하는 단계로 헷갈리지 말 것(국시 단골)."],
[3,"성인병 예방 프로그램에서 고려전단계 대상자에게 가장 적합한 접근은?","",["개별 수준별 맞춤 프로그램","SNS·U-Health로 유지 지원","위험성에 대한 인식 증진(그룹 대상 일률적 적용)","소그룹 맞춤형 실습"],2,"고려전 → 위험 인식 증진 / 고려 → 구체적 실천방안 제시 / 준비 → 소그룹 맞춤 / 실행 → 개별 맞춤 / 유지 → U-Health·SNS."],
[3,"변화단계모델의 단점으로 옳은 것은?","",["유지 노력의 중요성을 무시한다","사회환경적 요인에 대한 고려가 부족하다","단계별 전략을 세울 수 없다","고려전단계 대상 범위가 너무 좁다"],1,"단점: ① 고려전단계 범위가 매우 광범위 ② 사회환경적 요인 고려 부족 → 다른 모델과 연계 필요."],
[3,"‘개혁적 성향의 소수가 먼저 새로운 식습관을 받아들이고, 다른 구성원이 효과를 확인한 뒤 뒤따르게 한다’는 설명에 해당하는 이론은?","",["사회마케팅","개혁확산모델","PRECEDE-PROCEED","건강신념모델"],1,"개혁확산모델: 지식→설득→결정→실행→확인, S자 곡선, 구성원의 10~25%가 수용하면 빠르게 확산."],
[3,"계획부터 수행·평가까지 연속적 단계를 제공하는, 가장 포괄적인 지역사회 건강증진 계획 모형은?","",["사회인지이론","개혁확산모델","PRECEDE-PROCEED 모델","계획적 행동이론"],2,"PRECEDE-PROCEED: 교육적·생태학적 접근, 지역사회 영양사업 기획의 대표 틀."],

[4,"‘발생률’의 정의로 옳은 것은?","",["특정 시점의 전체 환자 수 ÷ 전체 인구","일정 기간 새로 생긴 환자 수 ÷ 위험에 노출된 인구","사망자 수 ÷ 환자 수","현재 환자 수 ÷ 위험에 노출된 인구"],1,"발생률 = 새 환자 ÷ 위험에 있는 사람 수(이미 환자인 사람은 제외)."],
[4,"‘유병률’의 정의로 옳은 것은?","",["일정 기간 새 환자 수 ÷ 전체 인구","특정 시점의 현재 환자 수 ÷ 전체 인구","새 환자 수 ÷ 기존 환자 수","치료된 환자 수 ÷ 전체 환자 수"],1,"유병률 = 그 시점에 질병을 가진 사람(새 환자+기존 환자) ÷ 전체 인구."],
[4,"E지역 주민 8,000명을 조사했더니 조사 시점의 고혈압 환자가 800명이었다. 고혈압 유병률은?","",["8%","10%","12.5%","80%"],1,"800 ÷ 8,000 × 100 = 10%."],
[4,"위 E지역(8,000명 중 고혈압 800명)에서 이후 1년간 고혈압이 새로 생긴 사람이 360명이었다. 1년 발생률은?","",["4.5%","5%","10%","45%"],1,"위험에 노출된 인구 = 8,000 − 800(이미 환자) = 7,200명. 360 ÷ 7,200 × 100 = 5%. 전체 인구로 나눈 4.5%는 함정."],
[4,"F지역 12,000명 중 비만인 사람이 3,600명이었다. 비만 유병률은?","",["3%","25%","30%","36%"],2,"3,600 ÷ 12,000 × 100 = 30%."],
[4,"발생률과 유병률 중 ‘새로운 환자만’ 포함하는 지표와 그 이유로 옳은 것은?","",["유병률 — 현재 환자를 모두 세므로","발생률 — 일정 기간 새로 생긴 환자만 세므로","유병률 — 위험 인구를 분모로 하므로","발생률 — 전체 인구를 분모로 하므로"],1,"발생률은 신규 환자만, 유병률은 신규+기존 환자를 모두 포함."],
[4,"당뇨병처럼 한 번 걸리면 오래 지속되는 만성질환에서 흔히 나타나는 현상은?","",["유병률이 발생률보다 낮다","유병률이 발생률보다 높게 나타난다","두 지표가 항상 같다","발생률을 계산할 수 없다"],1,"유병률 ≈ 발생률 × 유병기간. 앓는 기간이 길면 환자가 누적돼 유병률이 커진다. (교재 외 일반 역학 개념 — 수업 범위인지 확인 권장)"],
[4,"다음 활동이 해당하는 PRECEDE-PROCEED 진단 단계는?","구청 영양팀이 주민들에게 ‘살면서 가장 중요하게 여기는 것’과 삶의 만족도를 설문했다.",["사회적 진단","역학적 진단","교육·생태학적 진단","행정·정책적 진단"],0,"삶의 질·주민의 관심사 파악 → 사회적 진단."],
[4,"다음 활동이 해당하는 PRECEDE-PROCEED 진단 단계는?","국민건강영양조사 자료로 지역 여성의 빈혈 유병률 추이를 정리했다.",["사회적 진단","역학적 진단","교육·생태학적 진단","행정·정책적 진단"],1,"질병의 유병률·발생률 등 통계 확인 → 역학적 진단."],
[4,"다음 활동이 해당하는 PRECEDE-PROCEED 진단 단계는?","주민들이 채소를 적게 먹는 이유가 지식 부족인지, 가격 부담인지, 가족의 지지 부족인지 조사했다.",["사회적 진단","역학적 진단","교육·생태학적 진단","행정·정책적 진단"],2,"행동을 방해·촉진하는 요인(동기·기술·환경) 분석 → 교육·생태학적 진단."],
[4,"다음 활동이 해당하는 PRECEDE-PROCEED 진단 단계는?","보건소에 영양사업을 맡을 영양사 인원과 올해 배정 예산이 충분한지 점검했다.",["사회적 진단","역학적 진단","교육·생태학적 진단","행정·정책적 진단"],3,"예산·인력·조직 확인 → 행정·정책적 진단."],
[4,"다음 활동이 해당하는 PRECEDE-PROCEED 진단 단계는?","프로그램 운영이 지자체 조례나 기관 내부 규정과 충돌하지 않는지 검토했다.",["사회적 진단","역학적 진단","교육·생태학적 진단","행정·정책적 진단"],3,"법령·규정·정책 검토 → 행정·정책적 진단."],
[4,"다음 활동이 해당하는 PRECEDE-PROCEED 진단 단계는?","아파트 주민 대표들과 포커스 그룹 인터뷰를 열어 동네에서 가장 걱정되는 건강문제를 물었다.",["사회적 진단","역학적 진단","교육·생태학적 진단","행정·정책적 진단"],0,"주민이 느끼는 문제·관심사를 직접 듣는 것 → 사회적 진단(활동지 5번 변형)."],
[4,"교육·생태학적 진단에서 행동에 영향을 주는 요인으로 분석하는 세 가지는?","",["소인·강화·가능 요인","태도·규범·통제력","개인·행동·환경","지식·설득·결정"],0,"PRECEDE의 교육·생태학적 진단은 소인(지식·태도), 강화(주변 지지·보상), 가능(기술·자원) 요인을 본다. (교재 표준 내용 — 강의안에 명시는 없음)"],
[4,"PRECEDE 단계의 진단 순서로 옳은 것은?","",["역학적 → 사회적 → 행정·정책적 → 교육·생태학적","사회적 → 역학적 → 교육·생태학적 → 행정·정책적","교육·생태학적 → 사회적 → 역학적 → 행정·정책적","행정·정책적 → 교육·생태학적 → 역학적 → 사회적"],1,"삶의 질(사회적) → 건강문제(역학적) → 행동 요인(교육·생태학적) → 자원·정책(행정·정책적)."],
[4,"지역사회 요구진단 5단계의 순서로 옳은 것은?","",["문제 찾기 → 자료 수집 → 대상자 선정 → 우선순위 → 영양문제 판단","자료 수집 → 문제 찾기 → 영양문제 판단 → 우선순위 결정 → 대상자 선정","자료 수집 → 우선순위 결정 → 문제 찾기 → 대상자 선정 → 영양문제 판단","대상자 선정 → 자료 수집 → 문제 찾기 → 영양문제 판단 → 우선순위 결정"],1,"자료 → 문제 → 영양문제 → 우선순위 → 대상자."],

  const bankM=w=>shuf(Q.filter(q=>q[0]===w)).map(q=>{const o=shuf(q[3].map((t,i)=>({t,i})));return mixBank({k:'m',w,q:q[1],c:q[2],o:o.map(x=>x.t),a:o.findIndex(x=>x.i===q[4]),e:q[5]})});
  const bankS=w=>shuf(S.filter(q=>q[0]===w)).map(q=>({k:'s',w,q:q[1],c:q[2],keys:q[3],a:q[4]}));
  [2,3,4,5,6,7].forEach(w=>{
    const gens=WG[w];let m=0,tries=0;
    const genM=()=>w===4&&Math.random()<.45?genCalc(false):(w<=3&&Math.random()<.15?genTheory():genGroup(R(gens),false));
    while(m<12&&tries<200){tries++;const q=genM();if(q.w&&q.w!==w)continue;if(push(q,w))m++}
    const bm=bankM(w);let bi=0;while(m<20&&bi<bm.length){if(push(bm[bi++],w))m++}
    let s=0;tries=0;
    while(s<3&&tries<100){tries++;const q=w===4&&Math.random()<.5?genCalc(true):genGroup(R(gens),true);if(push(q,w))s++}
    const bs=bankS(w);let si=0;while(s<5&&si<bs.length){if(push(bs[si++],w))s++}
  });
  return out;
}

[1,'생리활성기능에 대한 설명으로 옳은 것은?',['인체의 성장 증진 및 정상적인 기능 유지에 대한 영양소의 생리학적 작용이다.','2016년부터 생리활성 1·2·3등급으로 새롭게 세분화되었다.','인체의 구조 및 기능에 건강상의 기여를 하거나 건강 유지·개선에 도움을 주는 기능이다.','의약품에만 표시할 수 있다.','반드시 특정 질병명을 표시해야 한다.'],2,'①은 영양소 기능의 정의. 생리활성 1·2·3급은 2016년부터 하나로 통합되어 ‘○○에 도움을 줄 수 있음’으로 표기.'],
[1,'다음 중 자료에서 제시된 ‘질병 발생위험 감소 기능’과 관련된 성분이 아닌 것은?',['칼슘','비타민 D','자일리톨','칼슘과 비타민 D','비타민 C'],4,'질병발생위험감소기능은 2건만 인정: 골다공증(칼슘·비타민 D), 충치(자일리톨, 개별인정원료).'],
[1,'맞춤형건강기능식품관리사에 대한 설명으로 옳은 것은?',['맞춤형건강기능식품판매업자는 필요에 따라 자율적으로 맞춤형건강기능식품관리사를 둘 수 있다.','맞춤형건강기능식품관리사는 소분·조합에 대한 안전관리를 담당하지만, 관련 시설·설비의 위생관리는 담당하지 않는다.','맞춤형건강기능식품관리사의 자격은 별도의 제한 없이 건강기능식품 관련 교육을 이수한 사람에게 부여된다.','맞춤형건강기능식품판매업을 하려는 자는 총리령으로 정하는 바에 따라 맞춤형건강기능식품관리사를 두어야 한다.','맞춤형건강기능식품관리사의 자격요건은 총리령으로 정하며, 의사·치과의사·한의사·간호사·약사·한약사·영양사가 이에 해당한다.'],3,'반드시 두어야 함(총리령). 업무: 소분·조합 안전관리 + 시설·설비 위생관리 + 상담. 자격요건은 보건의료인력 중 ‘대통령령’으로 정한 사람(의사·치과의사·한의사·간호사·약사·한약사·영양사).'],
[1,'건강기능식품 용기·포장의 표시사항으로 적절하지 않은 것은?',['건강기능식품임을 나타내는 문자 또는 도형','섭취량 및 섭취방법','섭취 시 주의사항','질병의 예방 및 치료를 위한 의약품이라는 표현','보관방법'],3,'필수 표시사항은 ‘질병 예방·치료를 위한 의약품이 아니라는 내용’이다.'],
[1,'건강기능식품의 원료 구입부터 생산·포장·출하까지 전 과정에 걸쳐 체계적으로 품질을 관리하고, 제조업소가 자주적·자율적으로 품질기준을 향상하도록 도입된 제도는?',['건강기능식품 기능성 원료 인정제도','식품안전관리인증기준 (HACCP)','우수건강기능식품제조기준(GMP)','맞춤형건강기능식품관리사 제도','건강기능식품 품목제조신고제도'],2,'GMP = 원료 → 생산 → 포장 → 출하 전 과정의 체계적 품질관리.'],
[3,'체지방 감소기전에 대한 설명으로 옳지 않은 것은?',['지방의 흡수를 억제하면 체지방의 축적을 줄이는 데 도움이 될 수 있다.','지방산의 미토콘드리아 이동과 β-산화를 촉진하면 체지방 감소에 도움이 될 수 있다.','지방 합성에 관여하는 효소의 활성을 억제하면 체지방의 양을 조절할 수 있다.','소장에서 지방을 분해하는 효소의 활성을 억제하면 지방의 흡수를 감소시킬 수 있다.','지방산의 산화를 억제하여 지방으로부터 에너지 생성을 감소시키면 체지방 감소에 도움이 된다.'],4,'체지방 감소기전: ① 흡수 억제 ② 지방 산화 촉진(CPT 활성↑, β-산화↑) ③ 지방 합성 억제. 산화를 ‘억제’하는 것은 반대.'],
[3,'렙틴 (leptin)에 대한 설명으로 옳은 것은?',['췌장에서 분비되는 소화효소이다.','지방세포에서 분비되며 식욕 조절에 관여한다.','섭식 중추를 활성화하여 음식 섭취를 증가시킨다.','포만 중추의 활성을 억제하여 식욕을 증가시킨다.','렙틴 유전자가 결핍되면 체중이 감소한다.'],1,'렙틴: 지방세포 분비 단백질. 섭식중추 억제, 포만중추 촉진. ob/ob(렙틴 결핍) 마우스는 비만.'],
[3,'체지방 측정방법에 대한 설명으로 옳지 않은 것은?',['생체 전기저항분석법은 지방조직과 지방을 제외한 기타 조직의 전기저항 차이를 이용한다.','DEXA는 지방과 지방이 없는 부분을 평가할 수 있다.','단층촬영법은 내장지방의 분포를 확인하는 데 이용할 수 있다.','DEXA와 단층촬영법은 방사선 노출이라는 단점이 있다.','체질량지수(BMI)를 통해 체지방량과 근육량을 구분할 수 있다.'],4,'BMI는 키와 체중만으로 계산하므로 체지방과 근육을 구분하지 못한다.'],
[3,'가르시니아 캄보지아 추출물의 체지방 감소 작용과 가장 관련이 깊은 것은?',['지방의 유화를 촉진한다.','ATP-시트르산 리에이스의 활성을 억제한다.','지방세포의 분화를 촉진한다.','지방산의 흡수를 증가시킨다.','탄수화물의 지방 전환을 촉진한다.'],1,'기능성분 HCA가 ATP-시트르산 리에이스를 억제 → 탄수화물이 지방으로 전환·축적되는 것을 막음.'],
[4,'혈당 조절 호르몬에 대한 설명으로 옳은 것은?',['혈당이 상승하면 글루카곤의 분비가 증가한다.','인슐린은 간에 저장된 글리코겐의 분해를 촉진한다.','인슐린은 이자의 β-세포에서 분비되며 글루카곤은 이자의 α-세포에서 분비된다.','글루카곤은 혈당을 낮추는 작용을 한다.','인슐린은 혈당이 저하될 때 주로 분비된다.'],2,'인슐린(β-세포): 혈당↑일 때 분비, 혈당↓. 글루카곤(α-세포): 혈당↓일 때 분비, 글리코겐 분해로 혈당↑.'],
[4,'제2형 당뇨병에 대한 설명으로 옳지 않은 것은?',['인슐린 비의존형 당뇨병이라고 한다.','인슐린 저항성이 주요 발병 원인이다.','비만과 신체활동 저하가 발생에 영향을 줄 수 있다.','인슐린 저항성이 발생하면 혈당이 높은 상태로 유지될 수 있다.','췌장에서 인슐린이 전혀 분비되지 않는 것이 주된 특징이다.'],4,'인슐린 분비 자체의 문제(β세포 파괴)는 제1형. 제2형은 인슐린 저항성이 주원인.'],
[4,'GLP-1에 대한 설명으로 옳은 것은?',['GLP-1은 인슐린 분비를 억제하여 혈당을 조절한다.','GLP-1은 식욕을 증가시키고 위장관 운동을 촉진한다.','GLP-1은 인슐린 분비를 유도하며 체내에서 DPP-4에 의해 분해된다.','GLP-1은 췌장 β-세포의 증식을 억제하고 세포사멸을 촉진한다.','DPP-4는 GLP-1의 분해를 억제하여 GLP-1의 작용을 지속시킨다.'],2,'GLP-1(인크레틴): 인슐린 분비 촉진, 상부 소화관 운동 저하, 식욕 억제, β-세포 증식. DPP-4는 GLP-1을 빠르게 분해.'],
[4,'당화혈색소(HbA1c)에 대한 설명으로 옳은 것은?',['혈색소와 포도당의 결합 정도를 이용한다.','포도당 투여 직후의 혈당만을 평가한다.','췌장의 인슐린 분비량을 직접 측정한다.','소장에서 포도당의 흡수 정도를 직접 측정한다.','혈중 글루카곤의 농도를 측정하는 지표이다.'],0,'혈구 생존 기간 동안 포도당과 비효소적으로 결합(당화) → 지난 수주간의 혈당 추정, 혈당 조절의 기본 지표.'],
[4,'혈당 조절에 도움을 줄 수 있는 기능성 원료에 대한 설명으로 옳지 않은 것은?',['난소화성 말토덱스트린은 체내 아밀레이스에 의해 소화되기 어렵다.','난소화성 말토덱스트린은 소장에서의 통과시간을 지연시키거나 섭취한 당의 흡수를 방해할 수 있다.','바나바잎 추출물은 코로솔산을 함유하고 있다.','바나바잎 추출물의 코로솔산은 GLUT-4의 세포막 근처 이동을 촉진하여 세포 내 혈당 유입을 증가시킨다.','구아바잎 추출물은 α-amylase의 활성을 촉진하여 식후 혈당 상승을 억제한다.'],4,'구아바잎 추출물도 코로솔산 함유 → GLUT-4 이동 촉진. α-아밀레이스 활성을 ‘저해’하는 원료는 참밀알부민.'],
[5,'혈행을 저해하는 요인에 대한 설명으로 옳지 않은 것은?',['LDL-콜레스테롤 수치가 높아지면 동맥경화의 원인이 될 수 있다.','흡연은 혈소판의 응집력을 증가시켜 혈전 생성을 촉진할 수 있다.','고혈압은 혈관벽에 과도한 압력을 주어 혈관 탄력성을 저하시킬 수 있다.','적혈구의 변형능력이 저하되면 모세혈관을 통과하는 데 어려움이 생길 수 있다.','비만으로 인한 내장지방 증가는 관상동맥질환의 위험을 감소시킨다.'],4,'내장지방의 과도한 축적은 관상동맥질환 위험을 ‘높이는’ 주요 위험요인.'],
[5,'혈관 내피와 산화질소 (NO)에 대한 설명으로 옳은 것은?',['혈관의 가장 바깥층에 위치하며 주로 혈액 응고를 촉진한다.','산화질소(NO)는 혈관 내피세포에서 콜레스테롤로부터 생성된다.','혈관 내피세포에서 산화질소(NO)의 생성이 감소하면 혈관 기능이 저하될 수 있다.','eNOS의 활성이 증가하면 산화질소 생성이 감소하여 혈관 내피 기능이 저하된다.','혈관 내피의 기능 이상은 산화질소 생성을 증가시켜 혈관 이완을 촉진한다.'],2,'혈관 내피는 내막 표면의 단일층. NO는 NOS(eNOS)에 의해 아르기닌으로부터 생성. eNOS 활성 저하 → NO 감소 → 내피 기능 이상.'],
[5,'혈행 조절에 관여하는 물질에 대한 설명으로 옳은 것은?',['엔도텔린-1은 강력한 혈관 확장 물질이다.','브래디키닌은 혈관을 수축시켜 혈압을 증가시킨다.','트롬복산 A₂(TXA₂)는 혈소판 응집을 억제한다.','프로스타글란딘 I₂(PGI₂)는 트롬복산 A₂와 반대로 작용하여 혈소판 응집을 억제한다.','브래디키닌은 산화질소의 방출을 억제하여 혈관을 수축시킨다.'],3,'엔도텔린-1 = 강력한 혈관 수축제. 브래디키닌 = 혈관 확장·혈압 감소. TXA₂ = 응집↑·수축, PGI₂ = 응집↓·확장.'],
[5,'은행잎 추출물에 대한 설명으로 옳지 않은 것은?',['플라보놀 배당체가 지표성분이다.','PGI₂와 산화질소 활성화에 관여한다.','혈관 이완에 도움을 줄 수 있다.','혈소판 응집을 촉진하여 혈행을 개선한다.','수술 전후에는 출혈 위험과 관련하여 섭취에 주의해야 한다.','혈액응고를 촉진하므로 수술 전후 섭취를 권장한다.'],5,'기출 원본 그대로(보기 6개, ⑤가 두 번 인쇄됨). 표시된 정답은 마지막 보기. ※ 강의자료 기준으로는 ‘혈소판 응집을 촉진’도 틀린 설명이다(은행잎은 PAF 억제 → 혈소판 응집 감소). 수술 전후에는 출혈 위험으로 과다 섭취 주의.'],
[6,'혈압 조절에 대한 설명으로 옳은 것은?',['교감신경이 활성화되면 심박수가 감소하고 혈압이 낮아진다.','부교감신경이 활성화되면 혈관이 수축하여 혈압이 상승한다.','혈압이 감소하면 신장에서 레닌의 분비가 증가할 수 있다.','안지오텐신Ⅱ는 혈관을 확장시켜 혈압을 낮춘다.','알도스테론은 나트륨과 물의 재흡수를 감소시킨다.'],2,'교감신경: 심박수↑·혈관 수축·혈압↑ / 부교감: 반대. 안지오텐신Ⅱ: 혈관 수축 + 알도스테론 분비 → Na·물 재흡수↑ → 혈압↑.'],
[6,'레닌-안지오텐신계에 의한 혈압 조절 과정으로 옳은 것은?',['혈압 감소 → 레닌 분비 감소 → 혈압 상승','안지오텐신Ⅰ → ACE → 안지오텐신Ⅱ','안지오텐신Ⅱ → 혈관 확장 → 혈압 감소','안지오텐신Ⅱ → 알도스테론 분비 억제 → 혈압 감소','알도스테론 → 나트륨과 물의 재흡수 감소 → 혈압 상승'],1,'혈압↓ → 신장 레닌 분비 → 안지오텐신Ⅰ → ACE → 안지오텐신Ⅱ → 혈관 수축·알도스테론 → Na·물 재흡수↑ → 혈압↑.'],
[6,'혈압 조절 기능성 평가에 대한 설명으로 옳지 않은 것은?',['혈압 측정은 혈압조절 기능을 평가하는 중요한 바이오마커이다.','레닌과 안지오텐신Ⅱ 등을 바이오마커로 활용할 수 있다.','안지오텐신 전환효소(ACE)의 활성을 측정할 수 있다.','hs-CRP는 저등급 염증 및 심혈관질환 위험 평가에 활용할 수 있다.','사구체여과율이 낮을수록 신장 기능이 우수함을 의미한다.'],4,'정상 사구체여과율은 분당 90~120 mL. 고혈압 환자에서 정상보다 낮으면 신장 질환·신부전 의심.'],
[6,'코엔자임 Q10에 대한 설명으로 옳은 것은?',['체내에서 합성되지 않아 반드시 식품으로 섭취해야 한다.','주로 세포막에서 단백질 합성을 촉진하는 물질이다.','미토콘드리아에서 ATP 생성 과정에 필요한 물질이다.','혈압을 상승시키는 기능성 원료이다.','스타틴이나 와파린 계열 의약품 복용자는 섭취량을 늘리는 것이 권장된다.'],2,'CoQ10: 체내 합성 가능, 미토콘드리아 세포 호흡(ATP 생성)에 필요, 혈압 감소. 스타틴·와파린 복용자는 주의.'],
[6,'가츠오부시 올리고펩티드 및 펩티드 유래 소재의 혈압 조절 기전으로 옳은 것은?',['레닌 분비를 촉진한다.','안지오텐신 전환효소(ACE)의 활성을 억제한다.','안지오텐신Ⅱ의 생성을 촉진한다.','알도스테론의 분비를 증가시킨다.','혈관 수축을 촉진하여 혈압을 낮춘다.'],1,'지표성분 Leu-Lys-Pro-Asn-Met 펩티드가 ACE 활성을 저해 → 안지오텐신Ⅱ 생성↓.'],
[7,'자유라디칼(free radical)에 대한 설명으로 가장 옳은 것은?',['산소를 포함하는 모든 물질을 의미한다.','항상 인체에 해로운 작용만 한다.','하나 이상의 홀전자를 가진 화학종이다.','모두 들뜬 상태의 분자이다.','과산화수소는 대표적인 자유라디칼이다.'],2,'자유라디칼 = 홀전자 1개 이상, 불안정·반응성 높음. 과산화수소(H₂O₂)는 활성산소종이지만 라디칼은 아님. NO처럼 적정 농도에서 라디칼 소거 기능도 있음.'],
[7,'산화적 스트레스에 대한 설명으로 가장 적절한 것은?',['체내의 모든 활성산소가 제거된 상태이다.','활성산소 생성과 항산화 방어의 균형이 산화 쪽으로 기울어진 상태이다.','항산화효소의 활성이 증가한 상태이다.','미토콘드리아에서 ATP 생성이 중단된 상태이다.','체내 산소 농도가 감소한 상태이다.'],1,'ROS·RNS 생성 증가 또는 항산화 방어 감소로 균형이 깨진 상태 → 지질·단백질·DNA 산화적 손상.'],

[7,'글루타티온(GSH)에 대한 설명으로 가장 옳은 것은?',['대표적인 효소적 항산화제이다.','항산화 작용 후 GSSG로 산화될 수 있다.','미토콘드리아에서만 존재한다.','초과산화물을 H₂O₂로 전환시키는 효소이다.','지용성 비타민의 일종이다.'],1,'GSH는 비효소적 항산화제(시스테인 –SH 이용). 산화된 GSSG는 glutathione reductase로 GSH로 재생.'],
[7,'비타민 C의 항산화 특성으로 가장 적절한 것은?',['대표적인 지용성 항산화제이다.','세포막에서 지질과산화 연쇄반응을 직접 차단하는 것이 주된 기능이다.','대표적인 수용성 항산화제로 전자공여를 통해 산화반응을 억제한다.','SOD의 구성성분으로 작용한다.','과산화수소만 선택적으로 제거한다.'],2,'비타민 C = 수용성, 전자 제공. 산화된 비타민 E 재생 도움. 세포막 지질과산화 차단은 비타민 E(지용성).'],
[7,'DPPH법의 원리에 대한 설명으로 가장 적절한 것은?',['DNA의 가닥 절단 정도를 측정한다.','보라색 DPPH 라디칼의 색 감소를 이용하여 항산화능을 평가한다.','Fe³⁺가 Fe²⁺로 환원되는 정도만을 측정한다.','세포 내 ATP 생성량을 측정한다.','지질의 양을 직접 측정한다.'],1,'DPPH = 보라색 라디칼 소거(탈색). Fe³⁺→Fe²⁺ 환원은 FRAP, DNA 절단은 코멧.'],
[7,'시험관 내 항산화능 평가 결과를 해석하는 방법으로 가장 적절한 것은?',['DPPH 소거능이 높으면 인체에서도 동일한 항산화 효과가 나타난다.','시험관 실험만으로 질병 예방 효과를 확정할 수 있다.','시험관 실험에서는 항산화능을 평가할 수 있지만 실제 인체 효과를 확인하려면 추가적인 연구가 필요하다.','FRAP 수치가 높으면 암 예방 효과가 입증된 것이다.','시험관 실험은 항산화 기능성 평가에 사용할 수 없다.'],2,'시험관 결과는 인체 효과와 다를 수 있다(예: TEAC의 ABTS·⁺는 체내에 없어 인체 연관성 낮음) → 세포·동물·인체적용시험 필요.']

[3,'공액리놀레산(CLA)에 대한 설명으로 옳지 않은 것은?',['탄소 18개, 이중결합 2개인 불포화지방산이다','생물활성 이성질체는 c9,t11-CLA와 t10,c12-CLA이다','β-산화를 증가시켜 지방을 분해한다','PPAR-γ 신호전달계에 영향을 준다','영유아와 임산부에게 섭취를 권장한다'],4,'부작용으로 위장장애, 영유아·임산부는 섭취를 삼가야 한다. 일일 1.4~4.2 g.'],
[3,'키토산의 체지방·콜레스테롤 관련 기전으로 옳은 것은?',['담즙산과 결합해 배설을 늘려 콜레스테롤 사용을 늘리고 지방 유화·흡수를 일부 줄인다','ATP-시트르산 리에이스를 억제한다','UCP 발현을 늘린다','렙틴 분비를 촉진한다','GLUT-4 이동을 촉진한다'],0,'장기간 섭취 시 지용성 비타민 부족 가능. 일일 3.0~4.5 g.'],
[3,'그린커피빈 추출물과 그린마테 추출물의 공통 지표성분은?',['EGCG','클로로겐산','판두라틴 A','HCA','프로시아니딘'],1,'둘 다 클로로겐산. 핑거루트 = 판두라틴 A, 가르시니아 = HCA, 녹차 = EGCG.'],
[3,'녹차 추출물을 체지방 감소 원료로 쓸 때 간 독성 때문에 정한 상한은?',['카페인 400 mg/일','EGCG 300 mg/일 이하','HCA 2,800 mg/일','카테킨 1 g/일','녹차 추출물 5 g/일'],1,'일일 녹차 추출물 0.3~1 g, EGCG로서 300 mg 이하.'],
[4,'공복 시 정상 혈당 범위와 정상혈당 진단기준을 바르게 나타낸 것은?',['공복 80~100 mg/dL, 공복혈당 100 mg/dL 미만','공복 120~140 mg/dL, 공복혈당 126 미만','공복 60~80 mg/dL, 공복혈당 90 미만','공복 100~125 mg/dL가 정상','식후 2시간 200 mg/dL 미만이 정상'],0,'정상: 공복 100 미만, 식후 2시간 140 미만. 고위험군: 공복 100~125 mg/dL.'],
[4,'스트레스 시 분비되어 글리코겐 분해와 포도당 신생합성을 증가시키는 호르몬은?',['인슐린','에피네프린','GLP-1','아디포넥틴','소마토스타틴'],1,'에피네프린은 글루카곤과 유사하게 혈당을 올린다. 코티솔·성장호르몬은 인슐린 분비 억제.'],
[4,'경구당부하검사(OGTT)의 약어 뜻과 식후혈당 표시 기준으로 옳은 것은?',['정맥주사 당부하 – 식후 1시간','경구 당부하 – 식후 2시간 혈당','복강내 당부하 – 식후 3시간','경구 당부하 – 식후 30분','정맥주사 당부하 – 공복'],1,'OGTT 결과 중 식후 2시간 혈당으로 식후혈당 표시. IVGTT 정맥, IPGTT 복강.'],
[4,'장 세포와 신장세포에서 포도당 운반을 담당하는 수송체는?',['GLUT-4','SGLT-1','DPP-4','GLUT-2','PTP-1B'],1,'SGLT-1 = sodium glucose transporter-1. GLUT-2는 인슐린 저항성·β-세포 인슐린 분비와 관련.'],
[4,'아디포넥틴에 대한 설명으로 옳은 것은?',['췌장 α-세포에서 분비된다','지방세포에서 분비되어 말초조직의 인슐린 작용을 향상시키고 인슐린 저항성을 저해한다','혈당을 올리는 호르몬이다','GLP-1을 분해하는 효소이다','포도당 흡수를 직접 늘리는 소화효소이다'],1,'간의 당신생·지방 축적 저해, 근육의 혈당 유입·지방 산화 촉진.'],
[4,'유전적으로 렙틴수용체 유전자를 변형시킨 제2형 당뇨 동물모델은?',['ob/ob 마우스','db/db 마우스','스트렙토조토신 유도 모델','OLETF 랫드','자발성 고혈압 흰쥐'],1,'db/db = 렙틴수용체 결핍, ob/ob = 렙틴 결핍. 스트렙토조토신 = β-세포 파괴(제1형).'],
[4,'카이로이노시톨로 전환되어 인슐린 신호전달체계를 촉진하는 개별인정형 원료는?',['타가토스','피니톨','참밀알부민','바나바잎 추출물','난소화성 말토덱스트린'],1,'피니톨: 대두 등 두류의 천연 이노시톨, 일일 1.2 g.'],
[4,'타가토스에 대한 설명으로 옳은 것은?',['혈당지수가 설탕과 같다','젖당을 가수분해해 얻으며 혈당지수는 3이고 GLP-1 자극으로 인슐린 분비를 촉진한다','α-아밀레이스를 저해한다','코로솔산을 함유한다','옥수수 전분을 열·효소 처리해 만든다'],1,'타가토스: 단맛·질감은 설탕과 비슷, 간 글리코겐 합성으로 식후 혈당 상승 억제. 일일 5~7.5 g.'],
[5,'혈소판에 대한 설명으로 옳은 것은?',['혈구의 약 99%를 차지한다','골수 거핵세포의 세포질이 떨어져 나와 만들어지고 지혈에 관여한다','산소를 운반한다','항체를 생성한다','간에서 만들어진다'],1,'혈구의 약 99%는 적혈구(산소 운반). 백혈구 = 면역. 혈소판은 비장·간에서 파괴.'],
[5,'혈관에서 발현되는 산화질소합성효소(NOS)는?',['iNOS','nNOS','eNOS','SOD','ACE'],2,'iNOS 염증, nNOS 뇌, eNOS 혈관.'],
[5,'적혈구 막이 손상되었을 때 밖으로 나와 혈액 응고반응을 일으키는 인지질은?',['스핑고마이엘린','포스파티딜 콜린','포스파티딜 세린','포스파티딜 이노시톨','콜레스테롤'],2,'정상에서 막 내부(PS·PI), 외부(스핑고마이엘린·PC). PS 노출 → 응고 → 모세혈관 막힘. Annexin V로 측정.'],
[5,'혈관 내피세포의 활성화를 나타내는 세포부착분자 지표가 아닌 것은?',['P-셀렉틴','E-셀렉틴','sICAM-1','sVCAM-1','트롬복산 B₂'],4,'TXB₂는 TXA₂의 안정한 대사체로 혈소판 응집 지표.'],
[5,'DHA·EPA 함유 유지에 대한 설명으로 옳은 것은?',['오메가-6 지방산이다','혈중 중성지질 개선·혈행 개선에 도움, 일일 DHA+EPA 0.5~2.0 g','혈액응고를 촉진하므로 수술 전 권장한다','지표성분은 감마리놀렌산이다','혈압을 올린다'],1,'오메가-3. 혈액응고 저해 가능 → 수술 시 섭취 피함.'],
[5,'감마리놀렌산(GLA) 함유 유지의 기전과 지방산 계열로 옳은 것은?',['오메가-3, 트롬복산 생성','오메가-6, 프로스타글란딘 E₁ 생성에 관여','오메가-9, NO 생성','포화지방산, LDL 감소','오메가-3, ACE 억제'],1,'오메가-6, PGE₁ 생성으로 혈관건강 유지, 혈중 콜레스테롤 개선. 일일 240~300 mg.'],
[5,'영지버섯 자실체 추출물의 지표물질은?',['플라보놀 배당체','β-글루칸','프로시아니딘','프로안토시아니딘','L-아르기닌'],1,'β-글루칸, 일일 24~42 mg. 혈행 개선.'],
[5,'eNOS가 기질로 사용해 산화질소를 만드는 조건부 필수 아미노산 원료는?',['L-글루탐산','L-아르기닌','L-시트룰린','L-라이신','L-시스테인'],1,'L-아르기닌 → NO. 천식·심장질환이 있으면 의사와 상의.'],
[6,'고혈압 판단 기준으로 옳은 것은?',['지속적으로 120/80 mmHg 이상','지속적으로 130/85 mmHg 이상','지속적으로 140/90 mmHg 이상','한 번이라도 160/100 mmHg','90/60 mmHg 이하'],2,'지속적으로 140/90 mmHg 이상.'],
[6,'혈압을 낮추는 대표적인 체액성 조절 시스템은?',['레닌-안지오텐신계','칼리크레인-키닌계','교감신경계','알도스테론계','엔도텔린계'],1,'칼리크레인 → 브래디키닌 → 혈관 확장, PGI₂·PGE₂↑ → 혈압↓.'],
[6,'소금 섭취를 권장량으로 줄였을 때 강의자료에 제시된 혈압 감소 폭은?',['수축기 1.1 / 이완기 0.9 mmHg','수축기 5.1 / 이완기 2.7 mmHg','수축기 10 / 이완기 5 mmHg','수축기 20 / 이완기 10 mmHg','변화 없음'],1,'한국인 평균 10 g → 권장 5 g. 체중 1 kg 감량은 1.1/0.9 mmHg 감소.'],
[6,'심실벽이 고혈압으로 스트레스를 받을 때 proBNP가 절단되어 생기는 지표는?',['hs-CRP','BNP와 NT-proBNP','알부민/크레아티닌비','사구체여과율','레닌'],1,'BNP·NT-proBNP는 심실벽 스트레스 지표. 알부민/크레아티닌비는 신장(사구체) 손상 지표.'],
[6,'고혈압 치료제 약리평가에 가장 널리 쓰이며 수술 없이 자연적으로 고혈압이 생기는 동물모델은?',['신혈관성 고혈압모델','자발성 고혈압 흰쥐','DOCA-염 유도모델','안지오텐신Ⅱ 유도모델','db/db 마우스'],1,'자발성 고혈압 흰쥐(SHR). 신혈관성 모델은 RAAS 작용 물질 평가에 활용.'],
[6,'올리브잎 추출물의 지표성분과 일일섭취량으로 옳은 것은?',['GABA, 20 mg','Oleuropein, 0.5~1 g','Leu-Lys-Pro-Asn-Met, 0.34 %','β-글루칸, 24~42 mg','코로솔산, 0.45~1.3 mg'],1,'올리브잎(EFLA 943), oleuropein 18~26 % 표준화. 정확한 기전은 아직 밝혀지지 않음.'],
[6,'복합물 나토균 배양분말의 표준화 기준은?',['GABA 함량','피브린 용해효소 활성 14,000~22,000 U/g','SOD 활성 0.81 IU/mg','oleuropein 18~26 %','HCA 60 %'],1,'혈소판 응집 억제·피브린 용해로 혈압 강하. 일일 100 mg.'],
[7,'다음 중 활성 질소종(RNS)에 해당하는 것은?',['초과산화물(O₂•⁻)','하이드록실 라디칼(•OH)','퍼옥시나이트라이트(ONOO⁻)','과산화수소(H₂O₂)','퍼옥시 라디칼(ROO•)'],2,'RNS: NO•, NO₂•, ONOO⁻, NO⁻. ONOO⁻는 NO와 초과산화물이 반응해 생기며 세포독성이 높다.'],
[7,'생체분자와 반응성이 가장 강해 다른 ROS보다 더 큰 피해를 주며, H₂O₂와 Fe²⁺·Cu⁺ 반응으로 생기는 것은?',['초과산화물','하이드록실 라디칼(•OH)','산화질소','과산화수소','일중항산소'],1,'H₂O₂ + Fe²⁺/Cu⁺ → •OH + OH⁻. 초과산화물은 반응성이 높지 않고 막을 투과하지 못함.'],
[7,'세포막을 보호하는 대표적인 지용성 항산화제로, 지질 퍼옥시라디칼을 소거하는 것은?',['비타민 C','비타민 E','글루타티온','셀레늄','카탈라아제'],1,'비타민 E(α-토코페롤 활성 최고). 산화된 비타민 E는 비타민 C 등에 의해 재생.'],
[7,'글루타티온 과산화효소(GPx)의 구성 성분인 무기질은?',['구리','망간','셀레늄','아연','철'],2,'셀레늄 = GPx 구성, 구리 = Cu/Zn-SOD, 망간 = Mn-SOD.'],
[7,'ABTS·⁺ 청록색의 탈색 정도로 측정하며, ABTS·⁺가 체내에 없어 인체 연관성이 낮은 방법은?',['ORAC','FRAP','TEAC','TRAP','코멧'],2,'TEAC. ORAC은 친수·소수성 모두 가능하고 임상과 상관성 높음.'],
[7,'산화적 DNA 손상의 지표로 소변에서 측정하는 물질은?',['말론디알데하이드(MDA)','8-하이드록시데옥시구아노신','GSH/GSSG','공액다이엔','8-iso-PGF2α'],1,'DNA 손상: 림프구 코멧, 소변 8-OHdG. MDA·공액다이엔·8-iso-PGF2α는 지질과산화물 지표.'],
[7,'포도종자 추출물의 핵심 성분과 항산화능 비교로 옳은 것은?',['라이코펜 – 비타민 C의 2배','프로안토시아니딘 – 비타민 C의 약 20배, 비타민 E의 약 50배','EGCG – 비타민 E와 동일','β-카로틴 – 비타민 A 전구체','스콸렌 – 탄소 30개'],1,'포도종자 추출물(개별인정형). 토마토 추출물은 라이코펜(과량 시 피부 오렌지색).'],
];

// 수분흡수율 계산 문제 생성기 (풀 때마다 숫자가 바뀜)
function genAbsorb(){
  const W0=R([50,80,100,120,150,200]),r=R([18,20,22,24,25,26,28,30,32,35]),A=W0+W0*r/100;
  const grain=R(['멥쌀','찹쌀','현미','보리']),t=R(['30분','1시간','2시간']);
  if(!Number.isInteger(A))return genAbsorb();
  const o=[...new Set([r,Math.round(A/W0*100),Math.round((A-W0)/A*1000)/10,r+10].map(String))];
  while(o.length<4)o.push(String(r+5*o.length));
  const oo=shuf(o.slice(0,4)).map(x=>x+'%');
  return {k:'m',typ:'mc',w:5,q:`${grain} ${W0} g을 물에 ${t} 침지한 뒤 물기를 빼고 무게를 재니 ${A} g이었다. 수분흡수율은?`,c:'',o:oo,a:oo.indexOf(r+'%'),e:`수분흡수율(%) = (침지 후 − 침지 전) ÷ 침지 전 × 100 = (${A} − ${W0}) ÷ ${W0} × 100 = ${r}%. 침지 후 무게로 나누거나(${Math.round((A-W0)/A*1000)/10}%) 침지 후 무게 비율(${Math.round(A/W0*100)}%)을 답하지 않게 주의.`,gen:1};
}

  return {ox,sa,es,mc};
}
function makeSJ(){
  const I=sjItems(),pick=(arr,f,n)=>shuf(arr.filter(f)).slice(0,n);
  if(mode==='sth'){SJSET=[];return}
  if(mode==='s100'){ // 시험 비율(9:11:2:13)로 100문제
    const ox=[...pick(I.ox,q=>q.w===1,3),...pick(I.ox,q=>q.w===4,8),...pick(I.ox,q=>q.w===5,9),...pick(I.ox,q=>q.w===2,6)];
    const sa=pick(I.sa,()=>true,33),es=I.es.slice(0,2);
    const mc=[genAbsorb(),genAbsorb(),...pick(I.mc,()=>true,37)];
    SJSET=[...shuf(ox),...shuf(sa),...es,...shuf(mc)];
  } else if(mode==='smock'){
    const ox=[...pick(I.ox,q=>q.w===1,1),...pick(I.ox,q=>q.w===4,3),...pick(I.ox,q=>q.w===5,3),...pick(I.ox,q=>q.w===2,2)];
    const g=pick(I.sa,q=>q.w===6&&/글루텐|글리아딘/.test(q.q+q.a),1),p=pick(I.sa,q=>q.w===7,1);
    const sa=[...g,...p,...pick(I.sa,q=>!g.includes(q)&&!p.includes(q),9)];
    const es=I.es.slice(0,2);
    const mc=[genAbsorb(),...pick(I.mc,(q,i)=>!/128 g/.test(q.q),12)];
    SJSET=[...shuf(ox),...shuf(sa),...es,...shuf(mc)];
  } else {
    const key={sox:'ox',ssa:'sa',ses:'es',smc:'mc'}[mode];
    SJSET=shuf(I[key]);if(mode==='smc')SJSET.unshift(genAbsorb());
  }
  SJSET.forEach((q,i)=>q.id='j'+setNo+'-'+i);
}
function pool(){
  if(SUBJ==='sj'){
    if(mode==='note')return NOTE.filter(n=>n.subj==='sj').map((q,i)=>(q.id='nj'+i,q));
    return SJSET;
  }
  if(SUBJ==='dt'){
    if(mode==='note')return NOTE.filter(n=>n.subj==='dt').map((q,i)=>(q.id='nd'+i,q));
    return DTSET;
  }
  if(SUBJ==='ff'){
    if(mode==='note')return NOTE.filter(n=>n.subj==='ff').map((q,i)=>(q.id='nf'+i,q));
    return FFSET.filter(q=>mode==='fmix'||(mode==='fx'?q.t==='x':q.t==='y'));
  }
  if(mode==='bank')return BANK;
  if(mode==='lec')return LEC;
  if(mode==='note')return NOTE.filter(n=>(n.subj||'cn')==='cn').map((q,i)=>(q.id='n'+i,q));
  return SET;
}

  const cnt={_:0};let last='';
  shown.forEach(q=>{
    if(ff){
      if(SUBJ==='sj'&&(mode==='smock'||mode==='s100')&&q.typ!==last&&!shuffled){last=q.typ;const h=document.createElement('h2');h.className='topic';
        h.innerHTML=(mode==='smock'?{ox:'Ⅰ. OX 문제<small>9문제 · 첫단원 1 · 관능검사 3 · 곡류 3 · 계량 2</small>',sa:'Ⅱ. 단답형<small>11문제 · 밀가루(글루텐)·팽창제 포함</small>',es:'Ⅲ. 주관식<small>2문제 · 호화·노화 영향 요인</small>',mc:'Ⅳ. 객관식<small>13문제 · 수분흡수율 계산 포함</small>'}:{ox:'Ⅰ. OX 문제<small>26문제</small>',sa:'Ⅱ. 단답형<small>33문제</small>',es:'Ⅲ. 주관식<small>2문제 · 호화·노화 영향 요인</small>',mc:'Ⅳ. 객관식<small>39문제 · 수분흡수율 계산 2 포함</small>'})[q.typ];list.appendChild(h)}
      q.no=String(++cnt._);list.appendChild(q.k==='m'?cardM(q):cardS(q));return}
    const sec=shuffled?'':(mode==='lec'?q.grp:q.w+q.k);
    if(sec&&sec!==last){last=sec;const h=document.createElement('h2');h.className='topic';
      h.innerHTML=mode==='lec'?`${q.grp.split(' · ')[0]}<small>${q.grp.split(' · ').slice(1).join(' · ')}</small>`:`${q.w}주차 ${q.k==='m'?'객관식':'주관식'}<small>${W[q.w]}</small>`;list.appendChild(h)}
    const ck=mode==='lec'?q.grp:q.w+q.k;cnt[ck]=(cnt[ck]||0)+1;q.no=mode==='lec'?String(cnt[ck]):(q.k==='m'?'':'주관 ')+q.w+'-'+cnt[ck];
    list.appendChild(q.k==='m'?cardM(q):cardS(q));
  });
}
function head(q){const tag=q.t?`<span class="aitag">${q.t==='x'?'기출':'예상'} · ${FW[q.w]||''}</span>`:q.dt?`<span class="aitag">${DTW[q.w]||''}</span>`:q.typ?`<span class="aitag">${{ox:'OX',sa:'단답형',es:'서술형',mc:'객관식'}[q.typ]} · ${SW[q.w]||''}</span>`:'';return `<div class="qhead"><span class="num${q.k==='s'?' sub-num':''}">${q.no}</span><div class="stem">${esc(q.q)}${q.c?`<span class="case">${esc(q.c)}</span>`:''}${q.ai?'<span class="aitag">AI 생성</span>':''}${tag}</div></div>`}
function noteBtn(el,q){if(mode!=='note')return;const b=document.createElement('button');b.className='btn ghost';b.textContent='오답노트에서 빼기';b.onclick=()=>{dropNote(q);render()};const r=document.createElement('div');r.className='srow';r.appendChild(b);el.appendChild(r)}
function cardM(q){
  const a=stateOf(q),has=a!==undefined,el=document.createElement('article');
  el.className='q'+(has?(a===q.a?' done-ok':' done-bad'):'');el.innerHTML=head(q);
  const ul=document.createElement('ul');ul.className='opts'+(q.ox?' oxrow':'');
  q.o.forEach((o,i)=>{const li=document.createElement('li'),b=document.createElement('button');b.className='opt';
    b.innerHTML=q.ox?`<span class="oxv">${o}</span>`:`<span class="mk">${MK[i]}</span><span>${esc(o)}</span>`;if(q.ox)b.classList.add('oxb');
    if(has){b.disabled=true;if(i===q.a)b.classList.add('right');else if(i===a)b.classList.add('wrong')}
    b.onclick=()=>{setState(q,i);render()};li.appendChild(b);ul.appendChild(li)});
  el.appendChild(ul);
  if(has){const d=document.createElement('div');d.className='exp';
    d.innerHTML=`<b class="${a===q.a?'okt':'badt'}">${a===q.a?'정답':'오답'} · 정답 ${q.ox?q.o[q.a]:MK[q.a]}</b> ${esc(q.e||'')}`;el.appendChild(d)}
  noteBtn(el,q);return el;
}
function cardS(q){
  const v=stateOf(q),el=document.createElement('article');
  el.className='q'+(v&&v.ok!==undefined?(v.ok?' done-ok':' done-bad'):'');el.innerHTML=head(q);
  const essay=!q.keys;
  const tag=document.createElement('p');tag.className='kind';tag.textContent=essay?'서술형 · 쓰고 나서 모범답안과 비교해 스스로 채점':'단답형 · 핵심어가 들어가면 자동 정답';el.appendChild(tag);
  const ta=document.createElement(essay?'textarea':'input');ta.className='ans';ta.id='a-'+q.id;
  if(!essay)ta.type='text';ta.placeholder=essay?'답을 써보세요':'정답 입력';ta.value=v?v.t||'':'';
  ta.oninput=()=>{const cur=stateOf(q)||{};cur.t=ta.value;if(persist()){bankSt[q.id]=cur;ls.set('cn-quiz-v2',bankSt)}else st[q.id]=cur};
  if(!essay)ta.onkeydown=e=>{if(e.key==='Enter')chk.click()};
  el.appendChild(ta);
  const row=document.createElement('div');row.className='srow';
  const chk=document.createElement('button');chk.className='btn';chk.textContent=essay?'모범답안 보기':'채점하기';
  chk.onclick=()=>{const t=ta.value;const o={t,shown:true};if(!essay)o.ok=autoCheck(q,t);setState(q,o);render()};
  row.appendChild(chk);el.appendChild(row);
  if(v&&v.shown){
    const d=document.createElement('div');d.className='exp';
    const verdict=v.ok===undefined?'<b>모범답안</b>':`<b class="${v.ok?'okt':'badt'}">${v.ok?'정답':'오답'}</b>`;
    d.innerHTML=`${verdict} ${esc(q.a)}`;el.appendChild(d);
    const r2=document.createElement('div');r2.className='srow';
    const mk=(l,val)=>{const b=document.createElement('button');b.className='btn'+(v.ok===val?' on':'');b.textContent=l;b.onclick=()=>{setState(q,Object.assign({},stateOf(q),{ok:val}));render()};return b};
    r2.appendChild(Object.assign(document.createElement('span'),{className:'hint',textContent:essay?'내 채점:':'채점 고치기:'}));
    r2.appendChild(mk('맞았어',true));r2.appendChild(mk('틀렸어',false));el.appendChild(r2);
  }
  noteBtn(el,q);return el;
}

let sampleFn=null;
const TOPIC={2:'건강신념모델(HBM 6요소: 인지된 민감성·심각성·이익·장애, 행동수정 실행의 계기, 자아효능감)과 합리적·계획적 행동이론(TRA·TPB: 행동에 대한 태도, 주관적 규범, 인지된 행동통제력, 행동의도; 태도=행동신념+결과평가, 주관적 규범=규범적 신념+순응동기)',

4:'지역사회 요구진단(자료 수집→문제 찾기→영양문제 판단→우선순위 결정→대상자 선정), 발생률(새 환자÷위험 인구, 기존 환자 제외)·유병률(현재 환자÷전체 인구) 계산, PRECEDE-PROCEED 4진단(사회적·역학적·교육생태학적·행정정책적)',
5:'영양사업 목적(goal)과 목표: 결과목표(건강·영양상태 변화), 효과목표(지식·태도·행동 변화), 과정목표(사업 수행 활동), 구조목표(인력·예산·시설 확보), 좋은 목표의 조건(구체적·측정 가능·달성 가능·기한, 한 목표에 한 성과)',
6:'영양교육안(교육목표·교육내용·교육방법·매체·평가방법), 목표에 맞는 교육방법(강의·실습(시연)·소그룹 토의·퀴즈·게임·식품모형·사진자료·식사섭취조사), 교육목표 진술(학습자 주어, 관찰 가능한 행동동사), 도입-전개-정리'};

(async()=>{try{if(!window.claude||!claude.use)return;sampleFn=await claude.use('sample');}catch(e){sampleFn=null}render()})();
$('aiBtn').onclick=async()=>{
  if(!sampleFn)return;const w=week==='all'?R([2,3,4,5,6,7]):Number(week);
  const btn=$('aiBtn'),msg=$('aiMsg');btn.disabled=true;msg.textContent=`${w}주차 새 문제 만드는 중… (보통 10~40초)`;
  const prompt=`너는 한국 영양사 국가시험 출제위원이다. 대학 지역사회영양학 ${w}주차 범위로 객관식 문제 5개를 새로 만들어라.
범위: ${TOPIC[w]}
조건: 매번 새로운 인물·상황·식품·질병을 사용한 사례형 문제 위주(최소 3개). 보기는 4개, 정답은 하나만 명확하게. 해설은 한두 문장. 한국어.
랜덤 시드: ${Date.now()}
JSON 배열만 출력: [{"q":"문제","c":"사례 문장(없으면 빈 문자열)","o":["보기1","보기2","보기3","보기4"],"a":정답인덱스0~3,"e":"해설"}]`;
  try{
    const data=await sampleFn.json(prompt,{cache:false,modelTier:'default'});
    const arr=(Array.isArray(data)?data:data.questions||[]).filter(x=>x&&x.q&&Array.isArray(x.o)&&x.o.length>=2&&Number.isInteger(x.a)&&x.a>=0&&x.a<x.o.length);
    if(!arr.length)throw {code:'bad'};
    const add=arr.map((x,i)=>({k:'m',w,q:String(x.q),c:String(x.c||''),o:x.o.map(String),a:x.a,e:String(x.e||''),ai:1,id:'ai'+Date.now()+i}));
    SET=add.concat(SET);msg.textContent=`${w}주차 AI 문제 ${add.length}개를 맨 위에 추가했어요. AI 문제는 가끔 틀릴 수 있으니 해설을 꼭 확인하세요.`;
    if(week!=='all'&&Number(week)!==w){}render();
  }catch(e){msg.textContent=e&&e.code==='not_granted'?'AI 사용이 허용되지 않았어요.':e&&e.code==='rate_limited'?'요청이 많아요. 잠시 후 다시 눌러주세요.':'AI 문제를 만들지 못했어요. 다시 눌러주세요.'}
  finally{btn.disabled=false}
};

(()=>{const bar=document.querySelector('.bar'),hd=document.querySelector('header.top');let last=window.scrollY,off=0;
 const apply=()=>{bar.style.transform=off?`translateY(${-off}px)`:''};
 const onScroll=()=>{const y=window.scrollY,top0=hd.offsetTop+hd.offsetHeight,H=bar.offsetHeight+24;
  if(y<=top0)off=0;else off=Math.min(H,Math.max(0,off+(y-Math.max(last,top0))));
  last=y;apply()};
 window.addEventListener('scroll',onScroll,{passive:true});
 bar.addEventListener('focusin',()=>{off=0;apply()});})();
